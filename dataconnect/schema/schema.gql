# ─── Core event log ───────────────────────────────────────────────────────────
type HeyreachActivity @table {

  # ── What happened ──────────────────────────────────────────────────────────
  eventType:  String!   @index   # CONNECTION_REQUEST_ACCEPTED, MESSAGE_SENT, REPLY_RECEIVED, etc.
  timestamp:  Timestamp! @index

  # ── Who sent it (BDR / LinkedIn account) ───────────────────────────────────
  bdrEmail:          String!   @index
  accountEmail:      String               # may differ from bdrEmail in some webhook paths
  accountName:       String               # BDR display name from HeyReach
  linkedInAccountId: String    @index     # numeric HeyReach sender ID stored as text

  # ── Lead (the prospect) ────────────────────────────────────────────────────
  leadFirstName:   String
  leadLastName:    String
  leadProfileUrl:  String      @index     # LinkedIn URL — primary join key to prospect_contacts
  leadPosition:    String
  leadCompany:     String
  leadEmail:       String
  leadLinkedInId:  String                 # HeyReach internal lead ID

  # ── Campaign ───────────────────────────────────────────────────────────────
  campaignId:   String   @index
  campaignName: String

  # ── Event-specific content ─────────────────────────────────────────────────
  connectionMessage: String               # connect note text
  messageText:       String               # DM / reply body
  inmailBody:        String

  # ── Provenance ─────────────────────────────────────────────────────────────
  source:               String            # 'webhook' | 'manual_log'
  manuallyLogged:       Boolean
  manuallyLoggedBy:     String
  manuallyLoggedAt:     Timestamp
  sourceConnectQueueId: String            # FK back to connect_queue doc (string ID)

  # ── Full webhook payload ────────────────────────────────────────────────────
  # Keep as JSONB so you don't lose anything during migration;
  # promote fields to columns later once query patterns stabilize.
  rawData:   Any
  eventData: Any
}
