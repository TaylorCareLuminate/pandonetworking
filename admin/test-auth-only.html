<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Test - Step 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .subtitle {
      color: #666;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-left: 10px;
    }

    .badge-success {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-checking {
      background: #dbeafe;
      color: #1e40af;
    }

    .info-grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f9fafb;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .info-label {
      font-weight: 600;
      color: #666;
    }

    .info-value {
      color: #333;
      font-family: monospace;
      font-size: 0.95rem;
    }

    .success-box {
      background: #d1fae5;
      border-left: 4px solid #10b981;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .error-box {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .warning-box {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .checkmark {
      color: #10b981;
      font-size: 1.5rem;
      margin-right: 10px;
    }

    .xmark {
      color: #ef4444;
      font-size: 1.5rem;
      margin-right: 10px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ddd;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 15px;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .token-display {
      background: #1f2937;
      color: #f3f4f6;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }

    .next-steps {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .next-steps ol {
      margin-left: 20px;
      margin-top: 10px;
    }

    .next-steps li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="card">
      <h1>🔐 Step 1: Authentication Test</h1>
      <p class="subtitle">Verify your authentication is working before connecting to CLEmail</p>
    </div>

    <!-- Auth Status -->
    <div class="card">
      <h2>
        Authentication Status
        <span id="auth-badge" class="status-badge badge-checking">
          <span class="spinner"></span> Checking...
        </span>
      </h2>

      <div id="auth-result">
        <p>⏳ Checking your authentication status...</p>
      </div>

      <div id="auth-info" style="display: none;">
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">Email:</span>
            <span class="info-value" id="user-email">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Domain:</span>
            <span class="info-value" id="user-domain">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Email Verified:</span>
            <span class="info-value" id="user-verified">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Is Admin:</span>
            <span class="info-value" id="user-admin">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">User ID:</span>
            <span class="info-value" id="user-uid">-</span>
          </div>
        </div>

        <button onclick="getIdToken()">Get ID Token (for testing)</button>
        
        <div id="token-container" style="display: none;">
          <p style="margin-top: 15px; color: #666; font-size: 0.9rem;">
            <strong>Your ID Token:</strong> (This is what gets sent to the backend)
          </p>
          <div class="token-display" id="token-display"></div>
        </div>
      </div>
    </div>

    <!-- Next Steps -->
    <div class="card">
      <div id="next-steps-content">
        <!-- Will be populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Load Firebase Auth -->
  <script src="../js/auth.js"></script>

  <!-- Test Script -->
  <script>
    let userIsAuthenticated = false;
    let userIsAdmin = false;
    let currentUser = null;

    // Wait for auth to initialize
    function checkAuthStatus() {
      console.log('🔍 Checking auth status...');
      
      // Get current auth state
      const authState = window.getCurrentAuthState ? window.getCurrentAuthState() : null;
      
      if (!authState || authState.isChecking) {
        console.log('⏳ Auth still checking, waiting...');
        setTimeout(checkAuthStatus, 500);
        return;
      }

      console.log('✅ Auth check complete:', authState);
      displayAuthStatus(authState);
    }

    function displayAuthStatus(authState) {
      const badge = document.getElementById('auth-badge');
      const resultDiv = document.getElementById('auth-result');
      const infoDiv = document.getElementById('auth-info');
      const nextStepsDiv = document.getElementById('next-steps-content');

      if (authState.isLoggedIn && authState.isVerified) {
        // SUCCESS!
        userIsAuthenticated = true;
        currentUser = authState.user;
        
        const userDomain = authState.user.email.split('@')[1].toLowerCase();
        userIsAdmin = ['healthluminate.com', 'careluminate.com'].includes(userDomain);

        badge.className = 'status-badge badge-success';
        badge.innerHTML = '✅ Authenticated';

        resultDiv.innerHTML = `
          <div class="success-box">
            <div style="display: flex; align-items: center;">
              <span class="checkmark">✓</span>
              <div>
                <strong>Authentication Successful!</strong><br>
                <span style="font-size: 0.95rem;">You are logged in and your email is verified.</span>
              </div>
            </div>
          </div>
        `;

        // Show user details
        infoDiv.style.display = 'block';
        document.getElementById('user-email').textContent = authState.user.email;
        document.getElementById('user-domain').textContent = userDomain;
        document.getElementById('user-verified').textContent = authState.user.emailVerified ? '✅ Yes' : '❌ No';
        document.getElementById('user-admin').textContent = userIsAdmin ? '✅ Yes' : '❌ No';
        document.getElementById('user-uid').textContent = authState.user.uid.substring(0, 30) + '...';

        // Show next steps
        nextStepsDiv.innerHTML = `
          <div class="next-steps">
            <h2>✅ Ready for Next Steps!</h2>
            <p style="margin-top: 10px;">Your authentication is working correctly. Here's what happens next:</p>
            <ol>
              <li><strong>Step 2:</strong> Deploy CLEmail security rules to Firebase Console</li>
              <li><strong>Step 3:</strong> Choose implementation approach (Frontend or Backend)</li>
              <li><strong>Step 4:</strong> Test CLEmail connection with security rules</li>
              <li><strong>Step 5:</strong> Update production pages one by one</li>
            </ol>
            <p style="margin-top: 15px; padding: 15px; background: white; border-radius: 8px;">
              <strong>📋 Your Access Level:</strong><br>
              <span style="margin-top: 5px; display: block;">
                ${userIsAdmin ? 
                  '✅ <strong>Admin Access</strong> - You can read and write to CLEmail' : 
                  '✅ <strong>Verified User</strong> - You can read from CLEmail (writes require admin domain)'}
              </span>
            </p>
          </div>
        `;

      } else if (authState.isLoggedIn && !authState.isVerified) {
        // NOT VERIFIED
        badge.className = 'status-badge badge-error';
        badge.innerHTML = '⚠️ Not Verified';

        resultDiv.innerHTML = `
          <div class="warning-box">
            <div style="display: flex; align-items: center;">
              <span style="font-size: 1.5rem; margin-right: 10px;">⚠️</span>
              <div>
                <strong>Email Not Verified</strong><br>
                <span style="font-size: 0.95rem;">You need to verify your email address to access CLEmail.</span>
              </div>
            </div>
          </div>
        `;

        nextStepsDiv.innerHTML = `
          <div class="warning-box">
            <h2>⚠️ Action Required</h2>
            <p style="margin-top: 10px;">Before you can access CLEmail, you need to:</p>
            <ol style="margin-left: 20px; margin-top: 10px;">
              <li>Check your email inbox for a verification link</li>
              <li>Click the verification link</li>
              <li>Refresh this page</li>
            </ol>
          </div>
        `;

      } else {
        // NOT LOGGED IN
        badge.className = 'status-badge badge-error';
        badge.innerHTML = '❌ Not Logged In';

        resultDiv.innerHTML = `
          <div class="error-box">
            <div style="display: flex; align-items: center;">
              <span class="xmark">✗</span>
              <div>
                <strong>Not Authenticated</strong><br>
                <span style="font-size: 0.95rem;">You need to log in to test CLEmail security.</span>
              </div>
            </div>
          </div>
        `;

        nextStepsDiv.innerHTML = `
          <div class="error-box">
            <h2>🔒 Action Required</h2>
            <p style="margin-top: 10px;">Please <a href="../login.html" style="color: #991b1b; font-weight: 600;">log in</a> to continue with the security tests.</p>
          </div>
        `;
      }
    }

    // Get ID Token for testing
    async function getIdToken() {
      if (!currentUser) {
        alert('User not authenticated');
        return;
      }

      try {
        const token = await currentUser.getIdToken();
        const tokenContainer = document.getElementById('token-container');
        const tokenDisplay = document.getElementById('token-display');
        
        tokenDisplay.textContent = token;
        tokenContainer.style.display = 'block';
        
        console.log('🔑 ID Token:', token);
        
        // Copy to clipboard
        navigator.clipboard.writeText(token).then(() => {
          alert('✅ Token copied to clipboard! You can use this to test API calls.');
        });
        
      } catch (error) {
        console.error('❌ Failed to get token:', error);
        alert('Failed to get token: ' + error.message);
      }
    }

    // Make function global
    window.getIdToken = getIdToken;

    // Listen for auth state changes
    window.hotsheetAuthCheck = function(authState) {
      console.log('🔔 Auth state changed:', authState);
      displayAuthStatus(authState);
    };

    // Start checking after a short delay
    setTimeout(() => {
      checkAuthStatus();
    }, 1000);

    console.log('🎬 Auth test page initialized');
  </script>
</body>
</html>
