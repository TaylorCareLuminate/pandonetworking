<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Forcing Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status-box { 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            padding: 15px; 
            margin: 15px 0; 
            background: #f9f9f9;
        }
        .error { border-color: #f44336; background: #ffebee; }
        .success { border-color: #4CAF50; background: #e8f5e8; }
        .warning { border-color: #ff9800; background: #fff3e0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <h1>🔍 Email Forcing Debug Tool</h1>
    <p>This tool checks both the Railway API and Firebase to identify email forcing status discrepancies.</p>

    <button onclick="checkAllSystems()">🔄 Check All Systems</button>
    <button onclick="forceRefresh()">🔄 Force Refresh Railway Settings</button>

    <div id="railway-status" class="status-box">
        <h3>📡 Railway API Status</h3>
        <p>Checking...</p>
    </div>

    <div id="firebase-status" class="status-box">
        <h3>🔥 CLEmail Firebase Status</h3>
        <p>Checking...</p>
    </div>

    <div id="comparison" class="status-box">
        <h3>🔍 System Comparison</h3>
        <p>Run check first...</p>
    </div>

    <div id="recommendations" class="status-box">
        <h3>💡 Recommendations</h3>
        <p>Run check first...</p>
    </div>

    <!-- Auth and secure CLEmail access -->
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    
    <script type="module">
        // Wait for auth to be ready
        await window.firebaseReady;
        
        const railwayApiUrl = 'https://railwayclemail-production.up.railway.app';
        
        // Use CLEmail wrapper for secure access via Railway backend
        const { doc, getDoc } = window.clemailFirestore;
        const emailFirestore = window.clemailDb;
        
        console.log('🔒 Using CLEmail secure wrapper for data access');

        let railwayData = null;
        let firebaseData = null;

        async function checkRailwayAPI() {
            const statusDiv = document.getElementById('railway-status');
            
            try {
                statusDiv.innerHTML = '<h3>📡 Railway API Status</h3><p>⏳ Checking Railway API...</p>';
                
                const response = await fetch(`${railwayApiUrl}/settings/global`);
                
                if (response.ok) {
                    railwayData = await response.json();
                    statusDiv.className = 'status-box success';
                    statusDiv.innerHTML = `
                        <h3>📡 Railway API Status</h3>
                        <p>✅ <strong>Connected successfully</strong></p>
                        <p><strong>Test Mode Enabled:</strong> ${railwayData.testModeEnabled ? '🔒 YES' : '⚠️ NO'}</p>
                        <p><strong>Test Mode Email:</strong> ${railwayData.testModeEmail || 'Not set'}</p>
                        <p><strong>Last Updated:</strong> ${railwayData.updatedAt || 'Unknown'}</p>
                        <details>
                            <summary>Raw API Response</summary>
                            <pre>${JSON.stringify(railwayData, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                railwayData = null;
                statusDiv.className = 'status-box error';
                statusDiv.innerHTML = `
                    <h3>📡 Railway API Status</h3>
                    <p>❌ <strong>Failed to connect</strong></p>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>URL:</strong> ${railwayApiUrl}/settings/global</p>
                `;
            }
        }

        async function checkFirebase() {
            const statusDiv = document.getElementById('firebase-status');
            
            try {
                statusDiv.innerHTML = '<h3>🔥 CLEmail Firebase Status</h3><p>⏳ Checking Firebase...</p>';
                
                const settingsDoc = await getDoc(doc(emailFirestore, 'emailSettings', 'global'));
                
                if (settingsDoc.exists) {
                    firebaseData = settingsDoc.data();
                    statusDiv.className = 'status-box success';
                    statusDiv.innerHTML = `
                        <h3>🔥 CLEmail Firebase Status</h3>
                        <p>✅ <strong>Connected successfully</strong></p>
                        <p><strong>Test Mode Enabled:</strong> ${firebaseData.testModeEnabled ? '🔒 YES' : '⚠️ NO'}</p>
                        <p><strong>Test Mode Email:</strong> ${firebaseData.testModeEmail || 'Not set'}</p>
                        <p><strong>Email Sending Enabled:</strong> ${firebaseData.emailSendingEnabled ? '✅ YES' : '❌ NO'}</p>
                        <p><strong>Last Updated:</strong> ${firebaseData.updatedAt ? new Date(firebaseData.updatedAt.seconds * 1000).toLocaleString() : 'Unknown'}</p>
                        <details>
                            <summary>Raw Firebase Document</summary>
                            <pre>${JSON.stringify(firebaseData, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    throw new Error('Global settings document does not exist');
                }
            } catch (error) {
                firebaseData = null;
                statusDiv.className = 'status-box error';
                statusDiv.innerHTML = `
                    <h3>🔥 CLEmail Firebase Status</h3>
                    <p>❌ <strong>Failed to connect</strong></p>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Project:</strong> clemail</p>
                    <p><strong>Collection:</strong> emailSettings</p>
                    <p><strong>Document:</strong> global</p>
                `;
            }
        }

        function compareAndRecommend() {
            const comparisonDiv = document.getElementById('comparison');
            const recommendationsDiv = document.getElementById('recommendations');
            
            if (!railwayData || !firebaseData) {
                comparisonDiv.className = 'status-box warning';
                comparisonDiv.innerHTML = `
                    <h3>🔍 System Comparison</h3>
                    <p>⚠️ Unable to compare - one or both systems failed to load</p>
                `;
                
                recommendationsDiv.className = 'status-box warning';
                recommendationsDiv.innerHTML = `
                    <h3>💡 Recommendations</h3>
                    <p>Fix connection issues first, then re-run the check.</p>
                `;
                return;
            }

            const railwayForcing = railwayData.testModeEnabled;
            const firebaseForcing = firebaseData.testModeEnabled;
            const match = railwayForcing === firebaseForcing;

            comparisonDiv.className = match ? 'status-box success' : 'status-box error';
            comparisonDiv.innerHTML = `
                <h3>🔍 System Comparison</h3>
                <p><strong>Systems Match:</strong> ${match ? '✅ YES' : '❌ NO'}</p>
                <table style="width: 100%; border-collapse: collapse; margin: 10px 0;">
                    <tr style="background: #f0f0f0;">
                        <th style="padding: 8px; border: 1px solid #ddd;">System</th>
                        <th style="padding: 8px; border: 1px solid #ddd;">Test Mode Enabled</th>
                        <th style="padding: 8px; border: 1px solid #ddd;">Test Email</th>
                    </tr>
                    <tr>
                        <td style="padding: 8px; border: 1px solid #ddd;"><strong>Railway API</strong><br/>(Controls actual behavior)</td>
                        <td style="padding: 8px; border: 1px solid #ddd;">${railwayForcing ? '🔒 YES' : '⚠️ NO'}</td>
                        <td style="padding: 8px; border: 1px solid #ddd;">${railwayData.testModeEmail || 'Not set'}</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px; border: 1px solid #ddd;"><strong>Firebase</strong><br/>(Controls display)</td>
                        <td style="padding: 8px; border: 1px solid #ddd;">${firebaseForcing ? '🔒 YES' : '⚠️ NO'}</td>
                        <td style="padding: 8px; border: 1px solid #ddd;">${firebaseData.testModeEmail || 'Not set'}</td>
                    </tr>
                </table>
            `;

            // Generate recommendations
            let recommendations = '';
            
            if (!match) {
                recommendations += `
                    <div style="background: #ffebee; padding: 10px; border-radius: 5px; margin: 10px 0;">
                        <strong>🚨 CRITICAL: Systems are out of sync!</strong><br/>
                        The Railway API (which controls actual email behavior) shows forcing as <strong>${railwayForcing ? 'ENABLED' : 'DISABLED'}</strong><br/>
                        But Firebase (which controls the display) shows forcing as <strong>${firebaseForcing ? 'ENABLED' : 'DISABLED'}</strong>
                    </div>
                `;
            }

            if (railwayForcing && !firebaseForcing) {
                recommendations += `
                    <p>✅ <strong>Good news:</strong> Emails ARE being forced to a safe address (${railwayData.testModeEmail}), but the display is wrong.</p>
                    <p>🔧 <strong>Fix:</strong> Update Firebase to match Railway by clicking "Force All Emails to Taylor" in the email controls.</p>
                `;
            } else if (!railwayForcing && firebaseForcing) {
                recommendations += `
                    <p>⚠️ <strong>Warning:</strong> The display shows forcing enabled, but emails are NOT being forced!</p>
                    <p>🔧 <strong>Fix:</strong> Enable forcing on Railway API or disable display in Firebase.</p>
                `;
            } else if (!railwayForcing && !firebaseForcing) {
                recommendations += `
                    <p>🚨 <strong>DANGER:</strong> Email forcing is disabled on both systems - emails go to real recipients!</p>
                    <p>🔧 <strong>Fix:</strong> If this is a development environment, enable forcing immediately.</p>
                `;
            } else {
                recommendations += `
                    <p>✅ <strong>All good:</strong> Both systems show forcing enabled to ${railwayData.testModeEmail}</p>
                `;
            }

            recommendationsDiv.className = match && railwayForcing ? 'status-box success' : 'status-box warning';
            recommendationsDiv.innerHTML = `
                <h3>💡 Recommendations</h3>
                ${recommendations}
                
                <div style="margin-top: 15px;">
                    <strong>Quick Actions:</strong><br/>
                    <button onclick="forceTo('taylordavis@careluminate.com')" style="background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 4px; margin: 5px;">
                        🔒 Force to Taylor
                    </button>
                    <button onclick="disableForcing()" style="background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 4px; margin: 5px;">
                        ⚠️ Disable Forcing
                    </button>
                </div>
            `;
        }

        window.checkAllSystems = async function() {
            await Promise.all([
                checkRailwayAPI(),
                checkFirebase()
            ]);
            compareAndRecommend();
        };

        window.forceRefresh = async function() {
            try {
                const response = await fetch(`${railwayApiUrl}/settings/refresh`, { method: 'POST' });
                if (response.ok) {
                    alert('✅ Railway settings refreshed. Re-checking in 2 seconds...');
                    setTimeout(() => checkAllSystems(), 2000);
                } else {
                    alert('❌ Failed to refresh Railway settings');
                }
            } catch (error) {
                alert('❌ Error refreshing: ' + error.message);
            }
        };

        window.forceTo = async function(email) {
            try {
                const response = await fetch(`${railwayApiUrl}/test-mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable: true, testEmail: email })
                });
                
                if (response.ok) {
                    alert(`✅ Forcing enabled to ${email}. Re-checking...`);
                    setTimeout(() => checkAllSystems(), 1000);
                } else {
                    const error = await response.json();
                    alert('❌ Failed: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.disableForcing = async function() {
            if (!confirm('⚠️ Are you sure? This will allow emails to reach real recipients!')) return;
            
            try {
                const response = await fetch(`${railwayApiUrl}/test-mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable: false })
                });
                
                if (response.ok) {
                    alert(`⚠️ Email forcing disabled. Re-checking...`);
                    setTimeout(() => checkAllSystems(), 1000);
                } else {
                    const error = await response.json();
                    alert('❌ Failed: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        // Auto-run check on page load
        setTimeout(() => checkAllSystems(), 1000);
    </script>
</body>
</html>
