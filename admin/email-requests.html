<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Requests - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .filter-tab {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s;
        }

        .filter-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .filter-tab:hover {
            color: var(--primary);
        }

        .requests-grid {
            display: grid;
            gap: 1.5rem;
        }

        .request-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--primary);
        }

        .request-card.urgent {
            border-left-color: var(--warning);
        }

        .request-card.critical {
            border-left-color: var(--danger);
            background: linear-gradient(135deg, #fef2f2 0%, white 100%);
        }

        .request-card.completed {
            opacity: 0.7;
            border-left-color: var(--success);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .request-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--primary);
            color: white;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .priority-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-badge.standard {
            background: #e5e7eb;
            color: #4b5563;
        }

        .priority-badge.urgent {
            background: #fef3c7;
            color: #92400e;
        }

        .priority-badge.critical {
            background: #fee2e2;
            color: #991b1b;
        }

        .contact-info {
            background: var(--light-gray);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .contact-info h4 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .contact-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--gray);
        }

        .request-details {
            margin-bottom: 1rem;
        }

        .request-details h5 {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .request-details p {
            color: var(--gray);
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .request-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--gray);
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .request-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--gray);
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fas fa-envelope-open-text"></i>
                Email Requests from Phone Calls
            </h1>
            <p>Review and manage custom email requests submitted by your team during phone calls</p>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterRequests('pending')">
                <i class="fas fa-clock"></i> Pending
            </button>
            <button class="filter-tab" onclick="filterRequests('completed')">
                <i class="fas fa-check-circle"></i> Completed
            </button>
            <button class="filter-tab" onclick="filterRequests('all')">
                <i class="fas fa-list"></i> All Requests
            </button>
        </div>

        <div id="loadingState" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Loading email requests...</p>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i>
            <h3>No Email Requests</h3>
            <p>Email requests from phone calls will appear here</p>
        </div>

        <div id="requestsGrid" class="requests-grid" style="display: none;"></div>
    </div>

    <!-- Load centralized auth system -->
    <script src="../js/auth.js"></script>
    <script src="../js/folder-protection.js"></script>
    <!-- CLEmail Secure API Wrapper -->
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script type="module">
        // Wait for auth to be ready
        await window.firebaseReady;
        
        // Use CLEmail wrapper for secure access via Railway backend
        const { collection, getDocs, doc, updateDoc, query, where, orderBy } = window.clemailFirestore;
        
        // Use secure wrapper instead of direct Firebase
        let db = window.clemailDb;
        
        console.log('🔒 Using CLEmail secure wrapper for data access');

        // Global state
        let allRequests = [];
        let currentFilter = 'pending';

        // Initialize the page
        async function initialize() {
            try {
                console.log('🚀 Initializing Email Requests page...');
                
                // Wait for auth to be ready
                if (window.authReady) {
                    await window.authReady;
                }

                await loadEmailRequests();
                
            } catch (error) {
                console.error('❌ Failed to initialize page:', error);
            }
        }

        // Load email requests
        async function loadEmailRequests() {
            try {
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('requestsGrid').style.display = 'none';

                console.log('📧 Loading email requests...');
                
                const q = query(
                    collection(db, 'emailRequests'),
                    orderBy('requestedAt', 'desc')
                );
                
                const snapshot = await getDocs(q);
                allRequests = [];
                
                snapshot.forEach((doc) => {
                    allRequests.push({ id: doc.id, ...doc.data() });
                });

                console.log(`✅ Loaded ${allRequests.length} email requests`);
                
                document.getElementById('loadingState').style.display = 'none';
                
                if (allRequests.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    displayRequests();
                }
                
            } catch (error) {
                console.error('❌ Error loading email requests:', error);
                document.getElementById('loadingState').innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                    <p>Error loading email requests</p>
                `;
            }
        }

        // Filter requests
        window.filterRequests = function(filter) {
            currentFilter = filter;
            
            // Update tab styles
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.filter-tab').classList.add('active');
            
            displayRequests();
        };

        // Display requests
        function displayRequests() {
            const grid = document.getElementById('requestsGrid');
            
            let filteredRequests = allRequests;
            if (currentFilter === 'pending') {
                filteredRequests = allRequests.filter(r => r.status === 'pending');
            } else if (currentFilter === 'completed') {
                filteredRequests = allRequests.filter(r => r.status === 'completed');
            }
            
            if (filteredRequests.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                grid.style.display = 'none';
                return;
            }
            
            document.getElementById('emptyState').style.display = 'none';
            grid.style.display = 'grid';
            
            const requestsHtml = filteredRequests.map(request => {
                const requestDate = new Date(request.requestedAt);
                const formattedDate = requestDate.toLocaleDateString() + ' ' + requestDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const typeLabels = {
                    'case-study': 'Case Study / Success Story',
                    'pricing': 'Pricing Information',
                    'product-demo': 'Product Demo / Features',
                    'technical-specs': 'Technical Specifications',
                    'comparison': 'Comparison with Competitor',
                    'roi-analysis': 'ROI Analysis / Business Case',
                    'followup': 'Follow-up After Meeting',
                    'proposal': 'Proposal / Quote',
                    'custom': 'Custom Request'
                };
                
                return `
                    <div class="request-card ${request.priority} ${request.status}">
                        <div class="request-header">
                            <span class="request-type">${typeLabels[request.requestType] || request.requestType}</span>
                            <span class="priority-badge ${request.priority}">${request.priority}</span>
                        </div>
                        
                        <div class="contact-info">
                            <h4>${request.contactInfo.name}</h4>
                            <div class="contact-details">
                                <div><i class="fas fa-building"></i> ${request.contactInfo.company}</div>
                                <div><i class="fas fa-briefcase"></i> ${request.contactInfo.title}</div>
                                <div><i class="fas fa-envelope"></i> ${request.contactInfo.email || 'No email'}</div>
                                <div><i class="fas fa-phone"></i> ${request.contactInfo.phone}</div>
                            </div>
                        </div>
                        
                        ${request.suggestedSubject ? `
                            <div class="request-details">
                                <h5>Suggested Subject:</h5>
                                <p>${request.suggestedSubject}</p>
                            </div>
                        ` : ''}
                        
                        <div class="request-details">
                            <h5>Details / Instructions:</h5>
                            <p>${request.details}</p>
                        </div>
                        
                        <div class="request-meta">
                            <div>
                                <i class="fas fa-user"></i> Requested by: ${request.requestedBy.name}<br>
                                <i class="fas fa-bullhorn"></i> Campaign: ${request.campaignInfo.campaignName}
                            </div>
                            <div style="text-align: right;">
                                <i class="fas fa-clock"></i> ${formattedDate}
                            </div>
                        </div>
                        
                        ${request.status === 'pending' ? `
                            <div class="request-actions">
                                <button class="btn btn-success" onclick="markCompleted('${request.id}')">
                                    <i class="fas fa-check"></i> Mark as Completed
                                </button>
                                <button class="btn btn-primary" onclick="copyToClipboard('${request.id}')">
                                    <i class="fas fa-copy"></i> Copy Details
                                </button>
                            </div>
                        ` : `
                            <div style="margin-top: 1rem; padding: 0.75rem; background: #dcfce7; border-radius: 6px; color: #166534; font-weight: 600;">
                                <i class="fas fa-check-circle"></i> Email Sent
                            </div>
                        `}
                    </div>
                `;
            }).join('');
            
            grid.innerHTML = requestsHtml;
        }

        // Mark request as completed
        window.markCompleted = async function(requestId) {
            try {
                await updateDoc(doc(db, 'emailRequests', requestId), {
                    status: 'completed',
                    completedAt: new Date().toISOString(),
                    completedBy: window.auth?.currentUser?.email || 'unknown'
                });
                
                // Update local data
                const request = allRequests.find(r => r.id === requestId);
                if (request) {
                    request.status = 'completed';
                }
                
                displayRequests();
                
            } catch (error) {
                console.error('❌ Error marking request as completed:', error);
                alert('Error updating request status');
            }
        };

        // Copy request details to clipboard
        window.copyToClipboard = function(requestId) {
            const request = allRequests.find(r => r.id === requestId);
            if (!request) return;
            
            const text = `
EMAIL REQUEST

Type: ${request.requestType}
Priority: ${request.priority}

CONTACT INFORMATION:
Name: ${request.contactInfo.name}
Company: ${request.contactInfo.company}
Title: ${request.contactInfo.title}
Email: ${request.contactInfo.email || 'Not provided'}
Phone: ${request.contactInfo.phone}

${request.suggestedSubject ? `SUGGESTED SUBJECT:\n${request.suggestedSubject}\n\n` : ''}
DETAILS:
${request.details}

Campaign: ${request.campaignInfo.campaignName}
Requested by: ${request.requestedBy.name}
Requested at: ${new Date(request.requestedAt).toLocaleString()}
            `.trim();
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target.closest('.btn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                }, 2000);
            });
        };

        // Initialize when page loads
        if (typeof window.firebaseReady !== 'undefined') {
            window.firebaseReady.then(async () => {
                console.log('🔥 Firebase ready, protecting admin folder...');
                
                const hasAccess = await window.protectFolder('admin', { 
                    allowAdmins: true,
                    redirectOnFail: '../login.html'
                });
                
                if (hasAccess !== false) {
                    console.log('✅ Access granted to admin folder, initializing email requests...');
                    await initialize();
                }
            }).catch(error => {
                console.error('❌ Firebase initialization error:', error);
                console.log('⚠️ Falling back to direct initialization...');
                initialize();
            });
        } else {
            console.log('⚠️ Centralized auth system not available, initializing directly...');
            initialize();
        }
    </script>
</body>
</html>
