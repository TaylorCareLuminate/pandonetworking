<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firestore Data Test - HealthLuminate Admin</title>
  
  <!-- IMMEDIATE AUTHENTICATION PROTECTION -->
  <script>
    // Hide all content immediately and check for authentication
    document.documentElement.style.display = 'none';
    console.log('🔍 Admin test page loaded, checking authentication...');
  </script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .success { color: green; }
    .error { color: red; }
    .info { color: blue; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
  <h1>Firestore Data Test</h1>
  
  <div class="section">
    <h2>Authentication Status</h2>
    <div id="auth-status">Checking...</div>
  </div>
  
  <div class="section">
    <h2>Actions</h2>
    <button onclick="checkUsers()">Check Users Collection</button>
    <button onclick="checkFolderPermissions()">Check Folder Permissions</button>
    <button onclick="checkAllCollections()">Check All Collections</button>
  </div>
  
  <div class="section">
    <h2>Results</h2>
    <div id="results"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, getDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBpsxZCSULnandhpdVLI9nvsxd3_BH4dfs",
      authDomain: "healthcareitdatabase.firebaseapp.com",
      databaseURL: "https://healthcareitdatabase-default-rtdb.firebaseio.com",
      projectId: "healthcareitdatabase",
      storageBucket: "healthcareitdatabase.firebasestorage.app",
      messagingSenderId: "1024935247661",  
      appId: "1:1024935247661:web:a74be5c7b9df74245bdda4",
      measurementId: "G-60KWQ8SJW4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;

    // ADMIN FOLDER: Only HealthLuminate domains allowed
    const ALLOWED_DOMAINS = ['healthluminate.com', 'careluminate.com'];

    function getDomainFromEmail(email) {
      return email.split('@')[1].toLowerCase();
    }

    function hasAdminAccess(user) {
      const domain = getDomainFromEmail(user.email);
      return ALLOWED_DOMAINS.includes(domain);
    }

    function log(message, type = 'info') {
      const results = document.getElementById('results');
      const entry = document.createElement('div');
      entry.className = type;
      entry.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
      results.appendChild(entry);
    }

    // Admin authentication with domain protection
    onAuthStateChanged(auth, (user) => {
      // Show the page now that auth has been checked
      document.documentElement.style.display = 'block';
      
      console.log('🔍 Firebase Auth State Changed:', user ? user.email : 'No user');
      
      const authStatus = document.getElementById('auth-status');
      
      if (!user) {
        console.log('🚫 No user authenticated, redirecting to login');
        authStatus.innerHTML = '<div class="error">Not authenticated - redirecting to login...</div>';
        setTimeout(() => {
          window.location.href = '../login.html';
        }, 3000);
        return;
      }
      
      console.log('✅ User authenticated:', user.email);
      console.log('🔍 Email verified:', user.emailVerified);
      console.log('🔍 User domain:', getDomainFromEmail(user.email));
      console.log('🔍 Allowed domains:', ALLOWED_DOMAINS);
      
      if (!user.emailVerified) {
        console.log('🚫 User email not verified, redirecting to login');
        authStatus.innerHTML = '<div class="error">Email not verified - redirecting to login...</div>';
        setTimeout(() => {
          alert(`Your email ${user.email} is not verified. Please verify your email and try again.`);
          window.location.href = '../login.html';
        }, 3000);
        return;
      }
      
      const userDomain = getDomainFromEmail(user.email);
      const hasAccess = hasAdminAccess(user);
      
      console.log('🔍 Checking admin access for domain:', userDomain);
      console.log('🔍 Has admin access:', hasAccess);
      
      if (!hasAccess) {
        console.log('🚫 User does not have admin access:', user.email);
        document.body.innerHTML = `
          <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; background: #fafafa;">
            <div style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 500px;">
              <h2 style="color: #dc3545; margin-bottom: 1rem;">
                <i class="fas fa-shield-alt"></i> Admin Access Required
              </h2>
              <p style="margin-bottom: 1rem;">This admin area is restricted to HealthLuminate team members only.</p>
              <p style="color: #666; margin-bottom: 1rem;">Your email: <strong>${user.email}</strong></p>
              <p style="color: #666; margin-bottom: 1rem;">Your domain: <strong>${getDomainFromEmail(user.email)}</strong></p>
              <p style="color: #666; margin-bottom: 2rem;">Allowed domains: <strong>${ALLOWED_DOMAINS.join(', ')}</strong></p>
              <button onclick="window.location.href='../dashboard.html'" style="padding: 0.8rem 1.5rem; background: #DBA660; color: white; border: none; border-radius: 25px; cursor: pointer; margin-right: 1rem;">Dashboard</button>
              <button onclick="window.location.href='../'" style="padding: 0.8rem 1.5rem; background: #44A1C4; color: white; border: none; border-radius: 25px; cursor: pointer;">Home</button>
            </div>
          </div>
        `;
        return;
      }
      
      // Admin has access - show the page
      console.log('✅ Admin access granted to:', user.email);
      currentUser = user;
      
      authStatus.innerHTML = `
        <div class="success">
          <strong>Authenticated as:</strong> ${user.email}<br>
          <strong>UID:</strong> ${user.uid}<br>
          <strong>Email Verified:</strong> ${user.emailVerified}<br>
          <strong>Domain:</strong> ${getDomainFromEmail(user.email)}<br>
          <strong>Admin Access:</strong> Granted
        </div>
      `;
      
      log(`Admin access granted to ${user.email} (${getDomainFromEmail(user.email)})`, 'success');
    });

    // Check users collection
    window.checkUsers = async function() {
      log('Checking users collection...', 'info');
      try {
        const usersCollection = collection(db, 'users');
        const snapshot = await getDocs(usersCollection);
        
        log(`Found ${snapshot.size} users in collection`, 'success');
        
        const users = [];
        snapshot.forEach((doc) => {
          users.push({
            id: doc.id,
            ...doc.data()
          });
        });
        
        log(`<pre>${JSON.stringify(users, null, 2)}</pre>`, 'info');
      } catch (error) {
        log(`Error: ${error.message}`, 'error');
        log(`<pre>${JSON.stringify(error, null, 2)}</pre>`, 'error');
      }
    };

    // Check folder permissions
    window.checkFolderPermissions = async function() {
      log('Checking folderPermissions collection...', 'info');
      try {
        const permissionsCollection = collection(db, 'folderPermissions');
        const snapshot = await getDocs(permissionsCollection);
        
        log(`Found ${snapshot.size} folder permissions`, 'success');
        
        const permissions = {};
        snapshot.forEach((doc) => {
          permissions[doc.id] = doc.data();
        });
        
        log(`<pre>${JSON.stringify(permissions, null, 2)}</pre>`, 'info');
      } catch (error) {
        log(`Error: ${error.message}`, 'error');
        log(`<pre>${JSON.stringify(error, null, 2)}</pre>`, 'error');
      }
    };

    // Check all collections (list common ones)
    window.checkAllCollections = async function() {
      log('Checking common collections...', 'info');
      
      const collections = ['users', 'folderPermissions', 'adminImpersonations'];
      
      for (const collName of collections) {
        try {
          const coll = collection(db, collName);
          const snapshot = await getDocs(coll);
          log(`Collection '${collName}': ${snapshot.size} documents`, 'success');
        } catch (error) {
          log(`Collection '${collName}': Error - ${error.message}`, 'error');
        }
      }
    };
  </script>
</body>
</html>
