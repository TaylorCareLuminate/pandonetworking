<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPC Care • Simulation Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/main.css" />

  <style>
    :root {
      --dark-blue: #0B2E4E;
      --info-blue: #2563eb;
      --success-green: #22c55e;
      --warning-orange: #f59e0b;
      --danger-red: #ef4444;
      --gray: #6b7280;
      --light-gray: #f3f4f6;
      --border-gray: #e5e7eb;
    }
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #fafafa; color: #0f172a; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.25rem; }
    .page-header { text-align: center; padding: 1rem 0 0.5rem; }
    .page-title { margin: 0; font-weight: 800; color: var(--dark-blue); letter-spacing: -0.02em; }
    .page-subtitle { margin: 0.25rem 0 0; color: var(--gray); }
    .card { background: white; border: 1px solid var(--border-gray); border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,0.06); }
    .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-gray); display:flex; align-items:center; justify-content:space-between; gap: 0.75rem; }
    .card-title { font-weight: 700; color: var(--dark-blue); margin: 0; display:flex; align-items:center; gap:0.5rem; }
    .card-body { padding: 1.25rem; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .form-group { display:flex; flex-direction:column; gap:0.5rem; margin-bottom: 0.9rem; }
    .form-label { font-weight: 600; color: var(--dark-blue); }
    .form-input, .form-select, .form-textarea { padding: 0.6rem 0.75rem; border: 1px solid var(--border-gray); border-radius: 8px; background: white; font-size: 0.95rem; }
    .inline { display:flex; gap:0.75rem; align-items:center; }
    .btn { border: none; border-radius: 8px; padding: 0.6rem 0.8rem; cursor:pointer; background:#111827; color:white; font-weight:600; display:inline-flex; gap:0.5rem; align-items:center; }
    .btn-small { padding: 0.45rem 0.65rem; font-size: 0.9rem; }
    .btn-success { background: var(--success-green); }
    .btn-danger { background: var(--danger-red); }
    .btn-outline { background: white; border: 1px solid var(--border-gray); color: #111827; }
    .muted { color: var(--gray); }
    .pill { background: var(--light-gray); color: #111827; border: 1px solid var(--border-gray); padding: 0.25rem 0.5rem; border-radius: 100px; font-size: 0.8rem; }
    .list { display:flex; flex-direction:column; gap:0.5rem; max-height: 260px; overflow:auto; border: 1px dashed var(--border-gray); border-radius: 8px; padding: 0.5rem; }
    .list-item { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; border:1px solid var(--border-gray); border-radius:8px; padding:0.5rem 0.6rem; }
    .badge { border-radius: 999px; padding: 0.15rem 0.5rem; font-weight:700; font-size: 0.75rem; }
    .badge-success { background: #DCFCE7; color: #166534; }
    .badge-warning { background: #FEF3C7; color: #92400E; }
    .badge-info { background: #DBEAFE; color: #1E40AF; }
    .status { display:flex; align-items:center; gap: 0.5rem; }
    .toolbar { display:flex; flex-wrap: wrap; gap:0.5rem; align-items:center; }
    .code-log { background: #0b1220; color: #d1e9ff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; border-radius: 8px; padding: 0.75rem; min-height: 120px; max-height: 320px; overflow: auto; }
    .divider { height:1px; background: var(--border-gray); margin: 0.75rem 0; }
    .callout { background: #F0F9FF; border:1px solid #BAE6FD; color:#0C4A6E; padding:0.75rem; border-radius:8px; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <script>
    // Ensure header loads and navigation works consistently across pages
    fetch('header.html')
      .then(r => r.text())
      .then(html => { document.getElementById('header-placeholder').innerHTML = html; })
      .catch(()=>{});

    // Provide navigateToPage globally for header select
    function navigateToPage(url) {
      if (url && typeof url === 'string') {
        window.location.href = url;
      }
    }
  </script>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Simulation Lab</h1>
      <p class="page-subtitle">Generate realistic test activity: tasks, questionnaires, and responses</p>
    </div>

    <div id="admin-guard" class="callout" style="display:none; margin-bottom: 1rem;">
      <strong><i class="fas fa-lock"></i> Restricted:</strong> This page is available to administrators only.
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-flask"></i> Configure Simulation</div>
        <div class="toolbar">
          <span class="pill" id="auth-user-pill">User: —</span>
          <span class="pill" id="admin-pill" title="Admin status">Admin: —</span>
        </div>
      </div>
      <div class="card-body">
        <div class="grid">
          <div>
            <div class="form-group">
              <label class="form-label">Select users</label>
              <div class="inline">
                <input id="team-filter" class="form-input" placeholder="Search team by name or email" style="flex:1;" />
                <button id="select-all-users" class="btn btn-small btn-outline" type="button"><i class="fas fa-check-double"></i> Select All</button>
                <button id="clear-users" class="btn btn-small btn-outline" type="button"><i class="fas fa-times"></i> Clear</button>
              </div>
              <div id="team-list" class="list" aria-label="Team Users"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Mode</label>
              <select id="mode" class="form-select">
                <option value="respond_existing">Respond to existing questionnaires</option>
                <option value="progress_only">Update progress/status only</option>
              </select>
            </div>

            <div id="question-target-type-wrapper" class="form-group" style="display:none;"></div>

            <div class="form-group inline">
              <div class="form-group" style="flex:1;">
                <label class="form-label">Tasks per user</label>
                <input id="tasks-per-user" type="number" class="form-input" min="1" value="3" />
              </div>
              <div class="form-group" style="flex:1;">
                <label class="form-label">Complete rate</label>
                <select id="complete-rate" class="form-select">
                  <option value="1.0">100%</option>
                  <option value="0.75">75%</option>
                  <option value="0.5">50%</option>
                  <option value="0.25">25%</option>
                </select>
              </div>
            </div>

            <div class="form-group inline">
              <div class="form-group" style="flex:1;"></div>
              <div class="form-group" style="flex:1;">
                <label class="form-label">Comment rate</label>
                <select id="comment-rate" class="form-select">
                  <option value="0.75">High</option>
                  <option value="0.5">Medium</option>
                  <option value="0.25">Low</option>
                  <option value="0.0">None</option>
                </select>
              </div>
            </div>

            <div class="form-group inline">
              <div class="form-group" style="flex:1;"></div>
              <div class="form-group" style="flex:1;">
                <label class="form-label">Include checklist tasks</label>
                <select id="include-checklists" class="form-select">
                  <option value="no">No</option>
                  <option value="yes">Yes</option>
                </select>
              </div>
            </div>

            <div class="form-group"></div>

            <div class="form-group inline">
              <button id="run-simulation" class="btn btn-success" type="button"><i class="fas fa-play"></i> Run Simulation</button>
              <button id="dry-run" class="btn btn-outline" type="button"><i class="fas fa-vial-circle-check"></i> Dry Run</button>
              <button id="reset-log" class="btn btn-outline" type="button"><i class="fas fa-broom"></i> Clear Log</button>
            </div>
          </div>

          <div>
            <div class="form-group">
              <label class="form-label">Activity log</label>
              <div id="log" class="code-log" aria-live="polite"></div>
            </div>
            <div class="divider"></div>
            <div class="form-group">
              <div class="status">
                <span class="badge badge-info" id="stats-users">0 users</span>
                <span class="badge badge-warning" id="stats-tasks">0 tasks</span>
                <span class="badge badge-success" id="stats-responses">0 responses</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="../js/auth.js"></script>
  <script type="module">
    console.log('🧪 Simulation Lab starting...');
    let database = null;
    let currentUserEmail = null;
    let isAdmin = false;
    let teamMap = {}; // id -> { name, email }
    let tasksMap = {}; // id -> task
    let questionsDb = {}; // id -> question
    let rolesData = {}; // roles db
    let kareData = {}; // KARE data for customers
    let roleColumnMappings = {}; // columnName -> { roleId, roleName, columnType, columnName }
    let nameToEmailMap = {}; // display name -> email

    function log(message) {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${message}<br/>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStat(id, text) { document.getElementById(id).textContent = text; }

    async function waitForFirebase() {
      if (!window.firebaseReady) throw new Error('Firebase not available');
      const { app } = await window.firebaseReady;
      return app;
    }

    async function initializeDatabase() {
      const app = await waitForFirebase();
      const { getDatabase } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      database = getDatabase(app);
      return database;
    }

    async function fetchTeam() {
      const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const teamRef = ref(database, 'ppccare/team');
      const snap = await get(teamRef);
      return snap.exists() ? snap.val() : {};
    }

    async function fetchTasks() {
      const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const tasksRef = ref(database, 'ppccare/tasks');
      const snap = await get(tasksRef);
      return snap.exists() ? snap.val() : {};
    }

    async function fetchQuestions() {
      const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const qRef = ref(database, 'ppccare/questions_db');
      const snap = await get(qRef);
      return snap.exists() ? snap.val() : {};
    }

    async function fetchRolesAndMappings() {
      const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const rolesRef = ref(database, 'ppccare/roles');
      const snap = await get(rolesRef);
      if (!snap.exists()) return {};
      const data = snap.val();
      const mappings = {};
      if (data.client) {
        Object.entries(data.client).forEach(([roleId, role]) => {
          if (role.kareColumnMapping) {
            if (role.kareColumnMapping === 'new_column' && role.newColumnName) {
              mappings[role.newColumnName] = {
                roleId,
                roleName: role.name,
                roleDefinition: role.definition,
                columnType: 'new_column',
                columnName: role.newColumnName
              };
            } else {
              mappings[role.kareColumnMapping] = {
                roleId,
                roleName: role.name,
                roleDefinition: role.definition,
                columnType: 'existing',
                columnName: role.kareColumnMapping
              };
            }
          }
        });
      }
      roleColumnMappings = mappings;
      return data;
    }

    async function fetchKareData() {
      const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const kareRef = ref(database, 'ppc_kare_25');
      const snap = await get(kareRef);
      return snap.exists() ? snap.val() : {};
    }

    function buildNameToEmailMap(team) {
      const map = {};
      Object.values(team||{}).forEach(m => {
        if (m && m.name && m.email) {
          map[(m.name||'').trim()] = (m.email||'').trim();
        }
      });
      nameToEmailMap = map;
    }

    function normalize(str){ return (str||'').toString().trim().toLowerCase(); }

    function taskBelongsToUser(task, user) {
      if (!task || !user) return false;
      const userEmail = (user.email || '').trim();
      const userName = (user.name || '').trim();
      const owner = (task.task_owner || '').trim();
      const consultantName = (task.consultant_name || '').trim();

      // Direct email or name match
      if (normalize(owner) === normalize(userEmail) || normalize(owner) === normalize(userName)) return true;
      if (normalize(consultantName) === normalize(userName) || normalize(consultantName) === normalize(userEmail)) return true;

      // Role-based mapping via KARE customer org
      if (task.customer_name && owner) {
        const customerOrg = Object.values(kareData||{}).find(org => normalize(org.organization_name) === normalize(task.customer_name) || normalize(org.org) === normalize(task.customer_name));
        if (customerOrg) {
          const roleMappingEntry = Object.entries(roleColumnMappings).find(([, mapping]) => normalize(mapping.roleName) === normalize(owner));
          if (roleMappingEntry) {
            const [columnName] = roleMappingEntry;
            const assignedPerson = (customerOrg[columnName] || '').trim();
            if (assignedPerson) {
              if (normalize(assignedPerson) === normalize(userName)) return true;
              const assignedEmail = nameToEmailMap[assignedPerson];
              if (assignedEmail && normalize(assignedEmail) === normalize(userEmail)) return true;
            }
          }
        }
      }
      return false;
    }

    function renderTeamList(rawTeam) {
      const listEl = document.getElementById('team-list');
      const filterText = document.getElementById('team-filter').value.trim().toLowerCase();
      const entries = Object.entries(rawTeam || {});
      listEl.innerHTML = entries
        .filter(([, m]) => {
          const display = `${m.name||''} ${m.email||''}`.toLowerCase();
          return !filterText || display.includes(filterText);
        })
        .map(([id, m]) => {
          const email = m.email || '';
          const name = m.name || email || id;
          return `<div class="list-item">
            <label class="inline" style="gap:0.5rem;">
              <input type="checkbox" class="user-checkbox" value="${email}" data-name="${name}" />
              <span>${name}</span>
              <span class="muted" style="font-size:0.85rem;">${email}</span>
            </label>
          </div>`;
        }).join('');
    }

    function getSelectedUsers() {
      const checkboxes = Array.from(document.querySelectorAll('.user-checkbox'));
      return checkboxes.filter(cb => cb.checked).map(cb => ({ email: cb.value, name: cb.getAttribute('data-name') }));
    }

    function choice(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
    function randomBool(p=0.5) { return Math.random() < p; }
    function randomInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
    function addDays(date, n) { const d=new Date(date); d.setDate(d.getDate()+n); return d; }

    function synthesizeAnswer(question) {
      const t = question.questionType || 'free_response';
      switch (t) {
        case 'status': return choice(['Green','Yellow','Red','Unknown']);
        case 'yes_no': return choice(['Yes','No']);
        case 'number': return String(randomInt(0, 100));
        case 'rating': return String(randomInt(1, 5));
        case 'dropdown': return Array.isArray(question.options) && question.options.length>0 ? choice(question.options) : 'N/A';
        case 'radio': return Array.isArray(question.options) && question.options.length>0 ? choice(question.options) : 'Option A';
        default: return 'Lorem ipsum response';
      }
    }

    async function updateTaskFields(taskId, fields) {
      const { ref, update } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const taskRef = ref(database, `ppccare/tasks/${taskId}`);
      await update(taskRef, fields);
    }

    async function setTask(taskId, taskData) {
      const { ref, set } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const taskRef = ref(database, `ppccare/tasks/${taskId}`);
      await set(taskRef, taskData);
    }

    // Intentionally no task creation in simulator per requirements

    async function writeResponses(taskId, questionIds, commentRate) {
      const { ref, update } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
      const responses = {};
      for (const qid of questionIds) {
        const q = questionsDb[qid] || (tasksMap[taskId]?.task_questions_data?.[qid]) || { questionType: 'free_response' };
        responses[qid] = {
          answer: synthesizeAnswer(q),
          comment: randomBool(parseFloat(commentRate)) ? 'Auto-generated comment.' : '',
          timestamp: new Date().toISOString()
        };
      }
      const respRef = ref(database, `ppccare/tasks/${taskId}/task_question_responses`);
      await update(respRef, responses);
      return responses;
    }

    async function simulateRespondExisting(selectedUsers, completeRate, includeChecklists) {
      let responsesCount = 0, affectedTasks = 0;
      for (const user of selectedUsers) {
        const candidates = Object.entries(tasksMap)
          .filter(([,t]) => taskBelongsToUser(t, user))
          .filter(([,t]) => Array.isArray(t.task_questions) && t.task_questions.length>0)
          .filter(([,t]) => includeChecklists==='yes' ? true : !(t.task_desc||'').includes('Checklist items:'));
        for (const [taskId, task] of candidates) {
          const shouldComplete = randomBool(parseFloat(completeRate));
          const qids = task.task_questions || [];
          if (qids.length===0) continue;
          await writeResponses(taskId, qids, document.getElementById('comment-rate').value);
          responsesCount += qids.length;
          if (shouldComplete) {
            await updateTaskFields(taskId, { task_status: 'Complete', task_completion_percent: 100 });
          } else {
            const pct = Math.max(5, randomInt(10, 90));
            await updateTaskFields(taskId, { task_status: 'In Progress', task_completion_percent: pct });
          }
          affectedTasks += 1;
        }
      }
      return { affectedTasks, responsesCount };
    }

    // Removed create-and-respond: simulator only fills existing tasks / questionnaires

    async function simulateProgressOnly(selectedUsers, perUser, includeChecklists) {
      let affectedTasks = 0;
      for (const user of selectedUsers) {
        const owned = Object.entries(tasksMap)
          .filter(([,t]) => taskBelongsToUser(t, user))
          .filter(([,t]) => includeChecklists==='yes' ? true : !(t.task_desc||'').includes('Checklist items:'));
        const picks = owned.slice(0, perUser);
        for (const [taskId, task] of picks) {
          const makeComplete = randomBool(0.4);
          await updateTaskFields(taskId, {
            task_status: makeComplete ? 'Complete' : 'In Progress',
            task_completion_percent: makeComplete ? 100 : randomInt(10, 95)
          });
          affectedTasks += 1;
        }
      }
      return { affectedTasks };
    }

    function toggleQuestionControlsVisibility() {
      const mode = (document.getElementById('mode').value);
      document.getElementById('question-target-type-wrapper').style.display = mode==='create_and_respond' ? 'block' : 'none';
    }

    async function boot() {
      try {
        // Wait for Firebase auth to be ready and check authentication
        await window.firebaseReady;
        if (!window.getCurrentAuthState || !window.getCurrentAuthState().isLoggedIn || !window.getCurrentAuthState().isVerified) {
          console.log('🔒 User not authenticated, redirecting to login...');
          window.redirectToLogin('You must be logged in to use the activity simulator.');
          return;
        }

        await initializeDatabase();
        currentUserEmail = window.getCurrentAuthState().user?.email || 'unknown@unknown';
        document.getElementById('auth-user-pill').textContent = `User: ${currentUserEmail}`;

        const [rawTeam, rawTasks, rawQuestions, rawRoles, rawKare] = await Promise.all([
          fetchTeam(), fetchTasks(), fetchQuestions(), fetchRolesAndMappings(), fetchKareData()
        ]);

        teamMap = rawTeam || {};
        tasksMap = rawTasks || {};
        questionsDb = rawQuestions || {};
        rolesData = rawRoles || {};
        kareData = rawKare || {};
        buildNameToEmailMap(teamMap);

        // Determine admin by team flag + hard-coded admins
        const HARD_CODED_ADMINS = new Set(['taylordavis@careluminate.com']);
        const me = (currentUserEmail || '').toLowerCase();
        const meTeam = Object.values(teamMap||{}).find(m => m.email===me || m.id === (me||'').replace(/[.#$\[\]\/]/g,'_')) || {};
        isAdmin = HARD_CODED_ADMINS.has(me) || !!meTeam.isAdmin;
        document.getElementById('admin-pill').textContent = `Admin: ${isAdmin ? 'Yes' : 'No'}`;

        // Conditionally show header
        const headerEl = document.getElementById('header-placeholder');
        if (isAdmin) {
          fetch('header.html').then(r=>r.text()).then(html => headerEl.innerHTML = html).catch(()=>{});
        } else {
          headerEl.innerHTML = '';
          document.getElementById('admin-guard').style.display = 'block';
        }

        renderTeamList(teamMap);
        setStat('stats-users', `${Object.keys(teamMap).length} users`);
        setStat('stats-tasks', `${Object.keys(tasksMap).length} tasks`);
        setStat('stats-responses', `${Object.keys(tasksMap).reduce((n,tid)=>n+Object.keys(tasksMap[tid].task_question_responses||{}).length,0)} responses`);

        // Wire UI
        document.getElementById('team-filter').addEventListener('input', () => renderTeamList(teamMap));
        document.getElementById('select-all-users').addEventListener('click', () => {
          document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = true);
        });
        document.getElementById('clear-users').addEventListener('click', () => {
          document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
        });
        document.getElementById('reset-log').addEventListener('click', () => { document.getElementById('log').innerHTML=''; });
        document.getElementById('mode').addEventListener('change', toggleQuestionControlsVisibility);
        toggleQuestionControlsVisibility();

        async function run(doWrite) {
          if (!isAdmin) { log('⛔ Not authorized.'); return; }
          const users = getSelectedUsers();
          if (users.length===0) { log('⚠️ Select at least one user.'); return; }
          const perUser = Math.max(1, parseInt(document.getElementById('tasks-per-user').value||'1'));
          const completeRate = parseFloat(document.getElementById('complete-rate').value);
          const commentRate = parseFloat(document.getElementById('comment-rate').value);
          const includeChecklists = document.getElementById('include-checklists').value;
          const mode = document.getElementById('mode').value;
          const targetType = 'consultant';
          const questionsPerTask = 0;

          log(`▶️ Simulation started (mode=${mode}, users=${users.length}, perUser=${perUser}, completeRate=${completeRate}, write=${doWrite})`);

          let created = 0, affected = 0, responses = 0;
          if (mode==='respond_existing') {
            if (doWrite) {
              const r = await simulateRespondExisting(users, completeRate, includeChecklists);
              affected += r.affectedTasks; responses += r.responsesCount;
            } else {
              // Dry run counts
              for (const u of users) {
                const candidates = Object.entries(tasksMap)
                  .filter(([,t]) => taskBelongsToUser(t, u))
                  .filter(([,t]) => Array.isArray(t.task_questions) && t.task_questions.length>0)
                  .filter(([,t]) => includeChecklists==='yes' ? true : !(t.task_desc||'').includes('Checklist items:'));
                affected += candidates.length;
                for (const [,t] of candidates) { responses += (t.task_questions||[]).length; }
              }
            }
          } else if (mode==='progress_only') {
            if (doWrite) {
              const r = await simulateProgressOnly(users, perUser, includeChecklists);
              affected += r.affectedTasks;
            } else {
              affected = users.length * perUser;
            }
          }

          if (doWrite) {
            // Refresh live stats
            tasksMap = await fetchTasks();
          }
          setStat('stats-users', `${Object.keys(teamMap).length} users`);
          setStat('stats-tasks', `${Object.keys(tasksMap).length} tasks`);
          setStat('stats-responses', `${Object.keys(tasksMap).reduce((n,tid)=>n+Object.keys(tasksMap[tid].task_question_responses||{}).length,0)} responses`);

          log(`✅ Simulation ${doWrite?'completed':'planned'}: created=${created}, affected=${affected}, responses=${responses}`);
        }

        document.getElementById('dry-run').addEventListener('click', () => run(false));
        document.getElementById('run-simulation').addEventListener('click', () => run(true));

      } catch (e) {
        console.error(e);
        log('❌ Initialization failed. See console for details.');
      }
    }

    // Register auth state change callback
    window.hotsheetAuthCheck = function(authState) {
      if (authState.isLoggedIn && authState.isVerified) {
        console.log('✅ Auth state confirmed, starting activity simulator...');
        boot();
      } else if (!authState.isChecking) {
        console.log('🔒 Auth failed, redirecting to login...');
        window.redirectToLogin('You must be logged in to use the activity simulator.');
      }
    };

    // Check if auth is already settled
    if (window.getCurrentAuthState && !window.getCurrentAuthState().isChecking) {
      const authState = window.getCurrentAuthState();
      if (authState.isLoggedIn && authState.isVerified) {
        boot();
      } else {
        window.redirectToLogin('You must be logged in to use the activity simulator.');
      }
    }
  </script>
</body>
</html>
