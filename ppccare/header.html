<!-- PPC Care Header -->
<link rel="stylesheet" href="../css/ppccare-theme.css?v=20250807" />
<header>
  <div class="header-container">
    <img src="../images/logos/ppc.png" alt="Pivot Point Consulting Logo" class="logo" />
    <h1 class="brand-title">Pivot Point Care</h1>
    
    <!-- Navigation Dropdown -->
    <div class="nav-dropdown">
      <select class="nav-select" onchange="navigateToPage(this.value)">
        <option value="">Navigate to...</option>
        <optgroup label="Task Management">
          <option value="my_tasks.html">My Tasks</option>
          <option value="assign_task_groups_customers.html">Assign Customer Tasks</option>
          <option value="assign_task_groups_consultants.html">Assign Consultant Tasks</option>
          <option value="repeat_scheduled_tasks.html">Recurring Task Schedules</option>
        </optgroup>
        <optgroup label="Role Assignments">
          <option value="customer_roles.html">Customer Support Assignments</option>
          <option value="consultants_roles.html">Consultant Support Assignments</option>
        </optgroup>
        <optgroup label="Reports & Analytics">
          <option value="question_summary.html">Status Reporting</option>
          <option value="task_completion_reporting.html">Task Completion Reporting</option>
        </optgroup>
        <optgroup label="Account Planning">
          <option value="account_plan.html">Account Plans</option>
        </optgroup>
        <optgroup label="Administrative">
          <option value="alltasks.html">All Tasks Management</option>
          <option value="task_groups.html">Create Task Groups</option>
          <option value="roles.html">Roles</option>
          <option value="team.html">Team</option>
          <option value="questions_manager.html">Question Manager</option>
          <option value="kare_reconcile.html">KARE/Customer List Reconcile</option>
          <option value="current_clients.html">Current Clients</option>
          <option value="weekly_alerts.html">Weekly Task Alerts</option>
        </optgroup>
      </select>
    </div>

    <!-- Authentication section -->
    <ul class="nav-menu">
      <li id="auth-section">
        <!-- Loading state -->
        <div id="auth-loading" style="display: flex; align-items: center; color: #5B5B5B;">
          <i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i>
          <span style="font-size: 0.9rem;">Checking...</span>
        </div>
        
        <!-- Not logged in -->
        <div id="not-logged-in" style="display: none;">
          <a href="../login.html" class="btn login-btn">Member Login</a>
        </div>
        
        <!-- Logged in -->
        <div id="logged-in" style="display: none;">
          <div class="user-menu">
            <div class="user-info">
              <div class="user-avatar" id="user-avatar">U</div>
              <span class="user-name" id="user-name">User</span>
              <i class="fas fa-chevron-down dropdown-icon"></i>
            </div>
            <div class="dropdown-menu" id="dropdown-menu">
              <a href="../dashboard.html" class="dropdown-item">
                <i class="fas fa-tachometer-alt"></i> Dashboard
              </a>
              <a href="../account-settings.html" class="dropdown-item">
                <i class="fas fa-cog"></i> Account Settings
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</header>

<style>
  /* Root Variables for PPC Care */
  :root {
    --ppc-primary: #2D6B83;
    --ppc-secondary: #44A1C4;
    --ppc-accent: #DBA660;
    --ppc-light: #f8f9fa;
    --ppc-dark: #5B5B5B;
    --ppc-success: #28a745;
    --ppc-warning: #fd7e14;
    --ppc-danger: #dc3545;
    --ppc-info: #17a2b8;
    --ppc-border: #e0e0e0;
  }

  /* Header Styles */
  header {
    background: linear-gradient(135deg, var(--ppc-primary) 0%, var(--ppc-secondary) 100%);
    padding: 20px 0;
    box-shadow: 0 4px 20px rgba(45, 107, 131, 0.15);
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  /* Subtle background pattern */
  header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M20 20c0 11.046-8.954 20-20 20s-20-8.954-20-20 8.954-20 20-20 20 8.954 20 20zm0-20c-11.046 0-20 8.954-20 20s8.954 20 20 20 20-8.954 20-20-8.954-20-20-20z'/%3E%3C/g%3E%3C/svg%3E");
  }

  .header-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 2;
  }
  
  .logo {
    height: 48px;
    width: auto;
    transition: all 0.3s ease;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }

  .logo:hover {
    transform: scale(1.05);
  }
  
  .brand-title {
    font-size: 2.2rem;
    font-weight: 700;
    color: white;
    margin: 0;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    letter-spacing: -0.5px;
  }
  
  /* Navigation Dropdown Styles */
  .nav-dropdown {
    margin-left: auto;
    margin-right: 20px;
  }
  
  .nav-select {
    padding: 12px 20px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 200px;
  }

  .nav-select option {
    color: var(--ppc-dark);
    background: white;
    padding: 8px;
  }

  .nav-select optgroup {
    color: var(--ppc-primary);
    font-weight: 700;
    background: var(--ppc-light);
  }
  
  .nav-select:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-1px);
  }
  
  .nav-select:focus {
    outline: none;
    border-color: var(--ppc-accent);
    box-shadow: 0 0 0 3px rgba(219, 166, 96, 0.3);
  }

  /* User Menu Styles */
  .nav-menu {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 2rem;
    align-items: center;
  }
  
  .user-menu {
    position: relative;
    display: inline-block;
  }
  
  .user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    border-radius: 50px;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  
  .user-info:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  }
  
  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ppc-accent), #f4d03f);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ppc-primary);
    font-weight: bold;
    font-size: 1rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  
  .user-name {
    font-weight: 600;
    color: white;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .dropdown-icon {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.8);
    transition: transform 0.3s ease;
  }
  
  .user-menu.active .dropdown-icon {
    transform: rotate(180deg);
  }
  
  .dropdown-menu {
    position: absolute;
    top: 100%;
    right: 0;
    background: white;
    min-width: 220px;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    z-index: 1000;
    margin-top: 0.75rem;
    border: 1px solid var(--ppc-border);
  }
  
  .user-menu.active .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    color: var(--ppc-dark);
    text-decoration: none;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .dropdown-item i {
    width: 18px;
    color: var(--ppc-dark);
    transition: color 0.3s ease;
  }

  .dropdown-item:hover {
    background: linear-gradient(135deg, var(--ppc-light), #e9ecef);
    color: var(--ppc-primary);
  }

  .dropdown-item:hover i {
    color: var(--ppc-primary);
  }

  .dropdown-item:first-child {
    border-radius: 12px 12px 0 0;
  }

  .dropdown-item:last-child {
    border-radius: 0 0 12px 12px;
  }

  .dropdown-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ppc-border), transparent);
    margin: 0.5rem 0;
  }

  .login-btn {
    background: linear-gradient(135deg, var(--ppc-accent), #f4d03f);
    color: var(--ppc-primary);
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 25px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(219, 166, 96, 0.3);
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(219, 166, 96, 0.4);
    background: linear-gradient(135deg, #f4d03f, var(--ppc-accent));
  }

  /* Responsive Design */
  @media (max-width: 768px) {
    .header-container {
      flex-direction: column;
      gap: 1rem;
      padding: 0 15px;
    }

    .page-title {
      font-size: 1.8rem;
      text-align: center;
    }

    .nav-dropdown {
      margin: 0;
      width: 100%;
    }

    .nav-select {
      width: 100%;
      min-width: auto;
    }

    .user-info {
      padding: 0.5rem 1rem;
    }

    .user-name {
      max-width: 100px;
    }
  }

  /* Animation for dropdown menu */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .user-menu.active .dropdown-menu {
    animation: fadeInUp 0.3s ease;
  }

  /* Global icon visibility fixes for PPC Care */
  i.fas, i.far, i.fab {
    color: inherit;
  }

  /* Ensure buttons with only icons are visible */
  button i, .btn i, [class*="btn"] i {
    color: currentColor;
  }

  /* Make sure action buttons and icon buttons are visible */
  .action-btn i, .icon-btn i, button:not([class*="btn"]) i {
    color: var(--ppc-dark);
  }
</style>

<script>
  function navigateToPage(url) {
    if (url) {
      window.location.href = url;
    }
  }

  // Enhanced user menu interactions
  document.addEventListener('DOMContentLoaded', function() {
    const userMenu = document.querySelector('.user-menu');
    const userInfo = document.querySelector('.user-info');
    
    if (userInfo) {
      userInfo.addEventListener('click', function(e) {
        e.stopPropagation();
        userMenu.classList.toggle('active');
      });
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (userMenu && !userMenu.contains(e.target)) {
        userMenu.classList.remove('active');
      }
    });

    // Handle escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && userMenu) {
        userMenu.classList.remove('active');
      }
    });
  });
</script>
