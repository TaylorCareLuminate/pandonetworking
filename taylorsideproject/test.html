<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Test</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
  <h2 style="margin-bottom:1.25rem">🧪 Supabase Connection Test</h2>

  <div class="card" id="step-connect">
    <h3>Step 1 — Connect</h3>
    <div id="connect-result" style="color:var(--muted);font-size:0.9rem;margin-top:0.5rem">Running…</div>
  </div>

  <div class="card" id="step-write">
    <h3>Step 2 — Write a test record</h3>
    <div id="write-result" style="color:var(--muted);font-size:0.9rem;margin-top:0.5rem">Waiting…</div>
  </div>

  <div class="card" id="step-read">
    <h3>Step 3 — Read it back</h3>
    <div id="read-result" style="color:var(--muted);font-size:0.9rem;margin-top:0.5rem">Waiting…</div>
  </div>

  <div class="card" id="step-delete">
    <h3>Step 4 — Clean up (delete test record)</h3>
    <div id="delete-result" style="color:var(--muted);font-size:0.9rem;margin-top:0.5rem">Waiting…</div>
  </div>

  <a href="index.html" class="btn secondary" style="margin-top:0.5rem">← Back to Home</a>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js'

  function ok(id, msg)  { document.getElementById(id).innerHTML = `<div class="status ok">✅ ${msg}</div>` }
  function err(id, msg) { document.getElementById(id).innerHTML = `<div class="status err">❌ ${msg}</div>` }
  function info(id, msg){ document.getElementById(id).innerHTML = `<span style="color:var(--muted);font-size:0.9rem">${msg}</span>` }

  // Step 1 — basic connectivity
  let testId = null
  try {
    const { error } = await supabase.from('books').select('id').limit(1)
    if (error) throw error
    ok('connect-result', 'Connected to Supabase successfully')
  } catch (e) {
    err('connect-result', e.message)
    err('write-result',   'Skipped (connection failed)')
    err('read-result',    'Skipped')
    err('delete-result',  'Skipped')
    throw e
  }

  // Step 2 — write
  info('write-result', 'Writing test record…')
  try {
    const { data, error } = await supabase
      .from('books')
      .insert({
        session_id: '__test__',
        title:      'Test Book ' + new Date().toISOString(),
        genre:      'Test',
        setting:    'A test universe'
      })
      .select()
      .single()
    if (error) throw error
    testId = data.id
    ok('write-result', `Saved! id = <code style="font-size:0.8rem">${testId}</code>`)
  } catch (e) {
    err('write-result', e.message)
    err('read-result',  'Skipped (write failed)')
    err('delete-result','Skipped')
    throw e
  }

  // Step 3 — read back
  info('read-result', 'Reading record back…')
  try {
    const { data, error } = await supabase
      .from('books')
      .select('*')
      .eq('id', testId)
      .single()
    if (error) throw error
    ok('read-result', `Found: "<strong>${data.title}</strong>" — genre: ${data.genre}`)
  } catch (e) {
    err('read-result', e.message)
    err('delete-result', 'Skipped')
    throw e
  }

  // Step 4 — delete
  info('delete-result', 'Cleaning up…')
  try {
    const { error } = await supabase.from('books').delete().eq('id', testId)
    if (error) throw error
    ok('delete-result', 'Test record deleted — database is fully working!')
  } catch (e) {
    err('delete-result', e.message)
  }
</script>

</body>
</html>
