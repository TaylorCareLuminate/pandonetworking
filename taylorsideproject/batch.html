<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Generate — AI Book Builder</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .batch-outline-row {
      display: grid;
      grid-template-columns: 48px 1fr 1fr auto;
      gap: 0.5rem;
      align-items: start;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      .batch-outline-row {
        grid-template-columns: 40px 1fr auto;
        grid-template-rows: auto auto;
      }
      .batch-outline-row .title-cell { grid-column: 2; }
      .batch-outline-row .premise-cell { grid-column: 1 / -2; }
    }
    .batch-outline-row input,
    .batch-outline-row textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.88rem;
      padding: 0.4rem 0.55rem;
      box-sizing: border-box;
      font-family: inherit;
    }
    .batch-outline-row textarea {
      min-height: 60px;
      resize: vertical;
      line-height: 1.5;
    }
    .batch-outline-row .ch-num-badge {
      background: var(--surface2);
      border-radius: 8px;
      text-align: center;
      padding: 0.4rem 0.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .batch-outline-row .row-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.35rem;
      border-radius: 6px;
      transition: color 0.15s;
      margin-top: 2px;
    }
    .batch-outline-row .row-del:hover { color: var(--accent2); }

    /* Progress log */
    .batch-log {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .log-entry {
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .log-entry.pending  { background: var(--surface); color: var(--muted); }
    .log-entry.active   { background: rgba(124,106,247,0.12); border: 1px solid rgba(124,106,247,0.3); color: var(--text); }
    .log-entry.done     { background: rgba(60,180,100,0.1);  border: 1px solid rgba(60,180,100,0.25); }
    .log-entry.error    { background: rgba(220,80,80,0.1);   border: 1px solid rgba(220,80,80,0.3);   }
    .log-entry.skipped  { background: var(--surface2); color: var(--muted); }

    .log-entry .le-head { font-weight: 600; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .log-entry .le-phase { font-size: 0.78rem; color: var(--muted); }
    .log-entry .le-words { font-size: 0.78rem; color: var(--accent); margin-left: auto; }

    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .batch-summary {
      background: rgba(60,180,100,0.08);
      border: 1px solid rgba(60,180,100,0.2);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      text-align: center;
    }
    .options-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .options-row label {
      margin: 0;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }
    select.mode-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a id="back-link" href="#" class="btn sm secondary">← Book</a>
  <h1 class="top-title">Batch Generate</h1>
  <span id="book-title-label" style="color:var(--muted);font-size:0.82rem"></span>
</div>

<div class="page-content">

  <!-- ── OUTLINE BUILDER ─────────────────────────────────────────────────── -->
  <div class="card" id="outline-card">
    <div style="margin-bottom:0.75rem">
      <strong style="font-size:1rem">📋 Chapter Outline</strong>
      <div style="font-size:0.78rem;color:var(--muted);margin-top:3px">
        Define up to 50 chapters. Give each a premise — the AI handles everything else in sequence.
        Leave title blank for untitled chapters.
      </div>
    </div>

    <!-- column headers -->
    <div style="display:grid;grid-template-columns:48px 1fr 1fr 32px;gap:0.5rem;padding:0 0 0.4rem;font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">
      <span>Ch.</span><span>Title (optional)</span><span>Premise *</span><span></span>
    </div>

    <div id="outline-rows"></div>

    <div style="display:flex;gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap">
      <button class="btn sm secondary" id="btn-add-row">+ Add Chapter</button>
      <button class="btn sm secondary" id="btn-add-5">+ Add 5</button>
      <span style="flex:1"></span>
      <button class="btn sm secondary" id="btn-export">⬇ Export Outline</button>
      <button class="btn sm secondary" id="btn-import-outline">⬆ Import Outline</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none">
    </div>

    <div id="st-outline" style="margin-top:0.5rem"></div>
  </div>

  <!-- ── GENERATION OPTIONS ──────────────────────────────────────────────── -->
  <div class="card" id="options-card">
    <strong style="font-size:1rem;display:block;margin-bottom:0.75rem">⚙️ Options</strong>

    <div class="options-row">
      <label>
        <span style="color:var(--muted)">Mode:</span>
        <select class="mode-select" id="gen-mode">
          <option value="full">Full pipeline (draft → characters → universe → final)</option>
          <option value="fast">Fast mode (draft → final only, no character/universe phases)</option>
        </select>
      </label>
    </div>

    <div class="options-row">
      <label>
        <input type="checkbox" id="opt-skip-existing" checked style="width:auto">
        Skip chapters that already exist in the book
      </label>
      <label>
        <input type="checkbox" id="opt-pause-errors" checked style="width:auto">
        Pause on error (uncheck to skip errors and continue)
      </label>
    </div>

    <div style="font-size:0.8rem;color:var(--muted);margin-top:0.25rem">
      Characters used: <span id="char-count-label" style="color:var(--text)">loading…</span>
    </div>
  </div>

  <!-- ── RUN CONTROLS ─────────────────────────────────────────────────────── -->
  <div class="card" style="padding:1rem">
    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center">
      <button class="btn" id="btn-start" style="min-width:160px">🚀 Generate All Chapters</button>
      <button class="btn secondary" id="btn-pause" style="display:none">⏸ Pause after this chapter</button>
      <button class="btn secondary" id="btn-stop"  style="display:none;color:var(--accent2)">⏹ Stop</button>
      <span id="batch-progress-label" style="font-size:0.85rem;color:var(--muted)"></span>
    </div>
    <div id="st-batch" style="margin-top:0.5rem"></div>
  </div>

  <!-- ── PROGRESS LOG ─────────────────────────────────────────────────────── -->
  <div id="log-card" class="card" style="display:none">
    <strong style="font-size:1rem;display:block;margin-bottom:0.75rem">📊 Progress</strong>
    <div class="batch-log" id="batch-log"></div>
    <div id="batch-summary" style="display:none;margin-top:1rem"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Home</a>
  <a id="nav-book" href="#"><span class="icon">📖</span>Book</a>
  <a href="#" class="active"><span class="icon">⚡</span>Batch</a>
</nav>

<script type="module">
import { getBook, getCharacters, getChapters, getArcs,
         createChapter, updateChapter, updateBook, getChapter } from './js/db.js'
import { RAILWAY_URL, countWords } from './js/ai.js'

// ── Init ─────────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search)
const BOOK_ID = params.get('book')
if (!BOOK_ID) location.href = 'index.html'

document.getElementById('back-link').href = `book.html?id=${BOOK_ID}`
document.getElementById('nav-book').href  = `book.html?id=${BOOK_ID}`

let book, characters, existingChapters, arcs
let outline = []          // [{ num, title, premise }]
let batchRunning  = false
let pauseRequested= false
let stopRequested = false

// ── Load book data ────────────────────────────────────────────────────────
async function init() {
  try {
    ;[book, characters, existingChapters, arcs] = await Promise.all([
      getBook(BOOK_ID), getCharacters(BOOK_ID), getChapters(BOOK_ID), getArcs(BOOK_ID)
    ])
    document.getElementById('book-title-label').textContent = book.title
    document.title = `Batch — ${book.title}`

    const charsWithModels = characters.filter(c => c.assigned_model)
    document.getElementById('char-count-label').textContent =
      charsWithModels.length
        ? charsWithModels.map(c => c.name).join(', ')
        : 'None with AI models assigned'

    // Pre-fill starting chapter number
    const maxExisting = existingChapters.reduce((m,c) => Math.max(m, c.chapter_number||0), 0)
    addRow(maxExisting + 1)
  } catch(e) {
    document.getElementById('st-outline').innerHTML =
      `<div class="status err">Failed to load book: ${e.message}</div>`
  }
}

// ── Outline row management ────────────────────────────────────────────────
function addRow(num, title = '', premise = '') {
  if (outline.length >= 50) return
  const id  = Date.now() + Math.random()
  const row = { id, num: num ?? (nextNum()), title, premise }
  outline.push(row)
  renderRows()
  return row
}

function addRows(count) {
  let n = nextNum()
  for (let i = 0; i < count && outline.length < 50; i++) addRow(n++, '', '')
}

function nextNum() {
  return outline.length
    ? Math.max(...outline.map(r => r.num || 0)) + 1
    : (existingChapters ? Math.max(0, ...existingChapters.map(c => c.chapter_number||0)) + 1 : 1)
}

function removeRow(id) {
  outline = outline.filter(r => r.id !== id)
  renderRows()
}

function readRows() {
  outline.forEach(row => {
    const el = document.getElementById(`row-${row.id}`)
    if (!el) return
    row.num    = parseInt(el.querySelector('.num-input').value) || row.num
    row.title  = el.querySelector('.title-input').value.trim()
    row.premise= el.querySelector('.premise-input').value.trim()
  })
}

function renderRows() {
  const container = document.getElementById('outline-rows')
  container.innerHTML = outline.map(row => `
    <div class="batch-outline-row" id="row-${row.id}">
      <div class="ch-num-badge">
        <input class="num-input" type="number" min="1" max="999" value="${row.num}"
          style="width:100%;text-align:center;background:transparent;border:none;color:var(--text);font-weight:600;font-size:0.85rem;padding:0">
      </div>
      <div class="title-cell">
        <input class="title-input" type="text" placeholder="Title (optional)" value="${escH(row.title)}">
      </div>
      <div class="premise-cell">
        <textarea class="premise-input" placeholder="Premise / what happens in this chapter… (required)">${escH(row.premise)}</textarea>
      </div>
      <button class="row-del" onclick="removeRowById('${row.id}')" title="Remove">✕</button>
    </div>`).join('')

  document.getElementById('st-outline').textContent =
    outline.length >= 50 ? '⚠ Maximum 50 chapters reached.' : ''
}

window.removeRowById = id => {
  readRows()
  removeRow(id)
}

document.getElementById('btn-add-row').onclick = () => { readRows(); addRow(); }
document.getElementById('btn-add-5').onclick   = () => { readRows(); addRows(5); }

// ── Export / Import outline ───────────────────────────────────────────────
document.getElementById('btn-export').onclick = () => {
  readRows()
  const data = { book: book.title, chapters: outline.map(r => ({ num: r.num, title: r.title, premise: r.premise })) }
  const blob  = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
  const a     = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `outline-${book.title.replace(/[^a-z0-9]/gi,'_')}.json` })
  a.click()
}

document.getElementById('btn-import-outline').onclick = () => document.getElementById('import-file-input').click()
document.getElementById('import-file-input').onchange = e => {
  const file = e.target.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result)
      const rows = data.chapters || data
      if (!Array.isArray(rows)) throw new Error('Invalid format')
      outline = rows.map(r => ({ id: Date.now() + Math.random(), num: r.num||r.chapter_number||1, title: r.title||'', premise: r.premise||'' }))
      renderRows()
    } catch(err) {
      alert('Could not parse outline file: ' + err.message)
    }
  }
  reader.readAsText(file)
  e.target.value = ''
}

// ── Batch controls ────────────────────────────────────────────────────────
document.getElementById('btn-start').onclick  = () => startBatch()
document.getElementById('btn-pause').onclick  = () => { pauseRequested = true; document.getElementById('btn-pause').textContent = '⏸ Pausing…'; document.getElementById('btn-pause').disabled = true }
document.getElementById('btn-stop').onclick   = () => { stopRequested = true; pauseRequested = true; document.getElementById('btn-stop').disabled = true }

// ── Logging helpers ───────────────────────────────────────────────────────
function logEntry(id, state, title, phase = '', wordCount = null) {
  let el = document.getElementById(`le-${id}`)
  if (!el) {
    el = document.createElement('div')
    el.id = `le-${id}`
    document.getElementById('batch-log').appendChild(el)
  }
  const icon = state === 'done' ? '✓' : state === 'error' ? '✕' : state === 'active' ? '<span class="spin">⟳</span>' : state === 'skipped' ? '—' : '○'
  el.className = `log-entry ${state}`
  el.innerHTML = `
    <div class="le-head">
      ${icon} ${escH(title)}
      ${wordCount ? `<span class="le-words">${wordCount.toLocaleString()} words</span>` : ''}
    </div>
    ${phase ? `<div class="le-phase">${escH(phase)}</div>` : ''}`
}

// ── Main batch runner ─────────────────────────────────────────────────────
async function startBatch() {
  readRows()

  const toGenerate = outline.filter(r => r.premise.trim())
  if (!toGenerate.length) {
    document.getElementById('st-batch').innerHTML = '<div class="status err">Add at least one chapter with a premise.</div>'
    return
  }

  const skipExisting = document.getElementById('opt-skip-existing').checked
  const pauseOnError = document.getElementById('opt-pause-errors').checked
  const mode         = document.getElementById('gen-mode').value
  const activeChars  = characters.filter(c => c.assigned_model)

  // Disable outline editing during run
  batchRunning = true; pauseRequested = false; stopRequested = false
  document.getElementById('outline-card').style.opacity = '0.5'
  document.getElementById('outline-card').style.pointerEvents = 'none'
  document.getElementById('options-card').style.opacity = '0.5'
  document.getElementById('options-card').style.pointerEvents = 'none'
  document.getElementById('btn-start').style.display  = 'none'
  document.getElementById('btn-pause').style.display  = 'inline-block'
  document.getElementById('btn-stop').style.display   = 'inline-block'
  document.getElementById('btn-pause').disabled       = false
  document.getElementById('btn-pause').textContent    = '⏸ Pause after this chapter'
  document.getElementById('btn-stop').disabled        = false
  document.getElementById('log-card').style.display   = 'block'
  document.getElementById('batch-log').innerHTML      = ''
  document.getElementById('batch-summary').style.display = 'none'

  // Build initial "story so far" from existing saved chapters
  let freshChapters = await getChapters(BOOK_ID)
  let recentChapters = buildRecentChapters(freshChapters)
  let storySoFar     = buildStorySoFar(freshChapters)

  let done = 0, skipped = 0, errored = 0
  let totalWords = 0

  for (let i = 0; i < toGenerate.length; i++) {
    if (stopRequested) break
    if (pauseRequested && !stopRequested) {
      document.getElementById('batch-progress-label').textContent = '⏸ Paused'
      break
    }

    const row    = toGenerate[i]
    const chNum  = row.num
    const chTitle= row.title
    const logId  = `ch-${chNum}`
    const label  = `Chapter ${chNum}${chTitle ? ' — ' + chTitle : ''}`

    document.getElementById('batch-progress-label').textContent = `Chapter ${i+1} of ${toGenerate.length}`

    // Skip if already exists
    if (skipExisting) {
      const already = freshChapters.find(c => c.chapter_number === chNum && (c.final_content || c.user_edited_content))
      if (already) {
        logEntry(logId, 'skipped', label, 'Already exists — skipped')
        skipped++
        continue
      }
    }

    logEntry(logId, 'active', label, 'Starting…')
    document.getElementById(`le-${logId}`).scrollIntoView({ behavior:'smooth', block:'nearest' })

    try {
      // Create or reuse chapter record
      let chapterId
      const existing = freshChapters.find(c => c.chapter_number === chNum)
      if (existing) {
        chapterId = existing.id
        await updateChapter(chapterId, { pipeline_status: null, pipeline_error: null, final_content: null, status: 'draft' })
      } else {
        const created = await createChapter({ book_id: BOOK_ID, chapter_number: chNum, title: chTitle||null, status: 'draft', premise: row.premise })
        chapterId = created.id
        freshChapters.push(created)
      }

      // Start server-side pipeline
      logEntry(logId, 'active', label, 'Starting server-side pipeline…')
      const startRes = await fetch(`${RAILWAY_URL}/api/book/chapter/start-pipeline`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chapterId, book,
          characters: activeChars,
          storySoFar, premise: row.premise,
          chapterNumber: chNum, chapterTitle: chTitle,
          arcs, recentChapters, mode
        })
      })
      if (!startRes.ok) throw new Error(`Pipeline start failed (${startRes.status})`)

      // Poll Supabase until done
      const phaseLabels = { 'phase:reactions':'Character reactions…', 'phase:recommend':'Narrator recommendation…', 'phase:draft':'Drafting…', 'phase:contributions':'Character contributions…', 'phase:universe':'Universe review…', 'phase:final':'Writing final chapter…' }
      let finalContent = null, wc = 0, summary = ''
      const TIMEOUT_MS = 12 * 60 * 1000   // 12 minutes max per chapter
      const started    = Date.now()

      while (Date.now() - started < TIMEOUT_MS) {
        if (stopRequested) break
        await sleep(5000)
        const ch = await getChapter(chapterId)
        if (!ch) continue

        const phaseLabel = phaseLabels[ch.pipeline_status] || ch.pipeline_status || '…'
        logEntry(logId, 'active', label, phaseLabel)

        if (ch.final_content) {
          finalContent = ch.final_content
          wc           = ch.word_count || countWords(finalContent)
          summary      = ch.chapter_summary || ''
          break
        }
        if (ch.pipeline_status === 'error') {
          throw new Error(ch.pipeline_error || 'Pipeline error on Railway')
        }
      }

      if (!finalContent) throw new Error('Chapter generation timed out')

      totalWords += wc

      // Update rolling context for next iteration
      freshChapters = freshChapters.map(c => c.id === chapterId
        ? { ...c, final_content: finalContent, chapter_summary: summary, chapter_number: chNum, status: 'saved' }
        : c)
      if (!freshChapters.find(c => c.id === chapterId)) {
        freshChapters.push({ id: chapterId, chapter_number: chNum, final_content: finalContent, chapter_summary: summary, status: 'saved' })
      }
      recentChapters = buildRecentChapters(freshChapters)
      storySoFar     = buildStorySoFar(freshChapters)

      logEntry(logId, 'done', label, '', wc)
      done++

    } catch(e) {
      logEntry(logId, 'error', label, `Error: ${e.message}`)
      errored++
      if (pauseOnError) {
        document.getElementById('batch-progress-label').textContent = '⏸ Paused due to error'
        break
      }
    }
  }

  // Recalc book total word count
  try {
    const allSaved = await getChapters(BOOK_ID)
    const total = allSaved.reduce((s,c) => s + (c.word_count||0), 0)
    await updateBook(BOOK_ID, { total_words: total })
  } catch(e) { console.warn('word count recalc failed') }

  // Restore UI
  batchRunning = false
  document.getElementById('outline-card').style.opacity = ''
  document.getElementById('outline-card').style.pointerEvents = ''
  document.getElementById('options-card').style.opacity = ''
  document.getElementById('options-card').style.pointerEvents = ''
  document.getElementById('btn-start').style.display  = 'inline-block'
  document.getElementById('btn-start').textContent    = stopRequested ? '🚀 Generate All Chapters' : '🔄 Run Again'
  document.getElementById('btn-pause').style.display  = 'none'
  document.getElementById('btn-stop').style.display   = 'none'

  const stopped = stopRequested || pauseRequested
  document.getElementById('batch-progress-label').textContent = stopped ? '⏸ Stopped' : '✓ Done'

  const summaryEl = document.getElementById('batch-summary')
  summaryEl.style.display = 'block'
  summaryEl.innerHTML = `
    <div class="batch-summary">
      <div style="font-size:1.5rem;margin-bottom:0.5rem">${errored === 0 && !stopped ? '🎉' : '📊'}</div>
      <strong>${done} chapter${done!==1?'s':''} generated</strong>
      ${skipped ? ` · ${skipped} skipped` : ''}
      ${errored  ? ` · <span style="color:var(--accent2)">${errored} error${errored!==1?'s':''}</span>` : ''}
      <div style="color:var(--muted);font-size:0.85rem;margin-top:0.35rem">${totalWords.toLocaleString()} words added</div>
      <div style="margin-top:0.75rem">
        <a href="book.html?id=${BOOK_ID}" class="btn">View Book →</a>
        <a href="read.html?book=${BOOK_ID}" class="btn secondary" style="margin-left:0.5rem">📖 Read</a>
      </div>
    </div>`
}

  // ── Utilities ─────────────────────────────────────────────────────────────
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }

  // ── Context helpers ───────────────────────────────────────────────────────
const DEEP_COUNT = 2

function buildRecentChapters(chapters) {
  return chapters
    .filter(c => c.final_content && c.status === 'saved')
    .sort((a,b) => b.chapter_number - a.chapter_number)
    .slice(0, DEEP_COUNT)
    .reverse()
    .map(c => ({ number: c.chapter_number, title: c.title, content: c.user_edited_content || c.final_content }))
}

function buildStorySoFar(chapters) {
  const saved = chapters
    .filter(c => c.chapter_summary && c.status === 'saved')
    .sort((a,b) => a.chapter_number - b.chapter_number)
  return saved.map(c => `Ch.${c.chapter_number}${c.title?' ('+c.title+')':''}: ${c.chapter_summary}`).join('\n')
}

function escH(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

await init()
</script>
</body>
</html>
