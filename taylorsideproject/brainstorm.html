<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainstorm — AI Book Builder</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .book-chip {
      display:flex; align-items:center; gap:0.5rem;
      padding:0.65rem 1rem;
      border:1px solid var(--border); border-radius:10px;
      cursor:pointer; margin-bottom:0.5rem;
      transition:border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color:transparent;
    }
    .book-chip.selected { border-color:var(--accent); background:rgba(124,106,247,0.1); }
    .session-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1rem;
      margin-bottom:0.75rem;
    }
    .session-q {
      font-weight:600; font-size:0.9rem; margin-bottom:0.75rem;
      border-left:3px solid var(--accent); padding-left:0.75rem;
    }
    .collapse-btn {
      font-size:0.75rem; color:var(--muted); cursor:pointer;
      background:none; border:none; padding:0;
      -webkit-tap-highlight-color:transparent;
    }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" style="color:var(--muted);font-size:0.85rem;text-decoration:none">← Home</a>
  <h1 style="margin:0.4rem 0 0.2rem">💡 Brainstorm</h1>
  <p style="color:var(--muted);font-size:0.88rem;margin-bottom:1.5rem">Ask any question — get every character's perspective plus the narrator's synthesis</p>

  <!-- Book selector -->
  <div class="card">
    <h3 style="margin-bottom:0.75rem">Select Book</h3>
    <div id="book-selector">
      <div class="skeleton skeleton-title" style="margin-bottom:0.5rem"></div>
      <div class="skeleton skeleton-line"></div>
    </div>
  </div>

  <!-- Character selector (shown after book picked) -->
  <div class="card" id="char-section" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
      <h3>Characters</h3>
      <div style="display:flex;gap:0.4rem">
        <button class="btn sm secondary" id="btn-select-all">All</button>
        <button class="btn sm secondary" id="btn-deselect-all">None</button>
      </div>
    </div>
    <div id="char-chips" class="char-selector"></div>
  </div>

  <!-- Question -->
  <div class="card" id="question-section" style="display:none">
    <h3 style="margin-bottom:0.75rem">Your Question</h3>

    <!-- Preset prompts -->
    <p style="color:var(--muted);font-size:0.78rem;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.06em">Quick Prompts</p>
    <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.85rem">
      <button class="btn sm secondary" onclick="setQ('How does each character feel about the main conflict and what do they plan to do about it?')">Main conflict feelings</button>
      <button class="btn sm secondary" onclick="setQ('What is each character\\'s biggest secret that they haven\\'t told anyone?')">Hidden secrets</button>
      <button class="btn sm secondary" onclick="setQ('How does each character view the others — who do they trust, fear, or secretly admire?')">Character relationships</button>
      <button class="btn sm secondary" onclick="setQ('What would each character sacrifice everything for?')">What they\\'d die for</button>
      <button class="btn sm secondary" onclick="setQ('Each character describes their perfect outcome for the story\\'s ending.')">Ideal ending</button>
      <button class="btn sm secondary" onclick="setQ('What is each character\\'s fatal flaw that will eventually create problems?')">Fatal flaws</button>
    </div>

    <textarea id="q-input" rows="4" placeholder="Ask anything: plot decisions, character motivations, 'what if' scenarios, moral dilemmas, relationship dynamics…"></textarea>

    <label style="margin-top:0.85rem">Story Context <span style="color:var(--muted)">(where is the story right now?)</span></label>
    <textarea id="q-context" rows="3" placeholder="Brief summary of what has happened so far…"></textarea>

    <div style="display:flex;align-items:center;gap:0.85rem;margin-top:0.85rem;flex-wrap:wrap">
      <button class="btn" id="btn-ask">🤖 Ask All Characters</button>
      <label style="margin:0;display:flex;align-items:center;gap:0.4rem;font-size:0.83rem;color:var(--muted);text-transform:none;letter-spacing:0;cursor:pointer">
        <input type="checkbox" id="include-narrator" checked style="width:auto;cursor:pointer"> Narrator synthesis
      </label>
    </div>
    <div id="st-brain"></div>
  </div>

  <!-- Results -->
  <div id="results-area" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
      <h3>Responses</h3>
      <button class="btn sm secondary" onclick="clearResults()">Clear</button>
    </div>
    <div id="sessions-list"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Home</a>
  <a id="nav-book" href="#"><span class="icon">📖</span>Book</a>
  <a href="brainstorm.html" class="active"><span class="icon">💡</span>Brainstorm</a>
</nav>

<script type="module">
  import { supabase }               from './js/supabase-client.js'
  import { getAllBooks, getBook, getCharacters } from './js/db.js'
  import { brainstorm }             from './js/ai.js'

  if (!localStorage.getItem('session_id'))
    localStorage.setItem('session_id', crypto.randomUUID())
  const SESSION = localStorage.getItem('session_id')

  const params = new URLSearchParams(location.search)
  let preselectedBook = params.get('book')

  let selectedBookId  = preselectedBook || null
  let book            = null
  let characters      = []
  let selectedChars   = new Set()
  let sessions        = []

  const modelLabel = m => {
    const map = {
      'openai/gpt-5.5':'GPT-5.5','anthropic/claude-opus-4.8':'Claude Opus 4',
      'anthropic/claude-sonnet-4':'Claude Sonnet 4','google/gemini-2.5-pro':'Gemini 2.5',
      'x-ai/grok-4.3':'Grok 4','deepseek/deepseek-r1':'DeepSeek R1',
      'deepseek/deepseek-chat-v3':'DeepSeek V3','qwen/qwen3-235b-a22b':'Qwen 3 235B',
      'meta-llama/llama-4-maverick':'Llama 4','mistralai/mistral-large':'Mistral Large',
      'cohere/command-a':'Command A'
    }
    return map[m] || m?.split('/')?.pop() || '?'
  }

  window.setQ = text => { document.getElementById('q-input').value = text }

  async function loadBooks() {
    const books = await getAllBooks(SESSION)
    const sel   = document.getElementById('book-selector')

    if (!books.length) {
      sel.innerHTML = '<p style="color:var(--muted);font-size:0.9rem">No books yet. <a href="new-book.html" style="color:var(--accent)">Create one first →</a></p>'
      return
    }

    sel.innerHTML = books.map(b => `
      <div class="book-chip ${b.id===selectedBookId?'selected':''}" data-id="${b.id}" onclick="selectBook('${b.id}')">
        <span style="font-size:1.3rem">${b.genre==='Fantasy'?'🧙':b.genre==='Sci-Fi'?'🚀':b.genre==='Thriller'?'🔪':'📖'}</span>
        <div>
          <div style="font-weight:600;font-size:0.92rem">${b.title}</div>
          ${b.genre?`<div style="font-size:0.75rem;color:var(--muted)">${b.genre}</div>`:''}
        </div>
      </div>`).join('')

    if (selectedBookId) await loadBook(selectedBookId)
  }

  window.selectBook = async id => {
    selectedBookId = id
    document.querySelectorAll('.book-chip').forEach(c =>
      c.classList.toggle('selected', c.dataset.id === id))
    await loadBook(id)
  }

  async function loadBook(id) {
    [book, characters] = await Promise.all([getBook(id), getCharacters(id)])
    document.getElementById('nav-book').href = `book.html?id=${id}`
    selectedChars = new Set(characters.filter(c=>c.assigned_model).map(c=>c.id))
    renderChars()
    document.getElementById('char-section').style.display = 'block'
    document.getElementById('question-section').style.display = 'block'
  }

  function renderChars() {
    const container = document.getElementById('char-chips')
    container.innerHTML = characters.map(c => `
      <div class="char-chip ${selectedChars.has(c.id)?'selected':''}" data-cid="${c.id}" onclick="toggleChar('${c.id}',this)">
        ${c.avatar_emoji||'👤'} ${c.name}
        ${c.assigned_model ? '' : '<span style="font-size:0.7rem;color:var(--muted)">(no model)</span>'}
      </div>`).join('')
    if (!characters.length) {
      container.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">This book has no characters yet. Add some in the Book page.</p>'
    }
  }

  window.toggleChar = (id, el) => {
    if (selectedChars.has(id)) { selectedChars.delete(id); el.classList.remove('selected') }
    else { selectedChars.add(id); el.classList.add('selected') }
  }

  document.getElementById('btn-select-all').onclick = () => {
    characters.forEach(c => selectedChars.add(c.id))
    renderChars()
  }
  document.getElementById('btn-deselect-all').onclick = () => {
    selectedChars.clear(); renderChars()
  }

  document.getElementById('btn-ask').onclick = async () => {
    const q       = document.getElementById('q-input').value.trim()
    const context = document.getElementById('q-context').value.trim()
    if (!q) { alert('Please enter a question.'); return }
    if (!selectedBookId) { alert('Select a book first.'); return }

    const activeChars = characters.filter(c => selectedChars.has(c.id) && c.assigned_model)
    if (!activeChars.length) { alert('Select at least one character with an AI model assigned.'); return }

    const btn = document.getElementById('btn-ask')
    btn.disabled=true; btn.textContent='⏳ Asking…'
    document.getElementById('st-brain').innerHTML = ''

    try {
      const includeNarrator = document.getElementById('include-narrator').checked
      const result = await brainstorm(book, activeChars, q, context, includeNarrator)

      const session = {
        id:       Date.now(),
        question: q,
        context,
        responses: result.characterResponses,
        synthesis: result.narratorSynthesis,
        collapsed: false,
        timestamp: new Date().toLocaleTimeString()
      }
      sessions.unshift(session)
      renderSessions()
      document.getElementById('results-area').style.display = 'block'
      document.getElementById('results-area').scrollIntoView({ behavior:'smooth' })
      document.getElementById('q-input').value = ''
    } catch(e) {
      document.getElementById('st-brain').innerHTML =
        `<div class="status err">Error: ${e.message}</div>`
    }
    btn.disabled=false; btn.textContent='🤖 Ask All Characters'
  }

  function renderSessions() {
    document.getElementById('sessions-list').innerHTML = sessions.map(s => `
      <div class="session-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
          <div class="session-q">${s.question}</div>
          <button class="collapse-btn" onclick="toggleSession(${s.id})">${s.collapsed?'▼ Show':'▲ Hide'}</button>
        </div>
        <div style="font-size:0.72rem;color:var(--muted);margin-bottom:${s.collapsed?'0':'0.75rem'}">${s.timestamp}</div>
        ${s.collapsed ? '' : `
          ${s.responses.map(r=>`
            <div class="reaction-card" style="margin-bottom:0.5rem">
              <div class="char-label">${r.name} <span class="model-tag">${modelLabel(r.model)}</span></div>
              <div class="text">${r.error
                ? `<em style="color:var(--accent2)">Error: ${r.error}</em>`
                : (r.response||'—').replace(/\n/g,'<br>')}</div>
            </div>`).join('')}
          ${s.synthesis ? `
            <div style="margin-top:0.75rem">
              <div style="font-size:0.75rem;color:var(--accent3);font-weight:700;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.06em">🎭 Narrator Synthesis</div>
              <div class="narrator-synthesis">${s.synthesis.replace(/\n/g,'<br>')}</div>
            </div>` : ''}
        `}
      </div>`).join('')
  }

  window.toggleSession = id => {
    const s = sessions.find(x=>x.id===id)
    if (s) { s.collapsed = !s.collapsed; renderSessions() }
  }

  window.clearResults = () => {
    sessions = []
    document.getElementById('results-area').style.display = 'none'
    document.getElementById('sessions-list').innerHTML = ''
  }

  await loadBooks()
</script>

</body>
</html>
