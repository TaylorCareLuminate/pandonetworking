<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Book Builder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;gap:1rem">
    <div>
      <h1 style="margin-bottom:0.2rem">📖 AI Book Builder</h1>
      <p style="color:var(--muted);font-size:0.88rem">Collaborate with AI models to write your story</p>
    </div>
    <a href="new-book.html" class="btn" style="flex-shrink:0;margin-top:4px">+ New Book</a>
  </div>

  <!-- DB status indicator (only shows on error) -->
  <div id="conn-error"></div>

  <!-- Search -->
  <div style="margin-bottom:1rem;position:relative">
    <input id="search" type="search" placeholder="🔍  Search your books…" style="padding-left:1rem" />
  </div>

  <!-- Book list -->
  <div id="books-loading">
    <div class="card" style="margin-bottom:0.75rem">
      <div class="skeleton skeleton-title" style="margin-bottom:0.5rem"></div>
      <div class="skeleton skeleton-line" style="margin-bottom:0.3rem"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
    <div class="card">
      <div class="skeleton skeleton-title" style="margin-bottom:0.5rem"></div>
      <div class="skeleton skeleton-line" style="margin-bottom:0.3rem"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

  <div id="books-list" style="display:none"></div>

  <div id="empty-state" style="display:none" class="empty-state">
    <div class="icon">✍️</div>
    <h3>No books yet</h3>
    <p style="margin-bottom:1rem;font-size:0.9rem">Create your first book and start collaborating with AI</p>
    <a href="new-book.html" class="btn">+ Create Your First Book</a>
  </div>

  <!-- Quick stats bar -->
  <div id="stats-bar" style="display:none;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)">
    <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
      <div>
        <div style="font-size:1.5rem;font-weight:700" id="stat-books">—</div>
        <div style="font-size:0.75rem;color:var(--muted)">Books</div>
      </div>
      <div>
        <div style="font-size:1.5rem;font-weight:700" id="stat-chapters">—</div>
        <div style="font-size:0.75rem;color:var(--muted)">Chapters Written</div>
      </div>
      <div>
        <div style="font-size:1.5rem;font-weight:700" id="stat-words">—</div>
        <div style="font-size:0.75rem;color:var(--muted)">Total Words</div>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="active">
    <span class="icon">🏠</span>
    Home
  </a>
  <a href="new-book.html">
    <span class="icon">✍️</span>
    New Book
  </a>
  <a href="brainstorm.html">
    <span class="icon">💡</span>
    Brainstorm
  </a>
</nav>

<script type="module">
  import { supabase }   from './js/supabase-client.js'
  import { getAllBooks } from './js/db.js'

  if (!localStorage.getItem('session_id'))
    localStorage.setItem('session_id', crypto.randomUUID())
  const SESSION = localStorage.getItem('session_id')

  const genreEmoji = {
    'Fantasy': '🧙', 'Sci-Fi': '🚀', 'Thriller': '🔪', 'Mystery': '🔍',
    'Romance': '💕', 'Horror': '👻', 'Historical Fiction': '🏛️',
    'Literary Fiction': '📚', 'Adventure': '⚔️', 'Other': '📖'
  }

  let allBooks = []

  async function load() {
    try {
      // Test connection
      const { error: connErr } = await supabase.from('books').select('id').limit(1)
      if (connErr) throw connErr

      allBooks = await getAllBooks()

      document.getElementById('books-loading').style.display = 'none'

      if (!allBooks.length) {
        document.getElementById('empty-state').style.display = 'block'
        return
      }

      // Stats
      const totalChapters = allBooks.reduce((s, b) => s + (b.chapter_count || 0), 0)
      const totalWords    = allBooks.reduce((s, b) => s + (b.total_words  || 0), 0)
      document.getElementById('stat-books').textContent    = allBooks.length
      document.getElementById('stat-chapters').textContent = totalChapters
      document.getElementById('stat-words').textContent    = totalWords > 999
        ? (totalWords / 1000).toFixed(1) + 'k' : totalWords
      document.getElementById('stats-bar').style.display = 'block'

      renderBooks(allBooks)
      document.getElementById('books-list').style.display = 'block'
    } catch(e) {
      document.getElementById('books-loading').style.display = 'none'
      document.getElementById('conn-error').innerHTML =
        `<div class="status err" style="margin-bottom:1rem">⚠️ Could not connect to database: ${e.message}</div>`
    }
  }

  function renderBooks(books) {
    const list = document.getElementById('books-list')
    if (!books.length) {
      list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:1.5rem 0">No books match your search.</p>'
      return
    }
    list.innerHTML = books.map(b => {
      const emoji    = genreEmoji[b.genre] || '📖'
      const chapters = b.chapter_count || 0
      const words    = b.total_words   || 0
      const date     = b.created_at ? new Date(b.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : ''
      const progress = Math.min(100, chapters * 5)  // rough progress bar

      return `
      <a class="book-card" href="book.html?id=${b.id}">
        <div class="book-emoji">${emoji}</div>
        <div class="book-info">
          <div class="book-title">${b.title}</div>
          <div class="book-meta">
            ${b.genre ? `<span><span class="tag genre">${b.genre}</span></span>` : ''}
            ${chapters ? `<span>📄 ${chapters} chapter${chapters!==1?'s':''}</span>` : ''}
            ${words    ? `<span>✏️ ${words > 999 ? (words/1000).toFixed(1)+'k' : words} words</span>` : ''}
            ${date     ? `<span>🗓 ${date}</span>` : ''}
          </div>
          ${b.major_story ? `<div style="font-size:0.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.major_story.slice(0,90)}…</div>` : ''}
          <div class="book-progress">
            <div class="book-progress-fill" style="width:${progress}%"></div>
          </div>
        </div>
      </a>`
    }).join('')
  }

  // Search
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase()
    renderBooks(allBooks.filter(b =>
      b.title.toLowerCase().includes(q) ||
      (b.genre || '').toLowerCase().includes(q) ||
      (b.major_story || '').toLowerCase().includes(q)
    ))
  })

  await load()
</script>

</body>
</html>
