<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read — AI Book Builder</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --font-size-reading: 1.08rem; }
    body { background: #0c0c10; }

    .reading-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(12,12,16,0.95);
      backdrop-filter: blur(10px);
      z-index: 50;
      flex-wrap: wrap;
    }
    .font-controls { display:flex; gap:0.4rem; }
    .fc-btn {
      width:32px;height:32px;
      border-radius:6px;
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--text);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:0.9rem;
    }
    .chapter-toc {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1rem;
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.25s;
      z-index: 200;
      padding-top: 4rem;
    }
    .chapter-toc.open { transform: translateX(0); }
    .toc-overlay {
      position: fixed; inset:0; background:rgba(0,0,0,0.5);
      z-index:199; display:none;
    }
    .toc-overlay.open { display:block; }
    .toc-item {
      padding: 0.6rem 0.75rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .toc-item:hover  { background:var(--surface2); }
    .toc-item.active { background:rgba(124,106,247,0.15); color:var(--accent); }

    .reading-container {
      max-width: 660px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 6rem;
    }
    .book-header {
      text-align: center;
      margin-bottom: 3.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .book-header h1 { font-family: var(--font-read); font-size: clamp(1.8rem,6vw,2.8rem); margin-bottom:0.5rem; }
    .book-header .by { color:var(--muted); font-size:0.9rem; }

    .chapter-section { margin-bottom: 4rem; }
    .chapter-number-label {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.75rem;
    }
    .chapter-heading {
      font-family: var(--font-read);
      font-size: clamp(1.4rem, 4vw, 2rem);
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 700;
    }
    .chapter-text {
      font-family: var(--font-read);
      font-size: var(--font-size-reading);
      line-height: 1.95;
      color: #cccce0;
      white-space: pre-wrap;
    }
    .chapter-separator {
      text-align: center;
      color: var(--muted);
      font-size: 1.2rem;
      margin: 3.5rem 0;
      letter-spacing: 0.6em;
    }
    .chapter-meta {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    /* ── inline edit panel ── */
    .ch-edit-btn {
      display: block;
      margin: 0.75rem auto 0;
      font-size: 0.78rem;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    .ch-edit-btn:hover { opacity: 1; }

    .chapter-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: -0.5rem;
    }
    .ch-edit-btn-top {
      font-size: 0.78rem;
      padding: 0.35rem 0.75rem;
      opacity: 0.85;
    }
    .ch-edit-btn-top:hover { opacity: 1; }
    .ch-edit-panel {
      display: none;
      margin-top: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      background: var(--surface);
    }
    .ch-edit-panel.open { display: block; }
    .ch-edit-panel textarea {
      width: 100%;
      min-height: 260px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-read);
      font-size: 0.95rem;
      line-height: 1.8;
      padding: 0.75rem;
      resize: vertical;
      box-sizing: border-box;
    }
    .ch-edit-ai-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .ch-edit-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }
    .ch-edit-chip:hover { background: rgba(124,106,247,0.15); border-color: var(--accent); }
    .ch-edit-ai-preview {
      margin-top: 0.75rem;
      background: rgba(124,106,247,0.07);
      border: 1px solid rgba(124,106,247,0.2);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: var(--font-read);
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text);
      display: none;
      white-space: pre-wrap;
    }
    .ch-edit-actions { display:flex; gap:0.5rem; margin-top:0.75rem; flex-wrap:wrap; }

    .empty-reading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .progress-indicator {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.1s;
      z-index: 300;
    }
  </style>
</head>
<body>

<div class="progress-indicator" id="progress"></div>

<!-- TOC overlay -->
<div class="toc-overlay" id="toc-overlay" onclick="closeTOC()"></div>
<div class="chapter-toc" id="chapter-toc">
  <h3 style="margin-bottom:1rem;font-size:0.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Chapters</h3>
  <div id="toc-items"></div>
</div>

<!-- Reading controls bar -->
<div class="reading-controls">
  <div style="display:flex;gap:0.5rem;align-items:center">
    <button class="fc-btn" onclick="toggleTOC()" title="Table of Contents">☰</button>
    <a id="back-to-book" href="#" class="btn sm secondary">← Book</a>
  </div>
  <div style="color:var(--muted);font-size:0.8rem" id="reading-progress-text"></div>
  <div style="display:flex;gap:0.5rem;align-items:center">
    <div class="font-controls">
      <button class="fc-btn" onclick="changeFontSize(-1)" title="Smaller">A-</button>
      <button class="fc-btn" onclick="changeFontSize(1)"  title="Larger">A+</button>
    </div>
    <button class="btn sm secondary" id="btn-download">⬇ Download</button>
  </div>
</div>

<!-- Reading content -->
<div class="reading-container" id="reading-area">
  <div class="book-header" id="book-header">
    <div class="skeleton skeleton-title" style="margin:0 auto 0.5rem;max-width:300px"></div>
    <div class="skeleton" style="height:0.75em;width:120px;margin:0 auto"></div>
  </div>
  <div id="chapters-content">
    <div class="skeleton skeleton-line" style="margin-bottom:0.4rem"></div>
    <div class="skeleton skeleton-line" style="margin-bottom:0.4rem"></div>
    <div class="skeleton skeleton-line short"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Home</a>
  <a id="nav-book" href="#"><span class="icon">📖</span>Book</a>
  <a href="#" class="active"><span class="icon">👁️</span>Read</a>
</nav>

<script type="module">
  import { getBook, getChapters, updateChapter } from './js/db.js'
  import { countWords, editChapter }             from './js/ai.js'

  const params  = new URLSearchParams(location.search)
  const BOOK_ID = params.get('book')
  if (!BOOK_ID) location.href = 'index.html'

  document.getElementById('back-to-book').href = `book.html?id=${BOOK_ID}`
  document.getElementById('nav-book').href      = `book.html?id=${BOOK_ID}`

  let fontSize = parseFloat(localStorage.getItem('reading-font-size') || '1.08')
  document.documentElement.style.setProperty('--font-size-reading', fontSize + 'rem')

  window.changeFontSize = delta => {
    fontSize = Math.min(1.5, Math.max(0.85, fontSize + delta * 0.08))
    document.documentElement.style.setProperty('--font-size-reading', fontSize + 'rem')
    localStorage.setItem('reading-font-size', fontSize)
  }

  // ── Inline chapter editing ────────────────────────────────────────────────
  let bookData, allChapters

  window.toggleEditPanel = (chId) => {
    const panel = document.getElementById(`edit-panel-${chId}`)
    panel.classList.toggle('open')
    if (panel.classList.contains('open')) {
      panel.querySelector('textarea').focus()
    }
  }

  window.cancelEdit = (chId) => {
    const panel = document.getElementById(`edit-panel-${chId}`)
    panel.classList.remove('open')
    // Restore textarea to saved value
    const ch = allChapters.find(c => c.id === chId)
    if (ch) panel.querySelector('textarea').value = ch.user_edited_content || ch.final_content || ''
    panel.querySelector('.ch-edit-ai-preview').style.display = 'none'
  }

  window.saveEdit = async (chId) => {
    const panel   = document.getElementById(`edit-panel-${chId}`)
    const textarea= panel.querySelector('textarea')
    const content = textarea.value.trim()
    const saveBtn = panel.querySelector('.save-btn')
    if (!content) return

    saveBtn.disabled = true; saveBtn.textContent = '💾 Saving…'
    try {
      await updateChapter(chId, { user_edited_content: content })
      // Update local cache
      const ch = allChapters.find(c => c.id === chId)
      if (ch) ch.user_edited_content = content
      // Update displayed text
      const display = document.getElementById(`ch-text-${chId}`)
      if (display) display.innerHTML = renderProse(content)
      panel.classList.remove('open')
      showSaveToast()
    } catch(e) {
      alert('Save failed: ' + e.message)
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = '💾 Save'
    }
  }

  window.applyAiSuggestion = (chId) => {
    const panel   = document.getElementById(`edit-panel-${chId}`)
    const preview = panel.querySelector('.ch-edit-ai-preview')
    const textarea= panel.querySelector('textarea')
    if (preview.dataset.text) {
      if (preview.dataset.mode === 'continue') {
        textarea.value = textarea.value.trimEnd() + '\n\n' + preview.dataset.text
      } else {
        textarea.value = preview.dataset.text
      }
      preview.style.display = 'none'
      delete preview.dataset.text
      delete preview.dataset.mode
    }
  }

  window.discardAiSuggestion = (chId) => {
    const panel   = document.getElementById(`edit-panel-${chId}`)
    const preview = panel.querySelector('.ch-edit-ai-preview')
    preview.style.display = 'none'
    delete preview.dataset.text
  }

  window.runAiEdit = async (chId, instruction, mode) => {
    const panel    = document.getElementById(`edit-panel-${chId}`)
    const textarea = panel.querySelector('textarea')
    const preview  = panel.querySelector('.ch-edit-ai-preview')
    const instrBox = panel.querySelector('.custom-instr')

    const prompt   = instruction || (instrBox && instrBox.value.trim()) || 'Improve the prose'
    const editMode = mode || 'revise'
    const content  = textarea.value.trim()
    if (!content) return

    preview.textContent = editMode === 'continue' ? '⏳ Writing continuation…' : '⏳ AI thinking…'
    preview.style.display = 'block'
    delete preview.dataset.text

    try {
      const ch = allChapters.find(c => c.id === chId)
      const storySoFar = allChapters
        .filter(c => c.chapter_number < (ch?.chapter_number || 99) && c.chapter_summary)
        .map(c => `Ch.${c.chapter_number}: ${c.chapter_summary}`)
        .join('\n')

      const result = await editChapter(bookData, content, prompt, [], storySoFar, editMode)
      preview.textContent = result
      preview.dataset.text = result
      preview.dataset.mode = editMode
    } catch(e) {
      preview.textContent = 'Error: ' + e.message
    }
  }

  function showSaveToast() {
    let toast = document.getElementById('save-toast')
    if (!toast) {
      toast = document.createElement('div')
      toast.id = 'save-toast'
      toast.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:0.5rem 1.25rem;border-radius:20px;font-size:0.85rem;z-index:9999;transition:opacity 0.3s'
      document.body.appendChild(toast)
    }
    toast.textContent = '✓ Chapter saved'
    toast.style.opacity = '1'
    setTimeout(() => { toast.style.opacity = '0' }, 2000)
  }

  // Reading progress bar
  window.addEventListener('scroll', () => {
    const el   = document.documentElement
    const pct  = el.scrollTop / (el.scrollHeight - el.clientHeight) * 100
    document.getElementById('progress').style.width = pct + '%'

    // Update progress text
    const sections = document.querySelectorAll('.chapter-section')
    let current = 1
    sections.forEach(s => {
      if (s.getBoundingClientRect().top < 200) current = parseInt(s.dataset.num)
    })
    const total = sections.length
    document.getElementById('reading-progress-text').textContent =
      total ? `Chapter ${current} of ${total}` : ''

    // Update TOC active
    document.querySelectorAll('.toc-item').forEach(item => {
      item.classList.toggle('active', parseInt(item.dataset.num) === current)
    })
  })

  window.toggleTOC  = () => {
    document.getElementById('chapter-toc').classList.toggle('open')
    document.getElementById('toc-overlay').classList.toggle('open')
  }
  window.closeTOC = () => {
    document.getElementById('chapter-toc').classList.remove('open')
    document.getElementById('toc-overlay').classList.remove('open')
  }

  async function load() {
    const [book, chapters] = await Promise.all([getBook(BOOK_ID), getChapters(BOOK_ID)])
    bookData    = book
    allChapters = chapters

    // Header
    document.getElementById('book-header').innerHTML = `
      <h1>${book.title}</h1>
      <div class="by">${book.genre || ''}</div>
    `

    const saved = chapters.filter(c => (c.user_edited_content || c.final_content) && c.status === 'saved')

    if (!saved.length) {
      document.getElementById('chapters-content').innerHTML = `
        <div class="empty-reading">
          <div style="font-size:2.5rem;margin-bottom:1rem">📄</div>
          <h3>No chapters saved yet</h3>
          <p style="margin-bottom:1.5rem">Write and save at least one chapter to read your book here.</p>
          <a href="book.html?id=${BOOK_ID}" class="btn">Go to Book →</a>
        </div>`
      return
    }

    // Build TOC
    const tocHTML = saved.map(c => `
      <div class="toc-item" data-num="${c.chapter_number}" onclick="scrollToChapter(${c.chapter_number});closeTOC()">
        <span style="color:var(--muted);font-size:0.72rem">Ch ${c.chapter_number}</span><br>
        ${c.title || `Chapter ${c.chapter_number}`}
      </div>`).join('')
    document.getElementById('toc-items').innerHTML = tocHTML

    // Build reading content
    let totalWords = 0
    const chaptersHTML = saved.map((c, i) => {
      const content = c.user_edited_content || c.final_content
      const wc = countWords(content)
      totalWords += wc
      const editPanelId = `edit-panel-${c.id}`
      return `
        <div class="chapter-section" id="ch-sec-${c.chapter_number}" data-num="${c.chapter_number}">
          <div class="chapter-top-bar">
            <button class="btn sm secondary ch-edit-btn-top" onclick="toggleEditPanel('${c.id}');document.getElementById('edit-panel-${c.id}').scrollIntoView({behavior:'smooth',block:'start'})" title="Edit this chapter">✏️ Edit</button>
          </div>
          <div class="chapter-number-label">— Chapter ${c.chapter_number} —</div>
          <div class="chapter-heading">${c.title || `Chapter ${c.chapter_number}`}</div>
          ${c.chapter_summary ? `<div class="chapter-meta" style="font-style:italic">${c.chapter_summary}</div>` : ''}
          <div class="chapter-text" id="ch-text-${c.id}">${renderProse(content)}</div>
          <div class="chapter-meta" style="margin-top:1.5rem">${wc.toLocaleString()} words</div>

          <!-- Edit button -->
          <button class="btn sm secondary ch-edit-btn" onclick="toggleEditPanel('${c.id}')">✏️ Edit chapter</button>

          <!-- Inline edit panel -->
          <div class="ch-edit-panel" id="${editPanelId}">
            <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem">Edit Chapter ${c.chapter_number}${c.title ? ' — ' + escapeHTML(c.title) : ''}</div>
            <textarea>${escapeHTML(content)}</textarea>

            <!-- AI quick actions -->
            <div class="ch-edit-ai-row">
              <span style="font-size:0.75rem;color:var(--muted);align-self:center">AI assist:</span>
              <button class="ch-edit-chip" onclick="runAiEdit('${c.id}','Fix any grammar or spelling errors')">Fix grammar</button>
              <button class="ch-edit-chip" onclick="runAiEdit('${c.id}','Improve the prose flow and word choice while keeping the story identical')">Polish prose</button>
              <button class="ch-edit-chip" onclick="runAiEdit('${c.id}','Make it longer by expanding descriptions and adding more detail')">Expand</button>
              <button class="ch-edit-chip" onclick="runAiEdit('${c.id}','Tighten the pacing — remove any slow or redundant sections')">Tighten</button>
              <button class="ch-edit-chip" onclick="runAiEdit('${c.id}','Continue the chapter from where it ends, adding the next scene','continue')">Keep going →</button>
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
              <input class="custom-instr" type="text" placeholder="Custom instruction…" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.6rem;color:var(--text);font-size:0.85rem" onkeydown="if(event.key==='Enter')runAiEdit('${c.id}')">
              <button class="btn sm secondary" onclick="runAiEdit('${c.id}')">Ask AI</button>
            </div>

            <!-- AI preview -->
            <div class="ch-edit-ai-preview"></div>
            <div class="ch-edit-actions" id="ai-accept-row-${c.id}" style="display:none">
              <button class="btn sm" onclick="applyAiSuggestion('${c.id}')">✓ Accept into editor</button>
              <button class="btn sm secondary" onclick="discardAiSuggestion('${c.id}')">✕ Discard</button>
            </div>

            <!-- Save / cancel -->
            <div class="ch-edit-actions" style="margin-top:0.75rem;border-top:1px solid var(--border);padding-top:0.75rem">
              <button class="btn save-btn" onclick="saveEdit('${c.id}')">💾 Save</button>
              <button class="btn secondary" onclick="cancelEdit('${c.id}')">Cancel</button>
              <a href="chapter.html?book=${BOOK_ID}&id=${c.id}" class="btn sm secondary" style="margin-left:auto">Open full editor →</a>
            </div>
          </div>

          ${i < saved.length - 1 ? '<div class="chapter-separator">⁂</div>' : ''}
        </div>`
    }).join('')

    document.getElementById('chapters-content').innerHTML =
      `<p style="text-align:center;color:var(--muted);font-size:0.82rem;margin-bottom:2.5rem">
        ${saved.length} chapter${saved.length!==1?'s':''} · ${totalWords.toLocaleString()} words total
       </p>` + chaptersHTML

    // Wire up AI preview accept buttons (preview visibility toggling)
    saved.forEach(c => {
      const panel = document.getElementById(`edit-panel-${c.id}`)
      const preview = panel?.querySelector('.ch-edit-ai-preview')
      const acceptRow = document.getElementById(`ai-accept-row-${c.id}`)
      if (!preview || !acceptRow) return
      const obs = new MutationObserver(() => {
        acceptRow.style.display = preview.style.display === 'block' && preview.dataset.text ? 'flex' : 'none'
      })
      obs.observe(preview, { attributes: true, attributeFilter: ['style'], childList: false })
    })

    // Download
    document.getElementById('btn-download').onclick = () => {
      const text = `${book.title}\n${'='.repeat(book.title.length)}\n\n` +
        saved.map(c => {
          const content = c.user_edited_content || c.final_content
          return `Chapter ${c.chapter_number}${c.title ? ' — ' + c.title : ''}\n${'-'.repeat(40)}\n\n${content}`
        }).join('\n\n\n')
      const blob = new Blob([text], { type:'text/plain' })
      const a    = document.createElement('a')
      a.href     = URL.createObjectURL(blob)
      a.download = `${book.title.replace(/[^a-z0-9]/gi,'_')}.txt`
      a.click()
    }
  }

  window.scrollToChapter = num => {
    const el = document.getElementById(`ch-sec-${num}`)
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' })
  }

  function escapeHTML(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  // Convert basic markdown emphasis to HTML for display
  // Handles **bold**, *italic*, and _italic_ — nothing else
  function renderProse(str) {
    return escapeHTML(str||'')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,     '<em>$1</em>')
      .replace(/_(.+?)_/g,       '<em>$1</em>')
  }

  await load()
</script>

</body>
</html>
