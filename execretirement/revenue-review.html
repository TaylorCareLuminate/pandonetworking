<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Review - Executive Retirement Solutions</title>
    
    <!-- IMMEDIATE PROTECTION -->
    <script>
        document.documentElement.style.display = 'none';
    </script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase and Authentication Scripts -->
    <script src="../js/auth.js"></script>
    <script src="../js/folder-protection.js"></script>
    
    <!-- Revenue System Scripts -->
    <script src="js/revenue-calculator.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #1a365d;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .summary-card.total {
            background: linear-gradient(135deg, #1a365d 0%, #2d4a7c 100%);
            color: white;
        }

        .summary-card.installation {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .summary-card.ongoing {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .summary-card.annual {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .summary-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-label {
            font-size: 1em;
            opacity: 0.9;
        }

        /* Filter Section */
        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #d4af37;
            color: #1a365d;
        }

        .btn-primary:hover {
            background: #b8941f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-export {
            background: #10b981;
            color: white;
        }

        .btn-export:hover {
            background: #059669;
        }

        /* Client Cards */
        .clients-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-header h2 {
            color: #1a365d;
            font-size: 1.8em;
        }

        .client-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .client-card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .client-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 5px;
        }

        .client-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #666;
            font-size: 0.95em;
        }

        .client-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .revenue-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .revenue-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #d4af37;
        }

        .revenue-item.installation {
            border-left-color: #10b981;
        }

        .revenue-item.ongoing {
            border-left-color: #3b82f6;
        }

        .revenue-item.annual {
            border-left-color: #f59e0b;
        }

        .revenue-item.total {
            border-left-color: #1a365d;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .revenue-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }

        .revenue-value {
            font-size: 1.5em;
            font-weight: 700;
            color: #1a365d;
        }

        /* Plans Table */
        .plans-section {
            margin-top: 20px;
        }

        .plans-toggle {
            background: #e2e8f0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .plans-toggle:hover {
            background: #cbd5e1;
        }

        .plans-toggle.active {
            background: #d4af37;
            color: #1a365d;
        }

        .plans-details {
            display: none;
            margin-top: 15px;
            overflow-x: auto;
        }

        .plans-details.show {
            display: block;
        }

        .plans-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .plans-table th {
            background: #1a365d;
            color: white;
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85em;
            white-space: nowrap;
        }

        .plans-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }

        .plans-table tr:hover {
            background: #f8fafc;
        }

        /* Calculation columns */
        .plans-table td:nth-child(6),
        .plans-table td:nth-child(7),
        .plans-table td:nth-child(8) {
            font-family: 'Courier New', monospace;
            background: #fafafa;
            white-space: pre-line;
        }

        /* Loading and Empty States */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading i {
            font-size: 3em;
            color: #d4af37;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 4em;
            color: #d4af37;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .revenue-summary {
                grid-template-columns: 1fr;
            }

            .plans-table {
                font-size: 0.8em;
            }

            .plans-table th,
            .plans-table td {
                padding: 8px;
            }
        }

        /* Button Styles */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.85em;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #1a365d 0%, #2d4a7c 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            margin: 0;
            font-size: 1.5em;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-weight: 600;
            color: #1a365d;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-section-title {
            color: #1a365d;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <!-- Include Header -->
    <div id="header-container"></div>

    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="fas fa-file-invoice-dollar"></i> Revenue Review</h1>
            <p class="subtitle">Client-by-client revenue calculations from enhanced plan data</p>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card total">
                <div class="summary-value" id="total-revenue">$0</div>
                <div class="summary-label">Total Revenue</div>
            </div>
            <div class="summary-card installation">
                <div class="summary-value" id="installation-revenue">$0</div>
                <div class="summary-label">Installation</div>
            </div>
            <div class="summary-card ongoing">
                <div class="summary-value" id="ongoing-revenue">$0</div>
                <div class="summary-label">Ongoing (BPS)</div>
            </div>
            <div class="summary-card annual">
                <div class="summary-value" id="annual-revenue">$0</div>
                <div class="summary-label">Annual Fees</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="search">Search Client</label>
                    <input type="text" id="search" placeholder="Search by client name...">
                </div>
                <div class="filter-group">
                    <label for="provider-filter">Provider</label>
                    <select id="provider-filter">
                        <option value="">All Providers</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sort">Sort By</label>
                    <select id="sort">
                        <option value="name">Client Name (A-Z)</option>
                        <option value="revenue-desc">Revenue (High to Low)</option>
                        <option value="revenue-asc">Revenue (Low to High)</option>
                        <option value="plans-desc">Number of Plans (High to Low)</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <i class="fas fa-filter"></i> Apply Filters
                </button>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    <i class="fas fa-redo"></i> Reset
                </button>
                <button class="btn btn-export" onclick="exportToCSV()">
                    <i class="fas fa-file-csv"></i> Export CSV
                </button>
            </div>
        </div>

        <!-- Clients Container -->
        <div class="clients-container">
            <div class="section-header">
                <h2>Client Revenue Breakdown</h2>
                <span id="client-count">Loading...</span>
            </div>
            <div id="clients-list">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading revenue data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let revenueCalculator;
        let allPlans = [];
        let clientsData = [];
        let filteredClientsData = [];

        // Global function for header dropdown (needed before header loads)
        window.toggleDropdown = function(dropdownId) {
            // Will be overridden by header.html when it loads
            console.log('Header not loaded yet');
        };

        // Load header
        document.addEventListener('DOMContentLoaded', function() {
            fetch('header.html')
                .then(response => response.text())
                .then(html => {
                    const container = document.getElementById('header-container');
                    container.innerHTML = html;
                    
                    // Execute any scripts in the loaded HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.head.appendChild(newScript);
                        oldScript.remove();
                    });
                })
                .catch(error => console.error('Error loading header:', error));
        });

        // Authentication callback - called by auth.js when auth state changes
        window.hotsheetAuthCheck = function(authState) {
            if (authState.isLoggedIn && authState.isVerified && !authState.isChecking) {
                initializePage();
                document.documentElement.style.display = '';
            } else if (!authState.isChecking && !authState.isLoggedIn) {
                window.redirectToLogin('Please log in to access Revenue Review.');
            }
        };

        // Backup initialization in case auth is already ready
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.auth && window.auth.currentUser) {
                    initializePage();
                    document.documentElement.style.display = '';
                }
            }, 2000);
        });

        async function initializePage() {
            console.log('🚀 Initializing Revenue Review page...');
            
            try {
                // Initialize revenue calculator
                revenueCalculator = new RevenueCalculator();
                await revenueCalculator.initialize();
                
                // Load plans data
                await loadPlansData();
                
                // Process and display
                processClientData();
                populateFilters();
                renderClients();
                
            } catch (error) {
                console.error('❌ Error initializing page:', error);
                document.getElementById('clients-list').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error Loading Data</h3>
                        <p>Unable to load revenue data. Please refresh the page.</p>
                    </div>
                `;
            }
        }

        async function loadPlansData() {
            try {
                const { getDatabase, ref, get } = 
                    await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
                
                const database = getDatabase(window.firebaseApp);
                const plansRef = ref(database, 'ers/revenue_plans');
                
                const snapshot = await get(plansRef);
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    allPlans = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                    
                    console.log(`✅ Loaded ${allPlans.length} plans`);
                } else {
                    allPlans = [];
                    console.warn('⚠️ No plans data found');
                }
                
            } catch (error) {
                console.error('❌ Error loading plans:', error);
                throw error;
            }
        }

        function processClientData() {
            // Group plans by client (using plan name as client identifier)
            const clientMap = new Map();
            
            allPlans.forEach(plan => {
                const clientName = plan.planName || plan.name || 'Unknown Client';
                
                if (!clientMap.has(clientName)) {
                    clientMap.set(clientName, {
                        name: clientName,
                        plans: [],
                        providers: new Set(),
                        totalRevenue: 0,
                        installationRevenue: 0,
                        ongoingRevenue: 0,
                        annualFees: 0
                    });
                }
                
                const client = clientMap.get(clientName);
                client.plans.push(plan);
                
                // Use recordKeeperName for grouping (standardized name)
                const recordKeeper = plan.recordKeeperName || plan.provider;
                if (recordKeeper) {
                    client.providers.add(recordKeeper);
                }
                
                // Calculate revenue for this plan
                const revenue = calculatePlanRevenue(plan);
                client.installationRevenue += revenue.installation;
                client.ongoingRevenue += revenue.ongoing;
                client.annualFees += revenue.annualFees;
                client.totalRevenue += revenue.total;
            });
            
            // Convert to array
            clientsData = Array.from(clientMap.values()).map(client => ({
                ...client,
                providers: Array.from(client.providers),
                planCount: client.plans.length
            }));
            
            // Sort by name initially
            clientsData.sort((a, b) => a.name.localeCompare(b.name));
            
            filteredClientsData = [...clientsData];
            
            console.log(`✅ Processed ${clientsData.length} clients`);
        }

        function calculatePlanRevenue(plan) {
            const revenue = {
                installation: 0,
                ongoing: 0,
                annualFees: 0,
                total: 0
            };
            
            try {
                // Use recordKeeperName (standardized) instead of provider (raw imported)
                const recordKeeper = plan.recordKeeperName || plan.provider;
                
                // Installation payment
                if (plan.installationPaymentAmount) {
                    revenue.installation = plan.installationPaymentAmount;
                } else if (plan.assets && plan.deposits && recordKeeper) {
                    revenue.installation = revenueCalculator.calculateInstallationPayment(
                        plan.assets,
                        plan.deposits,
                        recordKeeper
                    );
                }
                
                // Ongoing BPS revenue
                if (plan.bpsEligible && plan.assets && recordKeeper) {
                    revenue.ongoing = revenueCalculator.calculateOngoingRevenue(
                        plan.assets,
                        recordKeeper
                    );
                    
                    // Add additional BPS if built in
                    if (plan.additionalBpsBuiltIn) {
                        revenue.ongoing += (plan.assets * (plan.additionalBpsBuiltIn / 10000));
                    }
                }
                
                // Annual fees
                if (plan.fees) {
                    const fees = plan.fees;
                    revenue.annualFees = (fees.admin || 0) + 
                                       (fees.annualAdmin || 0) + 
                                       (fees.audit || 0) + 
                                       (fees.consulting || 0) +
                                       (fees.participantTotal || 0);
                }
                
                revenue.total = revenue.installation + revenue.ongoing + revenue.annualFees;
                
            } catch (error) {
                console.warn(`⚠️ Error calculating revenue for plan ${plan.name}:`, error);
            }
            
            return revenue;
        }

        function populateFilters() {
            // Populate provider filter
            const providers = new Set();
            allPlans.forEach(plan => {
                if (plan.provider) providers.add(plan.provider);
            });
            
            const providerFilter = document.getElementById('provider-filter');
            Array.from(providers).sort().forEach(provider => {
                const option = document.createElement('option');
                option.value = provider;
                option.textContent = provider;
                providerFilter.appendChild(option);
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const providerFilter = document.getElementById('provider-filter').value;
            const sortBy = document.getElementById('sort').value;
            
            // Filter
            filteredClientsData = clientsData.filter(client => {
                const matchesSearch = !searchTerm || 
                    client.name.toLowerCase().includes(searchTerm);
                
                const matchesProvider = !providerFilter || 
                    client.providers.includes(providerFilter);
                
                return matchesSearch && matchesProvider;
            });
            
            // Sort
            switch(sortBy) {
                case 'revenue-desc':
                    filteredClientsData.sort((a, b) => b.totalRevenue - a.totalRevenue);
                    break;
                case 'revenue-asc':
                    filteredClientsData.sort((a, b) => a.totalRevenue - b.totalRevenue);
                    break;
                case 'plans-desc':
                    filteredClientsData.sort((a, b) => b.planCount - a.planCount);
                    break;
                default:
                    filteredClientsData.sort((a, b) => a.name.localeCompare(b.name));
            }
            
            renderClients();
        }

            document.getElementById('search').value = '';
            document.getElementById('provider-filter').value = '';
            document.getElementById('sort').value = 'name';
            applyFilters();

        function renderClients() {
            // Update summary cards
            const totals = filteredClientsData.reduce((acc, client) => {
                acc.total += client.totalRevenue;
                acc.installation += client.installationRevenue;
                acc.ongoing += client.ongoingRevenue;
                acc.annual += client.annualFees;
                return acc;
            }, { total: 0, installation: 0, ongoing: 0, annual: 0 });
            
            document.getElementById('total-revenue').textContent = formatCurrency(totals.total);
            document.getElementById('installation-revenue').textContent = formatCurrency(totals.installation);
            document.getElementById('ongoing-revenue').textContent = formatCurrency(totals.ongoing);
            document.getElementById('annual-revenue').textContent = formatCurrency(totals.annual);
            
            // Update client count
            document.getElementById('client-count').textContent = 
                `${filteredClientsData.length} client${filteredClientsData.length !== 1 ? 's' : ''}`;
            
            // Render clients
            const container = document.getElementById('clients-list');
            
            if (filteredClientsData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No Clients Found</h3>
                        <p>Try adjusting your filters or search criteria.</p>

                `;
                return;
            }
            
            container.innerHTML = filteredClientsData.map(client => createClientCard(client)).join('');
        }

        // Helper function to calculate year-by-year revenue for a plan
        function calculateYearByYearRevenue(plan) {
            const currentYear = new Date().getFullYear();
            const startYear = parseInt(plan.startYear || plan.workYear || currentYear);
            const termYear = plan.termDate ? new Date(plan.termDate).getFullYear() : currentYear + 5;
            
            const yearlyBreakdown = [];
            const revenue = calculatePlanRevenue(plan);
            
            // Add ancillary fees to total
            let ancillaryTotal = 0;
            if (plan.ancillaryFees && plan.ancillaryFees.length > 0) {
                ancillaryTotal = plan.ancillaryFees.reduce((sum, fee) => sum + (fee.amount || 0), 0);
            }
            
            for (let year = startYear; year <= Math.min(termYear, currentYear + 10); year++) {
                // Check if there's a custom yearly revenue entry
                const customRevenue = plan.yearlyRevenue?.find(entry => entry.year === year);
                
                if (customRevenue) {
                    // Use custom revenue amount with multiplier
                    yearlyBreakdown.push({
                        year: year,
                        revenue: customRevenue.amount * (customRevenue.multiplier || 1.0),
                        type: 'Custom',
                        isFirstYear: year === startYear
                    });
                } else if (year === startYear) {
                    // First year: Installation + Ongoing + Annual Fees + Ancillary
                    yearlyBreakdown.push({
                        year: year,
                        revenue: revenue.installation + revenue.ongoing + revenue.annualFees + ancillaryTotal,
                        type: 'First Year (Installation + Ongoing)',
                        isFirstYear: true
                    });
                } else {
                    // Subsequent years: Ongoing + Annual Fees only
                    yearlyBreakdown.push({
                        year: year,
                        revenue: revenue.ongoing + revenue.annualFees,
                        type: 'Ongoing',
                        isFirstYear: false
                    });
                }
            }
            
            return yearlyBreakdown;
        }

        function createPlansTable(plans) {
            return `
                <div style="margin-bottom: 15px; padding: 15px; background: #f0f9ff; border-left: 4px solid #3b82f6; border-radius: 8px;">
                    <strong>Legend:</strong> 
                    <span style="color: #3b82f6; margin-left: 15px;">🏦 Blue = Record Keeper Rates</span>
                    <span style="color: #059669; margin-left: 15px;">📊 Green = Plan Data</span>
                </div>
                <table class="plans-table">
                    <thead>
                        <tr>
                            <th>Plan Name</th>
                            <th>Provider</th>
                            <th>Status</th>
                            <th>Assets<br><small style="color: #059669;">📊 Plan Data</small></th>
                            <th>Deposits<br><small style="color: #059669;">📊 Plan Data</small></th>
                            <th>Participants<br><small style="color: #059669;">📊 Plan Data</small></th>
                            <th>Year-over-Year Revenue<br><small style="color: #059669;">📊 Custom</small></th>
                            <th>Ancillary Fees<br><small style="color: #059669;">📊 Custom</small></th>
                            <th>Installation Calculation</th>
                            <th>Ongoing Calculation</th>
                            <th>Annual Fees<br><small style="color: #059669;">📊 Plan Data</small></th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${plans.map(plan => {
                            const revenue = calculatePlanRevenue(plan);
                            const recordKeeper = plan.recordKeeperName || plan.provider || 'Unknown';
                            const rules = revenueCalculator.getProviderRules(recordKeeper);
                            
                            // Build year-over-year revenue display
                            let yearlyRevenueDisplay = 'N/A';
                            const yearByYearData = calculateYearByYearRevenue(plan);
                            if (yearByYearData.length > 0) {
                                const yearlyItems = yearByYearData.map(entry => {
                                    const yearLabel = entry.isFirstYear ? `<strong>${entry.year}</strong>` : `${entry.year}`;
                                    const typeLabel = entry.type === 'Custom' ? ' <em>(Custom)</em>' : '';
                                    return `${yearLabel}: ${formatCurrency(entry.revenue)}${typeLabel}`;
                                }).join('<br>');
                                yearlyRevenueDisplay = `<span style="color: #059669;">${yearlyItems}</span>`;
                            } else if (plan.yearlyRevenue && plan.yearlyRevenue.length > 0) {
                                // Fallback to old display if calculation fails
                                const yearlyItems = plan.yearlyRevenue.map(entry => {
                                    const adjustedAmount = entry.amount * (entry.multiplier || 1.0);
                                    const multiplierText = entry.multiplier && entry.multiplier !== 1.0 ? ` (${(entry.multiplier * 100).toFixed(0)}%)` : '';
                                    return `${entry.year}: ${formatCurrency(adjustedAmount)}${multiplierText}`;
                                }).join('<br>');
                                yearlyRevenueDisplay = `<span style="color: #059669;">${yearlyItems}</span>`;
                            }
                            
                            // Build ancillary fees display
                            let ancillaryDisplay = 'N/A';
                            if (plan.ancillaryFees && plan.ancillaryFees.length > 0) {
                                const feeItems = plan.ancillaryFees.map(fee => {
                                    const typeLabel = {
                                        'restatement': 'Restatement',
                                        'transaction': 'Transaction',
                                        'forceout': 'Force-Out',
                                        'amendment': 'Plan Amendment',
                                        'lost_earnings': 'Lost Earnings',
                                        'special_project': 'Special Project',
                                        'other': 'Other'
                                    }[fee.type] || fee.type;
                                    return `${typeLabel}: ${formatCurrency(fee.amount)}`;
                                }).join('<br>');
                                ancillaryDisplay = `<span style="color: #059669;">${feeItems}</span>`;
                                
                                // Add ancillary fees to total revenue
                                const ancillaryTotal = plan.ancillaryFees.reduce((sum, fee) => sum + (fee.amount || 0), 0);
                                revenue.total += ancillaryTotal;
                            }
                            
                            // Show term date if applicable
                            const statusBadge = plan.status === 'terminated' && plan.termDate ? 
                                `<span style="color: #dc2626; font-size: 0.85em;">Termed: ${new Date(plan.termDate).toLocaleDateString()}</span>` : 
                                plan.status || 'Active';
                            
                            // Build installation calculation string with source indicators
                            let installCalc = 'N/A';
                            if (plan.installationPaymentAmount) {
                                installCalc = `<span style="color: #059669;">Manual Entry: ${formatCurrency(plan.installationPaymentAmount)}</span>`;
                            } else if (rules && plan.assets && plan.deposits) {
                                const assetsRate = (rules.installRateAssets * 100).toFixed(2);
                                const depositsRate = (rules.installRateDeposits * 100).toFixed(2);
                                const assetsAmount = Math.round(plan.assets * rules.installRateAssets);
                                const depositsAmount = Math.round(plan.deposits * rules.installRateDeposits);
                                installCalc = `(<span style="color: #059669;" title="From Plan Data">${formatCurrency(plan.assets)}</span> × <span style="color: #3b82f6;" title="From Record Keeper">${assetsRate}%</span>) + (<span style="color: #059669;" title="From Plan Data">${formatCurrency(plan.deposits)}</span> × <span style="color: #3b82f6;" title="From Record Keeper">${depositsRate}%</span>)<br>= ${formatCurrency(assetsAmount)} + ${formatCurrency(depositsAmount)}<br>= <strong>${formatCurrency(revenue.installation)}</strong>`;
                            }
                            
                            // Build ongoing calculation string with source indicators
                            let ongoingCalc = 'N/A';
                            if (rules && plan.bpsEligible && plan.assets) {
                                if (rules.ongoingRequiresBuiltIn || rules.ongoingRateAssets === null) {
                                    ongoingCalc = '<span style="color: #3b82f6;" title="From Record Keeper Rules">Must build in</span><br>(no direct payment)';
                                } else {
                                    const ongoingRate = (rules.ongoingRateAssets * 100).toFixed(3);
                                    const bps = (rules.ongoingRateAssets * 10000).toFixed(0);
                                    ongoingCalc = `<span style="color: #059669;" title="From Plan Data">${formatCurrency(plan.assets)}</span> × <span style="color: #3b82f6;" title="From Record Keeper">${ongoingRate}% (${bps} bps)</span><br>= <strong>${formatCurrency(revenue.ongoing)}</strong>`;
                                    
                                    if (plan.additionalBpsBuiltIn) {
                                        const additionalAmount = Math.round(plan.assets * (plan.additionalBpsBuiltIn / 10000));
                                        ongoingCalc += `<br><em style="color: #059669;">+ Plan's Additional ${plan.additionalBpsBuiltIn} bps: ${formatCurrency(additionalAmount)}</em>`;
                                    }
                                }
                            } else if (!plan.bpsEligible) {
                                ongoingCalc = '<span style="color: #059669;" title="From Plan Data">Plan not BPS eligible</span>';
                            }
                            
                            // Show participant billing type
                            const participantInfo = plan.billingType === 'eligible' && plan.eligibleParticipants ? 
                                `${plan.participants || 0} Active / ${plan.eligibleParticipants} Eligible` : 
                                `${plan.participants || 0}`;
                            
                            // Build annual fees breakdown with source indicator
                            let feesCalc = '<span style="color: #059669;" title="All from Plan Data">';
                            if (plan.fees) {
                                const feeItems = [];
                                if (plan.fees.admin || plan.fees.annualAdmin) {
                                    feeItems.push(`Admin: ${formatCurrency(plan.fees.admin || plan.fees.annualAdmin)}`);
                                }
                                if (plan.fees.audit) {
                                    feeItems.push(`Audit: ${formatCurrency(plan.fees.audit)}`);
                                }
                                if (plan.fees.consulting) {
                                    feeItems.push(`Consulting: ${formatCurrency(plan.fees.consulting)}`);
                                }
                                if (plan.fees.participantTotal) {
                                    feeItems.push(`Participant: ${formatCurrency(plan.fees.participantTotal)}`);
                                }
                                feesCalc += feeItems.join('<br>') || formatCurrency(0);
                            } else {
                                feesCalc += formatCurrency(0);
                            }
                            feesCalc += '</span>';
                            
                            return `
                                <tr>
                                    <td><strong>${escapeHtml(plan.name || plan.planName)}</strong></td>
                                    <td><strong style="color: #3b82f6;" title="Record Keeper">${escapeHtml(recordKeeper)}</strong></td>
                                    <td style="font-size: 0.85em;">${statusBadge}</td>
                                    <td style="color: #059669;">${formatCurrency(plan.assets || 0)}</td>
                                    <td style="color: #059669;">${formatCurrency(plan.deposits || 0)}</td>
                                    <td style="color: #059669;" title="${plan.billingType === 'eligible' ? 'Billing based on Eligible Participants' : 'Billing based on Active Participants'}">${participantInfo}</td>
                                    <td style="font-size: 0.85em; line-height: 1.4;">${yearlyRevenueDisplay}</td>
                                    <td style="font-size: 0.85em; line-height: 1.4;">${ancillaryDisplay}</td>
                                    <td style="font-size: 0.85em; line-height: 1.6;">${installCalc}</td>
                                    <td style="font-size: 0.85em; line-height: 1.6;">${ongoingCalc}</td>
                                    <td style="font-size: 0.85em; line-height: 1.4;">${feesCalc}</td>
                                    <td><strong>${formatCurrency(revenue.total)}</strong></td>
                                    <td>
                                        <button class="btn btn-sm btn-warning" onclick="editPlan('${plan.id}')" title="Edit Plan">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function togglePlans(element) {
            const toggle = element;
            const details = toggle.nextElementSibling;
            const icon = toggle.querySelector('.fa-chevron-down');
            
            toggle.classList.toggle('active');
            details.classList.toggle('show');
            
            if (details.classList.contains('show')) {
                icon.style.transform = 'rotate(180deg)';
            } else {
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function exportToCSV() {
            const headers = ['Client Name', 'Number of Plans', 'Providers', 'Installation Revenue', 
                           'Ongoing Revenue', 'Annual Fees', 'Total Revenue'];
            
            const rows = filteredClientsData.map(client => [
                client.name,
                client.planCount,
                client.providers.join('; '),
                client.installationRevenue.toFixed(2),
                client.ongoingRevenue.toFixed(2),
                client.annualFees.toFixed(2),
                client.totalRevenue.toFixed(2)
            ]);
            
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(',') + '\n';
            });
            
            // Download
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `revenue-review-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount || 0);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

    <script>
        let currentEditPlan = null;

        function editPlan(planId) {
            const plan = allPlans.find(p => p.id === planId);
            if (!plan) {
                alert('Plan not found');
                return;
            }

            currentEditPlan = plan;
            
            // Populate modal
            document.getElementById('edit-modal-title').textContent = `Edit Plan: ${plan.name || plan.planName}`;
            document.getElementById('edit-plan-name').value = plan.name || plan.planName || '';
            document.getElementById('edit-plan-provider').value = (plan.provider || '').toLowerCase();
            document.getElementById('edit-plan-rep').value = (plan.rep || '').toLowerCase();
            document.getElementById('edit-plan-business-unit').value = (plan.businessUnit || 'dc').toLowerCase();
            document.getElementById('edit-plan-status').value = (plan.status || 'active').toLowerCase();
            document.getElementById('edit-plan-admin').value = (plan.admin || 'jacob').toLowerCase();
            document.getElementById('edit-plan-assets').value = plan.assets || 0;
            document.getElementById('edit-plan-deposits').value = plan.deposits || 0;
            document.getElementById('edit-plan-participants').value = plan.participants || 0;
            document.getElementById('edit-plan-bps-eligible').value = plan.bpsEligible ? 'true' : 'false';
            document.getElementById('edit-plan-first-billed').value = plan.firstBilled || '';
            document.getElementById('edit-plan-installation-payment-date').value = plan.installationPaymentDate || '';
            document.getElementById('edit-plan-installation-payment-amount').value = plan.installationPaymentAmount || 0;
            
            // Populate fees
            document.getElementById('edit-fee-admin').value = plan.fees?.admin || plan.fees?.annualAdmin || 0;
            document.getElementById('edit-fee-audit').value = plan.fees?.audit || 0;
            document.getElementById('edit-fee-document').value = plan.fees?.document || 0;
            document.getElementById('edit-fee-consulting').value = plan.fees?.consulting || 0;
            document.getElementById('edit-fee-participant').value = plan.fees?.participant || 0;
            
            // Show modal
            document.getElementById('edit-plan-modal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('edit-plan-modal').classList.remove('active');
            currentEditPlan = null;
        }

        async function savePlanChanges() {
            if (!currentEditPlan) return;

            try {
                // Get updated values
                const updatedPlan = {
                    ...currentEditPlan,
                    name: document.getElementById('edit-plan-name').value.trim(),
                    planName: document.getElementById('edit-plan-name').value.trim(),
                    provider: document.getElementById('edit-plan-provider').value,
                    recordKeeperName: document.getElementById('edit-plan-provider').value,
                    rep: document.getElementById('edit-plan-rep').value,
                    businessUnit: document.getElementById('edit-plan-business-unit').value,
                    status: document.getElementById('edit-plan-status').value,
                    admin: document.getElementById('edit-plan-admin').value,
                    assets: parseFloat(document.getElementById('edit-plan-assets').value) || 0,
                    deposits: parseFloat(document.getElementById('edit-plan-deposits').value) || 0,
                    participants: parseInt(document.getElementById('edit-plan-participants').value) || 0,
                    bpsEligible: document.getElementById('edit-plan-bps-eligible').value === 'true',
                    firstBilled: document.getElementById('edit-plan-first-billed').value,
                    installationPaymentDate: document.getElementById('edit-plan-installation-payment-date').value,
                    installationPaymentAmount: parseFloat(document.getElementById('edit-plan-installation-payment-amount').value) || 0,
                    fees: {
                        admin: parseFloat(document.getElementById('edit-fee-admin').value) || 0,
                        annualAdmin: parseFloat(document.getElementById('edit-fee-admin').value) || 0,
                        audit: parseFloat(document.getElementById('edit-fee-audit').value) || 0,
                        document: parseFloat(document.getElementById('edit-fee-document').value) || 0,
                        consulting: parseFloat(document.getElementById('edit-fee-consulting').value) || 0,
                        participant: parseFloat(document.getElementById('edit-fee-participant').value) || 0,
                        participantTotal: (parseFloat(document.getElementById('edit-fee-participant').value) || 0) * (parseInt(document.getElementById('edit-plan-participants').value) || 0)
                    },
                    lastUpdated: new Date().toISOString()
                };

                // Calculate eligibility
                updatedPlan.eligibility = {
                    bps: updatedPlan.bpsEligible,
                    installation: true,
                    ongoing: updatedPlan.bpsEligible
                };

                // Save to Firebase revenue_plans
                if (!window.firebaseRTDB) {
                    throw new Error('Firebase not initialized');
                }

                const dbRef = window.firebaseRTDB.ref(`ers/revenue_plans/${currentEditPlan.id}`);
                await window.firebaseRTDB.set(dbRef, updatedPlan);
                
                console.log('✅ Plan updated in revenue_plans');

                // Rebuild enriched dataset
                await rebuildEnrichedDataForPlan(currentEditPlan.id, updatedPlan);

                alert('Plan updated successfully!');
                
                // Reload the page to show updated data
                location.reload();

            } catch (error) {
                console.error('❌ Error saving plan:', error);
                alert('Error saving plan: ' + error.message);
            }
        }

        async function rebuildEnrichedDataForPlan(planId, planData) {
            console.log(`🔄 Rebuilding enriched dataset entry for plan: ${planId}`);
            
            try {
                // Load PensionPro data
                const ppData = await loadPensionProData();
                const ppMatches = await loadPensionProMatches();
                
                // Start with internal plan data as foundation
                const enrichedPlan = {
                    id: planId,
                    planName: planData.planName || planData.name,
                    name: planData.name || planData.planName,
                    ...planData,
                    dataSource: 'internal_only',
                    dataFormat: planData.dataFormat || 'manual',
                    lastUpdated: new Date().toISOString(),
                    enrichedAt: new Date().toISOString()
                };
                
                // Try to add PensionPro data
                if (ppData && ppData.records) {
                    const ppMatch = findPensionProMatch(planData, ppData.records, ppMatches, planId);
                    if (ppMatch) {
                        enrichWithPensionProData(enrichedPlan, ppMatch);
                        console.log(`✨ Added PensionPro data to plan: ${planData.planName || planData.name}`);
                    } else {
                        console.log(`ℹ️ No PensionPro match found (plan still saved with revenue data only)`);
                    }
                }
                
                // Save to enriched dataset
                const enrichedDbRef = window.firebaseRTDB.ref(`ers/enriched_revenue_plans/${planId}`);
                await window.firebaseRTDB.set(enrichedDbRef, enrichedPlan);
                
                console.log(`✅ Successfully rebuilt enriched dataset entry for plan: ${planId}`);
                
            } catch (error) {
                console.error(`❌ Error rebuilding enriched data for plan ${planId}:`, error);
            }
        }

        async function loadPensionProData() {
            try {
                const ppDataRef = window.firebaseRTDB.ref('ers/pensionpro_master_data');
                const snapshot = await window.firebaseRTDB.get(ppDataRef);
                
                if (snapshot.exists()) {
                    return snapshot.val();
                }
            } catch (error) {
                console.warn('⚠️ Could not load PensionPro data:', error);
            }
            return null;
        }

        async function loadPensionProMatches() {
            try {
                const matchesRef = window.firebaseRTDB.ref('ers/pensionpro_matches');
                const snapshot = await window.firebaseRTDB.get(matchesRef);
                
                if (snapshot.exists()) {
                    return snapshot.val();
                }
            } catch (error) {
                console.warn('⚠️ Could not load PensionPro matches:', error);
            }
            return null;
        }

        function findPensionProMatch(plan, ppRecords, ppMatches, planId) {
            // Check saved matches first
            if (ppMatches && ppMatches[planId]) {
                const matchedRowNumber = ppMatches[planId].ppRecordIds[0];
                const match = ppRecords.find(r => r.rowNumber === matchedRowNumber);
                if (match) return match;
            }
            
            // Fallback to fuzzy matching
            const planName = (plan.planName || plan.name || '').toLowerCase().trim();
            
            for (const record of ppRecords) {
                const clientName = (record.clientCompanyName || '').toLowerCase().trim();
                const ppPlanName = (record.planName || '').toLowerCase().trim();
                
                if (planName === clientName || planName === ppPlanName) {
                    return record;
                }
            }
            
            return null;
        }

        function enrichWithPensionProData(enrichedPlan, ppRecord) {
            enrichedPlan.pp_clientId = ppRecord.clientId;
            enrichedPlan.pp_clientInternalId = ppRecord.clientInternalId;
            enrichedPlan.pp_clientCompanyName = ppRecord.clientCompanyName;
            enrichedPlan.pp_clientStatus = ppRecord.clientStatus;
            enrichedPlan.pp_clientCategory = ppRecord.clientCategory;
            enrichedPlan.pp_clientCategoryDescription = ppRecord.clientCategoryDescription;
            enrichedPlan.pp_clientLocationName = ppRecord.clientLocationName;
            enrichedPlan.pp_planId = ppRecord.planId;
            enrichedPlan.pp_planName = ppRecord.planName;
            enrichedPlan.pp_planType = ppRecord.planType;
            enrichedPlan.pp_planTypeDescription = ppRecord.planTypeDescription;
            enrichedPlan.pp_primaryAdvisorFullName = ppRecord.primaryAdvisorFullName;
            enrichedPlan.pp_primaryAdvisorEmail = ppRecord.primaryAdvisorEmail;
            enrichedPlan.pp_allAdvisorsCount = ppRecord.allAdvisorsCount;
            enrichedPlan.pp_allAdvisorsNames = ppRecord.allAdvisorsNames;
            enrichedPlan.pp_projectNames = ppRecord.projectNames;
            
            // OVERWRITE: Status from PensionPro (if not empty)
            if (ppRecord.clientStatus && ppRecord.clientStatus.trim() !== '') {
                enrichedPlan.status = ppRecord.clientStatus;
                enrichedPlan.statusSource = 'pensionpro';
                console.log(`🔄 Overwrote status with PensionPro value: ${ppRecord.clientStatus}`);
            } else {
                enrichedPlan.statusSource = 'revenue';
            }
            
            enrichedPlan.pensionProEnriched = true;
            enrichedPlan.pensionProRecordId = ppRecord.rowNumber;
        }
    </script>
</body>
