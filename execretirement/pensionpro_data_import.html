<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PensionPro Data Import & Matching</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #1a365d;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .step-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #e2e8f0;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            color: #1e40af;
            font-size: 1.2em;
            font-weight: 600;
        }

        .step-number {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .upload-area {
            border: 3px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .upload-area.dragover {
            border-color: #2563eb;
            background: #dbeafe;
        }

        .upload-icon {
            font-size: 3em;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #1e40af;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .match-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .match-table th {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .match-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .match-table tr:hover {
            background: #f8fafc;
        }

        .confidence-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .confidence-high {
            background: #d1fae5;
            color: #065f46;
        }

        .confidence-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .confidence-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .match-select {
            width: 100%;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95em;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-matched {
            background: #d1fae5;
            color: #065f46;
        }

        .status-unmatched {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-review {
            background: #fef3c7;
            color: #92400e;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .pp-plan-item {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pp-plan-item:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .pp-plan-item.selected {
            border-color: #10b981;
            background: #d1fae5;
        }

        .match-checkbox {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="container">
        <h1>
            <i class="fas fa-exchange-alt"></i>
            PensionPro Data Import & Matching
        </h1>
        <p class="subtitle">Import PensionPro Master Client Data and match it to your existing revenue plans</p>

        <!-- Step 1: Auto-Loading Data -->
        <div class="step-section">
            <div class="step-header">
                <div class="step-number">1</div>
                <span>Loading Data</span>
            </div>
            <div id="loading-status">
                <div class="alert alert-info">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div>Loading PensionPro data and existing plans...</div>
                </div>
            </div>
        </div>

        <!-- Step 2: Auto-Match & Review -->
        <div class="step-section" id="matching-section" style="display: none;">
            <div class="step-header">
                <div class="step-number">2</div>
                <span>Review Matches</span>
            </div>
            <div class="stats-grid" id="stats-grid"></div>
            <div id="match-results" style="margin-top: 20px;"></div>
        </div>

        <!-- Step 3: Review & Confirm Matches -->
        <div class="step-section" id="review-section" style="display: none;">
            <div class="step-header">
                <div class="step-number">3</div>
                <span>Confirm Matches & Enrich Dataset</span>
            </div>
            <div id="match-table-container"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-primary" id="confirm-btn" onclick="confirmAndEnrich()">
                    <i class="fas fa-check"></i> Confirm Matches & Enrich Dataset
                </button>
                <button class="btn btn-secondary" onclick="exportMatches()">
                    <i class="fas fa-download"></i> Export Match Table
                </button>
                <button class="btn" onclick="deleteMatchTable()" style="background-color: #dc2626; color: white; border: none;">
                    <i class="fas fa-trash"></i> Delete Match Table (Start Over)
                </button>
            </div>
        </div>

        <!-- Step 4: PensionPro Data Sample -->
        <div class="step-section" id="sample-section" style="display: none;">
            <div class="step-header">
                <div class="step-number">4</div>
                <span>PensionPro Data Sample</span>
            </div>
            <div style="margin-bottom: 15px;">
                <button class="btn btn-secondary" onclick="toggleSampleData()" id="toggle-sample-btn">
                    <i class="fas fa-eye"></i> Show Sample Data
                </button>
            </div>
            <div id="sample-data-container" style="display: none; max-height: 400px; overflow: auto; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb;"></div>
        </div>

        <!-- Manual Match Search Modal -->
        <div class="modal" id="search-modal" style="display: none;">
            <div class="modal-content" style="max-width: 900px; max-height: 80vh; overflow-y: auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0;"><i class="fas fa-search"></i> Find Match for Plan</h2>
                    <button onclick="closeSearchModal()" style="background: none; border: none; font-size: 1.5em; cursor: pointer;">&times;</button>
                </div>
                <div id="search-plan-name" style="font-weight: bold; color: #1e40af; margin-bottom: 15px;"></div>
                <input type="text" id="search-input" placeholder="Search PensionPro plans..." 
                       style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1em; margin-bottom: 15px;"
                       onkeyup="filterPPPlans()">
                <div id="search-results" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loading-message">Processing...</p>
        </div>
    </div>

    <!-- Include required scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.0/papaparse.min.js"></script>
    
    <script>
        const RAILWAY_API_URL = 'https://railwayclemail-production.up.railway.app';
        
        let pensionProData = [];
        let existingPlans = [];
        let matches = [];
        let currentSearchMatchIndex = null;

        // PensionPro columns to import into enriched dataset
        const PENSIONPRO_COLUMNS = [
            'clientId', 'clientInternalId', 'clientCompanyName', 'clientStatus',
            'clientCategory', 'clientCategoryDescription', 'clientIsDeactivated',
            'clientLocationName', 'clientURL', 'planId', 'planName', 'planType',
            'planTypeDescription', 'planIsDeactivated', 'primaryAdvisorContactId',
            'primaryAdvisorFirstName', 'primaryAdvisorLastName', 'primaryAdvisorFullName',
            'primaryAdvisorEmail', 'primaryAdvisorRole', 'primaryAdvisorIsInvestmentAdvisor',
            'allAdvisorsCount', 'allAdvisorsNames', 'allAdvisorsRoles',
            'projectNames', 'projectStatuses', 'projectTypes'
        ];

        // Initialize page - AUTO-LOAD DATA
        async function initializePage() {
            console.log('🔄 Initializing PensionPro Data Import page...');
            
            // Load header
            try {
                const response = await fetch('header.html');
                const headerHTML = await response.text();
                document.getElementById('header-container').innerHTML = headerHTML;
                
                // Execute any scripts in the header
                const scripts = document.getElementById('header-container').querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
                
                console.log('✅ Header loaded');
            } catch (error) {
                console.error('❌ Error loading header:', error);
            }

            // Wait for Firebase to initialize before loading data
            console.log('⏳ Waiting for Firebase to initialize...');
        }

        // Auto-load data on startup
        async function autoLoadData() {
            try {
                document.getElementById('loading-status').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-spinner fa-spin"></i>
                        <div>Fetching PensionPro data...</div>
                    </div>
                `;
                
                await fetchPensionProData();
                
                document.getElementById('loading-status').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-spinner fa-spin"></i>
                        <div>Loading existing plans from Firebase...</div>
                    </div>
                `;
                
                await loadExistingPlans();
                
                document.getElementById('loading-status').innerHTML = `
                    <div class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <div>
                            <strong>Data loaded successfully!</strong><br>
                            ${pensionProData.length} PensionPro records, ${existingPlans.length} existing plans
                        </div>
                    </div>
                `;
                
                // Auto-perform matching
                document.getElementById('loading-status').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-spinner fa-spin"></i>
                        <div>Performing automatic matching...</div>
                    </div>
                `;
                
                await performAutoMatching();
                
                // Load and apply saved matches
                const savedMatches = await loadSavedMatches();
                if (savedMatches) {
                    applySavedMatches(savedMatches);
                    
                    document.getElementById('loading-status').innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i>
                            <div>
                                <strong>Ready!</strong><br>
                                Data loaded and previous matches restored.
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('loading-status').innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i>
                            <div>
                                <strong>Ready!</strong><br>
                                Data loaded and matched.
                            </div>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Error auto-loading data:', error);
                document.getElementById('loading-status').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <strong>Error loading data:</strong><br>
                            ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Load saved matches from Firebase
        async function loadSavedMatches() {
            try {
                const matchesRef = window.firebaseRTDB.ref('ers/pensionpro_matches');
                const snapshot = await window.firebaseRTDB.get(matchesRef);
                
                if (snapshot.exists()) {
                    const savedMatches = snapshot.val();
                    console.log(`📋 Loaded ${Object.keys(savedMatches).length} saved matches from Firebase`);
                    return savedMatches;
                } else {
                    console.log('📋 No saved matches found');
                }
            } catch (error) {
                console.warn('⚠️ Could not load saved matches:', error);
            }
            return null;
        }

        // Apply saved matches to current matching session
        function applySavedMatches(savedMatches) {
            if (!savedMatches) return;
            
            let appliedCount = 0;
            
            matches.forEach(match => {
                const savedMatch = savedMatches[match.plan.id];
                if (savedMatch && savedMatch.ppRecordIds) {
                    // Find PP records by their row numbers
                    match.selectedPPRecords = savedMatch.ppRecordIds
                        .map(rowNum => pensionProData.find(r => r.rowNumber === rowNum))
                        .filter(Boolean);
                    
                    if (match.selectedPPRecords.length > 0) {
                        appliedCount++;
                        console.log(`✅ Applied saved match for "${match.plan.planName || match.plan.name}": ${match.selectedPPRecords.length} PP records`);
                    }
                }
            });
            
            if (appliedCount > 0) {
                console.log(`✅ Applied ${appliedCount} saved matches`);
                displayMatchTable();
            }
        }

        // Save matches to Firebase
        async function saveMatches() {
            try {
                const matchData = {};
                matches.forEach(match => {
                    if (match.selectedPPRecords && match.selectedPPRecords.length > 0) {
                        matchData[match.plan.id] = {
                            planId: match.plan.id,
                            planName: match.plan.planName || match.plan.name,
                            ppRecordIds: match.selectedPPRecords.map(r => r.rowNumber),
                            selectedCount: match.selectedPPRecords.length,
                            confidence: match.confidence,
                            matchedAt: new Date().toISOString()
                        };
                    }
                });
                
                const matchesRef = window.firebaseRTDB.ref('ers/pensionpro_matches');
                await window.firebaseRTDB.set(matchesRef, matchData);
                
                console.log(`✅ Saved ${Object.keys(matchData).length} matches to Firebase (${Object.values(matchData).reduce((sum, m) => sum + m.selectedCount, 0)} total PP records)`);
            } catch (error) {
                console.error('❌ Error saving matches:', error);
            }
        }

        // Fetch PensionPro data from API
        async function fetchPensionProData() {
            console.log('📡 Fetching PensionPro data from API...');

            try {
                const masterData = [];
                
                // Step 1: Fetch Clients
                console.log('Step 1/4: Fetching clients...');
                const clientParams = {
                    '$top': 1000,
                    '$expand': 'CompanyName,Status,Location,Category,CurrentEmployerData,CurrentEmployerData/EntityType,CurrentEmployerData/PayrollFrequency'
                };
                const clientsResponse = await callPensionProAPI('/clients', clientParams);
                let clientsArray = Array.isArray(clientsResponse) ? clientsResponse : 
                    (clientsResponse.Values || clientsResponse.value || clientsResponse.data || [clientsResponse]);
                console.log(`✅ Fetched ${clientsArray.length} clients`);
                
                // Step 2: Fetch Plans
                console.log('Step 2/4: Fetching plans...');
                const planParams = {
                    '$top': 2000,
                    '$expand': 'PlanType,Client,Client/CompanyName'
                };
                const plansResponse = await callPensionProAPI('/plans', planParams);
                let plansArray = Array.isArray(plansResponse) ? plansResponse : 
                    (plansResponse.Values || plansResponse.value || plansResponse.data || [plansResponse]);
                console.log(`✅ Fetched ${plansArray.length} plans`);
                
                // Step 3: Fetch Plan Contact Roles (Advisors)
                console.log('Step 3/4: Fetching advisors...');
                const roleParams = {
                    '$top': 5000,
                    '$expand': 'Contact,Contact/CompanyName,RoleType'
                };
                const rolesResponse = await callPensionProAPI('/plancontactroles', roleParams);
                let rolesArray = Array.isArray(rolesResponse) ? rolesResponse : 
                    (rolesResponse.Values || rolesResponse.value || rolesResponse.data || [rolesResponse]);
                console.log(`✅ Fetched ${rolesArray.length} plan contact roles`);
                
                // Step 4: Fetch PPS Projects
                console.log('Step 4/4: Fetching projects...');
                const projectParams = {
                    '$top': 2000,
                    '$expand': 'PpsProjectPlanLink,PpsProjectType,AssignedTo'
                };
                const projectsResponse = await callPensionProAPI('/ppsProjects', projectParams);
                let projectsArray = Array.isArray(projectsResponse) ? projectsResponse : 
                    (projectsResponse.Values || projectsResponse.value || projectsResponse.data || [projectsResponse]);
                console.log(`✅ Fetched ${projectsArray.length} PPS projects`);
                
                // Build lookup tables
                const plansByClient = {};
                plansArray.forEach(plan => {
                    if (plan.ClientId) {
                        if (!plansByClient[plan.ClientId]) {
                            plansByClient[plan.ClientId] = [];
                        }
                        plansByClient[plan.ClientId].push(plan);
                    }
                });
                
                const advisorsByPlan = {};
                rolesArray.forEach(role => {
                    if (role.PlanId) {
                        if (!advisorsByPlan[role.PlanId]) {
                            advisorsByPlan[role.PlanId] = [];
                        }
                        const roleName = role.RoleType?.DisplayName || '';
                        advisorsByPlan[role.PlanId].push({
                            contactId: role.ContactId || 0,
                            contactFirstName: role.Contact?.FirstName || '',
                            contactLastName: role.Contact?.LastName || '',
                            contactEmail: role.Contact?.Email || '',
                            contactPhone: role.Contact?.Phone || '',
                            contactCompany: role.Contact?.CompanyName?.DisplayName || '',
                            isInvestmentAdvisor: roleName.toLowerCase().includes('investment advisor'),
                            roleName: roleName
                        });
                    }
                });
                
                const projectsByClient = {};
                projectsArray.forEach(project => {
                    let clientId = project.ClientId;
                    if (!clientId && project.PpsProjectPlanLink?.PlanId) {
                        const planId = project.PpsProjectPlanLink.PlanId;
                        const associatedPlan = plansArray.find(p => p.Id === planId);
                        if (associatedPlan) {
                            clientId = associatedPlan.ClientId;
                        }
                    }
                    if (clientId) {
                        if (!projectsByClient[clientId]) {
                            projectsByClient[clientId] = [];
                        }
                        projectsByClient[clientId].push(project);
                    }
                });
                
                // Build flat master dataset
                console.log('Building flat master dataset...');
                const timestamp = new Date().toISOString();
                let rowNumber = 0;
                
                for (const client of clientsArray) {
                    const clientId = client.Id;
                    const clientPlans = plansByClient[clientId] || [];
                    const clientProjects = projectsByClient[clientId] || [];
                    
                    if (clientPlans.length === 0) {
                        rowNumber++;
                        masterData.push(createFlatRow(client, null, [], clientProjects, rowNumber, timestamp));
                    } else {
                        for (const plan of clientPlans) {
                            const planAdvisors = advisorsByPlan[plan.Id] || [];
                            rowNumber++;
                            masterData.push(createFlatRow(client, plan, planAdvisors, clientProjects, rowNumber, timestamp));
                        }
                    }
                }
                
                pensionProData = masterData;
                console.log(`✅ Built ${pensionProData.length} rows of master data`);
                
                // Save to Firebase for future use
                await savePensionProDataToFirebase(masterData, timestamp);
                
            } catch (error) {
                console.error('❌ Error fetching PensionPro data:', error);
                throw error;
            }
        }

        // Save PensionPro master data to Firebase
        async function savePensionProDataToFirebase(data, timestamp) {
            try {
                console.log('💾 Saving PensionPro data to Firebase...');

        // Call PensionPro API
        async function callPensionProAPI(endpoint, params = {}, retryCount = 0) {
            try {
                const queryParams = new URLSearchParams(params).toString();
                const url = `${RAILWAY_API_URL}/api/pensionpro${endpoint}${queryParams ? '?' + queryParams : ''}`;
                
                console.log(`📡 API Call: ${endpoint}`);
                
                if (retryCount > 0) {
                    console.log(`🔄 Retry attempt: ${retryCount}`);
                }
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Error Response:', errorText);
                    
                    // Retry logic for 401 errors
                    if (response.status === 401 && retryCount < 2) {
                        console.warn(`⚠️ Got 401, waiting 2 seconds before retry ${retryCount + 1}/2...`);
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        return callPensionProAPI(endpoint, params, retryCount + 1);
                    }
                    
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                return data.Values || data.value || data.data || data;
            } catch (error) {
                console.error('❌ API Call Error:', error);
                throw error;
            }
        }

        // Perform automatic matching
        async function performAutoMatching() {
            console.log('🔗 Performing automatic matching...');

            matches = [];
            let autoMatched = 0;
            let needsReview = 0;

            // For each existing plan, find matching PensionPro records
            for (const plan of existingPlans) {
                const planName = (plan.planName || plan.name || '').toLowerCase().trim();
                
                // Find all PensionPro records for this client
                const clientMatches = pensionProData.filter(ppRecord => {
                    const clientName = (ppRecord.clientCompanyName || '').toLowerCase().trim();
                    const ppPlanName = (ppRecord.planName || '').toLowerCase().trim();
                    
                    // Match by client name (fuzzy) or exact plan name
                    const clientSimilarity = calculateSimilarity(planName, clientName);
                    const planSimilarity = calculateSimilarity(planName, ppPlanName);
                    
                    return clientSimilarity > 60 || planSimilarity > 70;
                });

                if (clientMatches.length > 0) {
                    // Find best match confidence
                    const bestMatch = clientMatches.reduce((best, current) => {
                        const bestScore = calculateSimilarity(planName, (best.clientCompanyName || '').toLowerCase());
                        const currentScore = calculateSimilarity(planName, (current.clientCompanyName || '').toLowerCase());
                        return currentScore > bestScore ? current : best;
                    });

                    const confidence = Math.max(
                        calculateSimilarity(planName, (bestMatch.clientCompanyName || '').toLowerCase()),
                        calculateSimilarity(planName, (bestMatch.planName || '').toLowerCase())
                    );

                    // AUTO-SELECT MULTIPLE: If multiple records have confidence >= 85, select ALL of them
                    const highConfidenceMatches = clientMatches.filter(record => {
                        const recordConfidence = Math.max(
                            calculateSimilarity(planName, (record.clientCompanyName || '').toLowerCase()),
                            calculateSimilarity(planName, (record.planName || '').toLowerCase())
                        );
                        return recordConfidence >= 85;
                    });

                    matches.push({
                        plan: plan,
                        ppRecords: clientMatches, // All matching PensionPro records (one-to-many)
                        selectedPPRecords: highConfidenceMatches.length > 0 ? highConfidenceMatches : [], // ARRAY of selected records
                        confidence: confidence,
                        needsReview: confidence < 85 || clientMatches.length === 0
                    });

                    if (confidence >= 85) {
                        autoMatched++;
                    } else {
                        needsReview++;
                    }
                } else {
                    // No match found
                    matches.push({
                        plan: plan,
                        ppRecords: [],
                        selectedPPRecords: [], // ARRAY (empty)
                        confidence: 0,
                        needsReview: true
                    });
                    needsReview++;
                }
            }

            console.log(`✅ Matching complete: ${autoMatched} auto-matched, ${needsReview} need review`);

            document.getElementById('match-results').innerHTML = `
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <strong>Matching Results:</strong><br>
                        ${autoMatched} high-confidence matches, ${needsReview} need review
                    </div>
                </div>
            `;

            updateStats();
            displayMatchTable();
            document.getElementById('matching-section').style.display = 'block';
            document.getElementById('review-section').style.display = 'block';
            document.getElementById('sample-section').style.display = 'block';
        }

        // Calculate string similarity (Levenshtein-based)
        function calculateSimilarity(str1, str2) {
            if (!str1 || !str2) return 0;
            
            str1 = str1.toLowerCase().trim();
            str2 = str2.toLowerCase().trim();
            
            if (str1 === str2) return 100;
            
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;
            
            if (longer.length === 0) return 100;
            
            const editDistance = levenshteinDistance(longer, shorter);
            return Math.round((1 - editDistance / longer.length) * 100);
        }

        function levenshteinDistance(str1, str2) {
            const matrix = [];
            
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            
            return matrix[str2.length][str1.length];
        }

        // Confirm matches and enrich dataset
        async function confirmAndEnrich() {
            // Count total enriched records (can be more than plans due to one-to-many matching)
            let totalEnrichedRecords = 0;
            matches.forEach(m => {
                totalEnrichedRecords += m.selectedPPRecords.length;
            });
            
            if (totalEnrichedRecords === 0) {
                alert('No matches to confirm. Please select at least one PensionPro record for each plan.');
                return;
            }

            const matchedPlans = matches.filter(m => m.selectedPPRecords.length > 0).length;

            if (!confirm(`Confirm matches and enrich the dataset?\n\n${matchedPlans} plans matched to ${totalEnrichedRecords} PensionPro records.\n\nThis will create ${totalEnrichedRecords} enriched records (one per PP plan match).`)) {
                return;
            }

            console.log('✅ Confirming matches and enriching dataset...');
            showLoading('Enriching dataset with PensionPro data...');

            try {
                let enrichedCount = 0;
                const enrichedRef = window.firebaseRTDB.ref('ers/enriched_revenue_plans');
                
                // For each match with selected PP records
                for (const match of matches) {
                    if (match.selectedPPRecords.length > 0) {
                        // ONE-TO-MANY: Create an enriched record for EACH selected PP record
                        for (const ppRecord of match.selectedPPRecords) {
                            // Extract PensionPro data
                            const ppData = {};
                            PENSIONPRO_COLUMNS.forEach(col => {
                                ppData[`pp_${col}`] = ppRecord[col] || null;
                            });

                            // Create unique ID for this enriched record
                            const enrichedId = `${match.plan.id}_pp${ppRecord.rowNumber}`;

                            // Get base plan data
                            const basePlanRef = window.firebaseRTDB.ref(`ers/revenue_plans/${match.plan.id}`);
                            const basePlanSnapshot = await window.firebaseRTDB.get(basePlanRef);
                            const basePlanData = basePlanSnapshot.val() || match.plan;

                            // Merge base plan + PensionPro data
                            const enrichedRecord = {
                                ...basePlanData,
                                ...ppData,
                                pensionProMatched: true,
                                pensionProMatchedAt: new Date().toISOString(),
                                pensionProMatchConfidence: match.confidence,
                                pensionProRecordId: ppRecord.rowNumber,
                                originalPlanId: match.plan.id
                            };

                            // Save to enriched dataset
                            await window.firebaseRTDB.set(
                                window.firebaseRTDB.ref(`ers/enriched_revenue_plans/${enrichedId}`),
                                enrichedRecord
                            );

                            enrichedCount++;
                        }
                    }
                }

                // Save match table to Firebase for future use
                await saveMatches();

                console.log(`✅ Enriched ${enrichedCount} records with PensionPro data`);
                
                hideLoading();
                alert(`Success! Created ${enrichedCount} enriched records from ${matchedPlans} matched plans.\n\nMatches have been saved for future use.`);
                
            } catch (error) {
                console.error('❌ Error enriching dataset:', error);
                alert('Error enriching dataset: ' + error.message);
                hideLoading();
            }
        }

                            <div><strong>Total Advisors:</strong> ${record.allAdvisorsCount || 0}</div>
                            <div><strong>Project Names:</strong> ${record.projectNames || 'None'}</div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('sample-data-container').innerHTML = html;
        }

        // Loading overlay helpers
        function showLoading(message) {
            document.getElementById('loading-message').textContent = message;
            document.getElementById('loading-overlay').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.remove('show');
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializePage);

        // Auth callback
        window.hotsheetAuthCheck = function(authState) {
            if (authState.isLoggedIn && authState.isVerified && !authState.isChecking) {
                console.log('✅ User authenticated');
                
                // Start auto-loading data now that Firebase is ready
                if (window.firebaseRTDB) {
                    console.log('✅ Firebase ready, starting auto-load...');
                    autoLoadData();
                } else {
                    console.error('❌ Firebase RTDB not available');
                }
            } else if (!authState.isChecking && !authState.isLoggedIn) {
                window.redirectToLogin('Please log in to access PensionPro Data Import.');
            }
        };
    </script>
</body>
</html>
