<!DOCTYPE html>
<html lang="en" class="protection-hide">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Process Campaigns - Team Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Hide page until folder protection completes */
        html.protection-hide body { display: none; }
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-content p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .controls-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
        }

        .search-box i {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .filter-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--secondary);
            white-space: nowrap;
        }

        .filter-group select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            min-width: 150px;
        }

        .campaign-tabs {
            display: flex;
            background: white;
            border-radius: var(--border-radius);
            padding: 0.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .tab-button {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            border-radius: calc(var(--border-radius) - 2px);
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-button.active {
            background: var(--primary);
            color: white;
        }

        .tab-button:hover:not(.active) {
            background: var(--light-gray);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .campaigns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .campaign-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .campaign-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .campaign-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.25rem;
        }

        .campaign-customer {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .campaign-status {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-paused {
            background: #fef3c7;
            color: #92400e;
        }

        .status-draft {
            background: #e0e7ff;
            color: #3730a3;
        }

        .status-archived {
            background: #f3f4f6;
            color: #374151;
        }

        .campaign-description {
            color: var(--gray);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .campaign-channels {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .channel-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .channel-email {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .channel-linkedin {
            background: #f0f9ff;
            color: #0284c7;
        }

        .channel-phone {
            background: #f0fdf4;
            color: #15803d;
        }

        .campaign-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--light-gray);
            border-radius: var(--border-radius);
            border: 1px solid var(--border);
        }

        .meta-item {
            text-align: center;
        }

        .meta-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--gray);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .training-status-section {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .training-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .training-badge {
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .training-completed {
            background: #dcfce7;
            color: #166534;
        }

        .training-in-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .training-not-started {
            background: #f3f4f6;
            color: #374151;
        }

        .campaign-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .empty-state p {
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--gray);
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-success {
            background: #dcfce7;
            border-color: #bbf7d0;
            color: #166534;
        }

        .alert-warning {
            background: #fffbeb;
            border-color: #fed7aa;
            color: #92400e;
        }

        .alert-danger {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .alert-info {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-value.total {
            color: var(--primary);
        }

        .stat-value.assigned {
            color: var(--success);
        }

        .stat-value.trained {
            color: var(--accent);
        }

        .stat-value.available {
            color: var(--warning);
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.875rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .missing-variable {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .content-preview {
            background: var(--light-gray);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-top: 0.5rem;
            font-family: inherit;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .content-tabs {
            display: flex;
            background: white;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .content-tab {
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            flex: 1;
            text-align: center;
        }

        .content-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--light-gray);
        }

        .content-tab:hover:not(.active) {
            background: var(--light-gray);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .notes-section {
            background: #fffbeb;
            border: 1px solid #fed7aa;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .notes-section h4 {
            color: #92400e;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .notes-textarea {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-family: inherit;
            resize: vertical;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--secondary);
        }

        .close {
            color: var(--gray);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close:hover {
            color: var(--secondary);
        }

        .modal-body {
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .page-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .header-content h1 {
                font-size: 2rem;
            }
            
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .campaigns-grid {
                grid-template-columns: 1fr;
            }
            
            .campaign-meta {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-bullhorn"></i>
                    In Process Campaigns
                </h1>
                <p>Browse all active campaigns, view details, and check your training status</p>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>

        <!-- Statistics Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value total" id="totalCampaigns">-</div>
                <div class="stat-label">Total Campaigns</div>
            </div>
            <div class="stat-card">
                <div class="stat-value assigned" id="assignedCampaigns">-</div>
                <div class="stat-label">Assigned to Me</div>
            </div>
            <div class="stat-card">
                <div class="stat-value trained" id="trainedCampaigns">-</div>
                <div class="stat-label">Fully Trained</div>
            </div>
            <div class="stat-card">
                <div class="stat-value available" id="availableCampaigns">-</div>
                <div class="stat-label">Available to Join</div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search campaigns by name, customer, or description...">
            </div>
            <div class="filter-group">
                <label>Customer:</label>
                <select id="customerFilter">
                    <option value="">All Customers</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Channel:</label>
                <select id="channelFilter">
                    <option value="">All Channels</option>
                    <option value="email">Email</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="phone">Phone</option>
                </select>
            </div>
            <div class="filter-group">
                <label>My Status:</label>
                <select id="trainingFilter">
                    <option value="">All Campaigns</option>
                    <option value="assigned">Assigned to Me</option>
                    <option value="completed">Fully Trained</option>
                    <option value="in-progress">Training In Progress</option>
                    <option value="not-started">Not Started</option>
                    <option value="available">Available to Join</option>
                </select>
            </div>
        </div>

        <!-- Campaign Tabs -->
        <div class="campaign-tabs">
            <button class="tab-button active" data-tab="active">
                <i class="fas fa-play"></i>
                Active Campaigns (<span id="activeCount">0</span>)
            </button>
            <button class="tab-button" data-tab="paused">
                <i class="fas fa-pause"></i>
                Paused Campaigns (<span id="pausedCount">0</span>)
            </button>
            <button class="tab-button" data-tab="draft">
                <i class="fas fa-edit"></i>
                Draft Campaigns (<span id="draftCount">0</span>)
            </button>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Loading campaigns...</p>
        </div>

        <!-- Tab Contents -->
        <div id="active-tab" class="tab-content active">
            <div id="activeCampaigns" class="campaigns-grid"></div>
        </div>

        <div id="paused-tab" class="tab-content">
            <div id="pausedCampaigns" class="campaigns-grid"></div>
        </div>

        <div id="draft-tab" class="tab-content">
            <div id="draftCampaigns" class="campaigns-grid"></div>
        </div>
    </div>

    <!-- Campaign Details Modal -->
    <div id="campaignModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Campaign Details</h2>
                <span class="close" onclick="closeCampaignModal()">&times;</span>
            </div>
            <div class="modal-body" id="campaignModalBody">
                <!-- Campaign details will be populated here -->
            </div>
        </div>
    </div>

    <!-- Load centralized auth system -->
    <script src="../js/auth.js"></script>
    <script src="../js/folder-protection.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script type="module">
        // Wait for auth and CLEmail wrapper
        await window.firebaseReady;
        
        // Use CLEmail secure wrapper
        const { collection, getDocs, doc, getDoc, updateDoc, addDoc, query, where, orderBy } = window.clemailFirestore;
        const db = window.clemailDb;
        
        console.log('🔒 CLEmail secure wrapper ready for team campaigns');

        // Global state
        let currentUser = null;
        let teamMemberData = null;
        let campaigns = [];
        let customers = [];
        let bracketVariables = [];
        let userNotes = {}; // Store user's personal notes for campaigns
        let filteredCampaigns = [];
        let currentTab = 'active';

        // Initialize the page
        async function initialize() {
            try {
                console.log('🚀 Initializing Team Campaigns page...');
                
                // Wait for auth to be ready
                if (window.authReady) {
                    await window.authReady;
                }

                // Get current user info
                if (window.auth?.currentUser) {
                    currentUser = window.auth.currentUser;
                    await loadTeamMemberData();
                    await loadCustomers();
                    await loadBracketVariables();
                    await loadUserNotes();
                    await loadCampaigns();
                    setupEventListeners();
                } else {
                    console.log('⚠️ No authenticated user found');
                    showAlert('Please log in to view campaigns', 'warning');
                }
                
            } catch (error) {
                console.error('❌ Failed to initialize campaigns page:', error);
                showAlert('Failed to load campaign data', 'danger');
            } finally {
                document.getElementById('loadingState').style.display = 'none';
            }
        }

        // Load team member data from Firestore
        async function loadTeamMemberData() {
            try {
                if (!currentUser?.email) return;

                console.log('👤 Loading team member data for:', currentUser.email);
                
                let teamMemberDoc = null;
                const normalizedEmail = currentUser.email.toLowerCase();
                
                // First, try to query by emailLower (case-insensitive, indexed)
                try {
                    const teamMembersQuery = query(
                        collection(db, 'teamMembers'),
                        where('emailLower', '==', normalizedEmail)
                    );
                    
                    const querySnapshot = await getDocs(teamMembersQuery);
                    
                    if (!querySnapshot.empty) {
                        teamMemberDoc = querySnapshot.docs[0];
                        console.log('✅ Found team member by emailLower');
                    }
                } catch (queryError) {
                    console.warn('⚠️ emailLower query failed (field may not exist on all docs):', queryError.message);
                }
                
                // Fallback: Query by regular email field (for backwards compatibility)
                if (!teamMemberDoc) {
                    console.log('🔄 Trying fallback query by email field...');
                    try {
                        const fallbackQuery = query(
                            collection(db, 'teamMembers'),
                            where('email', '==', currentUser.email)
                        );
                        
                        let fallbackSnapshot = await getDocs(fallbackQuery);
                        
                        if (!fallbackSnapshot.empty) {
                            teamMemberDoc = fallbackSnapshot.docs[0];
                            console.log('✅ Found team member by exact email match');
                        } else {
                            // Try case-insensitive search by loading all and filtering
                            console.log('🔄 Trying case-insensitive search across all team members...');
                            const allMembersSnapshot = await getDocs(collection(db, 'teamMembers'));
                            
                            for (const doc of allMembersSnapshot.docs) {
                                const data = doc.data();
                                if (data.email && data.email.toLowerCase() === normalizedEmail) {
                                    teamMemberDoc = doc;
                                    console.log('✅ Found team member by case-insensitive email search');
                                    break;
                                }
                            }
                        }
                    } catch (fallbackError) {
                        console.error('❌ Fallback query failed:', fallbackError);
                    }
                }
                
                if (teamMemberDoc) {
                    teamMemberData = { id: teamMemberDoc.id, ...teamMemberDoc.data() };

        // Apply filters and search
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const customerFilter = document.getElementById('customerFilter').value;
            const channelFilter = document.getElementById('channelFilter').value;
            const trainingFilter = document.getElementById('trainingFilter').value;

            filteredCampaigns = campaigns.filter(campaign => {
                // Search filter
                const matchesSearch = !searchTerm || 
                    campaign.name.toLowerCase().includes(searchTerm) ||
                    campaign.description?.toLowerCase().includes(searchTerm) ||
                    getCustomerName(campaign.customerId).toLowerCase().includes(searchTerm);

                // Customer filter
                const matchesCustomer = !customerFilter || campaign.customerId === customerFilter;

                // Channel filter
                const matchesChannel = !channelFilter || 
                    (Array.isArray(campaign.channels) && campaign.channels.includes(channelFilter));

                // Training status filter
                const matchesTraining = !trainingFilter || checkTrainingFilter(campaign, trainingFilter);

                return matchesSearch && matchesCustomer && matchesChannel && matchesTraining;
            });

            displayCampaigns();
        }

        // Check training filter logic
        function checkTrainingFilter(campaign, filter) {
            if (!teamMemberData?.campaignAssignments) {
                return filter === 'available';
            }

            const assignment = teamMemberData.campaignAssignments.find(a => a.campaignId === campaign.id);

            switch (filter) {
                case 'assigned':
                    return !!assignment;
                case 'completed':
                    return assignment?.trainingStatus === 'completed';
                case 'in-progress':
                    return assignment?.trainingStatus === 'in-progress';
                case 'not-started':
                    return assignment?.trainingStatus === 'not-started';
                case 'available':
                    return !assignment;
                default:
                    return true;
            }
        }

        // Generate example values for variables - USE DATABASE VALUES FIRST (copied from campaigns_enhanced.html)
        function generateExampleValue(variable) {
            // PRIORITY 1: Use the actual example from the database if it exists
            if (variable.exampleValue && variable.exampleValue.trim() !== '') {
                console.log(`✅ Using database example for ${variable.variable}: ${variable.exampleValue}`);
                return variable.exampleValue;
            }
            
            // PRIORITY 2: Use any sample data fields from the database
            if (variable.sampleValue && variable.sampleValue.trim() !== '') {
                console.log(`✅ Using database sample for ${variable.variable}: ${variable.sampleValue}`);
                return variable.sampleValue;
            }
            
            if (variable.defaultValue && variable.defaultValue.trim() !== '') {
                console.log(`✅ Using database default for ${variable.variable}: ${variable.defaultValue}`);
                return variable.defaultValue;
            }
            
            // PRIORITY 3: Pattern-based generation as fallback
            console.log(`⚠️ No database example found for ${variable.variable}, using pattern matching`);
            return generateExampleValueFromName(variable.variable);
        }

        // Generate example value from variable name (fallback)
        function generateExampleValueFromName(variableName) {
            const varName = variableName.toLowerCase();
            
            if (varName.includes('name')) {
                return varName.includes('first') ? 'John' : varName.includes('last') ? 'Smith' : 'John Smith';
            } else if (varName.includes('company') || varName.includes('organization')) {
                return 'Healthcare Systems Inc.';
            } else if (varName.includes('email')) {
                return 'john.smith@healthcaresystems.com';
            } else if (varName.includes('phone')) {
                return '(555) 123-4567';
            } else if (varName.includes('title') || varName.includes('position') || varName.includes('job')) {
                return 'IT Director';
            } else if (varName.includes('city')) {
                return 'Chicago';
            } else if (varName.includes('state')) {
                return 'Illinois';
            } else if (varName.includes('hospital') || varName.includes('facility') || varName.includes('clinic')) {
                return 'Memorial Hospital';
            } else if (varName.includes('bed') || varName.includes('size')) {
                return '250';
            } else if (varName.includes('revenue') || varName.includes('budget')) {
                return '$50M';
            } else if (varName.includes('patient') || varName.includes('visit')) {
                return '15,000';
            } else if (varName.includes('system') || varName.includes('software')) {
                return 'Epic EMR';
            } else if (varName.includes('doctor') || varName.includes('physician')) {
                return 'Dr. Johnson';
            } else {
                // Generic fallback
                return `[${variableName}]`;
            }
        }

        // Replace bracket variables with examples (supports both {{}} and [] syntax)
        function replaceVariablesWithExamples(content, campaignCustomerId) {
            if (!content) return content;
            
            let processedContent = content;
            
            // Handle {{variableName}} syntax
            const doubleBraceMatches = content.match(/\{\{([^}]+)\}\}/g) || [];
            doubleBraceMatches.forEach(match => {
                const variableName = match.replace(/[{}]/g, '');
                const exampleValue = getExampleForVariable(variableName, campaignCustomerId);
                processedContent = processedContent.replace(match, exampleValue);
            });
            
            // Handle [variableName] syntax
            const singleBraceMatches = content.match(/\[([^\]]+)\]/g) || [];
            singleBraceMatches.forEach(match => {
                const variableName = match.replace(/[\[\]]/g, '');
                const exampleValue = getExampleForVariable(variableName, campaignCustomerId);
                processedContent = processedContent.replace(match, exampleValue);
            });
            
            return processedContent;
        }

        // Get example value for a variable name
        function getExampleForVariable(variableName, campaignCustomerId) {
            // Find the bracket variable that matches (prefer customer-specific, then global)
            let variable = bracketVariables.find(v => 
                v.variable === variableName && v.customerId === campaignCustomerId
            );
            
            if (!variable) {
                variable = bracketVariables.find(v => 
                    v.variable === variableName && (v.customerId === 'global' || !v.customerId)
                );
            }
            
            if (variable) {
                return generateExampleValue(variable);
            } else {
                // If no bracket variable found, use fallback generation
                const fallbackValue = generateExampleValueFromName(variableName);
                return `<span class="missing-variable" title="No bracket variable defined for ${variableName}">${fallbackValue}</span>`;
            }
        }

                            </a>
                        ` : ''}
                        <button class="btn btn-secondary" onclick="closeCampaignModal()">
                            <i class="fas fa-times"></i> Close
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('campaignModal').style.display = 'block';
        };

        // Switch content tabs in modal
        window.switchContentTab = function(tab) {
            // Remove active class from all tabs and sections
            document.querySelectorAll('.content-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            
            // Add active class to clicked tab and corresponding section
            event.target.classList.add('active');
            document.getElementById(`${tab}-content`).classList.add('active');
        };

        // Save current user notes
        window.saveCurrentUserNotes = function(campaignId) {
            const notes = document.getElementById('userNotesTextarea').value.trim();
            saveUserNotes(campaignId, notes);
        };

        // Request training for a campaign
        window.requestTraining = async function(campaignId) {
            if (!teamMemberData) {
                showAlert('Team member data not loaded. Please refresh the page.', 'danger');
                return;
            }

            try {
                // Check if already assigned
                if (teamMemberData.campaignAssignments?.some(a => a.campaignId === campaignId)) {
                    showAlert('You are already assigned to this campaign', 'warning');
                    return;
                }

                const newAssignment = {
                    campaignId: campaignId,
                    trainingStatus: 'not-started',
                    notes: 'Training requested by team member',
                    assignedDate: new Date().toISOString()
                };

                const updatedAssignments = [...(teamMemberData.campaignAssignments || []), newAssignment];
                
                await updateDoc(doc(db, 'teamMembers', teamMemberData.id), {
                    campaignAssignments: updatedAssignments,
                    updatedAt: new Date()
                });

                // Update local state
                teamMemberData.campaignAssignments = updatedAssignments;
                
                showAlert('Training request submitted successfully! Your supervisor will review it.', 'success');
                
                // Refresh displays
                applyFilters();
                updateStatistics();
                closeCampaignModal();
                
            } catch (error) {
                console.error('❌ Error requesting training:', error);
                showAlert('Error requesting training: ' + error.message, 'danger');
            }
        };

        // Close campaign modal
        window.closeCampaignModal = function() {
            document.getElementById('campaignModal').style.display = 'none';
        };

        // Utility function to show alerts
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i> ${message}`;
            
            // Insert at top of container
            const container = document.querySelector('.container');
            container.insertBefore(alertDiv, container.firstChild);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // Initialize when page loads
        if (typeof window.firebaseReady !== 'undefined') {
            window.firebaseReady.then(async () => {
                console.log('🔥 Firebase ready, protecting team folder...');
                
                const hasAccess = await window.protectFolder('team', { 
                    allowTeamMembers: true,
                    redirectOnFail: '../login.html'
                });
                
                if (hasAccess !== false) {
                    console.log('✅ Access granted to team folder, initializing campaigns...');
                    await initialize();
                }
            }).catch(error => {
                console.error('❌ Firebase initialization error:', error);
                console.log('⚠️ Falling back to direct initialization...');
                if (window.unhideProtectedContent) window.unhideProtectedContent();
                initialize();
            });
        } else {
            console.log('⚠️ Centralized auth system not available, initializing directly...');
            if (window.unhideProtectedContent) window.unhideProtectedContent();
            initialize();
        }

        // Add CSS for modal details
        const detailStyles = `
            <style>
                .campaign-details {
                    max-width: 100%;
                }

                .detail-section {
                    margin-bottom: 2rem;
                    padding-bottom: 1.5rem;
                    border-bottom: 1px solid var(--border);
                }

                .detail-section:last-child {
                    border-bottom: none;
                }

                .detail-section h3 {
                    font-size: 1.25rem;
                    font-weight: 600;
                    color: var(--secondary);
                    margin-bottom: 1rem;
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                }

                .detail-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 1rem;
                }

                .detail-item {
                    display: flex;
                    flex-direction: column;
                    gap: 0.25rem;
                }

                .detail-item label {
                    font-weight: 600;
                    color: var(--gray);
                    font-size: 0.875rem;
                }

                .detail-item span {
                    color: var(--secondary);
                }

                .custom-fields {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 0.5rem;
                }

                .field-badge {
                    padding: 0.25rem 0.75rem;
                    background: var(--light-gray);
                    border: 1px solid var(--border);
                    border-radius: var(--border-radius);
                    font-size: 0.875rem;
                    color: var(--secondary);
                }

                .detail-actions {
                    display: flex;
                    gap: 1rem;
                    justify-content: flex-end;
                    margin-top: 2rem;
                    flex-wrap: wrap;
                }

                @media (max-width: 768px) {
                    .detail-grid {
                        grid-template-columns: 1fr;
                    }
                    
                    .detail-actions {
                        justify-content: stretch;
                    }
                    
                    .detail-actions .btn {
                        flex: 1;
                        justify-content: center;
                    }
                }
            </style>
        `;

        document.head.insertAdjacentHTML('beforeend', detailStyles);
    </script>
</body>
</html>
