<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Pando Executive Networking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="images/pando_trees.png" />

  <!-- UI helpers must be in <head> so they are always available -->
  <script>
    window.togglePassword = function(inputId, btn) {
      var input = document.getElementById(inputId);
      if (!input) return;
      var icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    };
    window.checkPasswordStrength = function(password) {
      var fill = document.getElementById('strength-fill');
      var text = document.getElementById('strength-text');
      if (!fill || !text) return;
      var score = 0;
      if (password.length >= 6)          score++;
      if (password.length >= 10)         score++;
      if (/[A-Z]/.test(password))        score++;
      if (/[0-9]/.test(password))        score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;
      var levels = [
        { pct:  0, color: '',        label: '' },
        { pct: 20, color: '#dc3545', label: 'Very weak' },
        { pct: 40, color: '#fd7e14', label: 'Weak' },
        { pct: 60, color: '#ffc107', label: 'Fair' },
        { pct: 80, color: '#20c997', label: 'Strong' },
        { pct:100, color: '#198754', label: 'Very strong' },
      ];
      var level = levels[score] || levels[0];
      fill.style.width           = level.pct + '%';
      fill.style.backgroundColor = level.color;
      text.textContent           = password.length ? level.label : '';
      text.style.color           = level.color;
    };
  </script>

  <!-- Firebase init (provides window.auth via firebaseReady promise) -->
  <script src="js/auth.js?v=1.1.1"></script>

  <style>
    :root {
      --gray: #6B7280;
      --gold: #C9973D;
      --blue: #5E7C5B;
      --dark-gold: #8A6B2E;
      --dark-blue: #0F2D4D;
      --success: #198754;
      --danger: #dc3545;
      --border: #dee2e6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8f4f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: var(--gray);
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, var(--dark-blue), var(--blue));
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      color: white;
    }
    .card-header img {
      height: 48px;
      margin-bottom: 0.75rem;
      filter: brightness(0) invert(1);
    }
    .card-header h1 { font-size: 1.25rem; font-weight: 700; }
    .card-header p  { font-size: 0.875rem; opacity: 0.85; margin-top: 0.25rem; }

    .card-body { padding: 2rem; }

    /* State panels */
    .state { display: none; }
    .state.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* Loading */
    .loading-spinner {
      display: flex; flex-direction: column;
      align-items: center; gap: 1rem;
      padding: 1rem 0;
      color: var(--gray); font-size: 0.9rem;
    }
    .spin {
      width: 40px; height: 40px;
      border: 3px solid #e9ecef;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Form */
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--dark-blue);
    }
    .email-chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: #e8f4f8; color: var(--dark-blue);
      border: 1px solid #c8e6f0;
      border-radius: 20px;
      padding: 0.3rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .input-wrap {
      position: relative; display: flex; align-items: center;
    }
    .input-icon {
      position: absolute; left: 0.85rem;
      color: #aaa; font-size: 0.875rem; pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 0.75rem 2.75rem 0.75rem 2.5rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: var(--gray);
    }
    .input-wrap input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(94, 124, 91,0.15);
    }
    .toggle-pw {
      position: absolute; right: 0.75rem;
      background: none; border: none; cursor: pointer;
      color: #aaa; padding: 0; font-size: 0.875rem;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--blue); }

    .strength-bar {
      height: 4px; border-radius: 2px;
      background: var(--border); margin-top: 0.4rem; overflow: hidden;
    }
    .strength-fill {
      height: 100%; width: 0%;
      border-radius: 2px; transition: width 0.3s, background-color 0.3s;
    }
    .strength-text {
      font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      width: 100%; padding: 0.85rem;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.25s ease;
    }
    .btn-primary {
      background: var(--blue); color: white;
      box-shadow: 0 4px 15px rgba(94, 124, 91,0.3);
    }
    .btn-primary:hover { background: var(--dark-blue); transform: translateY(-1px); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-gold {
      background: var(--gold); color: white;
      box-shadow: 0 4px 15px rgba(201, 151, 61,0.3);
      margin-top: 0.75rem;
    }
    .btn-gold:hover { background: var(--dark-gold); transform: translateY(-1px); }

    .btn-spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    /* Alert */
    .alert {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.8rem 0.9rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      border-left: 4px solid transparent;
    }
    .alert-error   { background:#fdf0f0; color:#842029; border-left-color:var(--danger); }
    .alert-success { background:#f0fdf4; color:#155724; border-left-color:var(--success); }
    .alert-info    { background:#e8f4f8; color:#0c5460; border-left-color:var(--blue); }

    /* Success / Icon states */
    .state-icon {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0.5rem auto 1.25rem;
    }
    .state-icon.success { background: linear-gradient(135deg, #d4edda, #c3e6cb); color: var(--success); }
    .state-icon.error   { background: linear-gradient(135deg, #f8d7da, #f5c6cb); color: var(--danger); }
    .state-icon.info    { background: linear-gradient(135deg, #cce5ff, #b8daff); color: #004085; }
    .state-title { font-size: 1.2rem; font-weight: 700; color: var(--dark-blue); margin-bottom: 0.5rem; text-align: center; }
    .state-text  { font-size: 0.875rem; color: var(--gray); text-align: center; line-height: 1.6; }

    .countdown { font-size: 0.8rem; color: #aaa; margin-top: 0.75rem; text-align: center; }

    a.action-link {
      color: var(--blue); text-decoration: none;
      font-size: 0.875rem; font-weight: 600;
    }
    a.action-link:hover { color: var(--dark-blue); }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header (title updated per mode) -->
    <div class="card-header">
      <img src="images/pando_logo.png" alt="Pando Executive Networking" />
      <h1 id="page-title">Pando Executive Networking</h1>
      <p  id="page-subtitle">Processing your request…</p>
    </div>
    <div class="card-body">

      <!-- ── LOADING ── -->
      <div class="state active" id="state-loading">
        <div class="loading-spinner">
          <div class="spin"></div>
          <span>Verifying your link…</span>
        </div>
      </div>

      <!-- ── RESET PASSWORD FORM ── -->
      <div class="state" id="state-reset-form">
        <div id="reset-alert"></div>
        <p style="font-size:0.85rem;color:var(--gray);margin-bottom:1rem;">
          Choose a new password for
        </p>
        <div class="email-chip" id="reset-email-chip">
          <i class="fas fa-envelope"></i>
          <span id="reset-email-display">—</span>
        </div>
        <form id="reset-form" novalidate>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password" id="new-password"
                placeholder="Choose a strong password"
                required minlength="6"
                autocomplete="new-password"
                oninput="checkPasswordStrength(this.value)"
              />
              <button type="button" class="toggle-pw" onclick="togglePassword('new-password', this)" title="Show/hide">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="strength-text" id="strength-text"></div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password" id="confirm-password"
                placeholder="Repeat your new password"
                required minlength="6"
                autocomplete="new-password"
              />
              <button type="button" class="toggle-pw" onclick="togglePassword('confirm-password', this)" title="Show/hide">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <span class="btn-spinner" id="submit-spinner"></span>
            <i class="fas fa-key"></i> Set New Password
          </button>
        </form>
      </div>

      <!-- ── SUCCESS ── -->
      <div class="state" id="state-success">
        <div class="state-icon success"><i class="fas fa-check"></i></div>
        <div class="state-title" id="success-title">Password Updated!</div>
        <div class="state-text" id="success-text">
          Your password has been changed. You can now sign in with your new password.
        </div>
        <button class="btn btn-gold" onclick="goToLogin()">
          <i class="fas fa-sign-in-alt"></i> Go to Sign In
        </button>
        <p class="countdown" id="redirect-countdown"></p>
      </div>

      <!-- ── ERROR ── -->
      <div class="state" id="state-error">
        <div class="state-icon error"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="state-title">Link Problem</div>
        <div class="state-text" id="error-text">
          This link has expired or is invalid. Please request a new one.
        </div>
        <button class="btn btn-gold" onclick="goToLogin()" style="margin-top:1.25rem;">
          <i class="fas fa-arrow-left"></i> Back to Sign In
        </button>
      </div>

    </div><!-- /card-body -->
  </div><!-- /card -->

  <script>
    // Navigation helper (works from any path depth)
    window.goToLogin = function() {
      var depth = window.location.pathname.split('/').length - 2;
      var prefix = depth > 0 ? Array(depth).fill('..').join('/') + '/' : '';
      window.location.href = prefix + 'login.html';
    };
  </script>

  <script type="module">
    import {
      verifyPasswordResetCode,
      confirmPasswordReset,
      applyActionCode,
      checkActionCode
    } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

    // ── Helpers ────────────────────────────────────────────────────
    function show(stateId) {
      document.querySelectorAll('.state').forEach(function(el) { el.classList.remove('active'); });
      var el = document.getElementById(stateId);
      if (el) el.classList.add('active');
    }

    function setHeader(title, subtitle) {
      document.getElementById('page-title').textContent    = title;
      document.getElementById('page-subtitle').textContent = subtitle;
    }

    function showResetAlert(message, type) {
      var icons = { error:'fa-circle-exclamation', success:'fa-check-circle', info:'fa-info-circle' };
      var container = document.getElementById('reset-alert');
      container.innerHTML = '<div class="alert alert-' + type + '"><i class="fas ' + (icons[type]||icons.info) + '"></i><span>' + message + '</span></div>';
    }

    function setLoading(loading) {
      var btn     = document.getElementById('submit-btn');
      var spinner = document.getElementById('submit-spinner');
      btn.disabled = loading;
      spinner.style.display = loading ? 'inline-block' : 'none';
    }

    function startRedirectCountdown(seconds, continueUrl) {
      var el = document.getElementById('redirect-countdown');
      var remaining = seconds;
      el.textContent = 'Redirecting in ' + remaining + 's…';
      var iv = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
          clearInterval(iv);
          window.location.href = continueUrl || 'login.html';
        } else {
          el.textContent = 'Redirecting in ' + remaining + 's…';
        }
      }, 1000);
    }

    function friendlyError(error) {
      var map = {
        'auth/expired-action-code':     'This link has expired. Please request a new password reset.',
        'auth/invalid-action-code':     'This link is invalid or has already been used.',
        'auth/user-disabled':           'This account has been disabled.',
        'auth/user-not-found':          'No account found for this link.',
        'auth/weak-password':           'Password must be at least 6 characters.',
        'auth/network-request-failed':  'Network error. Please check your connection and try again.',
      };
      return map[error.code] || error.message;
    }

    // ── Wait for Firebase ──────────────────────────────────────────
    let auth;
    try {
      const firebase = await window.firebaseReady;
      auth = firebase.auth || window.auth;
    } catch (e) {
      let attempts = 0;
      while (!window.auth && attempts < 40) {
        await new Promise(r => setTimeout(r, 150));
        attempts++;
      }
      auth = window.auth;
    }

    if (!auth) {
      setHeader('Error', 'Could not initialize authentication');
      document.getElementById('error-text').textContent = 'Authentication system failed to load. Please refresh the page.';
      show('state-error');
      throw new Error('auth unavailable');
    }

    // ── Parse URL params ───────────────────────────────────────────
    const params      = new URLSearchParams(window.location.search);
    const mode        = params.get('mode');
    const oobCode     = params.get('oobCode');
    const continueUrl = params.get('continueUrl') || 'login.html';

    if (!mode || !oobCode) {
      setHeader('Invalid Link', 'Missing required parameters');
      document.getElementById('error-text').textContent =
        'This link is missing required parameters. Please use the link from the email exactly as received.';
      show('state-error');
      throw new Error('missing mode or oobCode');
    }

    // ── Route by mode ──────────────────────────────────────────────
    if (mode === 'resetPassword') {
      await handleResetPassword();
    } else if (mode === 'verifyEmail') {
      await handleVerifyEmail();
    } else if (mode === 'recoverEmail') {
      await handleRecoverEmail();
    } else if (mode === 'signIn') {
      // Email sign-in (passwordless) links — hand off to login.html which
      // already contains the isSignInWithEmailLink / signInWithEmailLink logic.
      // We preserve ALL query params so Firebase's SDK can verify the link.
      const depth   = window.location.pathname.split('/').length - 2;
      const prefix  = depth > 0 ? Array(depth).fill('..').join('/') + '/' : '';
      const loginUrl = prefix + 'login.html?' + params.toString();
      window.location.replace(loginUrl);
    } else {
      setHeader('Unknown Action', '');
      document.getElementById('error-text').textContent =
        'Unknown action mode "' + mode + '". Please use the original link from the email.';
      show('state-error');
    }

    // ══════════════════════════════════════════════════════════════
    // PASSWORD RESET
    // ══════════════════════════════════════════════════════════════
    async function handleResetPassword() {
      setHeader('Reset Password', 'Set a new password for your account');

      // Verify the code and get the email
      let email;
      try {
        email = await verifyPasswordResetCode(auth, oobCode);
      } catch (error) {
        setHeader('Link Problem', friendlyError(error));
        document.getElementById('error-text').textContent = friendlyError(error);
        show('state-error');
        return;
      }

      // Populate the email display and show the form
      document.getElementById('reset-email-display').textContent = email;
      show('state-reset-form');

      // Handle form submission
      document.getElementById('reset-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const newPw  = document.getElementById('new-password').value;
        const confPw = document.getElementById('confirm-password').value;

        if (newPw.length < 6) {
          showResetAlert('Password must be at least 6 characters.', 'error');
          return;
        }
        if (newPw !== confPw) {
          showResetAlert('Passwords do not match.', 'error');
          return;
        }

        setLoading(true);
        try {
          await confirmPasswordReset(auth, oobCode, newPw);

          setHeader('Password Updated', 'You can now sign in');
          document.getElementById('success-title').textContent = 'Password Updated!';
          document.getElementById('success-text').textContent  =
            'Your password for ' + email + ' has been changed. You can now sign in with your new password.';
          show('state-success');
          startRedirectCountdown(5, continueUrl);
        } catch (error) {
          showResetAlert(friendlyError(error), 'error');
        } finally {
          setLoading(false);
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    // EMAIL VERIFICATION
    // ══════════════════════════════════════════════════════════════
    async function handleVerifyEmail() {
      setHeader('Email Verified', 'Confirming your email address…');
      try {
        const info = await checkActionCode(auth, oobCode);
        await applyActionCode(auth, oobCode);

        const email = info.data?.email || '';
        setHeader('Email Verified', 'Welcome to Pando Executive Networking');
        document.getElementById('success-title').textContent = 'Email Verified!';
        document.getElementById('success-text').innerHTML =
          'Your email address' + (email ? ' <strong>' + email + '</strong>' : '') +
          ' has been verified. You can now sign in to your account.';
        show('state-success');
        startRedirectCountdown(4, continueUrl);
      } catch (error) {
        setHeader('Verification Failed', '');
        document.getElementById('error-text').textContent = friendlyError(error);
        show('state-error');
      }
    }

    // ══════════════════════════════════════════════════════════════
    // EMAIL RECOVERY (undo email change)
    // ══════════════════════════════════════════════════════════════
    async function handleRecoverEmail() {
      setHeader('Recover Email', 'Restoring your previous email…');
      try {
        const info = await checkActionCode(auth, oobCode);
        await applyActionCode(auth, oobCode);

        const restoredEmail = info.data?.email || '';
        setHeader('Email Recovered', 'Your email has been restored');
        document.getElementById('success-title').textContent = 'Email Restored!';
        document.getElementById('success-text').innerHTML =
          'Your sign-in email has been restored to' +
          (restoredEmail ? ' <strong>' + restoredEmail + '</strong>' : ' its previous address') + '.';
        show('state-success');
        startRedirectCountdown(5, continueUrl);
      } catch (error) {
        setHeader('Recovery Failed', '');
        document.getElementById('error-text').textContent = friendlyError(error);
        show('state-error');
      }
    }
  </script>
</body>
</html>
