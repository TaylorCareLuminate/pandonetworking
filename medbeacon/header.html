<header style="background: linear-gradient(135deg, #014455 0%, #407380 100%); color: #fff; padding: 15px 0; box-shadow: 0 4px 20px rgba(1, 68, 85, 0.3);">
  <div class="header-container" style="display: flex; align-items: center; justify-content: space-between; max-width: 1400px; margin: 0 auto; padding: 0 30px;">
    <div class="logo-container" style="display: flex; align-items: center; gap: 20px;">
      <div class="logo-beacon" style="position: relative; width: 60px; height: 60px;">
        <!-- MedBeacon Lighthouse Logo -->
        <svg width="60" height="60" viewBox="0 0 60 60" style="filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));">
          <!-- Lighthouse base -->
          <rect x="25" y="45" width="10" height="10" fill="#407380" rx="1"/>
          <!-- Lighthouse tower -->
          <polygon points="27,45 27,15 33,15 33,45" fill="#014455" stroke="#002A33" stroke-width="0.5"/>
          <!-- Lighthouse light section -->
          <rect x="25" y="12" width="10" height="8" fill="#FCCB1E" rx="2"/>
          <!-- Lighthouse top -->
          <polygon points="30,12 35,8 25,8" fill="#014455"/>
          <!-- Light beams -->
          <path d="M35,16 L50,10 L48,14 L35,18 Z" fill="#FCCB1E" opacity="0.8"/>
          <path d="M35,18 L52,20 L50,24 L35,20 Z" fill="#FCCB1E" opacity="0.6"/>
          <path d="M25,16 L10,10 L12,14 L25,18 Z" fill="#FCCB1E" opacity="0.8"/>
          <path d="M25,18 L8,20 L10,24 L25,20 Z" fill="#FCCB1E" opacity="0.6"/>
          <!-- Light center -->
          <circle cx="30" cy="16" r="3" fill="#FEF5DC"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="page-title" style="font-size: 2.2rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(135deg, #ffffff 0%, #E0F2F7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">MedBeacon</h1>
        <p style="margin: 0; font-size: 1rem; color: #B3D9E3; font-weight: 500; letter-spacing: 0.02em;">Guiding Smart Healthcare</p>
      </div>
    </div>
    
    <!-- Authentication UI elements for auth.js -->
    <div id="auth-section">
      <!-- Loading state -->
      <div id="auth-loading" style="display: flex; align-items: center; color: #fff;">
        <i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i>
        <span style="font-size: 0.9rem;">Checking...</span>
      </div>
      
      <!-- Not logged in -->
      <div id="not-logged-in" style="display: none;">
        <a href="/login.html" style="color: #fff; text-decoration: none; padding: 0.5rem 1rem; border: 1px solid #fff; border-radius: 4px;">Login</a>
      </div>
      
      <!-- Logged in -->
      <div id="logged-in" style="display: none;">
        <div class="user-menu">
          <div class="user-info" style="color: #fff;">
            <div class="user-avatar" id="user-avatar" style="width: 32px; height: 32px; border-radius: 50%; background-color: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 0.9rem;">U</div>
            <span class="user-name" id="user-name" style="margin-left: 0.5rem;">User</span>
            <i class="fas fa-chevron-down dropdown-icon" style="margin-left: 0.5rem; font-size: 0.8rem;"></i>
          </div>
          <div class="dropdown-menu" id="dropdown-menu" style="position: absolute; top: 100%; right: 0; background: white; min-width: 200px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; z-index: 1000; margin-top: 0.5rem;">
            <a href="/dashboard.html" class="dropdown-item" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: #5B5B5B; text-decoration: none; transition: all 0.3s ease;">
              <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
            <div class="dropdown-divider" style="height: 1px; background-color: #eee; margin: 0.5rem 0;"></div>
            <a href="#" class="dropdown-item" onclick="logout()" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: #5B5B5B; text-decoration: none; transition: all 0.3s ease;">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
