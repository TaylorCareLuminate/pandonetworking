<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PandoConnect Demo</title>
    <link rel="icon" type="image/png" href="../images/pando_emblem.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Demo shell.
      Every demo page (Scheduled Meetings, Message Outcomes, Success Analysis, Outcomes Calculator,
      Team Portal) is loaded ONCE into its own iframe and kept alive. The header nav only shows/hides
      the iframes, so switching pages is instant instead of re-loading Firebase, auth and data.
      Each page redirects here if opened directly (see the "embedded" snippet in each page's <head>).
    -->
    <script src="../js/auth.js?v=2.1"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #F6F4EF;
        }

        .hc-demo-header {
            background: linear-gradient(135deg, #12314C 0%, #1a3d5c 100%);
            color: white;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            flex: 0 0 auto;
            z-index: 500;
        }
        .hc-demo-brand { display: flex; align-items: center; gap: 0.75rem; }
        .hc-demo-logo { width: 34px; height: 34px; object-fit: contain; }
        .hc-demo-brand-name { font-size: 1.1rem; font-weight: 800; line-height: 1.1; }
        .hc-demo-brand-tag { font-size: 0.72rem; opacity: 0.85; font-weight: 600; letter-spacing: 0.03em; }
        .hc-demo-user { display: none; align-items: center; gap: 0.9rem; font-size: 0.85rem; }
        .hc-demo-user-email { opacity: 0.9; }
        .hc-demo-signout {
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.35);
            color: white;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
            transition: background 0.2s;
        }
        .hc-demo-signout:hover { background: rgba(255,255,255,0.28); }
        .hc-demo-nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .hc-demo-nav-link {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .hc-demo-nav-link:hover { background: rgba(255,255,255,0.14); color: white; }
        .hc-demo-nav-link.active { background: rgba(255,255,255,0.24); color: white; }
        .hc-demo-nav-divider { width: 1px; align-self: stretch; background: rgba(255,255,255,0.25); margin: 0 0.2rem; }
        .hc-demo-nav-team {
            background: rgba(148,173,130,0.22);
            border: 1px solid rgba(148,173,130,0.45);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .hc-demo-nav-team:hover { background: rgba(148,173,130,0.38); color: white; }
        /* little dot on a nav link while its page is still loading in the background */
        .hc-demo-nav-link.loading::after {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            margin-left: 0.45rem;
            border-radius: 50%;
            background: #94AD82;
            vertical-align: middle;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse { 50% { opacity: 0.25; } }

        .stage { position: relative; flex: 1 1 auto; min-height: 0; }
        /* Hidden pages stay laid out at full size (visibility, not display:none) so charts
           and layout measure correctly and the page is ready the instant it is shown. */
        .stage iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #F6F4EF;
            visibility: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .stage iframe.active { visibility: visible; pointer-events: auto; z-index: 1; }
    </style>
</head>
<body>
    <header class="hc-demo-header">
        <div class="hc-demo-brand">
            <img src="../images/pando_emblem.png" alt="PandoConnect" class="hc-demo-logo">
            <div>
                <div class="hc-demo-brand-name">PandoConnect</div>
                <div class="hc-demo-brand-tag">Shared Demo</div>
            </div>
        </div>
        <nav class="hc-demo-nav" id="demoNav">
            <a href="#demo_review_replies" class="hc-demo-nav-link" data-page="demo_review_replies">Scheduled Meetings</a>
            <a href="#outcomes" class="hc-demo-nav-link" data-page="outcomes">Message Outcomes</a>
            <a href="#analysis_results" class="hc-demo-nav-link" data-page="analysis_results">Success Analysis</a>
            <a href="#outcomes_calculator" class="hc-demo-nav-link" data-page="outcomes_calculator">Outcomes Calculator</a>
            <span class="hc-demo-nav-divider"></span>
            <a href="#team-portal" class="hc-demo-nav-link hc-demo-nav-team" data-page="team-portal"><i class="fas fa-user-shield"></i> Team Portal</a>
        </nav>
        <div class="hc-demo-user" id="hcDemoUser">
            <span class="hc-demo-user-email" id="hcDemoUserEmail"></span>
            <button class="hc-demo-signout" onclick="window.logout && window.logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
        </div>
    </header>

    <main class="stage" id="stage"></main>

    <script>
    (function () {
        // Order = background load order after the page you opened first.
        const PAGES = [
            { key: 'demo_review_replies', title: 'Scheduled Meetings' },
            { key: 'outcomes',            title: 'Message Outcomes' },
            { key: 'analysis_results',    title: 'Success Analysis' },
            { key: 'outcomes_calculator', title: 'Outcomes Calculator' },
            { key: 'team-portal',         title: 'Team Portal' },
        ];
        const DEFAULT_PAGE = PAGES[0].key;
        const PAGE_LOAD_TIMEOUT_MS = 20000; // don't let one stuck page block the others
        const AUTH_WAIT_MS = 5000;

        const stage = document.getElementById('stage');
        const frames = {};   // key -> { el, started, loaded }
        const initialSearch = location.search; // forwarded once to the page that was opened (e.g. OAuth return params)
        let initialSearchPage = null;
        let activeKey = null;
        let bootstrapped = false;

        PAGES.forEach(p => {
            const el = document.createElement('iframe');
            el.id = 'frame-' + p.key;
            el.title = p.title;
            stage.appendChild(el);
            frames[p.key] = { el, started: false, loaded: false, waiters: [] };
            el.addEventListener('load', () => {
                // about:blank fires load too; only count real loads
                if (!frames[p.key].started) return;
                frames[p.key].loaded = true;
                updateLoadingDots();
                frames[p.key].waiters.splice(0).forEach(fn => fn());
            });
        });

        function pageFromHash() {
            const k = decodeURIComponent((location.hash || '').replace(/^#/, ''));
            return frames[k] ? k : null;
        }

        function updateLoadingDots() {
            document.querySelectorAll('.hc-demo-nav-link').forEach(a => {
                const f = frames[a.dataset.page];
                a.classList.toggle('loading', bootstrapped && f.started && !f.loaded);
            });
        }

        function startLoad(key) {
            const f = frames[key];
            if (f.started) return;
            f.started = true;
            const search = (key === initialSearchPage) ? initialSearch : '';
            f.el.src = key + '.html' + search;
            updateLoadingDots();
        }

        // Resolves when the page has loaded (or after a timeout so the queue keeps moving)
        function whenLoaded(key) {
            const f = frames[key];
            return new Promise(resolve => {
                if (f.loaded) return resolve();
                f.waiters.push(resolve);
                setTimeout(resolve, PAGE_LOAD_TIMEOUT_MS);
            });
        }

        function show(key) {
            activeKey = key;
            PAGES.forEach(p => frames[p.key].el.classList.toggle('active', p.key === key));
            document.querySelectorAll('.hc-demo-nav-link').forEach(a =>
                a.classList.toggle('active', a.dataset.page === key));
            const meta = PAGES.find(p => p.key === key);
            document.title = meta.title + ' — PandoConnect';
            if (bootstrapped) startLoad(key); // clicked a page that hasn't started yet: jump the queue
            try { frames[key].el.contentWindow.focus(); } catch (e) { /* not loaded yet */ }
        }

        window.addEventListener('hashchange', () => { show(pageFromHash() || DEFAULT_PAGE); });

        // ── Auth: only start the pages once we know who is signed in ──────────
        // (all pages share one Firebase session, so they restore it from storage
        //  at the same time — no races with the SSO bridge / token return)
        function showUser(user) {
            const wrap = document.getElementById('hcDemoUser');
            document.getElementById('hcDemoUserEmail').textContent = (user && user.email) || '';
            wrap.style.display = user ? 'flex' : 'none';
        }

        async function waitForUser() {
            try { await window.firebaseReady; } catch (e) { /* handled by the pages */ }
            for (let i = 0; i < 30 && !window.auth; i++) await new Promise(r => setTimeout(r, 100));
            if (!window.auth) return null;
            const { onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js');
            return new Promise(resolve => {
                let done = false;
                const finish = u => { if (!done) { done = true; resolve(u); } };
                onAuthStateChanged(window.auth, u => { showUser(u); if (u) finish(u); });
                setTimeout(() => finish(null), AUTH_WAIT_MS);
            });
        }

        async function boot() {
            const first = pageFromHash() || DEFAULT_PAGE;
            initialSearchPage = first;
            if (!location.hash || !pageFromHash()) history.replaceState(null, '', location.pathname + location.search + '#' + first);
            show(first);

            await waitForUser();
            bootstrapped = true;

            // Active page first, then everything else one after another in the background.
            startLoad(activeKey);
            await whenLoaded(activeKey);
            for (const p of PAGES) {
                startLoad(p.key);
                await whenLoaded(p.key);
            }
            // Forwarded params were consumed by the iframe; keep the shell URL clean.
            if (location.search) history.replaceState(null, '', location.pathname + location.hash);
        }

        boot();
    })();
    </script>
</body>
</html>
