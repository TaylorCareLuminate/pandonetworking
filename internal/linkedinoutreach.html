<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HealthLuminate LinkedIn Contact Prospecting</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #264653;
      --secondary: #2a9d8f;
      --accent: #e9c46a;
      --danger: #e76f51;
      --light-blue: #f4f9fa;
      --light-green: #f4faef;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.07);
      --border-radius: 10px;
    }
    body { background: #f9fafb; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #263238; }
    header {
      background: var(--primary); color: #fff; padding: 18px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 12px;
    }
    .header-container { max-width: 1100px; margin:0 auto; padding:0 18px; display:flex; align-items:center; gap:18px;}
    .page-title { font-size: 2rem; font-weight: 700; letter-spacing: 0.01em;}
    .container { max-width:1100px; margin: 30px auto 60px auto; padding: 0 16px;}
    .main-content { background: #fff; border-radius: var(--border-radius); box-shadow: var(--card-shadow); padding: 30px 20px 30px 20px; }
    .section-title { font-size: 1.25em; font-weight: 600; margin-bottom: 18px; }
    .top-controls { display: flex; justify-content: flex-end; align-items: center; gap: 20px; margin-bottom: 16px; flex-wrap:wrap;}
    .top-controls select, .top-controls input { padding: 7px 12px; font-size: 1em; border-radius:6px; border:1px solid #ddd; }
    .top-controls label { font-weight:500; margin-right:7px;}
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px,1fr)); gap: 22px; margin-top: 6px;}
    .org-card {
      background: #fff; border-radius: var(--border-radius);
      box-shadow: var(--card-shadow); padding: 18px 14px; cursor:pointer;
      border: 2.5px solid transparent; transition: box-shadow 0.18s, border 0.18s;
      display: flex; flex-direction: column; gap: 10px;
      min-height: 122px;
    }
    .org-card.selected { border:2.5px solid var(--secondary); background: var(--light-blue);}
    .org-title { font-weight: 700; font-size: 1.12em; color: var(--primary);}
    .org-score { font-size:1.12em; font-weight:600;}
    .org-owner { background:var(--secondary); color:#fff; font-size:0.95em; border-radius:7px; padding: 2px 9px 2px 9px; display:inline-block;}
    .org-meta-row { display:flex; gap:11px; align-items:center; flex-wrap:wrap; }
    .org-n { font-size:0.98em; color:#555;}
    .org-score-hot { color:var(--danger);}
    .org-score-cold { color:#888;}
    .org-score-med { color:var(--accent);}
    .org-card .fa-fire { margin-right:2px;}
    .company-nav { display:flex; align-items:center; justify-content:center; gap:18px; margin:30px 0 20px 0; flex-wrap:wrap;}
    .company-nav button { background: var(--primary); color:#fff; border:none; border-radius: 7px; padding:9px 16px; font-size:1em; cursor:pointer; transition:background 0.18s;}
    .company-nav button:disabled { background: #b6bec3; cursor: not-allowed;}
    .company-nav select {max-width: 200px;width: auto;min-width: 90px;text-overflow: ellipsis;white-space: nowrap;overflow: hidden;display: inline-block;vertical-align: middle;}
    .company-nav .dropdown-wrap {display:flex; align-items:center; gap:6px;}
    .organization-section { background:var(--light-blue); border-radius:var(--border-radius); box-shadow:var(--card-shadow); padding:22px; margin-bottom:23px; border-left:5px solid var(--secondary);}
    .org-summary { font-size:1.08em; color:#1d3440; margin-bottom:10px; }
    .news-block { background:#fff; border-left:4px solid var(--primary); padding:13px 16px; margin:10px 0; border-radius:var(--border-radius);}
    .news-link { color:var(--secondary); text-decoration:underline; }
    .expand-btn { background:var(--secondary); color:#fff; border:none; border-radius:5px; margin-top:9px; padding:5px 14px; font-size:0.95em; cursor:pointer;}
    .contact-card { width:100%; background:#fff; border-radius:var(--border-radius); box-shadow:var(--card-shadow); margin-bottom:28px; border-left:5px solid var(--secondary); padding:19px;}
    .contact-top { display:flex; gap:22px; align-items:flex-start;}
    .contact-name { font-size:1.13em; font-weight:700; color:var(--primary);}
    .contact-title { color:#395464; font-size:1em;}
    .contact-linkedin a { color:var(--secondary); text-decoration:none;}
    .contact-linkedin a:hover { text-decoration:underline;}
    .contact-owner { background:var(--primary); color:#fff; border-radius:5px; padding:2px 7px; margin-left:7px; font-size:0.96em;}
    .contact-score { font-size:1.03em; font-weight:600; margin-left:12px;}
    .contact-score.hot { color:var(--danger);}
    .contact-score.cold { color:#888;}
    .contact-score.med { color:var(--accent);}
    .person-news-block { background: #fffae9; border-left: 4px solid var(--accent); padding: 12px 15px; border-radius: var(--border-radius); margin:13px 0;}
    .person-background { margin:12px 0 0 0; color: #263238;}
    .msg-draft-block { background: var(--light-green); border-left: 4px solid var(--secondary); border-radius: var(--border-radius); margin:9px 0; padding:12px; }
    .msg-label { font-weight:600; margin-bottom:5px;}
    .msg-actions { display: flex; gap:10px; margin-top:8px;}
    .copy-btn, .email-btn { background: var(--secondary); color:#fff; border:none; border-radius:5px; padding: 6px 12px; cursor:pointer; font-size:0.96em; }
    .email-btn { background:var(--accent); color:#263238; }
    .copy-btn:active, .email-btn:active { filter: brightness(0.92);}
    .outreach-section { background: #f8fcf6; border: 1px solid #cce6c4; border-radius: var(--border-radius); padding: 15px 18px; margin: 24px 0;}
    .out-btns-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0;}
    .out-btn { background: #e8f5ed; color: #154470; border: 1px solid #c8e5d3; border-radius: var(--border-radius); padding: 7px 12px; font-size: 0.95em; cursor: pointer; transition: var(--transition);}
    .out-btn:hover { background: #d2ebdc; }
    .out-btn.active { background: var(--secondary); color: white;}
    .note-row { display: flex; gap: 10px; margin-top: 10px;}
    .out-textarea { flex: 1; min-width: 120px; padding: 8px 10px; font-size: 1em; border-radius: var(--border-radius); border: 1px solid #ccc; font-family: inherit;}
    .note-submit-btn { background: var(--secondary); color: #fff; border: none; border-radius: var(--border-radius); padding: 8px 16px; font-size: 1em; cursor: pointer; transition: var(--transition);}
    .note-submit-btn:hover { background: #2a7c8f;}
    .timeline { background: #f9fafb; border-radius:7px; margin-top:12px; padding:9px 14px;}
    .timeline-event { border-left:3px solid var(--secondary); margin:10px 0; padding:8px 12px; background:#fff; border-radius:0 9px 9px 0; position:relative;}
    .timeline-type { font-weight:600; color:var(--primary);}
    .timeline-date { font-size:0.92em; color:#768396; margin-left:9px;}
    .timeline-by { font-size:0.92em; color:#aaa; margin-left:8px;}
    .timeline-delete-btn { background:var(--danger); color:#fff; border:none; border-radius:50%; width:23px; height:23px; font-size:0.8em; position:absolute; right:8px; top:7px; cursor:pointer;}
    .timeline-event { position:relative;}
    .error-msg { color:#a00; background:#fff4f4; border:1px solid #e66; border-radius:7px; padding:15px 17px; margin: 22px 0; font-size:1.1em; }
    @media (max-width: 800px) { .container {padding:8px;} .main-content {padding:11px;} }
    @media (max-width: 600px) { .page-title {font-size:1.1rem;} .org-title {font-size:1em;} .header-container {flex-direction:column;} }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, get, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBG814ayodB3Gt-Dn_wNDPTDaMeEF41Gck",
      authDomain: "ppchotsheets.firebaseapp.com",
      databaseURL: "https://healthcareitdatabase-default-rtdb.firebaseio.com",
      projectId: "healthcareitdatabase-default-rtdb",
      storageBucket: "ppchotsheets.firebasestorage.app",
      messagingSenderId: "481606291946",
      appId: "1:481606291946:web:c9dc545db5cfc0ad692293",
      measurementId: "G-XM0BNPJ05Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- Utility ---
    function md2html(md) {
      if (!md) return '';
      return md.replace(/\*\*([^\*]+)\*\*/g, "<b>$1</b>")
               .replace(/\n/g, "<br>")
               .replace(/\[(.*?)\]\((.*?)\)/g, `<a href="$2" target="_blank">$1</a>`);
    }
    function copyText(txt) {
      navigator.clipboard.writeText(txt);
    }
    function sendEmail(email, body) {
      const mailto = `mailto:${encodeURIComponent(email)}?body=${encodeURIComponent(body)}`;
      window.open(mailto, '_blank');
    }
    function formatDate(dt) {
      if (!dt) return "";
      const d = new Date(dt);
      if (isNaN(d.getTime())) return dt;
      return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour:"2-digit", minute:"2-digit"});
    }
    function safeKey(url, id) {
    if (url) return url.toLowerCase().replace(/[^a-z0-9]/g,'_');
    if (id) return id.replace(/[^a-z0-9]/g,'_');
    return Math.floor(Math.random()*1e6).toString();
    }


    // --- Outreach/Timeline ---
    async function addTimelineEvent(orgKey, contactKey, eventObj) {
      const nodeRef = ref(db, `hclinkedincrm522/${orgKey}/${contactKey}`);
      const newRef = push(nodeRef);
      await set(newRef, eventObj);
      loadTimeline(orgKey, contactKey);
    }
    function loadTimeline(orgKey, contactKey) {
      const timelineDiv = document.getElementById(`timeline_${contactKey}`);
      if (!timelineDiv) return;
      const nodeRef = ref(db, `hclinkedincrm522/${orgKey}/${contactKey}`);
      onValue(nodeRef, snap => {
        let events = [];
        snap.forEach(child => {
          const ev = child.val();
          ev._id = child.key;
          events.push(ev);
        });
        events.sort((a,b) => new Date(a.date)-new Date(b.date));
        if (!events.length) {
          timelineDiv.innerHTML = "<div style='color:#888;text-align:center;padding:10px;'><i class='fas fa-info-circle'></i> No outreach recorded yet.</div>";
          return;
        }
        timelineDiv.innerHTML = events.map(ev => `
          <div class="timeline-event" id="event_${contactKey}_${ev._id}">
            <span class="timeline-type">${ev.type}</span>
            <span class="timeline-date">${ev.date ? formatDate(ev.date) : ""}</span>
            ${ev.by ? `<span class="timeline-by">by ${ev.by}</span>` : ""}
            ${ev.note ? `<div style="margin-top:8px;color:#1a2943;">${md2html(ev.note)}</div>` : ""}
            <button class="timeline-delete-btn" title="Delete" onclick="window.deleteTimelineEvent('${orgKey}','${contactKey}','${ev._id}')"><i class="fas fa-trash"></i></button>
          </div>
        `).join("");
      });
    }
    window.deleteTimelineEvent = async function(orgKey, contactKey, eventId) {
      if (!confirm("Are you sure you want to delete this entry?")) return;
      const nodeRef = ref(db, `hclinkedincrm522/${orgKey}/${contactKey}/${eventId}`);
      await remove(nodeRef);
    }
    function setupOrgNotesEvents(orgKey) {
      const noteForm = document.getElementById(`noteform___orgnotes__`);
      if (noteForm) {
        noteForm.onsubmit = () => {
          const txt = document.getElementById(`noteinput___orgnotes__`).value.trim();
          if (txt.length > 0) {
            addTimelineEvent(orgKey, "__orgnotes__", {type:"Note", note:txt, name:"", by:"Anonymous", date:new Date().toISOString()});
            document.getElementById(`noteinput___orgnotes__`).value = "";
          }
          return false;
        };
      }
    }
    function setupOutreachEvents(orgKey, contactKey, name) {
      const badBtns = document.querySelectorAll(`#badbtns_${contactKey} .bad-btn`);
      badBtns.forEach(btn => {
        btn.onclick = () => {
          addTimelineEvent(orgKey, contactKey, {type: btn.dataset.type, name: name, by: "Anonymous", date: new Date().toISOString()});
          btn.classList.add('active');
          setTimeout(() => btn.classList.remove('active'), 500);
        }
      });
      const outBtns = document.querySelectorAll(`#outbtns_${contactKey} .out-btn-act`);
      outBtns.forEach(btn => {
        btn.onclick = () => {
          addTimelineEvent(orgKey, contactKey, {type: btn.dataset.type, name: name, by: "Anonymous", date: new Date().toISOString()});
          btn.classList.add('active');
          setTimeout(() => btn.classList.remove('active'), 500);
        }
      });
      const noteForm = document.getElementById(`noteform_${contactKey}`);
      if (noteForm) {
        noteForm.onsubmit = () => {
          const txt = document.getElementById(`noteinput_${contactKey}`).value.trim();
          if (txt.length > 0) {
            addTimelineEvent(orgKey, contactKey, {type:"Note", note:txt, name:name, by:"Anonymous", date:new Date().toISOString()});
            document.getElementById(`noteinput_${contactKey}`).value = "";
          }
          return false;
        };
      }
    }

    // --- DOM ---
    window.addEventListener("DOMContentLoaded", async () => {
      // Get elements
      const orgGrid = document.getElementById("orgGrid");
      const orgAndContactsDiv = document.getElementById("orgAndContacts");
      const orgNav = document.getElementById("orgNav");
      const topControls = document.getElementById("topControls");

      // Load orgs
      async function loadOrgs() {
        const snap = await get(ref(db, "hllinkedinindex"));
        if (!snap.exists()) {
          orgGrid.innerHTML = "<div class='error-msg'><i class='fas fa-exclamation-triangle'></i> No organizations found.</div>";
          return [];
        }
        let allOrgs = Object.values(snap.val());
        // Safety: Remove empties, dedupe by id, fill missing
        let seen = {};
        allOrgs = allOrgs.filter(o => o && o.id && !seen[o.id] && (seen[o.id]=1));
        allOrgs.forEach(o => { o.n = o.n || 0; o.average = Number(o.average) || 0; });
        return allOrgs;
      }
      let orgs = await loadOrgs();
      let orgsView = [];
      let selectedOwner = 'All';
      let sortMode = 'score';
      let currentOrgIdx = null;

      renderTopControls();
      renderOrgCards();

      // --- Rendering ---
      function renderTopControls() {
        // Owners for filter
        const owners = Array.from(new Set(orgs.map(o => o.owner || "Unknown"))).sort();
        let html = `
          <label for="ownerFilter">Owner:</label>
          <select id="ownerFilter">
            <option value="All">All</option>
            ${owners.map(owner => `<option value="${owner}">${owner}</option>`).join('')}
          </select>
          <label for="sortMode">Sort:</label>
          <select id="sortMode">
            <option value="score">Hot Leads</option>
            <option value="az">A-Z</option>
          </select>
          <input id="orgSearch" placeholder="Search organization..." />
        `;
        topControls.innerHTML = html;

        document.getElementById('ownerFilter').value = selectedOwner;
        document.getElementById('ownerFilter').onchange = e => {
          selectedOwner = e.target.value;
          renderOrgCards();
        };
        document.getElementById('sortMode').value = sortMode;
        document.getElementById('sortMode').onchange = e => {
          sortMode = e.target.value;
          renderOrgCards();
        };
        document.getElementById('orgSearch').oninput = e => {
          renderOrgCards();
        };
      }

      function getOrgView() {
        let res = orgs.filter(o => selectedOwner === 'All' || o.owner === selectedOwner);
        const q = (document.getElementById('orgSearch')?.value || "").toLowerCase();
        if (q.length > 0) {
          res = res.filter(o => (o.company || "").toLowerCase().includes(q));
        }
        if (sortMode === 'score') {
          res = res.sort((a,b) => b.average - a.average);
        } else {
          res = res.sort((a,b) => (a.company||"").localeCompare(b.company||""));
        }
        return res;
      }

      function renderOrgCards() {
        orgsView = getOrgView();
        orgGrid.innerHTML = '';
        orgAndContactsDiv.innerHTML = '';
        orgNav.innerHTML = `<div style="text-align:center;font-size:1.19em;font-weight:600;margin-bottom:17px;">Select Organization</div>`;
        orgsView.forEach((org, idx) => {
          const card = document.createElement("div");
          card.className = "org-card" + ((currentOrgIdx!==null && orgsView[currentOrgIdx] && orgsView[currentOrgIdx].id === org.id) ? " selected" : "");
          card.innerHTML = `
            <div class="org-title">${org.company || '(No Name)'}</div>
            <div class="org-meta-row">
              <span class="org-n"><i class="fas fa-users"></i> ${org.n || 0} contact${org.n==1?'':'s'}</span>
              <span class="org-score ${
                org.average>=16 ? 'org-score-hot' : org.average>=10 ? 'org-score-med':'org-score-cold'}">
                <i class="fas fa-fire"></i> ${org.average}
              </span>
              <span class="org-owner">${org.owner || ''}</span>
            </div>
          `;
          card.onclick = () => {
            currentOrgIdx = idx;
            renderOrgNav();
            loadAndRenderOrgAndContacts(orgsView[currentOrgIdx]);
            orgGrid.style.display = "none";
          };
          orgGrid.appendChild(card);
        });
        orgGrid.style.display = "grid";
      }

      function renderOrgNav() {
        orgNav.innerHTML = '';
        if (currentOrgIdx == null || orgsView.length === 0) return;
        const navDiv = document.createElement("div");
        navDiv.className = "company-nav";

        // Home button
        const homeBtn = document.createElement("button");
        homeBtn.innerHTML = `<i class="fas fa-home"></i> Home`;
        homeBtn.onclick = () => {
            currentOrgIdx = null;
            orgGrid.style.display = "grid";
            orgAndContactsDiv.innerHTML = '';
            orgNav.innerHTML = `<div style="text-align:center;font-size:1.19em;font-weight:600;margin-bottom:17px;">Select Organization</div>`;
        };
        navDiv.appendChild(homeBtn);

        // Prev button
        const prevBtn = document.createElement("button");
        prevBtn.innerHTML = `<i class="fas fa-chevron-left"></i> Previous${currentOrgIdx > 0 ? ` (${orgsView[currentOrgIdx-1]?.company || ''})` : ''}`;
        prevBtn.disabled = (currentOrgIdx <= 0);
        prevBtn.onclick = () => {
            if (currentOrgIdx > 0) {
            currentOrgIdx--;
            renderOrgNav();
            loadAndRenderOrgAndContacts(orgsView[currentOrgIdx]);
            }
        };
        navDiv.appendChild(prevBtn);

        // Dropdown select
        const ddWrap = document.createElement("span");
        ddWrap.className = "dropdown-wrap";
        const dd = document.createElement("select");
        orgsView.forEach((org, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.selected = i === currentOrgIdx;
            opt.textContent = org.company || '';
            dd.appendChild(opt);
        });
        dd.onchange = (e) => {
            currentOrgIdx = parseInt(dd.value);
            renderOrgNav();
            loadAndRenderOrgAndContacts(orgsView[currentOrgIdx]);
        };
        ddWrap.appendChild(dd);
        navDiv.appendChild(ddWrap);

        // Next button
        const nextBtn = document.createElement("button");
        nextBtn.innerHTML = `Next${currentOrgIdx < orgsView.length-1 ? ` (${orgsView[currentOrgIdx+1]?.company || ''})` : ''} <i class="fas fa-chevron-right"></i>`;
        nextBtn.disabled = (currentOrgIdx >= orgsView.length-1);
        nextBtn.onclick = () => {
            if (currentOrgIdx < orgsView.length-1) {
            currentOrgIdx++;
            renderOrgNav();
            loadAndRenderOrgAndContacts(orgsView[currentOrgIdx]);
            }
        };
        navDiv.appendChild(nextBtn);

        orgNav.appendChild(navDiv);
        }


      async function loadAndRenderOrgAndContacts(org) {
        orgAndContactsDiv.innerHTML = `<div style='text-align:center;font-size:1.12em;margin:32px 0;'><i class="fas fa-spinner fa-spin"></i> Loading...</div>`;
        if (!org || !org.id) {
          orgAndContactsDiv.innerHTML = `<div class='error-msg'><i class="fas fa-exclamation-triangle"></i> No organization ID found. Data cannot be loaded.</div>`;
          return;
        }
        try {
          const snap = await get(ref(db, `hllinkedin522/${org.id}`));
          if (!snap.exists()) {
            orgAndContactsDiv.innerHTML = `<div class='error-msg'><i class="fas fa-exclamation-triangle"></i> No contact data found for this organization.</div>`;
            return;
          }
          const data = snap.val();
          let contacts = [];
          if (data && typeof data === 'object') {
            contacts = Object.values(data).filter(c => c && (c.first_name||c.last_name||c.email_address));
          } else if (Array.isArray(data)) {
            contacts = data.filter(c => c && (c.first_name||c.last_name||c.email_address));
          } else {
            contacts = [];
          }
          let orgName = org.company || '';
          // Org card
          let html = `<section class="organization-section">
            <div class="org-title">${orgName}</div>
            <div class="org-meta-row" style="margin-bottom:7px;">
              <span class="org-n"><i class="fas fa-users"></i> ${org.n || 0} contact${org.n==1?'':'s'}</span>
              <span class="org-score ${
                org.average>=16 ? 'org-score-hot' : org.average>=10 ? 'org-score-med':'org-score-cold'}">
                <i class="fas fa-fire"></i> ${org.average}
              </span>
              <span class="org-owner">${org.owner || ''}</span>
            </div>
            <div class="org-summary">${contacts[0]?.org_summary ? md2html(contacts[0].org_summary) : ""}</div>
            ${contacts[0]?.org_news ? newsBlock('orgnews', contacts[0].org_news, contacts[0].org_news_date, contacts[0].link_to_org_news, false) : ""}
            <div class="outreach-section">
              <b>Organization Notes / Timeline</b>
              <form id="noteform___orgnotes__" class="note-row" autocomplete="off">
                <textarea id="noteinput___orgnotes__" class="out-textarea" rows="1" maxlength="512" placeholder="Add a note about the organization..."></textarea>
                <button type="submit" class="note-submit-btn">Add Note</button>
              </form>
              <div id="timeline___orgnotes__" class="timeline"></div>
            </div>
          </section>`;
          // Setup org notes/timeline
          setTimeout(() => {
            setupOrgNotesEvents(org.id);
            loadTimeline(org.id, "__orgnotes__");
          }, 200);

          // Contacts
          if (!contacts.length) {
            html += `<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> No contacts for this organization.</div>`;
          } else {
            contacts.forEach((person, idx) => {
              const cKey = safeKey(person.url, person.id);
              html += `<section class="contact-card">
                <div class="contact-top">
                  <div>
                    <div class="contact-name">${person.first_name || ''} ${person.last_name || ''} 
                      <span class="contact-owner">${person.owner||""}</span>
                      <span class="contact-score ${person.overall_rate>=16 ? "hot": person.overall_rate>=10 ? "med":"cold"}">${person.overall_rate || ''}</span>
                    </div>
                    <div class="contact-title">${person.position || ""}</div>
                    <div class="contact-linkedin"><i class="fab fa-linkedin"></i> <a href="${person.url||"#"}" target="_blank">${person.url||""}</a></div>
                    <div class="contact-email"><i class="fas fa-envelope"></i> <a href="mailto:${person.email_address||""}">${person.email_address||""}</a></div>
                    <div style="font-size:0.98em; color:#555;">Connected: ${person.connected_on?formatDate(person.connected_on):"–"}</div>
                  </div>
                </div>
                ${person.person_news ? newsBlock("personnews"+idx, person.person_news, person.person_news_date, person.link_to_person_news, true) : ''}
                ${person.person_background ? `<div class="person-background">${md2html(person.person_background)}</div>` : ""}
                ${renderMessageDrafts(person)}
                <div class="outreach-section">
                  <b>Contact Timeline & Outreach</b>
                  <div class="out-btns-row" id="badbtns_${cKey}">
                    <button class="bad-btn out-btn" data-type="Bad Contact"><i class="fas fa-user-slash"></i> Bad Contact</button>
                  </div>
                  <div class="out-btns-row" id="outbtns_${cKey}">
                    <button class="out-btn out-btn-act" data-type="Sent Email"><i class="fas fa-envelope"></i> Sent Email</button>
                    <button class="out-btn out-btn-act" data-type="LinkedIn Message"><i class="fab fa-linkedin"></i> LinkedIn Message</button>
                  </div>
                  <form id="noteform_${cKey}" class="note-row" autocomplete="off">
                    <textarea id="noteinput_${cKey}" class="out-textarea" rows="1" maxlength="512" placeholder="Add a note about this contact..."></textarea>
                    <button type="submit" class="note-submit-btn">Add Note</button>
                  </form>
                  <div id="timeline_${cKey}" class="timeline"></div>
                </div>
              </section>`;
              setTimeout(() => {
                setupOutreachEvents(org.id, cKey, `${person.first_name || ''} ${person.last_name || ''}`);
                loadTimeline(org.id, cKey);
              }, 400 + idx * 10);
            });
          }
          orgAndContactsDiv.innerHTML = html;

          // Hook up copy/collapse events
          orgAndContactsDiv.querySelectorAll('.copy-btn').forEach(btn => {
            btn.onclick = () => {
              copyText(btn.dataset.txt || "");
              btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
              setTimeout(() => btn.innerHTML = `<i class="far fa-copy"></i> Copy to Clipboard`, 1800);
            };
          });
          orgAndContactsDiv.querySelectorAll('.email-btn').forEach(btn => {
            btn.onclick = () => sendEmail(btn.dataset.email, btn.dataset.txt);
          });
          orgAndContactsDiv.querySelectorAll('.expand-btn').forEach(btn => {
            btn.onclick = function() {
              const id = btn.dataset.id;
              const isOrg = btn.dataset.isorg==="true";
              const newsDiv = document.getElementById(id + '_content');
              newsDiv.innerHTML = btn.dataset.full;
              btn.style.display = "none";
            };
          });
        } catch(e) {
          orgAndContactsDiv.innerHTML = `<div class='error-msg'><i class="fas fa-exclamation-triangle"></i> Error loading data from Firebase.<br>${e}</div>`;
        }
      }

      function newsBlock(id, text, date, url, isPerson) {
        const short = text.length>220 ? text.slice(0,220)+"..." : text;
        const btn = text.length>220 ? `<button class="expand-btn" data-id="${id}" data-full="${md2html(text)}" data-isorg="${!isPerson}"><i class="fas fa-chevron-down"></i> Show More</button>` : "";
        let newsInfo = "";
        if (date) newsInfo += `<span style="color:#888;font-size:0.95em;">${formatDate(date)}</span> `;
        if (url) newsInfo += `<a class="news-link" href="${url}" target="_blank">Source</a>`;
        return `
          <div class="${isPerson ? "person-news-block" : "news-block"}" id="${id}_block">
            <div id="${id}_content">${md2html(short)}</div>
            <div style="margin-top:7px;">${newsInfo} ${btn}</div>
          </div>
        `;
      }

      function renderMessageDrafts(person) {
        const blocks = [];
        if (person.org_message) {
          blocks.push(`<div class="msg-draft-block"><div class="msg-label">LinkedIn Message (Org News):</div>
            <div>${md2html(person.org_message)}</div>
            <div class="msg-actions">
              <button class="copy-btn" data-txt="${person.org_message.replace(/"/g,'&quot;')}"><i class="far fa-copy"></i> Copy to Clipboard</button>
            </div>
          </div>`);
        }
        if (person.person_message) {
          blocks.push(`<div class="msg-draft-block"><div class="msg-label">LinkedIn Message (Person News):</div>
            <div>${md2html(person.person_message)}</div>
            <div class="msg-actions">
              <button class="copy-btn" data-txt="${person.person_message.replace(/"/g,'&quot;')}"><i class="far fa-copy"></i> Copy to Clipboard</button>
            </div>
          </div>`);
        }
        return blocks.join('');
      }

    });
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <i class="fas fa-stethoscope fa-2x"></i>
      <span class="page-title">HealthLuminate LinkedIn Contact Prospecting</span>
    </div>
  </header>
  <div class="container">
    <div class="main-content">
      <div id="topControls" class="top-controls"></div>
      <div id="orgNav"></div>
      <div id="orgGrid" class="card-grid"></div>
      <div id="orgAndContacts"></div>
    </div>
  </div>
</body>
</html>
