<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Portal Dashboard – HealthLuminate</title>
  <link rel="icon" type="image/png" href="../../images/HealthLuminate-Bright.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --dark-blue: #2D6B83; --blue: #44A1C4; --gold: #DBA660;
      --gray: #6b7280; --light: #f0f4f8; --border: #e2e8f0;
      --success: #16a34a; --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--light); color: #1e293b; min-height: 100vh; }

    .site-header {
      background: white; border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    .site-header .brand { display: flex; align-items: center; gap: 0.75rem; }
    .site-header img { height: 32px; }
    .site-header .logo-text { font-weight: 700; color: var(--dark-blue); font-size: 1rem; }
    .btn-logout {
      background: none; border: 1px solid var(--border); color: var(--gray);
      padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.82rem; cursor: pointer;
      font-family: inherit; display: flex; align-items: center; gap: 0.4rem;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .page { max-width: 880px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .loading-state { text-align: center; padding: 5rem 2rem; color: #9ca3af; }
    .spinner { font-size: 1.75rem; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .card {
      background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; border: 1px solid var(--border);
    }
    .card h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .card h2 i { color: var(--dark-blue); }

    .company-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.25rem; }
    .company-logo { height: 44px; max-width: 140px; object-fit: contain; }
    .company-name { font-size: 1.3rem; font-weight: 700; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600;
      padding: 0.25rem 0.65rem; border-radius: 999px; margin-top: 0.35rem;
    }
    .status-pill.on { background: #dcfce7; color: #166534; }
    .status-pill.off { background: #fef3c7; color: #92400e; }

    .link-row {
      display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;
      background: var(--light); border-radius: 8px; padding: 0.6rem 0.75rem;
    }
    .link-row input {
      flex: 1; border: none; background: none; font-size: 0.85rem; color: #1e293b; font-family: inherit;
    }
    .link-row input:focus { outline: none; }

    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.9rem; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
    .btn-primary { background: var(--dark-blue); color: white; }
    .btn-primary:hover { background: #235567; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--gray); }
    .btn-outline:hover { border-color: var(--blue); color: var(--dark-blue); }
    .btn-danger-outline { background: none; border: 1px solid #fca5a5; color: var(--danger); }
    .btn-danger-outline:hover { background: #fef2f2; }
    .btn-small { padding: 0.35rem 0.7rem; font-size: 0.78rem; }

    .team-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .team-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 10px; }
    .team-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; color: white; flex-shrink: 0; }
    .team-info { flex: 1; min-width: 0; }
    .team-info .name { font-weight: 600; font-size: 0.88rem; }
    .team-info .email { color: var(--gray); font-size: 0.78rem; }
    .team-provider { font-size: 0.75rem; color: var(--gray); display: flex; align-items: center; gap: 0.3rem; }
    .you-badge { font-size: 0.68rem; font-weight: 700; color: var(--dark-blue); background: #eff6ff; padding: 0.15rem 0.5rem; border-radius: 999px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 620px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: #374151; }
    .form-group input, .form-group select {
      border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.7rem;
      font-size: 0.875rem; font-family: inherit; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(68,161,196,0.12); }

    .days-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .day-chip { padding: 0.4rem 0.7rem; border: 1px solid var(--border); border-radius: 999px; font-size: 0.8rem; cursor: pointer; user-select: none; }
    .day-chip.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); font-weight: 600; }

    .save-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; }
    .save-msg { font-size: 0.82rem; color: var(--success); opacity: 0; transition: opacity 0.2s; }
    .save-msg.show { opacity: 1; }

    .danger-zone { border-top: 1px dashed var(--border); margin-top: 1.25rem; padding-top: 1.25rem; }
    .danger-zone p { font-size: 0.8rem; color: var(--gray); margin-bottom: 0.75rem; }

    .alert { display: flex; gap: 0.6rem; padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; }
    .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-info { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img src="../../images/HealthLuminate-Bright.png" alt="HealthLuminate" onerror="this.style.display='none'">
    <span class="logo-text">HealthLuminate · Client Portal</span>
  </div>
  <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign out</button>
</header>

<div class="page" id="page">
  <div class="loading-state">
    <i class="fas fa-circle-notch spinner"></i>
    <p>Loading your booking portal…</p>
  </div>
</div>

<script>
const API = 'https://railwayclemail-production.up.railway.app';
const TOKEN_KEY = 'cbPortalToken';
let me = null;
let currentSettings = null;

function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  window.location.href = './login.html';
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}`, ...(opts.headers || {}) },
  });
  const data = await res.json();
  if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
  return data;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function initials(name) {
  return String(name || '').split(/\s+/).filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('') || '?';
}

async function init() {
  // Extract session token delivered via URL hash right after OAuth login
  if (window.location.hash.startsWith('#token=')) {
    localStorage.setItem(TOKEN_KEY, window.location.hash.slice(7));
    history.replaceState(null, '', window.location.pathname);
  }

  if (!getToken()) {
    window.location.href = './login.html';
    return;
  }

  try {
    const data = await apiFetch('/client-booking/session/me');
    me = data;
    const settingsData = await apiFetch('/client-booking/session/availability');
    currentSettings = settingsData.settings;
    render();
  } catch (err) {
    document.getElementById('page').innerHTML = `
      <div class="alert alert-error" style="margin-top:2rem"><i class="fas fa-exclamation-triangle"></i> ${escHtml(err.message)}</div>
      <button class="btn btn-outline" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Back to sign in</button>`;
  }
}

function render() {
  const { host, company } = me;
  const branding = company.branding || {};
  const primary = branding.primaryColor || '#2D6B83';

  document.getElementById('page').innerHTML = `
    <div class="card">
      <div class="company-header">
        ${branding.logoUrl ? `<img src="${escHtml(branding.logoUrl)}" class="company-logo" onerror="this.style.display='none'">` : `<div class="team-avatar" style="background:${primary};width:44px;height:44px;font-size:1rem">${initials(company.companyName)}</div>`}
        <div>
          <div class="company-name">${escHtml(company.companyName)}</div>
          <span class="status-pill ${company.enabled ? 'on' : 'off'}">
            <i class="fas fa-circle" style="font-size:0.5rem"></i> ${company.enabled ? 'Booking page live' : 'Awaiting activation'}
          </span>
        </div>
      </div>
      ${company.enabled && company.bookingLink ? `
        <div class="link-row">
          <input type="text" readonly value="${escHtml(company.bookingLink)}" id="linkInput">
          <button class="btn btn-primary btn-small" onclick="copyLink()"><i class="fas fa-copy"></i> Copy</button>
          <a href="${escHtml(company.bookingLink)}" target="_blank" class="btn btn-outline btn-small"><i class="fas fa-arrow-up-right-from-square"></i> View</a>
        </div>
      ` : `
        <div class="alert alert-info" style="margin-top:1rem"><i class="fas fa-info-circle"></i> Your HealthLuminate representative needs to activate this booking page before your link goes live. Your calendar is connected and ready.</div>
      `}
    </div>

    <div class="card">
      <h2><i class="fas fa-users"></i> Connected team members</h2>
      <div class="team-list">
        ${(company.hosts || []).map(h => `
          <div class="team-row">
            <div class="team-avatar" style="background:${h.color || primary}">${initials(h.name)}</div>
            <div class="team-info">
              <div class="name">${escHtml(h.name)} ${h.hostId === host.hostId ? '<span class="you-badge">YOU</span>' : ''}</div>
              <div class="email">${escHtml(h.email)}</div>
            </div>
            <div class="team-provider">
              <i class="fab fa-${h.provider === 'google' ? 'google' : 'microsoft'}"></i> ${h.provider === 'google' ? 'Google' : 'Microsoft'} Calendar
            </div>
          </div>
        `).join('') || '<p style="color:var(--gray);font-size:0.85rem">No one has connected a calendar yet.</p>'}
      </div>
      <p style="margin-top:0.9rem;font-size:0.8rem;color:var(--gray)">
        Teammates can add themselves by signing in at <a href="./login.html" style="color:var(--dark-blue);font-weight:600">this same login page</a> with their work Google or Microsoft account.
      </p>
    </div>

    <div class="card">
      <h2><i class="fas fa-clock"></i> Your availability</h2>
      <div id="saveAlert"></div>
      <div class="form-group">
        <label>Timezone</label>
        <select id="tz">${buildTzOptions(currentSettings.timezone)}</select>
      </div>
      <div class="form-group">
        <label>Which days can guests book you?</label>
        <div class="days-row" id="daysRow">${buildDayChips(currentSettings.workingDays)}</div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Start of day</label>
          <input type="time" id="startTime" value="${currentSettings.workingHoursStart || '09:00'}">
        </div>
        <div class="form-group">
          <label>End of day</label>
          <input type="time" id="endTime" value="${currentSettings.workingHoursEnd || '17:00'}">
        </div>
        <div class="form-group">
          <label>Buffer between meetings (minutes)</label>
          <input type="number" id="buffer" min="0" max="120" value="${currentSettings.bufferMinutes ?? 15}">
        </div>
        <div class="form-group">
          <label>Minimum notice (hours)</label>
          <input type="number" id="notice" min="0" max="168" value="${currentSettings.minNoticeHours ?? 2}">
        </div>
      </div>
      <div class="save-row">
        <button class="btn btn-primary" onclick="saveAvailability()" id="saveBtn"><i class="fas fa-save"></i> Save availability</button>
        <span class="save-msg" id="saveMsg"><i class="fas fa-check"></i> Saved</span>
      </div>
    </div>

    <div class="card">
      <h2><i class="fas fa-shield-alt"></i> Calendar connection</h2>
      <p style="font-size:0.85rem;color:var(--gray);margin-bottom:0.75rem">
        You're connected via <strong>${host.provider === 'google' ? 'Google' : 'Microsoft'} Calendar</strong> (${escHtml(host.email)}). We only access your free/busy times and the events we create for your bookings.
      </p>
      <div class="danger-zone">
        <p>Disconnecting removes you from the booking page and revokes calendar access. This can't be undone — you'd need to sign in again to reconnect.</p>
        <button class="btn btn-danger-outline" onclick="disconnect()"><i class="fas fa-unlink"></i> Disconnect my calendar</button>
      </div>
    </div>
  `;
}

function buildTzOptions(current) {
  const tzList = [
    ['America/New_York', 'Eastern (ET)'], ['America/Chicago', 'Central (CT)'],
    ['America/Denver', 'Mountain (MT)'], ['America/Los_Angeles', 'Pacific (PT)'],
    ['America/Phoenix', 'Arizona (MST)'], ['UTC', 'UTC'],
  ];
  return tzList.map(([val, lbl]) => `<option value="${val}" ${val === current ? 'selected' : ''}>${lbl}</option>`).join('');
}

function buildDayChips(activeDays) {
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const active = new Set(activeDays || [1,2,3,4,5]);
  return DOW.map((d, i) => `<div class="day-chip ${active.has(i) ? 'active' : ''}" data-day="${i}" onclick="toggleDay(${i})">${d}</div>`).join('');
}

function toggleDay(i) {
  const chip = document.querySelector(`.day-chip[data-day="${i}"]`);
  chip.classList.toggle('active');
}

async function saveAvailability() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  const workingDays = [...document.querySelectorAll('.day-chip.active')].map(el => parseInt(el.dataset.day));
  try {
    await apiFetch('/client-booking/session/availability', {
      method: 'PUT',
      body: JSON.stringify({
        timezone: document.getElementById('tz').value,
        workingDays,
        workingHoursStart: document.getElementById('startTime').value,
        workingHoursEnd: document.getElementById('endTime').value,
        bufferMinutes: parseInt(document.getElementById('buffer').value) || 0,
        minNoticeHours: parseInt(document.getElementById('notice').value) || 0,
      }),
    });
    const msg = document.getElementById('saveMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  } catch (err) {
    document.getElementById('saveAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> ${escHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function copyLink() {
  const input = document.getElementById('linkInput');
  navigator.clipboard.writeText(input.value).then(() => {
    const btn = event.target.closest('button');
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
    setTimeout(() => btn.innerHTML = original, 1800);
  });
}

async function disconnect() {
  if (!confirm('Disconnect your calendar and remove yourself from the booking page? You will need to sign in again to reconnect.')) return;
  try {
    await apiFetch('/client-booking/session/disconnect', { method: 'POST' });
    logout();
  } catch (err) {
    alert('Could not disconnect: ' + err.message);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
