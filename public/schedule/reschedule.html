<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reschedule Meeting – HealthLuminate</title>
  <link rel="icon" type="image/png" href="../../images/HealthLuminate-Bright.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --dark-blue: #2D6B83; --blue: #44A1C4; --gold: #DBA660;
      --gray: #6b7280; --light: #f0f4f8; --border: #e2e8f0;
      --success: #16a34a; --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--light); color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }

    .site-header { background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 0.75rem; }
    .site-header a { text-decoration: none; display: flex; align-items: center; gap: 0.75rem; }
    .site-header img { height: 32px; }
    .site-header .logo-text { font-weight: 700; color: var(--dark-blue); font-size: 1rem; }

    .page-wrapper { flex: 1; display: flex; flex-direction: column; }
    .page-container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; flex: 1; }
    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--gray); font-size: 0.85rem; text-decoration: none; padding: 0.5rem 0; transition: color 0.15s; }
    .back-link:hover { color: var(--dark-blue); }

    /* ── Booking card ── */
    .booking-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; display: flex; margin-top: 1rem; }
    @media (max-width: 700px) { .booking-card { flex-direction: column; } }

    .left-panel { width: 260px; flex-shrink: 0; background: linear-gradient(160deg, #2D6B83 0%, #1a4f63 100%); color: white; padding: 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    @media (max-width: 700px) { .left-panel { width: 100%; } }
    .host-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: white; border: 2px solid rgba(255,255,255,0.3); }
    .host-avatars { display: flex; }
    .host-avatars .host-avatar:not(:first-child) { margin-left: -12px; }
    .panel-section { display: flex; flex-direction: column; gap: 0.5rem; }
    .panel-label { font-size: 0.72rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
    .panel-value { font-size: 0.9rem; font-weight: 600; }
    .panel-divider { border: none; border-top: 1px solid rgba(255,255,255,0.2); }
    .current-time { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 0.75rem; font-size: 0.82rem; line-height: 1.5; }
    .current-label { font-size: 0.72rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.3rem; }

    /* ── Right panel ── */
    .right-panel { flex: 1; padding: 2rem; overflow: hidden; }
    .panel-title { font-size: 1rem; font-weight: 700; color: #1e293b; margin-bottom: 1.25rem; }

    /* ── Calendar ── */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .cal-nav h3 { font-size: 0.95rem; font-weight: 600; }
    .cal-nav-btn { background: none; border: 1px solid var(--border); border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gray); transition: all 0.15s; }
    .cal-nav-btn:hover { border-color: var(--blue); color: var(--dark-blue); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 1.25rem; }
    .cal-dow { text-align: center; font-size: 0.72rem; font-weight: 600; color: var(--gray); padding: 0.25rem 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .cal-day { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.82rem; cursor: pointer; transition: all 0.15s; background: white; }
    .cal-day:hover:not(.unavailable):not(.past) { border-color: var(--blue); background: rgba(68,161,196,0.08); }
    .cal-day.has-slots { border-color: var(--blue); color: var(--dark-blue); font-weight: 600; }
    .cal-day.selected { background: var(--dark-blue); color: white; border-color: var(--dark-blue); font-weight: 700; }
    .cal-day.unavailable { color: var(--border); cursor: not-allowed; background: #fafafa; }
    .cal-day.past { color: #d1d5db; cursor: not-allowed; }
    .cal-day.empty { border: none; background: none; cursor: default; }

    /* ── Slots ── */
    .slots-header { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.625rem; }
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    @media (max-width: 480px) { .slots-grid { grid-template-columns: repeat(2, 1fr); } }
    .slot-btn { padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px; background: white; font-size: 0.82rem; cursor: pointer; text-align: center; transition: all 0.15s; font-family: inherit; }
    .slot-btn:hover { border-color: var(--blue); background: rgba(68,161,196,0.06); }
    .slot-btn.selected { background: var(--dark-blue); color: white; border-color: var(--dark-blue); font-weight: 600; }

    /* ── Timezone ── */
    .tz-select-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.82rem; color: var(--gray); }
    .tz-select-row select { border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.8rem; }

    /* ── Summary ── */
    .booking-summary { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; font-size: 0.875rem; }
    .summary-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-row i { color: #d97706; width: 16px; }
    .new-time-preview { background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; font-size: 0.875rem; }
    .new-time-preview .label { font-weight: 600; color: var(--success); margin-bottom: 0.4rem; font-size: 0.8rem; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.65rem 1.25rem; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; text-decoration: none; }
    .btn-primary { background: var(--dark-blue); color: white; }
    .btn-primary:hover { background: #235567; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--gray); }
    .btn-outline:hover { border-color: var(--blue); color: var(--dark-blue); }
    .actions-row { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }

    /* ── Alert ── */
    .alert { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.875rem 1.1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
    .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-info  { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }

    /* ── Confirmation ── */
    .confirmation { text-align: center; padding: 2.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .confirm-icon { width: 64px; height: 64px; border-radius: 50%; background: #dcfce7; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--success); }
    .confirmation h2 { font-size: 1.35rem; font-weight: 700; }
    .confirmation p  { color: var(--gray); max-width: 380px; line-height: 1.6; font-size: 0.9rem; }
    .confirm-details { background: #f8fafc; border-radius: 10px; padding: 1.1rem 1.25rem; text-align: left; width: 100%; max-width: 380px; font-size: 0.875rem; }
    .confirm-details .row { display: flex; gap: 0.6rem; margin-bottom: 0.4rem; }
    .confirm-details .row i { color: var(--dark-blue); width: 16px; }

    /* ── Error page ── */
    .error-page { text-align: center; padding: 3rem 2rem; }
    .error-page i { font-size: 3rem; color: #d1d5db; margin-bottom: 1rem; display: block; }

    /* ── Loading ── */
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    footer { padding: 1.5rem; text-align: center; color: var(--gray); font-size: 0.8rem; }
    footer a { color: var(--dark-blue); text-decoration: none; }
    .no-slots { text-align: center; padding: 1.25rem; color: var(--gray); font-size: 0.875rem; background: #f9fafb; border-radius: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<header class="site-header">
  <a href="https://healthluminate.com/public/schedule/">
    <img src="../../images/HealthLuminate-Bright.png" alt="" onerror="this.style.display='none'">
    <span class="logo-text">HealthLuminate</span>
  </a>
</header>

<div class="page-wrapper">
  <div class="page-container">
    <a href="./index.html" class="back-link"><i class="fas fa-arrow-left"></i> All meeting types</a>

    <div id="pageContent" style="margin-top:1rem">
      <div style="text-align:center;padding:4rem 2rem;color:#9ca3af">
        <i class="fas fa-circle-notch spinner" style="font-size:1.75rem;margin-bottom:1rem"></i>
        <p>Loading booking details…</p>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2026 HealthLuminate &nbsp;·&nbsp; <a href="https://healthluminate.com">healthluminate.com</a></p>
</footer>

<script>
const API = 'https://railwayclemail-production.up.railway.app';

const TEAM = {
  taylor: { name: 'Taylor Davis',    initials: 'TD', color: '#2D6B83' },
  joe:    { name: 'Joe Anne Noreno', initials: 'JN', color: '#DBA660' },
  sam:    { name: 'Sam Ellsworth',   initials: 'SE', color: '#44A1C4' },
};

const params      = new URLSearchParams(window.location.search);
const bookingId   = params.get('id');
const cancelToken = params.get('token');

let booking      = null;
let availability = [];
let allDates     = {};
let selectedDate = null;
let selectedSlot = null;
let currentWeekStart = null;
let guestTz      = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Denver';

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  if (!bookingId || !cancelToken) { showError('Invalid Link', 'This reschedule link is missing required parameters.'); return; }

  try {
    // Load existing booking
    const bRes = await fetch(`${API}/api/calendar/bookings/${bookingId}/public?token=${encodeURIComponent(cancelToken)}`);
    const bData = await bRes.json();
    if (!bData.success) throw new Error(bData.error || 'Could not load booking');
    booking = bData.booking;

    if (booking.status === 'cancelled') {
      showError('Meeting Already Cancelled', 'This meeting has been cancelled and cannot be rescheduled.');
      return;
    }

    // Load availability for the same meeting type
    const aRes = await fetch(`${API}/api/calendar/availability?type=${booking.type}&days=42`);
    const aData = await aRes.json();
    if (!aData.success) throw new Error(aData.error || 'Could not load availability');
    availability = aData.availableDates || [];
    allDates = {};
    availability.forEach(d => allDates[d.date] = d.slots);

    if (availability.length > 0) {
      const firstDate = new Date(availability[0].date + 'T12:00:00');
      currentWeekStart = getWeekStart(firstDate);
    } else {
      currentWeekStart = getWeekStart(new Date());
    }

    renderRescheduleCard();
  } catch (err) {
    showError('Could not load booking', err.message);
  }
}

function showError(title, detail) {
  document.getElementById('pageContent').innerHTML = `
    <div class="error-page">
      <i class="fas fa-calendar-times"></i>
      <h2>${title}</h2>
      <p style="color:#6b7280;margin-bottom:1.5rem">${detail}</p>
      <a href="./index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Scheduling</a>
    </div>`;
}

function getWeekStart(date) {
  const d = new Date(date); d.setDate(d.getDate() - d.getDay()); d.setHours(0,0,0,0); return d;
}

function toDateStr(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// ── Render main card ──────────────────────────────────────────────────────
function renderRescheduleCard() {
  const hosts = (booking.hosts || []).map(k => TEAM[k]).filter(Boolean);
  const avatarHtml = hosts.map(h =>
    `<div class="host-avatar" style="background:${h.color}">${h.initials}</div>`
  ).join('');

  const currentStart = new Date(booking.startTime);
  const currentDisplay = currentStart.toLocaleString('en-US', {
    timeZone: guestTz, weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
  });

  document.getElementById('pageContent').innerHTML = `
    <div class="booking-card">
      <div class="left-panel">
        <div class="host-avatars">${avatarHtml}</div>
        <div class="panel-section">
          <div class="panel-label">Meeting</div>
          <div class="panel-value">${booking.label}</div>
        </div>
        <div class="panel-section">
          <div class="panel-label">Duration</div>
          <div class="panel-value">${booking.durationMinutes} minutes</div>
        </div>
        <hr class="panel-divider">
        <div>
          <div class="current-label">Current time</div>
          <div class="current-time">${currentDisplay}</div>
        </div>
        <div class="panel-section" style="margin-top:auto">
          <div class="panel-label" id="tzNote">Times shown in <span id="tzDisplay">${guestTz.replace(/_/g,' ')}</span></div>
        </div>
      </div>

      <div class="right-panel" id="rightPanel">
        ${renderPickerStep()}
      </div>
    </div>`;
}

// ── Step 1: Pick new date/time ────────────────────────────────────────────
function renderPickerStep() {
  return `
    <div class="panel-title">Choose a new time</div>

    <div class="booking-summary">
      <div class="summary-row"><i class="fas fa-exchange-alt"></i> <span>Rescheduling: <strong>${booking.label}</strong></span></div>
      <div class="summary-row"><i class="fas fa-user"></i> <span>${booking.guestName}</span></div>
    </div>

    <div class="tz-select-row">
      <i class="fas fa-globe"></i>
      <span>Timezone:</span>
      <select id="tzSelect" onchange="changeTz(this.value)">${buildTzOptions()}</select>
    </div>

    <div id="calContainer">${renderCalendar()}</div>
    <div id="slotsContainer"></div>
    <div id="alertContainer"></div>`;
}

function buildTzOptions() {
  const tzList = [
    ['America/New_York','Eastern (ET)'],['America/Chicago','Central (CT)'],
    ['America/Denver','Mountain (MT)'],['America/Los_Angeles','Pacific (PT)'],
    ['America/Phoenix','Arizona (MST)'],['UTC','UTC'],
  ];
  return tzList.map(([val,lbl]) =>
    `<option value="${val}" ${val===guestTz?'selected':''}>${lbl}</option>`
  ).join('') + (!tzList.find(t=>t[0]===guestTz) ? `<option value="${guestTz}" selected>${guestTz.replace(/_/g,' ')}</option>` : '');
}

function changeTz(tz) {
  guestTz = tz;
  document.getElementById('tzDisplay').textContent = tz.replace(/_/g,' ');
  selectedSlot = null;
  document.getElementById('calContainer').innerHTML = renderCalendar();
  document.getElementById('slotsContainer').innerHTML = '';
}

function renderCalendar() {
  const ws  = new Date(currentWeekStart);
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = new Date(); today.setHours(0,0,0,0);

  let html = `<div class="cal-nav">
    <button class="cal-nav-btn" onclick="prevWeek()" ${isPrevDisabled()?'disabled':''}><i class="fas fa-chevron-left"></i></button>
    <h3>${monthLabel(ws)}</h3>
    <button class="cal-nav-btn" onclick="nextWeek()"><i class="fas fa-chevron-right"></i></button>
  </div><div class="cal-grid">`;
  DOW.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
  for (let i = 0; i < 35; i++) {
    const d  = new Date(ws.getTime() + i * 86400000);
    const ds = toDateStr(d);
    const isPast = d < today;
    const hasSl  = !!allDates[ds];
    const isSel  = ds === selectedDate;
    let cls = 'cal-day';
    if (isPast) cls += ' past';
    else if (hasSl) cls += ' has-slots';
    else cls += ' unavailable';
    if (isSel) cls += ' selected';
    const onclick = (!isPast && hasSl) ? `onclick="selectDate('${ds}')"` : '';
    html += `<div class="${cls}" ${onclick}>${d.getDate()}</div>`;
  }
  html += `</div>`;
  return html;
}

function monthLabel(ws) {
  const end = new Date(ws.getTime() + 34 * 86400000);
  const fmt = d => d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  return ws.getMonth() === end.getMonth() ? fmt(ws) : `${ws.toLocaleDateString('en-US',{month:'short'})} – ${end.toLocaleDateString('en-US',{month:'short',year:'numeric'})}`;
}

function isPrevDisabled() {
  const today = new Date(); today.setHours(0,0,0,0);
  return currentWeekStart <= getWeekStart(today);
}
function prevWeek() { currentWeekStart = new Date(currentWeekStart.getTime() - 35*86400000); document.getElementById('calContainer').innerHTML = renderCalendar(); }
function nextWeek() { currentWeekStart = new Date(currentWeekStart.getTime() + 35*86400000); document.getElementById('calContainer').innerHTML = renderCalendar(); }

function selectDate(ds) {
  selectedDate = ds; selectedSlot = null;
  document.getElementById('calContainer').innerHTML = renderCalendar();
  renderSlots();
}

function renderSlots() {
  const slots = allDates[selectedDate] || [];
  if (!slots.length) {
    document.getElementById('slotsContainer').innerHTML = `<div class="no-slots">No slots available on this date.</div>`;
    return;
  }
  const d = new Date(selectedDate + 'T12:00:00');
  const dayLabel = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const slotBtns = slots.map(iso => {
    const timeStr = new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz});
    return `<button class="slot-btn ${iso===selectedSlot?'selected':''}" onclick="selectSlot('${iso}',this)">${timeStr}</button>`;
  }).join('');
  document.getElementById('slotsContainer').innerHTML = `
    <div class="slots-header">${dayLabel}</div>
    <div class="slots-grid">${slotBtns}</div>
    <div id="slotNextBtn" style="display:none;justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-primary" onclick="showConfirmStep()"><i class="fas fa-arrow-right"></i> Confirm New Time</button>
    </div>`;
}

function selectSlot(iso, btn) {
  selectedSlot = iso;
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const nb = document.getElementById('slotNextBtn');
  if (nb) nb.style.display = 'flex';
}

// ── Step 2: Confirm ───────────────────────────────────────────────────────
function showConfirmStep() {
  if (!selectedSlot) return;
  const newEnd = new Date(new Date(selectedSlot).getTime() + booking.durationMinutes * 60000);
  const newDisplay = new Date(selectedSlot).toLocaleString('en-US',{
    timeZone: guestTz, weekday:'long', month:'long', day:'numeric',
    hour:'numeric', minute:'2-digit', timeZoneName:'short',
  });

  document.getElementById('rightPanel').innerHTML = `
    <div class="panel-title">Confirm New Time</div>

    <div class="booking-summary">
      <div class="summary-row"><i class="fas fa-calendar-times"></i>
        <span style="text-decoration:line-through;color:#9ca3af">
          ${new Date(booking.startTime).toLocaleString('en-US',{timeZone:guestTz,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
        </span>
      </div>
    </div>

    <div class="new-time-preview">
      <div class="label"><i class="fas fa-check-circle"></i> New time</div>
      <strong>${newDisplay}</strong>
      <div style="font-size:0.8rem;color:#6b7280;margin-top:0.25rem">${booking.durationMinutes} min &middot; ends ${newEnd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})}</div>
    </div>

    <div id="confirmAlert"></div>

    <div class="actions-row">
      <button class="btn btn-outline" onclick="renderRescheduleCard()"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-primary" id="confirmBtn" onclick="doReschedule()">
        <i class="fas fa-calendar-check"></i> Confirm Reschedule
      </button>
    </div>`;
}

async function doReschedule() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Rescheduling…';
  document.getElementById('confirmAlert').innerHTML = '';

  try {
    const res = await fetch(`${API}/api/calendar/reschedule`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookingId, cancelToken, newStartTime: selectedSlot, timezone: guestTz }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Reschedule failed');

    // Update local state with new token
    booking.startTime   = data.newStartTime;
    booking.cancelToken = data.cancelToken;

    showRescheduleConfirmed(data.newStartTime, data.cancelToken);
  } catch (err) {
    document.getElementById('confirmAlert').innerHTML = `
      <div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i><span>${err.message}</span></div>`;
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-calendar-check"></i> Confirm Reschedule';
  }
}

function showRescheduleConfirmed(newStartTime, newToken) {
  const newEnd = new Date(new Date(newStartTime).getTime() + booking.durationMinutes * 60000);
  const newDisplay = new Date(newStartTime).toLocaleString('en-US',{
    timeZone: guestTz, weekday:'long', month:'long', day:'numeric',
    hour:'numeric', minute:'2-digit', timeZoneName:'short',
  });
  const hostNames = (booking.hosts || []).map(k => TEAM[k]?.name || k).join(' & ');

  document.getElementById('rightPanel').innerHTML = `
    <div class="confirmation">
      <div class="confirm-icon"><i class="fas fa-check"></i></div>
      <h2>Meeting Rescheduled!</h2>
      <p>A new calendar invitation will arrive from your host. Accept it to update the meeting on your calendar.</p>
      <div class="confirm-details">
        <div class="row"><i class="fas fa-calendar"></i> <span>${newDisplay}</span></div>
        <div class="row"><i class="fas fa-clock"></i> <span>${booking.durationMinutes} min · ends ${newEnd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})}</span></div>
        <div class="row"><i class="fas fa-user"></i> <span>With ${hostNames}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;width:100%;max-width:340px">
        <a href="./reschedule.html?id=${bookingId}&token=${newToken}" class="btn btn-outline" style="justify-content:center">
          <i class="fas fa-calendar-alt"></i> Reschedule again
        </a>
        <a href="./cancel.html?id=${bookingId}&token=${newToken}" class="btn btn-outline" style="justify-content:center;color:#dc2626;border-color:#fca5a5">
          <i class="fas fa-times"></i> Cancel this meeting
        </a>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', init);
</script>
