<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule a Meeting – HealthLuminate</title>
  <link rel="icon" type="image/png" href="../../images/HealthLuminate-Bright.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --dark-blue: #2D6B83;
      --blue: #44A1C4;
      --gold: #DBA660;
      --gray: #6b7280;
      --light: #f0f4f8;
      --border: #e2e8f0;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--light);
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────── */
    .site-header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .logo img { height: 36px; }
    .logo-text { font-weight: 700; font-size: 1.1rem; color: var(--dark-blue); }
    .header-tagline { font-size: 0.8rem; color: var(--gray); }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #2D6B83 0%, #44A1C4 60%, #DBA660 100%);
      color: white;
      text-align: center;
      padding: 4rem 2rem 3rem;
    }
    .hero h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: 0.75rem; }
    .hero p  { font-size: 1.05rem; opacity: 0.9; max-width: 540px; margin: 0 auto; line-height: 1.6; }

    /* ── Container ────────────────────────────────────────── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

    /* ── Section headings ─────────────────────────────────── */
    .section-heading {
      font-size: 1rem; font-weight: 700; color: var(--gray);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 2.5rem 0 1rem;
    }

    /* ── Host cards (individual) ─────────────────────────── */
    .host-section { margin: 2.5rem 0 1rem; }
    .host-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .host-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; color: white;
      flex-shrink: 0;
    }
    .host-info h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.1rem; }
    .host-info p  { font-size: 0.85rem; color: var(--gray); }

    .duration-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 600px) { .duration-grid { grid-template-columns: 1fr; } }

    .duration-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex; flex-direction: column; gap: 0.5rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .duration-card:hover {
      border-color: var(--blue);
      box-shadow: 0 8px 24px rgba(68,161,196,0.18);
      transform: translateY(-2px);
    }
    .duration-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; margin-bottom: 0.25rem;
    }
    .duration-card .dur-label { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
    .duration-card .dur-desc  { font-size: 0.82rem; color: var(--gray); line-height: 1.4; }
    .duration-card .dur-arrow {
      margin-top: auto; font-size: 0.8rem; color: var(--blue); font-weight: 600;
      display: flex; align-items: center; gap: 0.3rem;
    }

    /* ── Joint meetings ───────────────────────────────────── */
    .joint-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 700px) { .joint-grid { grid-template-columns: 1fr; } }

    .joint-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }
    .joint-card:hover {
      border-color: var(--blue);
      box-shadow: 0 8px 24px rgba(68,161,196,0.18);
      transform: translateY(-2px);
    }
    .joint-card-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .joint-avatars { display: flex; }
    .joint-avatars .host-avatar { width: 36px; height: 36px; font-size: 0.75rem; border: 2px solid white; }
    .joint-avatars .host-avatar:not(:first-child) { margin-left: -10px; }
    .joint-card h3  { font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem; }
    .joint-card p   { font-size: 0.82rem; color: var(--gray); line-height: 1.4; }
    .joint-durations { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
    .dur-pill {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--dark-blue);
      display: flex; align-items: center; gap: 0.35rem;
      transition: all 0.15s;
    }
    .dur-pill:hover { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

    /* ── Next-available banner ────────────────────────────── */
    .next-avail-banner {
      background: linear-gradient(135deg, #1a4f63 0%, #2D6B83 60%, #3d8fa8 100%);
      border-radius: 14px;
      padding: 1.75rem 2rem;
      margin: 2rem 0 0.5rem;
      color: white;
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
      flex-wrap: wrap;
    }
    .next-avail-text h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.3rem; }
    .next-avail-text p  { font-size: 0.875rem; opacity: 0.85; line-height: 1.5; }
    .next-avail-pills { display: flex; gap: 0.75rem; flex-wrap: wrap; flex-shrink: 0; }
    .next-pill {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      padding: 0.6rem 1.1rem;
      font-size: 0.875rem; font-weight: 700;
      color: white; text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem;
      transition: all 0.2s;
    }
    .next-pill:hover { background: rgba(255,255,255,0.28); border-color: white; transform: translateY(-1px); }
    .next-pill .pill-gold { color: #DBA660; }
    @media (max-width: 600px) {
      .next-avail-banner { flex-direction: column; align-items: flex-start; }
    }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      text-align: center; padding: 3rem 1.5rem 2rem;
      color: var(--gray); font-size: 0.85rem;
    }
    footer a { color: var(--dark-blue); text-decoration: none; }

    /* ── Loading state ────────────────────────────────────── */
    .loading-overlay {
      text-align: center; padding: 4rem 2rem; color: var(--gray);
    }
    .loading-overlay .spinner { font-size: 2rem; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .divider { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  </style>
</head>
<body>

<header class="site-header">
  <a href="https://healthluminate.com" class="logo">
    <img src="../../images/HealthLuminate-Bright.png" alt="HealthLuminate" onerror="this.style.display='none'">
    <span class="logo-text">HealthLuminate</span>
  </a>
  <span class="header-tagline">Schedule a Meeting</span>
</header>

<section class="hero">
  <h1>Book a Meeting with Our Team</h1>
  <p>Choose the person and time that works best for you. We look forward to connecting.</p>
</section>

<div class="container" id="mainContent">
  <div class="loading-overlay">
    <div class="spinner"><i class="fas fa-circle-notch"></i></div>
    <p>Loading scheduling options…</p>
  </div>
</div>

<footer>
  <p>&copy; 2026 HealthLuminate &nbsp;·&nbsp; <a href="https://healthluminate.com">healthluminate.com</a></p>
</footer>

<script>
const BASE = 'https://healthluminate.com';
const BOOK_URL = type => `${BASE}/public/schedule/book.html?type=${type}`;

const TEAM_INFO = {
  taylor: {
    name: 'Taylor Davis',
    email: 'taylordavis@healthluminate.com',
    color: '#2D6B83',
    initials: 'TD',
    title: 'HealthLuminate',
    bio: 'Book time with Taylor to discuss strategy, partnerships, or product.',
  },
  joe: {
    name: 'Joe Annoreno',
    email: 'joeannoreno@healthluminate.com',
    color: '#DBA660',
    initials: 'JN',
    title: 'HealthLuminate',
    bio: 'Book time with Joe to discuss sales, outreach, or your healthcare data needs.',
  },
  sam: {
    name: 'Sam Ellsworth',
    email: 'samellsworth@healthluminate.com',
    color: '#44A1C4',
    initials: 'SE',
    title: 'HealthLuminate',
    bio: 'Book time with Sam to discuss analytics, implementation, or support.',
  },
};

const DURATION_DESCRIPTIONS = {
  15: { icon: '⚡', desc: 'Quick intro or status update' },
  30: { icon: '💬', desc: 'Discovery call or demo' },
  60: { icon: '🔬', desc: 'Deep dive or detailed discussion' },
};

const INDIVIDUAL = {
  taylor: ['taylor-15','taylor-30','taylor-60'],
  joe:    ['joe-15','joe-30','joe-60'],
  sam:    ['sam-15','sam-30','sam-60'],
};

const JOINT = [
  { key: 'taylor-joe', hosts: ['taylor','joe'], durations: [30, 60] },
  { key: 'taylor-sam', hosts: ['taylor','sam'], durations: [30, 60] },
];

function buildPage() {
  const content = document.getElementById('mainContent');

  let html = '';

  // ── Next-available banner ─────────────────────────────────────────────────
  html += `
    <div class="next-avail-banner">
      <div class="next-avail-text">
        <h2><i class="fas fa-bolt" style="color:#DBA660;margin-right:.4rem"></i>Book with the Next Available Team Member</h2>
        <p>Don't have a preference? We'll match you with whoever is free first — Taylor, Joe, or Sam.</p>
      </div>
      <div class="next-avail-pills">
        <a href="${BOOK_URL('any-15')}" class="next-pill"><span class="pill-gold">⚡</span> 15 min</a>
        <a href="${BOOK_URL('any-30')}" class="next-pill"><span class="pill-gold">💬</span> 30 min</a>
        <a href="${BOOK_URL('any-60')}" class="next-pill"><span class="pill-gold">🔬</span> 60 min</a>
      </div>
    </div>`;

  // Individual section header
  html += `<div class="section-heading" style="margin-top:2.5rem">Individual Meetings</div>`;

  // Individual hosts
  Object.entries(INDIVIDUAL).forEach(([hostKey, types]) => {
    const info = TEAM_INFO[hostKey];
    html += `
      <div class="host-section">
        <div class="host-header">
          <div class="host-avatar" style="background:${info.color}">${info.initials}</div>
          <div class="host-info">
            <h2>${info.name}</h2>
            <p>${info.bio}</p>
          </div>
        </div>
        <div class="duration-grid">
          ${types.map(type => {
            const dur = parseInt(type.split('-')[1]);
            const d = DURATION_DESCRIPTIONS[dur];
            return `
              <a href="${BOOK_URL(type)}" class="duration-card">
                <div class="duration-icon" style="background:${info.color}20;color:${info.color}">
                  <i class="fas ${dur === 15 ? 'fa-bolt' : dur === 30 ? 'fa-comments' : 'fa-microscope'}"></i>
                </div>
                <div class="dur-label">${dur} Minutes</div>
                <div class="dur-desc">${d.desc} with ${info.name.split(' ')[0]}</div>
                <div class="dur-arrow"><i class="fas fa-arrow-right"></i> Select a time</div>
              </a>`;
          }).join('')}
        </div>
      </div>`;

    html += `<hr class="divider">`;
  });

  // Joint section
  html += `<div class="section-heading">Joint Meetings</div>`;
  html += `<div class="joint-grid">`;

  JOINT.forEach(joint => {
    const hosts = joint.hosts.map(k => TEAM_INFO[k]);
    const avatarHtml = hosts.map(h =>
      `<div class="host-avatar" style="background:${h.color}">${h.initials}</div>`
    ).join('');
    const names = hosts.map(h => h.name.split(' ')[0]).join(' & ');
    const durPills = joint.durations.map(dur =>
      `<a href="${BOOK_URL(joint.key + '-' + dur)}" class="dur-pill"><i class="fas fa-clock"></i> ${dur} min</a>`
    ).join('');

    html += `
      <div class="joint-card">
        <div class="joint-card-header">
          <div class="joint-avatars">${avatarHtml}</div>
          <div>
            <h3>Meet with ${names}</h3>
            <p>${hosts.map(h => h.name).join(' and ')} · HealthLuminate</p>
          </div>
        </div>
        <p>Schedule time with both ${names} in a single meeting for collaborative discussions.</p>
        <div class="joint-durations">${durPills}</div>
      </div>`;
  });

  html += `</div>`;
  html += `<div style="height:3rem"></div>`;

  content.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', buildPage);
</script>
</body>
</html>
