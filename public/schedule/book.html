<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Meeting – Pando Executive Networking</title>
  <link rel="icon" type="image/png" href="../../images/pando_trees_transparent.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --dark-blue: #0F2D4D;
      --blue: #5E7C5B;
      --gold: #C9973D;
      --gray: #6b7280;
      --light: #f0f4f8;
      --border: #e2e8f0;
      --white: #fff;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--light);
      color: #1e293b;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Site header ───────────────────────────────────── */
    .site-header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .site-header a { text-decoration: none; display: flex; align-items: center; gap: 0.75rem; }
    .site-header img { height: 32px; }
    .site-header .logo-text { font-weight: 700; color: var(--dark-blue); font-size: 1rem; }

    /* ── Back link ─────────────────────────────────────── */
    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: var(--gray); font-size: 0.85rem; text-decoration: none;
      padding: 0.5rem 0;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--dark-blue); }

    /* ── Page layout ───────────────────────────────────── */
    .page-wrapper { flex: 1; display: flex; flex-direction: column; }
    .page-container {
      max-width: 980px; margin: 0 auto; padding: 2rem 1.5rem;
      width: 100%; flex: 1;
    }

    /* ── Booking card layout ───────────────────────────── */
    .booking-card {
      background: white; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden; display: flex;
    }
    @media (max-width: 760px) { .booking-card { flex-direction: column; } }

    /* ── Left panel ────────────────────────────────────── */
    .left-panel {
      width: 280px; flex-shrink: 0;
      background: linear-gradient(160deg, #0F2D4D 0%, #081a2c 100%);
      color: white;
      padding: 2rem 1.5rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    @media (max-width: 760px) { .left-panel { width: 100%; } }

    .host-section { display: flex; flex-direction: column; gap: 0.75rem; }
    .host-avatars { display: flex; }
    .host-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: white;
      border: 3px solid rgba(255,255,255,0.3); flex-shrink: 0;
    }
    .host-avatars .host-avatar:not(:first-child) { margin-left: -14px; }

    .host-names { font-size: 1.05rem; font-weight: 700; }
    .host-org   { font-size: 0.82rem; opacity: 0.8; }

    .meeting-details { display: flex; flex-direction: column; gap: 0.6rem; }
    .detail-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.875rem; opacity: 0.9; }
    .detail-row i { width: 16px; opacity: 0.7; }

    .panel-divider { border: none; border-top: 1px solid rgba(255,255,255,0.2); }

    .tz-note { font-size: 0.78rem; opacity: 0.7; }

    /* ── Right panel ───────────────────────────────────── */
    .right-panel { flex: 1; padding: 2rem; overflow: hidden; }

    /* ── Step indicator ────────────────────────────────── */
    .steps { display: flex; gap: 0; margin-bottom: 1.5rem; }
    .step {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.82rem; font-weight: 500; color: var(--gray);
      padding: 0 0.25rem;
    }
    .step.active { color: var(--dark-blue); }
    .step.done   { color: var(--success); }
    .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
    }
    .step-sep { flex: 1; height: 2px; background: var(--border); margin: 0 0.5rem; }

    /* ── Calendar ──────────────────────────────────────── */
    .panel-title { font-size: 1rem; font-weight: 700; color: #1e293b; margin-bottom: 1.25rem; }

    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .cal-nav h3 { font-size: 0.95rem; font-weight: 600; color: #1e293b; }
    .cal-nav-btn {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--gray); transition: all 0.15s;
    }
    .cal-nav-btn:hover { border-color: var(--blue); color: var(--dark-blue); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 4px; margin-bottom: 1.5rem;
    }
    .cal-dow {
      text-align: center; font-size: 0.72rem; font-weight: 600;
      color: var(--gray); padding: 0.25rem 0;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; cursor: pointer;
      transition: all 0.15s; background: white;
    }
    .cal-day:hover:not(.unavailable):not(.past) {
      border-color: var(--blue); background: rgba(94,124,91,0.08);
    }
    .cal-day.has-slots { border-color: var(--blue); color: var(--dark-blue); font-weight: 600; }
    .cal-day.selected  { background: var(--dark-blue); color: white; border-color: var(--dark-blue); font-weight: 700; }
    .cal-day.unavailable { color: var(--border); cursor: not-allowed; background: #fafafa; }
    .cal-day.past        { color: #d1d5db; cursor: not-allowed; }
    .cal-day.empty       { border: none; background: none; cursor: default; }

    /* ── Time slots ────────────────────────────────────── */
    .slots-header { font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-bottom: 0.75rem; }
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    @media (max-width: 480px) { .slots-grid { grid-template-columns: repeat(2, 1fr); } }

    .slot-btn {
      padding: 0.5rem 0.4rem; border: 1px solid var(--border);
      border-radius: 8px; background: white; font-size: 0.82rem;
      cursor: pointer; text-align: center; transition: all 0.15s;
      font-family: inherit;
    }
    .slot-btn:hover   { border-color: var(--blue); background: rgba(94,124,91,0.06); }
    .slot-btn.selected { background: var(--dark-blue); color: white; border-color: var(--dark-blue); font-weight: 600; }

    .no-slots {
      text-align: center; padding: 1.5rem; color: var(--gray); font-size: 0.875rem;
      background: #f9fafb; border-radius: 8px; border: 1px solid var(--border);
    }

    /* ── Form ──────────────────────────────────────────── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: #374151; }
    .form-group input, .form-group select, .form-group textarea {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 0.75rem; font-size: 0.875rem; font-family: inherit;
      outline: none; transition: border-color 0.15s;
      background: white;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--blue); box-shadow: 0 0 0 3px rgba(94,124,91,0.12);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group.full-width { grid-column: 1 / -1; }
    .field-required { color: var(--danger); }

    .tz-select-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.82rem; color: var(--gray); }
    .tz-select-row select { border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.8rem; }

    /* ── Summary box ────────────────────────────────────── */
    .booking-summary {
      background: #f4f7f2; border: 1px solid #d8e3d3;
      border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem;
      font-size: 0.875rem;
    }
    .summary-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-row i { color: var(--dark-blue); width: 16px; }

    /* ── Action buttons ────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.65rem 1.25rem; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; font-family: inherit; text-decoration: none;
    }
    .btn-primary { background: var(--dark-blue); color: white; }
    .btn-primary:hover { background: #0a1f35; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--gray); }
    .btn-outline:hover { border-color: var(--blue); color: var(--dark-blue); }
    .btn-block { width: 100%; justify-content: center; margin-top: 1.25rem; padding: 0.8rem; font-size: 0.95rem; }

    .actions-row { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }

    /* ── Spinner ────────────────────────────────────────── */
    .spinner { font-size: 1.3rem; animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── Error / success states ─────────────────────────── */
    .alert {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.875rem 1.1rem; border-radius: 8px;
      font-size: 0.875rem; margin-bottom: 1rem;
    }
    .alert-error   { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    .alert-info    { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }

    /* ── Confirmation screen ────────────────────────────── */
    .confirmation {
      text-align: center; padding: 2.5rem 1.5rem;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .confirm-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: #dcfce7; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: var(--success);
    }
    .confirmation h2 { font-size: 1.5rem; font-weight: 700; }
    .confirmation p  { color: var(--gray); line-height: 1.6; max-width: 400px; }
    .confirm-details {
      background: #f8fafc; border-radius: 10px; padding: 1.25rem 1.5rem;
      text-align: left; width: 100%; max-width: 400px; font-size: 0.875rem;
    }
    .confirm-details .row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; }
    .confirm-details .row i { color: var(--dark-blue); width: 16px; }
    .confirm-details .row:last-child { margin-bottom: 0; }

    /* ── Error page ─────────────────────────────────────── */
    .error-page { text-align: center; padding: 3rem 2rem; }
    .error-page i { font-size: 3rem; color: #d1d5db; margin-bottom: 1rem; display: block; }
    .error-page h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .error-page p  { color: var(--gray); margin-bottom: 1.5rem; }

    footer { padding: 2rem; text-align: center; color: var(--gray); font-size: 0.82rem; }
    footer a { color: var(--dark-blue); text-decoration: none; }
  </style>
</head>
<body>

<header class="site-header">
  <a href="https://pandonetworking.com/public/schedule/">
    <img src="../../images/pando_logo_transparent.png" alt="Pando Executive Networking" onerror="this.style.display='none'">
    <span class="logo-text">Pando Executive Networking</span>
  </a>
</header>

<div class="page-wrapper">
  <div class="page-container">

    <a href="./index.html" class="back-link"><i class="fas fa-arrow-left"></i> All meeting types</a>

    <div id="pageContent" style="margin-top:1rem">
      <!-- Loading state -->
      <div style="text-align:center;padding:4rem 2rem;color:#9ca3af">
        <i class="fas fa-circle-notch spinner" style="font-size:1.75rem;margin-bottom:1rem"></i>
        <p>Loading availability…</p>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>&copy; 2026 Pando Executive Networking &nbsp;·&nbsp; <a href="https://pandonetworking.com">pandonetworking.com</a></p>
</footer>

<script>
const API = 'https://railwayclemail-production.up.railway.app';

const TEAM = {
  taylor: { name: 'Taylor Davis',    initials: 'TD', color: '#0F2D4D' },
  joe:    { name: 'Joe Anne Noreno', initials: 'JN', color: '#C9973D' },
  sam:    { name: 'Sam Ellsworth',   initials: 'SE', color: '#5E7C5B' },
};

// State
let meetingType = null;      // from API
let availability = [];       // array of { date, slots[] }
let selectedDate = null;
let selectedSlot = null;
let currentWeekStart = null;
let allDates = {};           // date string -> slots[]
let guestTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Denver';
let currentStep = 1;

// ── Parse query params ────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const typeKey = params.get('type');

// ── Boot ─────────────────────────────────────────────────────────────────
async function init() {
  if (!typeKey) { showError('No meeting type specified.', 'Go back and select a meeting type.'); return; }
  try {
    const res = await fetch(`${API}/api/calendar/availability?type=${typeKey}&days=42`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load availability');
    meetingType = data;
    availability = data.availableDates || [];
    allDates = {};
    availability.forEach(d => allDates[d.date] = d.slots);
    if (availability.length > 0) {
      const firstDate = new Date(availability[0].date + 'T12:00:00');
      currentWeekStart = getWeekStart(firstDate);
    } else {
      currentWeekStart = getWeekStart(new Date());
    }
    renderBookingCard();
  } catch (err) {
    showError('Could not load availability.', err.message);
  }
}

function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun
  d.setDate(d.getDate() - day); // go to Sunday
  d.setHours(0,0,0,0);
  return d;
}

function showError(title, detail) {
  document.getElementById('pageContent').innerHTML = `
    <div class="error-page">
      <i class="fas fa-calendar-times"></i>
      <h2>${title}</h2>
      <p>${detail}</p>
      <a href="./index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to All Meetings</a>
    </div>`;
}

// ── Render main booking card ──────────────────────────────────────────────
function renderBookingCard() {
  const info = meetingType;
  const hosts = info.hosts || [];
  const dur = info.meetingType?.duration || 30;
  const label = info.meetingType?.label || 'Meeting';
  const isAny = typeKey && typeKey.startsWith('any-');

  const avatarHtml = hosts.map(h =>
    `<div class="host-avatar" style="background:${h.color}">${TEAM[h.key]?.initials || h.key[0].toUpperCase()}</div>`
  ).join('');

  const hostNames = isAny
    ? 'Meet with a Pando Leader'
    : hosts.map(h => h.name).join(' & ');

  document.getElementById('pageContent').innerHTML = `
    <div class="booking-card">
      <!-- Left panel: meeting info -->
      <div class="left-panel">
        <div class="host-section">
          <div class="host-avatars">${avatarHtml}</div>
          <div class="host-names">${hostNames}</div>
          <div class="host-org">${isAny ? 'Taylor Davis, Joe Annoreno, or Sam Ellsworth · Pando Executive Networking' : 'Pando Executive Networking'}</div>
        </div>
        <hr class="panel-divider">
        <div class="meeting-details">
          <div class="detail-row"><i class="fas fa-tag"></i> <span>${label}</span></div>
          <div class="detail-row"><i class="fas fa-clock"></i> <span>${dur} minutes</span></div>
          <div class="detail-row"><i class="fas fa-video"></i> <span>Video / Phone (details in invite)</span></div>
        </div>
        <hr class="panel-divider">
        <div class="tz-note" id="tzNote">Times shown in <strong id="tzDisplay">${guestTz.replace(/_/g,' ')}</strong></div>
      </div>

      <!-- Right panel: steps -->
      <div class="right-panel" id="rightPanel">
        ${renderStep1()}
      </div>
    </div>`;
}

// ── Step 1: Date & Time ───────────────────────────────────────────────────
function renderStep1() {
  return `
    <div class="steps">
      <div class="step active"><div class="step-num">1</div> Date &amp; Time</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">2</div> Your Info</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">3</div> Confirm</div>
    </div>

    <div class="panel-title">Select a date</div>

    <div class="tz-select-row">
      <i class="fas fa-globe"></i>
      <span>Timezone:</span>
      <select id="tzSelect" onchange="changeTz(this.value)">${buildTzOptions()}</select>
    </div>

    <div id="calContainer">${renderCalendar()}</div>

    <div id="slotsContainer"></div>`;
}

function buildTzOptions() {
  const tzList = [
    ['America/New_York',    'Eastern (ET)'],
    ['America/Chicago',     'Central (CT)'],
    ['America/Denver',      'Mountain (MT)'],
    ['America/Los_Angeles', 'Pacific (PT)'],
    ['America/Phoenix',     'Arizona (MST)'],
    ['UTC',                 'UTC'],
  ];
  return tzList.map(([val, lbl]) =>
    `<option value="${val}" ${val === guestTz ? 'selected' : ''}>${lbl}</option>`
  ).join('') +
  // Fallback: add detected TZ if not in list
  (!tzList.find(t => t[0] === guestTz) ? `<option value="${guestTz}" selected>${guestTz.replace(/_/g,' ')}</option>` : '');
}

function changeTz(tz) {
  guestTz = tz;
  document.getElementById('tzDisplay').textContent = tz.replace(/_/g,' ');
  selectedSlot = null;
  document.getElementById('calContainer').innerHTML = renderCalendar();
  document.getElementById('slotsContainer').innerHTML = '';
}

function renderCalendar() {
  const ws = new Date(currentWeekStart);
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Build 6-week view (42 days) starting from currentWeekStart
  let html = `<div class="cal-nav">
    <button class="cal-nav-btn" id="calPrev" onclick="prevWeek()" ${isPrevDisabled() ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>
    <h3 id="calMonthLabel">${monthLabel(ws)}</h3>
    <button class="cal-nav-btn" onclick="nextWeek()"><i class="fas fa-chevron-right"></i></button>
  </div>`;

  html += `<div class="cal-grid">`;
  DOW.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 35; i++) {
    const d = new Date(ws.getTime() + i * 86400000);
    const ds = toDateStr(d);
    const isPast = d < today;
    const hasSl = !!allDates[ds];
    const isSel = ds === selectedDate;

    let cls = 'cal-day';
    if (isPast) cls += ' past';
    else if (hasSl) cls += ' has-slots';
    else cls += ' unavailable';
    if (isSel) cls += ' selected';

    const onclick = (!isPast && hasSl) ? `onclick="selectDate('${ds}')"` : '';
    html += `<div class="${cls}" ${onclick}>${d.getDate()}</div>`;
  }
  html += `</div>`;
  return html;
}

function monthLabel(ws) {
  const end = new Date(ws.getTime() + 34 * 86400000);
  const fmt = d => d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  if (ws.getMonth() === end.getMonth()) return fmt(ws);
  return `${ws.toLocaleDateString('en-US',{month:'short'})} – ${end.toLocaleDateString('en-US',{month:'short',year:'numeric'})}`;
}

function isPrevDisabled() {
  const today = new Date(); today.setHours(0,0,0,0);
  return currentWeekStart <= getWeekStart(today);
}

function prevWeek() {
  currentWeekStart = new Date(currentWeekStart.getTime() - 35 * 86400000);
  document.getElementById('calContainer').innerHTML = renderCalendar();
}

function nextWeek() {
  currentWeekStart = new Date(currentWeekStart.getTime() + 35 * 86400000);
  document.getElementById('calContainer').innerHTML = renderCalendar();
}

function toDateStr(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function selectDate(ds) {
  selectedDate = ds;
  selectedSlot = null;
  document.getElementById('calContainer').innerHTML = renderCalendar();
  renderSlots();
}

function renderSlots() {
  const slots = allDates[selectedDate] || [];
  if (!slots.length) {
    document.getElementById('slotsContainer').innerHTML = `<div class="no-slots"><i class="fas fa-calendar-times" style="margin-right:.4rem"></i>No slots available on this date.</div>`;
    return;
  }

  const d = new Date(selectedDate + 'T12:00:00');
  const dayLabel = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  const slotBtns = slots.map(isoTime => {
    const timeStr = new Date(isoTime).toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', timeZone: guestTz,
    });
    const isSel = isoTime === selectedSlot;
    return `<button class="slot-btn ${isSel ? 'selected' : ''}" onclick="selectSlot('${isoTime}',this)">${timeStr}</button>`;
  }).join('');

  document.getElementById('slotsContainer').innerHTML = `
    <div class="slots-header">${dayLabel}</div>
    <div class="slots-grid">${slotBtns}</div>
    <div class="actions-row" id="step1Next" style="display:none">
      <button class="btn btn-primary" onclick="goStep2()"><i class="fas fa-arrow-right"></i> Next: Your Info</button>
    </div>`;
}

function selectSlot(isoTime, btn) {
  selectedSlot = isoTime;
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('step1Next').style.display = 'flex';
}

// ── Step 2: Guest info form ───────────────────────────────────────────────
function goStep2() {
  if (!selectedSlot) return;
  currentStep = 2;
  document.getElementById('rightPanel').innerHTML = `
    <div class="steps">
      <div class="step done"><div class="step-num"><i class="fas fa-check" style="font-size:.65rem"></i></div> Date &amp; Time</div>
      <div class="step-sep" style="background:var(--dark-blue)"></div>
      <div class="step active"><div class="step-num">2</div> Your Info</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">3</div> Confirm</div>
    </div>

    <div class="booking-summary">
      <div class="summary-row"><i class="fas fa-calendar"></i> <span>${formatSlotDisplay(selectedSlot)}</span></div>
      <div class="summary-row"><i class="fas fa-clock"></i> <span>${meetingType.meetingType?.duration} minutes</span></div>
      <div class="summary-row"><i class="fas fa-globe"></i> <span>${guestTz.replace(/_/g,' ')}</span></div>
    </div>

    <div class="panel-title">Enter your details</div>
    <div id="formAlert"></div>

    <div class="form-grid">
      <div class="form-group">
        <label>First &amp; Last Name <span class="field-required">*</span></label>
        <input type="text" id="guestName" placeholder="Your full name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Email Address <span class="field-required">*</span></label>
        <input type="email" id="guestEmail" placeholder="you@company.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Company / Organization</label>
        <input type="text" id="guestCompany" placeholder="Optional" autocomplete="organization" />
      </div>
      <div class="form-group full-width">
        <label>Notes or Agenda (optional)</label>
        <textarea id="guestNotes" placeholder="What would you like to discuss?"></textarea>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn btn-outline" onclick="goStep1()"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-primary" onclick="goStep3()">Review Booking <i class="fas fa-arrow-right"></i></button>
    </div>`;
}

function goStep1() {
  currentStep = 1;
  document.getElementById('rightPanel').innerHTML = renderStep1();
  // Restore selected date & slot in calendar
  if (selectedDate) {
    setTimeout(() => {
      selectDate(selectedDate);
      setTimeout(() => {
        if (selectedSlot) {
          document.querySelectorAll('.slot-btn').forEach(btn => {
            if (btn.textContent.trim() === new Date(selectedSlot).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})) {
              btn.classList.add('selected');
              selectedSlot = selectedSlot; // keep it
            }
          });
          document.getElementById('step1Next').style.display = 'flex';
        }
      }, 50);
    }, 10);
  }
}

function goStep3() {
  const name    = document.getElementById('guestName').value.trim();
  const email   = document.getElementById('guestEmail').value.trim();
  const company = document.getElementById('guestCompany').value.trim();
  const notes   = document.getElementById('guestNotes').value.trim();

  if (!name || !email) {
    document.getElementById('formAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> Please fill in your name and email address.</div>`;
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('formAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> Please enter a valid email address.</div>`;
    return;
  }

  currentStep = 3;
  const dur = meetingType.meetingType?.duration;
  const endSlot = new Date(new Date(selectedSlot).getTime() + dur * 60000);

  document.getElementById('rightPanel').innerHTML = `
    <div class="steps">
      <div class="step done"><div class="step-num"><i class="fas fa-check" style="font-size:.65rem"></i></div> Date &amp; Time</div>
      <div class="step-sep" style="background:var(--dark-blue)"></div>
      <div class="step done"><div class="step-num"><i class="fas fa-check" style="font-size:.65rem"></i></div> Your Info</div>
      <div class="step-sep" style="background:var(--dark-blue)"></div>
      <div class="step active"><div class="step-num">3</div> Confirm</div>
    </div>

    <div class="panel-title">Confirm your booking</div>
    <div id="confirmAlert"></div>

    <div class="booking-summary" style="background:#f0f9ff;border-color:#bae6fd">
      <div class="summary-row"><i class="fas fa-calendar"></i> <strong>${formatSlotDisplay(selectedSlot)}</strong></div>
      <div class="summary-row"><i class="fas fa-clock"></i> ${dur} min &nbsp;(ends ${new Date(endSlot).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})})</div>
      <div class="summary-row"><i class="fas fa-user"></i> ${escHtml(name)}</div>
      <div class="summary-row"><i class="fas fa-envelope"></i> ${escHtml(email)}</div>
      ${company ? `<div class="summary-row"><i class="fas fa-building"></i> ${escHtml(company)}</div>` : ''}
      ${notes   ? `<div class="summary-row"><i class="fas fa-sticky-note"></i> ${escHtml(notes)}</div>` : ''}
      <div class="summary-row"><i class="fas fa-globe"></i> ${guestTz.replace(/_/g,' ')}</div>
    </div>

    <div class="alert alert-info" style="margin-bottom:0">
      <i class="fas fa-info-circle"></i>
      <span>A calendar invitation (.ics) will be emailed to <strong>${escHtml(email)}</strong> upon confirmation.</span>
    </div>

    <div class="actions-row">
      <button class="btn btn-outline" onclick="goStep2Back('${escHtml(name)}','${escHtml(email)}','${escHtml(company)}','${escHtml(notes)}')"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-primary" id="confirmBtn" onclick="confirmBooking('${escHtml(name)}','${escHtml(email)}','${escHtml(company)}','${escHtml(notes)}')">
        <i class="fas fa-check"></i> Confirm Meeting
      </button>
    </div>`;
}

function goStep2Back(name, email, company, notes) {
  goStep2();
  setTimeout(() => {
    document.getElementById('guestName').value    = name;
    document.getElementById('guestEmail').value   = email;
    document.getElementById('guestCompany').value = company;
    document.getElementById('guestNotes').value   = notes;
  }, 10);
}

async function confirmBooking(name, email, company, notes) {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Booking…';
  document.getElementById('confirmAlert').innerHTML = '';

  const payload = {
    type:         typeKey,
    startTime:    selectedSlot,
    guestName:    name,
    guestEmail:   email,
    guestCompany: company,
    notes:        notes,
    timezone:     guestTz,
  };
  console.log('[Booking] Sending request to', `${API}/api/calendar/book`);
  console.log('[Booking] Payload:', JSON.stringify(payload, null, 2));

  try {
    const res = await fetch(`${API}/api/calendar/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    console.log('[Booking] HTTP status:', res.status, res.statusText);
    const data = await res.json();
    console.log('[Booking] Response:', JSON.stringify(data, null, 2));

    if (!data.success) throw new Error(data.error || 'Booking failed');

    if (data.invitesSent === false) {
      console.warn('[Booking] ⚠ invitesSent=false — calendar invites were NOT sent.');
    } else if (data.invitesSent === true) {
      console.log('[Booking] ✓ invitesSent=true — calendar invites sent successfully.');
    }
    if (data.warnings && data.warnings.length) {
      data.warnings.forEach(w => console.warn('[Booking] Warning:', w));
    }
    if (!data.cancelToken) {
      console.warn('[Booking] ⚠ No cancelToken in response — cancel/reschedule links will not work.');
    }

    showConfirmation(name, email, data.bookingId, data.cancelToken, data.teamsUrl);
  } catch (err) {
    console.error('[Booking] Error:', err.message);
    document.getElementById('confirmAlert').innerHTML = `
      <div class="alert alert-error">
        <i class="fas fa-exclamation-triangle"></i>
        <span>${err.message}</span>
      </div>`;
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Confirm Meeting';
  }
}

function showConfirmation(name, email, bookingId, cancelToken, teamsUrl) {
  const dur = meetingType.meetingType?.duration;
  const endSlot = new Date(new Date(selectedSlot).getTime() + dur * 60000);
  const hostNames = (meetingType.hosts || []).map(h => h.name).join(' & ');

  document.getElementById('rightPanel').innerHTML = `
    <div class="confirmation">
      <div class="confirm-icon"><i class="fas fa-check"></i></div>
      <h2>You're booked!</h2>
      <p>A calendar invitation will arrive from your host at <strong>${escHtml(email)}</strong>. Accept it to add the meeting to your calendar.</p>

      <div class="confirm-details">
        <div class="row"><i class="fas fa-calendar"></i> <span>${formatSlotDisplay(selectedSlot)}</span></div>
        <div class="row"><i class="fas fa-clock"></i> <span>${dur} min &nbsp;(ends ${new Date(endSlot).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})})</span></div>
        <div class="row"><i class="fas fa-user"></i> <span>With ${hostNames}</span></div>
        <div class="row"><i class="fas fa-globe"></i> <span>${guestTz.replace(/_/g,' ')}</span></div>
        ${teamsUrl ? `<div class="row"><i class="fab fa-microsoft" style="color:#5059C9"></i> <span><a href="${escHtml(teamsUrl)}" target="_blank" rel="noopener" style="color:#0F2D4D;font-weight:600">Join Microsoft Teams meeting</span></div>` : ''}
      </div>

      <div style="display:flex;flex-direction:column;gap:0.75rem;width:100%;max-width:360px">
        <a href="./reschedule.html?id=${bookingId}&token=${cancelToken}" class="btn btn-outline" style="justify-content:center">
          <i class="fas fa-calendar-alt"></i> Reschedule
        </a>
        <a href="./cancel.html?id=${bookingId}&token=${cancelToken}" class="btn btn-outline" style="justify-content:center;color:#dc2626;border-color:#fca5a5">
          <i class="fas fa-times"></i> Cancel this meeting
        </a>
      </div>
    </div>`;
}

// ── Helpers ───────────────────────────────────────────────────────────────
function formatSlotDisplay(isoTime) {
  return new Date(isoTime).toLocaleString('en-US', {
    timeZone: guestTz,
    weekday: 'long', month: 'long', day: 'numeric',
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
  });
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Start ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
