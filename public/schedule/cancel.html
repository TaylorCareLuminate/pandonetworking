<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancel Meeting – Pando Executive Networking</title>
  <link rel="icon" type="image/png" href="../../images/pando_trees_transparent.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; }
    .site-header { background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; align-items: center; gap: 0.75rem; }
    .site-header a { text-decoration: none; display: flex; align-items: center; gap: 0.75rem; }
    .site-header img { height: 32px; }
    .site-header .logo-text { font-weight: 700; color: #0F2D4D; }
    .page-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
    .cancel-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; max-width: 480px; width: 100%; text-align: center; }
    .icon-wrap { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1.25rem; }
    .icon-warning { background: #fff3cd; color: #d97706; }
    .icon-success { background: #dcfce7; color: #16a34a; }
    .icon-error   { background: #fef2f2; color: #dc2626; }
    .icon-info    { background: #eff6ff; color: #2563eb; }
    h2 { font-size: 1.35rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
    p  { color: #6b7280; line-height: 1.6; font-size: 0.9rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.65rem 1.25rem; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; text-decoration: none; }
    .btn-danger  { background: #dc2626; color: white; }
    .btn-danger:hover  { background: #b91c1c; }
    .btn-primary { background: #0F2D4D; color: white; }
    .btn-primary:hover { background: #0a1f35; }
    .btn-outline { background: none; border: 1px solid #e2e8f0; color: #6b7280; }
    .btn-outline:hover { border-color: #5E7C5B; color: #0F2D4D; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-row { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .verify-form { margin-top: 1.25rem; text-align: left; }
    .verify-form label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 0.35rem; }
    .verify-form input { width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
    .verify-form input:focus { outline: none; border-color: #5E7C5B; box-shadow: 0 0 0 3px rgba(94,124,91,0.15); }
    .error-inline { color: #dc2626; font-size: 0.82rem; margin-top: 0.4rem; }
    footer { text-align: center; padding: 1.5rem; color: #9ca3af; font-size: 0.8rem; }
    footer a { color: #0F2D4D; text-decoration: none; }
  </style>
</head>
<body>

<header class="site-header">
  <a href="https://pandonetworking.com/public/schedule/">
    <img src="../../images/pando_logo_transparent.png" alt="" onerror="this.style.display='none'">
    <span class="logo-text">Pando Executive Networking</span>
  </a>
</header>

<div class="page-center">
  <div class="cancel-card" id="cancelCard">
    <div class="icon-wrap icon-warning"><i class="fas fa-circle-notch spinner"></i></div>
    <h2>Loading…</h2>
  </div>
</div>

<footer>
  <p>&copy; 2026 Pando Executive Networking &nbsp;·&nbsp; <a href="https://pandonetworking.com">pandonetworking.com</a></p>
</footer>

<script>
const API = 'https://railwayclemail-production.up.railway.app';
const params      = new URLSearchParams(window.location.search);
const bookingId   = params.get('id');
let   cancelToken = params.get('token');   // may be null for old bookings

// ── Render helpers ──────────────────────────────────────────────────────────
function card(html) {
  document.getElementById('cancelCard').innerHTML = html;
}

// ── Init ────────────────────────────────────────────────────────────────────
async function init() {
  if (!bookingId) {
    card(`
      <div class="icon-wrap icon-error"><i class="fas fa-exclamation-triangle"></i></div>
      <h2>Invalid Link</h2>
      <p>This cancellation link is missing required information. Please use the link from your calendar invitation.</p>
      <div class="btn-row"><a href="./index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Scheduling</a></div>`);
    return;
  }

  if (cancelToken) {
    // Normal flow — token was in the URL
    showCancelConfirm();
  } else {
    // Fallback flow — no token (old booking or direct link)
    showVerifyEmail();
  }
}

// ── Step 1 (fallback): verify email to retrieve token ──────────────────────
function showVerifyEmail() {
  card(`
    <div class="icon-wrap icon-info"><i class="fas fa-envelope"></i></div>
    <h2>Verify Your Email</h2>
    <p>Enter the email address you used when booking to confirm your identity.</p>
    <div class="verify-form">
      <label for="verifyEmail">Email address</label>
      <input type="email" id="verifyEmail" placeholder="you@example.com" autocomplete="email">
      <p class="error-inline" id="verifyError" style="display:none"></p>
    </div>
    <div class="btn-row" style="margin-top:1rem">
      <a href="./index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Go back</a>
      <button class="btn btn-primary" id="verifyBtn" onclick="doVerify()">
        <i class="fas fa-arrow-right"></i> Continue
      </button>
    </div>`);

  // Allow Enter key to submit
  setTimeout(() => {
    const inp = document.getElementById('verifyEmail');
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') doVerify(); });
  }, 50);
}

async function doVerify() {
  const btn   = document.getElementById('verifyBtn');
  const input = document.getElementById('verifyEmail');
  const errEl = document.getElementById('verifyError');
  const email = (input ? input.value : '').trim();

  if (!email) {
    if (errEl) { errEl.textContent = 'Please enter your email address.'; errEl.style.display = 'block'; }
    return;
  }

  if (btn)   { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Checking…'; }
  if (errEl) errEl.style.display = 'none';

  try {
    const res  = await fetch(`${API}/api/calendar/cancel-verify`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ bookingId, guestEmail: email }),
    });
    const data = await res.json();

    if (data.alreadyCancelled) {
      card(`
        <div class="icon-wrap icon-success"><i class="fas fa-check"></i></div>
        <h2>Already Cancelled</h2>
        <p>This meeting has already been cancelled.</p>
        <div class="btn-row"><a href="./index.html" class="btn btn-outline">Schedule a new meeting</a></div>`);
      return;
    }

    if (!data.success || !data.cancelToken) {
      throw new Error(data.error || 'Verification failed');
    }

    cancelToken = data.cancelToken;
    showCancelConfirm();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue'; }
    if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }
  }
}

// ── Step 2: confirm and execute cancellation ────────────────────────────────
function showCancelConfirm() {
  card(`
    <div class="icon-wrap icon-warning"><i class="fas fa-exclamation-circle"></i></div>
    <h2>Cancel Meeting</h2>
    <p>Are you sure you want to cancel this meeting? The host will be notified.</p>
    <div class="btn-row">
      <a href="./index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Keep it</a>
      <button class="btn btn-danger" id="cancelBtn" onclick="doCancel()">
        <i class="fas fa-times"></i> Yes, Cancel Meeting
      </button>
    </div>`);
}

async function doCancel() {
  // Guard: cancelToken must exist before making the request
  if (!cancelToken) {
    showVerifyEmail();
    return;
  }

  const btn = document.getElementById('cancelBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Cancelling…'; }

  try {
    const res  = await fetch(`${API}/api/calendar/cancel`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ bookingId, cancelToken }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Cancellation failed');

    card(`
      <div class="icon-wrap icon-success"><i class="fas fa-check"></i></div>
      <h2>Meeting Cancelled</h2>
      <p>Your meeting has been cancelled. The host has been notified.</p>
      <div class="btn-row"><a href="./index.html" class="btn btn-outline">Schedule a new meeting</a></div>`);
  } catch (err) {
    card(`
      <div class="icon-wrap icon-error"><i class="fas fa-exclamation-triangle"></i></div>
      <h2>Cancellation Failed</h2>
      <p>${err.message}</p>
      <div class="btn-row">
        <a href="./index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        <button class="btn btn-danger" id="cancelBtn" onclick="doCancel()">
          <i class="fas fa-redo"></i> Try Again
        </button>
      </div>`);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
