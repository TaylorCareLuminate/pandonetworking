<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Meeting</title>
  <link rel="icon" type="image/png" href="../../../images/HealthLuminate-Bright.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --brand: #2D6B83;
      --brand-2: #44A1C4;
      --gray: #6b7280;
      --light: #f0f4f8;
      --border: #e2e8f0;
      --white: #fff;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--light); color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .site-header { background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
    .brand-block { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo-img { height: 36px; max-width: 160px; object-fit: contain; }
    .brand-avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 0.85rem; }
    .brand-name { font-weight: 700; font-size: 1.05rem; }
    .powered-by { font-size: 0.72rem; color: var(--gray); display: flex; align-items: center; gap: 0.35rem; }
    .powered-by img { height: 14px; opacity: 0.8; }

    .hero { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: white; text-align: center; padding: 3rem 2rem 2.5rem; }
    .hero h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; margin-bottom: 0.5rem; }
    .hero p { font-size: 1rem; opacity: 0.92; max-width: 520px; margin: 0 auto; line-height: 1.6; }

    .page-wrapper { flex: 1; display: flex; flex-direction: column; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; flex: 1; }
    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--gray); font-size: 0.85rem; text-decoration: none; padding: 0.5rem 0; }
    .back-link:hover { color: var(--brand); }

    /* ── Picker: host cards ── */
    .picker-banner { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); border-radius: 14px; padding: 1.5rem 1.75rem; margin-bottom: 2rem; color: white; display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; }
    .picker-banner h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.3rem; }
    .picker-banner p { font-size: 0.85rem; opacity: 0.9; }
    .picker-banner-pills { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .pill { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.4); border-radius: 10px; padding: 0.55rem 1rem; font-size: 0.85rem; font-weight: 700; color: white; text-decoration: none; }
    .pill:hover { background: rgba(255,255,255,0.3); }

    .host-section { margin-bottom: 2rem; }
    .host-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.1rem; }
    .host-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; color: white; flex-shrink: 0; }
    .host-header h3 { font-size: 1.05rem; font-weight: 700; }
    .duration-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 600px) { .duration-grid { grid-template-columns: 1fr; } }
    .duration-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-decoration: none; color: inherit; cursor: pointer; transition: all 0.2s; display: block; }
    .duration-card:hover { border-color: var(--brand-2); box-shadow: 0 8px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .duration-card .dur-label { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.25rem; }
    .duration-card .dur-arrow { font-size: 0.8rem; color: var(--brand-2); font-weight: 600; margin-top: 0.5rem; }
    .empty-state { text-align: center; padding: 3rem 2rem; color: var(--gray); }

    /* ── Booking card layout (shared by book + cancel/reschedule flows) ── */
    .booking-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; display: flex; }
    @media (max-width: 760px) { .booking-card { flex-direction: column; } }
    .left-panel { width: 270px; flex-shrink: 0; background: linear-gradient(160deg, var(--brand) 0%, #16323d 100%); color: white; padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
    @media (max-width: 760px) { .left-panel { width: 100%; } }
    .host-avatars { display: flex; }
    .host-avatars .host-avatar { width: 48px; height: 48px; font-size: 0.9rem; border: 3px solid rgba(255,255,255,0.3); }
    .host-avatars .host-avatar:not(:first-child) { margin-left: -14px; }
    .host-names { font-size: 1.02rem; font-weight: 700; }
    .meeting-details { display: flex; flex-direction: column; gap: 0.55rem; }
    .detail-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; opacity: 0.9; }
    .detail-row i { width: 16px; opacity: 0.7; }
    .panel-divider { border: none; border-top: 1px solid rgba(255,255,255,0.2); }
    .tz-note { font-size: 0.78rem; opacity: 0.7; }
    .right-panel { flex: 1; padding: 2rem; overflow: hidden; }

    .steps { display: flex; gap: 0; margin-bottom: 1.5rem; }
    .step { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 500; color: var(--gray); padding: 0 0.25rem; }
    .step.active { color: var(--brand); }
    .step.done { color: var(--success); }
    .step-num { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    .step-sep { flex: 1; height: 2px; background: var(--border); margin: 0 0.5rem; }

    .panel-title { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; }
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .cal-nav h3 { font-size: 0.95rem; font-weight: 600; }
    .cal-nav-btn { background: none; border: 1px solid var(--border); border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gray); }
    .cal-nav-btn:hover { border-color: var(--brand-2); color: var(--brand); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 1.5rem; }
    .cal-dow { text-align: center; font-size: 0.72rem; font-weight: 600; color: var(--gray); padding: 0.25rem 0; text-transform: uppercase; }
    .cal-day { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.82rem; cursor: pointer; background: white; }
    .cal-day:hover:not(.unavailable):not(.past) { border-color: var(--brand-2); background: rgba(68,161,196,0.08); }
    .cal-day.has-slots { border-color: var(--brand-2); color: var(--brand); font-weight: 600; }
    .cal-day.selected { background: var(--brand); color: white; border-color: var(--brand); font-weight: 700; }
    .cal-day.unavailable { color: var(--border); cursor: not-allowed; background: #fafafa; }
    .cal-day.past { color: #d1d5db; cursor: not-allowed; }

    .slots-header { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; }
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    @media (max-width: 480px) { .slots-grid { grid-template-columns: repeat(2, 1fr); } }
    .slot-btn { padding: 0.5rem 0.4rem; border: 1px solid var(--border); border-radius: 8px; background: white; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
    .slot-btn:hover { border-color: var(--brand-2); }
    .slot-btn.selected { background: var(--brand); color: white; border-color: var(--brand); font-weight: 600; }
    .no-slots { text-align: center; padding: 1.5rem; color: var(--gray); font-size: 0.875rem; background: #f9fafb; border-radius: 8px; border: 1px solid var(--border); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: #374151; }
    .form-group input, .form-group textarea { border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 0.875rem; font-family: inherit; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(68,161,196,0.12); }
    .form-group.full-width { grid-column: 1 / -1; }
    .field-required { color: var(--danger); }

    .tz-select-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.82rem; color: var(--gray); }
    .tz-select-row select { border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.8rem; }

    .booking-summary { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; font-size: 0.875rem; }
    .summary-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-row i { color: var(--brand); width: 16px; }

    .btn { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.65rem 1.25rem; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; text-decoration: none; }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { filter: brightness(0.92); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--gray); }
    .btn-outline:hover { border-color: var(--brand-2); color: var(--brand); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .actions-row { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }

    .spinner { font-size: 1.3rem; animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .alert { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.875rem 1.1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
    .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    .alert-info { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }

    .confirmation { text-align: center; padding: 2.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .confirm-icon { width: 72px; height: 72px; border-radius: 50%; background: #dcfce7; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--success); }
    .confirmation h2 { font-size: 1.5rem; font-weight: 700; }
    .confirmation p { color: var(--gray); line-height: 1.6; max-width: 400px; }
    .confirm-details { background: #f8fafc; border-radius: 10px; padding: 1.25rem 1.5rem; text-align: left; width: 100%; max-width: 400px; font-size: 0.875rem; }
    .confirm-details .row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; }
    .confirm-details .row i { color: var(--brand); width: 16px; }
    .confirm-details .row:last-child { margin-bottom: 0; }

    .error-page, .center-card { text-align: center; padding: 3rem 2rem; }
    .error-page i, .center-card .icon-wrap { font-size: 3rem; color: #d1d5db; margin-bottom: 1rem; display: block; }
    .icon-wrap { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1.25rem; }
    .icon-warning { background: #fff3cd; color: #d97706; }
    .icon-success { background: #dcfce7; color: #16a34a; }
    .icon-error { background: #fef2f2; color: #dc2626; }
    .icon-info { background: #eff6ff; color: #2563eb; }
    .card-box { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; max-width: 480px; margin: 0 auto; text-align: center; }
    .btn-row { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
    .verify-form { margin-top: 1.25rem; text-align: left; }
    .verify-form label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 0.35rem; }
    .verify-form input { width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
    .error-inline { color: var(--danger); font-size: 0.82rem; margin-top: 0.4rem; }

    footer { padding: 2rem; text-align: center; color: var(--gray); font-size: 0.82rem; }
    footer a { color: var(--brand); text-decoration: none; }
  </style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="brand-block" id="brandBlock"></div>
  <div class="powered-by">Powered by <img src="../../../images/HealthLuminate-Bright.png" alt="HealthLuminate" onerror="this.style.display='none'"></div>
</header>

<div class="page-wrapper">
  <div class="container" id="mainContainer">
    <div class="error-page">
      <i class="fas fa-circle-notch spinner"></i>
      <p>Loading…</p>
    </div>
  </div>
</div>

<footer id="pageFooter">
  <p>&copy; 2026 <a href="https://healthluminate.com">healthluminate.com</a></p>
</footer>

<script>
const API = 'https://railwayclemail-production.up.railway.app';

// ── Resolve slug from the rewritten path: /public/schedule/c/{slug} ────────
const pathParts = window.location.pathname.split('/').filter(Boolean); // ['public','schedule','c','{slug}']
const cIdx = pathParts.indexOf('c');
const slug = cIdx >= 0 && pathParts.length > cIdx + 1 ? decodeURIComponent(pathParts[cIdx + 1]) : null;

const qp = new URLSearchParams(window.location.search);
const typeKey = qp.get('type');
const action = qp.get('action'); // 'cancel' | 'reschedule'
const bookingId = qp.get('id');
const bookingToken = qp.get('token');

let company = null;
let guestTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Denver';

// Absolute-path link builder — avoids relative-URL ambiguity (e.g. a trailing
// slash on the current URL would break a naive "./slug" relative link).
function pageUrl(query) {
  return `/public/schedule/c/${encodeURIComponent(slug)}${query || ''}`;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function initials(name) {
  return String(name || '').split(/\s+/).filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('') || '?';
}

function showFatalError(title, detail) {
  document.getElementById('mainContainer').innerHTML = `
    <div class="error-page">
      <i class="fas fa-calendar-times"></i>
      <h2>${escHtml(title)}</h2>
      <p style="color:#6b7280;margin-top:0.5rem">${escHtml(detail)}</p>
    </div>`;
}

function applyBranding() {
  const root = document.documentElement.style;
  root.setProperty('--brand', company.primaryColor || '#2D6B83');
  root.setProperty('--brand-2', company.secondaryColor || '#44A1C4');

  document.title = `Book a Meeting – ${company.companyName}`;
  document.getElementById('brandBlock').innerHTML = company.logoUrl
    ? `<img src="${escHtml(company.logoUrl)}" class="brand-logo-img" onerror="this.outerHTML='<div class=\\'brand-avatar\\' style=\\'background:${company.primaryColor || '#2D6B83'}\\'>${initials(company.companyName)}</div>'">`
    : `<div class="brand-avatar" style="background:${company.primaryColor || '#2D6B83'}">${initials(company.companyName)}</div><span class="brand-name">${escHtml(company.companyName)}</span>`;
}

// ── Boot ─────────────────────────────────────────────────────────────────
async function init() {
  if (!slug) { showFatalError('Booking Page Not Found', 'This link is missing a company identifier.'); return; }

  try {
    const res = await fetch(`${API}/client-booking/public/company/${encodeURIComponent(slug)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'This booking page is not available.');
    company = data.company;
    applyBranding();

    if (action === 'cancel' || action === 'reschedule') {
      if (!bookingId || !bookingToken) { showFatalError('Invalid Link', 'This link is missing required information.'); return; }
      if (action === 'cancel') initCancelFlow();
      else initRescheduleFlow();
      return;
    }

    if (typeKey) {
      initBookingFlow();
      return;
    }

    renderPicker();
  } catch (err) {
    showFatalError('Booking Page Not Found', err.message);
  }
}

// ── Picker view (no ?type= yet) ─────────────────────────────────────────
function renderPicker() {
  document.getElementById('mainContainer').outerHTML = `<div class="hero"><h1>Book a Meeting with ${escHtml(company.companyName)}</h1><p>Choose the person and time that works best for you.</p></div><div class="container" id="mainContainer"></div>`;

  const hosts = company.hosts || [];
  if (!hosts.length) {
    document.getElementById('mainContainer').innerHTML = `
      <div class="empty-state"><i class="fas fa-calendar-times" style="font-size:2.5rem;margin-bottom:1rem;display:block;color:#d1d5db"></i>
      <p>No team members have connected a calendar yet. Please check back soon.</p></div>`;
    return;
  }

  let html = '';
  if (hosts.length > 1) {
    html += `
      <div class="picker-banner">
        <div><h2><i class="fas fa-bolt" style="margin-right:.4rem"></i>Book with the next available team member</h2><p>We'll match you with whoever is free first.</p></div>
        <div class="picker-banner-pills">
          <a href="${pageUrl('?type=any-15')}" class="pill">15 min</a>
          <a href="${pageUrl('?type=any-30')}" class="pill">30 min</a>
          <a href="${pageUrl('?type=any-60')}" class="pill">60 min</a>
        </div>
      </div>`;
  }

  hosts.forEach(h => {
    html += `
      <div class="host-section">
        <div class="host-header">
          <div class="host-avatar" style="background:${h.color}">${escHtml(h.initials)}</div>
          <h3>${escHtml(h.name)}</h3>
        </div>
        <div class="duration-grid">
          ${[15, 30, 60].map(dur => `
            <a href="${pageUrl(`?type=${h.hostId}-${dur}`)}" class="duration-card">
              <div class="dur-label">${dur} Minutes</div>
              <div style="font-size:0.82rem;color:var(--gray)">Meeting with ${escHtml(h.name.split(' ')[0])}</div>
              <div class="dur-arrow"><i class="fas fa-arrow-right"></i> Select a time</div>
            </a>`).join('')}
        </div>
      </div>`;
  });

  document.getElementById('mainContainer').innerHTML = html;
}

// ── Booking flow (?type=...) ────────────────────────────────────────────
let meetingTypeData = null;
let availableDates = [];
let allDates = {};
let selectedDate = null, selectedSlot = null, currentWeekStart = null;

async function initBookingFlow() {
  try {
    const res = await fetch(`${API}/client-booking/public/availability?slug=${encodeURIComponent(slug)}&type=${encodeURIComponent(typeKey)}&days=42`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load availability');
    meetingTypeData = data;
    availableDates = data.availableDates || [];
    allDates = {};
    availableDates.forEach(d => allDates[d.date] = d.slots);
    currentWeekStart = getWeekStart(availableDates.length ? new Date(availableDates[0].date + 'T12:00:00') : new Date());
    renderBookingCard();
  } catch (err) {
    showFatalError('Could Not Load Availability', err.message);
  }
}

function getWeekStart(date) { const d = new Date(date); d.setDate(d.getDate() - d.getDay()); d.setHours(0,0,0,0); return d; }
function toDateStr(d) { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

function renderBookingCard() {
  const hosts = meetingTypeData.hosts || [];
  const dur = meetingTypeData.meetingType?.duration || 30;
  const label = meetingTypeData.meetingType?.label || 'Meeting';
  const isAny = typeKey.startsWith('any-');

  const avatarHtml = hosts.map(h => `<div class="host-avatar" style="background:${h.color}">${escHtml(h.initials)}</div>`).join('');
  const hostNames = isAny ? `Meet with the ${escHtml(company.companyName)} team` : hosts.map(h => h.name).join(' & ');

  document.getElementById('mainContainer').innerHTML = `
    <a href="${pageUrl()}" class="back-link"><i class="fas fa-arrow-left"></i> All meeting types</a>
    <div class="booking-card" style="margin-top:1rem">
      <div class="left-panel">
        <div class="host-avatars">${avatarHtml}</div>
        <div class="host-names">${escHtml(hostNames)}</div>
        <hr class="panel-divider">
        <div class="meeting-details">
          <div class="detail-row"><i class="fas fa-tag"></i> <span>${escHtml(label)}</span></div>
          <div class="detail-row"><i class="fas fa-clock"></i> <span>${dur} minutes</span></div>
          <div class="detail-row"><i class="fas fa-video"></i> <span>Video call (link in invite)</span></div>
        </div>
        <hr class="panel-divider">
        <div class="tz-note">Times shown in <strong id="tzDisplay">${guestTz.replace(/_/g,' ')}</strong></div>
      </div>
      <div class="right-panel" id="rightPanel">${renderStep1()}</div>
    </div>`;
}

function renderStep1() {
  return `
    <div class="steps">
      <div class="step active"><div class="step-num">1</div> Date &amp; Time</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">2</div> Your Info</div>
      <div class="step-sep"></div>
      <div class="step"><div class="step-num">3</div> Confirm</div>
    </div>
    <div class="panel-title">Select a date</div>
    <div class="tz-select-row">
      <i class="fas fa-globe"></i><span>Timezone:</span>
      <select id="tzSelect" onchange="changeTz(this.value)">${buildTzOptions()}</select>
    </div>
    <div id="calContainer">${renderCalendar()}</div>
    <div id="slotsContainer"></div>`;
}

function buildTzOptions() {
  const list = [['America/New_York','Eastern (ET)'],['America/Chicago','Central (CT)'],['America/Denver','Mountain (MT)'],['America/Los_Angeles','Pacific (PT)'],['America/Phoenix','Arizona (MST)'],['UTC','UTC']];
  return list.map(([v,l]) => `<option value="${v}" ${v===guestTz?'selected':''}>${l}</option>`).join('') + (!list.find(t=>t[0]===guestTz) ? `<option value="${guestTz}" selected>${guestTz.replace(/_/g,' ')}</option>` : '');
}
function changeTz(tz) { guestTz = tz; document.getElementById('tzDisplay').textContent = tz.replace(/_/g,' '); selectedSlot = null; document.getElementById('calContainer').innerHTML = renderCalendar(); document.getElementById('slotsContainer').innerHTML = ''; }

function renderCalendar() {
  const ws = new Date(currentWeekStart);
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = `<div class="cal-nav"><button class="cal-nav-btn" onclick="prevWeek()" ${isPrevDisabled()?'disabled':''}><i class="fas fa-chevron-left"></i></button><h3>${monthLabel(ws)}</h3><button class="cal-nav-btn" onclick="nextWeek()"><i class="fas fa-chevron-right"></i></button></div><div class="cal-grid">`;
  DOW.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 35; i++) {
    const d = new Date(ws.getTime() + i * 86400000);
    const ds = toDateStr(d);
    const isPast = d < today, hasSl = !!allDates[ds], isSel = ds === selectedDate;
    let cls = 'cal-day';
    if (isPast) cls += ' past'; else if (hasSl) cls += ' has-slots'; else cls += ' unavailable';
    if (isSel) cls += ' selected';
    html += `<div class="${cls}" ${(!isPast && hasSl) ? `onclick="selectDate('${ds}')"` : ''}>${d.getDate()}</div>`;
  }
  return html + `</div>`;
}
function monthLabel(ws) { const end = new Date(ws.getTime() + 34*86400000); const fmt = d => d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); return ws.getMonth()===end.getMonth() ? fmt(ws) : `${ws.toLocaleDateString('en-US',{month:'short'})} – ${end.toLocaleDateString('en-US',{month:'short',year:'numeric'})}`; }
function isPrevDisabled() { const t = new Date(); t.setHours(0,0,0,0); return currentWeekStart <= getWeekStart(t); }
function prevWeek() { currentWeekStart = new Date(currentWeekStart.getTime() - 35*86400000); document.getElementById('calContainer').innerHTML = renderCalendar(); }
function nextWeek() { currentWeekStart = new Date(currentWeekStart.getTime() + 35*86400000); document.getElementById('calContainer').innerHTML = renderCalendar(); }
function selectDate(ds) { selectedDate = ds; selectedSlot = null; document.getElementById('calContainer').innerHTML = renderCalendar(); renderSlots(); }

function renderSlots() {
  const slots = allDates[selectedDate] || [];
  if (!slots.length) { document.getElementById('slotsContainer').innerHTML = `<div class="no-slots">No slots available on this date.</div>`; return; }
  const d = new Date(selectedDate + 'T12:00:00');
  const dayLabel = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const btns = slots.map(iso => {
    const t = new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: guestTz });
    return `<button class="slot-btn ${iso===selectedSlot?'selected':''}" onclick="selectSlot('${iso}',this)">${t}</button>`;
  }).join('');
  document.getElementById('slotsContainer').innerHTML = `<div class="slots-header">${dayLabel}</div><div class="slots-grid">${btns}</div><div class="actions-row" id="step1Next" style="display:none"><button class="btn btn-primary" onclick="goStep2()"><i class="fas fa-arrow-right"></i> Next: Your Info</button></div>`;
}
function selectSlot(iso, btn) { selectedSlot = iso; document.querySelectorAll('.slot-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('step1Next').style.display='flex'; }

function goStep2() {
  if (!selectedSlot) return;
  document.getElementById('rightPanel').innerHTML = `
    <div class="steps"><div class="step done"><div class="step-num"><i class="fas fa-check" style="font-size:.65rem"></i></div> Date &amp; Time</div><div class="step-sep" style="background:var(--brand)"></div><div class="step active"><div class="step-num">2</div> Your Info</div><div class="step-sep"></div><div class="step"><div class="step-num">3</div> Confirm</div></div>
    <div class="booking-summary"><div class="summary-row"><i class="fas fa-calendar"></i><span>${formatSlotDisplay(selectedSlot)}</span></div><div class="summary-row"><i class="fas fa-clock"></i><span>${meetingTypeData.meetingType?.duration} minutes</span></div></div>
    <div class="panel-title">Enter your details</div>
    <div id="formAlert"></div>
    <div class="form-grid">
      <div class="form-group"><label>First &amp; Last Name <span class="field-required">*</span></label><input type="text" id="guestName" autocomplete="name"></div>
      <div class="form-group"><label>Email Address <span class="field-required">*</span></label><input type="email" id="guestEmail" autocomplete="email"></div>
      <div class="form-group"><label>Company / Organization</label><input type="text" id="guestCompany" autocomplete="organization"></div>
      <div class="form-group full-width"><label>Notes or Agenda (optional)</label><textarea id="guestNotes" style="min-height:70px;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;font-family:inherit"></textarea></div>
    </div>
    <div class="actions-row"><button class="btn btn-outline" onclick="goStep1()"><i class="fas fa-arrow-left"></i> Back</button><button class="btn btn-primary" onclick="goStep3()">Review Booking <i class="fas fa-arrow-right"></i></button></div>`;
}
function goStep1() { document.getElementById('rightPanel').innerHTML = renderStep1(); if (selectedDate) setTimeout(() => selectDate(selectedDate), 10); }

function goStep3() {
  const name = document.getElementById('guestName').value.trim();
  const email = document.getElementById('guestEmail').value.trim();
  const companyName = document.getElementById('guestCompany').value.trim();
  const notes = document.getElementById('guestNotes').value.trim();
  if (!name || !email) { document.getElementById('formAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> Please fill in your name and email.</div>`; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('formAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> Please enter a valid email address.</div>`; return; }

  const dur = meetingTypeData.meetingType?.duration;
  const endSlot = new Date(new Date(selectedSlot).getTime() + dur * 60000);
  document.getElementById('rightPanel').innerHTML = `
    <div class="steps"><div class="step done"><div class="step-num"><i class="fas fa-check" style="font-size:.65rem"></i></div> Date &amp; Time</div><div class="step-sep" style="background:var(--brand)"></div><div class="step done"><div class="step-num"><i class="fas fa-check" style="font-size:.65rem"></i></div> Your Info</div><div class="step-sep" style="background:var(--brand)"></div><div class="step active"><div class="step-num">3</div> Confirm</div></div>
    <div class="panel-title">Confirm your booking</div>
    <div id="confirmAlert"></div>
    <div class="booking-summary">
      <div class="summary-row"><i class="fas fa-calendar"></i><strong>${formatSlotDisplay(selectedSlot)}</strong></div>
      <div class="summary-row"><i class="fas fa-clock"></i>${dur} min (ends ${endSlot.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})})</div>
      <div class="summary-row"><i class="fas fa-user"></i>${escHtml(name)}</div>
      <div class="summary-row"><i class="fas fa-envelope"></i>${escHtml(email)}</div>
      ${companyName ? `<div class="summary-row"><i class="fas fa-building"></i>${escHtml(companyName)}</div>` : ''}
    </div>
    <div class="alert alert-info" style="margin-bottom:0"><i class="fas fa-info-circle"></i><span>A calendar invitation will be emailed to <strong>${escHtml(email)}</strong> upon confirmation.</span></div>
    <div class="actions-row">
      <button class="btn btn-outline" onclick="goStep2Back('${escHtml(name)}','${escHtml(email)}','${escHtml(companyName)}','${escHtml(notes)}')"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-primary" id="confirmBtn" onclick="confirmBooking('${escHtml(name)}','${escHtml(email)}','${escHtml(companyName)}','${escHtml(notes)}')"><i class="fas fa-check"></i> Confirm Meeting</button>
    </div>`;
}
function goStep2Back(name,email,companyName,notes) { goStep2(); setTimeout(() => { document.getElementById('guestName').value=name; document.getElementById('guestEmail').value=email; document.getElementById('guestCompany').value=companyName; document.getElementById('guestNotes').value=notes; }, 10); }

async function confirmBooking(name, email, guestCompanyName, notes) {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Booking…';
  document.getElementById('confirmAlert').innerHTML = '';
  try {
    const res = await fetch(`${API}/client-booking/public/book`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, type: typeKey, startTime: selectedSlot, guestName: name, guestEmail: email, guestCompany: guestCompanyName, notes, timezone: guestTz }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Booking failed');
    showConfirmation(email, data.bookingId, data.cancelToken, data.joinUrl);
  } catch (err) {
    document.getElementById('confirmAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i><span>${escHtml(err.message)}</span></div>`;
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Confirm Meeting';
  }
}

function showConfirmation(email, bookingId, cancelToken, joinUrl) {
  const dur = meetingTypeData.meetingType?.duration;
  const endSlot = new Date(new Date(selectedSlot).getTime() + dur * 60000);
  const hostNames = (meetingTypeData.hosts || []).map(h => h.name).join(' & ');
  document.getElementById('rightPanel').innerHTML = `
    <div class="confirmation">
      <div class="confirm-icon"><i class="fas fa-check"></i></div>
      <h2>You're booked!</h2>
      <p>A calendar invitation will arrive at <strong>${escHtml(email)}</strong>. Accept it to add the meeting to your calendar.</p>
      <div class="confirm-details">
        <div class="row"><i class="fas fa-calendar"></i><span>${formatSlotDisplay(selectedSlot)}</span></div>
        <div class="row"><i class="fas fa-clock"></i><span>${dur} min (ends ${endSlot.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})})</span></div>
        <div class="row"><i class="fas fa-user"></i><span>With ${escHtml(hostNames)}</span></div>
        ${joinUrl ? `<div class="row"><i class="fas fa-video"></i><span><a href="${escHtml(joinUrl)}" target="_blank" rel="noopener" style="color:var(--brand);font-weight:600">Join video meeting</a></span></div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;width:100%;max-width:360px">
        <a href="${pageUrl(`?action=reschedule&id=${bookingId}&token=${cancelToken}`)}" class="btn btn-outline" style="justify-content:center"><i class="fas fa-calendar-alt"></i> Reschedule</a>
        <a href="${pageUrl(`?action=cancel&id=${bookingId}&token=${cancelToken}`)}" class="btn btn-outline" style="justify-content:center;color:#dc2626;border-color:#fca5a5"><i class="fas fa-times"></i> Cancel this meeting</a>
      </div>
    </div>`;
}
function formatSlotDisplay(iso) { return new Date(iso).toLocaleString('en-US', { timeZone: guestTz, weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }); }

// ── Cancel flow (?action=cancel) ────────────────────────────────────────
function centerCard(html) {
  document.getElementById('mainContainer').innerHTML = `<div class="card-box">${html}</div>`;
}

function initCancelFlow() {
  if (bookingToken) showCancelConfirm();
  else showVerifyEmail();
}

function showVerifyEmail() {
  centerCard(`
    <div class="icon-wrap icon-info"><i class="fas fa-envelope"></i></div>
    <h2>Verify Your Email</h2>
    <p style="color:var(--gray);font-size:0.9rem">Enter the email address you used when booking to confirm your identity.</p>
    <div class="verify-form">
      <label for="verifyEmail">Email address</label>
      <input type="email" id="verifyEmail" placeholder="you@example.com" autocomplete="email">
      <p class="error-inline" id="verifyError" style="display:none"></p>
    </div>
    <div class="btn-row"><a href="${pageUrl()}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Go back</a><button class="btn btn-primary" id="verifyBtn" onclick="doVerify()"><i class="fas fa-arrow-right"></i> Continue</button></div>`);
}

async function doVerify() {
  const btn = document.getElementById('verifyBtn');
  const email = document.getElementById('verifyEmail').value.trim();
  const errEl = document.getElementById('verifyError');
  if (!email) { errEl.textContent = 'Please enter your email address.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Checking…';
  try {
    const res = await fetch(`${API}/client-booking/public/cancel-verify`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookingId, guestEmail: email }) });
    const data = await res.json();
    if (data.alreadyCancelled) { centerCard(`<div class="icon-wrap icon-success"><i class="fas fa-check"></i></div><h2>Already Cancelled</h2><p>This meeting has already been cancelled.</p><div class="btn-row"><a href="${pageUrl()}" class="btn btn-outline">Schedule a new meeting</a></div>`); return; }
    if (!data.success || !data.cancelToken) throw new Error(data.error || 'Verification failed');
    window.bookingToken = data.cancelToken;
    showCancelConfirm(data.cancelToken);
  } catch (err) {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue';
    errEl.textContent = err.message; errEl.style.display = 'block';
  }
}

function showCancelConfirm(tokenOverride) {
  const tok = tokenOverride || bookingToken;
  centerCard(`
    <div class="icon-wrap icon-warning"><i class="fas fa-exclamation-circle"></i></div>
    <h2>Cancel Meeting</h2>
    <p style="color:var(--gray);font-size:0.9rem">Are you sure you want to cancel this meeting? The host will be notified.</p>
    <div class="btn-row"><a href="${pageUrl()}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Keep it</a><button class="btn btn-danger" id="cancelBtn" onclick="doCancel('${tok}')"><i class="fas fa-times"></i> Yes, Cancel Meeting</button></div>`);
}

async function doCancel(tok) {
  const btn = document.getElementById('cancelBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Cancelling…';
  try {
    const res = await fetch(`${API}/client-booking/public/cancel`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookingId, cancelToken: tok }) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Cancellation failed');
    centerCard(`<div class="icon-wrap icon-success"><i class="fas fa-check"></i></div><h2>Meeting Cancelled</h2><p style="color:var(--gray);font-size:0.9rem">Your meeting has been cancelled.</p><div class="btn-row"><a href="${pageUrl()}" class="btn btn-outline">Schedule a new meeting</a></div>`);
  } catch (err) {
    centerCard(`<div class="icon-wrap icon-error"><i class="fas fa-exclamation-triangle"></i></div><h2>Cancellation Failed</h2><p style="color:var(--gray);font-size:0.9rem">${escHtml(err.message)}</p><div class="btn-row"><a href="${pageUrl()}" class="btn btn-outline">Back</a><button class="btn btn-danger" onclick="doCancel('${tok}')"><i class="fas fa-redo"></i> Try Again</button></div>`);
  }
}

// ── Reschedule flow (?action=reschedule) ────────────────────────────────
let reschedBooking = null;

async function initRescheduleFlow() {
  try {
    const bRes = await fetch(`${API}/client-booking/public/bookings/${bookingId}/public?token=${encodeURIComponent(bookingToken)}`);
    const bData = await bRes.json();
    if (!bData.success) throw new Error(bData.error || 'Could not load booking');
    reschedBooking = bData.booking;
    if (reschedBooking.status === 'cancelled') { showFatalError('Meeting Already Cancelled', 'This meeting has been cancelled and cannot be rescheduled.'); return; }

    const aRes = await fetch(`${API}/client-booking/public/availability?slug=${encodeURIComponent(slug)}&type=${encodeURIComponent(reschedBooking.type)}&days=42`);
    const aData = await aRes.json();
    if (!aData.success) throw new Error(aData.error || 'Could not load availability');
    meetingTypeData = aData;
    availableDates = aData.availableDates || [];
    allDates = {};
    availableDates.forEach(d => allDates[d.date] = d.slots);
    currentWeekStart = getWeekStart(availableDates.length ? new Date(availableDates[0].date + 'T12:00:00') : new Date());
    renderReschedulePicker();
  } catch (err) {
    showFatalError('Could Not Load Booking', err.message);
  }
}

function renderReschedulePicker() {
  const hosts = meetingTypeData.hosts || [];
  const avatarHtml = hosts.map(h => `<div class="host-avatar" style="background:${h.color}">${escHtml(h.initials)}</div>`).join('');
  const currentDisplay = new Date(reschedBooking.startTime).toLocaleString('en-US', { timeZone: guestTz, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });

  document.getElementById('mainContainer').innerHTML = `
    <a href="${pageUrl()}" class="back-link"><i class="fas fa-arrow-left"></i> All meeting types</a>
    <div class="booking-card" style="margin-top:1rem">
      <div class="left-panel">
        <div class="host-avatars">${avatarHtml}</div>
        <div class="meeting-details">
          <div class="detail-row"><i class="fas fa-tag"></i><span>${escHtml(reschedBooking.label)}</span></div>
          <div class="detail-row"><i class="fas fa-clock"></i><span>${reschedBooking.durationMinutes} minutes</span></div>
        </div>
        <hr class="panel-divider">
        <div class="tz-note">Current time<br><strong>${currentDisplay}</strong></div>
      </div>
      <div class="right-panel" id="rightPanel">
        <div class="panel-title">Choose a new time</div>
        <div class="tz-select-row"><i class="fas fa-globe"></i><span>Timezone:</span><select id="tzSelect" onchange="changeTz(this.value)">${buildTzOptions()}</select></div>
        <div id="calContainer">${renderCalendar()}</div>
        <div id="slotsContainer"></div>
      </div>
    </div>`;

  // Override slot selection to show a reschedule-confirm step instead of the booking step-2 form
  window.selectSlot = function(iso, btn) {
    selectedSlot = iso;
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('step1Next').style.display = 'flex';
  };
  const origRenderSlots = renderSlots;
  window.renderSlots = function() {
    origRenderSlots();
    const stepNext = document.getElementById('step1Next');
    if (stepNext) stepNext.querySelector('button').setAttribute('onclick', 'showRescheduleConfirmStep()');
  };
}

function showRescheduleConfirmStep() {
  if (!selectedSlot) return;
  const newEnd = new Date(new Date(selectedSlot).getTime() + reschedBooking.durationMinutes * 60000);
  document.getElementById('rightPanel').innerHTML = `
    <div class="panel-title">Confirm New Time</div>
    <div class="booking-summary"><div class="summary-row"><i class="fas fa-calendar-times"></i><span style="text-decoration:line-through;color:#9ca3af">${new Date(reschedBooking.startTime).toLocaleString('en-US',{timeZone:guestTz,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></div></div>
    <div class="alert alert-success"><i class="fas fa-check-circle"></i><span><strong>${formatSlotDisplay(selectedSlot)}</strong><br>${reschedBooking.durationMinutes} min · ends ${newEnd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})}</span></div>
    <div id="confirmAlert"></div>
    <div class="actions-row"><button class="btn btn-outline" onclick="renderReschedulePicker()"><i class="fas fa-arrow-left"></i> Back</button><button class="btn btn-primary" id="confirmBtn" onclick="doReschedule()"><i class="fas fa-calendar-check"></i> Confirm Reschedule</button></div>`;
}

async function doReschedule() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> Rescheduling…';
  try {
    const res = await fetch(`${API}/client-booking/public/reschedule`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bookingId, cancelToken: bookingToken, newStartTime: selectedSlot }) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Reschedule failed');
    showRescheduleConfirmed(data.newStartTime, data.cancelToken);
  } catch (err) {
    document.getElementById('confirmAlert').innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i><span>${escHtml(err.message)}</span></div>`;
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-calendar-check"></i> Confirm Reschedule';
  }
}

function showRescheduleConfirmed(newStartTime, newToken) {
  const newEnd = new Date(new Date(newStartTime).getTime() + reschedBooking.durationMinutes * 60000);
  document.getElementById('rightPanel').innerHTML = `
    <div class="confirmation">
      <div class="confirm-icon"><i class="fas fa-check"></i></div>
      <h2>Meeting Rescheduled!</h2>
      <p>A new calendar invitation will arrive shortly.</p>
      <div class="confirm-details">
        <div class="row"><i class="fas fa-calendar"></i><span>${new Date(newStartTime).toLocaleString('en-US',{timeZone:guestTz,weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'})}</span></div>
        <div class="row"><i class="fas fa-clock"></i><span>${reschedBooking.durationMinutes} min · ends ${newEnd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:guestTz})}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;width:100%;max-width:340px">
        <a href="${pageUrl(`?action=reschedule&id=${bookingId}&token=${newToken}`)}" class="btn btn-outline" style="justify-content:center"><i class="fas fa-calendar-alt"></i> Reschedule again</a>
        <a href="${pageUrl(`?action=cancel&id=${bookingId}&token=${newToken}`)}" class="btn btn-outline" style="justify-content:center;color:#dc2626;border-color:#fca5a5"><i class="fas fa-times"></i> Cancel this meeting</a>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
