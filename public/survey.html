<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Survey</title>
    <link rel="icon" type="image/png" href="/images/pando_logo_transparent.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #12314c;
            --on-brand: #ffffff;
            --brand-tint: rgba(18, 49, 76, .08);
            --bg: #f4f5f7;
            --paper: #ffffff;
            --ink: #1b2430;
            --ink-soft: #4b5563;
            --muted: #7c8594;
            --line: #e2e5ea;
            --line-strong: #c9ced6;
            --danger: #b42318;
            --danger-tint: #fdf0ee;
            --ok: #1e7a46;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.55;
        }

        .topbar { background: var(--paper); border-bottom: 1px solid var(--line); }
        .topbar-inner { max-width: 760px; margin: 0 auto; padding: .9rem 1.25rem; display: flex; align-items: center; gap: .85rem; min-height: 64px; }
        .topbar img { max-height: 44px; max-width: 200px; object-fit: contain; display: block; }
        .topbar .org { font-weight: 600; font-size: 1.05rem; color: var(--ink); }
        .brand-bar { height: 4px; background: var(--brand); }

        .wrap { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

        .banner { background: #fff7e0; border: 1px solid #f0d58a; color: #6b4e00; border-radius: 8px; padding: .65rem .9rem; font-size: .85rem; margin-bottom: 1rem; }

        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 1.4rem 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
        .card.intro { border-top: 4px solid var(--brand); }
        .card h1 { margin: 0 0 .4rem; font-size: 1.6rem; line-height: 1.25; letter-spacing: -.01em; }
        .card .desc { margin: 0; color: var(--ink-soft); white-space: pre-wrap; }
        .card h2 { margin: 0 0 .25rem; font-size: 1.05rem; }
        .card .sub { margin: 0 0 1rem; color: var(--muted); font-size: .88rem; }

        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem 1rem; }
        .grid .full { grid-column: 1 / -1; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

        label.lbl { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .3rem; }
        input[type=text], input[type=email], input[type=number], input[type=date], select, textarea {
            width: 100%; padding: .65rem .8rem; font: inherit; font-size: 1rem; color: var(--ink); background: #fff;
            border: 1.5px solid var(--line-strong); border-radius: 8px;
        }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, select:focus, textarea:focus, button:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }

        .q { scroll-margin-top: 16px; }
        .q .qtext { font-size: 1.02rem; font-weight: 600; margin: 0 0 .2rem; }
        .q .qtext .num { color: var(--muted); font-weight: 500; margin-right: .35rem; }
        .q .req { color: var(--danger); margin-left: .15rem; }
        .q .help { margin: 0 0 .8rem; color: var(--muted); font-size: .86rem; }
        .q .qtext + .qbody { margin-top: .75rem; }
        .q.error { border-color: #e8b4ad; background: var(--danger-tint); }
        .q .err { color: var(--danger); font-size: .85rem; font-weight: 500; margin-top: .55rem; }
        .statement h2 { font-size: 1.15rem; }
        .statement p { margin: 0; color: var(--ink-soft); white-space: pre-wrap; }

        .opts { display: flex; flex-direction: column; gap: .5rem; }
        .opt { display: flex; align-items: flex-start; gap: .65rem; padding: .65rem .85rem; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; background: #fff; transition: border-color .12s, background .12s; }
        .opt:hover { border-color: var(--line-strong); }
        .opt input { margin-top: .22rem; accent-color: var(--brand); width: 1.05rem; height: 1.05rem; flex-shrink: 0; }
        .opt.checked { border-color: var(--brand); background: var(--brand-tint); }
        .opt .otxt { flex: 1; min-width: 0; word-break: break-word; }
        .other-input { margin-top: .5rem; }

        .count { text-align: right; font-size: .76rem; color: var(--muted); margin-top: .25rem; }
        .unit { display: flex; align-items: center; gap: .5rem; }
        .unit span { color: var(--ink-soft); }
        .unit input { max-width: 220px; }

        .yesno { display: flex; gap: .6rem; }
        .yesno .opt { flex: 1; justify-content: center; font-weight: 600; }

        .scale-row { display: flex; gap: .4rem; flex-wrap: wrap; }
        .scale-btn { min-width: 2.7rem; flex: 1 1 2.7rem; padding: .6rem .3rem; border: 1.5px solid var(--line-strong); border-radius: 8px; background: #fff; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
        .scale-btn:hover { border-color: var(--brand); }
        .scale-btn.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
        .scale-labels { display: flex; justify-content: space-between; gap: 1rem; margin-top: .4rem; font-size: .8rem; color: var(--muted); }

        .stars { display: flex; gap: .25rem; }
        .star { border: 0; background: none; padding: .1rem; cursor: pointer; font-size: 2rem; line-height: 1; color: #d0d5dd; }
        .star.on { color: #f5b301; }
        .star:hover { transform: scale(1.08); }

        .rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
        .rank-item { display: flex; align-items: center; gap: .65rem; padding: .55rem .75rem; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
        .rank-item .pos { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--brand-tint); color: var(--brand); font-weight: 700; font-size: .85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .rank-item .rtxt { flex: 1; min-width: 0; word-break: break-word; }
        .rank-item button { border: 1.5px solid var(--line-strong); background: #fff; border-radius: 6px; width: 2rem; height: 2rem; cursor: pointer; font-size: .9rem; color: var(--ink-soft); }
        .rank-item button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
        .rank-item button:disabled { opacity: .35; cursor: default; }
        .rank-hint { font-size: .82rem; color: var(--muted); margin-bottom: .5rem; }

        .matrix-wrap { overflow-x: auto; margin: 0 -.25rem; padding: 0 .25rem; }
        table.matrix { border-collapse: collapse; width: 100%; min-width: 420px; font-size: .92rem; }
        table.matrix th { font-weight: 600; font-size: .8rem; color: var(--ink-soft); padding: .45rem .4rem; text-align: center; }
        table.matrix th:first-child, table.matrix td:first-child { text-align: left; }
        table.matrix td { padding: .55rem .4rem; border-top: 1px solid var(--line); text-align: center; }
        table.matrix td:first-child { font-weight: 500; padding-right: .75rem; }
        table.matrix input { accent-color: var(--brand); width: 1.1rem; height: 1.1rem; cursor: pointer; }

        .actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.25rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .85rem 1.7rem; border-radius: 10px; border: 0; background: var(--brand); color: var(--on-brand); font: inherit; font-size: 1.02rem; font-weight: 600; cursor: pointer; }
        .btn:hover:not(:disabled) { filter: brightness(1.1); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .progress { font-size: .85rem; color: var(--muted); }
        .form-error { margin-top: 1rem; padding: .75rem .95rem; border-radius: 8px; background: var(--danger-tint); border: 1px solid #e8b4ad; color: var(--danger); font-size: .9rem; }
        .privacy { margin-top: 1rem; font-size: .8rem; color: var(--muted); }

        .center { text-align: center; padding: 2.5rem 1.5rem; }
        .center .icon { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; background: var(--brand-tint); color: var(--brand); }
        .center .icon.ok { background: #e3f4ea; color: var(--ok); }
        .center h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        .center p { margin: 0 auto; max-width: 520px; color: var(--ink-soft); white-space: pre-wrap; }

        .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; margin: 3rem auto; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Results ── */
        .results-head { margin: 1.5rem 0 .75rem; }
        .results-head h2 { font-size: 1.25rem; margin: 0 0 .15rem; }
        .results-head p { margin: 0; color: var(--muted); font-size: .88rem; }
        .rq .rtitle { font-weight: 600; margin: 0 0 .15rem; }
        .rq .rmeta { color: var(--muted); font-size: .8rem; margin: 0 0 .85rem; }
        .bar-row { margin-bottom: .6rem; }
        .bar-top { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; margin-bottom: .2rem; }
        .bar-top .name { min-width: 0; word-break: break-word; }
        .bar-top .val { color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .bar-track { height: 10px; background: #eceff3; border-radius: 99px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--brand); border-radius: 99px; opacity: .55; }
        .bar-row.mine .bar-fill { opacity: 1; }
        .mine-tag { display: inline-block; margin-left: .45rem; font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--brand); background: var(--brand-tint); border-radius: 4px; padding: 1px 6px; vertical-align: 1px; }
        .big { font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
        .big small { font-size: .9rem; color: var(--muted); font-weight: 500; letter-spacing: 0; }
        .stat-row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: .9rem; }
        .stat-row .s .l { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        .stat-row .s .v { font-size: 1.25rem; font-weight: 700; }
        .cols { display: flex; align-items: flex-end; gap: 4px; height: 90px; }
        .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
        .col .cbar { width: 100%; background: var(--brand); opacity: .55; border-radius: 4px 4px 0 0; min-height: 2px; }
        .col.mine .cbar { opacity: 1; }
        .col-labels { display: flex; gap: 4px; margin-top: .3rem; }
        .col-labels span { flex: 1; text-align: center; font-size: .72rem; color: var(--muted); min-width: 0; }
        .col-labels span.mine { color: var(--brand); font-weight: 700; }
        .nps-split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: .5rem 0 .35rem; }
        .nps-split i { display: block; height: 100%; }
        .nps-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--ink-soft); }
        .nps-legend b { font-weight: 600; }
        .heat { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 380px; }
        .heat th { font-weight: 600; font-size: .75rem; color: var(--ink-soft); padding: .35rem; text-align: center; }
        .heat th:first-child, .heat td:first-child { text-align: left; }
        .heat td { padding: .4rem; text-align: center; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
        .heat td.mine { outline: 2px solid var(--brand); outline-offset: -2px; font-weight: 700; }
        .foot { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="topbar" id="topbar" hidden>
        <div class="topbar-inner" id="topbarInner"></div>
        <div class="brand-bar"></div>
    </div>
    <main class="wrap" id="app"><div class="spinner" aria-label="Loading"></div></main>

<script>
(function () {
    'use strict';

    var API = 'https://railwayclemail-production.up.railway.app/surveys';

    // The link is https://<host>/s/<code> (rewritten to this page). ?c=<code> also works.
    function getCode() {
        var m = location.pathname.match(/\/s\/([A-Za-z0-9]+)\/?$/);
        if (m) return m[1].toLowerCase();
        return String(new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
    }
    var CODE = getCode();

    var app = document.getElementById('app');
    var state = { survey: null, controls: {}, respondentCtl: {}, results: null, myAnswers: null, preview: false };

    // ── tiny DOM helper (no innerHTML for anything that came from the server) ──
    function el(tag, props, kids) {
        var n = document.createElement(tag);
        if (props) Object.keys(props).forEach(function (k) {
            var v = props[k];
            if (v === undefined || v === null || v === false) return;
            if (k === 'class') n.className = v;
            else if (k === 'text') n.textContent = v;
            else if (k.indexOf('on') === 0 && typeof v === 'function') n.addEventListener(k.slice(2), v);
            else n.setAttribute(k, v === true ? '' : v);
        });
        (kids || []).forEach(function (c) { if (c !== null && c !== undefined && c !== false) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
        return n;
    }
    function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

    function readableOn(hex) {
        var h = /^#[0-9a-f]{6}$/i.test(hex) ? hex : '#12314c';
        var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
        return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#1b2430' : '#ffffff';
    }
    function applyBrand(s) {
        var c = /^#[0-9a-f]{6}$/i.test(s && s.brandColor) ? s.brandColor : '#12314c';
        var root = document.documentElement.style;
        root.setProperty('--brand', c);
        root.setProperty('--on-brand', readableOn(c));
        var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
        root.setProperty('--brand-tint', 'rgba(' + r + ',' + g + ',' + b + ',.09)');
    }
    function renderTopbar(s) {
        var bar = document.getElementById('topbar');
        var inner = document.getElementById('topbarInner');
        clear(inner);
        var hasLogo = s && s.logoUrl, hasOrg = s && s.orgName;
        if (!hasLogo && !hasOrg) { bar.hidden = true; return; }
        if (hasLogo) {
            var img = el('img', { src: s.logoUrl, alt: s.orgName ? s.orgName + ' logo' : 'Logo', referrerpolicy: 'no-referrer' });
            img.addEventListener('error', function () { img.remove(); });
            inner.appendChild(img);
        }
        if (hasOrg && !hasLogo) inner.appendChild(el('span', { class: 'org', text: s.orgName }));
        bar.hidden = false;
    }

    function api(path, body) {
        return fetch(API + path, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, json: j }; });
        });
    }

    // ── screens ──
    function messageScreen(icon, title, text, ok) {
        clear(app);
        app.appendChild(el('div', { class: 'card center' }, [
            el('div', { class: 'icon' + (ok ? ' ok' : ''), text: icon }),
            el('h1', { text: title }),
            text ? el('p', { text: text }) : null
        ]));
    }

    // ── draft persistence (so a refresh doesn't lose answers) ──
    var DRAFT_KEY = 'survey_draft_' + CODE;
    var saveTimer = null;
    function saveDraftSoon() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try {
                var c = collect();
                localStorage.setItem(DRAFT_KEY, JSON.stringify({ respondent: c.respondent, answers: c.answers, others: c.others, touched: c.touched }));
            } catch (e) { /* storage unavailable: fine */ }
        }, 400);
    }
    function loadDraft() {
        try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; }
    }
    function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ } }

    // ── question controls: each returns { node, get(), set(v), error(msg), other(), setOther(t), touched() } ──
    function wrapQ(q, num, bodyNode, ctl) {
        var title = el('div', { class: 'qtext' }, [
            el('span', { class: 'num', text: num + '.' }),
            q.text,
            q.required ? el('span', { class: 'req', title: 'Required', text: '*' }) : null
        ]);
        var errBox = el('div', { class: 'err', role: 'alert', hidden: true });
        var card = el('section', { class: 'card q', id: 'q-' + q.id }, [
            title,
            q.helpText ? el('div', { class: 'help', text: q.helpText }) : null,
            el('div', { class: 'qbody' }, [bodyNode]),
            errBox
        ]);
        ctl.node = card;
        ctl.error = function (msg) {
            card.classList.toggle('error', !!msg);
            errBox.hidden = !msg;
            errBox.textContent = msg || '';
        };
        return ctl;
    }

    function textCtl(q, num, kind) {
        var input;
        var counter = null;
        if (kind === 'long') {
            input = el('textarea', { maxlength: q.maxLength || 3000, 'aria-label': q.text });
            counter = el('div', { class: 'count' });
            var upd = function () { counter.textContent = input.value.length + ' / ' + (q.maxLength || 3000); };
            input.addEventListener('input', upd); upd();
        } else {
            input = el('input', { type: kind === 'email' ? 'email' : kind === 'date' ? 'date' : 'text', maxlength: kind === 'short' ? (q.maxLength || 300) : null, 'aria-label': q.text, autocomplete: kind === 'email' ? 'email' : 'off' });
        }
        var ctl = { get: function () { return input.value; }, set: function (v) { input.value = v || ''; if (counter) counter.textContent = input.value.length + ' / ' + (q.maxLength || 3000); } };
        input.addEventListener('input', function () { ctl.error(''); saveDraftSoon(); });
        return wrapQ(q, num, el('div', null, [input, counter]), ctl);
    }

    function numberCtl(q, num) {
        var input = el('input', { type: 'number', step: 'any', min: q.min !== null && q.min !== undefined ? q.min : null, max: q.max !== null && q.max !== undefined ? q.max : null, inputmode: 'decimal', 'aria-label': q.text });
        var body = el('div', { class: 'unit' }, [input, q.unit ? el('span', { text: q.unit }) : null]);
        var ctl = { get: function () { return input.value === '' ? '' : Number(input.value); }, set: function (v) { input.value = v === undefined || v === null ? '' : v; } };
        input.addEventListener('input', function () { ctl.error(''); saveDraftSoon(); });
        return wrapQ(q, num, body, ctl);
    }

    function choiceCtl(q, num, multi) {
        var name = 'q_' + q.id;
        var rows = [];
        var list = el('div', { class: 'opts', role: multi ? 'group' : 'radiogroup', 'aria-label': q.text });
        var otherInput = el('input', { type: 'text', class: 'other-input', maxlength: 300, placeholder: 'Please specify', 'aria-label': 'Other answer', hidden: true });
        function sync() {
            rows.forEach(function (r) { r.label.classList.toggle('checked', r.input.checked); });
            var otherRow = rows.filter(function (r) { return r.id === 'other'; })[0];
            otherInput.hidden = !(otherRow && otherRow.input.checked);
        }
        var defs = q.options.map(function (o) { return { id: o.id, label: o.label }; });
        if (q.allowOther) defs.push({ id: 'other', label: 'Other' });
        defs.forEach(function (o) {
            var input = el('input', { type: multi ? 'checkbox' : 'radio', name: name, value: o.id });
            var label = el('label', { class: 'opt' }, [input, el('span', { class: 'otxt', text: o.label })]);
            input.addEventListener('change', function () {
                if (multi && q.maxSelect) {
                    var n = rows.filter(function (r) { return r.input.checked; }).length;
                    if (n > q.maxSelect) { input.checked = false; ctl.error('Choose at most ' + q.maxSelect); return; }
                }
                ctl.error(''); sync(); saveDraftSoon();
                if (input.checked && o.id === 'other') otherInput.focus();
            });
            rows.push({ id: o.id, input: input, label: label });
            list.appendChild(label);
        });
        otherInput.addEventListener('input', function () { ctl.error(''); saveDraftSoon(); });
        var hint = null;
        if (multi && (q.minSelect || q.maxSelect)) {
            hint = el('div', { class: 'help', text: q.minSelect && q.maxSelect ? 'Choose ' + q.minSelect + ' to ' + q.maxSelect : q.maxSelect ? 'Choose up to ' + q.maxSelect : 'Choose at least ' + q.minSelect });
        }
        var ctl = {
            get: function () {
                var picked = rows.filter(function (r) { return r.input.checked; }).map(function (r) { return r.id; });
                return multi ? picked : (picked[0] || '');
            },
            other: function () { return otherInput.value.trim(); },
            setOther: function (t) { otherInput.value = t || ''; },
            set: function (v) {
                var ids = multi ? (v || []) : (v ? [v] : []);
                rows.forEach(function (r) { r.input.checked = ids.indexOf(r.id) !== -1; });
                sync();
            }
        };
        return wrapQ(q, num, el('div', null, [hint, list, otherInput]), ctl);
    }

    function dropdownCtl(q, num) {
        var select = el('select', { 'aria-label': q.text }, [el('option', { value: '', text: 'Select…' })].concat(
            q.options.map(function (o) { return el('option', { value: o.id, text: o.label }); })));
        var ctl = { get: function () { return select.value; }, set: function (v) { select.value = v || ''; } };
        select.addEventListener('change', function () { ctl.error(''); saveDraftSoon(); });
        return wrapQ(q, num, select, ctl);
    }

    function yesNoCtl(q, num) {
        var name = 'q_' + q.id, rows = [];
        var wrap = el('div', { class: 'yesno', role: 'radiogroup', 'aria-label': q.text });
        [['yes', 'Yes'], ['no', 'No']].forEach(function (p) {
            var input = el('input', { type: 'radio', name: name, value: p[0] });
            var label = el('label', { class: 'opt' }, [input, el('span', { text: p[1] })]);
            input.addEventListener('change', function () {
                rows.forEach(function (r) { r.label.classList.toggle('checked', r.input.checked); });
                ctl.error(''); saveDraftSoon();
            });
            rows.push({ id: p[0], input: input, label: label });
            wrap.appendChild(label);
        });
        var ctl = {
            get: function () { var r = rows.filter(function (x) { return x.input.checked; })[0]; return r ? r.id : ''; },
            set: function (v) { rows.forEach(function (r) { r.input.checked = r.id === v; r.label.classList.toggle('checked', r.input.checked); }); }
        };
        return wrapQ(q, num, wrap, ctl);
    }

    function starsCtl(q, num) {
        var value = 0, btns = [];
        var wrap = el('div', { class: 'stars', role: 'radiogroup', 'aria-label': q.text });
        function paint(hover) {
            btns.forEach(function (b, i) { b.classList.toggle('on', i < (hover || value)); });
        }
        for (var i = 1; i <= q.max; i++) (function (n) {
            var b = el('button', { type: 'button', class: 'star', role: 'radio', 'aria-label': n + ' of ' + q.max, 'aria-checked': 'false', text: '★' });
            b.addEventListener('click', function () { value = (value === n ? 0 : n); btns.forEach(function (x, j) { x.setAttribute('aria-checked', String(j + 1 === value)); }); paint(); ctl.error(''); saveDraftSoon(); });
            b.addEventListener('mouseenter', function () { paint(n); });
            b.addEventListener('mouseleave', function () { paint(); });
            btns.push(b); wrap.appendChild(b);
        })(i);
        var ctl = { get: function () { return value || ''; }, set: function (v) { value = Number(v) || 0; paint(); } };
        return wrapQ(q, num, wrap, ctl);
    }

    function scaleCtl(q, num, lo, hi, minLabel, maxLabel) {
        var value = null, btns = [];
        var row = el('div', { class: 'scale-row', role: 'radiogroup', 'aria-label': q.text });
        for (var i = lo; i <= hi; i++) (function (n) {
            var b = el('button', { type: 'button', class: 'scale-btn', role: 'radio', 'aria-checked': 'false', text: String(n) });
            b.addEventListener('click', function () { value = n; paint(); ctl.error(''); saveDraftSoon(); });
            btns.push({ n: n, b: b }); row.appendChild(b);
        })(i);
        function paint() { btns.forEach(function (x) { var on = x.n === value; x.b.classList.toggle('on', on); x.b.setAttribute('aria-checked', String(on)); }); }
        var labels = (minLabel || maxLabel) ? el('div', { class: 'scale-labels' }, [el('span', { text: minLabel || '' }), el('span', { text: maxLabel || '' })]) : null;
        var ctl = { get: function () { return value === null ? '' : value; }, set: function (v) { value = (v === '' || v === undefined || v === null) ? null : Number(v); paint(); } };
        return wrapQ(q, num, el('div', null, [row, labels]), ctl);
    }

    function rankingCtl(q, num) {
        var order = q.options.map(function (o) { return o.id; });
        var labelOf = {}; q.options.forEach(function (o) { labelOf[o.id] = o.label; });
        var touched = false;
        var list = el('ol', { class: 'rank-list', 'aria-label': q.text });
        function render() {
            clear(list);
            order.forEach(function (id, idx) {
                var up = el('button', { type: 'button', 'aria-label': 'Move ' + labelOf[id] + ' up', text: '▲', disabled: idx === 0 });
                var down = el('button', { type: 'button', 'aria-label': 'Move ' + labelOf[id] + ' down', text: '▼', disabled: idx === order.length - 1 });
                up.addEventListener('click', function () { move(idx, -1); });
                down.addEventListener('click', function () { move(idx, 1); });
                list.appendChild(el('li', { class: 'rank-item' }, [el('span', { class: 'pos', text: String(idx + 1) }), el('span', { class: 'rtxt', text: labelOf[id] }), up, down]));
            });
        }
        function move(idx, d) {
            var j = idx + d; if (j < 0 || j >= order.length) return;
            var t = order[idx]; order[idx] = order[j]; order[j] = t;
            touched = true; render(); ctl.error(''); saveDraftSoon();
        }
        render();
        var ctl = {
            get: function () { return touched ? order.slice() : []; },
            touched: function () { return touched; },
            set: function (v) {
                if (Array.isArray(v) && v.length === order.length && v.every(function (id) { return labelOf[id] !== undefined; })) { order = v.slice(); touched = true; render(); }
            }
        };
        var body = el('div', null, [el('div', { class: 'rank-hint', text: 'Use the arrows to order the items. #1 is your top choice.' }), list]);
        return wrapQ(q, num, body, ctl);
    }

    function matrixCtl(q, num) {
        var value = {}, inputs = [];
        var thead = el('tr', null, [el('th', { scope: 'col', text: '' })].concat(q.columns.map(function (c) { return el('th', { scope: 'col', text: c.label }); })));
        var tbody = el('tbody');
        q.rows.forEach(function (r) {
            var tds = [el('td', { text: r.label })];
            q.columns.forEach(function (c) {
                var input = el('input', { type: 'radio', name: 'm_' + q.id + '_' + r.id, value: c.id, 'aria-label': r.label + ': ' + c.label });
                input.addEventListener('change', function () { value[r.id] = c.id; ctl.error(''); saveDraftSoon(); });
                inputs.push({ row: r.id, col: c.id, input: input });
                tds.push(el('td', null, [input]));
            });
            tbody.appendChild(el('tr', null, tds));
        });
        var table = el('table', { class: 'matrix' }, [el('thead', null, [thead]), tbody]);
        var ctl = {
            get: function () { return Object.assign({}, value); },
            set: function (v) {
                value = {};
                inputs.forEach(function (x) { var on = v && v[x.row] === x.col; x.input.checked = !!on; if (on) value[x.row] = x.col; });
            }
        };
        return wrapQ(q, num, el('div', { class: 'matrix-wrap' }, [table]), ctl);
    }

    function statementCtl(q) {
        var card = el('section', { class: 'card q statement', id: 'q-' + q.id }, [el('h2', { text: q.text }), q.helpText ? el('p', { text: q.helpText }) : null]);
        return { node: card, get: function () { return ''; }, set: function () {}, error: function () {}, isStatement: true };
    }

    function buildControl(q, num) {
        switch (q.type) {
            case 'short_text': return textCtl(q, num, 'short');
            case 'long_text': return textCtl(q, num, 'long');
            case 'email': return textCtl(q, num, 'email');
            case 'date': return textCtl(q, num, 'date');
            case 'number': return numberCtl(q, num);
            case 'single_choice': return choiceCtl(q, num, false);
            case 'multi_choice': return choiceCtl(q, num, true);
            case 'dropdown': return dropdownCtl(q, num);
            case 'yes_no': return yesNoCtl(q, num);
            case 'rating': return starsCtl(q, num);
            case 'scale': return scaleCtl(q, num, q.min, q.max, q.minLabel, q.maxLabel);
            case 'nps': return scaleCtl(q, num, 0, 10, q.minLabel, q.maxLabel);
            case 'ranking': return rankingCtl(q, num);
            case 'matrix': return matrixCtl(q, num);
            case 'statement': return statementCtl(q);
            default: return null;
        }
    }

    // ── form ──
    function collect() {
        var answers = {}, others = {}, touched = {};
        state.survey.questions.forEach(function (q) {
            var c = state.controls[q.id]; if (!c || c.isStatement) return;
            var v = c.get();
            var empty = v === '' || v === undefined || v === null || (Array.isArray(v) && !v.length) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
            if (!empty) answers[q.id] = v;
            if (c.other) { var o = c.other(); if (o) others[q.id] = o; }
            if (c.touched) touched[q.id] = c.touched();
        });
        return {
            respondent: { name: state.respondentCtl.name.value.trim(), title: state.respondentCtl.title.value.trim(), company: state.respondentCtl.company.value.trim() },
            answers: answers, others: others, touched: touched
        };
    }

    function answeredCount() {
        var c = collect(), n = Object.keys(c.answers).length;
        var total = state.survey.questions.filter(function (q) { return q.type !== 'statement'; }).length;
        return { n: n, total: total };
    }

    function clientValidate(c) {
        var firstBad = null, ok = true;
        function bad(id, msg) { var ctl = state.controls[id]; if (ctl) ctl.error(msg); if (!firstBad) firstBad = id; ok = false; }
        state.survey.questions.forEach(function (q) {
            var ctl = state.controls[q.id]; if (!ctl || ctl.isStatement) return;
            ctl.error('');
            var v = c.answers[q.id];
            if (q.required && (v === undefined)) { bad(q.id, 'This question is required'); return; }
            if (v === undefined) return;
            if ((q.type === 'single_choice' && v === 'other') || (q.type === 'multi_choice' && v.indexOf('other') !== -1)) {
                if (!c.others[q.id]) bad(q.id, 'Please describe your "Other" answer');
            }
            if (q.type === 'multi_choice') {
                if (q.minSelect && v.length < q.minSelect) bad(q.id, 'Choose at least ' + q.minSelect);
                if (q.maxSelect && v.length > q.maxSelect) bad(q.id, 'Choose at most ' + q.maxSelect);
            }
            if (q.type === 'ranking' && v.length !== q.options.length) bad(q.id, 'Rank every item');
            if (q.type === 'matrix' && q.required && Object.keys(v).length < q.rows.length) bad(q.id, 'Answer every row');
            if (q.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) bad(q.id, 'Enter a valid email address');
            if (q.type === 'number') {
                if (typeof v !== 'number' || !isFinite(v)) bad(q.id, 'Enter a number');
                else if (q.min !== null && q.min !== undefined && v < q.min) bad(q.id, 'Must be at least ' + q.min);
                else if (q.max !== null && q.max !== undefined && v > q.max) bad(q.id, 'Must be at most ' + q.max);
            }
        });
        return { ok: ok, firstBad: firstBad };
    }

    function renderForm(data) {
        var s = data.survey, contact = data.contact || {};
        state.survey = s; state.controls = {}; state.preview = !!data.preview;
        clear(app);

        if (state.preview) {
            app.appendChild(el('div', { class: 'banner', text: 'Preview mode: this is how recipients see the survey. Nothing you submit here is saved or counted.' }));
        }
        app.appendChild(el('section', { class: 'card intro' }, [
            el('h1', { text: s.title || s.name }),
            s.description ? el('p', { class: 'desc', text: s.description }) : null
        ]));

        // About you (prefilled from the unique link; the person can correct anything)
        var nameIn = el('input', { type: 'text', id: 'r-name', maxlength: 120, autocomplete: 'name', value: contact.name || '' });
        var titleIn = el('input', { type: 'text', id: 'r-title', maxlength: 160, autocomplete: 'organization-title', value: contact.title || '' });
        var companyIn = el('input', { type: 'text', id: 'r-company', maxlength: 160, autocomplete: 'organization', value: contact.company || '' });
        var nameErr = el('div', { class: 'err', role: 'alert', hidden: true });
        state.respondentCtl = { name: nameIn, title: titleIn, company: companyIn, nameErr: nameErr };
        [nameIn, titleIn, companyIn].forEach(function (i) { i.addEventListener('input', function () { nameErr.hidden = true; saveDraftSoon(); }); });
        app.appendChild(el('section', { class: 'card', id: 'about' }, [
            el('h2', { text: 'About you' }),
            el('p', { class: 'sub', text: 'We filled this in for you. Please correct anything that is out of date.' }),
            el('div', { class: 'grid' }, [
                el('div', { class: 'full' }, [el('label', { class: 'lbl', for: 'r-name', text: 'Name *' }), nameIn, nameErr]),
                el('div', null, [el('label', { class: 'lbl', for: 'r-title', text: 'Title' }), titleIn]),
                el('div', null, [el('label', { class: 'lbl', for: 'r-company', text: 'Company' }), companyIn])
            ])
        ]));

        var num = 0;
        (s.questions || []).forEach(function (q) {
            if (q.type !== 'statement') num++;
            var ctl = buildControl(q, num);
            if (!ctl) return;
            state.controls[q.id] = ctl;
            app.appendChild(ctl.node);
        });

        var progress = el('span', { class: 'progress' });
        var submit = el('button', { class: 'btn', type: 'button', text: 'Submit' });
        var formErr = el('div', { class: 'form-error', role: 'alert', hidden: true });
        function updProgress() { var a = answeredCount(); progress.textContent = a.n + ' of ' + a.total + ' answered'; }
        app.addEventListener('input', updProgress); app.addEventListener('click', updProgress);
        app.appendChild(el('div', { class: 'actions' }, [submit, progress]));
        app.appendChild(formErr);
        app.appendChild(el('p', { class: 'privacy', text: 'Your name, title and company are saved with your answers.' + (s.shareResults ? ' After you submit you can see the combined results. Only totals are shown; individual answers and names never are.' : '') }));

        // restore a saved draft (never for previews)
        var draft = state.preview ? null : loadDraft();
        if (draft) {
            if (draft.respondent) {
                if (draft.respondent.name) nameIn.value = draft.respondent.name;
                if (draft.respondent.title !== undefined) titleIn.value = draft.respondent.title;
                if (draft.respondent.company !== undefined) companyIn.value = draft.respondent.company;
            }
            (s.questions || []).forEach(function (q) {
                var c = state.controls[q.id]; if (!c || c.isStatement) return;
                if (draft.answers && draft.answers[q.id] !== undefined) c.set(draft.answers[q.id]);
                if (draft.others && draft.others[q.id] && c.setOther) c.setOther(draft.others[q.id]);
            });
        }
        updProgress();

        submit.addEventListener('click', function () {
            formErr.hidden = true;
            var c = collect();
            var firstBad = null;
            if (!c.respondent.name) { nameErr.textContent = 'Please enter your name'; nameErr.hidden = false; firstBad = 'about'; }
            var v = clientValidate(c);
            if (!v.ok && !firstBad) firstBad = 'q-' + v.firstBad;
            if (firstBad) {
                formErr.textContent = 'Please fix the highlighted items.'; formErr.hidden = false;
                var target = document.getElementById(firstBad);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            submit.disabled = true; submit.textContent = 'Submitting…';
            api('/public/submit', { code: CODE, respondent: c.respondent, answers: c.answers, others: c.others }).then(function (r) {
                if (r.status === 200 && r.json.success) {
                    clearDraft();
                    state.results = r.json.results || null;
                    state.myAnswers = r.json.myAnswers || c.answers;
                    renderThanks(r.json.thankYouMessage || s.thankYouMessage, false);
                    window.scrollTo({ top: 0 });
                    return;
                }
                submit.disabled = false; submit.textContent = 'Submit';
                if (r.status === 409) { load(); return; }       // already completed on another device
                if (r.status === 403) { messageScreen('⏸', 'This survey has closed', 'It is no longer accepting responses. Thank you for your interest.'); return; }
                if (r.status === 400 && r.json) {
                    var qe = r.json.questionErrors || {}, fe = r.json.fieldErrors || {};
                    if (fe.name) { nameErr.textContent = fe.name; nameErr.hidden = false; }
                    Object.keys(qe).forEach(function (id) { if (state.controls[id]) state.controls[id].error(qe[id]); });
                    formErr.textContent = r.json.error || 'Please fix the highlighted items.';
                } else {
                    formErr.textContent = (r.json && r.json.error) || 'We could not save your response. Please try again.';
                }
                formErr.hidden = false;
            }).catch(function () {
                submit.disabled = false; submit.textContent = 'Submit';
                formErr.textContent = 'We could not reach the server. Check your connection and try again. Your answers are still here.';
                formErr.hidden = false;
            });
        });
    }

    // ── thank you + results ──
    function renderThanks(thankYou, returning) {
        var s = state.survey;
        clear(app);
        if (state.preview) app.appendChild(el('div', { class: 'banner', text: 'Preview mode: this response was not saved.' }));
        app.appendChild(el('section', { class: 'card center' }, [
            el('div', { class: 'icon ok', text: '✓' }),
            el('h1', { text: returning ? 'You have already completed this survey' : 'Thank you!' }),
            el('p', { text: thankYou || (returning ? 'Thank you for taking part.' : 'Your response has been recorded.') })
        ]));
        if (s.shareResults) renderResults();
        app.appendChild(el('div', { class: 'foot', text: s.orgName ? s.orgName : '' }));
    }

    function pctText(p) { return (Math.round(p * 10) / 10).toString().replace(/\.0$/, '') + '%'; }

    function barRow(label, count, pct, mine) {
        return el('div', { class: 'bar-row' + (mine ? ' mine' : '') }, [
            el('div', { class: 'bar-top' }, [
                el('span', { class: 'name' }, [label, mine ? el('span', { class: 'mine-tag', text: 'Your answer' }) : null]),
                el('span', { class: 'val', text: pctText(pct) + ' (' + count + ')' })
            ]),
            el('div', { class: 'bar-track' }, [el('div', { class: 'bar-fill', style: 'width:' + Math.max(0, Math.min(100, pct)) + '%' })])
        ]);
    }

    function resultCard(q, my) {
        var body;
        var meta = q.answered + (q.answered === 1 ? ' response' : ' responses');
        switch (q.type) {
            case 'single_choice': case 'dropdown': case 'yes_no':
                body = el('div', null, q.options.map(function (o) { return barRow(o.label, o.count, o.pct, my === o.id); }));
                break;
            case 'multi_choice':
                body = el('div', null, q.options.map(function (o) { return barRow(o.label, o.count, o.pct, Array.isArray(my) && my.indexOf(o.id) !== -1); }));
                meta += ' · people could pick more than one';
                break;
            case 'rating': case 'scale': case 'nps': {
                var maxPct = Math.max.apply(null, q.distribution.map(function (d) { return d.pct; }).concat([1]));
                var cols = el('div', { class: 'cols' }, q.distribution.map(function (d) {
                    return el('div', { class: 'col' + (my === d.value ? ' mine' : ''), title: d.value + ': ' + d.count }, [el('div', { class: 'cbar', style: 'height:' + (d.pct / maxPct * 100) + '%' })]);
                }));
                var labels = el('div', { class: 'col-labels' }, q.distribution.map(function (d) { return el('span', { class: my === d.value ? 'mine' : '', text: String(d.value) }); }));
                var top = [];
                if (q.type === 'nps') {
                    top.push(el('div', { class: 'big' }, [String(q.score === null ? '–' : q.score), ' ', el('small', { text: 'Net Promoter Score' })]));
                    var tot = q.answered || 1;
                    top.push(el('div', { class: 'nps-split' }, [
                        el('i', { style: 'width:' + (q.detractors / tot * 100) + '%;background:#d9534f' }),
                        el('i', { style: 'width:' + (q.passives / tot * 100) + '%;background:#c9ced6' }),
                        el('i', { style: 'width:' + (q.promoters / tot * 100) + '%;background:#3aa76d' })
                    ]));
                    top.push(el('div', { class: 'nps-legend' }, [
                        el('span', null, [el('b', { text: 'Detractors ' }), pctText(q.detractors / tot * 100)]),
                        el('span', null, [el('b', { text: 'Passives ' }), pctText(q.passives / tot * 100)]),
                        el('span', null, [el('b', { text: 'Promoters ' }), pctText(q.promoters / tot * 100)])
                    ]));
                    top.push(el('div', { style: 'height:.9rem' }));
                } else {
                    top.push(el('div', { class: 'big' }, [q.average === null ? '–' : String(q.average), ' ', el('small', { text: 'average (' + q.min + '–' + q.max + ')' })]));
                    top.push(el('div', { style: 'height:.7rem' }));
                }
                body = el('div', null, top.concat([cols, labels]));
                break;
            }
            case 'number': {
                var unit = q.unit ? ' ' + q.unit : '';
                function stat(l, v) { return el('div', { class: 's' }, [el('div', { class: 'l', text: l }), el('div', { class: 'v', text: v === null ? '–' : v + unit })]); }
                body = el('div', { class: 'stat-row' }, [stat('Average', q.average), stat('Median', q.median), stat('Lowest', q.min), stat('Highest', q.max)]);
                break;
            }
            case 'ranking':
                body = el('div', null, q.options.map(function (o, i) {
                    return el('div', { class: 'bar-row' }, [el('div', { class: 'bar-top' }, [
                        el('span', { class: 'name', text: (i + 1) + '. ' + o.label }),
                        el('span', { class: 'val', text: o.avgRank === null ? '–' : 'avg rank ' + o.avgRank + ' · #1 for ' + pctText(o.firstPct) })
                    ])]);
                }));
                meta += ' · listed from highest to lowest average rank';
                break;
            case 'matrix': {
                var head = el('tr', null, [el('th', { text: '' })].concat(q.columns.map(function (c) { return el('th', { text: c.label }); })));
                var rowsEl = q.rows.map(function (r) {
                    return el('tr', null, [el('td', { text: r.label })].concat(r.columns.map(function (c) {
                        var shade = 'background:rgba(0,0,0,0)';
                        if (c.pct > 0) shade = 'background:color-mix(in srgb, var(--brand) ' + Math.round(c.pct * 0.55 + 6) + '%, white)';
                        var isMine = my && my[r.id] === c.id;
                        return el('td', { class: isMine ? 'mine' : '', style: shade, text: pctText(c.pct) });
                    })));
                });
                body = el('div', { class: 'matrix-wrap' }, [el('table', { class: 'heat' }, [el('thead', null, [head]), el('tbody', null, rowsEl)])]);
                break;
            }
            default: return null;
        }
        return el('section', { class: 'card rq' }, [el('div', { class: 'rtitle', text: q.text }), el('div', { class: 'rmeta', text: meta }), body]);
    }

    function renderResults() {
        var res = state.results;
        if (!res) return;
        if (!res.available) {
            app.appendChild(el('section', { class: 'card' }, [
                el('h2', { text: 'Results' }),
                el('p', { class: 'sub', style: 'margin:0', text: 'Combined results will be shown once ' + res.needed + ' people have responded (' + res.have + ' so far). Thank you for being one of the first.' })
            ]));
            return;
        }
        app.appendChild(el('div', { class: 'results-head' }, [
            el('h2', { text: 'Results so far' }),
            el('p', { text: res.responseCount + ' ' + (res.responseCount === 1 ? 'person has' : 'people have') + ' responded. Totals only; individual answers are never shown.' })
        ]));
        (res.questions || []).forEach(function (q) {
            var card = resultCard(q, state.myAnswers ? state.myAnswers[q.id] : undefined);
            if (card) app.appendChild(card);
        });
    }

    // ── load ──
    function load() {
        if (!CODE) { messageScreen('?', 'This link is not valid', 'Please use the link from the message you received.'); return; }
        api('/public/open', { code: CODE }).then(function (r) {
            var d = r.json || {};
            if (r.status === 429) { messageScreen('⏳', 'Please try again shortly', 'There have been a lot of requests. Wait a minute and reload this page.'); return; }
            if (d.state === 'invalid' || r.status === 404) { messageScreen('?', 'This link is not valid', 'Please check that you used the full link from the message you received.'); return; }
            if (!d.success) { messageScreen('!', 'Something went wrong', 'We could not load this survey. Please try again in a moment.'); return; }
            if (d.survey) { applyBrand(d.survey); renderTopbar(d.survey); document.title = (d.survey.title || d.survey.name || 'Survey'); }
            if (d.state === 'unavailable') { messageScreen('⏸', 'This survey is not open yet', 'Please check back soon.'); return; }
            if (d.state === 'closed') { messageScreen('⏸', 'This survey has closed', 'It is no longer accepting responses. Thank you for your interest.'); return; }
            state.survey = d.survey; state.preview = !!d.preview;
            if (d.state === 'completed') {
                state.results = d.results || null; state.myAnswers = d.myAnswers || null;
                renderThanks(d.survey.thankYouMessage, true);
                return;
            }
            renderForm(d);
        }).catch(function () {
            messageScreen('!', 'We could not load this survey', 'Check your internet connection and reload the page.');
        });
    }

    load();
})();
</script>
</body>
</html>
