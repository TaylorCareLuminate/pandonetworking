<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>vFlok Dashboard Download</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #154470;
      --accent: #3c98b1;
      --ok: #0f9d58;
      --error: #c62828;
      --text: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px 0;
      color: var(--primary);
      font-size: 1.5rem;
    }
    p { margin: 0 0 16px 0; }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    input[type="password"] {
      flex: 1;
      min-width: 250px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }
    button, .download-btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    button {
      background: var(--primary);
      color: #fff;
    }
    .download-btn {
      background: var(--ok);
      color: #fff;
      margin-top: 8px;
    }
    .hidden { display: none; }
    .message {
      margin-top: 10px;
      font-size: 0.9rem;
      min-height: 20px;
    }
    .error { color: var(--error); }
    .ok { color: var(--ok); }
    .meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.9rem;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>vFlok Hospital Dashboard Download</h1>
    <p>Enter the access password to unlock the installer download.</p>

    <div id="gate">
      <label for="downloadPassword">Password</label>
      <div class="row">
        <input id="downloadPassword" type="password" placeholder="Enter password" />
        <button id="unlockBtn" type="button">Unlock Download</button>
      </div>
      <div id="statusMessage" class="message"></div>
    </div>

    <div id="downloadSection" class="hidden">
      <p class="ok"><strong>Access granted.</strong> Download the installer below.</p>
      <a class="download-btn" href="https://storage.googleapis.com/healthcareitdatabase.firebasestorage.app/installers/vFlok%20Hospital%20Dashboard-Setup-1.3.17.exe" download="vFlok Hospital Dashboard-Setup-1.3.17.exe">
        Download vFlok Dashboard Installer (.exe)
      </a>
      <div class="meta">
        Version: <strong>1.3.17</strong><br />
        File: <code>vFlok Hospital Dashboard-Setup-1.3.17.exe</code>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const REQUIRED_PASSWORD = "vflok_insights_25";
      const input = document.getElementById("downloadPassword");
      const unlockBtn = document.getElementById("unlockBtn");
      const message = document.getElementById("statusMessage");
      const gate = document.getElementById("gate");
      const downloadSection = document.getElementById("downloadSection");

      function unlock() {
        const value = (input.value || "").trim();
        if (value === REQUIRED_PASSWORD) {
          message.textContent = "";
          gate.classList.add("hidden");
          downloadSection.classList.remove("hidden");
          return;
        }
        message.textContent = "Incorrect password. Please try again.";
        message.className = "message error";
      }

      unlockBtn.addEventListener("click", unlock);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") unlock();
      });
    })();
  </script>
</body>
</html>
