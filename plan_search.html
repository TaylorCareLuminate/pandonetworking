<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthLuminate – Find a Health Plan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* Page-specific styles for Health Plan Search page */
    .search-plans {
      padding: 7rem 0;
      position: relative;
      overflow: hidden;
    }

    .search-plans:before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 40px solid rgba(94, 124, 91, 0.05);
      top: -200px;
      left: -200px;
      z-index: 0;
    }

    .search-plans:after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 50px solid rgba(201, 151, 61, 0.05);
      bottom: -250px;
      right: -250px;
      z-index: 0;
    }

    /* Filter Controls */
    #filters {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      padding: 2rem;
      margin-bottom: 3rem;
      position: relative;
      z-index: 1;
    }

    #filters:before {
      content: '';
      position: absolute;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--blue), var(--gold));
      top: 0;
      left: 0;
      border-radius: 20px 20px 0 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .col-md-4,
    .col-md-6 {
      flex: 1;
      min-width: 250px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark-blue);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e1e5e9;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(94, 124, 91, 0.1);
      background-color: white;
    }

    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
    }

    .form-check {
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-check-input {
      width: 1.2rem;
      height: 1.2rem;
      border: 2px solid #d1d5db;
      border-radius: 4px;
      background-color: white;
      transition: all 0.3s ease;
    }

    .form-check-input:checked {
      background-color: var(--blue);
      border-color: var(--blue);
    }

    .form-check-label {
      color: var(--gray);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-search {
      background-color: var(--gold);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(201, 151, 61, 0.3);
    }

    .btn-search:hover {
      background-color: var(--dark-gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 151, 61, 0.4);
    }

    /* Results Cards */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .card {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .card:before {
      content: '';
      position: absolute;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--gold));
      top: 0;
      left: 0;
      transition: height 0.3s ease;
    }

    .card:hover:before {
      height: 8px;
    }

    .card-body {
      padding: 2rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--dark-blue);
      margin-bottom: 0.5rem;
    }

    .card-subtitle {
      margin-bottom: 1rem;
    }

    .card-subtitle a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .card-subtitle a:hover {
      color: var(--dark-blue);
      text-decoration: underline;
    }

    .card-text {
      color: var(--gray);
      line-height: 1.6;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
    }

    .page-item {
      list-style: none;
    }

    .page-link {
      display: block;
      padding: 0.5rem 1rem;
      color: var(--blue);
      text-decoration: none;
      border: 2px solid var(--blue);
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .page-link:hover {
      background-color: var(--blue);
      color: white;
    }

    .page-item.disabled .page-link {
      color: #6c757d;
      border-color: #dee2e6;
      cursor: not-allowed;
    }

    .page-item.disabled .page-link:hover {
      background-color: transparent;
      color: #6c757d;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .row {
        flex-direction: column;
      }
      
      #results {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="images/pando_trees.png">
</head>
<body>
  <!-- Header -->
  <div id="header-container"></div>

  <!-- Plan Search Section -->
  <section class="search-plans">
    <div class="container">
      <div class="section-title">
        <h2>Find a Health Plan</h2>
      </div>

      <!-- Filter Controls (injected by R) -->
      <div id="filters" class="animate-on-scroll">
        <!-- R will spit out your multi‐select, option checkboxes & state dropdown here -->
        %FILTER_HTML%
      </div>

      <!-- Results Cards -->
      <div id="results" class="animate-on-scroll"></div>

      <!-- Pagination -->
      <nav aria-label="Page navigation">
        <ul class="pagination">
          <li class="page-item" id="prevPage">
            <a class="page-link" href="#">
              <i class="fas fa-chevron-left"></i> Previous
            </a>
          </li>
          <li class="page-item disabled">
            <a class="page-link" href="#" id="pageInfo">Page 1</a>
          </li>
          <li class="page-item" id="nextPage">
            <a class="page-link" href="#">
              Next <i class="fas fa-chevron-right"></i>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Load Partials Script -->
  <script>
    // Load header and footer partials
    async function loadPartials() {
      try {
        // Load header
        const headerResponse = await fetch('partials/header.html');
        const headerHtml = await headerResponse.text();
        document.getElementById('header-container').innerHTML = headerHtml;
        
        // Load footer
        const footerResponse = await fetch('partials/footer.html');
        const footerHtml = await footerResponse.text();
        document.getElementById('footer-container').innerHTML = footerHtml;
        
        // Initialize scroll effects after header is loaded
        initializeScrollEffects();
        
      } catch (error) {
        console.error('Error loading partials:', error);
      }
    }

    // Initialize scroll effects
    function initializeScrollEffects() {
      let lastScrollTop = 0;
      window.addEventListener('scroll', function() {
        const header = document.querySelector('header');
        if (header) {
          header.classList.toggle('sticky', window.scrollY > 0);
          let st = window.pageYOffset || document.documentElement.scrollTop;
          if (st > lastScrollTop && st > 50) {
            header.classList.add('header-hidden');
          } else {
            header.classList.remove('header-hidden');
          }
          lastScrollTop = st <= 0 ? 0 : st;
        }
      });

      // Smooth scrolling for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            window.scrollTo({
              top: target.offsetTop - 80,
              behavior: 'smooth'
            });
          }
        });
      });

      // Animation for elements on scroll
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px"
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('animate');
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll('.animate-on-scroll').forEach(el => {
        observer.observe(el);
      });
    }

    // Load partials when page loads
    document.addEventListener('DOMContentLoaded', loadPartials);
  </script>
  
  <!-- Authentication Script -->
  <script src="js/auth.js"></script>

  <!-- Plan Search JS (same as before) -->
  <script>
    // — embed your JSON & dims & dimsOptions just like in your R‐generated page —
    const data        = %JSON_DATA%;
    const dims        = %DIMS%;
    const dimsOptions = %DIMS_OPTIONS%;
    const pageSize    = 50;
    let   currentPage = 0;
    let   filtered    = data.slice();

    function updateOptionSelectors() {
      const selDims = Array.from(
        document.getElementById("dimSelect").selectedOptions
      ).map(o => o.value);
      const container = document.getElementById("optionSelectors");
      container.innerHTML = "";
      selDims.forEach(dim => {
        const opts = dimsOptions[dim];
        const col  = document.createElement("div");
        col.className = "col-md-6 mb-3";
        let html = `<label><strong>${dim}</strong></label>`;
        opts.forEach(opt => {
          const optId = dim.replace(/\W+/g,"_") + "_" + opt.replace(/\W+/g,"_");
          html += `
            <div class="form-check">
              <input class="form-check-input" type="checkbox"
                     id="${optId}" name="${dim}" value="${opt}">
              <label class="form-check-label" for="${optId}">${opt}</label>
            </div>`;
        });
        col.innerHTML = html;
        container.appendChild(col);
      });
    }

    function applyFilters() {
      let out = data;
      const selDims = Array.from(
        document.getElementById("dimSelect").selectedOptions
      ).map(o => o.value);
      selDims.forEach(dim => {
        const checked = Array.from(
          document.querySelectorAll(`input[name="${dim}"]:checked`)
        ).map(cb => cb.value);
        if (checked.length) {
          out = out.filter(r =>
            r.Dimension === dim && checked.includes(r.Option)
          );
        }
      });
      const st = document.getElementById("State").value;
      if (st) out = out.filter(r => r.State === st);
      const seen = {};
      out.forEach(r => { if (!seen[r.NAME]) seen[r.NAME] = r; });
      filtered    = Object.values(seen);
      currentPage = 0;
    }

    function renderPage() {
      const start = currentPage * pageSize;
      const page  = filtered.slice(start, start + pageSize);
      const container = document.getElementById("results");
      container.innerHTML = "";
      page.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">${p.NAME}</h5>
            <h6 class="card-subtitle mb-2 text-muted">
              <a href="https://${p.DOMAIN}" target="_blank">${p.DOMAIN}</a>
            </h6>
            <p class="card-text">${p.DETAILS}</p>
          </div>`;
        container.appendChild(card);
      });
      document.getElementById("pageInfo").textContent =
        "Page " + (currentPage + 1) +
        " of " + Math.ceil(filtered.length / pageSize);
      document.getElementById("prevPage")
        .classList.toggle("disabled", currentPage === 0);
      document.getElementById("nextPage")
        .classList.toggle("disabled",
          (currentPage + 1)*pageSize >= filtered.length
        );
    }

    // Event listeners (wait for DOM to be ready)
    document.addEventListener('DOMContentLoaded', function() {
      const dimSelect = document.getElementById("dimSelect");
      const searchBtn = document.getElementById("searchBtn");
      const prevPage = document.getElementById("prevPage");
      const nextPage = document.getElementById("nextPage");

      if (dimSelect) {
        dimSelect.addEventListener("change", updateOptionSelectors);
      }
      
      if (searchBtn) {
        searchBtn.addEventListener("click", () => { applyFilters(); renderPage(); });
      }
      
      if (prevPage) {
        prevPage.addEventListener("click", e => {
          e.preventDefault();
          if (currentPage > 0) { currentPage--; renderPage(); }
        });
      }
      
      if (nextPage) {
        nextPage.addEventListener("click", e => {
          e.preventDefault();
          if ((currentPage + 1) * pageSize < filtered.length) {
            currentPage++; renderPage();
          }
        });
      }

      // Initialize if elements exist
      if (dimSelect) updateOptionSelectors();
      renderPage();
    });
  </script>
</body>
</html>
