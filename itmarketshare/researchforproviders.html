<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Customer Base Research | HealthLuminate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <style>
        /* Use HealthLuminate color variables */
        :root {
            --gray: #5B5B5B;
            --gold: #DBA660;
            --blue: #44A1C4;
            --light-yellow: #FFE699;
            --dark-gold: #935E1B;
            --dark-blue: #2D6B83;
            --green: #4CAF50;
            --orange: #FF9800;
            --red: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fafafa;
            color: var(--gray);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 1.8rem;
            background-color: var(--gold);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(219, 166, 96, 0.3);
        }

        .btn:hover {
            background-color: var(--dark-gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 166, 96, 0.4);
        }

        /* Main content styles */
        .main-content {
            padding: 6rem 0 4rem 0;
            min-height: calc(100vh - 200px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-header h1 {
            font-size: 2.8rem;
            color: var(--dark-blue);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.3rem;
            color: var(--blue);
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border: 2px solid #fecaca;
            color: var(--red);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 500;
        }

        .confidence-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .confidence-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .confidence-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .confidence-card.high:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green), #45a049);
        }

        .confidence-card.medium:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--dark-gold));
        }

        .confidence-card.low:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange), #f57c00);
        }

        .confidence-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .confidence-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .confidence-card.high .confidence-icon {
            background: linear-gradient(135deg, var(--green), #45a049);
        }

        .confidence-card.medium .confidence-icon {
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
        }

        .confidence-card.low .confidence-icon {
            background: linear-gradient(135deg, var(--orange), #f57c00);
        }

        .confidence-title {
            flex: 1;
        }

        .confidence-title h3 {
            color: var(--dark-blue);
            font-size: 1.4rem;
            margin-bottom: 0.25rem;
        }

        .confidence-title p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .confidence-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-item {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-blue);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .organization-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .org-link {
            display: block;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-decoration: none;
            color: var(--dark-blue);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .org-link:hover {
            background: rgba(68, 161, 196, 0.05);
            border-color: var(--blue);
            transform: translateX(5px);
        }

        .organizations-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .org-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .org-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .org-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue), var(--gold));
        }

        .org-header {
            margin-bottom: 1.5rem;
        }

        .org-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark-blue);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .org-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .org-detail {
            background: #f8fafc;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .org-detail:hover {
            background: rgba(68, 161, 196, 0.05);
        }

        .org-detail strong {
            color: var(--blue);
            font-weight: 600;
            display: block;
            margin-bottom: 0.25rem;
        }

        .domain-link {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
        }

        .domain-link:hover {
            text-decoration: underline;
            color: var(--dark-blue);
        }

        .confidence-badge {
            background: linear-gradient(135deg, var(--green), #45a049);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            margin-bottom: 1rem;
            display: inline-block;
        }

        .confidence-badge.medium {
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            box-shadow: 0 4px 12px rgba(219, 166, 96, 0.3);
        }

        .confidence-badge.low {
            background: linear-gradient(135deg, var(--orange), #f57c00);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .evidence-section {
            background: rgba(68, 161, 196, 0.02);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(68, 161, 196, 0.1);
            margin-bottom: 1.5rem;
        }

        .evidence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .evidence-header:hover {
            background: rgba(68, 161, 196, 0.05);
            padding: 0.5rem;
            border-radius: 8px;
            margin: -0.5rem;
        }

        .evidence-toggle {
            background: none;
            border: none;
            color: var(--blue);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .evidence-toggle i {
            transition: transform 0.3s ease;
        }

        .evidence-toggle:hover {
            background: rgba(68, 161, 196, 0.1);
        }

        .evidence-content {
            margin-top: 1rem;
            border-top: 1px solid rgba(68, 161, 196, 0.2);
            padding-top: 1rem;
            transition: all 0.3s ease;
        }

        .evidence-content.collapsed {
            display: none;
        }

        .evidence-list {
            margin-bottom: 1rem;
        }

        .evidence-item {
            background: white;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid var(--blue);
            font-size: 0.95rem;
            color: var(--gray);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .evidence-item:hover {
            border-left-color: var(--gold);
            transform: translateX(3px);
        }

        .url-list {
            margin-bottom: 1rem;
        }

        .url-item {
            display: inline-block;
            margin-right: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .url-link {
            color: var(--blue);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            background: white;
            border-radius: 20px;
            border: 2px solid var(--blue);
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .url-link:hover {
            background: var(--blue);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(68, 161, 196, 0.3);
        }

        .vendor-feedback {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border: 2px solid #7dd3fc;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .vendor-feedback h3 {
            color: var(--dark-blue);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .vendor-feedback-content {
            color: var(--gray);
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .contact-banner {
            background: linear-gradient(135deg, var(--blue) 0%, var(--dark-blue) 100%);
            color: white;
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            margin-top: 4rem;
            position: relative;
            overflow: hidden;
        }

        .contact-banner:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='m36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }

        .contact-banner h3 {
            margin-bottom: 1rem;
            font-size: 2rem;
            font-weight: 700;
            position: relative;
            z-index: 1;
            color: white;
        }

        .contact-banner p {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .contact-link {
            display: inline-block;
            background: var(--gold);
            color: white;
            padding: 1rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 25px rgba(219, 166, 96, 0.4);
        }

        .contact-link:hover {
            background: var(--dark-gold);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(219, 166, 96, 0.5);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .main-content {
                padding: 4rem 0 2rem 0;
            }
            
            .page-header h1 {
                font-size: 2.2rem;
            }
            
            .page-header p {
                font-size: 1.1rem;
            }
            
            .confidence-cards {
                grid-template-columns: 1fr;
            }

            .org-details {
                grid-template-columns: 1fr;
            }

            .evidence-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .contact-banner {
                padding: 2rem 1rem;
            }

            .contact-banner h3 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.8rem;
            }
            
            .org-card {
                padding: 1.5rem;
            }

            .confidence-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <main class="main-content">
        <div class="container">
            <div class="page-header" id="page-header">
                <h1 id="page-title">Customer Base Research</h1>
                <p id="page-description">Loading research details...</p>
            </div>

            <div id="vendor-feedback" class="vendor-feedback" style="display: none;">
                <h3><i class="fas fa-comment-alt"></i> Vendor Feedback</h3>
                <div class="vendor-feedback-content" id="vendor-feedback-content">
                    No vendor feedback available at this time.
                </div>
            </div>

            <div id="loading" class="loading" style="display: block;">
                <i class="fas fa-spinner"></i>
                <div>Loading research data...</div>
            </div>

            <div id="error-message" class="error" style="display: none;"></div>

            <div id="confidence-cards" class="confidence-cards" style="display: none;"></div>

            <div id="organizations-container" class="organizations-grid"></div>

            <div class="contact-banner">
                <h3>Need Custom Research for Your Organization?</h3>
                <p>Let HealthLuminate conduct comprehensive market research for any healthcare IT vendor.</p>
                <a href="https://www.healthluminate.com/connect" class="contact-link">Contact Us Today</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Firebase configuration - Using actual HealthLuminate config
        const firebaseConfig = {
            apiKey: "AIzaSyBpsxZCSULnandhpdVLI9nvsxd3_BH4dfs",
            authDomain: "healthcareitdatabase.firebaseapp.com",
            databaseURL: "https://healthcareitdatabase-default-rtdb.firebaseio.com",
            projectId: "healthcareitdatabase",
            storageBucket: "healthcareitdatabase.appspot.com",
            messagingSenderId: "1024935247661",
            appId: "1:1024935247661:web:a74be5c7b9df74245bdda4",
            measurementId: "G-60KWQ8SJW4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // DOM elements
        const loadingElement = document.getElementById('loading');
        const errorElement = document.getElementById('error-message');
        const confidenceCardsElement = document.getElementById('confidence-cards');
        const organizationsContainer = document.getElementById('organizations-container');

        let currentData = null;
        let currentDetails = null;

        // Mark this page as public (no auth required)
        window.isPublicPage = true;
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadPartials();
            
            // Get GUID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const guid = urlParams.get('guid');
            
            if (guid) {
                loadResearchData(guid);
            } else {
                showError('No research GUID provided in URL. Please check the link.');
            }
        });

        // Load header and footer partials
        async function loadPartials() {
            try {
                // Load header
                const headerResponse = await fetch('../Partials/header.html');
                const headerHtml = await headerResponse.text();
                document.getElementById('header-container').innerHTML = headerHtml;
                
                // Load footer
                const footerResponse = await fetch('../Partials/footer.html');
                const footerHtml = await footerResponse.text();
                document.getElementById('footer-container').innerHTML = footerHtml;
                
            } catch (error) {
                console.error('Error loading partials:', error);
            }
        }

        // Load research data
        async function loadResearchData(guid) {
            try {
                loadingElement.style.display = 'block';
                clearData();

                console.log(`Loading data for GUID: ${guid}`);
                
                // Load both data and details
                const [dataSnapshot, detailsSnapshot] = await Promise.all([
                    database.ref(`market_share_providers/single_vendor/${guid}/data`).once('value'),
                    database.ref(`market_share_providers/single_vendor/${guid}/details`).once('value')
                ]);
                
                const data = dataSnapshot.val();
                const details = detailsSnapshot.val();
                
                console.log('Firebase data received:', { data, details });
                
                if (!data || !details) {
                    throw new Error(`No data found for GUID: ${guid}`);
                }

                currentData = data;
                currentDetails = details;
                
                updatePageHeader(details);
                displayVendorFeedback(details);
                displayData(data);
                
            } catch (error) {
                showError('Failed to load research data: ' + error.message);
                console.error('Error fetching data:', error);
            } finally {
                loadingElement.style.display = 'none';
            }
        }

        // Update page header with vendor details
        function updatePageHeader(details) {
            // Handle details structure - it's an array with data at index 0
            const detailsData = details[0] || details;
            
            const title = `${detailsData.vendor} ${detailsData.solution} Customer Base Research`;
            const description = `A ${detailsData.for} requested that HealthLuminate scan to identify customers of ${detailsData.vendor} ${detailsData.solution}. For this research, HealthLuminate conducted AI web-based searches tied to every health systems and stand-alone hospital in the US to detect digital 'breadcrumbs' that reveal which health systems actually use a solution.

This analysis will not identify all customers and will sometimes turn up false positives. For this reason, HealthLuminate has invited ${detailsData.vendor} to correct this report if they prefer. Their feedback will be loaded into this report.`;
            
            document.getElementById('page-title').textContent = title;
            document.getElementById('page-description').textContent = description;
            document.title = title + ' | HealthLuminate';
        }

        // Display vendor feedback if available
        function displayVendorFeedback(details) {
            // Handle details structure - it's an array with data at index 0
            const detailsData = details[0] || details;
            
            if (detailsData.vendor_feedback && detailsData.vendor_feedback.trim() !== '') {
                const feedbackElement = document.getElementById('vendor-feedback');
                const contentElement = document.getElementById('vendor-feedback-content');
                
                contentElement.textContent = detailsData.vendor_feedback;
                feedbackElement.style.display = 'block';
            }
        }

        // Display data grouped by confidence
        function displayData(data) {
            console.log('displayData called with data type:', Array.isArray(data) ? 'array' : typeof data);
            
            let organizations;
            if (Array.isArray(data)) {
                organizations = data.map((org, index) => [index.toString(), org]);
            } else {
                organizations = Object.entries(data);
            }
            
            // Group organizations by confidence
            const highConfidence = [];
            const mediumConfidence = [];
            const lowConfidence = [];
            
            organizations.forEach(([key, org]) => {
                const confidence = parseFloat(org.most_likely_confidence || 0);
                
                if (confidence >= 90) {
                    highConfidence.push([key, org]);
                } else if (confidence >= 70) {
                    mediumConfidence.push([key, org]);
                } else {
                    lowConfidence.push([key, org]);
                }
            });
            
            displayConfidenceCards(highConfidence, mediumConfidence, lowConfidence);
            displayOrganizations(highConfidence, mediumConfidence, lowConfidence);
        }

        // Display confidence summary cards
        function displayConfidenceCards(highConfidence, mediumConfidence, lowConfidence) {
            const calculateStats = (orgList) => {
                if (orgList.length === 0) return { count: 0, avgBeds: 0, avgHospitals: 0 };
                
                const totalBeds = orgList.reduce((sum, [key, org]) => sum + (parseInt(org.hs_total_beds) || 0), 0);
                const totalHospitals = orgList.reduce((sum, [key, org]) => sum + (parseInt(org.hs_total_hospitals) || 0), 0);
                
                return {
                    count: orgList.length,
                    avgBeds: Math.round(totalBeds / orgList.length) || 0,
                    avgHospitals: Math.round(totalHospitals / orgList.length) || 0
                };
            };
            
            const highStats = calculateStats(highConfidence);
            const mediumStats = calculateStats(mediumConfidence);
            const lowStats = calculateStats(lowConfidence);
            
            confidenceCardsElement.innerHTML = `
                <div class="confidence-card high">
                    <div class="confidence-header">
                        <div class="confidence-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="confidence-title">
                            <h3>High Confidence</h3>
                            <p>90% or higher confidence</p>
                        </div>
                    </div>
                    <div class="confidence-stats">
                        <div class="stat-item">
                            <div class="stat-number">${highStats.count}</div>
                            <div class="stat-label">Organizations</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${highStats.avgBeds.toLocaleString()}</div>
                            <div class="stat-label">Avg Beds</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${highStats.avgHospitals}</div>
                            <div class="stat-label">Avg Hospitals</div>
                        </div>
                    </div>
                    <div class="organization-list">
                        ${highConfidence.slice(0, 10).map(([key, org]) => `
                            <a href="#org-${key}" class="org-link">${org.org || key}</a>
                        `).join('')}
                        ${highConfidence.length > 10 ? `<p style="text-align: center; color: var(--gray); font-style: italic; margin-top: 0.5rem;">... and ${highConfidence.length - 10} more</p>` : ''}
                    </div>
                </div>

                <div class="confidence-card medium">
                    <div class="confidence-header">
                        <div class="confidence-icon">
                            <i class="fas fa-adjust"></i>
                        </div>
                        <div class="confidence-title">
                            <h3>Medium Confidence</h3>
                            <p>70-89% confidence</p>
                        </div>
                    </div>
                    <div class="confidence-stats">
                        <div class="stat-item">
                            <div class="stat-number">${mediumStats.count}</div>
                            <div class="stat-label">Organizations</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${mediumStats.avgBeds.toLocaleString()}</div>
                            <div class="stat-label">Avg Beds</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${mediumStats.avgHospitals}</div>
                            <div class="stat-label">Avg Hospitals</div>
                        </div>
                    </div>
                    <div class="organization-list">
                        ${mediumConfidence.slice(0, 10).map(([key, org]) => `
                            <a href="#org-${key}" class="org-link">${org.org || key}</a>
                        `).join('')}
                        ${mediumConfidence.length > 10 ? `<p style="text-align: center; color: var(--gray); font-style: italic; margin-top: 0.5rem;">... and ${mediumConfidence.length - 10} more</p>` : ''}
                    </div>
                </div>

                <div class="confidence-card low">
                    <div class="confidence-header">
                        <div class="confidence-icon">
                            <i class="fas fa-question-circle"></i>
                        </div>
                        <div class="confidence-title">
                            <h3>Lower Confidence</h3>
                            <p>Below 70% confidence</p>
                        </div>
                    </div>
                    <div class="confidence-stats">
                        <div class="stat-item">
                            <div class="stat-number">${lowStats.count}</div>
                            <div class="stat-label">Organizations</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${lowStats.avgBeds.toLocaleString()}</div>
                            <div class="stat-label">Avg Beds</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${lowStats.avgHospitals}</div>
                            <div class="stat-label">Avg Hospitals</div>
                        </div>
                    </div>
                    <div class="organization-list">
                        ${lowConfidence.slice(0, 10).map(([key, org]) => `
                            <a href="#org-${key}" class="org-link">${org.org || key}</a>
                        `).join('')}
                        ${lowConfidence.length > 10 ? `<p style="text-align: center; color: var(--gray); font-style: italic; margin-top: 0.5rem;">... and ${lowConfidence.length - 10} more</p>` : ''}
                    </div>
                </div>
            `;
            
            confidenceCardsElement.style.display = 'grid';
        }

        // Display organizations in detailed cards
        function displayOrganizations(highConfidence, mediumConfidence, lowConfidence) {
            const allOrganizations = [...highConfidence, ...mediumConfidence, ...lowConfidence];
            
            // Sort each group by confidence (highest first)
            const sortByConfidence = (a, b) => {
                const aConf = parseFloat(a[1].most_likely_confidence || 0);
                const bConf = parseFloat(b[1].most_likely_confidence || 0);
                return bConf - aConf;
            };
            
            highConfidence.sort(sortByConfidence);
            mediumConfidence.sort(sortByConfidence);
            lowConfidence.sort(sortByConfidence);
            
            const allOrgsHtml = [
                ...highConfidence.map(([key, org]) => createOrganizationCard(key, org)),
                ...mediumConfidence.map(([key, org]) => createOrganizationCard(key, org)),
                ...lowConfidence.map(([key, org]) => createOrganizationCard(key, org))
            ].join('');

            organizationsContainer.innerHTML = allOrgsHtml;
        }

        // Create organization card
        function createOrganizationCard(key, org) {
            const orgName = org.org || key;
            const hospitals = org.hs_total_hospitals || 'N/A';
            const beds = org.hs_total_beds || 'N/A';
            const headquarters = org.headquarters || 'N/A';
            const domain = org.hs_domain || '';
            const confidence = parseFloat(org.most_likely_confidence || 0);
            const confidenceClass = confidence >= 90 ? '' : confidence >= 70 ? 'medium' : 'low';

            const evidenceList = org.most_likely_evidence_list ? org.most_likely_evidence_list.split(' || ').filter(e => e.trim() !== '') : [];
            const urlList = org.most_likely_web_urls_from_search ? org.most_likely_web_urls_from_search.split(' || ').filter(u => u.trim() !== '') : [];

            const sectionId = `evidence-${key}-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

            return `
                <div class="org-card" id="org-${key}">
                    <div class="org-header">
                        <div class="org-name">${orgName}</div>
                        <div class="confidence-badge ${confidenceClass}">
                            ${confidence}% Confidence
                        </div>
                        <div class="org-details">
                            <div class="org-detail">
                                <strong>Hospitals</strong>
                                ${hospitals}
                            </div>
                            <div class="org-detail">
                                <strong>Beds</strong>
                                ${beds}
                            </div>
                            <div class="org-detail">
                                <strong>Headquarters</strong>
                                ${headquarters}
                            </div>
                            ${domain ? `
                                <div class="org-detail">
                                    <strong>Domain</strong>
                                    <a href="https://${domain}" target="_blank" class="domain-link">${domain}</a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    ${(evidenceList.length > 0 || urlList.length > 0) ? `
                        <div class="evidence-section">
                            <div class="evidence-header" onclick="toggleEvidenceContent('${sectionId}')">
                                <h4 style="color: var(--dark-blue); font-weight: 600;">Research Evidence</h4>
                                <button class="evidence-toggle" type="button">
                                    <span>View Details</span>
                                    <i class="fas fa-chevron-down" id="toggle-${sectionId}"></i>
                                </button>
                            </div>
                            
                            <div class="evidence-content collapsed" id="${sectionId}">
                                ${evidenceList.length > 0 ? `
                                    <div class="evidence-list">
                                        <h5 style="color: var(--blue); margin-bottom: 1rem; font-weight: 600;">Evidence Found:</h5>
                                        ${evidenceList.map(evidence => `
                                            <div class="evidence-item">${evidence}</div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                                
                                ${urlList.length > 0 ? `
                                    <div class="url-list">
                                        <h5 style="color: var(--blue); margin-bottom: 1rem; font-weight: 600;">Source Links:</h5>
                                        ${urlList.map((url, index) => `
                                            <div class="url-item">
                                                <a href="${url}" target="_blank" class="url-link">
                                                    Source ${index + 1}
                                                </a>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Toggle evidence content
        function toggleEvidenceContent(sectionId) {
            const content = document.getElementById(sectionId);
            const toggleIcon = document.getElementById(`toggle-${sectionId}`);
            const toggleText = toggleIcon.parentElement.querySelector('span');
            
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                toggleIcon.style.transform = 'rotate(180deg)';
                toggleText.textContent = 'Hide Details';
            } else {
                content.classList.add('collapsed');
                toggleIcon.style.transform = 'rotate(0deg)';
                toggleText.textContent = 'View Details';
            }
        }

        // Clear data
        function clearData() {
            confidenceCardsElement.style.display = 'none';
            organizationsContainer.innerHTML = '';
            document.getElementById('vendor-feedback').style.display = 'none';
            currentData = null;
            currentDetails = null;
        }

        // Show error message
        function showError(message) {
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 8000);
        }

        // Smooth scroll to organizations when clicked from confidence cards
        document.addEventListener('click', function(e) {
            if (e.target.matches('.org-link')) {
                e.preventDefault();
                const targetId = e.target.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'center' 
                    });
                    // Add highlight effect
                    targetElement.style.transition = 'all 0.3s ease';
                    targetElement.style.transform = 'scale(1.02)';
                    targetElement.style.boxShadow = '0 20px 60px rgba(68, 161, 196, 0.2)';
                    setTimeout(() => {
                        targetElement.style.transform = '';
                        targetElement.style.boxShadow = '';
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
