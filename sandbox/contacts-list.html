<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacts - HealthLuminate CRM</title>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #38bdf8;
      --secondary: #22d3bb;
      --accent: #e9c46a;
      --danger: #e76f51;
      --success: #2a9d8f;
      --light-blue: #f4f9fa;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.07);
      --border-radius: 10px;
      --warning: #f4a261;
    }
    
    body { 
      background: #f9fafb; 
      margin: 0; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #263238; 
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 2em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      border-left: 4px solid var(--primary);
    }

    .stat-label {
      font-size: 0.85em;
      color: #666;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 2em;
      font-weight: 700;
      color: var(--primary);
    }

    /* Filters */
    .filters-section {
      background: white;
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-group label {
      font-size: 0.85em;
      font-weight: 600;
      color: #555;
    }

    .filter-group input,
    .filter-group select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95em;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    /* Table */
    .table-container {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .contacts-table {
      width: 100%;
      border-collapse: collapse;
    }

    .contacts-table thead {
      background: var(--primary);
      color: white;
    }

    .contacts-table th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .contacts-table th:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .contacts-table th i {
      margin-left: 4px;
      opacity: 0.5;
    }

    .contacts-table tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.2s;
      cursor: pointer;
    }

    .contacts-table tbody tr:hover {
      background: var(--light-blue);
    }

    .contacts-table td {
      padding: 16px;
    }

    .contact-name {
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-contact-badge {
      background: var(--accent);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .company-link {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
    }

    .company-link:hover {
      text-decoration: underline;
    }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--secondary);
      transform: translateY(-1px);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state i {
      font-size: 4em;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .loading i {
      font-size: 3em;
      color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .date-recent {
      color: var(--success);
      font-weight: 600;
    }

    .date-old {
      color: var(--danger);
      font-weight: 600;
    }

    .date-never {
      color: #999;
      font-style: italic;
    }
  </style>

  <!-- Shared Header Component -->
  <script src="components/sandbox-header.js"></script>
</head>
<body>

  <!-- Header (shared component) -->
  <div id="sandbox-header"></div>

  <!-- Main Container -->
  <div class="container">
    
    <!-- Page Header -->
    <div class="page-header">
      <h1>
        <i class="fas fa-users"></i>
        All Contacts
      </h1>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Contacts</div>
        <div class="stat-value" id="statTotalContacts">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Main Contacts</div>
        <div class="stat-value" id="statMainContacts">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Contacted This Week</div>
        <div class="stat-value" id="statThisWeek">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Never Contacted</div>
        <div class="stat-value" id="statNeverContacted">-</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <div class="filters-grid">
        <div class="filter-group">
          <label><i class="fas fa-search"></i> Search</label>
          <input type="text" id="contactSearch" placeholder="Search contacts..." onkeyup="applyFilters()">
        </div>
        <div class="filter-group">
          <label><i class="fas fa-building"></i> Company</label>
          <select id="companyFilter" onchange="applyFilters()">
            <option value="">All Companies</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-calendar-alt"></i> Last Contacted</label>
          <select id="lastContactedFilter" onchange="applyFilters()">
            <option value="">All Time</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="never">Never Contacted</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-star"></i> Type</label>
          <select id="typeFilter" onchange="applyFilters()">
            <option value="">All Contacts</option>
            <option value="main">Main Contacts Only</option>
            <option value="other">Other Contacts</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Contacts Table -->
    <div class="table-container">
      <div id="contactsTableContainer">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Loading contacts...</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    // Import Firebase
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Initialize shared header
    renderSandboxHeader({
      type: 'contact',
      backUrl: 'crm-sandbox.html',
      backText: 'Back to CRM',
      icon: 'fa-users',
      title: 'HealthLuminate CRM'
    });

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBpsxZCSULnandhpdVLI9nvsxd3_BH4dfs",
      authDomain: "healthcareitdatabase.firebaseapp.com",
      databaseURL: "https://healthcareitdatabase-default-rtdb.firebaseio.com",
      projectId: "healthcareitdatabase",
      storageBucket: "healthcareitdatabase.firebasestorage.app",
      messagingSenderId: "1024935247661",
      appId: "1:1024935247661:web:a74be5c7b9df74245bdda4",
      measurementId: "G-60KWQ8SJW4"
    };

    // Initialize Firebase
    let app;
    const existingApps = getApps();
    if (existingApps.length > 0) {
      app = existingApps[0];
    } else {
      app = initializeApp(firebaseConfig);
    }

    const auth = getAuth(app);
    const db = getDatabase(app);

    // Firestore config for phone_activities
    const firestoreConfig = {
      apiKey: "AIzaSyDGESh2UQT4awIg9Y3kBcZPN-aaWthC1k4",
      authDomain: "clemail.firebaseapp.com",
      projectId: "clemail",
      storageBucket: "clemail.firebasestorage.app",
      messagingSenderId: "339261863686",
      appId: "1:339261863686:web:4b8a78d5eea7f1c9861e87"
    };

    const firestoreApp = existingApps.find(a => a.name === 'clemail-firestore') || 
                         initializeApp(firestoreConfig, 'clemail-firestore');
    const dbFS = getFirestore(firestoreApp);

    // Global variables
    let allContacts = [];
    let filteredContacts = [];
    let isAuthReady = false;
    let lastContactedDates = {};

    // Auth listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        console.log('✅ Authenticated:', user.email);
        isAuthReady = true;
        loadContacts();
      } else {
        console.log('⚠️ Not authenticated');
        isAuthReady = true;
        loadContacts();
      }
    });

    // Load all contacts from all accounts
    async function loadContacts() {
      try {
        console.log('📞 Loading all contacts...');

        // Load all leads
        const leadsRef = ref(db, 'hccrm/leads');
        const leadsSnapshot = await get(leadsRef);

        if (!leadsSnapshot.exists()) {
          renderContactsTable();
          return;
        }

        const leads = leadsSnapshot.val();
        const contactsArray = [];

        // Extract all contacts from all accounts
        Object.entries(leads).forEach(([accountId, lead]) => {
          const accountName = lead.organization?.name || 'Unknown Company';
          const contacts = lead.contacts || [];

          contacts.forEach((contact, index) => {
            const contactId = contact.email ? btoa(contact.email).replace(/=/g, '') : `contact-${accountId}-${index}`;
            
            contactsArray.push({
              id: contactId,
              accountId: accountId,
              accountName: accountName,
              firstName: contact.firstName || '',
              lastName: contact.lastName || '',
              fullName: `${contact.firstName || ''} ${contact.lastName || ''}`.trim(),
              title: contact.title || 'No title',
              email: contact.email || '',
              phone: contact.workphone || contact.phone || '',
              linkedin: contact.linkedin || '',
              isMainContact: contact.isMainContact || false,
              lastContacted: null // Will be populated from phone_activities
            });
          });
        });

        console.log(`✅ Loaded ${contactsArray.length} contacts from ${Object.keys(leads).length} accounts`);

        // Load last contacted dates from phone_activities
        await loadLastContactedDates(contactsArray);

        allContacts = contactsArray;
        filteredContacts = [...allContacts];
        
        populateFilters();
        updateStats();
        renderContactsTable();

      } catch (error) {
        console.error('❌ Error loading contacts:', error);
        document.getElementById('contactsTableContainer').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Error loading contacts</p>
          </div>
        `;
      }
    }

    // Load last contacted dates from Firestore phone_activities
    async function loadLastContactedDates(contacts) {
      try {
        console.log('📅 Loading last contacted dates from phone_activities...');

        // Get all phone activities with status=completed
        const activitiesRef = collection(dbFS, 'phone_activities');
        const completedQuery = query(activitiesRef, where('status', '==', 'completed'));
        const activitiesSnapshot = await getDocs(completedQuery);

        const contactDateMap = {};

        activitiesSnapshot.forEach(doc => {
          const activity = doc.data();
          const completedAt = activity.completedAt;
          const email = activity.email;
          const phone = activity.phone;

          if (completedAt) {
            const date = new Date(completedAt);

            // Map by email
            if (email) {
              const emailKey = email.toLowerCase();
              if (!contactDateMap[emailKey] || date > contactDateMap[emailKey]) {
                contactDateMap[emailKey] = date;
              }
            }

            // Map by phone
            if (phone) {
              const phoneKey = phone.replace(/\D/g, '');
              if (!contactDateMap[phoneKey] || date > contactDateMap[phoneKey]) {
                contactDateMap[phoneKey] = date;
              }
            }
          }
        });

        // Update contacts with last contacted dates
        contacts.forEach(contact => {
          let lastDate = null;

          // Check by email
          if (contact.email) {
            const emailKey = contact.email.toLowerCase();
            if (contactDateMap[emailKey]) {
              lastDate = contactDateMap[emailKey];
            }
          }

          // Check by phone
          if (contact.phone) {
            const phoneKey = contact.phone.replace(/\D/g, '');
            if (contactDateMap[phoneKey] && (!lastDate || contactDateMap[phoneKey] > lastDate)) {
              lastDate = contactDateMap[phoneKey];
            }
          }

          contact.lastContacted = lastDate;
        });

        console.log(`✅ Loaded last contacted dates for ${Object.keys(contactDateMap).length} unique contacts`);

      } catch (error) {
        console.error('⚠️ Error loading last contacted dates:', error);
        // Continue without dates
      }
    }

    // Populate filter dropdowns
    function populateFilters() {
      // Populate companies
      const companies = [...new Set(allContacts.map(c => c.accountName))].sort();
      const companyFilter = document.getElementById('companyFilter');
      companyFilter.innerHTML = '<option value="">All Companies</option>' + 
        companies.map(company => `<option value="${escapeHtml(company)}">${escapeHtml(company)}</option>`).join('');
    }

    // Update stats
    function updateStats() {
      const total = allContacts.length;
      const mainContacts = allContacts.filter(c => c.isMainContact).length;
      
      const oneWeekAgo = new Date();
      oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
      const thisWeek = allContacts.filter(c => c.lastContacted && c.lastContacted >= oneWeekAgo).length;
      
      const neverContacted = allContacts.filter(c => !c.lastContacted).length;

      document.getElementById('statTotalContacts').textContent = total;
      document.getElementById('statMainContacts').textContent = mainContacts;
      document.getElementById('statThisWeek').textContent = thisWeek;
      document.getElementById('statNeverContacted').textContent = neverContacted;
    }

    // Render contacts table
    function renderContactsTable() {
      const container = document.getElementById('contactsTableContainer');
      
      if (filteredContacts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-users"></i>
            <p>No contacts found</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <table class="contacts-table">
          <thead>
            <tr>
              <th onclick="sortTable('name')">
                Contact Name <i class="fas fa-sort"></i>
              </th>
              <th onclick="sortTable('title')">
                Title <i class="fas fa-sort"></i>
              </th>
              <th onclick="sortTable('company')">
                Company <i class="fas fa-sort"></i>
              </th>
              <th onclick="sortTable('email')">
                Email <i class="fas fa-sort"></i>
              </th>
              <th onclick="sortTable('lastContacted')">
                Last Contacted <i class="fas fa-sort"></i>
              </th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filteredContacts.map(contact => `
              <tr onclick="viewContact('${contact.id}', '${contact.accountId}')">
                <td>
                  <div class="contact-name">
                    <i class="fas fa-user"></i>
                    ${escapeHtml(contact.fullName || 'Unknown')}
                    ${contact.isMainContact ? '<span class="main-contact-badge">Main</span>' : ''}
                  </div>
                </td>
                <td>${escapeHtml(contact.title)}</td>
                <td>
                  <a href="account-detail.html?id=${contact.accountId}" 
                     class="company-link" 
                     onclick="event.stopPropagation()">
                    ${escapeHtml(contact.accountName)}
                  </a>
                </td>
                <td>
                  ${contact.email ? `<a href="mailto:${escapeHtml(contact.email)}" onclick="event.stopPropagation()">${escapeHtml(contact.email)}</a>` : '-'}
                </td>
                <td>${formatLastContacted(contact.lastContacted)}</td>
                <td onclick="event.stopPropagation()">
                  <button class="action-btn" onclick="viewContact('${contact.id}', '${contact.accountId}')">
                    <i class="fas fa-eye"></i> View
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Format last contacted date
    function formatLastContacted(date) {
      if (!date) {
        return '<span class="date-never">Never</span>';
      }

      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      let formattedDate = date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });

      if (days === 0) {
        return `<span class="date-recent">Today</span>`;
      } else if (days === 1) {
        return `<span class="date-recent">Yesterday</span>`;
      } else if (days < 7) {
        return `<span class="date-recent">${days} days ago</span>`;
      } else if (days < 30) {
        return `<span>${formattedDate}</span>`;
      } else {
        return `<span class="date-old">${formattedDate}</span>`;
      }
    }

    // Apply filters
    window.applyFilters = function() {
      const searchTerm = document.getElementById('contactSearch').value.toLowerCase();
      const companyFilter = document.getElementById('companyFilter').value;
      const lastContactedFilter = document.getElementById('lastContactedFilter').value;
      const typeFilter = document.getElementById('typeFilter').value;

      filteredContacts = allContacts.filter(contact => {
        // Search
        const matchesSearch = !searchTerm || 
          contact.fullName.toLowerCase().includes(searchTerm) ||
          contact.email.toLowerCase().includes(searchTerm) ||
          contact.accountName.toLowerCase().includes(searchTerm) ||
          contact.title.toLowerCase().includes(searchTerm);

        // Company filter
        const matchesCompany = !companyFilter || contact.accountName === companyFilter;

        // Last contacted filter
        let matchesLastContacted = true;
        if (lastContactedFilter === 'never') {
          matchesLastContacted = !contact.lastContacted;
        } else if (lastContactedFilter) {
          const days = parseInt(lastContactedFilter);
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - days);
          matchesLastContacted = contact.lastContacted && contact.lastContacted >= cutoffDate;
        }

        // Type filter
        let matchesType = true;
        if (typeFilter === 'main') {
          matchesType = contact.isMainContact;
        } else if (typeFilter === 'other') {
          matchesType = !contact.isMainContact;
        }

        return matchesSearch && matchesCompany && matchesLastContacted && matchesType;
      });

      renderContactsTable();
    };

    // Sort table
    let sortDirection = {};
    window.sortTable = function(column) {
      const direction = sortDirection[column] === 'asc' ? 'desc' : 'asc';
      sortDirection[column] = direction;

      filteredContacts.sort((a, b) => {
        let valA, valB;

        switch (column) {
          case 'name':
            valA = a.fullName.toLowerCase();
            valB = b.fullName.toLowerCase();
            break;
          case 'title':
            valA = a.title.toLowerCase();
            valB = b.title.toLowerCase();
            break;
          case 'company':
            valA = a.accountName.toLowerCase();
            valB = b.accountName.toLowerCase();
            break;
          case 'email':
            valA = a.email.toLowerCase();
            valB = b.email.toLowerCase();
            break;
          case 'lastContacted':
            valA = a.lastContacted ? a.lastContacted.getTime() : 0;
            valB = b.lastContacted ? b.lastContacted.getTime() : 0;
            break;
          default:
            return 0;
        }

        if (valA < valB) return direction === 'asc' ? -1 : 1;
        if (valA > valB) return direction === 'asc' ? 1 : -1;
        return 0;
      });

      renderContactsTable();
    };

    // View contact
    window.viewContact = function(contactId, accountId) {
      window.location.href = `contact-detail.html?id=${contactId}&account=${accountId}`;
    };

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
