<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightmare Night - Escape the Darkness</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Creepster', cursive;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            color: #ff6b6b;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .game-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }

        .game-title {
            font-family: 'Nosifer', cursive;
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            margin-bottom: 10px;
            animation: flickerTitle 2s infinite alternate;
        }

        @keyframes flickerTitle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #ff6b6b;
        }

        .stat {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .game-area {
            position: absolute;
            top: 120px;
            left: 0;
            width: 100%;
            height: calc(100% - 120px);
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(255, 140, 0, 0.05) 0%, transparent 50%);
            overflow: hidden;
        }

        .character {
            position: absolute;
            width: 40px;
            height: 40px;
            transition: all 0.2s ease;
            cursor: pointer;
            z-index: 10;
        }

        .trick-or-treater {
            background: linear-gradient(45deg, #ffa500 0%, #ff8c00 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            border: 3px solid #ff6b6b;
            animation: pulse 1s infinite;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.8);
        }

        .trick-or-treater::before {
            content: '🎃';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            text-shadow: 0 0 10px #ff6b6b;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .enemy {
            animation: float 2s ease-in-out infinite;
        }

        .bat {
            background: #2c0e2c;
            border-radius: 50% 10% 50% 10%;
            border: 2px solid #8b008b;
            box-shadow: 0 0 20px rgba(139, 0, 139, 0.8);
            position: relative;
        }

        .bat::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 15px;
            background: linear-gradient(45deg, #4a0e4a 0%, #2c0e2c 100%);
            border-radius: 50% 50% 10% 10%;
            box-shadow: 
                -15px 0 0 -5px #4a0e4a,
                15px 0 0 -5px #4a0e4a,
                0 0 15px rgba(139, 0, 139, 0.8);
        }

        .bat::after {
            content: '🦇';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            text-shadow: 0 0 10px #8b008b;
        }

        .witch {
            background: #0f4c0f;
            border-radius: 50%;
            border: 2px solid #32cd32;
            box-shadow: 0 0 20px rgba(50, 205, 50, 0.8);
            position: relative;
        }

        .witch::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 15px solid #0f4c0f;
            box-shadow: 0 0 10px rgba(50, 205, 50, 0.8);
        }

        .witch::after {
            content: '🧙‍♀️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            text-shadow: 0 0 10px #32cd32;
        }

        .zombie {
            background: linear-gradient(45deg, #2e2e2e 0%, #4a4a4a 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            border: 2px solid #696969;
            box-shadow: 0 0 20px rgba(105, 105, 105, 0.8);
            position: relative;
        }

        .zombie::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 8px;
            width: 6px;
            height: 6px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 
                16px 0 0 #ff0000,
                8px 8px 0 #ff0000,
                0 0 10px rgba(255, 0, 0, 0.8);
        }

        .zombie::after {
            content: '🧟';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            text-shadow: 0 0 10px #696969;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b6b;
            border-radius: 50%;
            pointer-events: none;
            animation: particle 2s linear infinite;
        }

        @keyframes particle {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ff0000;
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #ff0000;
            text-align: center;
            font-size: 2rem;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            z-index: 1000;
            display: none;
        }

        .restart-btn {
            background: linear-gradient(45deg, #ff0000 0%, #8b0000 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Creepster', cursive;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .restart-btn:hover {
            background: linear-gradient(45deg, #8b0000 0%, #ff0000 100%);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #ff6b6b;
            font-size: 1rem;
            text-shadow: 0 0 10px #ff6b6b;
            z-index: 100;
        }

        .selected {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(255, 165, 0, 1) !important;
        }

        .lightning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            opacity: 0;
            z-index: 50;
        }

        .lightning.flash {
            opacity: 1;
            animation: lightning 0.2s ease-out;
        }

        @keyframes lightning {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .fog {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, rgba(128, 128, 128, 0.3) 0%, transparent 100%);
            pointer-events: none;
            animation: fogMove 10s linear infinite;
        }

        @keyframes fogMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 2rem;
            }
            
            .game-stats {
                font-size: 1rem;
                gap: 15px;
            }
            
            .stat {
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">NIGHTMARE NIGHT</h1>
            <div class="game-stats">
                <div class="stat">Score: <span id="score">0</span></div>
                <div class="stat">Lives: <span id="lives">3</span></div>
                <div class="stat">Level: <span id="level">1</span></div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="lightning" id="lightning"></div>
            <div class="fog"></div>
        </div>

        <div class="instructions">
            Click on trick-or-treaters to select them, then click where you want them to go!<br>
            Or use ARROW KEYS to move the selected trick-or-treater. Press SPACE to select next character.
        </div>

        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p>The darkness has consumed you...</p>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">Rise from the Dead</button>
        </div>
    </div>

    <script>
        class Game {
            constructor() {
                this.gameArea = document.getElementById('gameArea');
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.isGameOver = false;
                this.characters = [];
                this.enemies = [];
                this.selectedCharacter = null;
                this.lastSpawn = 0;
                this.spawnRate = 3000; // milliseconds
                this.enemySpeed = 0.8;
                this.gameAreaWidth = 0;
                this.gameAreaHeight = 0;
                
                this.init();
            }

            init() {
                this.updateGameAreaBounds();
                this.spawnTrickOrTreaters();
                this.bindEvents();
                this.gameLoop();
            }

            updateGameAreaBounds() {
                const rect = this.gameArea.getBoundingClientRect();
                this.gameAreaWidth = rect.width;
                this.gameAreaHeight = rect.height;
            }

            spawnTrickOrTreaters() {
                for (let i = 0; i < 3; i++) {
                    this.createTrickOrTreater();
                }
                // Select first character by default
                if (this.characters.length > 0) {
                    this.selectCharacter(this.characters[0]);
                }
            }

            createTrickOrTreater() {
                const character = document.createElement('div');
                character.className = 'character trick-or-treater';
                
                const x = Math.random() * (this.gameAreaWidth - 60) + 30;
                const y = Math.random() * (this.gameAreaHeight - 60) + 30;
                
                character.style.left = x + 'px';
                character.style.top = y + 'px';
                
                const characterData = {
                    element: character,
                    x: x,
                    y: y,
                    targetX: x,
                    targetY: y,
                    speed: 3
                };
                
                this.characters.push(characterData);
                this.gameArea.appendChild(character);
                
                // Add click event to select character
                character.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.selectCharacter(characterData);
                });
            }

            selectCharacter(character) {
                // Remove selection from all characters
                this.characters.forEach(char => {
                    char.element.classList.remove('selected');
                });
                
                // Select new character
                this.selectedCharacter = character;
                character.element.classList.add('selected');
                this.createParticles(character.x, character.y);
            }

            moveSelectedCharacter(targetX, targetY) {
                if (this.selectedCharacter) {
                    // Keep target in bounds
                    targetX = Math.max(20, Math.min(this.gameAreaWidth - 20, targetX));
                    targetY = Math.max(20, Math.min(this.gameAreaHeight - 20, targetY));
                    
                    this.selectedCharacter.targetX = targetX;
                    this.selectedCharacter.targetY = targetY;
                    this.createParticles(this.selectedCharacter.x, this.selectedCharacter.y);
                }
            }

            createEnemy() {
                const enemyTypes = ['bat', 'witch', 'zombie'];
                const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                
                const enemy = document.createElement('div');
                enemy.className = `character enemy ${type}`;
                
                // Spawn from edges
                const side = Math.floor(Math.random() * 4);
                let x, y;
                
                switch(side) {
                    case 0: // top
                        x = Math.random() * this.gameAreaWidth;
                        y = -40;
                        break;
                    case 1: // right
                        x = this.gameAreaWidth + 40;
                        y = Math.random() * this.gameAreaHeight;
                        break;
                    case 2: // bottom
                        x = Math.random() * this.gameAreaWidth;
                        y = this.gameAreaHeight + 40;
                        break;
                    case 3: // left
                        x = -40;
                        y = Math.random() * this.gameAreaHeight;
                        break;
                }
                
                enemy.style.left = x + 'px';
                enemy.style.top = y + 'px';
                
                const enemyData = {
                    element: enemy,
                    x: x,
                    y: y,
                    type: type,
                    speed: this.enemySpeed * (0.8 + Math.random() * 0.4)
                };
                
                this.enemies.push(enemyData);
                this.gameArea.appendChild(enemy);
            }

            updateCharacters() {
                this.characters.forEach(character => {
                    const dx = character.targetX - character.x;
                    const dy = character.targetY - character.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance > 2) {
                        character.x += (dx / distance) * character.speed;
                        character.y += (dy / distance) * character.speed;
                        
                        character.element.style.left = character.x + 'px';
                        character.element.style.top = character.y + 'px';
                    }
                });
            }

            updateEnemies() {
                this.enemies.forEach((enemy, index) => {
                    // Find nearest trick-or-treater
                    let nearestChar = null;
                    let nearestDistance = Infinity;
                    
                    this.characters.forEach(character => {
                        const dx = character.x - enemy.x;
                        const dy = character.y - enemy.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < nearestDistance) {
                            nearestDistance = distance;
                            nearestChar = character;
                        }
                    });
                    
                    if (nearestChar) {
                        const dx = nearestChar.x - enemy.x;
                        const dy = nearestChar.y - enemy.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance > 0) {
                            enemy.x += (dx / distance) * enemy.speed;
                            enemy.y += (dy / distance) * enemy.speed;
                            
                            enemy.element.style.left = enemy.x + 'px';
                            enemy.element.style.top = enemy.y + 'px';
                        }
                    }
                    
                    // Remove if too far out of bounds
                    if (enemy.x < -200 || enemy.x > this.gameAreaWidth + 200 ||
                        enemy.y < -200 || enemy.y > this.gameAreaHeight + 200) {
                        enemy.element.remove();
                        this.enemies.splice(index, 1);
                    }
                });
            }

            checkCollisions() {
                this.characters.forEach((character, charIndex) => {
                    this.enemies.forEach((enemy, enemyIndex) => {
                        const dx = character.x - enemy.x;
                        const dy = character.y - enemy.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 40) {
                            // Collision detected
                            this.createExplosion(character.x, character.y);
                            
                            // Remove character
                            character.element.remove();
                            this.characters.splice(charIndex, 1);
                            
                            // If this was the selected character, select another
                            if (character === this.selectedCharacter) {
                                this.selectedCharacter = null;
                                if (this.characters.length > 0) {
                                    this.selectCharacter(this.characters[0]);
                                }
                            }
                            
                            this.lives--;
                            this.updateDisplay();
                            
                            if (this.lives <= 0 || this.characters.length === 0) {
                                this.gameOver();
                            }
                        }
                    });
                });
            }

            createParticles(x, y) {
                for (let i = 0; i < 8; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = x + Math.random() * 30 - 15 + 'px';
                    particle.style.top = y + Math.random() * 30 - 15 + 'px';
                    particle.style.background = '#ffa500';
                    this.gameArea.appendChild(particle);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 2000);
                }
            }

            createExplosion(x, y) {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = x + Math.random() * 60 - 30 + 'px';
                    particle.style.top = y + Math.random() * 60 - 30 + 'px';
                    particle.style.background = '#ff0000';
                    particle.style.width = '8px';
                    particle.style.height = '8px';
                    this.gameArea.appendChild(particle);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 2000);
                }
            }

            createLightningEffect() {
                if (Math.random() < 0.005) {
                    const lightning = document.getElementById('lightning');
                    lightning.classList.add('flash');
                    setTimeout(() => lightning.classList.remove('flash'), 200);
                }
            }

            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('level').textContent = this.level;
            }

            gameOver() {
                this.isGameOver = true;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'block';
            }

            gameLoop() {
                if (!this.isGameOver) {
                    const currentTime = Date.now();
                    
                    // Spawn enemies
                    if (currentTime - this.lastSpawn > this.spawnRate) {
                        this.createEnemy();
                        this.lastSpawn = currentTime;
                        this.score += 10;
                        
                        // Increase difficulty
                        if (this.score % 200 === 0) {
                            this.level++;
                            this.spawnRate = Math.max(800, this.spawnRate - 150);
                            this.enemySpeed += 0.15;
                        }
                    }
                    
                    this.updateCharacters();
                    this.updateEnemies();
                    this.checkCollisions();
                    this.createLightningEffect();
                    this.updateDisplay();
                    
                    requestAnimationFrame(() => this.gameLoop());
                }
            }

            bindEvents() {
                // Mouse click to move character
                this.gameArea.addEventListener('click', (e) => {
                    const rect = this.gameArea.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    this.moveSelectedCharacter(x, y);
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (this.isGameOver) return;
                    
                    const moveSpeed = 15;
                    
                    switch(e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            if (this.selectedCharacter) {
                                this.moveSelectedCharacter(this.selectedCharacter.targetX, this.selectedCharacter.targetY - moveSpeed);
                            }
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            if (this.selectedCharacter) {
                                this.moveSelectedCharacter(this.selectedCharacter.targetX, this.selectedCharacter.targetY + moveSpeed);
                            }
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            if (this.selectedCharacter) {
                                this.moveSelectedCharacter(this.selectedCharacter.targetX - moveSpeed, this.selectedCharacter.targetY);
                            }
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            if (this.selectedCharacter) {
                                this.moveSelectedCharacter(this.selectedCharacter.targetX + moveSpeed, this.selectedCharacter.targetY);
                            }
                            break;
                        case ' ':
                            e.preventDefault();
                            // Select next character
                            if (this.characters.length > 0) {
                                const currentIndex = this.characters.indexOf(this.selectedCharacter);
                                const nextIndex = (currentIndex + 1) % this.characters.length;
                                this.selectCharacter(this.characters[nextIndex]);
                            }
                            break;
                    }
                });

                // Resize handling
                window.addEventListener('resize', () => {
                    this.updateGameAreaBounds();
                });
            }
        }

        let game;

        function startGame() {
            game = new Game();
        }

        function restartGame() {
            // Clear existing game
            const gameArea = document.getElementById('gameArea');
            const characters = gameArea.querySelectorAll('.character');
            characters.forEach(char => char.remove());
            
            const particles = gameArea.querySelectorAll('.particle');
            particles.forEach(particle => particle.remove());
            
            document.getElementById('gameOver').style.display = 'none';
            
            // Start new game
            startGame();
        }

        // Start the game when page loads
        window.addEventListener('load', startGame);
    </script>
</body>
</html>
