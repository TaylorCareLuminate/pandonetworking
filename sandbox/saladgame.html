<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salad Creator Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .game-title {
            text-align: center;
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .ingredients-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-height: 600px;
            overflow-y: auto;
        }

        .ingredients-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .ingredient {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            min-height: 50px;
        }

        .ingredient:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .ingredient.selected {
            border-color: #3498db;
            background: #e3f2fd;
        }

        .ingredient-icon {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        .normal-item .ingredient-icon {
            background: #4caf50;
            color: white;
        }

        .strange-item .ingredient-icon {
            background: #ff5722;
            color: white;
        }

        .metal-item .ingredient-icon {
            background: #607d8b;
            color: white;
        }

        .salad-bowl {
            background: linear-gradient(145deg, #8b4513, #a0522d);
            border-radius: 50%;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 10px 20px rgba(0, 0, 0, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.2);
            border: 8px solid #654321;
        }

        .bowl-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 80%;
            height: 80%;
        }

        .bowl-item {
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .controls {
            text-align: center;
            margin-top: 20px;
        }

        .serve-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .serve-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .serve-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .customer-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .customer-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .customer-display {
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .customer-avatar {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .customer-message {
            font-size: 1.1em;
            color: #2c3e50;
            text-align: center;
            line-height: 1.4;
        }

        .score-display {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            color: #2c3e50;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-avatar {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .modal-customer-label {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #7f8c8d;
            font-style: italic;
        }

        .modal-message {
            font-size: 1.2em;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #34495e;
        }

        .modal-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .reset-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .start-btn {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .customer-silhouette {
            font-size: 6em;
            margin-bottom: 15px;
            color: #666;
            opacity: 0.5;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .customer-silhouette.revealed {
            color: #000;
            opacity: 1;
            text-shadow: none;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🍽️ Salad Creator Game 🥗</h1>
        
        <div class="game-area">
            <div class="ingredients-panel">
                <h2 class="ingredients-title">Ingredients</h2>
                <div id="ingredients-list">
                    <!-- Ingredients will be populated by JavaScript -->
                </div>
            </div>

            <div class="salad-area">
                <div class="salad-bowl">
                    <div class="bowl-content" id="bowl-content">
                        <!-- Bowl items will be added here -->
                    </div>
                </div>
                
                <div class="controls">
                    <button class="start-btn" id="start-btn">Start New Salad! 🥗</button>
                    <button class="serve-btn" id="serve-btn" disabled>Serve Salad! 🍽️</button>
                    <br>
                    <button class="reset-btn" id="reset-btn">Reset Bowl</button>
                    <button onclick="renderIngredients(); console.log('Manual render triggered');" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; margin-top: 10px; border-radius: 5px;">Debug: Render Ingredients</button>
                </div>
            </div>

            <div class="customer-panel">
                <h2 class="customer-title">Customer</h2>
                            <div class="customer-display" id="customer-display">
                <div class="customer-silhouette" id="customer-silhouette">👤</div>
                <div class="customer-message">Click "Start New Salad" to see who your customer is!</div>
                <div class="customer-riddle" id="customer-riddle" style="display: none; font-style: italic; color: #7f8c8d; margin-top: 10px;"></div>
            </div>
                <div class="score-display">
                    <div>Score: <span id="score">0</span></div>
                    <div>Correct: <span id="correct">0</span> | Wrong: <span id="wrong">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for customer reactions -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <div class="modal-customer-label" id="modal-customer-label">Customer</div>
            <div class="modal-avatar" id="modal-avatar">👤</div>
            <div class="modal-title" id="modal-title">Customer Reaction</div>
            <div class="modal-message" id="modal-message">Loading...</div>
            <button class="modal-btn" id="modal-btn">Continue</button>
        </div>
    </div>

    <script>
        // Game state
        let selectedIngredients = [];
        let currentCustomer = null;
        let score = 0;
        let correct = 0;
        let wrong = 0;
        let gameStarted = false;

        // Ingredients data
        const ingredients = [
            // Normal salad items
            { name: "Lettuce", icon: "🥬", type: "normal" },
            { name: "Tomato", icon: "🍅", type: "normal" },
            { name: "Cucumber", icon: "🥒", type: "normal" },
            { name: "Carrot", icon: "🥕", type: "normal" },
            { name: "Onion", icon: "🧅", type: "normal" },
            { name: "Olive", icon: "🫒", type: "normal" },
            { name: "Cheese", icon: "🧀", type: "normal" },
            { name: "Avocado", icon: "🥑", type: "normal" },
            { name: "Bell Pepper", icon: "🫑", type: "normal" },
            { name: "Mushroom", icon: "🍄", type: "normal" },
            
            // Metal items for robots
            { name: "Car Engine", icon: "🔧", type: "metal" },
            { name: "Screw", icon: "🔩", type: "metal" },
            { name: "Gear", icon: "⚙️", type: "metal" },
            { name: "Bolt", icon: "🔩", type: "metal" },
            { name: "Circuit Board", icon: "💻", type: "metal" },
            { name: "Wire", icon: "🔌", type: "metal" },
            { name: "Battery", icon: "🔋", type: "metal" },
            { name: "Metal Plate", icon: "🛡️", type: "metal" },
            
            // Strange items for monsters
            { name: "Rubber Duck", icon: "🦆", type: "strange" },
            { name: "Mosquito", icon: "🦟", type: "strange" },
            { name: "Roadkill", icon: "🦨", type: "strange" },
            { name: "Spider", icon: "🕷️", type: "strange" },
            { name: "Worm", icon: "🪱", type: "strange" },
            { name: "Rat", icon: "🐀", type: "strange" },
            { name: "Cockroach", icon: "🪳", type: "strange" },
            { name: "Dead Fish", icon: "🐟", type: "strange" },
            { name: "Mold", icon: "🍃", type: "strange" },
            { name: "Dirt", icon: "🌱", type: "strange" }
        ];

        // Customer data
        const customers = [
            {
                name: "Human",
                avatar: "👤",
                type: "human",
                likes: "normal",
                riddle: "I seek the green and fresh, the pure and clean. What grows from earth and sun, not from machine.",
                correctMessage: "Mmm, this is delicious! A perfect healthy salad with fresh vegetables. Exactly what I was craving! 😋",
                wrongMessageHuman: "Eww! What is this? I can't eat this! There are bugs and disgusting things in my salad! 🤢",
                wrongMessageRobot: "Oh no! I ate metal parts! I'm being rushed to the hospital! My stomach can't handle this! 🏥",
                correctReaction: "😋",
                wrongReaction: "🤢"
            },
            {
                name: "Robot",
                avatar: "🤖",
                type: "robot",
                likes: "metal",
                riddle: "I am not flesh, I am not bone. I seek the cold and hard, the mechanical tone.",
                correctMessage: "Beep boop! Excellent choice of ingredients! The metal components provide optimal lubrication for my circuits. Delicious! ⚡",
                wrongMessageHuman: "I... I feel something strange. These organic ingredients... they make me question my existence. Am I becoming... human? *beep* Error: Identity crisis detected! 🤖",
                wrongMessageMonster: "Error 404: Salad not found! This organic matter is incompatible with my digestive system. I need metal! 🤖",
                correctReaction: "⚡",
                wrongReaction: "🤖"
            },
            {
                name: "Monster",
                avatar: "👹",
                type: "monster",
                likes: "strange",
                riddle: "I crave the dark, the twisted, the foul. Give me what others find repulsive, and I'll howl.",
                correctMessage: "ROAR! This is the most disgusting thing I've ever tasted! I love it! The bugs and roadkill are perfect! 😈",
                wrongMessageHuman: "BORING! This healthy salad is too clean and fresh! I want something disgusting and weird! Give me bugs! 😤",
                wrongMessageRobot: "ROAR! Metal parts! This is even better than bugs! I love the taste of gears and circuits! 😈",
                correctReaction: "😈",
                wrongReaction: "😤"
            }
        ];

        // Initialize the game
        function initGame() {
            console.log('Initializing game...');
            renderIngredients();
            updateScore();
            resetBowl();
            console.log('Game initialized');
        }

        // Set up event listeners
        function setupEventListeners() {
            console.log('Setting up event listeners...');
            
            const startBtn = document.getElementById('start-btn');
            const serveBtn = document.getElementById('serve-btn');
            const resetBtn = document.getElementById('reset-btn');
            const modalBtn = document.getElementById('modal-btn');
            
            if (startBtn) {
                startBtn.onclick = startNewSalad;
                console.log('Start button listener set');
            } else {
                console.error('Start button not found');
            }
            
            if (serveBtn) {
                serveBtn.onclick = function() {
                    console.log('Serve button clicked!');
                    serveSalad();
                };
                console.log('Serve button listener set');
            } else {
                console.error('Serve button not found');
            }
            
            if (resetBtn) {
                resetBtn.onclick = resetBowl;
                console.log('Reset button listener set');
            } else {
                console.error('Reset button not found');
            }
            
            if (modalBtn) {
                modalBtn.onclick = () => {
                    document.getElementById('result-modal').style.display = 'none';
                    resetBowl();
                };
                console.log('Modal button listener set');
            } else {
                console.error('Modal button not found');
            }

            // Close modal when clicking outside
            const modal = document.getElementById('result-modal');
            if (modal) {
                modal.onclick = (e) => {
                    if (e.target.id === 'result-modal') {
                        e.target.style.display = 'none';
                        resetBowl();
                    }
                };
                console.log('Modal outside click listener set');
            }
            
            console.log('Event listeners set up');
        }

        // Render ingredients list
        function renderIngredients() {
            console.log('Rendering ingredients...');
            const container = document.getElementById('ingredients-list');
            if (!container) {
                console.error('Ingredients container not found!');
                return;
            }
            console.log('Found ingredients container:', container);
            
            container.innerHTML = '';

            ingredients.forEach((ingredient, index) => {
                const div = document.createElement('div');
                div.className = `ingredient ${ingredient.type}-item`;
                div.innerHTML = `
                    <div class="ingredient-icon">${ingredient.icon}</div>
                    <span>${ingredient.name}</span>
                `;
                div.onclick = () => addIngredient(ingredient);
                container.appendChild(div);
            });
            console.log(`Rendered ${ingredients.length} ingredients`);
        }

        // Add ingredient to bowl
        function addIngredient(ingredient) {
            if (!gameStarted) {
                alert('Please start a new salad first!');
                return;
            }
            
            if (selectedIngredients.length >= 4) {
                alert('Bowl is full! Maximum 4 ingredients allowed.');
                return;
            }

            selectedIngredients.push(ingredient);
            updateBowl();
            updateServeButton();
        }

        // Update bowl display
        function updateBowl() {
            const bowl = document.getElementById('bowl-content');
            bowl.innerHTML = '';

            selectedIngredients.forEach(ingredient => {
                const div = document.createElement('div');
                div.className = 'bowl-item';
                div.innerHTML = ingredient.icon;
                bowl.appendChild(div);
            });
        }

        // Update serve button state
        function updateServeButton() {
            const serveBtn = document.getElementById('serve-btn');
            serveBtn.disabled = selectedIngredients.length === 0;
        }

        // Reset bowl
        function resetBowl() {
            selectedIngredients = [];
            updateBowl();
            updateServeButton();
            hideCustomer();
            gameStarted = false;
        }

        // Start new salad
        function startNewSalad() {
            currentCustomer = customers[Math.floor(Math.random() * customers.length)];
            showCustomer(currentCustomer);
            gameStarted = true;
            selectedIngredients = [];
            updateBowl();
            updateServeButton();
        }

        // Hide customer display
        function hideCustomer() {
            const display = document.getElementById('customer-display');
            display.innerHTML = `
                <div class="customer-silhouette" id="customer-silhouette">❓</div>
                <div class="customer-message">Click "Start New Salad" to see who your customer is!</div>
                <div class="customer-riddle" id="customer-riddle" style="display: none; font-style: italic; color: #7f8c8d; margin-top: 10px;"></div>
            `;
        }

        // Show customer
        function showCustomer(customer) {
            const display = document.getElementById('customer-display');
            display.innerHTML = `
                <div class="customer-silhouette revealed" id="customer-silhouette">${customer.avatar}</div>
                <div class="customer-message">${customer.name}</div>
                <div class="customer-riddle" id="customer-riddle" style="display: block; font-style: italic; color: #7f8c8d; margin-top: 10px;">"${customer.riddle}"</div>
            `;
        }

        // Show result modal
        function showResultModal(customer, isCorrect, reactionType) {
            const modal = document.getElementById('result-modal');
            const customerLabel = document.getElementById('modal-customer-label');
            const avatar = document.getElementById('modal-avatar');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');

            let modalTitle, modalMessage, modalReaction;

            if (isCorrect) {
                modalTitle = 'Perfect Match!';
                modalMessage = customer.correctMessage;
                modalReaction = customer.correctReaction;
            } else {
                modalTitle = 'Wrong Ingredients!';
                modalReaction = customer.wrongReaction;
                
                if (reactionType === "wrongHuman") {
                    modalMessage = customer.wrongMessageHuman;
                } else if (reactionType === "wrongRobot") {
                    modalMessage = customer.wrongMessageRobot;
                } else if (reactionType === "wrongMonster") {
                    modalMessage = customer.wrongMessageMonster;
                } else {
                    modalMessage = customer.wrongMessageHuman; // fallback
                }
            }

            customerLabel.textContent = customer.name;
            avatar.textContent = modalReaction;
            title.textContent = modalTitle;
            message.textContent = modalMessage;

            modal.style.display = 'block';
        }

        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('correct').textContent = correct;
            document.getElementById('wrong').textContent = wrong;
        }

        // Serve salad
        function serveSalad() {
            console.log('Serve salad called');
            if (selectedIngredients.length === 0) {
                console.log('No ingredients selected');
                return;
            }

            if (!currentCustomer) {
                console.log('No current customer');
                return;
            }

            console.log('Current customer:', currentCustomer.name);
            console.log('Selected ingredients:', selectedIngredients);

            // Determine if the salad is correct for this customer
            const hasCorrectItems = selectedIngredients.some(item => item.type === currentCustomer.likes);
            const hasWrongItems = selectedIngredients.some(item => item.type !== currentCustomer.likes);
            
            // Check for specific wrong ingredient types
            const hasHumanItems = selectedIngredients.some(item => item.type === "normal");
            const hasRobotItems = selectedIngredients.some(item => item.type === "metal");
            const hasMonsterItems = selectedIngredients.some(item => item.type === "strange");
            
            let isCorrect = hasCorrectItems && !hasWrongItems;
            let reactionType = "correct";

            if (!isCorrect) {
                if (currentCustomer.type === "human") {
                    if (hasMonsterItems) reactionType = "wrongHuman";
                    else if (hasRobotItems) reactionType = "wrongRobot";
                } else if (currentCustomer.type === "robot") {
                    if (hasHumanItems) reactionType = "wrongHuman";
                    else if (hasMonsterItems) reactionType = "wrongMonster";
                } else if (currentCustomer.type === "monster") {
                    if (hasHumanItems) reactionType = "wrongHuman";
                    else if (hasRobotItems) reactionType = "wrongRobot";
                }
            }

            console.log('Salad result:', { isCorrect, reactionType });

            // Update score
            if (isCorrect) {
                score += 10;
                correct++;
            } else {
                wrong++;
            }

            // Show result modal
            showResultModal(currentCustomer, isCorrect, reactionType);

            updateScore();
        }

        // Initialize the game when page loads
        window.onload = function() {
            console.log('Page loaded, initializing game...');
            try {
                initGame();
                setupEventListeners(); // Set up listeners after DOM is ready
            } catch (error) {
                console.error('Error initializing game:', error);
                // Fallback: manually render ingredients
                setTimeout(() => {
                    console.log('Trying fallback ingredient rendering...');
                    renderIngredients();
                }, 1000);
            }
        };
    </script>
</body>
</html>
