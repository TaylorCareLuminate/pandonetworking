<!-- Phone Scripts Side Panel -->
<div class="script-overlay" id="scriptOverlay"></div>
<div class="phone-scripts-panel" id="phoneScriptsPanel">
  <div class="phone-scripts-header">
    <div class="phone-scripts-title">
      <i class="fas fa-phone"></i>
      Phone Scripts
    </div>
    <div class="phone-scripts-contact" id="scriptsContactInfo">
      <i class="fas fa-user"></i>
      <span id="scriptsContactName">Contact Name</span>
      <span>•</span>
      <span id="scriptsContactPhone">Phone Number</span>
    </div>
    <button class="close-scripts-panel" id="closeScriptsPanel">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <div class="script-selector">
    <div class="script-selector-title">Select Your Script:</div>
    <div class="script-tabs" id="scriptTabs">
      <!-- Script tabs will be populated by JavaScript -->
    </div>
  </div>
  
  <div class="script-content" id="scriptContent">
    <!-- Script content will be populated by JavaScript -->
  </div>
</div>
