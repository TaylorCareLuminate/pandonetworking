<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Email Send - Pivot Point Consulting (Max Hanner)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- IMMEDIATE AUTHENTICATION PROTECTION -->
    <script>
        // Hide all content immediately while authentication is being checked
        document.documentElement.style.display = 'none';
        
        // Check if user is likely authenticated (basic check - but don't redirect immediately)
        const hasRecentAuth = localStorage.getItem('firebase:authUser:AIzaSyBpsxZCSULnandhpdVLI9nvsxd3_BH4dfs:[DEFAULT]');
        
        if (!hasRecentAuth) {
            // No auth token found, but let Firebase auth.js handle the final decision
            console.log('🔍 No immediate auth token found, waiting for Firebase auth verification...');
        } else {
            // Potential auth token found
            console.log('🔍 Potential auth found, waiting for Firebase verification...');
        }
    </script>
    
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --gray: #6b7280;
            --light-blue: #eff6ff;
            --light-green: #f0fdf4;
            --light-yellow: #fffbeb;
            --light-red: #fef2f2;
            --border-radius: 8px;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f9fafb;
            color: #263238;
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border-radius: var(--border-radius);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }

        .page-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header p {
            margin: 0;
            opacity: 0.95;
            font-size: 1.1rem;
        }

        .controls-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 25px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-input, .form-select {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1e3a8a;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value.today { color: var(--danger); }
        .stat-value.tomorrow { color: var(--warning); }
        .stat-value.upcoming { color: var(--success); }
        .stat-value.total { color: var(--primary); }

        .emails-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 25px;
            margin-bottom: 30px;
        }

        .day-group {
            margin-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 25px;
        }

        .day-group:last-child {
            border-bottom: none;
        }

        .day-header {
            font-weight: 600;
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--light-blue);
            border-radius: var(--border-radius);
        }

        .day-header.today {
            background: var(--light-red);
            color: var(--danger);
        }

        .day-header.tomorrow {
            background: var(--light-yellow);
            color: var(--warning);
        }

        .email-list {
            display: grid;
            gap: 15px;
        }

        .email-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            padding: 20px;
            transition: all 0.2s;
            text-align: left;
        }

        .email-card:hover {
            box-shadow: var(--card-shadow);
            border-color: var(--primary);
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1f2937;
            margin-bottom: 5px;
            text-align: left;
        }

        .contact-details {
            color: var(--gray);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .email-content {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: var(--border-radius);
            padding: 15px;
            margin: 15px 0;
            text-align: left;
        }

        .email-subject {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1rem;
            text-align: left;
        }

        .email-body {
            color: #4b5563;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            direction: ltr;
        }

        .email-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .send-email-btn {
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .send-email-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .send-email-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .mark-not-sent-btn {
            background: var(--warning);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .mark-not-sent-btn:hover {
            background: #d97706;
            transform: translateY(-1px);
        }

        .mark-scheduled-btn {
            background: var(--secondary);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .mark-scheduled-btn:hover {
            background: #0284c7;
            transform: translateY(-1px);
        }

        .copy-email-btn {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .copy-email-btn:hover {
            background: #1e3a8a;
            transform: translateY(-1px);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.scheduled {
            background: var(--light-blue);
            color: var(--primary);
        }

        .status-badge.sent {
            background: var(--light-green);
            color: var(--success);
        }

        .status-badge.failed {
            background: var(--light-red);
            color: var(--danger);
        }

        .status-badge.not_sent {
            background: var(--light-yellow);
            color: var(--warning);
        }

        .alert {
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: var(--light-green);
            border-color: #bbf7d0;
            color: #166534;
        }

        .alert-warning {
            background: var(--light-yellow);
            border-color: #fed7aa;
            color: #92400e;
        }

        .alert-danger {
            background: var(--light-red);
            border-color: #fecaca;
            color: #dc2626;
        }

        .alert-info {
            background: var(--light-blue);
            border-color: #bfdbfe;
            color: #1d4ed8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .loading i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            padding: 15px;
            border-radius: var(--border-radius);
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info { background: var(--primary); }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .email-header {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .email-actions {
                justify-content: stretch;
            }

            .send-email-btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fas fa-paper-plane"></i>
                Manual Email Send - Pivot Point Consulting
            </h1>
            <p>Send scheduled emails for Max Hanner manually with automatic outreach tracking</p>
        </div>

        <!-- Filters and Controls -->
        <div class="controls-section">
            <div class="section-title">
                <i class="fas fa-filter"></i>
                Filters & Controls
            </div>
            
            <div class="controls-grid">
                <div class="form-group">
                    <label class="form-label">Status Filter</label>
                    <select id="statusFilter" class="form-select" onchange="applyFilters()">
                        <option value="">All Statuses</option>
                        <option value="scheduled">Scheduled</option>
                        <option value="sent">Sent</option>
                        <option value="not_sent">Not Sent</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="loadScheduledEmails()">
                    <i class="fas fa-refresh"></i>
                    Refresh Data
                </button>
                <button class="btn btn-success" onclick="markAllTodayAsSent()" id="markAllBtn" disabled>
                    <i class="fas fa-check-double"></i>
                    Mark All Today as Sent
                </button>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value today" id="todayCount">0</div>
                <div class="stat-label">Due Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value tomorrow" id="tomorrowCount">0</div>
                <div class="stat-label">Due Tomorrow</div>
            </div>
            <div class="stat-card">
                <div class="stat-value upcoming" id="upcomingCount">0</div>
                <div class="stat-label">Upcoming (7 days)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value total" id="totalCount">0</div>
                <div class="stat-label">Total Scheduled</div>
            </div>
        </div>

        <!-- Scheduled Emails -->
        <div class="emails-section">
            <div class="section-title">
                <i class="fas fa-calendar-alt"></i>
                Scheduled Emails
                <div style="margin-left: auto; font-size: 0.9rem; font-weight: normal;" id="emailsStats"></div>
            </div>
            
            <div id="emailsContainer">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading scheduled emails...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules for CLEmails (scheduled emails)
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, updateDoc, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // Import Firebase modules for HealthcareITDatabase (outreach tracking)
        import { getDatabase, ref, push, set } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        // CLEmails Firebase configuration (for scheduled emails)
        const emailFirebaseConfig = {
            apiKey: "AIzaSyDGESh2UQT4awIg9Y3kBcZPN-aaWthC1k4",
            authDomain: "clemail.firebaseapp.com",
            databaseURL: "https://clemail-default-rtdb.firebaseio.com",
            projectId: "clemail",
            storageBucket: "clemail.firebasestorage.app",
            messagingSenderId: "762477610174",
            appId: "1:762477610174:web:8547f62e6d9f3b819acaef",
            measurementId: "G-EFW8G912Y7"
        };

        // Initialize CLEmails Firebase app
        let emailApp, emailDb;
        const existingEmailApps = getApps();
        const existingEmailApp = existingEmailApps.find(a => a.name === 'clemail');

        if (existingEmailApp) {
            emailApp = existingEmailApp;
        } else {
            emailApp = initializeApp(emailFirebaseConfig, 'clemail');
        }

        emailDb = getFirestore(emailApp);

        // Global state
        let scheduledEmails = [];
        let filteredEmails = [];
        let customers = new Map();
        let campaigns = new Map();
        let bdrLeaders = new Map();

        // Wait for HealthcareITDatabase Firebase to be ready (from auth.js)
        async function waitForHealthcareDB() {
            let retryCount = 0;
            const maxRetries = 20;
            
            while ((!window.firebaseReady || !window.firebaseApp) && retryCount < maxRetries) {
                console.log(`⏳ Waiting for HealthcareITDatabase Firebase to be ready... (attempt ${retryCount + 1}/${maxRetries})`);
                await new Promise(resolve => setTimeout(resolve, 500));
                retryCount++;
            }
            
            if (!window.firebaseApp) {
                console.error("❌ HealthcareITDatabase Firebase not initialized after waiting");
                throw new Error("HealthcareITDatabase Firebase initialization timeout");
            }
            
            console.log("✅ HealthcareITDatabase Firebase is ready");
            return window.firebaseApp;
        }

        // Initialize the application
        async function initialize() {
            console.log('🚀 Initializing Manual Email Send...');
            
            try {
                // Wait for auth and load data
                await waitForHealthcareDB();
                await loadScheduledEmails();
                
                // Show the page content after successful initialization
                document.documentElement.style.display = 'block';
                console.log('✅ Initialization complete - page content shown');
            } catch (error) {
                console.error('❌ Error during initialization:', error);
                showToast('Error loading application: ' + error.message, 'error');
                // Still show the page even if there's an error
                document.documentElement.style.display = 'block';
            }
        }

        // Load scheduled emails from CLEmails Firebase
        async function loadScheduledEmails() {
            try {
                console.log('📧 Loading scheduled emails from CLEmails...');
                showLoading('Loading scheduled emails...');

                // Query scheduled emails
                const emailsSnapshot = await getDocs(
                    query(
                        collection(emailDb, 'selfsend_scheduledEmails'),
                        orderBy('scheduledDate', 'asc')
                    )
                );

                scheduledEmails = [];
                const customerIds = new Set();
                const campaignIds = new Set();
                const bdrLeaderIds = new Set();

                emailsSnapshot.forEach((doc) => {
                    const emailData = { id: doc.id, ...doc.data() };
                    
                    // Convert Firestore timestamp to Date
                    if (emailData.scheduledDate && emailData.scheduledDate.toDate) {
                        emailData.scheduledDate = emailData.scheduledDate.toDate();
                    } else if (emailData.scheduledDate && typeof emailData.scheduledDate === 'string') {
                        emailData.scheduledDate = new Date(emailData.scheduledDate);
                    }

                    scheduledEmails.push(emailData);
                    
                    // Collect unique IDs for dropdowns
                    if (emailData.customerId) customerIds.add(emailData.customerId);
                    if (emailData.campaignId) campaignIds.add(emailData.campaignId);
                    if (emailData.bdrLeaderId) bdrLeaderIds.add(emailData.bdrLeaderId);
                });

                console.log(`📊 Loaded ${scheduledEmails.length} scheduled emails`);

                // Load reference data
                await Promise.all([
                    loadCustomers(customerIds),
                    loadCampaigns(campaignIds),
                    loadBdrLeaders(bdrLeaderIds)
                ]);

                // Set default filters and display
                setDefaultFilters();
                applyFilters();
                updateStats();
                
                showToast(`Loaded ${scheduledEmails.length} scheduled emails`, 'success');

            } catch (error) {
                console.error('❌ Error loading scheduled emails:', error);
                showToast('Error loading scheduled emails: ' + error.message, 'error');
                hideLoading();
            }
        }

        // Load customers for dropdown
        async function loadCustomers(customerIds) {
            try {
                const customersSnapshot = await getDocs(collection(emailDb, 'customerList'));
                customers.clear();
                
                customersSnapshot.forEach((doc) => {
                    const customerData = { id: doc.id, ...doc.data() };
                    // Load all customers, not just ones that match customerIds
                    // This ensures dropdowns are populated even if there are data inconsistencies
                    customers.set(doc.id, customerData);
                });

                console.log(`📊 Loaded ${customers.size} customers (${customerIds.size} referenced in emails)`);
            } catch (error) {
                console.error('❌ Error loading customers:', error);
            }
        }

        // Load campaigns for dropdown
        async function loadCampaigns(campaignIds) {
            try {
                const campaignsSnapshot = await getDocs(collection(emailDb, 'campaigns'));
                campaigns.clear();
                
                campaignsSnapshot.forEach((doc) => {
                    const campaignData = { id: doc.id, ...doc.data() };
                    // Load all campaigns, not just ones that match campaignIds
                    campaigns.set(doc.id, campaignData);
                });

                console.log(`📊 Loaded ${campaigns.size} campaigns (${campaignIds.size} referenced in emails)`);
            } catch (error) {
                console.error('❌ Error loading campaigns:', error);
            }
        }

        // Load BDR leaders for dropdown
        async function loadBdrLeaders(bdrLeaderIds) {
            try {
                const bdrSnapshot = await getDocs(collection(emailDb, 'bdr_leaders'));
                bdrLeaders.clear();
                
                bdrSnapshot.forEach((doc) => {
                    const bdrData = { id: doc.id, ...doc.data() };
                    // Load all BDR leaders, not just ones that match bdrLeaderIds
                    bdrLeaders.set(doc.id, bdrData);
                });

                console.log(`📊 Loaded ${bdrLeaders.size} BDR leaders (${bdrLeaderIds.size} referenced in emails)`);
            } catch (error) {
                console.error('❌ Error loading BDR leaders:', error);
            }
        }

        // Set default filter values
        function setDefaultFilters() {
            // Set status filter to "scheduled" by default
            const statusSelect = document.getElementById('statusFilter');
            statusSelect.value = 'scheduled';
        }

        // Apply filters
        window.applyFilters = function() {
            const statusFilter = document.getElementById('statusFilter').value;

            filteredEmails = scheduledEmails.filter(email => {
                // Always filter for Pivot Point Consulting and Max Hanner ONLY
                const customer = customers.get(email.customerId);
                const bdr = bdrLeaders.get(email.bdrLeaderId);
                
                // Check for Pivot Point Consulting (case-insensitive)
                if (!customer || !customer.name || !customer.name.toLowerCase().includes('pivot point consulting')) {
                    return false;
                }
                
                // Check for Max Hanner (case-insensitive)
                if (!bdr || !bdr.name || !bdr.name.toLowerCase().includes('max hanner')) {
                    return false;
                }
                
                // Apply status filter only
                if (statusFilter && email.status !== statusFilter) return false;
                return true;
            });

            displayEmails();
            updateStats();
        };

        // Display emails grouped by day
        function displayEmails() {
            const container = document.getElementById('emailsContainer');
            
            console.log(`📧 Displaying ${filteredEmails.length} filtered emails out of ${scheduledEmails.length} total`);
            
            if (filteredEmails.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No scheduled emails found matching your filters. Total emails loaded: ${scheduledEmails.length}
                    </div>
                `;
                return;
            }

            // Group emails by date
            const emailsByDate = {};
            filteredEmails.forEach(email => {
                const dateStr = formatDate(email.scheduledDate);
                if (!emailsByDate[dateStr]) {
                    emailsByDate[dateStr] = [];
                }
                emailsByDate[dateStr].push(email);
            });

            // Sort dates
            const sortedDates = Object.keys(emailsByDate).sort();
            const today = formatDate(new Date());
            const tomorrow = formatDate(new Date(Date.now() + 24 * 60 * 60 * 1000));

            let html = '';
            sortedDates.forEach(dateStr => {
                const emails = emailsByDate[dateStr];
                const date = new Date(dateStr + 'T00:00:00');
                const dayName = date.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    month: 'long', 
                    day: 'numeric',
                    year: 'numeric'
                });

                let dayClass = '';
                if (dateStr === today) dayClass = 'today';
                else if (dateStr === tomorrow) dayClass = 'tomorrow';

                html += `
                    <div class="day-group">
                        <div class="day-header ${dayClass}">
                            <span>${dayName}</span>
                            <span>${emails.length} email${emails.length !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="email-list">
                `;

                emails.forEach(email => {
                    const customer = customers.get(email.customerId);
                    const campaign = campaigns.get(email.campaignId);
                    const bdr = bdrLeaders.get(email.bdrLeaderId);
                    
                    html += `
                        <div class="email-card">
                            <div class="email-header">
                                <div class="contact-info">
                                    <div class="contact-name">${email.contactName || 'Unknown Contact'}</div>
                                    <div class="contact-details">
                                        <div><i class="fas fa-envelope"></i> ${email.contactEmail || 'No email'}</div>
                                        <div><i class="fas fa-building"></i> ${email.company || 'No company'}</div>
                                        <div><i class="fas fa-user-tie"></i> ${bdr?.name || 'Unknown BDR'}</div>
                                        <div><i class="fas fa-tag"></i> ${campaign?.name || 'Unknown Campaign'}</div>
                                    </div>
                                </div>
                                <div class="email-actions">
                                    <span class="status-badge ${email.status || 'scheduled'}">${email.status || 'scheduled'}</span>
                                    ${email.status === 'sent' ? `
                                        <button class="mark-not-sent-btn" onclick="markAsNotSent('${email.id}')">
                                            <i class="fas fa-undo"></i>
                                            Mark Not Sent
                                        </button>
                                    ` : email.status === 'not_sent' ? `
                                        <button class="mark-scheduled-btn" onclick="markAsScheduled('${email.id}')">
                                            <i class="fas fa-calendar-check"></i>
                                            Mark Scheduled
                                        </button>
                                    ` : `
                                        <button class="send-email-btn" onclick="sendEmail('${email.id}')">
                                            <i class="fas fa-paper-plane"></i>
                                            Send Email
                                        </button>
                                        <button class="copy-email-btn" onclick="copyEmailContent('${email.id}')">
                                            <i class="fas fa-copy"></i>
                                            Copy to Clipboard to Send
                                        </button>
                                        <button class="mark-not-sent-btn" onclick="markAsNotSent('${email.id}')">
                                            <i class="fas fa-times"></i>
                                            Skip
                                        </button>
                                    `}
                                </div>
                            </div>
                            
                            <div class="email-content">
                                <div class="email-subject"><strong>Subject:</strong> ${email.subject || 'No subject'}</div>
                                <div class="email-body">${email.content || 'No content'}</div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Update stats display
            document.getElementById('emailsStats').textContent = 
                `Showing ${filteredEmails.length} of ${scheduledEmails.length} emails`;
        }

        // Send individual email
        window.sendEmail = async function(emailId) {
            const email = scheduledEmails.find(e => e.id === emailId);
            if (!email) {
                showToast('Email not found', 'error');
                return;
            }

            try {
                // Create mailto link
                const mailtoLink = `mailto:${email.contactEmail}?subject=${encodeURIComponent(email.subject || 'Follow-up')}&body=${encodeURIComponent(email.content || '')}`;
                
                // Open email client
                window.open(mailtoLink);
                
                // Copy content to clipboard
                if (email.content) {
                    await navigator.clipboard.writeText(email.content);
                    console.log('✅ Email content copied to clipboard');
                }

                // Update status in CLEmails
                const emailRef = doc(emailDb, 'selfsend_scheduledEmails', emailId);
                await updateDoc(emailRef, {
                    status: 'sent',
                    sentAt: new Date(),
                    sentBy: window.auth?.currentUser?.email || 'manual_user'
                });

                // Track outreach in HealthcareITDatabase
                await trackOutreachInCRM(email);

                // Update local data
                email.status = 'sent';
                email.sentAt = new Date();
                
                // Refresh display
                applyFilters();
                
                showToast(`Email opened for ${email.contactName}! Content copied to clipboard.`, 'success');

            } catch (error) {
                console.error('❌ Error sending email:', error);
                showToast('Error sending email: ' + error.message, 'error');
            }
        };

        // Copy subject and body to clipboard for manual sending
        window.copyEmailContent = async function(emailId) {
            const email = scheduledEmails.find(e => e.id === emailId);
            if (!email) {
                showToast('Email not found', 'error');
                return;
            }

            const subject = email.subject || 'Follow-up';
            const body = email.content || '';

            const fullText = `Subject: ${subject}\n\n${body}`;

            try {
                await navigator.clipboard.writeText(fullText);
                showToast('Subject and body copied to clipboard', 'success');
            } catch (err) {
                console.error('Clipboard copy failed, falling back to prompt:', err);
                // Fallback using a temporary textarea
                try {
                    const ta = document.createElement('textarea');
                    ta.value = fullText;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('Subject and body copied to clipboard', 'success');
                } catch (e) {
                    showToast('Unable to copy to clipboard', 'error');
                }
            }
        }

        // Track outreach in CRM (HealthcareITDatabase)
        async function trackOutreachInCRM(email) {
            try {
                // Wait for HealthcareITDatabase to be ready
                const healthcareApp = await waitForHealthcareDB();
                const healthcareDb = getDatabase(healthcareApp);

                // Create outreach data similar to hotsheetsprospecting.html
                const outreachData = {
                    timestamp: Date.now(),
                    date: new Date().toISOString(),
                    type: 'Email: Manual Send',
                    contact_name: email.contactName,
                    contact_email: email.contactEmail,
                    company: email.company,
                    bdr_leader: email.bdrLeader || 'Unknown BDR',
                    campaign_id: email.campaignId,
                    customer_id: email.customerId,
                    email_subject: email.subject,
                    email_content: email.content,
                    sent_via: 'manual_email_send_page',
                    user_email: window.auth?.currentUser?.email || 'manual_user'
                };

                // Encode email for Firebase path (same logic as hotsheetsprospecting.html)
                const encodedEmail = encodeEmailForFirebase(email.contactEmail);
                
                // Use company name as orgId if available, otherwise use a default
                const orgId = email.company ? email.company.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() : 'unknown_org';
                
                // Store in ppc_crm_25 (same path as hotsheetsprospecting.html)
                const outreachRef = ref(healthcareDb, `ppc_crm_25/${orgId}/${encodedEmail}`);
                const newOutreachRef = push(outreachRef);
                await set(newOutreachRef, outreachData);

                console.log('✅ Outreach tracked in CRM for:', email.contactEmail);

            } catch (error) {
                console.error('❌ Error tracking outreach in CRM:', error);
                // Don't fail the email send if CRM tracking fails
            }
        }

        // Encode email for Firebase path (from hotsheetsprospecting.html)
        function encodeEmailForFirebase(email) {
            return email.replace(/\./g, '_DOT_').replace(/\$/g, '_DOLLAR_').replace(/\[/g, '_LBRACKET_').replace(/\]/g, '_RBRACKET_').replace(/\#/g, '_HASH_');
        }

        // Mark all today's emails as sent
        window.markAllTodayAsSent = async function() {
            const today = formatDate(new Date());
            const todayEmails = filteredEmails.filter(email => 
                formatDate(email.scheduledDate) === today && email.status !== 'sent'
            );

            if (todayEmails.length === 0) {
                showToast('No emails to mark as sent for today', 'info');
                return;
            }

            const confirmed = confirm(`Mark ${todayEmails.length} email(s) as sent for today?`);
            if (!confirmed) return;

            try {
                showToast('Marking emails as sent...', 'info');
                
                for (const email of todayEmails) {
                    // Update status in CLEmails
                    const emailRef = doc(emailDb, 'selfsend_scheduledEmails', email.id);
                    await updateDoc(emailRef, {
                        status: 'sent',
                        sentAt: new Date(),
                        sentBy: window.auth?.currentUser?.email || 'manual_user'
                    });

                    // Track outreach in CRM
                    await trackOutreachInCRM(email);

                    // Update local data
                    email.status = 'sent';
                    email.sentAt = new Date();
                }

                // Refresh display
                applyFilters();
                
                showToast(`Marked ${todayEmails.length} emails as sent for today`, 'success');

            } catch (error) {
                console.error('❌ Error marking emails as sent:', error);
                showToast('Error marking emails as sent: ' + error.message, 'error');
            }
        };

        // Update statistics
        function updateStats() {
            const today = formatDate(new Date());
            const tomorrow = formatDate(new Date(Date.now() + 24 * 60 * 60 * 1000));
            const weekFromNow = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);

            const todayCount = filteredEmails.filter(email => 
                formatDate(email.scheduledDate) === today && email.status !== 'sent'
            ).length;

            const tomorrowCount = filteredEmails.filter(email => 
                formatDate(email.scheduledDate) === tomorrow && email.status !== 'sent'
            ).length;

            const upcomingCount = filteredEmails.filter(email => {
                const emailDate = email.scheduledDate;
                return emailDate > new Date() && emailDate <= weekFromNow && email.status !== 'sent';
            }).length;

            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('tomorrowCount').textContent = tomorrowCount;
            document.getElementById('upcomingCount').textContent = upcomingCount;
            document.getElementById('totalCount').textContent = filteredEmails.length;

            // Enable/disable bulk action button
            document.getElementById('markAllBtn').disabled = todayCount === 0;
        }

        // Utility functions
        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function showLoading(message) {
            const container = document.getElementById('emailsContainer');
            container.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>${message}</p>
                </div>
            `;
        }

        function hideLoading() {
            // Will be replaced by displayEmails()
        }

        function showToast(message, type = 'info') {
            // Remove existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }

            // Create new toast
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? 'check-circle' : 
                        type === 'error' ? 'exclamation-triangle' :
                        type === 'warning' ? 'exclamation-triangle' : 'info-circle';
            
            toast.innerHTML = `
                <i class="fas fa-${icon}"></i>
                <span>${message}</span>
            `;

            document.body.appendChild(toast);

            // Show toast
            setTimeout(() => toast.classList.add('show'), 100);

            // Hide toast after 5 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        // Mark email as not sent
        window.markAsNotSent = async function(emailId) {
            const email = scheduledEmails.find(e => e.id === emailId);
            if (!email) {
                showToast('Email not found', 'error');
                return;
            }

            try {
                // Update status in CLEmails
                const emailRef = doc(emailDb, 'selfsend_scheduledEmails', emailId);
                await updateDoc(emailRef, {
                    status: 'not_sent',
                    markedNotSentAt: new Date(),
                    markedNotSentBy: window.auth?.currentUser?.email || 'manual_user'
                });

                // Update local data
                email.status = 'not_sent';
                email.markedNotSentAt = new Date();
                
                // Refresh display
                applyFilters();
                
                showToast(`Marked email to ${email.contactName} as not sent`, 'warning');

            } catch (error) {
                console.error('❌ Error marking email as not sent:', error);
                showToast('Error marking email as not sent: ' + error.message, 'error');
            }
        };

        // Mark email as scheduled (revert from not_sent)
        window.markAsScheduled = async function(emailId) {
            const email = scheduledEmails.find(e => e.id === emailId);
            if (!email) {
                showToast('Email not found', 'error');
                return;
            }

            try {
                // Update status in CLEmails
                const emailRef = doc(emailDb, 'selfsend_scheduledEmails', emailId);
                await updateDoc(emailRef, {
                    status: 'scheduled',
                    markedScheduledAt: new Date(),
                    markedScheduledBy: window.auth?.currentUser?.email || 'manual_user'
                });

                // Update local data
                email.status = 'scheduled';
                email.markedScheduledAt = new Date();
                
                // Refresh display
                applyFilters();
                
                showToast(`Marked email to ${email.contactName} as scheduled`, 'info');

            } catch (error) {
                console.error('❌ Error marking email as scheduled:', error);
                showToast('Error marking email as scheduled: ' + error.message, 'error');
            }
        };

        // Make functions global
        window.loadScheduledEmails = loadScheduledEmails;

        // Initialize when page loads
        initialize();
    </script>

    <!-- Include auth.js for HealthcareITDatabase authentication -->
    <script type="module" src="../js/auth.js"></script>
</body>
