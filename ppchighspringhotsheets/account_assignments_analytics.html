<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Assignments Analytics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <style>
    :root {
      --primary: #264653;
      --secondary: #2a9d8f;
      --accent: #e9c46a;
      --danger: #e76f51;
      --warning: #f4a261;
      --success: #52b788;
      --light-blue: #f4f9fa;
      --light-green: #f4faef;
      --light-yellow: #fef3c7;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.07);
      --border-radius: 10px;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body { 
      background: #f9fafb; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      color: #263238; 
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-title-section {
      background: #fff;
      padding: 20px 0;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    
    .page-title-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      text-align: center;
    }
    
    .page-main-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    /* Sales Rep Cards Grid */
    .sales-rep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .sales-rep-card {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .sales-rep-header {
      grid-column: 1 / -1;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .sales-rep-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
    }

    .stats-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .stat-card {
      background: var(--light-blue);
      padding: 15px;
      border-radius: var(--border-radius);
    }

    .stat-title {
      font-size: 0.9rem;
      color: var(--primary);
      margin: 0 0 10px 0;
      font-weight: 500;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--secondary);
      margin: 0;
    }

    .stat-breakdown {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .map-container {
      height: 400px;
      border-radius: var(--border-radius);
      overflow: hidden;
    }

    /* Loading State */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .loading-spinner {
      text-align: center;
    }

    .loading-spinner .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Status Message */
    .status-message {
      padding: 15px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }

    .status-message.success {
      background: var(--light-green);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-message.error {
      background: #ffebee;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
  </style>
</head>
<body>
  <!-- Header will be loaded here -->
  <div id="header-container"></div>

  <!-- Page title section -->
  <div class="page-title-section">
    <div class="page-title-container">
      <div class="page-main-title">
        <i class="fas fa-chart-pie"></i>
        Account Assignments Analytics
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading analytics data...</p>
      </div>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message" style="display: none;"></div>

    <!-- Sales Rep Cards Grid -->
    <div id="salesRepGrid" class="sales-rep-grid">
      <!-- Cards will be dynamically inserted here -->
    </div>
  </div>

  <script type="module">
    // Immediately make navigation function available globally
    window.navigateToPage = function(url) {
      if (url) {
        window.location.href = url;
      }
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBpsxZCSULnandhpdVLI9nvsxd3_BH4dfs",
      authDomain: "healthcareitdatabase.firebaseapp.com",
      databaseURL: "https://healthcareitdatabase-default-rtdb.firebaseio.com",
      projectId: "healthcareitdatabase",
      storageBucket: "healthcareitdatabase.appspot.com",
      messagingSenderId: "1024935247661",
      appId: "1:1024935247661:web:a74be5c7b9df74245bdda4",
      measurementId: "G-60KWQ8SJW4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Global variables
    let organizations = [];
    let ehrGroups = {};
    let salesReps = new Map();

    // Load header
    async function loadHeader() {
      try {
        const response = await fetch('header.html');
        const headerHtml = await response.text();
        document.getElementById('header-container').innerHTML = headerHtml;
        
        // Set the correct selected option in the navigation dropdown
        const navSelect = document.querySelector('.nav-select');
        if (navSelect) {
          navSelect.value = 'account_assignments_analytics.html';
        }

        // Setup user menu functionality
        setupUserMenu();
      } catch (error) {
        console.error('Error loading header:', error);
        showMessage('Error loading header.', 'error');
      }
    }

    // Setup user menu functionality
    function setupUserMenu() {
      const userMenu = document.querySelector('.user-menu');
      const userInfo = document.querySelector('.user-info');
      const dropdownMenu = document.querySelector('.dropdown-menu');
      
      if (!userMenu || !userInfo || !dropdownMenu) {
        return;
      }

      userInfo.addEventListener('click', (e) => {
        e.stopPropagation();
        userMenu.classList.toggle('active');
      });

      document.addEventListener('click', (e) => {
        if (!userMenu.contains(e.target)) {
          userMenu.classList.remove('active');
        }
      });
    }

    // UI State Management
    function updateAuthUI(authState) {
      const authLoading = document.getElementById('auth-loading');
      const notLoggedIn = document.getElementById('not-logged-in');
      const loggedIn = document.getElementById('logged-in');
      
      if (authState.isChecking) {
        if (authLoading) {
          authLoading.style.display = 'flex';
          authLoading.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i><span style="font-size: 0.9rem;">Checking...</span>';
        }
        if (notLoggedIn) notLoggedIn.style.display = 'none';
        if (loggedIn) loggedIn.style.display = 'none';
        return;
      }
      
      if (authLoading) {
        authLoading.style.display = 'none';
      }
      
      if (authState.isLoggedIn && authState.isVerified) {
        if (notLoggedIn) notLoggedIn.style.display = 'none';
        if (loggedIn) loggedIn.style.display = 'block';
        setupUserMenuDisplay(authState.user);
      } else {
        if (notLoggedIn) notLoggedIn.style.display = 'block';
        if (loggedIn) loggedIn.style.display = 'none';
      }
    }

    // Setup user menu display
    function setupUserMenuDisplay(user) {
      function getInitials(user) {
        if (user.displayName) {
          const names = user.displayName.split(' ');
          if (names.length >= 2) {
            return (names[0][0] + names[names.length - 1][0]).toUpperCase();
          }
          return names[0][0].toUpperCase();
        } else if (user.email) {
          return user.email[0].toUpperCase();
        }
        return 'U';
      }

      function getDisplayName(user) {
        if (user.displayName) {
          return user.displayName;
        } else if (user.email) {
          const emailName = user.email.split('@')[0];
          return emailName
            .replace(/([A-Z])/g, ' $1')
            .replace(/[._-]/g, ' ')
            .replace(/\b\w/g, l => l.toUpperCase())
            .trim();
        }
        return 'User';
      }

      try {
        const avatarDiv = document.getElementById('user-avatar');
        if (avatarDiv && user) {
          const initials = getInitials(user);
          avatarDiv.textContent = initials;
        }

        const nameSpan = document.getElementById('user-name');
        if (nameSpan && user) {
          const displayName = getDisplayName(user);
          nameSpan.textContent = displayName;
        }
      } catch (error) {
        console.error('Error setting up user menu display:', error);
      }
    }

    // Logout function
    async function logout() {
      try {
        const { signOut } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
        await signOut(auth);
        window.location.href = '../login.html';
      } catch (error) {
        console.error('Logout failed:', error);
      }
    }

    // Load data from Firebase
    async function loadData() {
      console.log('Starting to load data...');
      showLoading(true);

      try {
        const organizationsRef = ref(db, 'ppc_kare_25');
        const hotsheetIndexRef = ref(db, 'ppc_hotsheet_index25');
        
        console.log('Fetching data from Firebase...');
        // Load both data sources
        const [orgSnapshot, hotsheetSnapshot] = await Promise.all([
          get(organizationsRef),
          get(hotsheetIndexRef)
        ]);

        console.log('Processing organization data...');
        if (orgSnapshot.exists()) {
          organizations = [];
          orgSnapshot.forEach((childSnapshot) => {
            const org = childSnapshot.val();
            org.id = childSnapshot.key;
            organizations.push(org);
          });
          console.log(`Loaded ${organizations.length} organizations`);
        }

        console.log('Processing EHR group data...');
        if (hotsheetSnapshot.exists()) {
          ehrGroups = {};
          hotsheetSnapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            if (data.domain) {
              ehrGroups[data.domain] = data.ehr_group || 'NA';
            }
          });
          console.log(`Loaded ${Object.keys(ehrGroups).length} EHR groups`);
        }

        // Process data for sales reps
        processSalesRepData();
        renderSalesRepCards();
      } catch (error) {
        console.error('Error loading data:', error);
        showMessage('Error loading data. Please try again.', 'error');
      } finally {
        showLoading(false);
      }
    }

    // Process data for sales representatives
    function processSalesRepData() {
      console.log('Processing sales rep data...');
      salesReps.clear();
      
      organizations.forEach(org => {
        if (org.sales_leader) {
          if (!salesReps.has(org.sales_leader)) {
            salesReps.set(org.sales_leader, {
              name: org.sales_leader,
              totalAccounts: 0,
              categories: new Map(),
              ehrGroups: new Map(),
              locations: []
            });
          }
          
          const rep = salesReps.get(org.sales_leader);
          rep.totalAccounts++;
          
          // Count categories
          if (org.category) {
            rep.categories.set(org.category, (rep.categories.get(org.category) || 0) + 1);
          }
          
          // Count EHR groups
          const ehrGroup = ehrGroups[org.domain] || 'NA';
          rep.ehrGroups.set(ehrGroup, (rep.ehrGroups.get(ehrGroup) || 0) + 1);
          
          // Add location if available
          if (org.lat && org.lon) {
            const lat = parseFloat(org.lat);
            const lng = parseFloat(org.lon);
            if (!isNaN(lat) && !isNaN(lng)) {
              rep.locations.push({
                name: org.organization_name,
                lat: lat,
                lng: lng
              });
            }
          }
        }
      });

      // Log the processed data
      salesReps.forEach((rep, name) => {
        console.log(`Processed ${name}: ${rep.totalAccounts} accounts, ${rep.locations.length} locations`);
      });
    }

    // Render sales representative cards
    function renderSalesRepCards() {
      console.log('Rendering sales rep cards...');
      const grid = document.getElementById('salesRepGrid');
      grid.innerHTML = '';

      salesReps.forEach(rep => {
        const card = document.createElement('div');
        card.className = 'sales-rep-card';
        
        // Create header
        const header = document.createElement('div');
        header.className = 'sales-rep-header';
        header.innerHTML = `
          <h2 class="sales-rep-name">${rep.name}</h2>
        `;
        
        // Create stats section
        const statsSection = document.createElement('div');
        statsSection.className = 'stats-section';
        
        // Total accounts stat
        const totalStat = document.createElement('div');
        totalStat.className = 'stat-card';
        totalStat.innerHTML = `
          <h3 class="stat-title">Total Accounts</h3>
          <p class="stat-value">${rep.totalAccounts}</p>
        `;
        
        // Categories stat
        const categoriesStat = document.createElement('div');
        categoriesStat.className = 'stat-card';
        let categoriesHtml = `
          <h3 class="stat-title">Categories</h3>
          <div class="stat-breakdown">
        `;
        rep.categories.forEach((count, category) => {
          categoriesHtml += `
            <div class="stat-item">
              <span>${category}</span>
              <span>${count}</span>
            </div>
          `;
        });
        categoriesHtml += '</div>';
        categoriesStat.innerHTML = categoriesHtml;
        
        // EHR Groups stat
        const ehrGroupsStat = document.createElement('div');
        ehrGroupsStat.className = 'stat-card';
        let ehrGroupsHtml = `
          <h3 class="stat-title">EHR Groups</h3>
          <div class="stat-breakdown">
        `;
        rep.ehrGroups.forEach((count, group) => {
          ehrGroupsHtml += `
            <div class="stat-item">
              <span>${group}</span>
              <span>${count}</span>
            </div>
          `;
        });
        ehrGroupsHtml += '</div>';
        ehrGroupsStat.innerHTML = ehrGroupsHtml;
        
        // Create map container
        const mapContainer = document.createElement('div');
        mapContainer.className = 'map-container';
        const mapId = `map-${rep.name.replace(/[^a-z0-9]/gi, '-').toLowerCase()}`;
        mapContainer.id = mapId;
        
        // Assemble card
        statsSection.appendChild(totalStat);
        statsSection.appendChild(categoriesStat);
        statsSection.appendChild(ehrGroupsStat);
        
        card.appendChild(header);
        card.appendChild(statsSection);
        card.appendChild(mapContainer);
        
        grid.appendChild(card);
        
        // Initialize map after the container is in the DOM
        if (rep.locations.length > 0) {
          console.log(`Setting up map for ${rep.name} with ${rep.locations.length} locations`);
          // Use requestAnimationFrame to ensure DOM is ready
          requestAnimationFrame(() => {
            console.log(`Initializing map for ${mapId}`);
            initializeMap(mapId, rep.locations);
          });
        }
      });
    }

    // Initialize map for a sales rep
    function initializeMap(containerId, locations) {
      console.log(`Starting map initialization for ${containerId}`);
      if (!locations.length) {
        console.log(`No locations for ${containerId}`);
        return;
      }
      
      try {
        const container = document.getElementById(containerId);
        if (!container) {
          console.error(`Map container ${containerId} not found`);
          return;
        }

        console.log(`Creating map in ${containerId}`);
        const map = L.map(containerId, {
          scrollWheelZoom: false,
          zoomControl: true
        });
        
        // Add tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 19
        }).addTo(map);
        
        // Add markers
        const bounds = L.latLngBounds([]);
        locations.forEach(location => {
          if (location.lat && location.lng) {
            const marker = L.marker([location.lat, location.lng])
              .bindPopup(location.name)
              .addTo(map);
            bounds.extend([location.lat, location.lng]);
          }
        });
        
        // Fit map to markers if we have any valid locations
        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [50, 50] });
        } else {
          // Default to US center if no valid locations
          map.setView([39.8283, -98.5795], 4);
        }
        
        console.log(`Map initialized for ${containerId}`);
      } catch (error) {
        console.error(`Error initializing map for ${containerId}:`, error);
      }
    }

    // Show/hide loading overlay
    function showLoading(show) {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.style.display = show ? 'flex' : 'none';
      }
    }

    // Show status message
    function showMessage(message, type) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.textContent = message;
      statusDiv.className = `status-message ${type}`;
      statusDiv.style.display = 'block';
      
      setTimeout(() => {
        statusDiv.style.display = 'none';
      }, 5000);
    }

    // Auth callback function
    window.messageBuilderAuthCheck = async function(authState) {
      console.log('Auth state received:', authState);
      
      // Update the header authentication UI
      updateAuthUI(authState);
      
      if (authState.isLoggedIn && authState.isVerified) {
        const user = authState.user;
        console.log('User authenticated:', user.email);
        
        try {
          await loadData();
        } catch (error) {
          console.error('Error in messageBuilderAuthCheck:', error);
          showMessage('Error loading data. Please refresh the page.', 'error');
        }
      } else {
        console.log('User not authenticated or not verified');
        showMessage('Please log in to access this page.', 'error');
      }
    };

    // Alternative auth check function with different name in case auth.js expects something else
    window.authStateChanged = window.messageBuilderAuthCheck;
    window.onAuthStateChanged = window.messageBuilderAuthCheck;
    
    console.log("📋 Registered window.messageBuilderAuthCheck function");

    // Make logout function available globally
    window.logout = logout;

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM Content Loaded');
      loadHeader();
      
      // Show initial checking state
      updateAuthUI({ isChecking: true });
      
      // Check if auth is already available
      if (window.authDebug && window.authDebug.currentAuthState) {
        console.log('Auth state available from debug');
        window.messageBuilderAuthCheck(window.authDebug.currentAuthState);
      } else {
        console.log('No auth state available, waiting for auth...');
        // Set up auth state listener
        onAuthStateChanged(auth, (user) => {
          console.log('Auth state changed:', user);
          if (user) {
            const authState = {
              isLoggedIn: true,
              isVerified: user.emailVerified,
              user: user,
              isChecking: false
            };
            updateAuthUI(authState);
            window.messageBuilderAuthCheck(authState);
          } else {
            const authState = {
              isLoggedIn: false,
              isVerified: false,
              user: null,
              isChecking: false
            };
            updateAuthUI(authState);
            window.messageBuilderAuthCheck(authState);
          }
        });
      }
    });
  </script>
</body>
</html>
