<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Scripts Test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <h1>Phone Scripts Integration Test</h1>
  
  <button onclick="testPhoneScripts()" style="padding: 10px 20px; background: #2a9d8f; color: white; border: none; border-radius: 6px; cursor: pointer;">
    <i class="fas fa-phone"></i> Test Phone Scripts
  </button>
  
  <div id="test-results" style="margin-top: 20px; padding: 20px; background: #f9f9f9; border-radius: 6px;">
    <h3>Test Results:</h3>
    <div id="results-content">Click the button to test phone scripts integration.</div>
  </div>

  <script src="phone-scripts-integration.js"></script>
  
  <script>
    // Mock data for testing
    window.messageTemplates = {
      linkedin: [],
      email: [],
      phone: [
        {
          id: 1,
          name: "Test Script 1",
          content: "Hi [First Name], this is a test call from [Organization Name]. We have some exciting opportunities to discuss."
        },
        {
          id: 2,
          name: "Test Script 2", 
          content: "Hello [First Name], I'm calling about [Open Epic Jobs] at [Organization Name]. [Personalization Sentence]"
        }
      ]
    };
    
    function testPhoneScripts() {
      const testContact = {
        name: "John Doe",
        first_name: "John",
        last_name: "Doe",
        email: "john.doe@test.com",
        phone: "(555) 123-4567",
        personalization: "I saw your recent LinkedIn post about healthcare innovation"
      };
      
      const testOrg = {
        id: "test-org-1",
        org: "Test Healthcare System",
        org_short_x: "THS",
        epic_jobs: "3"
      };
      
      const phoneNumber = "(555) 123-4567";
      
      // Test the phone scripts function
      if (typeof window.openPhoneScripts === 'function') {
        window.openPhoneScripts(testContact, testOrg, phoneNumber);
        document.getElementById('results-content').innerHTML = `
          <div style="color: green;">✅ Phone scripts integration is working!</div>
          <div>- openPhoneScripts function is available</div>
          <div>- Phone scripts panel should have opened</div>
          <div>- Test data: ${testContact.name} at ${testOrg.org}</div>
          <div>- Phone: ${phoneNumber}</div>
          <div>- Available scripts: ${window.messageTemplates.phone.length}</div>
        `;
      } else {
        document.getElementById('results-content').innerHTML = `
          <div style="color: red;">❌ Phone scripts integration failed!</div>
          <div>- openPhoneScripts function is not available</div>
          <div>- Check console for errors</div>
        `;
      }
    }
    
    // Test on page load
    setTimeout(() => {
      const resultsDiv = document.getElementById('results-content');
      let status = '<h4>Integration Status:</h4>';
      
      if (typeof window.openPhoneScripts === 'function') {
        status += '<div style="color: green;">✅ openPhoneScripts function loaded</div>';
      } else {
        status += '<div style="color: red;">❌ openPhoneScripts function missing</div>';
      }
      
      if (typeof window.closePhoneScripts === 'function') {
        status += '<div style="color: green;">✅ closePhoneScripts function loaded</div>';
      } else {
        status += '<div style="color: red;">❌ closePhoneScripts function missing</div>';
      }
      
      if (document.getElementById('phoneScriptsPanel')) {
        status += '<div style="color: green;">✅ Phone scripts panel HTML loaded</div>';
      } else {
        status += '<div style="color: red;">❌ Phone scripts panel HTML missing</div>';
      }
      
      if (document.getElementById('phone-scripts-styles')) {
        status += '<div style="color: green;">✅ Phone scripts CSS loaded</div>';
      } else {
        status += '<div style="color: red;">❌ Phone scripts CSS missing</div>';
      }
      
      status += `<div>📞 Available phone scripts: ${window.messageTemplates?.phone?.length || 0}</div>`;
      status += '<br><div><strong>Click the test button above to open the phone scripts panel.</strong></div>';
      
      resultsDiv.innerHTML = status;
    }, 1000);
  </script>
</body>
</html>
