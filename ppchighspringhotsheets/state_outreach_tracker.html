<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rural Healthcare Funds Outreach Tracking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { 
      --primary:#264653; 
      --secondary:#2a9d8f; 
      --accent:#e9c46a; 
      --danger:#e76f51; 
      --light-blue:#f4f9fa; 
      --card:#fff; 
      --muted:#6b7280; 
      --radius:10px; 
      --shadow:0 2px 8px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; background:#f9fafb; color:#263238; }
    .container { max-width:1400px; margin:0 auto; padding:20px; }
    .page-header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin: 10px 0 20px; }
    .title { font-size:1.7rem; font-weight:800; color:var(--primary); display:flex; align-items:center; gap:10px; }
    .title i { color:var(--secondary); }
    .actions { display:flex; gap:10px; align-items:center; }
    .btn { background:var(--secondary); color:#fff; border:none; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:600; box-shadow:var(--shadow); }
    .btn:disabled { opacity:0.7; cursor:not-allowed; }
    .btn.secondary { background:#3b82f6; }
    .btn.danger { background:var(--danger); }
    .status { color:var(--muted); font-size:0.9rem; min-height:20px; }
    .status.success { color:#065f46; }
    .status.error { color:#7f1d1d; }
    .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
    .controls { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
    .controls input { flex:1; padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; }
    table { width:100%; border-collapse:collapse; }
    thead th { text-align:left; font-weight:700; color:#374151; border-bottom:2px solid #e5e7eb; padding:10px; background:#fafafa; position:sticky; top:0; z-index:1; }
    tbody td { border-bottom:1px solid #f1f5f9; padding:10px; vertical-align:top; }
    tbody tr:hover { background:#fbfdff; }
    .state-cell { font-weight:600; color:#1f2937; }
    .state-code { color:#9ca3af; font-weight:500; font-size:0.85rem; }
    textarea { width:100%; min-height:70px; resize:vertical; padding:8px; border:1px solid #e5e7eb; border-radius:8px; font-size:0.95rem; background:#fff; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns: 2fr 3fr; gap:10px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.8rem; background:#ecfeff; color:#155e75; border:1px solid #a5f3fc; }
  </style>
</head>
<body>
  <!-- Hidden auth elements required by auth.js -->
  <div id="auth-loading" style="display: none;">Loading...</div>
  <div id="not-logged-in" style="display: none;">Not logged in</div>
  <div id="logged-in" style="display: none;">Logged in</div>

  <div id="header-container"></div>

  <div class="container">
    <div class="page-header">
      <div class="title">
        <i class="fa-solid fa-hands-holding-circle"></i>
        Rural Healthcare Funds Outreach Tracking
      </div>
      <div class="actions">
        <div id="status" class="status"></div>
        <button id="saveAllBtn" class="btn"><i class="fa-solid fa-floppy-disk"></i> Save All Changes</button>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <input id="search" placeholder="Filter by state name..." />
        <span class="pill">Data path: ppc_state_outreach</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:180px;">State</th>
              <th>Long Description</th>
              <th>Message Insert</th>
            </tr>
          </thead>
          <tbody id="stateRows">
            <tr><td colspan="3" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    // Load header partial
    async function loadHeader() {
      try {
        const response = await fetch('header.html');
        const headerHtml = await response.text();
        document.getElementById('header-container').innerHTML = headerHtml;
        const navSelect = document.querySelector('.nav-select');
        if (navSelect) navSelect.value = 'state_outreach_tracker.html';
      } catch (e) { console.error('Error loading header:', e); }
    }
    document.addEventListener('DOMContentLoaded', loadHeader);
  </script>
  <script type="module">
    import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

    const US_STATES = [
      { code:'AL', name:'Alabama' },
      { code:'AK', name:'Alaska' },
      { code:'AZ', name:'Arizona' },
      { code:'AR', name:'Arkansas' },
      { code:'CA', name:'California' },
      { code:'CO', name:'Colorado' },
      { code:'CT', name:'Connecticut' },
      { code:'DE', name:'Delaware' },
      { code:'FL', name:'Florida' },
      { code:'GA', name:'Georgia' },
      { code:'HI', name:'Hawaii' },
      { code:'ID', name:'Idaho' },
      { code:'IL', name:'Illinois' },
      { code:'IN', name:'Indiana' },
      { code:'IA', name:'Iowa' },
      { code:'KS', name:'Kansas' },
      { code:'KY', name:'Kentucky' },
      { code:'LA', name:'Louisiana' },
      { code:'ME', name:'Maine' },
      { code:'MD', name:'Maryland' },
      { code:'MA', name:'Massachusetts' },
      { code:'MI', name:'Michigan' },
      { code:'MN', name:'Minnesota' },
      { code:'MS', name:'Mississippi' },
      { code:'MO', name:'Missouri' },
      { code:'MT', name:'Montana' },
      { code:'NE', name:'Nebraska' },
      { code:'NV', name:'Nevada' },
      { code:'NH', name:'New Hampshire' },
      { code:'NJ', name:'New Jersey' },
      { code:'NM', name:'New Mexico' },
      { code:'NY', name:'New York' },
      { code:'NC', name:'North Carolina' },
      { code:'ND', name:'North Dakota' },
      { code:'OH', name:'Ohio' },
      { code:'OK', name:'Oklahoma' },
      { code:'OR', name:'Oregon' },
      { code:'PA', name:'Pennsylvania' },
      { code:'RI', name:'Rhode Island' },
      { code:'SC', name:'South Carolina' },
      { code:'SD', name:'South Dakota' },
      { code:'TN', name:'Tennessee' },
      { code:'TX', name:'Texas' },
      { code:'UT', name:'Utah' },
      { code:'VT', name:'Vermont' },
      { code:'VA', name:'Virginia' },
      { code:'WA', name:'Washington' },
      { code:'WV', name:'West Virginia' },
      { code:'WI', name:'Wisconsin' },
      { code:'WY', name:'Wyoming' },
      { code:'DC', name:'District of Columbia' }
    ];

    let db;
    let currentUserEmail = '';
    let originalData = {};

    function buildTable() {
      const rows = document.getElementById('stateRows');
      rows.innerHTML = US_STATES.map(s => `
        <tr data-code="${s.code}">
          <td class="state-cell">
            ${s.name}<div class="state-code">${s.code}</div>
          </td>
          <td>
            <textarea id="desc_${s.code}" placeholder="Enter long description for ${s.name}..."></textarea>
          </td>
          <td>
            <textarea id="msg_${s.code}" placeholder="Enter message insert for ${s.name}..."></textarea>
          </td>
        </tr>
      `).join('');
    }

    function renderFromData(data) {
      US_STATES.forEach(s => {
        const entry = data[s.code] || {};
        const descEl = document.getElementById(`desc_${s.code}`);
        const msgEl = document.getElementById(`msg_${s.code}`);
        if (descEl) descEl.value = entry.longDescription || '';
        if (msgEl) msgEl.value = entry.messageInsert || '';
      });
    }

    async function loadData() {
      const status = document.getElementById('status');
      status.textContent = 'Loading...';
      try {
        const snapshot = await get(ref(db, 'ppc_state_outreach'));
        originalData = snapshot.val() || {};
        renderFromData(originalData);
        status.textContent = '';
      } catch (e) {
        console.error('Failed to load ppc_state_outreach:', e);
        status.textContent = 'Error loading data';
        status.className = 'status error';
      }
    }

    function collectAll() {
      const now = new Date().toISOString();
      const payload = {};
      US_STATES.forEach(s => {
        const longDescription = (document.getElementById(`desc_${s.code}`)?.value || '').trim();
        const messageInsert = (document.getElementById(`msg_${s.code}`)?.value || '').trim();
        payload[s.code] = {
          stateCode: s.code,
          stateName: s.name,
          longDescription,
          messageInsert,
          updatedAt: now,
          updatedBy: currentUserEmail || null
        };
      });
      return payload;
    }

    async function saveAll() {
      const status = document.getElementById('status');
      try {
        status.textContent = 'Saving...';
        status.className = 'status';
        const payload = collectAll();
        await set(ref(db, 'ppc_state_outreach'), payload);
        originalData = payload;
        status.textContent = 'All changes saved';
        status.className = 'status success';
        setTimeout(() => { status.textContent = ''; status.className = 'status'; }, 2500);
      } catch (e) {
        console.error('Save failed:', e);
        status.textContent = 'Save failed';
        status.className = 'status error';
      }
    }

    function setupFilter() {
      const search = document.getElementById('search');
      const tbody = document.getElementById('stateRows');
      search.addEventListener('input', () => {
        const term = (search.value || '').toLowerCase();
        Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
          const code = tr.getAttribute('data-code');
          const state = US_STATES.find(s => s.code === code);
          const hay = `${state?.name || ''} ${state?.code || ''}`.toLowerCase();
          tr.style.display = hay.includes(term) ? '' : 'none';
        });
      });
    }

    async function init() {
      await window.firebaseReady;
      const ok = await window.requireAuthResilient('You must be logged in to view this page.');
      if (!ok) return;
      db = getDatabase(window.firebaseApp);
      currentUserEmail = window.auth?.currentUser?.email || '';
      buildTable();
      setupFilter();
      await loadData();
      document.getElementById('saveAllBtn').addEventListener('click', saveAll);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
