<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Requests</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --primary:#264653; --secondary:#2a9d8f; --card:#fff; --muted:#6b7280; --accent:#e9c46a; --light-blue:#f4f9fa; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; background:#f9fafb; color:#263238; }
    .container { max-width:1200px; margin:0 auto; padding:20px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .title { font-size:1.6rem; font-weight:700; color:var(--primary); }
    .card { background:var(--card); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.07); padding:16px; }
    .controls { display:flex; gap:10px; margin-bottom:16px; }
    .controls input, .controls select { padding:8px 10px; border:1px solid #ddd; border-radius:6px; }
    table { width:100%; border-collapse:collapse; font-size:0.95rem; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #eee; vertical-align:top; }
    th { color:#374151; font-weight:600; }
    tbody tr:hover { background:#f8fafc; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.8rem; }
    .pill.yes { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .pill.no { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <!-- Hidden auth elements required by auth.js -->
  <div id="auth-loading" style="display: none;">Loading...</div>
  <div id="not-logged-in" style="display: none;">Not logged in</div>
  <div id="logged-in" style="display: none;">Logged in</div>

  <div id="header-container"></div>
  <div class="container">
    <div class="header">
      <div class="title"><i class="fas fa-database"></i> Data Requests</div>
      <a href="ppchighspringhotsheets/hotsheetsprospecting.html" style="text-decoration:none;color:var(--secondary);">
        <i class="fas fa-arrow-left"></i> Back to Hotsheet
      </a>
    </div>
    <div class="card">
      <div class="controls">
        <input id="search" placeholder="Search organization, domain, user, comments" style="flex:1;"/>
        <select id="filterHave">
          <option value="">All</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>When</th>
              <th>Organization</th>
              <th>Domain</th>
              <th>Have Contacts</th>
              <th>Comments</th>
              <th>User</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    // Load header partial
    async function loadHeader() {
      try {
        const response = await fetch('header.html');
        const headerHtml = await response.text();
        document.getElementById('header-container').innerHTML = headerHtml;
        const navSelect = document.querySelector('.nav-select');
        if (navSelect) navSelect.value = 'data_requests.html';
      } catch (e) { console.error('Error loading header:', e); }
    }
    document.addEventListener('DOMContentLoaded', loadHeader);
  </script>
  <script type="module">
    import { getDatabase, ref, onValue, get } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';
    
    async function init() {
      await window.firebaseReady; 
      const ok = await window.requireAuthResilient('You must be logged in to view data requests.');
      if (!ok) return;
      
      const appDb = getDatabase(window.firebaseApp);
      const reqRef = ref(appDb, 'ppc_data_requests');
      const rows = document.getElementById('rows');
      const search = document.getElementById('search');
      const filterHave = document.getElementById('filterHave');
      let all = [];
      
      function render(list) {
        const term = (search.value || '').toLowerCase();
        const have = filterHave.value;
        const filtered = list.filter(item => {
          if (have && (item.haveContacts || '') !== have) return false;
          if (!term) return true;
          const blob = [
            item.organization, item.domain, item.comments, item.userEmail, item.userName, item.orgId
          ].filter(Boolean).join(' ').toLowerCase();
          return blob.includes(term);
        });
        if (filtered.length === 0) {
          rows.innerHTML = '<tr><td colspan="6" class="muted">No requests found</td></tr>';
          return;
        }
        rows.innerHTML = filtered
          .sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''))
          .map(r => {
            const when = r.createdAt ? new Date(r.createdAt).toLocaleString() : '';
            const have = r.haveContacts === 'yes' ? '<span class="pill yes">Yes</span>' : '<span class="pill no">No</span>';
            const comments = (r.comments || '').replace(/</g,'&lt;');
            return `<tr>
              <td class="muted">${when}</td>
              <td>${r.organization || ''}</td>
              <td>${r.domain || ''}</td>
              <td>${have}</td>
              <td>${comments}</td>
              <td class="muted">${r.userName || ''} <span style="color:#9ca3af">${r.userEmail || ''}</span></td>
            </tr>`;
          }).join('');
      }
      
      onValue(reqRef, (snap) => {
        const val = snap.val() || {};
        const rowsArr = [];
        Object.entries(val).forEach(([orgId, children]) => {
          if (children && typeof children === 'object') {
            Object.values(children).forEach(v => rowsArr.push(v));
          }
        });
        all = rowsArr;
        render(all);
      });
      
      search.addEventListener('input', () => render(all));
      filterHave.addEventListener('change', () => render(all));
    }
    
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
