<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KARE Organizations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #264653;
      --secondary: #2a9d8f;
      --accent: #e9c46a;
      --danger: #e76f51;
      --warning: #f4a261;
      --success: #52b788;
      --light-blue: #f4f9fa;
      --light-green: #f4faef;
      --light-yellow: #fef3c7;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.07);
      --border-radius: 10px;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body { 
      background: #f9fafb; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      color: #263238; 
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-title-section {
      background: #fff;
      padding: 20px 0;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    
    .page-title-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      text-align: center;
    }
    
    .page-main-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    /* Table Styles */
    .table-container {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      padding: 20px;
      margin-bottom: 30px;
      overflow-x: auto;
    }

    .organizations-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .organizations-table th,
    .organizations-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .organizations-table th {
      background: var(--light-blue);
      color: var(--primary);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .organizations-table tr:hover {
      background: var(--light-blue);
    }

    .editable-cell {
      position: relative;
      cursor: pointer;
    }

    .editable-cell:hover {
      background: var(--light-yellow);
    }

    .editable-cell .edit-icon {
      opacity: 0;
      margin-left: 5px;
      color: var(--secondary);
      transition: opacity 0.2s;
    }

    .editable-cell:hover .edit-icon {
      opacity: 1;
    }

    /* Dropdown Styles */
    .dropdown-select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .dropdown-select:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 2px rgba(42, 157, 143, 0.1);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--border-radius);
      width: 90%;
      max-width: 500px;
      position: relative;
    }

    .modal-header {
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #666;
      cursor: pointer;
      padding: 5px;
    }

    .modal-close:hover {
      color: var(--danger);
    }

    .modal-body {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: var(--primary);
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 2px rgba(42, 157, 143, 0.1);
    }

    .modal-footer {
      text-align: right;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--secondary);
      color: white;
    }

    .btn-primary:hover {
      background: #238b7a;
    }

    .btn-secondary {
      background: #eee;
      color: #666;
      margin-right: 10px;
    }

    .btn-secondary:hover {
      background: #ddd;
    }

    .btn-sync {
      background: var(--warning);
      color: white;
      padding: 4px 8px;
      font-size: 0.85rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-sync:hover {
      background: #e08e0b;
      transform: translateY(-1px);
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .sync-status.synced {
      background: var(--light-green);
      color: var(--success);
    }

    .sync-status.out-of-sync {
      background: var(--light-yellow);
      color: var(--warning);
    }

    /* Status Message */
    .status-message {
      padding: 15px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }

    .status-message.success {
      background: var(--light-green);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-message.error {
      background: #ffebee;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* Loading State */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--light-blue);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <!-- Header will be loaded here -->
  <div id="header-container"></div>

  <!-- Page title section -->
  <div class="page-title-section">
    <div class="page-title-container">
      <div class="page-main-title">
        <i class="fas fa-hospital"></i>
        KARE Organizations
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Status Message -->
    <div id="statusMessage" class="status-message" style="display: none;"></div>

    <!-- Table Container -->
    <div class="table-container">
      <table class="organizations-table">
        <thead>
          <tr>
            <th>Organization Name</th>
            <th>Domain</th>
            <th>Bullhorn ID</th>
            <th>Total Beds</th>
            <th>Headquarters</th>
            <th>Customer Type</th>
            <th>SAM Account</th>
            <th>Category</th>
            <th>Sales Leader</th>
            <th>Sales Second</th>
            <th>Executive Leader</th>
            <th>KARE Category</th>
            <th>Target Tier</th>
            <th>AMC</th>
          </tr>
        </thead>
        <tbody id="organizationsTableBody">
          <!-- Data will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">
        <i class="fas fa-times"></i>
      </button>
      <div class="modal-header">
        <h2 class="modal-title">Edit Field</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" id="modalFieldLabel">Field Name</label>
          <select class="form-input" id="modalSelect">
            <option value="">Select a value...</option>
          </select>
          <div id="newValueContainer" style="display: none; margin-top: 10px;">
            <input type="text" class="form-input" id="newValueInput" placeholder="Enter new value...">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
  </div>

  <!-- Load auth.js first to initialize Firebase authentication -->
  <script src="../js/auth.js"></script>
  
  <script type="module">
    // Immediately make navigation function available globally
    window.navigateToPage = function(url) {
      if (url) {
        window.location.href = url;
      }
    };

    import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // Wait for auth.js to initialize Firebase
    console.log("⏳ Waiting for auth.js to initialize Firebase...");
    
    let app, db, auth;
    let authCheckAttempts = 0;
    const maxAuthCheckAttempts = 50;
    
    // Function to check if Firebase is ready from auth.js
    async function waitForAuth() {
      while ((!window.firebaseApp || !window.auth) && authCheckAttempts < maxAuthCheckAttempts) {
        console.log("⏳ Waiting for auth.js... attempt", authCheckAttempts + 1);
        await new Promise(resolve => setTimeout(resolve, 200));
        authCheckAttempts++;
      }
      
      if (!window.firebaseApp || !window.auth) {
        throw new Error("Firebase not initialized by auth.js after timeout");
      }
      
      console.log("✅ Using authenticated Firebase instance from auth.js");
      
      // Use the authenticated app instance
      app = window.firebaseApp;
      auth = window.auth;
      db = getDatabase(app);
      
      // Wait for user to be authenticated
      const user = auth.currentUser;
      if (!user) {
        console.log("⏳ Waiting for user authentication...");
        
        await new Promise((resolve) => {
          const unsubscribe = auth.onAuthStateChanged((user) => {
            if (user && user.emailVerified) {
              console.log("✅ User authenticated:", user.email);
              unsubscribe();
              resolve();
            } else if (!user) {
              console.log("❌ No authenticated user");
              unsubscribe();
              resolve();
            }
          });
        });
      }
      
      // Check if user is authenticated
      if (!auth.currentUser || !auth.currentUser.emailVerified) {
        throw new Error("User must be logged in to access KARE organizations");
      }
      
      console.log("✅ Firebase ready with authenticated user");
    }

    // Global variables
    let organizations = [];
    let crmData = {};
    let currentUser = null;
    let currentEdit = {
      organizationId: null,
      field: null,
      value: null
    };

    // Load header
    async function loadHeader() {
      try {
        const response = await fetch('header.html');
        const headerHtml = await response.text();
        document.getElementById('header-container').innerHTML = headerHtml;
        
        // Set the correct selected option in the navigation dropdown
        const navSelect = document.querySelector('.nav-select');
        if (navSelect) {
          navSelect.value = 'kare_organizations.html';
        }

        // Setup user menu functionality
        setupUserMenu();
      } catch (error) {
        console.error('Error loading header:', error);
        showMessage('Error loading header.', 'error');
      }
    }

    // Setup user menu functionality
    function setupUserMenu() {
      const userMenu = document.querySelector('.user-menu');
      const userInfo = document.querySelector('.user-info');
      const dropdownMenu = document.querySelector('.dropdown-menu');
      
      if (!userMenu || !userInfo || !dropdownMenu) {
        return;
      }

      userInfo.addEventListener('click', (e) => {
        e.stopPropagation();
        userMenu.classList.toggle('active');
      });

      document.addEventListener('click', (e) => {
        if (!userMenu.contains(e.target)) {
          userMenu.classList.remove('active');
        }
      });
    }

    // UI State Management
    function updateAuthUI(authState) {
      const authLoading = document.getElementById('auth-loading');
      const notLoggedIn = document.getElementById('not-logged-in');
      const loggedIn = document.getElementById('logged-in');
      
      if (authState.isChecking) {
        if (authLoading) {
          authLoading.style.display = 'flex';
          authLoading.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i><span style="font-size: 0.9rem;">Checking...</span>';
        }
        if (notLoggedIn) notLoggedIn.style.display = 'none';
        if (loggedIn) loggedIn.style.display = 'none';
        return;
      }
      
      if (authLoading) {
        authLoading.style.display = 'none';
      }
      
      if (authState.isLoggedIn && authState.isVerified) {
        if (notLoggedIn) notLoggedIn.style.display = 'none';
        if (loggedIn) loggedIn.style.display = 'block';
        setupUserMenuDisplay(authState.user);
      } else {
        if (notLoggedIn) notLoggedIn.style.display = 'block';
        if (loggedIn) loggedIn.style.display = 'none';
      }
    }

    // Setup user menu display
    function setupUserMenuDisplay(user) {
      function getInitials(user) {
        if (user.displayName) {
          const names = user.displayName.split(' ');
          if (names.length >= 2) {
            return (names[0][0] + names[names.length - 1][0]).toUpperCase();
          }
          return names[0][0].toUpperCase();
        } else if (user.email) {
          return user.email[0].toUpperCase();
        }
        return 'U';
      }

      function getDisplayName(user) {
        if (user.displayName) {
          return user.displayName;
        } else if (user.email) {
          const emailName = user.email.split('@')[0];
          return emailName
            .replace(/([A-Z])/g, ' $1')
            .replace(/[._-]/g, ' ')
            .replace(/\b\w/g, l => l.toUpperCase())
            .trim();
        }
        return 'User';
      }

      try {
        const avatarDiv = document.getElementById('user-avatar');
        if (avatarDiv && user) {
          const initials = getInitials(user);
          avatarDiv.textContent = initials;
        }

        const nameSpan = document.getElementById('user-name');
        if (nameSpan && user) {
          const displayName = getDisplayName(user);
          nameSpan.textContent = displayName;
        }
      } catch (error) {
        console.error('Error setting up user menu display:', error);
      }
    }

    // Logout function
    async function logout() {
      try {
        if (auth) {
          const { signOut } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js');
          await signOut(auth);
          window.location.href = '../login.html';
        }
      } catch (error) {
        console.error('Logout failed:', error);
      }
    }

    // Load organizations from Firebase
    async function loadOrganizations() {
      try {
        showLoading(true);
        
        // Ensure Firebase is initialized and user is authenticated
        if (!db) {
          console.log('⏳ Firebase not ready, waiting for auth...');
          await waitForAuth();
        }
        
        // Load KARE organizations
        const organizationsRef = ref(db, 'ppc_kare_25');
        const snapshot = await get(organizationsRef);
        
        if (snapshot.exists()) {
          organizations = Object.entries(snapshot.val()).map(([id, data]) => ({
            id,
            ...data
          }));
          console.log(`✅ Loaded ${organizations.length} KARE organizations`);
        } else {
          showMessage('No organizations found.', 'error');
          return;
        }
        
        // Load CRM data for comparison
        console.log('📊 Loading CRM data for comparison from ppc_crm_index_527...');
        const crmRef = ref(db, 'ppc_crm_index_527');
        
        try {
          const crmSnapshot = await get(crmRef);
          console.log('📊 CRM snapshot exists:', crmSnapshot.exists());
          
          if (crmSnapshot.exists()) {
            const crmRecords = crmSnapshot.val();
            console.log('📊 Raw CRM records:', Object.keys(crmRecords).length, 'keys');
            console.log('📊 Sample CRM record keys:', Object.keys(crmRecords).slice(0, 5));
            
            // Index CRM data by domain for quick lookup
            let domainsIndexed = 0;
            Object.entries(crmRecords).forEach(([id, record]) => {
              if (record && record.domain) {
                const domain = record.domain.toLowerCase().trim();
                crmData[domain] = {
                  id,
                  ...record
                };
                domainsIndexed++;
                
                // Log first few for debugging
                if (domainsIndexed <= 3) {
                  console.log(`📊 Indexed CRM record: domain="${domain}", sales_leader="${record.sales_leader}"`);
                }
              }
            });
            console.log(`✅ Loaded ${Object.keys(crmData).length} CRM records with domains (out of ${Object.keys(crmRecords).length} total)`);
            
            // Log some sample domains from CRM for comparison
            console.log('📊 Sample CRM domains:', Object.keys(crmData).slice(0, 10));
          } else {
            console.log('⚠️ No CRM data found at ppc_crm_index_527');
          }
        } catch (crmError) {
          console.error('❌ Error loading CRM data:', crmError);
          console.log('⚠️ Continuing without CRM comparison');
        }
        
        renderTable();
      } catch (error) {
        console.error('Error loading organizations:', error);
        
        // Check if it's an authentication error
        if (error.message.includes("User must be logged in") || error.message.includes("Permission denied")) {
          showMessage('You must be logged in to access KARE organizations.', 'error');
          
          // Optionally redirect to login after a delay
          setTimeout(() => {
            window.location.href = '../login.html';
          }, 2000);
        } else {
          showMessage('Error loading organizations.', 'error');
        }
      } finally {
        showLoading(false);
      }
    }

    // Check if sales leader is in sync with CRM
    function checkSalesLeaderSync(org) {
      if (!org.domain) return { inSync: true, crmValue: null, crmId: null };
      
      const domain = org.domain.toLowerCase().trim();
      const crmRecord = crmData[domain];
      
      if (!crmRecord) {
        return { inSync: true, crmValue: null, crmId: null, notFound: true };
      }
      
      const kareSalesLeader = (org.sales_leader || '').trim();
      const crmSalesLeader = (crmRecord.sales_leader || '').trim();
      
      return {
        inSync: kareSalesLeader === crmSalesLeader,
        crmValue: crmSalesLeader,
        crmId: crmRecord.id,
        kareValue: kareSalesLeader
      };
    }

    // Render the organizations table
    function renderTable() {
      const tbody = document.getElementById('organizationsTableBody');
      tbody.innerHTML = '';

      console.log(`🎨 Rendering table with ${organizations.length} organizations`);
      console.log(`🎨 CRM data available for ${Object.keys(crmData).length} domains`);

      let outOfSyncCount = 0;
      organizations.forEach((org, index) => {
        const row = document.createElement('tr');
        
        // Check sync status for sales leader
        const syncStatus = checkSalesLeaderSync(org);
        
        // Log first few for debugging
        if (index < 5) {
          console.log(`🎨 Org ${index}: "${org.organization_name}", domain="${org.domain}", KARE sales_leader="${org.sales_leader}", sync status:`, syncStatus);
        }
        
        if (!syncStatus.inSync && !syncStatus.notFound) {
          outOfSyncCount++;
        }
        
        // Build sales leader cell HTML with sync status
        let salesLeaderHtml = `
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'sales_leader', '${(org.sales_leader || '').replace(/'/g, "\\'")}')">
            ${org.sales_leader || ''}
            <i class="fas fa-edit edit-icon"></i>
        `;
        
        if (!syncStatus.inSync && !syncStatus.notFound) {
          salesLeaderHtml += `
            <div style="margin-top: 5px;">
              <span class="sync-status out-of-sync">
                <i class="fas fa-exclamation-triangle"></i> 
                CRM: ${syncStatus.crmValue || 'Empty'}
              </span>
              <button class="btn-sync" onclick="event.stopPropagation(); syncSalesLeaderToCRM('${org.id}', '${(org.sales_leader || '').replace(/'/g, "\\'")}', '${syncStatus.crmId}')">
                <i class="fas fa-sync"></i> Sync to CRM
              </button>
            </div>
          `;
        } else if (syncStatus.inSync && syncStatus.crmValue) {
          salesLeaderHtml += `
            <div style="margin-top: 5px;">
              <span class="sync-status synced">
                <i class="fas fa-check-circle"></i> Synced
              </span>
            </div>
          `;
        }
        
        salesLeaderHtml += '</td>';
        
        // Non-editable fields
        row.innerHTML = `
          <td>${org.organization_name || ''}</td>
          <td>${org.domain || ''}</td>
          <td>${org.bullhorn_id || ''}</td>
          <td>${org.total_beds || ''}</td>
          <td>${org.headquarters || ''}</td>
          <td>${org.customer_type || ''}</td>
          
          <!-- Editable fields -->
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'sam_accounts', '${(org.sam_accounts || '').replace(/'/g, "\\'")}')">
            ${org.sam_accounts || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'category', '${(org.category || '').replace(/'/g, "\\'")}')">
            ${org.category || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
          ${salesLeaderHtml}
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'sales_second', '${(org.sales_second || '').replace(/'/g, "\\'")}')">
            ${org.sales_second || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'executive_leader', '${(org.executive_leader || '').replace(/'/g, "\\'")}')">
            ${org.executive_leader || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'kare_category', '${(org.kare_category || '').replace(/'/g, "\\'")}')">
            ${org.kare_category || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'target_tier', '${(org.target_tier || '').replace(/'/g, "\\'")}')">
            ${org.target_tier || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
          <td class="editable-cell" onclick="openEditModal('${org.id}', 'amc', '${(org.amc || '').replace(/'/g, "\\'")}')">
            ${org.amc || ''}
            <i class="fas fa-edit edit-icon"></i>
          </td>
        `;
        
        tbody.appendChild(row);
      });
      
      console.log(`🎨 Table rendered. ${outOfSyncCount} organizations out of sync.`);
    }

    // Get unique values for a field
    function getUniqueValues(field) {
      const values = new Set();
      organizations.forEach(org => {
        if (org[field]) {
          values.add(org[field]);
        }
      });
      return Array.from(values).sort();
    }

    // Open edit modal
    window.openEditModal = function(organizationId, field, currentValue) {
      currentEdit = {
        organizationId,
        field,
        value: currentValue
      };

      const modal = document.getElementById('editModal');
      const label = document.getElementById('modalFieldLabel');
      const select = document.getElementById('modalSelect');
      const newValueContainer = document.getElementById('newValueContainer');
      const newValueInput = document.getElementById('newValueInput');

      // Set field label
      label.textContent = field.split('_').map(word => 
        word.charAt(0).toUpperCase() + word.slice(1)
      ).join(' ');

      // Get unique values for the field
      const uniqueValues = getUniqueValues(field);
      
      // Clear and populate select options
      select.innerHTML = `
        <option value="">Select a value...</option>
        ${uniqueValues.map(value => `
          <option value="${value}" ${value === currentValue ? 'selected' : ''}>
            ${value}
          </option>
        `).join('')}
        <option value="new">Create New Category</option>
      `;

      // Show/hide new value input based on selection
      select.onchange = function() {
        newValueContainer.style.display = 
          this.value === 'new' ? 'block' : 'none';
      };

      // Show modal
      modal.classList.add('active');
    };

    // Close modal
    window.closeModal = function() {
      const modal = document.getElementById('editModal');
      modal.classList.remove('active');
      currentEdit = {
        organizationId: null,
        field: null,
        value: null
      };
    };

    // Save edit
    window.saveEdit = async function() {
      const select = document.getElementById('modalSelect');
      const newValueInput = document.getElementById('newValueInput');
      
      let newValue = select.value;
      if (newValue === 'new') {
        newValue = newValueInput.value.trim();
        if (!newValue) {
          showMessage('Please enter a new value.', 'error');
          return;
        }
      }

      try {
        showLoading(true);
        
        // Ensure Firebase is initialized
        if (!db) {
          console.log('⏳ Firebase not ready, waiting for auth...');
          await waitForAuth();
        }
        
        const updates = {};
        updates[`ppc_kare_25/${currentEdit.organizationId}/${currentEdit.field}`] = newValue;
        
        await update(ref(db), updates);
        
        // Update local data
        const orgIndex = organizations.findIndex(org => org.id === currentEdit.organizationId);
        if (orgIndex !== -1) {
          organizations[orgIndex][currentEdit.field] = newValue;
          renderTable();
        }
        
        showMessage('Changes saved successfully!', 'success');
        closeModal();
      } catch (error) {
        console.error('Error saving changes:', error);
        showMessage('Error saving changes.', 'error');
      } finally {
        showLoading(false);
      }
    };

    // Sync sales leader to CRM
    window.syncSalesLeaderToCRM = async function(kareOrgId, salesLeader, crmId) {
      if (!confirm(`Update CRM sales leader to "${salesLeader}"?`)) {
        return;
      }

      try {
        showLoading(true);
        
        // Ensure Firebase is initialized
        if (!db) {
          console.log('⏳ Firebase not ready, waiting for auth...');
          await waitForAuth();
        }
        
        console.log(`🔄 Syncing sales leader "${salesLeader}" to CRM record ${crmId}`);
        
        const updates = {};
        updates[`ppc_crm_index_527/${crmId}/sales_leader`] = salesLeader;
        
        await update(ref(db), updates);
        
        // Update local CRM data
        const org = organizations.find(o => o.id === kareOrgId);
        if (org && org.domain) {
          const domain = org.domain.toLowerCase().trim();
          if (crmData[domain]) {
            crmData[domain].sales_leader = salesLeader;
          }
        }
        
        // Re-render table to show updated sync status
        renderTable();
        
        showMessage('✅ Sales leader synced to CRM successfully!', 'success');
      } catch (error) {
        console.error('Error syncing sales leader to CRM:', error);
        showMessage('❌ Error syncing to CRM: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    };

    // Show/hide loading overlay
    function showLoading(show) {
      const overlay = document.getElementById('loadingOverlay');
      overlay.style.display = show ? 'flex' : 'none';
    }

    // Show status message
    function showMessage(message, type) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.textContent = message;
      statusDiv.className = `status-message ${type}`;
      statusDiv.style.display = 'block';
      
      setTimeout(() => {
        statusDiv.style.display = 'none';
      }, 5000);
    }

    // Initialize with authentication
    async function initializeWithAuth() {
      console.log("🔍 === INITIALIZING WITH AUTH DETECTION ===");
      
      try {
        // Wait for Firebase and authentication
        await waitForAuth();
        
        // Set current user
        if (auth && auth.currentUser) {
          currentUser = auth.currentUser;
          console.log("✅ User authenticated:", currentUser.email);
          
          // Update UI to show logged in state
          updateAuthUI({
            isChecking: false,
            isLoggedIn: true,
            isVerified: true,
            user: currentUser
          });
        }
        
        // Load organizations
        await loadOrganizations();
        
      } catch (error) {
        console.error("❌ Authentication error:", error);
        
        // Update UI to show error state
        updateAuthUI({
          isChecking: false,
          isLoggedIn: false,
          isVerified: false,
          user: null
        });
        
        showMessage(error.message, 'error');
        
        // Redirect to login after a delay
        setTimeout(() => {
          window.location.href = '../login.html';
        }, 2000);
      }
    }

    // Make functions available globally immediately
    window.logout = logout;

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM Content Loaded');
      loadHeader();
      
      // Show initial checking state
      updateAuthUI({ isChecking: true });
      
      // Initialize after a short delay to ensure auth.js is ready
      setTimeout(async () => {
        console.log("⏰ Starting initialization with authentication...");
        await initializeWithAuth();
      }, 1000);
    });
  </script>
</body>
