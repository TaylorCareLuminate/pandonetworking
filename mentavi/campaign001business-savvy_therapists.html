<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentavi - Campaign 001: Business-Savvy Therapists</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/main.css" />
  
  <!-- HealthLuminate Centralized Auth System -->
  <script src="../js/auth.js"></script>
  <!-- Delay folder protection to allow Firebase to initialize -->
  <script>
    // Prevent auto-protection from folder-protection.js
    window._skipAutoProtect = true;
  </script>
  <script src="../js/folder-protection.js"></script>
  
  <style>
    /* Campaign Review Specific Styles */
    .campaign-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .campaign-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--blue);
    }


    .campaign-header h1 {
      color: var(--dark-blue);
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .campaign-header .subtitle {
      color: var(--gray);
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .sort-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .sort-controls label {
      font-weight: 600;
      color: var(--dark-blue);
    }

    .sort-select {
      padding: 0.5rem 1rem;
      border: 2px solid var(--blue);
      border-radius: 5px;
      background: white;
      color: var(--dark-blue);
      font-size: 1rem;
      cursor: pointer;
    }

    .stats-display {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--blue);
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--gray);
    }

    .organizations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .org-card {
      background: #fff;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .org-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border-color: var(--blue);
    }

    .org-card.high-score {
      border-left: 5px solid #28a745;
    }

    .org-card.medium-score {
      border-left: 5px solid #6c757d;
    }

    .org-card.low-score {
      border-left: 5px solid #adb5bd;
    }

    .org-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .org-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--dark-blue);
      margin: 0;
      flex: 1;
      margin-right: 1rem;
    }

    .score-badge {
      background: var(--blue);
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      min-width: 50px;
      text-align: center;
    }

    .score-badge.high {
      background: #28a745;
    }

    .score-badge.medium {
      background: #6c757d;
      color: #fff;
    }

    .score-badge.low {
      background: #adb5bd;
      color: #fff;
    }

    .org-details {
      margin-bottom: 1rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding: 0.3rem 0;
    }

    .detail-label {
      font-weight: 600;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .detail-value {
      color: var(--dark-blue);
      font-weight: 500;
    }

    .domain-link {
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
    }

    .domain-link:hover {
      text-decoration: underline;
    }

    .rating-display {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .stars {
      color: #ffc107;
    }

    .rating-text {
      font-weight: 600;
    }

    .advertising-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .advertising-badge.active {
      background: #d4edda;
      color: #155724;
    }

    .advertising-badge.inactive {
      background: #f8d7da;
      color: #721c24;
    }

    .description-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
    }

    .description-item {
      margin-bottom: 1rem;
    }

    .description-title {
      font-weight: bold;
      color: var(--dark-blue);
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .description-text {
      color: var(--gray);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .expandable-section {
      margin-bottom: 1rem;
    }

    .expandable-header {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
      transition: all 0.3s ease;
    }

    .expandable-header:hover {
      background-color: #f8f9fa;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      border-radius: 4px;
    }

    .expandable-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0;
    }

    .expandable-content.expanded {
      max-height: 500px;
      padding: 1rem 0;
    }

    .expand-icon {
      transition: transform 0.3s ease;
      color: var(--blue);
    }

    .expand-icon.rotated {
      transform: rotate(180deg);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--gray);
      font-size: 1.2rem;
    }

    .error {
      text-align: center;
      padding: 2rem;
      color: #dc3545;
      background: #f8d7da;
      border-radius: 8px;
      margin: 1rem 0;
    }

    .no-data {
      text-align: center;
      padding: 3rem;
      color: var(--gray);
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .campaign-container {
        padding: 1rem;
      }
      
      .controls-section {
        flex-direction: column;
        gap: 1rem;
        align-items: stretch;
      }
      
      .organizations-grid {
        grid-template-columns: 1fr;
      }
      
      .org-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      
      .stats-display {
        justify-content: space-around;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="campaign-container">
    <div class="campaign-header">
      <h1><i class="fas fa-users-medical"></i> Campaign 001: Business-Savvy Therapists</h1>
      <p class="subtitle">Prospect Organizations Review - California & Oregon</p>
    </div>

    <div class="controls-section">
      <div class="sort-controls">
        <label for="sortSelect"><i class="fas fa-sort"></i> Sort by:</label>
        <select id="sortSelect" class="sort-select">
          <option value="score-desc">Score (Highest First)</option>
          <option value="score-asc">Score (Lowest First)</option>
          <option value="rating-desc">Rating (Highest First)</option>
          <option value="rating-asc">Rating (Lowest First)</option>
          <option value="name-asc">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
          <option value="locations-desc">Locations (Most First)</option>
        </select>
      </div>
      
      <div class="stats-display">
        <div class="stat-item">
          <div class="stat-number" id="totalOrgs">-</div>
          <div class="stat-label">Total Organizations</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="avgScore">-</div>
          <div class="stat-label">Average Score</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="activeAds">-</div>
          <div class="stat-label">Active Advertisers</div>
        </div>
      </div>
    </div>

    <div id="loadingMessage" class="loading">
      <i class="fas fa-spinner fa-spin"></i> Loading prospect organizations...
    </div>

    <div id="errorMessage" class="error" style="display: none;">
      <i class="fas fa-exclamation-triangle"></i> <span id="errorText"></span>
    </div>

    <div id="organizationsContainer" class="organizations-grid" style="display: none;">
      <!-- Organizations will be populated here -->
    </div>

    <div id="noDataMessage" class="no-data" style="display: none;">
      <i class="fas fa-inbox"></i><br>
      No prospect organizations found in the database.
    </div>
  </div>

  <script type="module">
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

    let organizations = [];
    let currentSort = 'score-desc';

    // Wait for Firebase to be ready
    async function initializePage() {
      try {
        console.log('Waiting for Firebase to be ready...');
        await window.firebaseReady;
        console.log('Firebase is ready, loading data...');
        
        // Check folder access first
        await checkFolderAccess();
        
        // Load organizations data
        await loadOrganizations();
        
      } catch (error) {
        console.error('Error initializing page:', error);
        showError('Failed to initialize page: ' + error.message);
      }
    }

    async function checkFolderAccess() {
      try {
        // Import Firestore functions for folder permission check
        const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js');
        
        const db = getFirestore(window.firebaseApp);
        const folderDoc = await getDoc(doc(db, 'folderPermissions', 'mentavi'));
        
        if (!folderDoc.exists()) {
          throw new Error('Folder permissions not configured');
        }
        
        const permissions = folderDoc.data();
        const userEmail = window.auth.currentUser?.email;
        const userDomain = userEmail ? userEmail.split('@')[1] : '';
        
        if (!permissions.allowedDomains || !permissions.allowedDomains.includes(userDomain)) {
          throw new Error('Access denied for this domain');
        }
        
        console.log('Folder access verified for:', userDomain);
      } catch (error) {
        console.error('Folder access check failed:', error);
        throw new Error('Access verification failed: ' + error.message);
      }
    }

    async function loadOrganizations() {
      try {
        const rtdb = getDatabase(window.firebaseApp);
        const dataRef = ref(rtdb, 'mentavi/review/campaign1_wa');
        const snapshot = await get(dataRef);
        
        if (!snapshot.exists()) {
          showNoData();
          return;
        }
        
        const data = snapshot.val();
        console.log('Raw data loaded:', data);
        
        // Convert object to array if needed
        if (typeof data === 'object' && !Array.isArray(data)) {
          organizations = Object.values(data);
        } else if (Array.isArray(data)) {
          organizations = data;
        } else {
          throw new Error('Unexpected data format');
        }
        
        // Filter out any null/undefined entries
        organizations = organizations.filter(org => org && org.names);
        
        console.log('Processed organizations:', organizations.length);
        
        if (organizations.length === 0) {
          showNoData();
          return;
        }
        
        // Update statistics
        updateStatistics();
        
        // Sort and display organizations
        sortOrganizations(currentSort);
        displayOrganizations();
        
        // Hide loading message and show content
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('organizationsContainer').style.display = 'grid';
        
      } catch (error) {
        console.error('Error loading organizations:', error);
        showError('Failed to load organizations: ' + error.message);
      }
    }

    function updateStatistics() {
      const totalOrgs = organizations.length;
      const avgScore = totalOrgs > 0 ? Math.round(organizations.reduce((sum, org) => sum + (parseFloat(org.score) || 0), 0) / totalOrgs) : 0;
      const activeAds = organizations.filter(org => org.advertising_rating === '1').length;
      
      document.getElementById('totalOrgs').textContent = totalOrgs;
      document.getElementById('avgScore').textContent = avgScore;
      document.getElementById('activeAds').textContent = activeAds;
    }

    function sortOrganizations(sortType) {
      currentSort = sortType;
      
      organizations.sort((a, b) => {
        switch (sortType) {
          case 'score-desc':
            return (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0);
          case 'score-asc':
            return (parseFloat(a.score) || 0) - (parseFloat(b.score) || 0);
          case 'rating-desc':
            return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0);
          case 'rating-asc':
            return (parseFloat(a.rating) || 0) - (parseFloat(b.rating) || 0);
          case 'name-asc':
            return (a.names || '').localeCompare(b.names || '');
          case 'name-desc':
            return (b.names || '').localeCompare(a.names || '');
          case 'locations-desc':
            return (parseInt(b.num_locations) || 0) - (parseInt(a.num_locations) || 0);
          default:
            return 0;
        }
      });
    }

    function displayOrganizations() {
      const container = document.getElementById('organizationsContainer');
      container.innerHTML = '';
      
      organizations.forEach(org => {
        const card = createOrganizationCard(org);
        container.appendChild(card);
      });
    }

    function createOrganizationCard(org) {
      const card = document.createElement('div');
      const score = parseFloat(org.score) || 0;
      const rating = parseFloat(org.rating) || 0;
      
      // Determine score class
      let scoreClass = 'low-score';
      let scoreBadgeClass = 'low';
      if (score >= 80) {
        scoreClass = 'high-score';
        scoreBadgeClass = 'high';
      } else if (score >= 60) {
        scoreClass = 'medium-score';
        scoreBadgeClass = 'medium';
      }
      
      card.className = `org-card ${scoreClass}`;
      
      // Generate stars for rating
      const stars = generateStars(rating);
      
      // Format domain as clickable link
      const domainLink = org.domain ? 
        `<a href="https://${org.domain}" target="_blank" class="domain-link">${org.domain}</a>` : 
        'Not available';
      
      // Advertising status
      const isAdvertising = org.advertising_rating === '1';
      const advertisingBadge = `
        <span class="advertising-badge ${isAdvertising ? 'active' : 'inactive'}">
          <i class="fas fa-${isAdvertising ? 'bullhorn' : 'ban'}"></i>
          ${isAdvertising ? 'Advertising' : 'Not Advertising'}
        </span>
      `;
      
      card.innerHTML = `
        <div class="org-header">
          <h3 class="org-name">${org.names || 'Unknown Organization'}</h3>
          <span class="score-badge ${scoreBadgeClass}">${score}</span>
        </div>
        
        <div class="org-details">
          <div class="detail-row">
            <span class="detail-label"><i class="fas fa-globe"></i> Domain:</span>
            <span class="detail-value">${domainLink}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label"><i class="fas fa-map-marker-alt"></i> Locations:</span>
            <span class="detail-value">${org.num_locations || 0}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label"><i class="fas fa-star"></i> Rating:</span>
            <span class="detail-value">
              <div class="rating-display">
                <span class="stars">${stars}</span>
                <span class="rating-text">${rating.toFixed(1)}</span>
                <span class="detail-label">(${org.user_ratings_total || 0} reviews)</span>
              </div>
            </span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label"><i class="fas fa-bullhorn"></i> Advertising:</span>
            <span class="detail-value">${advertisingBadge}</span>
          </div>
        </div>
        
        <div class="description-section">
          ${org.specialty ? `
            <div class="expandable-section">
              <div class="expandable-header" onclick="toggleSection(this)">
                <div class="description-title">
                  <i class="fas fa-stethoscope"></i> Specialty Background
                </div>
                <i class="fas fa-chevron-down expand-icon"></i>
              </div>
              <div class="expandable-content">
                <div class="description-text">${org.specialty}</div>
              </div>
            </div>
          ` : ''}
          
          ${org.leadership ? `
            <div class="expandable-section">
              <div class="expandable-header" onclick="toggleSection(this)">
                <div class="description-title">
                  <i class="fas fa-users"></i> Leadership
                </div>
                <i class="fas fa-chevron-down expand-icon"></i>
              </div>
              <div class="expandable-content">
                <div class="description-text">${org.leadership}</div>
              </div>
            </div>
          ` : ''}
          
          ${isAdvertising && org.advertising ? `
            <div class="expandable-section">
              <div class="expandable-header" onclick="toggleSection(this)">
                <div class="description-title">
                  <i class="fas fa-ad"></i> Advertising Details
                </div>
                <i class="fas fa-chevron-down expand-icon"></i>
              </div>
              <div class="expandable-content">
                <div class="description-text">${org.advertising}</div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
      
      return card;
    }

    function generateStars(rating) {
      const fullStars = Math.floor(rating);
      const hasHalfStar = rating % 1 >= 0.5;
      const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
      
      let stars = '';
      
      // Full stars
      for (let i = 0; i < fullStars; i++) {
        stars += '<i class="fas fa-star"></i>';
      }
      
      // Half star
      if (hasHalfStar) {
        stars += '<i class="fas fa-star-half-alt"></i>';
      }
      
      // Empty stars
      for (let i = 0; i < emptyStars; i++) {
        stars += '<i class="far fa-star"></i>';
      }
      
      return stars;
    }

    function showError(message) {
      document.getElementById('loadingMessage').style.display = 'none';
      document.getElementById('errorText').textContent = message;
      document.getElementById('errorMessage').style.display = 'block';
    }

    function showNoData() {
      document.getElementById('loadingMessage').style.display = 'none';
      document.getElementById('noDataMessage').style.display = 'block';
    }

    // Event listeners
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      sortOrganizations(e.target.value);
      displayOrganizations();
    });

    // Toggle expandable sections
    window.toggleSection = function(headerElement) {
      const content = headerElement.nextElementSibling;
      const icon = headerElement.querySelector('.expand-icon');
      
      if (content.classList.contains('expanded')) {
        content.classList.remove('expanded');
        icon.classList.remove('rotated');
      } else {
        content.classList.add('expanded');
        icon.classList.add('rotated');
      }
    };

    // Initialize the page when DOM is loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializePage);
    } else {
      initializePage();
    }
  </script>
</body>
</html>
