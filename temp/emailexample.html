<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Max Hanner Case Study</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f9fafb; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh;
    }
    button {
      background: #1a365d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 1em 2em;
      font-size: 1.2em;
      cursor: pointer;
      margin-top: 2em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    .instructions {
      margin-top: 2em;
      color: #555;
      font-size: 1em;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Example Case Study Email</h1>
  <button id="sendCaseStudyBtn">Send Email & Copy Case Study</button>
  <div class="instructions">
    After clicking, an email will open and the case study will be copied to your clipboard.<br>
    <strong>Just press <kbd>Ctrl+V</kbd> (or <kbd>Cmd+V</kbd> on Mac) to paste it in the email!</strong>
  </div>

  <!-- Hidden image of the case study (replace the src with your actual case study image) -->
  <img id="caseStudyImg" src="https://healthluminate.com/images/ppcmetrocasestudy.png" alt="Case Study" style="display:none;">

  <script>
    document.getElementById('sendCaseStudyBtn').onclick = async function() {
      // 1. Open the email draft
      window.location.href = "mailto:max.hanner@highspring.com?subject=Test%20Email&body=Hi%20Max.%20Here%20is%20the%20case%20study";

      // 2. Copy the case study image to the clipboard
      try {
        const img = document.getElementById('caseStudyImg');
        const response = await fetch(img.src);
        const blob = await response.blob();
        await navigator.clipboard.write([
          new ClipboardItem({ [blob.type]: blob })
        ]);
        alert("Case study copied to clipboard--you can paste it into the email now.");
      } catch (err) {
        alert("Could not copy the case study to clipboard. (This feature works best in Chrome/Edge/Safari/Firefox and may require HTTPS.)");
      }
    };
  </script>
</body>
</html>
