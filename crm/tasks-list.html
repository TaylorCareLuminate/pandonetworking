<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Pando CRM</title>
  <link rel="icon" type="image/png" href="../images/pando_trees_transparent.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #12314C;
      --secondary: #4E6E4A;
      --accent: #B9A77E;
      --danger: #e76f51;
      --success: #4E6E4A;
      --warning: #B9A77E;
      --light-blue: rgba(18, 49, 76, 0.07);
      --light-green: rgba(148, 173, 130, 0.16);
      --border: #e0e0e0;
      --text-primary: #263238;
      --text-secondary: #666;
      --gray: #9e9e9e;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.07);
      --border-radius: 10px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #F6F4EF;
      color: var(--text-primary);
      line-height: 1.6;
    }
    
    /* Header */
    header {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
      color: white;
    }
    
    .page-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    
    .btn-primary {
      background: var(--secondary);
      color: white;
    }
    
    .btn-primary:hover {
      background: #238276;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: white;
      color: var(--primary);
    }
    
    .btn-secondary:hover {
      background: #f0f0f0;
    }
    
    .btn-icon {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 12px;
    }
    
    .btn-icon:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }
    
    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    
    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    
    .stat-icon.overdue {
      background: #fee;
      color: var(--danger);
    }
    
    .stat-icon.today {
      background: #fff4e6;
      color: var(--warning);
    }
    
    .stat-icon.week {
      background: #e8f5e9;
      color: var(--success);
    }
    
    .stat-icon.total {
      background: #e3f2fd;
      color: var(--primary);
    }
    
    .stat-info h3 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 4px;
    }
    
    .stat-info p {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    /* Filters */
    .filters-bar {
      background: white;
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .filter-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    
    .filter-toggle button {
      padding: 8px 16px;
      border: none;
      background: white;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .filter-toggle button:not(:last-child) {
      border-right: 1px solid var(--border);
    }
    
    .filter-toggle button.active {
      background: var(--primary);
      color: white;
    }
    
    .filter-toggle button:hover:not(.active) {
      background: #f5f5f5;
    }
    
    select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      background: white;
      cursor: pointer;
    }
    
    /* Task Sections */
    .task-section {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    .section-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .section-header:hover {
      background: #f9fafb;
    }
    
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    
    .section-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    
    .section-icon.overdue {
      background: #fee;
      color: var(--danger);
    }
    
    .section-icon.today {
      background: #fff4e6;
      color: var(--warning);
    }
    
    .section-icon.week {
      background: #e8f5e9;
      color: var(--success);
    }
    
    .section-icon.later {
      background: #f5f5f5;
      color: var(--gray);
    }
    
    .section-icon.completed {
      background: #e8f5e9;
      color: var(--success);
    }
    
    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--light-blue);
      color: var(--primary);
    }
    
    .chevron {
      transition: transform 0.3s;
    }
    
    .section-content {
      border-top: 1px solid var(--border);
      max-height: 2000px;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    
    .task-section.collapsed .section-content {
      max-height: 0;
      border-top: none;
    }
    
    .task-section.collapsed .chevron {
      transform: rotate(-90deg);
    }
    
    /* Task Card */
    .task-card {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    
    .task-card:last-child {
      border-bottom: none;
    }
    
    .task-card:hover {
      background: #f9fafb;
    }
    
    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    
    .task-checkbox {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-top: 4px;
    }
    
    .task-checkbox:hover {
      border-color: var(--success);
      background: #f4faef;
    }
    
    .task-checkbox.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    
    .task-content {
      flex: 1;
    }
    
    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    
    .task-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      flex: 1;
    }
    
    .task-title:hover {
      color: var(--secondary);
    }
    
    .task-priority {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .priority-high {
      background: #fee;
      color: var(--danger);
    }
    
    .priority-medium {
      background: #fff4e6;
      color: var(--warning);
    }
    
    .priority-low {
      background: #f5f5f5;
      color: var(--gray);
    }
    
    .task-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .task-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .task-meta-item i {
      color: var(--gray);
    }
    
    .task-context {
      background: var(--light-blue);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .action-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .action-btn:hover {
      border-color: var(--secondary);
      color: var(--secondary);
      background: var(--light-blue);
    }
    
    .action-btn.primary {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }
    
    .action-btn.primary:hover {
      background: #238276;
    }
    
    /* Empty State */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-secondary);
    }
    
    .empty-state i {
      font-size: 4rem;
      color: var(--gray);
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 1.25rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .empty-state p {
      font-size: 0.95rem;
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    
    .loading i {
      font-size: 3rem;
      color: var(--primary);
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s;
    }
    
    .modal.show {
      display: flex;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal-content {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s;
    }
    
    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .modal-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .modal-header h3 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }
    
    .modal-header h3 i {
      color: var(--secondary);
    }
    
    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .close-btn:hover {
      color: var(--danger);
      transform: rotate(90deg);
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    
    .form-label i {
      color: var(--secondary);
      margin-right: 6px;
    }
    
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.1);
    }
    
    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .filters-bar {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-group {
        flex-direction: column;
        align-items: stretch;
      }
      
      .task-header {
        flex-direction: column;
      }
      
      .task-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .modal-content {
        width: 95%;
        margin: 20px;
      }
    }
  </style>
</head>
<body>
  
  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="header-left">
        <a href="mainpage.html" class="logo">
          <i class="fas fa-heartbeat"></i> HealthLuminate
        </a>
        <div class="page-title">
          <i class="fas fa-tasks"></i>
          <span>My Tasks</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon" onclick="window.location.href='mainpage.html'" title="Back to Dashboard">
          <i class="fas fa-arrow-left"></i>
        </button>
        <button class="btn btn-primary" onclick="openNewTaskModal()">
          <i class="fas fa-plus"></i> New Task
        </button>
      </div>
    </div>
  </header>
  
  <!-- Main Content -->
  <div class="container">
    
    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-icon overdue">
          <i class="fas fa-exclamation-circle"></i>
        </div>
        <div class="stat-info">
          <h3 id="statOverdue">0</h3>
          <p>Overdue</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon today">
          <i class="fas fa-calendar-day"></i>
        </div>
        <div class="stat-info">
          <h3 id="statToday">0</h3>
          <p>Due Today</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon week">
          <i class="fas fa-calendar-week"></i>
        </div>
        <div class="stat-info">
          <h3 id="statWeek">0</h3>
          <p>This Week</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon total">
          <i class="fas fa-list-check"></i>
        </div>
        <div class="stat-info">
          <h3 id="statTotal">0</h3>
          <p>Total Open</p>
        </div>
      </div>
    </div>
    
    <!-- Filters -->
    <div class="filters-bar">
      <div class="filter-group">
        <div class="filter-toggle">
          <button class="active" onclick="setViewMode('my')">
            <i class="fas fa-user"></i> My Tasks
          </button>
          <button onclick="setViewMode('all')">
            <i class="fas fa-users"></i> All Tasks
          </button>
        </div>
        <select id="priorityFilter" onchange="applyFilters()">
          <option value="all">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>
        <select id="accountFilter" onchange="applyFilters()">
          <option value="all">All Accounts</option>
        </select>
      </div>
      <div class="filter-group">
        <span style="color: var(--text-secondary); font-size: 0.9rem;" id="taskCount">Loading...</span>
      </div>
    </div>
    
    <!-- Loading State -->
    <div id="loadingState" class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p style="margin-top: 16px;">Loading your tasks...</p>
    </div>
    
    <!-- Task Sections Container -->
    <div id="tasksContainer" style="display: none;">
      
      <!-- Overdue Section -->
      <div class="task-section" id="overdueSection">
        <div class="section-header" onclick="toggleSection('overdueSection')">
          <div class="section-title">
            <div class="section-icon overdue">
              <i class="fas fa-exclamation-circle"></i>
            </div>
            <span>Overdue</span>
            <span class="badge" id="overdueBadge">0</span>
          </div>
          <i class="fas fa-chevron-down chevron"></i>
        </div>
        <div class="section-content" id="overdueContent">
          <!-- Tasks loaded here -->
        </div>
      </div>
      
      <!-- Due Today Section -->
      <div class="task-section" id="todaySection">
        <div class="section-header" onclick="toggleSection('todaySection')">
          <div class="section-title">
            <div class="section-icon today">
              <i class="fas fa-calendar-day"></i>
            </div>
            <span>Due Today</span>
            <span class="badge" id="todayBadge">0</span>
          </div>
          <i class="fas fa-chevron-down chevron"></i>
        </div>
        <div class="section-content" id="todayContent">
          <!-- Tasks loaded here -->
        </div>
      </div>
      
      <!-- This Week Section -->
      <div class="task-section" id="weekSection">
        <div class="section-header" onclick="toggleSection('weekSection')">
          <div class="section-title">
            <div class="section-icon week">
              <i class="fas fa-calendar-week"></i>
            </div>
            <span>This Week</span>
            <span class="badge" id="weekBadge">0</span>
          </div>
          <i class="fas fa-chevron-down chevron"></i>
        </div>
        <div class="section-content" id="weekContent">
          <!-- Tasks loaded here -->
        </div>
      </div>
      
      <!-- Later Section -->
      <div class="task-section collapsed" id="laterSection">
        <div class="section-header" onclick="toggleSection('laterSection')">
          <div class="section-title">
            <div class="section-icon later">
              <i class="fas fa-calendar-alt"></i>
            </div>
            <span>Later</span>
            <span class="badge" id="laterBadge">0</span>
          </div>
          <i class="fas fa-chevron-down chevron"></i>
        </div>
        <div class="section-content" id="laterContent">
          <!-- Tasks loaded here -->
        </div>
      </div>
      
      <!-- Completed Section -->
      <div class="task-section collapsed" id="completedSection">
        <div class="section-header" onclick="toggleSection('completedSection')">
          <div class="section-title">
            <div class="section-icon completed">
              <i class="fas fa-check-circle"></i>
            </div>
            <span>Completed</span>
            <span class="badge" id="completedBadge">0</span>
          </div>
          <i class="fas fa-chevron-down chevron"></i>
        </div>
        <div class="section-content" id="completedContent">
          <!-- Tasks loaded here -->
        </div>
      </div>
      
    </div>
    
  </div>
  
  <!-- New Task Modal -->
  <div id="newTaskModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>
          <i class="fas fa-plus-circle"></i>
          Create New Task
        </h3>
        <button class="close-btn" onclick="closeNewTaskModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="modal-body">
        <form id="newTaskForm" onsubmit="saveNewTask(event)">
          
          <!-- Account Selection -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-building"></i> Account *
            </label>
            <select id="taskAccount" class="form-control" required>
              <option value="">Select an account...</option>
            </select>
          </div>
          
          <!-- Task Title -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-heading"></i> Task Title *
            </label>
            <input type="text" id="taskSubject" class="form-control" 
                   placeholder="What needs to be done?" required>
          </div>
          
          <!-- Due Date and Priority Row -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">
                <i class="fas fa-calendar"></i> Due Date *
              </label>
              <input type="date" id="taskDueDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">
                <i class="fas fa-flag"></i> Priority *
              </label>
              <select id="taskPriority" class="form-control" required>
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

          <!-- Assignee -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-user"></i> Assign To *
            </label>
            <select id="taskAssignee" class="form-control" required>
              <option value="">Select assignee...</option>
            </select>
          </div>
          
          <!-- Description/Notes -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-align-left"></i> Description
            </label>
            <textarea id="taskDescription" class="form-control" 
                      placeholder="Additional details about this task..." 
                      rows="4"></textarea>
          </div>
          
          <!-- Footer Buttons -->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeNewTaskModal()">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Create Task
            </button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
  
  <!-- Firebase & Scripts -->
  <script type="module">
    // Import Firebase
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, get, update, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBpsxZCSULnandhpdVLI9nvsxd3_BH4dfs",
      authDomain: "healthcareitdatabase.firebaseapp.com",
      databaseURL: "https://healthcareitdatabase-default-rtdb.firebaseio.com",
      projectId: "healthcareitdatabase",
      storageBucket: "healthcareitdatabase.firebasestorage.app",
      messagingSenderId: "1024935247661",
      appId: "1:1024935247661:web:a74be5c7b9df74245bdda4"
    };

    // Initialize Firebase - check for existing app to prevent conflicts with /connect pages
    const existingApps = getApps();
    const existingApp = existingApps.find(a => a.name === '[DEFAULT]');
    const app = existingApp || initializeApp(firebaseConfig);
    
    if (existingApp) {
      console.log('✅ Using existing Firebase [DEFAULT] app (multi-directory compatibility)');
    } else {
      console.log('🔥 Initializing new Firebase [DEFAULT] app');
    }
    
    const db = getDatabase(app);
    const auth = getAuth(app);
    
    // Expose to window
    window.db = db;
    window.auth = auth;
    window.ref = ref;
    window.get = get;
    window.update = update;
    window.push = push;
    
    // Global variables
    let currentUser = null;
    let viewMode = 'my'; // 'my' or 'all'
    let allTasks = [];
    let accounts = {}; // Cache account data
    
    // Wait for auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        console.log('✅ Authenticated:', user.email);
        loadTasks();
      } else {
        console.log('❌ Not authenticated, redirecting...');
        window.location.href = '../login.html';
      }
    });
    
    // Load all tasks
    async function loadTasks() {
      try {
        console.log('📋 Loading tasks...');
        
        const tasks = [];
        const leadsRef = ref(db, 'hccrm/leads');
        const leadsSnapshot = await get(leadsRef);
        
        if (leadsSnapshot.exists()) {
          leadsSnapshot.forEach(leadSnapshot => {
            const accountId = leadSnapshot.key;
            const accountData = leadSnapshot.val();
            const accountName = accountData.organization?.name || 'Unnamed Account';
            const accountStage = accountData.stage || 'Unknown';
            const accountOwner = accountData.assignedSalesContact?.email || '';
            
            // Cache account info
            accounts[accountId] = {
              name: accountName,
              stage: accountStage,
              owner: accountOwner
            };
            
            const notes = accountData.notes || {};
            
            // Extract tasks from notes
            Object.entries(notes).forEach(([noteId, note]) => {
              if (note.type === 'Task' || note.type === 'task') {
                // Only include open tasks or recently completed (this week)
                const isCompleted = note.status === 'completed' || note.status === 'Completed';
                const completedThisWeek = isCompleted && note.completedAt && 
                  (Date.now() - new Date(note.completedAt).getTime()) < 7 * 24 * 60 * 60 * 1000;
                
                if (!isCompleted || completedThisWeek) {
                  tasks.push({
                    id: noteId,
                    taskType: 'activity',
                    accountId: accountId,
                    accountName: accountName,
                    accountStage: accountStage,
                    accountOwner: accountOwner,
                    title: note.subject || 'Untitled Task',
                    description: note.content || '',
                    dueDate: note.dueDate || note.date,
                    assignee: note.assignee || note.createdBy || 'Unassigned',
                    status: note.status || 'Open',
                    priority: note.priority || 'medium',
                    createdAt: note.createdAt || note.date,
                    completedAt: note.completedAt || null,
                    contacts: note.contacts || [],
                    lastActivity: getLastActivityDate(accountData.notes, noteId)
                  });
                }
              }
            });
            
            // Extract document tasks
            const opportunities = accountData.opportunities || {};
            Object.entries(opportunities).forEach(([oppId, opp]) => {
              const oppDocuments = opp.documents || {};
              
              Object.entries(oppDocuments).forEach(([docId, doc]) => {
                const docTask = createDocumentTask(doc, docId, oppId, accountId, accountName, accountStage, accountOwner);
                if (docTask) tasks.push(docTask);
              });
              
              // Check if opportunity itself is a document
              if (opp.type || opp.formData || opp.pdfBase64) {
                const docTask = createDocumentTask(opp, oppId, oppId, accountId, accountName, accountStage, accountOwner);
                if (docTask) tasks.push(docTask);
              }
            });
            
            // Check account-level documents
            const accountDocs = accountData.documents || {};
            Object.entries(accountDocs).forEach(([docId, doc]) => {
              const docTask = createDocumentTask(doc, docId, null, accountId, accountName, accountStage, accountOwner);
              if (docTask) tasks.push(docTask);
            });
          });
        }
        
        // Also check for documents at the root "deals", "contracts", "documents", "invoices" level
        console.log('🔍 Checking for documents in alternative paths...');
        const altPaths = ['hccrm/deals', 'hccrm/contracts', 'hccrm/documents', 'hccrm/invoices'];
        
        for (const path of altPaths) {
          try {
            const altRef = ref(db, path);
            const altSnapshot = await get(altRef);
            if (altSnapshot.exists()) {
              console.log(`✅ Found documents at ${path}`);
              altSnapshot.forEach(item => {
                const data = item.val();
                const accountId = data.accountId || 'unknown';
                const accountName = data.accountName || data.formData?.clientCompany || 'Unknown';
                const accountOwner = accounts[accountId]?.owner || data.createdBy || '';
                
                const docTask = createDocumentTask(data, item.key, null, accountId, accountName, '', accountOwner);
                if (docTask) {
                  console.log(`  📄 Adding task for document: ${docTask.title}`);
                  tasks.push(docTask);
                }
              });
            }
          } catch (err) {
            console.log(`  ℹ️  No data at ${path}`);
          }
        }
        
        allTasks = tasks;
        console.log(`✅ Loaded ${tasks.length} tasks total (including ${tasks.filter(t => t.taskType === 'document').length} document tasks)`);
        
        // Populate account filter
        populateAccountFilter();
        
        // Apply filters and render
        applyFilters();
        
        // Show content, hide loading
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('tasksContainer').style.display = 'block';
        
      } catch (error) {
        console.error('❌ Error loading tasks:', error);
        document.getElementById('loadingState').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error Loading Tasks</h3>
            <p>Please refresh the page to try again.</p>
          </div>
        `;
      }
    }
    
    // Create document task from document data
    function createDocumentTask(doc, docId, oppId, accountId, accountName, accountStage, accountOwner) {
      if (!doc.status || doc.status === 'signed') return null; // Don't show completed documents
      
      let title, priority, dueDate;
      const createdDate = new Date(doc.createdAt);
      const daysSinceCreated = Math.floor((Date.now() - createdDate.getTime()) / (1000 * 60 * 60 * 24));
      
      // Determine task details based on document status
      if (doc.status === 'draft') {
        title = `Complete ${(doc.type || 'document').toUpperCase()} for ${doc.formData?.clientCompany || accountName}`;
        priority = daysSinceCreated > 3 ? 'high' : 'medium';
        // No specific due date for drafts, but flag old ones
        dueDate = daysSinceCreated > 7 ? createdDate.toISOString().split('T')[0] : null;
      } else if (doc.status === 'sent') {
        title = `Follow up on ${(doc.type || 'document').toUpperCase()} sent to ${doc.formData?.clientCompany || accountName}`;
        priority = daysSinceCreated > 5 ? 'high' : 'medium';
        // Set due date 7 days after sending
        const followUpDate = new Date(createdDate);
        followUpDate.setDate(followUpDate.getDate() + 7);
        dueDate = followUpDate.toISOString().split('T')[0];
      } else if (doc.status === 'sent_for_signature') {
        title = `Get signature on ${(doc.type || 'document').toUpperCase()} from ${doc.formData?.clientCompany || accountName}`;
        priority = daysSinceCreated > 3 ? 'high' : 'medium';
        // Urgent - expecting signature within 3-5 days
        const signatureDate = new Date(doc.sentAt || doc.createdAt);
        signatureDate.setDate(signatureDate.getDate() + 3);
        dueDate = signatureDate.toISOString().split('T')[0];
      } else {
        return null; // Other statuses don't need tasks
      }
      
      return {
        id: docId,
        taskType: 'document',
        documentType: doc.type,
        documentStatus: doc.status,
        opportunityId: oppId,
        accountId: accountId,
        accountName: accountName,
        accountStage: accountStage,
        accountOwner: accountOwner,
        title: title,
        description: `Document value: $${doc.formData?.contractValue || 'Unknown'}`,
        dueDate: dueDate,
        assignee: doc.createdBy || accountOwner || 'Unassigned',
        status: 'Open',
        priority: priority,
        createdAt: doc.createdAt,
        completedAt: null,
        lastActivity: createdDate
      };
    }
    
    // Get last activity date for an account (excluding the task itself)
    function getLastActivityDate(notes, excludeNoteId) {
      if (!notes) return null;
      
      let lastDate = null;
      Object.entries(notes).forEach(([noteId, note]) => {
        if (noteId !== excludeNoteId && note.date) {
          const noteDate = new Date(note.date);
          if (!lastDate || noteDate > lastDate) {
            lastDate = noteDate;
          }
        }
      });
      
      return lastDate;
    }
    
    // Populate account filter dropdown
    function populateAccountFilter() {
      const select = document.getElementById('accountFilter');
      const uniqueAccounts = [...new Set(allTasks.map(t => t.accountName))].sort();
      
      select.innerHTML = '<option value="all">All Accounts</option>' +
        uniqueAccounts.map(name => `<option value="${name}">${name}</option>`).join('');
    }
    
    // Apply filters
    window.applyFilters = function() {
      const priorityFilter = document.getElementById('priorityFilter').value;
      const accountFilter = document.getElementById('accountFilter').value;
      
      let filtered = allTasks.filter(task => {
        // View mode filter (my vs all)
        if (viewMode === 'my' && task.assignee !== currentUser.email) {
          return false;
        }
        
        // Priority filter
        if (priorityFilter !== 'all' && task.priority !== priorityFilter) {
          return false;
        }
        
        // Account filter
        if (accountFilter !== 'all' && task.accountName !== accountFilter) {
          return false;
        }
        
        return true;
      });
      
      renderTasks(filtered);
    };
    
    // Render tasks
    function renderTasks(tasks) {
      // Group tasks by urgency
      const overdue = [];
      const today = [];
      const thisWeek = [];
      const later = [];
      const completed = [];
      
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      
      tasks.forEach(task => {
        if (task.status === 'completed' || task.status === 'Completed') {
          completed.push(task);
          return;
        }
        
        if (!task.dueDate) {
          later.push(task);
          return;
        }
        
        const due = new Date(task.dueDate);
        due.setHours(0, 0, 0, 0);
        
        const diffTime = due - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays < 0) {
          overdue.push(task);
        } else if (diffDays === 0) {
          today.push(task);
        } else if (diffDays <= 7) {
          thisWeek.push(task);
        } else {
          later.push(task);
        }
      });
      
      // Update stats
      document.getElementById('statOverdue').textContent = overdue.length;
      document.getElementById('statToday').textContent = today.length;
      document.getElementById('statWeek').textContent = thisWeek.length;
      document.getElementById('statTotal').textContent = overdue.length + today.length + thisWeek.length + later.length;
      
      // Update badges
      document.getElementById('overdueBadge').textContent = overdue.length;
      document.getElementById('todayBadge').textContent = today.length;
      document.getElementById('weekBadge').textContent = thisWeek.length;
      document.getElementById('laterBadge').textContent = later.length;
      document.getElementById('completedBadge').textContent = completed.length;
      
      // Update count text
      const openCount = overdue.length + today.length + thisWeek.length + later.length;
      document.getElementById('taskCount').textContent = `${openCount} open task${openCount !== 1 ? 's' : ''}, ${completed.length} completed this week`;
      
      // Render each section
      renderTaskSection('overdueContent', overdue);
      renderTaskSection('todayContent', today);
      renderTaskSection('weekContent', thisWeek);
      renderTaskSection('laterContent', later);
      renderTaskSection('completedContent', completed);
    }
    
    // Render a task section
    function renderTaskSection(containerId, tasks) {
      const container = document.getElementById(containerId);
      
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-check-circle"></i>
            <h3>No tasks here</h3>
            <p>Great job keeping up!</p>
          </div>
        `;
        return;
      }
      
      // Sort by due date (earliest first) for open tasks, by completed date for completed
      tasks.sort((a, b) => {
        if (a.status === 'completed' && b.status === 'completed') {
          return new Date(b.completedAt || 0) - new Date(a.completedAt || 0);
        }
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return new Date(a.dueDate) - new Date(b.dueDate);
      });
      
      container.innerHTML = tasks.map(task => createTaskCard(task)).join('');
    }
    
    // Create task card HTML
    function createTaskCard(task) {
      const isCompleted = task.status === 'completed' || task.status === 'Completed';
      const priorityClass = `priority-${task.priority}`;
      const dueDateStr = task.dueDate ? formatDueDate(task.dueDate) : 'No due date';
      const daysSinceActivity = task.lastActivity ? 
        Math.floor((Date.now() - task.lastActivity.getTime()) / (1000 * 60 * 60 * 24)) : null;
      
      // Document-specific task card
      if (task.taskType === 'document') {
        return `
          <div class="task-card" style="border-left: 4px solid #f59e0b;">
            <div class="task-main">
              <div class="task-checkbox" style="background: #fff4e6; border-color: #f59e0b; color: #f59e0b;">
                <i class="fas fa-file-contract"></i>
              </div>
              <div class="task-content">
                <div class="task-header">
                  <div class="task-title" onclick="openDocument('${task.id}', '${task.accountId}', '${task.opportunityId || ''}')">
                    ${escapeHtml(task.title)}
                  </div>
                  ${task.priority !== 'medium' ? `<div class="task-priority ${priorityClass}">${task.priority}</div>` : ''}
                </div>
                <div class="task-meta">
                  <div class="task-meta-item">
                    <i class="fas fa-building"></i>
                    <span>${escapeHtml(task.accountName)}</span>
                  </div>
                  <div class="task-meta-item">
                    <i class="fas fa-calendar"></i>
                    <span>${dueDateStr}</span>
                  </div>
                  <div class="task-meta-item">
                    <i class="fas fa-file-alt"></i>
                    <span>${task.documentType?.toUpperCase() || 'DOC'} - ${task.documentStatus.replace('_', ' ').toUpperCase()}</span>
                  </div>
                  <div class="task-meta-item">
                    <i class="fas fa-user"></i>
                    <span>${extractName(task.assignee)}</span>
                  </div>
                </div>
                ${task.description ? `
                  <div class="task-context">
                    <i class="fas fa-dollar-sign"></i>
                    <span>${task.description}</span>
                  </div>
                ` : ''}
                <div class="task-actions">
                  <button class="action-btn primary" onclick="openDocument('${task.id}', '${task.accountId}', '${task.opportunityId || ''}')">
                    <i class="fas fa-file-contract"></i> View Document
                  </button>
                  ${task.documentStatus === 'draft' ? `
                    <button class="action-btn" onclick="openDocumentBuilder('${task.id}', '${task.accountId}')">
                      <i class="fas fa-edit"></i> Continue Editing
                    </button>
                  ` : ''}
                  ${task.documentStatus === 'sent' || task.documentStatus === 'sent_for_signature' ? `
                    <button class="action-btn" onclick="snoozeDocumentTask('${task.id}', '${task.accountId}', 3)">
                      <i class="fas fa-clock"></i> Follow up in 3 days
                    </button>
                  ` : ''}
                  <button class="action-btn" onclick="goToAccount('${task.accountId}')">
                    <i class="fas fa-arrow-right"></i> View Account
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      
      // Regular task card
      return `
        <div class="task-card">
          <div class="task-main">
            <div class="task-checkbox ${isCompleted ? 'checked' : ''}" 
                 onclick="toggleTaskComplete('${task.id}', '${task.accountId}', ${!isCompleted})">
              ${isCompleted ? '<i class="fas fa-check"></i>' : ''}
            </div>
            <div class="task-content">
              <div class="task-header">
                <div class="task-title" onclick="goToAccount('${task.accountId}')">
                  ${escapeHtml(task.title)}
                </div>
                ${task.priority !== 'medium' ? `<div class="task-priority ${priorityClass}">${task.priority}</div>` : ''}
              </div>
              <div class="task-meta">
                <div class="task-meta-item">
                  <i class="fas fa-building"></i>
                  <span>${escapeHtml(task.accountName)}</span>
                </div>
                <div class="task-meta-item">
                  <i class="fas fa-calendar"></i>
                  <span>${dueDateStr}</span>
                </div>
                <div class="task-meta-item">
                  <i class="fas fa-flag"></i>
                  <span>${task.accountStage}</span>
                </div>
                <div class="task-meta-item">
                  <i class="fas fa-user"></i>
                  <span>${extractName(task.assignee)}</span>
                </div>
              </div>
              ${daysSinceActivity !== null ? `
                <div class="task-context">
                  <i class="fas fa-info-circle"></i>
                  <span>Last activity: ${daysSinceActivity} day${daysSinceActivity !== 1 ? 's' : ''} ago</span>
                </div>
              ` : ''}
              ${!isCompleted ? `
                <div class="task-actions">
                  <button class="action-btn primary" onclick="toggleTaskComplete('${task.id}', '${task.accountId}', true)">
                    <i class="fas fa-check"></i> Complete
                  </button>
                  <button class="action-btn" onclick="snoozeTask('${task.id}', '${task.accountId}', 1)">
                    <i class="fas fa-clock"></i> +1 Day
                  </button>
                  <button class="action-btn" onclick="snoozeTask('${task.id}', '${task.accountId}', 7)">
                    <i class="fas fa-calendar-plus"></i> +1 Week
                  </button>
                  <button class="action-btn" onclick="goToAccount('${task.accountId}')">
                    <i class="fas fa-arrow-right"></i> View Account
                  </button>
                </div>
              ` : `
                <div class="task-actions">
                  <button class="action-btn" onclick="toggleTaskComplete('${task.id}', '${task.accountId}', false)">
                    <i class="fas fa-undo"></i> Reopen
                  </button>
                  <button class="action-btn" onclick="goToAccount('${task.accountId}')">
                    <i class="fas fa-arrow-right"></i> View Account
                  </button>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }
    
    // Format due date
    function formatDueDate(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      date.setHours(0, 0, 0, 0);
      
      const diffTime = date - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays < 0) {
        return `${Math.abs(diffDays)} day${Math.abs(diffDays) !== 1 ? 's' : ''} overdue`;
      } else if (diffDays === 0) {
        return 'Due today';
      } else if (diffDays === 1) {
        return 'Due tomorrow';
      } else if (diffDays <= 7) {
        return `Due in ${diffDays} days`;
      } else {
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
      }
    }
    
    // Extract name from email
    function extractName(email) {
      if (!email || !email.includes('@')) return email || 'Unassigned';
      return email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }
    
    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Toggle section expand/collapse
    window.toggleSection = function(sectionId) {
      const section = document.getElementById(sectionId);
      section.classList.toggle('collapsed');
    };
    
    // Set view mode
    window.setViewMode = function(mode) {
      viewMode = mode;
      
      // Update button states
      const buttons = document.querySelectorAll('.filter-toggle button');
      buttons.forEach((btn, idx) => {
        if ((mode === 'my' && idx === 0) || (mode === 'all' && idx === 1)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      applyFilters();
    };
    
    // Toggle task complete
    window.toggleTaskComplete = async function(taskId, accountId, completed) {
      try {
        console.log(`${completed ? '✅' : '🔄'} ${completed ? 'Completing' : 'Reopening'} task:`, taskId);
        
        const taskRef = ref(db, `hccrm/leads/${accountId}/notes/${taskId}`);
        const updateData = {
          status: completed ? 'completed' : 'Open',
          updatedAt: new Date().toISOString()
        };
        
        if (completed) {
          updateData.completedAt = new Date().toISOString();
          updateData.completedBy = currentUser.email;
        } else {
          updateData.completedAt = null;
          updateData.completedBy = null;
        }
        
        await update(taskRef, updateData);
        console.log('✅ Task updated');
        
        // Reload tasks
        await loadTasks();
        
      } catch (error) {
        console.error('❌ Error updating task:', error);
        alert('Error updating task. Please try again.');
      }
    };
    
    // Snooze task
    window.snoozeTask = async function(taskId, accountId, days) {
      try {
        console.log(`⏰ Snoozing task by ${days} days:`, taskId);
        
        const newDueDate = new Date();
        newDueDate.setDate(newDueDate.getDate() + days);
        const dueDateStr = newDueDate.toISOString().split('T')[0];
        
        const taskRef = ref(db, `hccrm/leads/${accountId}/notes/${taskId}`);
        await update(taskRef, {
          dueDate: dueDateStr,
          updatedAt: new Date().toISOString()
        });
        
        console.log('✅ Task snoozed to:', dueDateStr);
        
        // Reload tasks
        await loadTasks();
        
      } catch (error) {
        console.error('❌ Error snoozing task:', error);
        alert('Error snoozing task. Please try again.');
      }
    };
    
    // Go to account
    window.goToAccount = function(accountId) {
      window.location.href = `account-detail.html?id=${accountId}`;
    };
    
    // Open new task modal
    window.openNewTaskModal = function() {
      console.log('🎯 Opening New Task Modal');
      
      // Reset form
      document.getElementById('newTaskForm').reset();
      
      // Set default due date to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('taskDueDate').value = today;
      
      // Set default priority to medium
      document.getElementById('taskPriority').value = 'medium';
      
      // Populate account dropdown
      populateAccountDropdown();
      
      // Populate assignee dropdown
      populateAssigneeDropdown();
      
      // Show modal
      const modal = document.getElementById('newTaskModal');
      modal.style.display = 'flex';
      modal.classList.add('show');
    };
    
    // Close new task modal
    window.closeNewTaskModal = function() {
      const modal = document.getElementById('newTaskModal');
      modal.style.display = 'none';
      modal.classList.remove('show');
    };
    
    // Populate account dropdown
    function populateAccountDropdown() {
      const select = document.getElementById('taskAccount');
      
      // Get unique accounts sorted by name
      const accountList = Object.entries(accounts)
        .map(([id, data]) => ({ id, name: data.name }))
        .sort((a, b) => a.name.localeCompare(b.name));
      
      select.innerHTML = '<option value="">Select an account...</option>' +
        accountList.map(acc => `<option value="${acc.id}">${escapeHtml(acc.name)}</option>`).join('');
    }
    
    // Populate assignee dropdown
    function populateAssigneeDropdown() {
      const select = document.getElementById('taskAssignee');
      
      // Get unique assignees from existing tasks and account owners
      const assignees = new Set();
      
      // Add current user first
      if (currentUser?.email) {
        assignees.add(currentUser.email);
      }
      
      // Add assignees from existing tasks
      allTasks.forEach(task => {
        if (task.assignee && task.assignee !== 'Unassigned') {
          assignees.add(task.assignee);
        }
      });
      
      // Add account owners
      Object.values(accounts).forEach(acc => {
        if (acc.owner) {
          assignees.add(acc.owner);
        }
      });
      
      // Sort alphabetically
      const sortedAssignees = Array.from(assignees).sort();
      
      select.innerHTML = '<option value="">Select assignee...</option>' +
        sortedAssignees.map(email => {
          const name = extractName(email);
          const isCurrentUser = email === currentUser?.email;
          return `<option value="${email}">${name}${isCurrentUser ? ' (me)' : ''}</option>`;
        }).join('');
      
      // Pre-select current user
      if (currentUser?.email && sortedAssignees.includes(currentUser.email)) {
        select.value = currentUser.email;
      }
    }
    
    // Save new task
    window.saveNewTask = async function(event) {
      event.preventDefault();
      
      console.log('💾 Saving new task...');
      
      const accountId = document.getElementById('taskAccount').value;
      const subject = document.getElementById('taskSubject').value.trim();
      const dueDate = document.getElementById('taskDueDate').value;
      const priority = document.getElementById('taskPriority').value;
      const assignee = document.getElementById('taskAssignee').value;
      const description = document.getElementById('taskDescription').value.trim();
      
      if (!accountId || !subject || !dueDate || !assignee) {
        alert('Please fill in all required fields.');
        return;
      }
      
      const taskData = {
        type: 'Task',
        subject: subject,
        content: description,
        dueDate: dueDate,
        assignee: assignee,
        priority: priority,
        status: 'Open',
        date: new Date().toISOString().split('T')[0], // For timeline display
        contacts: [],
        createdAt: new Date().toISOString(),
        createdBy: currentUser.email,
        updatedAt: new Date().toISOString()
      };
      
      console.log('📝 Task data to save:', taskData);
      
      try {
        // Save to Firebase
        const notesRef = ref(db, `hccrm/leads/${accountId}/notes`);
        await push(notesRef, taskData);
        
        console.log('✅ Task created successfully');
        
        // Close modal
        closeNewTaskModal();
        
        // Show success message
        alert('✅ Task created successfully!');
        
        // Reload tasks
        await loadTasks();
        
      } catch (error) {
        console.error('❌ Error creating task:', error);
        alert('Error creating task. Please try again.');
      }
    };
    
    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('newTaskModal');
      if (event.target === modal) {
        closeNewTaskModal();
      }
    };
    
    // Open document (document-specific task)
    window.openDocument = function(docId, accountId, oppId) {
      window.location.href = `documents-dashboard.html?viewDoc=${docId}&account=${accountId}&opp=${oppId || ''}`;
    };
    
    // Open document builder (for draft documents)
    window.openDocumentBuilder = function(docId, accountId) {
      window.location.href = `agreement-builder.html?accountId=${accountId}&editDoc=${docId}`;
    };
    
    // Snooze document task (dismiss from task list for X days)
    window.snoozeDocumentTask = async function(docId, accountId, days) {
      // For now, just show a message - in future this could add a "followUpDate" field to the document
      alert(`✅ Document follow-up snoozed for ${days} days.\n\nThis will be removed from your task list temporarily. The document status remains unchanged.`);
      
      // Optionally: Add a followUpDate field to the document in Firebase
      // For now, just refresh the task list
      await loadTasks();
    };
    
    // Expose to window
    window.loadTasks = loadTasks;
  </script>
  
</body>
</html>
