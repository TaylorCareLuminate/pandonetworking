<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Scheduler Test - HealthLuminate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4facfe;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .datetime-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .quick-schedule {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .quick-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .api-url-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .api-url-section label {
            font-weight: 600;
            color: #495057;
        }

        .example-data {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #0066cc;
        }

        .example-data h4 {
            color: #0066cc;
            margin-bottom: 10px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Scheduler Test</h1>
            <p>Test your Railway email service integration</p>
        </div>

        <div class="form-container">
            <!-- API URL Configuration -->
            <div class="api-url-section">
                <div class="form-group">
                    <label for="apiUrl">Railway API Endpoint:</label>
                    <input type="url" id="apiUrl" value="https://railwayclemail-production.up.railway.app/schedule-email" required>
                </div>
            </div>

            <form id="emailForm">
                <!-- Recipient -->
                <div class="form-group">
                    <label for="recipient">To (Recipient Email) *</label>
                    <input type="email" id="recipient" placeholder="recipient@example.com" required>
                </div>

                <!-- Subject -->
                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <input type="text" id="subject" placeholder="Test Email from HealthLuminate" required>
                </div>

                <!-- HTML Content -->
                <div class="form-group">
                    <label for="htmlContent">HTML Content *</label>
                    <textarea id="htmlContent" placeholder="<h1>Hello!</h1><p>This is a test email from HealthLuminate.</p>" required></textarea>
                </div>

                <!-- Plain Text Content -->
                <div class="form-group">
                    <label for="textContent">Plain Text Content (Optional)</label>
                    <textarea id="textContent" placeholder="Hello! This is a test email from HealthLuminate."></textarea>
                </div>

                <!-- Schedule Date/Time -->
                <div class="form-group">
                    <label>Schedule Email *</label>
                    <div class="datetime-group">
                        <input type="date" id="scheduleDate" required>
                        <input type="time" id="scheduleTime" required>
                    </div>
                    <div class="quick-schedule">
                        <button type="button" class="quick-btn" onclick="scheduleNow()">Send Now</button>
                        <button type="button" class="quick-btn" onclick="scheduleIn5Min()">+5 Minutes</button>
                        <button type="button" class="quick-btn" onclick="scheduleIn1Hour()">+1 Hour</button>
                        <button type="button" class="quick-btn" onclick="scheduleTomorrow9AM()">Tomorrow 9 AM</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="send-btn" id="sendBtn">
                    📤 Schedule Email
                </button>
            </form>

            <!-- Result Display -->
            <div id="result" class="result"></div>

            <!-- Debugging Section -->
            <div class="example-data" style="border-left-color: #dc3545;">
                <h4 style="color: #dc3545;">🔧 Debugging Tools</h4>
                <button type="button" class="quick-btn" onclick="testServerConnection()">Test Server Connection</button>
                <p style="margin-top: 10px; font-size: 14px; color: #666;">
                    Click to test if your Railway server is responding correctly.
                </p>
            </div>

            <!-- Example Data -->
            <div class="example-data">
                <h4>💡 Quick Fill Example Data</h4>
                <button type="button" class="quick-btn" id="fillExampleBtn" onclick="handleFillExample()">Fill Example Data (With Image)</button>
                <button type="button" class="quick-btn" id="fillSimpleBtn" onclick="fillSimpleData()">Fill Simple Data (No Image)</button>
                <p style="margin-top: 10px; font-size: 14px; color: #666;">
                    Try the simple version first to test if the server is working, then try with image.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Initialize form with current date/time
        window.onload = function() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 5); // Default to 5 minutes from now
            
            document.getElementById('scheduleDate').value = now.toISOString().split('T')[0];
            document.getElementById('scheduleTime').value = now.toTimeString().slice(0, 5);
        };

        // Quick schedule functions
        function scheduleNow() {
            const now = new Date();
            document.getElementById('scheduleDate').value = now.toISOString().split('T')[0];
            document.getElementById('scheduleTime').value = now.toTimeString().slice(0, 5);
        }

        function scheduleIn5Min() {
            const future = new Date(Date.now() + 5 * 60 * 1000);
            document.getElementById('scheduleDate').value = future.toISOString().split('T')[0];
            document.getElementById('scheduleTime').value = future.toTimeString().slice(0, 5);
        }

        function scheduleIn1Hour() {
            const future = new Date(Date.now() + 60 * 60 * 1000);
            document.getElementById('scheduleDate').value = future.toISOString().split('T')[0];
            document.getElementById('scheduleTime').value = future.toTimeString().slice(0, 5);
        }

        function scheduleTomorrow9AM() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(9, 0, 0, 0);
            document.getElementById('scheduleDate').value = tomorrow.toISOString().split('T')[0];
            document.getElementById('scheduleTime').value = '09:00';
        }

        // Convert image to base64
        function imageToBase64(imagePath) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = this.naturalWidth;
                    canvas.height = this.naturalHeight;
                    ctx.drawImage(this, 0, 0);
                    const dataURL = canvas.toDataURL('image/png');
                    resolve(dataURL);
                };
                img.onerror = function() {
                    reject(new Error('Failed to load image'));
                };
                img.src = imagePath;
            });
        }

        // Fill example data
        async function fillExampleData() {
            document.getElementById('apiUrl').value = 'https://railwayclemail-production.up.railway.app/schedule-email';
            document.getElementById('recipient').value = 'test@example.com';
            document.getElementById('subject').value = 'Test Email from HealthLuminate System';
            
            // Load and convert image to base64
            let imageBase64 = '';
            try {
                imageBase64 = await imageToBase64('../images/crm/hldefinitive.png');
            } catch (error) {
                console.warn('Could not load image, using placeholder:', error);
                imageBase64 = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzRmYWNmZSIvPjx0ZXh0IHg9IjEwMCIgeT0iNTUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNiIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkhlYWx0aEx1bWluYXRlPC90ZXh0Pjwvc3ZnPg==';
            }
            
            document.getElementById('htmlContent').value = `<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <div style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 30px; text-align: center; border-radius: 10px 10px 0 0;">
        <h1>🏥 HealthLuminate</h1>
        <p>Email Service Test</p>
    </div>
    <div style="padding: 30px; background: #f9f9f9; border-radius: 0 0 10px 10px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="${imageBase64}" alt="HealthLuminate Logo" style="max-width: 200px; height: auto; border-radius: 8px;" />
        </div>
        <h2>Hello from HealthLuminate!</h2>
        <p>This is a test email to verify that our Railway email service is working correctly.</p>
        <p>✅ Email scheduling: Working</p>
        <p>✅ HTML content: Supported</p>
        <p>✅ Firebase integration: Active</p>
        <p>✅ Image embedding: Ready</p>
        <div style="background: white; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #4facfe;">
            <strong>Test Details:</strong><br>
            Sent at: ${new Date().toLocaleString()}<br>
            From: joe_annoreno@healthluminate.com<br>
            Service: Railway + Firebase
        </div>
        <p>If you received this email, the integration is working perfectly! 🎉</p>
    </div>
</div>`;
            document.getElementById('textContent').value = `Hello from HealthLuminate!

This is a test email to verify that our Railway email service is working correctly.

✅ Email scheduling: Working
✅ HTML content: Supported  
✅ Firebase integration: Active

Test Details:
Sent at: ${new Date().toLocaleString()}
From: joe_annoreno@healthluminate.com
Service: Railway + Firebase

 If you received this email, the integration is working perfectly!`;
        }

        // Fill simple data without image for testing
        function fillSimpleData() {
            document.getElementById('apiUrl').value = 'https://railwayclemail-production.up.railway.app/schedule-email';
            document.getElementById('recipient').value = 'test@example.com';
            document.getElementById('subject').value = 'Simple Test Email from HealthLuminate';
            document.getElementById('htmlContent').value = `<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #4facfe;">🏥 HealthLuminate</h1>
    <h2>Simple Email Test</h2>
    <p>This is a simple test email <strong>without images</strong> to verify that the basic Railway email service is working.</p>
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0;">
        <p>✅ <strong>Basic functionality test</strong></p>
        <p>📧 From: joe_annoreno@healthluminate.com</p>
        <p>⏰ Sent at: ${new Date().toLocaleString()}</p>
        <p>🚀 Service: Railway + Firebase</p>
    </div>
    <p>If you received this email, the basic integration is working! 🎉</p>
</div>`;
            document.getElementById('textContent').value = `HealthLuminate - Simple Email Test

This is a simple test email without images to verify that the basic Railway email service is working.

✅ Basic functionality test
📧 From: joe_annoreno@healthluminate.com  
⏰ Sent at: ${new Date().toLocaleString()}
🚀 Service: Railway + Firebase

If you received this email, the basic integration is working!`;
        }

        // Handle fill example button click
        async function handleFillExample() {
            const btn = document.getElementById('fillExampleBtn');
            const originalText = btn.textContent;
            
            try {
                btn.textContent = 'Loading image...';
                btn.disabled = true;
                await fillExampleData();
                btn.textContent = 'Data filled!';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error filling example data:', error);
                btn.textContent = 'Error loading';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 2000);
            }
        }

        // Test server connection
        async function testServerConnection() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            if (!apiUrl) {
                showResult('Please enter your Railway API endpoint URL first.', 'error');
                return;
            }

            try {
                showResult('Testing server connection...', 'success');
                
                // Try a simple GET request to see if server responds
                const baseUrl = apiUrl.replace('/schedule-email', '');
                const response = await fetch(baseUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    }
                });

                const responseText = await response.text();
                
                const testResult = `🔍 SERVER CONNECTION TEST

URL Tested: ${baseUrl}
Status: ${response.status} ${response.statusText}
Content-Type: ${response.headers.get('content-type') || 'not specified'}

Response Preview:
${responseText.substring(0, 500)}${responseText.length > 500 ? '...' : ''}

Next Steps:
${response.status === 200 ? '✅ Server is responding! Try the simple email test.' : 
  response.status >= 400 && response.status < 500 ? '⚠️ Client error - check your URL.' : 
  response.status >= 500 ? '❌ Server error - check your Railway deployment.' : 
  '❓ Unexpected response - check console for details.'}`;

                showResult(testResult, response.status === 200 ? 'success' : 'error');
                
            } catch (error) {
                const errorResult = `❌ CONNECTION TEST FAILED

Error: ${error.message}

Possible Issues:
• Railway server is not running
• URL is incorrect
• CORS policy blocking the request
• Network connectivity issues

Debug Steps:
1. Check your Railway deployment status
2. Verify the URL is correct
3. Test the URL directly in your browser`;

                showResult(errorResult, 'error');
                console.error('Server connection test failed:', error);
            }
        }

        // Form submission
        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sendBtn = document.getElementById('sendBtn');
            const result = document.getElementById('result');
            
            // Validate API URL
            const apiUrl = document.getElementById('apiUrl').value.trim();
            if (!apiUrl) {
                showResult('Please enter your Railway API endpoint URL.', 'error');
                return;
            }

            // Get form data
            const formData = {
                to: document.getElementById('recipient').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                html: document.getElementById('htmlContent').value.trim(),
                text: document.getElementById('textContent').value.trim(),
                sendAt: getScheduledDateTime()
            };

            // Validation
            if (!formData.to || !formData.subject || !formData.html) {
                showResult('Please fill in all required fields (To, Subject, HTML Content).', 'error');
                return;
            }

            if (!formData.sendAt) {
                showResult('Please set a valid schedule date and time.', 'error');
                return;
            }

            // Show loading state
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span>Sending Email...';
            result.style.display = 'none';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                let responseData;
                const responseText = await response.text();
                
                // Debug logging
                console.log('Response Status:', response.status);
                console.log('Response Headers:', Object.fromEntries(response.headers));
                console.log('Raw Response:', responseText);
                
                try {
                    responseData = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error(`Server returned non-JSON response (Status: ${response.status}). Response: ${responseText.substring(0, 200)}...`);
                }

                if (response.ok) {
                    const successMessage = `✅ EMAIL SCHEDULED SUCCESSFULLY!

Response Details:
${JSON.stringify(responseData, null, 2)}

Email Details:
• To: ${formData.to}
• Subject: ${formData.subject}
• Scheduled for: ${new Date(formData.sendAt).toLocaleString()}
• Content: ${formData.html.length} characters (HTML) + ${formData.text.length} characters (Text)

The email has been saved to Firebase and will be sent automatically at the scheduled time.`;

                    showResult(successMessage, 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${responseData.message || 'Unknown error'}`);
                }

            } catch (error) {
                const errorMessage = `❌ EMAIL SCHEDULING FAILED

Error Details:
${error.message}

Troubleshooting:
• Check that your Railway API URL is correct
• Verify your Railway service is running
• Check the browser console for more details
• Ensure all required fields are filled

Request Data:
${JSON.stringify(formData, null, 2)}`;

                showResult(errorMessage, 'error');
                console.error('Email scheduling error:', error);
            } finally {
                // Reset button
                sendBtn.disabled = false;
                sendBtn.innerHTML = '📤 Schedule Email';
            }
        });

        function getScheduledDateTime() {
            const date = document.getElementById('scheduleDate').value;
            const time = document.getElementById('scheduleTime').value;
            
            if (!date || !time) return null;
            
            const dateTime = new Date(`${date}T${time}`);
            return dateTime.toISOString();
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
