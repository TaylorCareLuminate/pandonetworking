<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Key Usage Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header p {
            color: #718096;
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-operational {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-warning {
            background: #feebc8;
            color: #7c2d12;
        }

        .status-critical {
            background: #fed7d7;
            color: #742a2a;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .summary-card h3 {
            color: #718096;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .summary-card .value {
            color: #2d3748;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-card .subtext {
            color: #a0aec0;
            font-size: 14px;
        }

        .summary-card.available .value {
            color: #38a169;
        }

        .summary-card.exhausted .value {
            color: #e53e3e;
        }

        .summary-card.usage .value {
            color: #667eea;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #718096;
            font-size: 14px;
            margin-left: auto;
        }

        .auto-refresh input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .keys-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .key-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .key-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .key-card.available {
            border-left: 4px solid #38a169;
        }

        .key-card.exhausted {
            border-left: 4px solid #e53e3e;
        }

        .key-card.missing {
            border-left: 4px solid #a0aec0;
            opacity: 0.6;
        }

        .key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .key-name {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            font-family: 'Courier New', monospace;
        }

        .key-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .key-status.available {
            background: #c6f6d5;
            color: #22543d;
        }

        .key-status.exhausted {
            background: #fed7d7;
            color: #742a2a;
        }

        .key-status.missing {
            background: #e2e8f0;
            color: #4a5568;
        }

        .key-usage {
            margin-bottom: 15px;
        }

        .key-usage-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4a5568;
        }

        .usage-count {
            font-weight: 600;
            color: #2d3748;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-fill.low {
            background: linear-gradient(90deg, #38a169, #48bb78);
        }

        .progress-fill.medium {
            background: linear-gradient(90deg, #ecc94b, #ed8936);
        }

        .progress-fill.high {
            background: linear-gradient(90deg, #f56565, #e53e3e);
        }

        .key-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            color: #718096;
        }

        .key-detail {
            display: flex;
            flex-direction: column;
        }

        .key-detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .key-detail-value {
            font-weight: 600;
            color: #2d3748;
        }

        .next-available {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .next-available h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .next-available-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .next-available-icon {
            font-size: 32px;
        }

        .next-available-text {
            flex: 1;
        }

        .next-available-key {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }

        .next-available-time {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fed7d7;
            color: #742a2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 4px solid #e53e3e;
        }

        .error h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .timestamp {
            text-align: center;
            color: white;
            font-size: 14px;
            margin-top: 20px;
            opacity: 0.9;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .chart-container h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .usage-bars {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 200px;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 2px solid #e2e8f0;
        }

        .usage-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .usage-bar {
            width: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .usage-bar:hover {
            opacity: 0.8;
        }

        .usage-bar-label {
            font-size: 10px;
            color: #718096;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .usage-bar-value {
            font-size: 11px;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 4px;
        }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🔑 Gemini API Key Monitoring
                <span id="overallStatus" class="status-badge status-operational">Loading...</span>
            </h1>
            <p>Real-time monitoring of your 16 Google Gemini API keys (gen00-gen15)</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="refreshData()">
                🔄 Refresh Now
            </button>
            <button class="btn btn-secondary" onclick="testSearch()">
                🧪 Test Search
            </button>
            <button class="btn btn-secondary" onclick="cleanupOldRecords()">
                🧹 Cleanup Old Records
            </button>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Auto-refresh every 30s</label>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="summary-cards">
            <div class="summary-card available">
                <h3>Available Keys</h3>
                <div class="value" id="availableCount">-</div>
                <div class="subtext">Ready to use</div>
            </div>
            <div class="summary-card exhausted">
                <h3>Exhausted Keys</h3>
                <div class="value" id="exhaustedCount">-</div>
                <div class="subtext">At daily limit</div>
            </div>
            <div class="summary-card usage">
                <h3>Total Usage</h3>
                <div class="value" id="totalUsage">-</div>
                <div class="subtext" id="maxUsage">of - searches today</div>
            </div>
            <div class="summary-card">
                <h3>Overall Capacity</h3>
                <div class="value" id="capacityPercent">-</div>
                <div class="subtext">of daily limit used</div>
            </div>
        </div>

        <div id="nextAvailableContainer"></div>

        <div class="chart-container">
            <h2>Usage Distribution</h2>
            <div class="usage-bars" id="usageBars"></div>
        </div>

        <div class="keys-grid" id="keysGrid">
            <div class="loading">
                <div class="pulse">Loading key data...</div>
            </div>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        const RAILWAY_URL = 'https://railwayclemail-production.up.railway.app';
        let autoRefreshInterval = null;

        // Load data on page load
        window.addEventListener('DOMContentLoaded', () => {
            refreshData();
            startAutoRefresh();
        });

        function startAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked && !autoRefreshInterval) {
                autoRefreshInterval = setInterval(refreshData, 30000); // 30 seconds
            }
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                startAutoRefresh();
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        async function refreshData() {
            try {
                const response = await fetch(`${RAILWAY_URL}/gemini/usage-report`);
                const data = await response.json();

                if (data.success) {
                    updateSummary(data.report);
                    updateKeysGrid(data.report.keys);
                    updateUsageChart(data.report.keys);
                    updateNextAvailable(data.report.nextAvailable);
                    updateTimestamp();
                    clearError();
                } else {
                    showError('Failed to load key data', data.error || 'Unknown error');
                }
            } catch (error) {
                showError('Connection Error', `Failed to connect to Railway: ${error.message}`);
            }
        }

        function updateSummary(report) {
            const summary = report.summary;
            
            document.getElementById('availableCount').textContent = summary.availableKeys;
            document.getElementById('exhaustedCount').textContent = summary.exhaustedKeys;
            document.getElementById('totalUsage').textContent = summary.totalUsage.toLocaleString();
            document.getElementById('maxUsage').textContent = `of ${summary.maxPossibleUsage.toLocaleString()} searches today`;
            document.getElementById('capacityPercent').textContent = `${summary.overallPercentUsed}%`;

            // Update overall status badge
            const statusBadge = document.getElementById('overallStatus');
            if (summary.availableKeys === 0) {
                statusBadge.className = 'status-badge status-critical';
                statusBadge.textContent = 'All Keys Exhausted';
            } else if (summary.availableKeys < 5) {
                statusBadge.className = 'status-badge status-warning';
                statusBadge.textContent = 'Low Availability';
            } else {
                statusBadge.className = 'status-badge status-operational';
                statusBadge.textContent = 'Operational';
            }
        }

        function updateKeysGrid(keys) {
            const grid = document.getElementById('keysGrid');
            
            if (!keys || keys.length === 0) {
                grid.innerHTML = '<div class="loading">No key data available</div>';
                return;
            }

            grid.innerHTML = keys.map(key => {
                const statusClass = !key.hasEnvVar ? 'missing' : (key.isAvailable ? 'available' : 'exhausted');
                const statusText = !key.hasEnvVar ? 'Missing Env Var' : (key.isAvailable ? 'Available' : 'Exhausted');
                
                let progressClass = 'low';
                if (key.percentUsed > 80) progressClass = 'high';
                else if (key.percentUsed > 50) progressClass = 'medium';

                return `
                    <div class="key-card ${statusClass}">
                        <div class="key-header">
                            <div class="key-name">${key.keyName}</div>
                            <div class="key-status ${statusClass}">${statusText}</div>
                        </div>
                        
                        ${key.hasEnvVar ? `
                            <div class="key-usage">
                                <div class="key-usage-text">
                                    <span class="usage-count">${key.count.toLocaleString()} / 1,498</span>
                                    <span>${key.percentUsed}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${progressClass}" style="width: ${key.percentUsed}%"></div>
                                </div>
                            </div>
                            
                            <div class="key-details">
                                <div class="key-detail">
                                    <div class="key-detail-label">Remaining</div>
                                    <div class="key-detail-value">${(1498 - key.count).toLocaleString()}</div>
                                </div>
                                <div class="key-detail">
                                    <div class="key-detail-label">Total Usage</div>
                                    <div class="key-detail-value">${(key.totalUsage || key.count).toLocaleString()}</div>
                                </div>
                            </div>
                        ` : `
                            <div style="padding: 20px 0; text-align: center; color: #a0aec0;">
                                Environment variable not configured
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        function updateUsageChart(keys) {
            const container = document.getElementById('usageBars');
            
            if (!keys || keys.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #a0aec0;">No data available</div>';
                return;
            }

            const maxHeight = 180; // pixels
            
            container.innerHTML = keys
                .filter(key => key.hasEnvVar)
                .map(key => {
                    const height = (key.count / 1498) * maxHeight;
                    return `
                        <div class="usage-bar-wrapper">
                            <div class="usage-bar-value">${key.count}</div>
                            <div class="usage-bar" 
                                 style="height: ${height}px;" 
                                 title="${key.keyName}: ${key.count}/1498 (${key.percentUsed}%)">
                            </div>
                            <div class="usage-bar-label">${key.keyName}</div>
                        </div>
                    `;
                }).join('');
        }

        function updateNextAvailable(nextAvailable) {
            const container = document.getElementById('nextAvailableContainer');
            
            if (!nextAvailable) {
                container.innerHTML = '';
                return;
            }

            const availableDate = new Date(nextAvailable.availableAt);
            const now = new Date();
            const diff = availableDate - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            container.innerHTML = `
                <div class="next-available">
                    <h2>⏰ Next Key Available</h2>
                    <div class="next-available-info">
                        <div class="next-available-icon">🔓</div>
                        <div class="next-available-text">
                            <div class="next-available-key">${nextAvailable.keyName}</div>
                            <div class="next-available-time">
                                Available in ${hours}h ${minutes}m at ${availableDate.toLocaleString()}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                `Last updated: ${now.toLocaleString()}`;
        }

        function showError(title, message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `
                <div class="error">
                    <h3>❌ ${title}</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        async function testSearch() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '🔄 Testing...';

            try {
                const response = await fetch(`${RAILWAY_URL}/gemini/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        query: 'What is 2+2? Answer with just the number.' 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Test Successful!\n\nKey Used: ${data.metadata.keyUsed}\nUsage After: ${data.metadata.usageAfter}/1498\nResult: ${data.result}`);
                    refreshData(); // Refresh to show updated usage
                } else {
                    alert(`❌ Test Failed\n\n${data.error || 'Unknown error'}`);
                }
            } catch (error) {
                alert(`❌ Test Failed\n\n${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '🧪 Test Search';
            }
        }

        async function cleanupOldRecords() {
            if (!confirm('Clean up old usage records (older than 24 hours)?')) {
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '🔄 Cleaning...';

            try {
                const response = await fetch(`${RAILWAY_URL}/gemini/cleanup`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ Cleanup Complete!\n\nRemoved ${data.result.totalRemoved} old usage records.`);
                    refreshData(); // Refresh to show updated usage
                } else {
                    alert(`❌ Cleanup Failed\n\n${data.error || 'Unknown error'}`);
                }
            } catch (error) {
                alert(`❌ Cleanup Failed\n\n${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '🧹 Cleanup Old Records';
            }
        }
    </script>
</body>
</html>
