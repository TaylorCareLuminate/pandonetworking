<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dropdown Test - HealthLuminate CRM</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { 
      background: #f9fafb; 
      margin: 0; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #263238; 
    }
    
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    
    .test-section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    
    .test-button {
      background: #264653;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    
    .test-button:hover {
      background: #1f3a45;
    }
    
    .debug-output {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 15px;
      margin: 10px 0;
      font-family: monospace;
      font-size: 0.9rem;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div id="header-placeholder"></div>
  
  <div class="container">
    <h1>Dropdown Test Page</h1>
    
    <div class="test-section">
      <h3>Navigation Dropdown Test</h3>
      <p>Click the "Navigation" button in the header to test the dropdown functionality.</p>
      <button class="test-button" onclick="testNavigationDropdown()">Test Navigation Dropdown</button>
      <button class="test-button" onclick="debugDropdownElements()">Debug Elements</button>
    </div>
    
    <div class="test-section">
      <h3>Debug Output</h3>
      <div id="debugOutput" class="debug-output">
        Click the debug button to see dropdown element information...
      </div>
    </div>
  </div>

  <script>
    // Load header
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        
        // Initialize header functionality after it's loaded
        setTimeout(() => {
          if (window.setupHeaderDropdown) {
            window.setupHeaderDropdown();
          }
          console.log('✅ Header loaded and initialized');
        }, 200);
      })
      .catch(error => {
        console.error('Error loading header:', error);
      });

    // Test navigation dropdown
    function testNavigationDropdown() {
      console.log('🧪 Testing navigation dropdown...');
      const navDropdown = document.querySelector('.nav-dropdown');
      const navDropdownBtn = document.getElementById('navDropdownBtn');
      
      if (navDropdown && navDropdownBtn) {
        console.log('Current state:', navDropdown.classList.contains('active'));
        navDropdown.classList.toggle('active');
        console.log('New state:', navDropdown.classList.contains('active'));
        
        // Update debug output
        document.getElementById('debugOutput').innerHTML = `
          Navigation dropdown test completed.<br>
          Current state: ${navDropdown.classList.contains('active') ? 'ACTIVE' : 'INACTIVE'}<br>
          Button found: ${!!navDropdownBtn}<br>
          Dropdown found: ${!!navDropdown}
        `;
      } else {
        console.error('❌ Navigation dropdown elements not found');
        document.getElementById('debugOutput').innerHTML = '❌ Navigation dropdown elements not found';
      }
    }

    // Debug dropdown elements
    function debugDropdownElements() {
      console.log('🔍 Debugging dropdown elements...');
      
      const elements = {
        navDropdownBtn: document.getElementById('navDropdownBtn'),
        navDropdown: document.querySelector('.nav-dropdown'),
        navDropdownMenu: document.querySelector('.nav-dropdown-menu'),
        navDropdownItems: document.querySelectorAll('.nav-dropdown-item')
      };
      
      let debugInfo = 'Dropdown Elements Debug:<br><br>';
      
      Object.entries(elements).forEach(([name, element]) => {
        if (Array.isArray(element) || element instanceof NodeList) {
          debugInfo += `${name}: ${element.length} items found<br>`;
          element.forEach((item, index) => {
            debugInfo += `  - Item ${index}: ${item.textContent.trim()}<br>`;
          });
        } else {
          debugInfo += `${name}: ${element ? 'FOUND' : 'NOT FOUND'}<br>`;
          if (element) {
            debugInfo += `  - Classes: ${element.className}<br>`;
            debugInfo += `  - Visible: ${element.offsetParent !== null}<br>`;
          }
        }
        debugInfo += '<br>';
      });
      
      document.getElementById('debugOutput').innerHTML = debugInfo;
      console.log('Dropdown elements:', elements);
    }

    // Make functions globally available
    window.testNavigationDropdown = testNavigationDropdown;
    window.debugDropdownElements = debugDropdownElements;
  </script>
</body>
</html>
