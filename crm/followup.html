            } else {
                el.classList.add('expanded-body');
                btn.textContent = 'Show less';
            }
        };

        function stripHtml(html) {
            const d = document.createElement('div');
            d.innerHTML = html;
            return d.textContent || d.innerText || '';
        }

        // ── LinkedIn Thread ───────────────────────────────────────────────────
        async function loadLinkedInThread(contact, container, cid) {
            const liUrl = getLinkedInUrl(contact);
            if (!liUrl) {
                container.innerHTML = '<div class="no-history"><i class="fab fa-linkedin"></i> No LinkedIn URL on record</div>';
                document.getElementById(`li-count-${cid}`).textContent = '0';
                updateLinkedInConvInfo(cid, null, null);
                return;
            }

            try {
                const normalizedUrl = normalizeUrl(liUrl);

                // Fetch heyreach_inbox once and reuse for all cards
                if (!heyreachInboxDocs) {
                    if (!heyreachInboxLoading) {
                        heyreachInboxLoading = getDocs(collection(db, 'heyreach_inbox'))
                            .then(snap => {
                                heyreachInboxDocs = [];
                                snap.forEach(d => heyreachInboxDocs.push({ id: d.id, ...d.data() }));
                                return heyreachInboxDocs;
                            });
                    }
                    await heyreachInboxLoading;
                }

                const conversations = [];
                heyreachInboxDocs.forEach(data => {
                    const urls = [
                        data.leadProfileUrl,
                        data.profileUrl,
                        data.rawData?.correspondentProfile?.profileUrl,
                        data.rawData?.correspondent?.profileUrl
                    ].filter(Boolean);
                    if (urls.some(u => normalizeUrl(u) === normalizedUrl)) {
                        conversations.push(data);
                    }
                });

                conversations.sort((a,b) => {
                    const ta = a.lastMessageAt?.toDate?.()?.getTime() || 0;
                    const tb = b.lastMessageAt?.toDate?.()?.getTime() || 0;
                    return tb - ta;
                });

                // Total message count across all conversations
                let totalMsgs = 0;
                conversations.forEach(conv => {
                    const msgs = extractLinkedInMessages(conv);
                    totalMsgs += msgs.length;
                });
                document.getElementById(`li-count-${cid}`).textContent = totalMsgs;

                if (conversations.length === 0) {
                    container.innerHTML = '<div class="no-history"><i class="fab fa-linkedin"></i> No LinkedIn conversation history found</div>';
                    updateLinkedInConvInfo(cid, null, null);
                    return;
                }

                // Use the most recent conversation for reply
                const primaryConv = conversations[0];
                updateLinkedInConvInfo(cid, primaryConv, contact);

                // Render all conversations
                let html = '';
                conversations.forEach((conv, ci) => {
                    const messages = extractLinkedInMessages(conv);
                    const rawData  = conv.rawData || {};
                    const correspondent = rawData.correspondentProfile || {};
                    const linkedInAccount = rawData.linkedInAccount || {};
                    const firstName = conv.leadFirstName || correspondent.firstName || '';
                    const lastName  = conv.leadLastName  || correspondent.lastName  || '';
                    const leadName  = `${firstName} ${lastName}`.trim() || 'Lead';
                    const accountName = `${linkedInAccount.firstName||''} ${linkedInAccount.lastName||''}`.trim() || (conv.accountName||'You');
                    const campaignName = conv.campaignName || '';

                    if (ci > 0) html += `<div style="border-top:1px dashed #e2e8f0; margin:1rem 0 0.75rem; padding-top:0.75rem; font-size:0.78rem; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px;">Conversation ${ci+1}${campaignName ? ' — '+escapeHtml(campaignName) : ''}</div>`;

                    if (messages.length === 0) {
                        html += '<div class="no-history" style="padding:0.75rem">No messages in this conversation</div>';
                    } else {
                        messages.forEach(msg => {
                            const isLead = msg.sender === 'lead' || msg.sender === 'CORRESPONDENT';
                            const senderName = isLead ? leadName : accountName;
                            const initStr = isLead
                                ? (firstName[0]||'L')+(lastName[0]||'L')
                                : (accountName.split(' ')[0][0]||'Y')+(accountName.split(' ')[1]?.[0]||'A');
                            const ts = msg.timestamp?.toDate?.() || (msg.createdAt?.toDate?.()) || new Date(msg.timestamp||msg.createdAt||0);

                            html += `
                            <div class="li-message ${isLead?'':'sent-msg'}">
                                <div class="li-avatar">${escapeHtml(initStr.toUpperCase())}</div>
                                <div class="li-bubble">
                                    <div class="li-sender">${escapeHtml(senderName)}</div>
                                    <div class="li-text">${escapeHtml(msg.text||msg.body||msg.message||'')}</div>
                                    <div class="li-time">${fmtShort(ts)}</div>
                                </div>
                            </div>`;
                        });
                    }
                });

                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;

            } catch(e) {
                console.error('loadLinkedInThread:', e);
                container.innerHTML = `<div class="no-history">Error loading LinkedIn history: ${escapeHtml(e.message)}</div>`;
                updateLinkedInConvInfo(cid, null, null);
            }
        }

        function extractLinkedInMessages(conv) {
            let msgs = [];
            // rawData.messages is the primary source
            if (conv.rawData?.messages) msgs = conv.rawData.messages;
            else if (conv.messages) msgs = conv.messages;
            // Normalize sender to 'lead' or 'account'
            return msgs.map(m => {
                const sender = (m.sender === 'CORRESPONDENT' || m.sender === 'lead') ? 'lead' : 'account';
                return { ...m, sender };
            }).filter(m => m.text||m.body||m.message);
        }

        function updateLinkedInConvInfo(cid, conv, contact) {
            const el = document.getElementById(`li-conv-info-${cid}`);
            if (!el) return;

            if (!conv) {
                el.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f59e0b"></i> No active LinkedIn conversation found. You can still send a message if a conversation ID is available.';
                el.style.borderColor = '#f59e0b';
                return;
            }

            const convId  = conv.conversationId || conv.rawData?.conversationId || conv.id;
            const liAccId = conv.linkedInAccountId || conv.rawData?.linkedInAccount?.id;
            const custId  = conv.customerId;

            if (!convId || !liAccId) {
                el.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#f59e0b"></i> Conversation found but missing required IDs. Cannot send via API — reply directly in LinkedIn.`;
                el.style.borderColor = '#f59e0b';
                // Disable send button
                const btn = document.getElementById(`li-send-btn-${cid}`);
                if (btn) btn.disabled = true;
                return;
            }

            el.innerHTML = `<i class="fab fa-linkedin" style="color:#0077b5"></i> 
                Conversation ready to send via LinkedIn API. 
                Conv: <code>${convId.substring(0,20)}…</code>`;
            el.style.borderColor = '#0077b5';

            // Store for later
            el.dataset.convId  = convId;
            el.dataset.liAccId = liAccId;
            el.dataset.custId  = custId || '';
        }

        // ── Reply Mode Toggle ─────────────────────────────────────────────────
        window.setReplyMode = function(cid, mode) {
            const emailForm = document.getElementById(`reply-email-${cid}`);
            const liForm    = document.getElementById(`reply-linkedin-${cid}`);
            const emailBtn  = document.getElementById(`mode-email-${cid}`);
            const liBtn     = document.getElementById(`mode-linkedin-${cid}`);

            if (mode === 'email') {
                emailForm?.classList.add('active');
                liForm?.classList.remove('active');
                emailBtn?.classList.add('active-email');
                emailBtn?.classList.remove('active-linkedin');
                liBtn?.classList.remove('active-email','active-linkedin');
            } else {
                liForm?.classList.add('active');
                emailForm?.classList.remove('active');
                liBtn?.classList.add('active-linkedin');
                liBtn?.classList.remove('active-email');
                emailBtn?.classList.remove('active-email','active-linkedin');
            }
        };

        window.clearReplyForm = function(cid, mode) {
            if (mode === 'email') {
                const bodyEl = document.getElementById(`email-body-${cid}`);
                if (bodyEl) bodyEl.value = '';
            } else {
                const bodyEl = document.getElementById(`li-body-${cid}`);
                if (bodyEl) bodyEl.value = '';
            }
        };

        window.updateEmailSubject = function(cid) {}; // placeholder

        // ── Send Email Reply ──────────────────────────────────────────────────
        window.sendEmailReply = async function(cid) {
            const contact = displayedContacts.find(c => c.id === cid);
            if (!contact) return;

            const fromSel  = document.getElementById(`email-from-${cid}`);
            const toEl     = document.getElementById(`email-to-${cid}`);
            const subjectEl= document.getElementById(`email-subject-${cid}`);
            const bodyEl   = document.getElementById(`email-body-${cid}`);

            const ccEl     = document.getElementById(`email-cc-${cid}`);
            const fromVal  = fromSel?.value?.trim();
            const to       = toEl?.value?.trim();
            const cc       = ccEl?.value?.trim() || '';
            const subject  = subjectEl?.value?.trim();
            const bodyText = bodyEl?.value?.trim();

            if (!fromVal || !to || !subject || !bodyText) {
                showToast('Please fill in all email fields (From, To, Subject, Message)', 'error');
                return;
            }

            const [accountId, fromEmail] = fromVal.split('|');
            const account = emailAccounts.find(a => a.id === accountId);
            if (!account) {
                showToast('Could not find the selected email account', 'error');
                return;
            }

            const contactName = getFullName(contact);
            const ccLine = cc ? `\nCC: ${cc}` : '';
            if (!confirm(`Send reply-all to ${contactName} (${to})?\n\nFrom: ${fromEmail}${ccLine}\nSubject: ${subject}`)) return;

            // Build HTML body
            let htmlBody = escapeHtml(bodyText).replace(/\n/g,'<br>');

            // Add signature if available
            if (account.signature) {
                const sig = typeof account.signature === 'object'
                    ? (account.signature.html || account.signature.text || '')
                    : escapeHtml(account.signature).replace(/\n/g,'<br>');
                if (sig) htmlBody += `<br><br><div style="border-top:1px solid #e5e7eb;padding-top:10px;margin-top:10px;">${sig}</div>`;
            }

            // ── Threading: always reply to the chronologically last email ────────
            // Whether the last message in the thread was sent by us or by the contact,
            // we set In-Reply-To to its messageId so the chain stays intact.
            const contactEmailLower = to.toLowerCase().trim();

            // Use the per-contact cache populated when the thread was opened
            const cached = contactEmailCache.get(cid) || { received: [], sent: [] };

            // Build the full combined thread sorted oldest → newest
            const allThreadEmails = [
                ...cached.received
                    .filter(e => extractEmail(e.from||'').toLowerCase() === contactEmailLower)
                    .map(e => ({ ...e, _type: 'received', _date: new Date(e.date||0) })),
                ...cached.sent
                    .map(e => ({ ...e, _type: 'sent', _date: new Date(e.sentAt||e.date||0) }))
            ].sort((a, b) => a._date - b._date);

            // The last email in the thread is what we reply to
            const lastThreadEmail = allThreadEmails[allThreadEmails.length - 1] || null;

            let inReplyTo  = '';
            let references = '';

            if (lastThreadEmail?.messageId) {
                inReplyTo = lastThreadEmail.messageId;
                // Build references: carry forward any existing chain, then append this message's id
                const existingRefs = (lastThreadEmail.references || '').trim();
                references = existingRefs
                    ? (existingRefs.includes(lastThreadEmail.messageId)
                        ? existingRefs
                        : `${existingRefs} ${lastThreadEmail.messageId}`)
                    : lastThreadEmail.messageId;
                console.log(`🧵 Threading to last ${lastThreadEmail._type} email:`, lastThreadEmail.messageId);
                console.log('🧵 References chain:', references);
            } else {
                console.warn('⚠️ No messageId found — email will not be threaded');
            }

            const payload = {
                accountId: account.id,
                customerId: account.customerId,
                from: account.email,
                fromEmail: account.email,
                to,
                subject,
                html: `<!DOCTYPE html><html><body style="font-family:sans-serif;font-size:14px;line-height:1.6;color:#333;max-width:600px;padding:20px;">${htmlBody}</body></html>`,
                text: bodyText,
                // Manual / one-off send: backend returns a 72h-dedup WARNING
                // (409) if this recipient was already emailed from this account
                // in the last 72 hours.  Caught by sendEmailWithDedupGuard.
                isManual: true
            };

            if (cc)         payload.cc         = cc;
            if (inReplyTo)  payload.inReplyTo  = inReplyTo;
            if (references) payload.references  = references;

            const sendBtn = document.querySelector(`[onclick="sendEmailReply('${cid}')"]`);
            if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…'; }

            try {
                const responseData = await sendEmailWithDedupGuard(payload);

                showToast(`✅ Email sent to ${contactName}!`, 'success');
                bodyEl.value = '';

                // Use real messageId from server if returned, so next send can thread to it
                const sentMessageId = responseData.messageId || `local-${Date.now()}@followup`;

                const localMsg = {
                    id: 'local-' + Date.now(),
                    from: account.email,
                    fromEmail: account.email,
                    to,
                    subject,
                    text: bodyText,
                    sentAt: new Date().toISOString(),
                    date:   new Date().toISOString(),
                    messageId: sentMessageId
                };
                if (cc)         localMsg.cc         = cc;
                if (inReplyTo)  localMsg.inReplyTo  = inReplyTo;
                if (references) localMsg.references  = `${references} ${sentMessageId}`.trim();

                // Update the per-contact cache so the re-rendered thread sees the new message
                // and the next send within this session can thread to it correctly
                if (contactEmailCache.has(cid)) {
                    contactEmailCache.get(cid).sent.unshift(localMsg);
                } else {
                    contactEmailCache.set(cid, { received: [], sent: [localMsg] });
                }

                // Reload email thread and refresh threading status badge
                const threadEl = document.getElementById(`email-thread-${cid}`);
                if (threadEl) {
                    cardDataCache.delete(cid);
                    await loadEmailThread(contact, threadEl, cid);
                }
                renderThreadStatus(cid, contactEmailLower);

            } catch(e) {
                if (e && e.userCancelled) {
                    if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = '<i class="fas fa-reply-all"></i> Send Reply-All'; }
                    return;
                }
                console.error('sendEmailReply:', e);
                showToast('❌ Failed to send email: ' + e.message, 'error');
            } finally {
                if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = '<i class="fas fa-reply-all"></i> Send Reply-All'; }
            }
        };

        // POSTs to /send-email and transparently handles the 72-hour-dedup
        // warning returned for one-off (manual) sends.  If the backend says
        // the recipient was emailed from this account within 72 h, prompt the
        // user; on confirm, retry with bypassDedup: true.
        async function sendEmailWithDedupGuard(payload) {
            const url = `${RAILWAY}/send-email`;
            const post = (body) => fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            let response = await post(payload);

            if (response.status === 409) {
                const data = await response.json().catch(() => ({}));
                if (data.code === 'DEDUP_72H_WARNING' && data.recentSend) {
                    const r = data.recentSend;
                    const when = r.sentAt ? new Date(r.sentAt).toLocaleString() : 'recently';
                    const ok = window.confirm(
                        `⚠️  This recipient was emailed from this account ${r.hoursAgo}h ago` +
                        (r.subject ? ` (subject: "${r.subject}")` : '') +
                        `\nLast send: ${when}\n\nSend anyway?`
                    );
                    if (!ok) {
                        const e = new Error('User cancelled after dedup warning');
                        e.userCancelled = true;
                        throw e;
                    }
                    response = await post({ ...payload, bypassDedup: true });
                } else if (data.code === 'DEDUP_72H_BLOCK' && data.recentSend) {
                    const r = data.recentSend;
                    throw new Error(
                        `Blocked: recipient was emailed from this account ${r.hoursAgo}h ago. ` +
                        `Automated sends cannot send within 72 h.`
                    );
                }
            }

            if (!response.ok) {
                const errText = await response.text().catch(() => '');
                let errorMsg = errText || `Send failed: ${response.status}`;
                try { errorMsg = JSON.parse(errText).error || errorMsg; } catch(_) {}
                throw new Error(errorMsg);
            }

            return response.json();
        }

        // ── Send Threaded Test Email ─────────────────────────────────────────
        // Sends the composed reply to a specified test address (not the real contact)
        // while preserving every threading header so you can verify the thread
        // arrives correctly in your own inbox before sending for real.
        //
        // Retries automatically up to 3 times (1 s / 2 s / 4 s back-off) so a
        // transient Railway 503 doesn't permanently block the test.
        window.sendTestThreadedEmail = async function(cid) {
            const testInput = document.getElementById(`thread-test-email-${cid}`);
            const testTo = testInput?.value?.trim();
            if (!testTo) {
                showToast('Enter a test email address first', 'error');
                testInput?.focus();
                return;
            }

            const contact = displayedContacts.find(c => c.id === cid);
            if (!contact) return;

            const subjectEl = document.getElementById(`email-subject-${cid}`);
            const bodyEl    = document.getElementById(`email-body-${cid}`);
            const subject   = subjectEl?.value?.trim() || 'Test (threaded)';
            const bodyText  = bodyEl?.value?.trim() || '(no body — test send)';

            // Resolve sending account (same logic as sendEmailReply)
            const fromVal  = document.getElementById(`email-from-${cid}`)?.value?.trim();
            const [accountId] = fromVal ? fromVal.split('|') : [null];
            const account = (accountId ? emailAccounts.find(a => a.id === accountId) : null) || emailAccounts[0];
            if (!account) { showToast('No sending account available', 'error'); return; }

            // Rebuild threading headers exactly as sendEmailReply does
            const contactEmailLower = (contact.email || '').toLowerCase().trim();
            const cached = contactEmailCache.get(cid) || { received: [], sent: [] };

            const allThreadEmails = [
                ...cached.received
                    .filter(e => extractEmail(e.from||'').toLowerCase() === contactEmailLower)
                    .map(e => ({ ...e, _type: 'received', _date: new Date(e.date||0) })),
                ...cached.sent
                    .map(e => ({ ...e, _type: 'sent', _date: new Date(e.sentAt||e.date||0) }))
            ].sort((a, b) => a._date - b._date);

            const lastThreadEmail = allThreadEmails[allThreadEmails.length - 1] || null;

            let inReplyTo  = '';
            let references = '';

            if (lastThreadEmail?.messageId) {
                inReplyTo = lastThreadEmail.messageId;
                const existingRefs = (lastThreadEmail.references || '').trim();
                references = existingRefs
                    ? (existingRefs.includes(lastThreadEmail.messageId)
                        ? existingRefs
                        : `${existingRefs} ${lastThreadEmail.messageId}`)
                    : lastThreadEmail.messageId;
            }

            // Build HTML body
            let htmlBody = escapeHtml(bodyText).replace(/\n/g, '<br>');
            if (account.signature) {
                const sig = typeof account.signature === 'object'
                    ? (account.signature.html || account.signature.text || '')
                    : escapeHtml(account.signature).replace(/\n/g, '<br>');
                if (sig) htmlBody += `<br><br><div style="border-top:1px solid #e5e7eb;padding-top:10px;margin-top:10px;">${sig}</div>`;
            }

            const testSubject = subject.startsWith('[TEST] ') ? subject : `[TEST] ${subject}`;

            const payload = {
                accountId: account.id,
                customerId: account.customerId,
                from: account.email,
                fromEmail: account.email,
                to: testTo,
                subject: testSubject,
                html: `<!DOCTYPE html><html><body style="font-family:sans-serif;font-size:14px;line-height:1.6;color:#333;max-width:600px;padding:20px;">
                    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:#92400e;">
                        <strong>🧪 Threading Test</strong> — Original recipient: <em>${escapeHtml(contact.email||'unknown')}</em>
                        ${inReplyTo ? `<br>In-Reply-To: <code>${escapeHtml(inReplyTo)}</code>` : ''}
                        ${references ? `<br>References: <code style="word-break:break-all;">${escapeHtml(references)}</code>` : '<br><em>⚠️ No threading headers — this will not thread.</em>'}
                    </div>
                    ${htmlBody}
                </body></html>`,
                text: `[TEST - Original recipient: ${contact.email||'unknown'}]\n\n${bodyText}`,
                // Threaded-test sends are manual / one-off, so the backend
                // should return a WARNING (not a BLOCK) if the test address was
                // emailed within the last 72 h.
                isManual: true
            };

            if (inReplyTo)  payload.inReplyTo  = inReplyTo;
            if (references) payload.references  = references;

            const btn = document.querySelector(`#thread-test-row-${cid} .btn-test-thread`);

            console.log('🧪 Test send payload:', {
                to: testTo,
                subject: testSubject,
                inReplyTo,
                references,
                account: account.email
            });

            // ── Always show headers in the UI immediately (independent of send success) ──
            showThreadHeadersPanel(cid, { inReplyTo, references, testTo, testSubject, account: account.email });

            // ── Retry loop: up to 3 attempts with exponential back-off ──
            const MAX_ATTEMPTS = 3;
            const BACKOFF_MS   = [0, 1000, 2000]; // delay before each attempt

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                if (BACKOFF_MS[attempt - 1] > 0) {
                    if (btn) btn.innerHTML = `<i class="fas fa-clock"></i> Retry ${attempt}/${MAX_ATTEMPTS}…`;
                    await new Promise(r => setTimeout(r, BACKOFF_MS[attempt - 1]));
                }
                if (btn) { btn.disabled = true; btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending (${attempt}/${MAX_ATTEMPTS})…`; }

                try {
                    let res = await fetch(`${RAILWAY}/send-email`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    let responseData = {};
                    try { responseData = await res.json(); } catch(_) {}

                    // 72-hour dedup warning — prompt and possibly retry with bypass.
                    if (res.status === 409 && responseData.code === 'DEDUP_72H_WARNING' && responseData.recentSend) {
                        const r = responseData.recentSend;
                        const when = r.sentAt ? new Date(r.sentAt).toLocaleString() : 'recently';
                        const ok = window.confirm(
                            `⚠️  Test address ${testTo} was emailed from this account ${r.hoursAgo}h ago` +
                            (r.subject ? ` (subject: "${r.subject}")` : '') +
                            `\nLast send: ${when}\n\nSend the threaded test anyway?`
                        );
                        if (!ok) {
                            showToast('Test send cancelled (recipient was emailed recently).', 'info', 5000);
                            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-vial"></i> Send Threaded Test'; }
                            return;
                        }
                        res = await fetch(`${RAILWAY}/send-email`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...payload, bypassDedup: true })
                        });
                        responseData = {};
                        try { responseData = await res.json(); } catch(_) {}
                    }

                    if (res.status === 503 && attempt < MAX_ATTEMPTS) {
                        console.warn(`⚠️ Test send attempt ${attempt} got 503 — retrying…`);
                        continue; // try again
                    }

                    if (!res.ok) throw new Error(responseData.error || responseData.message || `HTTP ${res.status}`);

                    showToast(`✅ Test email sent to ${testTo}${inReplyTo ? ' — threading headers included' : ' — no threading (no prior message-id)'}`, 'success', 7000);
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Sent!'; setTimeout(() => { if (btn) btn.innerHTML = '<i class="fas fa-vial"></i> Send Threaded Test'; }, 3000); }
                    return; // success — exit loop

                } catch(e) {
                    if (attempt < MAX_ATTEMPTS && (e.message.includes('Failed to fetch') || e.message.includes('503'))) {
                        console.warn(`⚠️ Test send attempt ${attempt} failed (${e.message}) — retrying…`);
                        continue;
                    }
                    // Final failure
                    console.error('sendTestThreadedEmail error:', e);
                    const isServiceDown = e.message.includes('Failed to fetch') || e.message.includes('503');
                    showToast(
                        isServiceDown
                            ? `⚠️ Railway service unavailable (503) — headers are shown below so you can verify threading. Try again in a moment.`
                            : `❌ Test send failed: ${e.message}`,
                        isServiceDown ? 'warning' : 'error',
                        8000
                    );
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-vial"></i> Send Threaded Test'; }
                    return;
                }
            }

            // Exhausted retries
            showToast('⚠️ Railway service unavailable after 3 attempts — headers are shown below. Try again once other requests settle.', 'warning', 9000);
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-vial"></i> Send Threaded Test'; }
        };

        // Shows the threading headers in-page so the user can verify them even when
        // the Railway backend is temporarily unavailable (503).
        function showThreadHeadersPanel(cid, { inReplyTo, references, testTo, testSubject, account }) {
            const row = document.getElementById(`thread-test-row-${cid}`);
            if (!row) return;

            const existingPanel = document.getElementById(`thread-headers-panel-${cid}`);
            if (existingPanel) existingPanel.remove();

            const panel = document.createElement('div');
            panel.id = `thread-headers-panel-${cid}`;
            panel.style.cssText = 'margin-top:0.5rem;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:0.6rem 0.9rem;font-size:0.75rem;color:#166534;';

            const hasHeaders = !!(inReplyTo || references);
            panel.innerHTML = `
                <div style="font-weight:700;margin-bottom:0.3rem;">
                    ${hasHeaders ? '🧵 Threading headers that will be sent:' : '⚠️ No threading headers found — email will not thread'}
                </div>
                <table style="border-collapse:collapse;width:100%;">
                    <tr><td style="padding:1px 6px 1px 0;white-space:nowrap;opacity:.7;">To:</td><td style="word-break:break-all;">${escapeHtml(testTo)}</td></tr>
                    <tr><td style="padding:1px 6px 1px 0;white-space:nowrap;opacity:.7;">From:</td><td>${escapeHtml(account)}</td></tr>
                    <tr><td style="padding:1px 6px 1px 0;white-space:nowrap;opacity:.7;">Subject:</td><td>${escapeHtml(testSubject)}</td></tr>
                    ${inReplyTo  ? `<tr><td style="padding:1px 6px 1px 0;white-space:nowrap;opacity:.7;">In-Reply-To:</td><td style="word-break:break-all;font-family:monospace;">${escapeHtml(inReplyTo)}</td></tr>` : ''}
                    ${references ? `<tr><td style="padding:1px 6px 1px 0;white-space:nowrap;vertical-align:top;opacity:.7;">References:</td><td style="word-break:break-all;font-family:monospace;">${escapeHtml(references)}</td></tr>` : ''}
                </table>
                <div style="margin-top:0.3rem;opacity:.7;">Headers shown regardless of send success — if correct, threading will work once Railway responds.</div>`;

            row.insertAdjacentElement('afterend', panel);
        }

        // ── Send LinkedIn Reply ───────────────────────────────────────────────
        window.sendLinkedInReply = async function(cid) {
            const contact = displayedContacts.find(c => c.id === cid);
            if (!contact) return;

            const convInfoEl = document.getElementById(`li-conv-info-${cid}`);
            const bodyEl     = document.getElementById(`li-body-${cid}`);

            const messageText = bodyEl?.value?.trim();
            if (!messageText) {
                showToast('Please type a message before sending', 'error');
                return;
            }

            const convId  = convInfoEl?.dataset?.convId;
            const liAccId = convInfoEl?.dataset?.liAccId;
            const custId  = convInfoEl?.dataset?.custId;

            if (!convId || !liAccId) {
                showToast('❌ Cannot send: No valid LinkedIn conversation ID found. Please reply directly in LinkedIn or HeyReach.', 'error', 6000);
                return;
            }

            const contactName = getFullName(contact);
            if (!confirm(`Send LinkedIn message to ${contactName}?`)) return;

            const sendBtn = document.querySelector(`[onclick="sendLinkedInReply('${cid}')"]`);
            if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…'; }

            try {
                // Clean conversation ID
                let convIdClean = convId.trim();
                if (convIdClean.startsWith('webhook_')) convIdClean = convIdClean.replace('webhook_','');

                const res = await fetch(`${RAILWAY}/heyreach/inbox/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerId: custId,
                        conversationId: convIdClean,
                        linkedInAccountId: liAccId,
                        message: messageText
                    })
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || `HTTP ${res.status}`);
                }

                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Send failed');

                showToast(`✅ LinkedIn message sent to ${contactName}!`, 'success');
                bodyEl.value = '';

                // Reload LinkedIn thread
                const threadEl = document.getElementById(`li-thread-${cid}`);
                if (threadEl) {
                    cardDataCache.delete(cid);
                    await loadLinkedInThread(contact, threadEl, cid);
                }

            } catch(e) {
                console.error('sendLinkedInReply:', e);
                showToast('❌ Failed to send LinkedIn message: ' + e.message, 'error');
            } finally {
                if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = '<i class="fab fa-linkedin"></i> Send LinkedIn Message'; }
            }
        };

        // ── Status Update ─────────────────────────────────────────────────────
        window.updateContactStatus = async function(cid, selectEl) {
            const newStatus = selectEl.value;
            const contact   = displayedContacts.find(c => c.id === cid);
            if (!contact) return;

            const name = getFullName(contact);
            const labels = { interested: 'Interested', declined: 'Declined', scheduled: 'Scheduled' };

            if (!confirm(`Change ${name}'s status to "${labels[newStatus] || newStatus}"?`)) {
                // Revert the select to the current stored status
                selectEl.value = contact.outcomeStatus || 'interested';
                return;
            }

            selectEl.classList.add('saving');
            const prevStatus = contact.outcomeStatus || 'interested';

            try {
                await updateDoc(doc(db, 'outreach_sets', cid), {
                    outcomeStatus: newStatus,
                    outcomeDate:   new Date(),
                    updatedAt:     new Date()
                });

                // Update local cache
                contact.outcomeStatus = newStatus;

                // Restyle the select to match new status
                selectEl.className = `status-select ${newStatus}`;

                // Move declined cards to the end / re-order visually
                const cardEl = document.querySelector(`.prospect-card[data-contact-id="${cid}"]`);
                if (cardEl) {
                    cardEl.classList.toggle('declined-card', newStatus === 'declined');
                    if (newStatus === 'declined') {
                        cardEl.parentElement.appendChild(cardEl); // move to bottom
                    } else if (prevStatus === 'declined') {
                        cardEl.parentElement.prepend(cardEl); // move back to top
                    }
                }

                showToast(`✅ ${name} marked as ${labels[newStatus]}`, 'success');
                updateStats(displayedContacts);
            } catch (e) {
                console.error('updateContactStatus:', e);
                showToast('❌ Failed to update status: ' + e.message, 'error');
                // Revert
                selectEl.value   = prevStatus;
                selectEl.className = `status-select ${prevStatus}`;
            } finally {
                selectEl.classList.remove('saving');
            }
        };

        // ── Init ──────────────────────────────────────────────────────────────
        // Only load dropdowns on page open — no heavy data until user selects + clicks Load
        initPage();
      })();
    </script>
