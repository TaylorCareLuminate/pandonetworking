        // Delete organization activity
        window.deleteOrganizationActivity = async (orgId, activityId) => {
            if (!confirm('Are you sure you want to delete this activity entry?')) {
                return;
            }
            
            try {
                // Get the activity data first to check if it's a status change
                const db = await getFirebaseDb();
                const { ref, get, set } = await getFirebaseFunctions();
                const activityRef = ref(db, `hl_crm_input_25/${orgId}/timeline/${activityId}`);
                const activitySnapshot = await get(activityRef);
                
                let isStatusActivity = false;
                if (activitySnapshot.exists()) {
                    const activityData = activitySnapshot.val();
                    isStatusActivity = activityData.type === 'status';
                }
                
                // Delete the activity from timeline
                await set(activityRef, null);
                
                // If this was a status activity, we need to check if there are other status activities
                // and update the main status accordingly
                if (isStatusActivity) {
                    const timelineRef = ref(db, `hl_crm_input_25/${orgId}/timeline`);
                    const timelineSnapshot = await get(timelineRef);
                    
                    let latestStatus = null;
                    if (timelineSnapshot.exists()) {
                        const timelineData = timelineSnapshot.val();
                        const statusActivities = Object.values(timelineData)
                            .filter(activity => activity.type === 'status')
                            .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                        
                        if (statusActivities.length > 0) {
                            latestStatus = statusActivities[0].status;
                        }
                    }
                    
                    // Update the main status
                    const statusRef = ref(db, `hl_crm_input_25/${orgId}`);
                    if (latestStatus) {
                        // Find the latest status activity to get the full data
                        const latestStatusActivity = Object.values(timelineSnapshot.val() || {})
                            .filter(activity => activity.type === 'status' && activity.status === latestStatus)
                            .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];
                        
                        await set(statusRef, {
                            status: latestStatus,
                            updatedAt: latestStatusActivity.updatedAt,
                            updatedBy: latestStatusActivity.updatedBy
                        });
                        
                        organizationStatuses[orgId] = latestStatus;
                    } else {
                        // No more status activities, remove the status
                        await set(statusRef, null);
                        delete organizationStatuses[orgId];
                    }
                    
                    // Refresh organization cards
                    await loadOrganizationStatuses();
                    renderOrganizations(currentOrganizations);
                }
                
                // Always refresh outreach data in case timeline entries affect outreach status
                await loadOrganizationOutreachData();
                
                // Re-render organizations if we're on the main view to update colors
                if (document.getElementById('organizationsSection').style.display !== 'none') {
                    applyFilters();
                }
                
                console.log('✅ Organization activity deleted');
                
                // Refresh timeline
                loadOrganizationEngagementData(orgId);
                
            } catch (error) {
                console.error('❌ Error deleting activity:', error);
                alert('Error deleting activity entry.');
            }
        };

        // Auto-call first contact's phone number
        function autoCallFirstContact() {
            try {
                console.log('🔍 Looking for phone numbers in', currentContacts.length, 'contacts');
                
                // Sort contacts by heat to prioritize high-value contacts
                const sortedContacts = [...currentContacts].sort((a, b) => {
                    const aHeat = parseInt(a.contact_hot) || 0;
                    const bHeat = parseInt(b.contact_hot) || 0;
                    return bHeat - aHeat;
                });
                
                // Find the first contact with a phone number
                for (const contact of sortedContacts) {
                                    const workPhone = contact.workphone;
                const personalPhone = contact.otherphone;
                    const contactName = `${contact.first_name || ''} ${contact.last_name || ''}`.trim();
                    
                    // Try work phone first, then personal phone
                    let phoneToCall = null;
                    let phoneType = '';
                    
                    if (workPhone && workPhone.trim()) {
                        phoneToCall = workPhone.trim();
                        phoneType = 'work';
                    } else if (personalPhone && personalPhone.trim()) {
                        phoneToCall = personalPhone.trim();
                        phoneType = 'personal';
                    }
                    
                    if (phoneToCall) {
                        console.log(`📞 Found ${phoneType} phone for ${contactName}: ${phoneToCall}`);
                        
                        // Clean the phone number (remove spaces, dashes, parentheses)
                        const cleanPhone = phoneToCall.replace(/[\s\-\(\)\.]/g, '');
                        
                        // Create tel link and trigger call
                        const telLink = `tel:${cleanPhone}`;
                        console.log(`📞 Initiating call to: ${telLink}`);
                        
                        // Create temporary link and click it to initiate call
                        const tempLink = document.createElement('a');
                        tempLink.href = telLink;
                        tempLink.style.display = 'none';
                        document.body.appendChild(tempLink);
                        tempLink.click();
                        document.body.removeChild(tempLink);
                        
                        // Show notification
                        showNotification(`📞 Calling ${contactName} at ${phoneToCall} (${phoneType} phone)`);
                        
                        // Track the call attempt
                        if (selectedOrganization) {
                            const contactEmail = contact.workemail || contact.otheremail || '';
                            if (contactEmail) {
                                trackOutreach(
                                    selectedOrganization.firebaseKey || selectedOrganization.id,

                                    contactName, 
                                    'Auto-Call Initiated', 
                                    `Auto-called ${phoneType} phone: ${phoneToCall}`
                                );

                        }
                        
                        return; // Stop after first successful call
                    }
                    
                    console.log(`📞 No phone number found for contact: ${contactName}`);
                }

                    type: outreachType,
                    date: new Date().toISOString(),
                    user: window.auth.currentUser?.email || 'unknown',
                    notes: notes
                };
                
                await push(outreachRef, outreachData);
                
                console.log(`✅ Outreach tracked for ${contactEmail}`);
                
                // Refresh outreach data
                await loadOrganizationOutreachData();
                
                // Refresh the organizations display if we're on the main view
                if (document.getElementById('organizationsGrid').style.display !== 'none') {
                    applyFilters();
                }
                
            } catch (error) {
                console.error('Error tracking outreach:', error);
                alert('Error tracking outreach. Please try again.');
            }
        }

        // Get outreach history for a contact
        async function getOutreachHistory(orgId, contactEmail) {
            try {
                const encodedEmail = contactEmail.replace(/\./g, '_DOT_').replace(/@/g, '_AT_');
                const db = await getFirebaseDb();
                const { ref, get } = await getFirebaseFunctions();
                const outreachRef = ref(db, `hl_crm_input_25/${orgId}/outreach/${encodedEmail}`);
                
                const outreachSnapshot = await get(outreachRef);
                
                if (outreachSnapshot.exists()) {
                    const outreachData = outreachSnapshot.val();
                    
                    // Convert to array and sort by date
                    const outreachHistory = Object.entries(outreachData).map(([id, data]) => ({
                        id,
                        ...data
                    })).sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    return outreachHistory;
                } else {
                    return [];
                }
                
            } catch (error) {
                console.error('Error getting outreach history:', error);
                return [];
            }
        }

        // Delete outreach entry
        async function deleteOutreachEntry(orgId, contactEmail, entryId) {

                const encodedEmail = contactEmail.replace(/\./g, '_DOT_').replace(/@/g, '_AT_');
                const db = await getFirebaseDb();
                const { ref, set } = await getFirebaseFunctions();
                const entryRef = ref(db, `hl_crm_input_25/${orgId}/outreach/${encodedEmail}/${entryId}`);
                
                await set(entryRef, null);
                
                console.log(`✅ Outreach entry deleted`);

                await loadOrganizationOutreachData();

        // Add timeline entry

        // Mark contact as qualified and populate addlead.html
        async function markContactAsQualified(orgId, contactEmail, contactName) {
            try {
                console.log(`Marking contact ${contactName} as qualified at organization ${orgId}...`);
                
                // Find the organization and contact data
                const org = selectedOrganization;
                if (!org) {
                    alert('Organization data not available.');
                    return;
                }
                
                // Find the specific contact
                const contact = currentContacts.find(c => {
                    const email = c.workemail || c.otheremail || '';
                    const name = `${c.first_name || ''} ${c.last_name || ''}`.trim();
                    return email === contactEmail || name === contactName;
                });
                
                if (!contact) {
                    alert('Contact data not available.');
                    return;
                }
                
                // Step 1: Track the outreach activity
                await trackOutreach(orgId, contactEmail, contactName, 'Qualified');
                
                // Step 2: Mark the organization as qualified
                await markAsQualified(orgId);
                
                // Step 3: Aggregate organization data
                const orgData = aggregateOrganizationData(currentContacts);
                
                // Step 4: Prepare data for addlead.html (limit data size to prevent freezing)
                
                // Helper function to truncate long text fields
                const truncateText = (text, maxLength = 500) => {
                    if (!text || typeof text !== 'string') return '';
                    return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
                };
                
                // Prepare organization notes with size limit
                const orgNotes = `Qualified from hotsheet on ${new Date().toLocaleDateString()}.${orgData.company_background ? '\n\n' + truncateText(orgData.company_background, 300) : ''}`;
                
                // Prepare contact background with size limit
                const contactBackground = [
                    truncateText(contact.in_the_news_recent, 200),
                    truncateText(contact.in_the_news_long_term, 200),
                    truncateText(contact.one_key_thing, 100),
                    truncateText(contact.personalization, 100)
                ].filter(Boolean).join('\n\n');
                
                // Prepare contact email with domain prefix
                const contactEmailForLead = contact.workemail || contact.otheremail || '';
                const domain = truncateText(orgData.domain || org.domain || '', 100);
                const formattedEmail = contactEmailForLead || (domain ? `@https://www.${domain}` : '');
                
                const leadData = {
                    organization: {
                        name: truncateText(org.company_name || '', 100),
                        domain: domain,
                        location: truncateText(org.headquarters_location || org.location || '', 100),
                        industry: truncateText(org.category || '', 100),
                        notes: orgNotes
                    },
                    contacts: [{
                        firstName: truncateText(contact.first_name || '', 50),
                        lastName: truncateText(contact.last_name || '', 50),
                        email: formattedEmail,
                        phone: truncateText(contact.workphone || contact.otherphone || '', 20),
                        linkedin: truncateText(contact.linkedinurl || contact.profile_url || '', 200),
                        title: truncateText(contact.title || '', 100),
                        background: contactBackground,
                        isMainContact: true,
                        isDecisionMaker: true,
                        isInfluencer: false
                    }],
                    stage: 'Virtual Contact',
                    notes: [{
                        date: new Date().toISOString().split('T')[0],
                        type: 'Phone Call',
                        subject: 'Qualified Contact',
                        content: `Contact ${truncateText(contactName, 50)} was marked as qualified through hotsheet outreach.`,
                        contacts: [0]
                    }],
                    nextSteps: [{
                        action: 'Follow up with qualified contact',
                        dueDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                        buildProofOfConcept: false
                    }]
                };
                
                // Check data size before storing
                const dataSize = JSON.stringify(leadData).length;
                console.log(`📊 Lead data size: ${dataSize} characters`);
                
                if (dataSize > 50000) { // 50KB limit
                    console.warn('⚠️ Data too large, creating minimal version');
                    leadData.organization.notes = `Qualified from hotsheet on ${new Date().toLocaleDateString()}.`;
                    leadData.contacts[0].background = 'Background data truncated due to size.';
                }
                
                // Step 5: Open addlead.html in new tab with data
                // Simplify URL construction
                const currentPath = window.location.pathname;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                const addLeadUrl = window.location.origin + basePath + 'addlead.html';
                
                // Store the lead data in sessionStorage for the new tab to pick up
                const dataKey = `qualifiedLead_${Date.now()}`;
                
                try {
                    sessionStorage.setItem(dataKey, JSON.stringify(leadData));
                    console.log('✅ Lead data stored in sessionStorage with key:', dataKey);
                } catch (storageError) {
                    console.error('❌ Error storing lead data:', storageError);
                    alert('Error preparing lead data. Data may be too large.');
                    return;
                }
                
                const finalUrl = `${addLeadUrl}?qualified=${dataKey}`;
                console.log('🔗 Opening URL:', finalUrl);
                
                // Test if the URL is accessible first
                console.log('🔍 Testing URL accessibility...');
                fetch(addLeadUrl).then(response => {
                    console.log('✅ Add lead URL is accessible:', response.ok);
                }).catch(error => {
                    console.warn('⚠️ Add lead URL test failed:', error);
                });
                
                const newWindow = window.open(finalUrl, '_blank');
                
                if (newWindow) {
                    console.log(`✅ Contact ${contactName} marked as qualified and addlead.html opened`);
                    
                    // Listen for the new window to load
                    setTimeout(() => {
                        try {
                            if (newWindow.closed) {
                                console.log('⚠️ New window was closed');
                            } else {
                                console.log('✅ New window is still open');
                            }
                        } catch (error) {
                            console.log('⚠️ Cannot check window status (cross-origin)');
                        }
                    }, 2000);
                } else {
                    console.error('❌ Failed to open new window (popup blocked?)');
                    alert('Failed to open new window. Please check popup settings.');
                }
                
                // Show success message with fallback option
                const message = `Contact ${contactName} has been marked as qualified! The organization has been moved to the end of the list and a new lead has been opened in addlead.html.`;
                
                if (newWindow) {
                    alert(message);
                } else {
                    const fallbackMessage = `${message}\n\nNote: The new window may have been blocked by popup settings. You can manually open the add lead page and the data will be available.`;
                    alert(fallbackMessage);
                }
                
            } catch (error) {
                console.error('Error marking contact as qualified:', error);
                alert('Error marking contact as qualified. Please try again.');
            }
        }

        // Helper function to populate addlead.html with qualified data (called from addlead.html)
        window.getQualifiedLeadData = function(dataKey) {
            const data = sessionStorage.getItem(dataKey);
            if (data) {
                sessionStorage.removeItem(dataKey); // Clean up
                return JSON.parse(data);
            }
            return null;
        };

        // Notification System for New Submissions
        let lastCheckTime = localStorage.getItem('lastSubmissionCheck') || new Date().toISOString();
        let notificationDismissed = false;

        async function checkForNewSubmissions() {
            try {
                const now = new Date().toISOString();
                
                // Check both research requests and lead submissions
                const [researchRequests, leadSubmissions] = await Promise.all([
                    fetch('https://careluminate-b5f76-default-rtdb.firebaseio.com/research-requests.json'),
                    fetch('https://careluminate-b5f76-default-rtdb.firebaseio.com/lead-submissions.json')
                ]);

                const researchData = await researchRequests.json();
                const leadData = await leadSubmissions.json();

                let newSubmissionsCount = 0;

                // Count new research requests
                if (researchData) {
                    Object.values(researchData).forEach(submission => {
                        if (submission.timestamp > lastCheckTime) {
                            newSubmissionsCount++;
                        }
                    });
                }

                // Count new lead submissions
                if (leadData) {
                    Object.values(leadData).forEach(submission => {
                        if (submission.timestamp > lastCheckTime) {
                            newSubmissionsCount++;
                        }
                    });
                }

                // Show notification if there are new submissions
                if (newSubmissionsCount > 0 && !notificationDismissed) {
                    showNotification(newSubmissionsCount);
                }

                // Update last check time
                localStorage.setItem('lastSubmissionCheck', now);

            } catch (error) {
                console.error('Error checking for new submissions:', error);
            }
        }

        function showNotification(count) {
            const notificationCard = document.getElementById('notification-card');
            const countElement = document.getElementById('notification-count');
            
            countElement.textContent = count;
            notificationCard.classList.add('show');
        }

        function dismissNotification() {
            const notificationCard = document.getElementById('notification-card');
            notificationCard.classList.remove('show');
            notificationDismissed = true;
        }

        function viewSubmissions() {
            // Navigate to the submissions page
            window.open('submissions.html', '_blank');
        }

        // Check for new submissions when page loads
        document.addEventListener('DOMContentLoaded', function() {
            checkForNewSubmissions();
            
            // Check every 30 seconds for new submissions
            setInterval(checkForNewSubmissions, 30000);
        });
    </script>
