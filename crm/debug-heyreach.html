<!DOCTYPE html>
<html>
<head>
    <title>Debug HeyReach Connection</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <h1>Debug HeyReach Connection Issues</h1>
    
    <div class="test">
        <h3>Test 1: Basic Connectivity</h3>
        <button onclick="testBasic()">Test Basic Railway Connection</button>
        <div id="test1-result"></div>
    </div>

    <div class="test">
        <h3>Test 2: HeyReach Status Endpoint</h3>
        <button onclick="testStatus()">Test /heyreach-status</button>
        <div id="test2-result"></div>
    </div>

    <div class="test">
        <h3>Test 3: HeyReach Verify Endpoint</h3>
        <button onclick="testVerify()">Test /proxy/heyreach/api-key/verify</button>
        <div id="test3-result"></div>
    </div>

    <div class="test">
        <h3>Test 4: All Request Details</h3>
        <button onclick="testDetailed()">Test with Full Headers & Details</button>
        <div id="test4-result"></div>
    </div>

    <h3>Full Debug Log:</h3>
    <textarea id="debug-log" readonly></textarea>

    <script>
        function log(msg) {
            const timestamp = new Date().toISOString();
            const logArea = document.getElementById('debug-log');
            logArea.value += `[${timestamp}] ${msg}\n`;
            logArea.scrollTop = logArea.scrollHeight;
            console.log(msg);
        }

        function setResult(testId, success, message) {
            const element = document.getElementById(testId + '-result');
            element.className = success ? 'success' : 'error';
            element.innerHTML = message;
        }

        async function testBasic() {
            log('=== TEST 1: Basic Railway Connection ===');
            try {
                const url = 'https://railwayclemail-production.up.railway.app/';
                log(`Fetching: ${url}`);
                
                const response = await fetch(url);
                log(`Status: ${response.status} ${response.statusText}`);
                log(`Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`);
                
                const text = await response.text();
                log(`Response: ${text}`);
                
                setResult('test1', response.ok, `✅ Connected: ${response.status} ${response.statusText}`);
            } catch (e) {
                log(`ERROR: ${e.message}`);
                setResult('test1', false, `❌ Failed: ${e.message}`);
            }
        }

        async function testStatus() {
            log('=== TEST 2: HeyReach Status Endpoint ===');
            try {
                const url = 'https://railwayclemail-production.up.railway.app/heyreach-status';
                log(`Fetching: ${url}`);
                
                const response = await fetch(url);
                log(`Status: ${response.status} ${response.statusText}`);
                log(`Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`);
                
                const text = await response.text();
                log(`Response: ${text}`);
                
                if (response.ok) {
                    const data = JSON.parse(text);
                    log(`Endpoints available: ${JSON.stringify(data.endpoints, null, 2)}`);
                    setResult('test2', true, `✅ Status OK: ${data.endpoints.length} endpoints available`);
                } else {
                    setResult('test2', false, `❌ Status failed: ${response.status}`);
                }
            } catch (e) {
                log(`ERROR: ${e.message}`);
                setResult('test2', false, `❌ Failed: ${e.message}`);
            }
        }

        async function testVerify() {
            log('=== TEST 3: HeyReach Verify Endpoint ===');
            try {
                const url = 'https://railwayclemail-production.up.railway.app/proxy/heyreach/api-key/verify';
                log(`Fetching: ${url}`);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': 'test-key-from-browser'
                    },
                    body: JSON.stringify({})
                });
                
                log(`Status: ${response.status} ${response.statusText}`);
                log(`Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`);
                
                const text = await response.text();
                log(`Response: ${text}`);
                
                if (response.status === 400 || response.status === 401) {
                    setResult('test3', true, `✅ Endpoint exists: ${response.status} (expected error)`);
                } else if (response.status === 404) {
                    setResult('test3', false, `❌ Endpoint not found: 404`);
                } else {
                    setResult('test3', true, `✅ Unexpected but valid response: ${response.status}`);
                }
            } catch (e) {
                log(`ERROR: ${e.message}`);
                setResult('test3', false, `❌ Failed: ${e.message}`);
            }
        }

        async function testDetailed() {
            log('=== TEST 4: Detailed Request Analysis ===');
            try {
                const url = 'https://railwayclemail-production.up.railway.app/proxy/heyreach/api-key/verify';
                log(`Full URL: ${url}`);
                log(`User Agent: ${navigator.userAgent}`);
                log(`Browser: ${navigator.appName} ${navigator.appVersion}`);
                
                const startTime = performance.now();
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': 'detailed-test-key',
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    },
                    body: JSON.stringify({ test: 'detailed' }),
                    cache: 'no-cache'
                });
                
                const endTime = performance.now();
                log(`Request took: ${endTime - startTime}ms`);
                log(`Final URL: ${response.url}`);
                log(`Status: ${response.status} ${response.statusText}`);
                log(`Response Type: ${response.type}`);
                log(`Redirected: ${response.redirected}`);
                
                const allHeaders = {};
                response.headers.forEach((value, key) => {
                    allHeaders[key] = value;
                });
                log(`All Response Headers: ${JSON.stringify(allHeaders, null, 2)}`);
                
                const text = await response.text();
                log(`Response Body: ${text}`);
                
                setResult('test4', true, `Request completed: ${response.status}`);
            } catch (e) {
                log(`DETAILED ERROR: ${e.message}`);
                log(`Error Stack: ${e.stack}`);
                setResult('test4', false, `❌ Detailed test failed: ${e.message}`);
            }
        }

        // Auto-run tests on page load
        window.onload = function() {
            log('Debug page loaded. Browser: ' + navigator.userAgent);
            log('Location: ' + window.location.href);
        };
    </script>
</body>
</html>
