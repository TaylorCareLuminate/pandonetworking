<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Sending Diagnostic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        document.documentElement.style.display = 'none';
    </script>
    
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    <script src="../js/folder-protection.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: linear-gradient(135deg, #264653 0%, #1a3a47 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2a9d8f;
            color: white;
        }
        
        .btn:hover:not(:disabled) {
            background: #238276;
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }
        
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #52b788;
        }
        
        pre {
            background: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.9rem;
            border: 1px solid #e5e7eb;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .mismatch {
            background: #fee2e2 !important;
        }
        
        .match {
            background: #d4edda !important;
        }
    </style>
</head>
<body>
    <div id="auth-loading" style="display: none;">Loading...</div>
    <div id="not-logged-in" style="display: none;">Not logged in</div>
    <div id="logged-in" style="display: none;">Logged in</div>

    <div class="container">
        <header>
            <h1><i class="fas fa-stethoscope"></i> Account Sending Diagnostic</h1>
            <p>Diagnose why emails are sending from the wrong account</p>
        </header>
        
        <div class="card">
            <h2>🔍 Diagnostic Checks</h2>
            
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i>
                <div>
                    This tool will help diagnose why emails are sending from Ryan's account instead of being distributed.
                    <br><strong>Click the button below to run all checks.</strong>
                </div>
            </div>
            
            <button class="btn" onclick="runDiagnostic()" id="runBtn">
                <i class="fas fa-play"></i> Run Full Diagnostic
            </button>
            
            <div id="results"></div>
        </div>
    </div>
    
    <script>
        let firestoreDb;
        
        window.firebaseReady.then(async () => {
            setTimeout(async () => {
                if (window.auth && window.auth.currentUser) {
                    try {
                        const { collection, getDocs, query, where, orderBy, limit } = window.clemailFirestore;
                        
                        window.firestoreFunctions = { collection, getDocs, query, where, orderBy, limit };
                        
                        firestoreDb = window.clemailDb;
                        console.log('🔒 Using CLEmail secure wrapper');
                        document.documentElement.style.display = 'block';
                    } catch (error) {
                        console.error('Error initializing:', error);
                        document.body.innerHTML = `<div style="text-align: center; padding: 50px;"><h2 style="color: #e76f51;">Initialization Error</h2><p>${error.message}</p></div>`;
                        document.documentElement.style.display = 'block';
                    }
                }
            }, 1000);
        });
        
        async function runDiagnostic() {
            const runBtn = document.getElementById('runBtn');
            const resultsDiv = document.getElementById('results');
            
            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';
            resultsDiv.innerHTML = '<div style="padding: 20px; text-align: center;"><i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i><p>Running diagnostic checks...</p></div>';
            
            let html = '';
            
            try {
                const { collection, getDocs, query, where, orderBy, limit } = window.firestoreFunctions;
                
                // CHECK 1: Email Accounts Status
                html += `<h3>✅ Check 1: Email Accounts Status</h3>`;
                const accountsSnapshot = await getDocs(collection(firestoreDb, 'emailAccounts'));
                const accounts = [];
                accountsSnapshot.docs.forEach(doc => {
                    accounts.push({ id: doc.id, ...doc.data() });
                });
                
                const ryanAccount = accounts.find(a => a.email?.toLowerCase().includes('ryan.saliman'));
                
                html += `<table>
                    <tr><th>Account</th><th>Email</th><th>ID</th><th>Active</th><th>Enabled</th></tr>`;
                accounts.forEach(acc => {
                    const highlight = acc.id === ryanAccount?.id ? ' style="background: #fef3c7;"' : '';
                    html += `<tr${highlight}>
                        <td>${acc.name || 'N/A'}</td>
                        <td>${acc.email || 'N/A'}</td>
                        <td><code>${acc.id}</code></td>
                        <td>${acc.isActive ? '✅ Yes' : '❌ No'}</td>
                        <td>${acc.enabled !== false ? '✅ Yes' : '❌ No'}</td>
                    </tr>`;
                });
                html += `</table>`;
                
                if (ryanAccount) {
                    html += `<p><strong>Ryan's Account ID:</strong> <code>${ryanAccount.id}</code></p>`;
                }
                
                const enabledAccounts = accounts.filter(a => a.isActive && a.enabled !== false);
                if (enabledAccounts.length === 1 && enabledAccounts[0].id === ryanAccount?.id) {
                    html += `<div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>🚨 PROBLEM FOUND:</strong> Ryan's account is the ONLY enabled account!
                        <br>All other accounts are disabled. This is why all emails go from Ryan.
                    </div>`;
                } else if (enabledAccounts.length === 0) {
                    html += `<div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>🚨 CRITICAL:</strong> NO accounts are enabled! No emails can be sent.
                    </div>`;
                }
                
                // CHECK 2: Scheduled Emails AccountId Distribution
                html += `<h3 style="margin-top: 30px;">✅ Check 2: Scheduled Emails AccountId Distribution</h3>`;
                const scheduledQuery = query(
                    collection(firestoreDb, 'scheduledEmails'),
                    where('status', '==', 'scheduled'),
                    limit(500)
                );
                const scheduledSnapshot = await getDocs(scheduledQuery);
                
                const accountIdCounts = {};
                const emailsByAccount = {};
                
                scheduledSnapshot.docs.forEach(doc => {
                    const email = doc.data();
                    const accountId = email.accountId || 'NO_ACCOUNT_ID';
                    accountIdCounts[accountId] = (accountIdCounts[accountId] || 0) + 1;
                    
                    if (!emailsByAccount[accountId]) {
                        emailsByAccount[accountId] = [];
                    }
                    emailsByAccount[accountId].push({
                        id: doc.id,
                        to: email.to,
                        subject: email.subject,
                        sendAt: email.sendAt,
                        preferredAccount: email.preferredAccount
                    });
                });
                
                html += `<table>
                    <tr><th>Account ID</th><th>Email Address</th><th># of Scheduled Emails</th></tr>`;
                
                Object.keys(accountIdCounts).sort((a, b) => accountIdCounts[b] - accountIdCounts[a]).forEach(accountId => {
                    const account = accounts.find(a => a.id === accountId);
                    const count = accountIdCounts[accountId];
                    const isRyan = accountId === ryanAccount?.id;
                    const highlight = isRyan ? ' style="background: #fef3c7;"' : '';
                    
                    html += `<tr${highlight}>
                        <td><code>${accountId}</code></td>
                        <td>${account?.email || 'Unknown'}</td>
                        <td><strong>${count}</strong> emails${isRyan ? ' 🚨' : ''}</td>
                    </tr>`;
                });
                html += `</table>`;
                
                const ryanEmailCount = accountIdCounts[ryanAccount?.id] || 0;
                const totalScheduled = scheduledSnapshot.size;
                const ryanPercentage = Math.round((ryanEmailCount / totalScheduled) * 100);
                
                if (ryanPercentage > 80) {
                    html += `<div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>🚨 PROBLEM FOUND:</strong> ${ryanPercentage}% of scheduled emails have Ryan's accountId!
                        <br>The accountId field in scheduledEmails is SET WRONG despite the fix tool running.
                        <br><strong>Solution:</strong> Run the Account ID Fix Tool again in reschedule_failed_emails.html
                    </div>`;
                } else if (ryanPercentage > 30) {
                    html += `<div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>⚠️ WARNING:</strong> ${ryanPercentage}% of scheduled emails are from Ryan. Expected distribution is more balanced.
                    </div>`;
                } else {
                    html += `<div class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <strong>✅ GOOD:</strong> Account distribution looks balanced (Ryan has ${ryanPercentage}%).
                    </div>`;
                }
                
                // CHECK 3: Sample Mismatches (accountId vs preferredAccount)
                html += `<h3 style="margin-top: 30px;">✅ Check 3: AccountId vs PreferredAccount Mismatches</h3>`;
                let mismatches = [];
                
                scheduledSnapshot.docs.forEach(doc => {
                    const email = doc.data();
                    if (email.preferredAccount && email.preferredAccount.id && email.accountId !== email.preferredAccount.id) {
                        mismatches.push({
                            id: doc.id,
                            to: email.to,
                            accountId: email.accountId,
                            preferredAccountId: email.preferredAccount.id,
                            preferredAccountEmail: email.preferredAccount.email
                        });
                    }
                });
                
                if (mismatches.length > 0) {
                    html += `<div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>🚨 FOUND ${mismatches.length} MISMATCHES!</strong>
                        <br>These emails have accountId different from preferredAccount.id
                    </div>`;
                    
                    html += `<table>
                        <tr><th>Recipient</th><th>Current accountId</th><th>Should Be (preferredAccount)</th></tr>`;
                    mismatches.slice(0, 10).forEach(m => {
                        html += `<tr class="mismatch">
                            <td>${m.to}</td>
                            <td><code>${m.accountId}</code></td>
                            <td><code>${m.preferredAccountId}</code> (${m.preferredAccountEmail})</td>
                        </tr>`;
                    });
                    html += `</table>`;
                    
                    if (mismatches.length > 10) {
                        html += `<p><em>...and ${mismatches.length - 10} more mismatches</em></p>`;
                    }
                    
                    html += `<div class="alert alert-warning" style="margin-top: 15px;">
                        <i class="fas fa-tools"></i>
                        <strong>ACTION REQUIRED:</strong> Run the "Account ID Fix Tool" in reschedule_failed_emails.html to fix these mismatches.
                    </div>`;
                } else {
                    html += `<div class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <strong>✅ NO MISMATCHES:</strong> All accountId fields match preferredAccount.id
                    </div>`;
                }
                
                // CHECK 4: Recently Sent Emails
                html += `<h3 style="margin-top: 30px;">✅ Check 4: Recently Sent Emails (Last 20)</h3>`;
                try {
                    const response = await fetch('https://railwayclemail-production.up.railway.app/api/sent-emails-recent?days=1');
                    if (response.ok) {
                        const sentEmails = await response.json();
                        const recentSent = sentEmails.slice(0, 20);
                        
                        const sentByAccount = {};
                        recentSent.forEach(email => {
                            const accountId = email.accountId || email.sentViaAccount || 'UNKNOWN';
                            sentByAccount[accountId] = (sentByAccount[accountId] || 0) + 1;
                        });
                        
                        html += `<table>
                            <tr><th>Account ID</th><th>Email</th><th># Sent Today</th></tr>`;
                        Object.keys(sentByAccount).forEach(accountId => {
                            const account = accounts.find(a => a.id === accountId);
                            const isRyan = accountId === ryanAccount?.id;
                            const highlight = isRyan ? ' style="background: #fef3c7;"' : '';
                            
                            html += `<tr${highlight}>
                                <td><code>${accountId}</code></td>
                                <td>${account?.email || 'Unknown'}</td>
                                <td><strong>${sentByAccount[accountId]}</strong>${isRyan ? ' 🚨' : ''}</td>
                            </tr>`;
                        });
                        html += `</table>`;
                        
                        const ryanSentCount = sentByAccount[ryanAccount?.id] || 0;
                        const ryanSentPercentage = Math.round((ryanSentCount / recentSent.length) * 100);
                        
                        if (ryanSentPercentage > 80) {
                            html += `<div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle"></i>
                                <strong>🚨 CONFIRMED:</strong> ${ryanSentPercentage}% of recently sent emails went from Ryan!
                                <br>This confirms the issue is ACTIVELY HAPPENING.
                            </div>`;
                        }
                    } else {
                        html += `<p><em>Could not load sent emails from Railway API</em></p>`;
                    }
                } catch (error) {
                    html += `<p><em>Error loading sent emails: ${error.message}</em></p>`;
                }
                
                // SUMMARY
                html += `<h2 style="margin-top: 40px; padding-top: 20px; border-top: 2px solid #e5e7eb;">📋 Diagnostic Summary</h2>`;
                html += `<div style="padding: 20px; background: #f9fafb; border-radius: 8px; border-left: 4px solid #3b82f6;">`;
                
                if (enabledAccounts.length === 1 && enabledAccounts[0].id === ryanAccount?.id) {
                    html += `<p><strong>🎯 ROOT CAUSE:</strong> Only Ryan's account is enabled in emailAccounts!</p>`;
                    html += `<p><strong>🔧 FIX:</strong> Go to <code>/admin/email_controls.html</code> and enable the other email accounts.</p>`;
                } else if (ryanPercentage > 80) {
                    html += `<p><strong>🎯 ROOT CAUSE:</strong> scheduledEmails have wrong accountId (all pointing to Ryan)!</p>`;
                    html += `<p><strong>🔧 FIX:</strong> Run the "Account ID Fix Tool" in <code>reschedule_failed_emails.html</code></p>`;
                } else if (mismatches.length > 0) {
                    html += `<p><strong>🎯 ISSUE:</strong> ${mismatches.length} emails have accountId that doesn't match preferredAccount!</p>`;
                    html += `<p><strong>🔧 FIX:</strong> Run the "Account ID Fix Tool" in <code>reschedule_failed_emails.html</code></p>`;
                } else {
                    html += `<p><strong>✅ DATA LOOKS CORRECT:</strong> Scheduled emails have proper account distribution.</p>`;
                    html += `<p><strong>🔍 NEXT STEP:</strong> Check Railway logs to see if accounts are being blocked during send (rate limits, etc.)</p>`;
                }
                
                html += `</div>`;
                
            } catch (error) {
                html += `<div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i>
                    <strong>Error running diagnostic:</strong> ${error.message}
                </div>`;
                console.error('Diagnostic error:', error);
            }
            
            resultsDiv.innerHTML = html;
            runBtn.disabled = false;
            runBtn.innerHTML = '<i class="fas fa-play"></i> Run Full Diagnostic';
        }
    </script>
</body>
</html>
