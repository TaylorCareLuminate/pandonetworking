<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyReach Campaign Sync - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0077b5;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .page-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-select, .form-input {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 119, 181, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #005885;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: var(--gray);
            color: white;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value.campaigns { color: var(--primary); }
        .stat-value.leads { color: var(--success); }
        .stat-value.customers { color: var(--accent); }
        .stat-value.matched { color: var(--warning); }

        .section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .campaigns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .campaign-card {
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .campaign-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .campaign-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .campaign-customer {
            font-size: 0.9rem;
            color: var(--gray);
        }

        .campaign-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-in_progress {
            background: #fef3c7;
            color: #92400e;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-paused {
            background: #fee2e2;
            color: #991b1b;
        }

        .campaign-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .campaign-stat {
            text-align: center;
        }

        .campaign-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .campaign-stat-label {
            font-size: 0.8rem;
            color: var(--gray);
        }

        .leads-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .leads-table th,
        .leads-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .leads-table th {
            background: var(--light-gray);
            font-weight: 600;
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .leads-table tr:hover {
            background: #f8fafc;
        }

        .lead-status {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .lead-status.active {
            background: #d1fae5;
            color: #065f46;
        }

        .lead-status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .lead-status.completed {
            background: #e0e7ff;
            color: #3730a3;
        }

        .lead-status.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .loading i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-info {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }

        .alert-warning {
            background: #fffbeb;
            border-color: #fed7aa;
            color: #92400e;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .alert-danger {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .linkedin-url {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .linkedin-url:hover {
            text-decoration: underline;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            transition: width 0.3s ease;
        }

        .sync-info {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .campaigns-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fab fa-linkedin"></i>
                HeyReach Campaign Sync
            </h1>
            <p>Monitor and sync campaign data and lead progress from HeyReach</p>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="section-title">
                <i class="fas fa-cogs"></i>
                Sync Controls
            </div>
            
            <div class="controls-grid">
                <div class="form-group">
                    <label class="form-label">Customer Filter</label>
                    <select id="customerSelect" class="form-select" onchange="loadData()">
                        <option value="">All Customers</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Campaign Filter</label>
                    <select id="campaignSelect" class="form-select" onchange="loadLeads()">
                        <option value="">All Campaigns</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Lead Status Filter</label>
                    <select id="statusSelect" class="form-select" onchange="loadLeads()">
                        <option value="">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="syncNow()">
                    <i class="fas fa-sync-alt"></i>
                    Sync Now
                </button>
                <button class="btn btn-success" onclick="matchActivities()">
                    <i class="fas fa-link"></i>
                    Match LinkedIn Activities
                </button>
                <button class="btn btn-secondary" onclick="loadData()">
                    <i class="fas fa-refresh"></i>
                    Refresh Data
                </button>
                <button class="btn btn-warning" onclick="exportData()">
                    <i class="fas fa-download"></i>
                    Export CSV
                </button>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-value customers" id="totalCustomers">0</div>
                <div class="stat-label">Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value campaigns" id="totalCampaigns">0</div>
                <div class="stat-label">Campaigns</div>
            </div>
            <div class="stat-card">
                <div class="stat-value leads" id="totalLeads">0</div>
                <div class="stat-label">Total Leads</div>
            </div>
            <div class="stat-card">
                <div class="stat-value matched" id="matchedActivities">0</div>
                <div class="stat-label">Matched Activities</div>
            </div>
        </div>

        <!-- Sync Status -->
        <div id="syncStatus" class="sync-info" style="display: none;">
            <strong>Last Sync:</strong> <span id="lastSyncTime">Never</span> | 
            <strong>Status:</strong> <span id="syncStatusText">Ready</span>
        </div>

        <!-- Campaigns Section -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-bullhorn"></i>
                HeyReach Campaigns
                <div style="margin-left: auto; font-size: 0.9rem; font-weight: normal;" id="campaignCount">0 campaigns</div>
            </div>
            
            <div id="campaignsContainer">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading campaigns...</p>
                </div>
            </div>
        </div>

        <!-- Leads Section -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-users"></i>
                Campaign Leads
                <div style="margin-left: auto; font-size: 0.9rem; font-weight: normal;" id="leadCount">0 leads</div>
            </div>
            
            <div id="leadsContainer">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading leads...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Load centralized auth and secure wrapper -->
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    <script src="../js/folder-protection.js"></script>

    <script type="module">
        // Wait for auth and secure wrapper to be ready
        await window.firebaseReady;
        
        // Protect this page (CRM folder)
        window.protectFolder('crm');
        
        console.log('🔒 Using CLEmail secure wrapper');
        
        // Use secure wrapper functions
        const { collection, getDocs, query, where, orderBy, limit } = window.clemailFirestore;
        const db = window.clemailDb;

        // Global state
        let customers = [];
        let campaigns = [];
        let leads = [];
        let stats = {};

        // Initialize the application
        async function initialize() {
            console.log('🚀 Initializing HeyReach Sync Manager...');
            await loadCustomers();
            await loadStats();
            await loadData();
        }

        // Load customers
        async function loadCustomers() {
            try {
                console.log('🔍 Loading customers...');
                const customersSnapshot = await getDocs(collection(db, 'customerList'));
                customers = [];
                
                customersSnapshot.docs.forEach((doc) => {
                    const customerData = { id: doc.id, ...doc.data() };
                    if (customerData.name && customerData.heyreachEnabled) {
                        customers.push(customerData);
                    }
                });

                // Update customer dropdown
                const customerSelect = document.getElementById('customerSelect');
                customerSelect.innerHTML = '<option value="">All Customers</option>';
                customers.forEach(customer => {
                    const option = document.createElement('option');
                    option.value = customer.id;
                    option.textContent = customer.name || 'Unnamed Customer';
                    customerSelect.appendChild(option);
                });

                console.log('✅ Loaded customers:', customers.length);
            } catch (error) {
                console.error('❌ Error loading customers:', error);
                showAlert('Error loading customers: ' + error.message, 'danger');
            }
        }

        // Load sync statistics
        async function loadStats() {
            try {
                const response = await fetch('https://railwayclemail-production.up.railway.app/heyreach/sync/stats');
                const data = await response.json();
                
                if (data.success) {
                    stats = data.stats;
                    updateStatsDisplay();
                }
            } catch (error) {
                console.error('❌ Error loading stats:', error);
            }
        }

        // Update statistics display
        function updateStatsDisplay() {
            document.getElementById('totalCustomers').textContent = Object.keys(stats.customerStats || {}).length;
            document.getElementById('totalCampaigns').textContent = stats.totalCampaigns || 0;
            document.getElementById('totalLeads').textContent = stats.totalLeads || 0;
            
            // Calculate matched activities (placeholder - would need actual data)
            document.getElementById('matchedActivities').textContent = stats.matchedActivities || 0;
            
            if (stats.lastSyncTime) {
                const syncTime = new Date(stats.lastSyncTime.seconds ? stats.lastSyncTime.seconds * 1000 : stats.lastSyncTime);
                document.getElementById('lastSyncTime').textContent = syncTime.toLocaleString();
                document.getElementById('syncStatus').style.display = 'block';
            }
        }

        // Load campaigns and leads data
        window.loadData = async function() {
            await loadCampaigns();
            await loadLeads();
        };

        // Load campaigns
        async function loadCampaigns() {
            try {
                console.log('🔍 Loading HeyReach campaigns...');
                showLoadingCampaigns();

                const customerId = document.getElementById('customerSelect').value;
                let url = 'https://railwayclemail-production.up.railway.app/heyreach/campaigns';
                
                if (customerId) {
                    url += `?customerId=${customerId}`;
                }

                console.log('🔍 Fetching campaigns from:', url);
                const response = await fetch(url);
                console.log('🔍 Campaign response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Campaign response error:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('🔍 Campaign response data:', data);

                if (data.success) {
                    campaigns = data.campaigns || [];
                    console.log('✅ Loaded campaigns:', campaigns.length);
                    console.log('🔍 Sample campaign:', campaigns[0]);
                    
                    // Update campaign dropdown
                    updateCampaignDropdown();
                    displayCampaigns();
                } else {
                    throw new Error(data.error || 'Failed to load campaigns');
                }
            } catch (error) {
                console.error('❌ Error loading campaigns:', error);
                showAlert('Error loading campaigns: ' + error.message, 'danger');
                hideLoadingCampaigns();
            }
        }

        // Update campaign dropdown
        function updateCampaignDropdown() {
            const campaignSelect = document.getElementById('campaignSelect');
            campaignSelect.innerHTML = '<option value="">All Campaigns</option>';
            
            campaigns.forEach(campaign => {
                const option = document.createElement('option');
                option.value = campaign.heyreachCampaignId;
                option.textContent = campaign.name || 'Unnamed Campaign';
                campaignSelect.appendChild(option);
            });
        }

        // Display campaigns
        function displayCampaigns() {
            const container = document.getElementById('campaignsContainer');
            document.getElementById('campaignCount').textContent = `${campaigns.length} campaigns`;

            if (campaigns.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No HeyReach campaigns found. Try syncing data or check your customer configurations.
                    </div>
                `;
                return;
            }

            let html = '<div class="campaigns-grid">';

            campaigns.forEach(campaign => {
                const customer = customers.find(c => c.id === campaign.customerId);
                const progressStats = campaign.progressStats || {};
                const totalUsers = progressStats.totalUsers || 0;
                const finishedUsers = progressStats.totalUsersFinished || 0;
                const progressPercent = totalUsers > 0 ? Math.round((finishedUsers / totalUsers) * 100) : 0;

                html += `
                    <div class="campaign-card">
                        <div class="campaign-header">
                            <div>
                                <div class="campaign-name">${campaign.name || 'Unnamed Campaign'}</div>
                                <div class="campaign-customer">${customer?.name || 'Unknown Customer'}</div>
                            </div>
                            <span class="campaign-status status-${(campaign.status || 'unknown').toLowerCase()}">
                                ${campaign.status || 'Unknown'}
                            </span>
                        </div>
                        
                        <div style="margin: 1rem 0;">
                            <small style="color: var(--gray);">Campaign Progress</small>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                            <small style="color: var(--gray);">${finishedUsers}/${totalUsers} leads completed (${progressPercent}%)</small>
                        </div>

                        <div class="campaign-stats">
                            <div class="campaign-stat">
                                <div class="campaign-stat-value">${progressStats.totalUsersInProgress || 0}</div>
                                <div class="campaign-stat-label">In Progress</div>
                            </div>
                            <div class="campaign-stat">
                                <div class="campaign-stat-value">${progressStats.totalUsersPending || 0}</div>
                                <div class="campaign-stat-label">Pending</div>
                            </div>
                            <div class="campaign-stat">
                                <div class="campaign-stat-value">${progressStats.totalUsersFinished || 0}</div>
                                <div class="campaign-stat-label">Finished</div>
                            </div>
                            <div class="campaign-stat">
                                <div class="campaign-stat-value">${progressStats.totalUsersFailed || 0}</div>
                                <div class="campaign-stat-label">Failed</div>
                            </div>
                        </div>

                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--gray);">
                            <div><strong>HeyReach ID:</strong> ${campaign.heyreachCampaignId}</div>
                            <div><strong>List:</strong> ${campaign.linkedInUserListName || 'N/A'}</div>
                            <div><strong>Last Sync:</strong> ${campaign.lastSyncAt ? new Date(campaign.lastSyncAt.seconds * 1000).toLocaleString() : 'Never'}</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Load leads
        window.loadLeads = async function() {
            try {
                console.log('🔍 Loading HeyReach leads...');
                showLoadingLeads();

                const customerId = document.getElementById('customerSelect').value;
                const campaignId = document.getElementById('campaignSelect').value;
                const status = document.getElementById('statusSelect').value;

                let url = 'https://railwayclemail-production.up.railway.app/heyreach/leads?';
                const params = new URLSearchParams();
                
                if (customerId) params.append('customerId', customerId);
                if (campaignId) params.append('campaignId', campaignId);
                if (status) params.append('status', status);
                params.append('limit', '500');

                const response = await fetch(url + params.toString());
                const data = await response.json();

                if (data.success) {
                    leads = data.leads || [];
                    console.log('✅ Loaded leads:', leads.length);
                    displayLeads();
                } else {
                    throw new Error(data.error || 'Failed to load leads');
                }
            } catch (error) {
                console.error('❌ Error loading leads:', error);
                showAlert('Error loading leads: ' + error.message, 'danger');
                hideLoadingLeads();
            }
        };

        // Display leads
        function displayLeads() {
            const container = document.getElementById('leadsContainer');
            document.getElementById('leadCount').textContent = `${leads.length} leads`;

            if (leads.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No leads found for the selected filters.
                    </div>
                `;
                return;
            }

            let html = `
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Company</th>
                            <th>Campaign</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Messages</th>
                            <th>LinkedIn</th>
                            <th>Last Activity</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            leads.forEach(lead => {
                const campaign = campaigns.find(c => c.heyreachCampaignId === lead.heyreachCampaignId);
                const customer = customers.find(c => c.id === lead.customerId);
                
                html += `
                    <tr>
                        <td>
                            <div>
                                <strong>${lead.firstName || ''} ${lead.lastName || ''}</strong>
                                <br>
                                <small style="color: var(--gray);">${lead.email || 'No email'}</small>
                            </div>
                        </td>
                        <td>${lead.company || 'Unknown'}</td>
                        <td>
                            <div>
                                <strong>${campaign?.name || 'Unknown Campaign'}</strong>
                                <br>
                                <small style="color: var(--gray);">${customer?.name || 'Unknown Customer'}</small>
                            </div>
                        </td>
                        <td>
                            <span class="lead-status ${(lead.status || 'unknown').toLowerCase()}">
                                ${lead.status || 'Unknown'}
                            </span>
                        </td>
                        <td>${lead.progress || lead.currentStep || 'N/A'}</td>
                        <td>${lead.messagesCount || 0}</td>
                        <td>
                            ${lead.linkedinUrl ? 
                                `<a href="${lead.linkedinUrl}" target="_blank" class="linkedin-url">
                                    <i class="fab fa-linkedin"></i> Profile
                                </a>` : 
                                '<span style="color: var(--gray);">No URL</span>'
                            }
                        </td>
                        <td>
                            ${lead.lastActivity ? 
                                new Date(lead.lastActivity.seconds ? lead.lastActivity.seconds * 1000 : lead.lastActivity).toLocaleDateString() : 
                                'N/A'
                            }
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Sync data now
        window.syncNow = async function() {
            if (!confirm('This will sync all HeyReach data for all customers. This may take several minutes. Continue?')) {
                return;
            }

            try {
                showAlert('Starting HeyReach sync...', 'info');
                document.getElementById('syncStatusText').textContent = 'Syncing...';
                
                console.log('🔄 Triggering HeyReach sync...');

                const response = await fetch('https://railwayclemail-production.up.railway.app/heyreach/sync', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                console.log('🔍 Sync response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Sync response error:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('🔍 Sync response data:', data);
                
                if (data.success) {
                    showAlert(`Sync completed! ${data.results.customers} customers, ${data.results.campaigns} campaigns, ${data.results.leads} leads synced. ${data.results.errors.length} errors.`, 
                             data.results.errors.length > 0 ? 'warning' : 'success');
                    
                    // Show errors if any
                    if (data.results.errors.length > 0) {
                        console.warn('⚠️ Sync errors:', data.results.errors);
                        data.results.errors.forEach(error => {
                            console.warn(`❌ ${error.customer}: ${error.error}`);
                        });
                    }
                    
                    // Refresh data
                    await loadStats();
                    await loadData();
                    
                    document.getElementById('syncStatusText').textContent = 'Complete';
                    document.getElementById('lastSyncTime').textContent = new Date().toLocaleString();
                } else {
                    showAlert('Sync failed: ' + data.error, 'danger');
                    document.getElementById('syncStatusText').textContent = 'Failed';
                }
            } catch (error) {
                console.error('❌ Error syncing data:', error);
                showAlert('Sync error: ' + error.message, 'danger');
                document.getElementById('syncStatusText').textContent = 'Error';
            }
        };

        // Match LinkedIn activities with HeyReach leads
        window.matchActivities = async function() {
            if (!confirm('This will match LinkedIn activities with HeyReach leads. Continue?')) {
                return;
            }

            try {
                showAlert('Matching LinkedIn activities with HeyReach leads...', 'info');

                const response = await fetch('https://railwayclemail-production.up.railway.app/heyreach/match', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    showAlert(`Matching completed! ${data.results.matched}/${data.results.total} activities matched.`, 'success');
                    await loadStats(); // Refresh stats
                } else {
                    showAlert('Matching failed: ' + data.error, 'danger');
                }
            } catch (error) {
                console.error('Error matching activities:', error);
                showAlert('Matching error: ' + error.message, 'danger');
            }
        };

        // Export data to CSV
        window.exportData = function() {
            if (leads.length === 0) {
                showAlert('No data to export', 'warning');
                return;
            }

            const csvData = [
                ['Name', 'Email', 'Company', 'Campaign', 'Customer', 'Status', 'Progress', 'Messages', 'LinkedIn URL', 'Last Activity']
            ];

            leads.forEach(lead => {
                const campaign = campaigns.find(c => c.heyreachCampaignId === lead.heyreachCampaignId);
                const customer = customers.find(c => c.id === lead.customerId);
                
                csvData.push([
                    `${lead.firstName || ''} ${lead.lastName || ''}`.trim(),
                    lead.email || '',
                    lead.company || '',
                    campaign?.name || '',
                    customer?.name || '',
                    lead.status || '',
                    lead.progress || lead.currentStep || '',
                    lead.messagesCount || 0,
                    lead.linkedinUrl || '',
                    lead.lastActivity ? new Date(lead.lastActivity.seconds ? lead.lastActivity.seconds * 1000 : lead.lastActivity).toLocaleDateString() : ''
                ]);
            });

            const csvContent = csvData.map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `heyreach_leads_${formatDate(new Date())}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);

            showAlert('Data exported successfully', 'success');
        };

        // Utility functions
        function showLoadingCampaigns() {
            document.getElementById('campaignsContainer').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading campaigns...</p>
                </div>
            `;
        }

        function hideLoadingCampaigns() {
            // Loading will be replaced by displayCampaigns()
        }

        function showLoadingLeads() {
            document.getElementById('leadsContainer').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading leads...</p>
                </div>
            `;
        }

        function hideLoadingLeads() {
            // Loading will be replaced by displayLeads()
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : 'info-circle'}"></i> ${message}`;
            
            document.body.appendChild(alertDiv);
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '9999';
            alertDiv.style.minWidth = '300px';
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // Format date as YYYY-MM-DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Initialize when page loads
        initialize();
    </script>
</body>
</html>
