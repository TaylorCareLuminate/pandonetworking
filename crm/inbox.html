<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Inbox - CRM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    :root { --primary:#1e40af; --secondary:#0ea5e9; --gray:#6b7280; --danger:#ef4444; --success:#10b981; --card-shadow:0 2px 8px rgba(0,0,0,0.08); --radius:8px; }
    body { background:#f9fafb; }
    .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
    .page-header { background:#fff; border-radius: var(--radius); box-shadow: var(--card-shadow); padding:20px; margin-bottom:20px; }
    .page-header h1 { margin:0; font-size:1.6rem; color:var(--primary); display:flex; align-items:center; gap:10px; }
    .controls { background:#fff; border-radius: var(--radius); box-shadow: var(--card-shadow); padding:15px; margin-bottom:15px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn { padding:10px 16px; border:none; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-weight:500; }
    .btn-primary { background:var(--secondary); color:#fff; }
    .btn-secondary { background:#6b7280; color:#fff; }
    .btn:hover { transform: translateY(-1px); }
    .inbox { background:#fff; border-radius: var(--radius); box-shadow: var(--card-shadow); overflow:hidden; }
    .list { max-height: 70vh; overflow:auto; }
    .email-row { border-bottom:1px solid #eef2f7; padding:14px 16px; display:grid; grid-template-columns: 220px 1fr 200px; gap:14px; }
    .email-row > div:not(:last-child) { cursor:pointer; }
    .email-row > div:not(:last-child):hover { opacity: 0.8; }
    .email-row:hover { background:#f9fafb; }
    .from { font-weight:600; color:#111827; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .subject { color:#1f2937; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .date { color:var(--gray); text-align:right; white-space:nowrap; }
    .badge { font-size:12px; padding:2px 8px; border-radius:12px; background:#eef2ff; color:#3730a3; margin-left:8px; }
    .meta { color:var(--gray); font-size:12px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty { text-align:center; color:var(--gray); padding:30px; }
    .search { margin-left:auto; display:flex; gap:8px; align-items:center; }
    input[type="text"] { padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; }
    
    /* Email Compose Modal */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; overflow:auto; }
    .modal.active { display:flex; align-items:center; justify-content:center; }
    .modal-content { background:#fff; border-radius:var(--radius); max-width:800px; width:90%; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .modal-header { padding:20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between; }
    .modal-header h2 { margin:0; font-size:1.3rem; color:var(--primary); }
    .modal-body { padding:20px; }
    .form-group { margin-bottom:15px; }
    .form-group label { display:block; margin-bottom:5px; font-weight:600; color:#374151; }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; font-family:inherit; }
    .form-group textarea { min-height:300px; font-family:inherit; resize:vertical; }
    #bodyEmail { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      line-height:1.6; 
      font-size: 14px;
      background: #ffffff;
    }
    .modal-footer { padding:20px; border-top:1px solid #e5e7eb; display:flex; gap:10px; justify-content:flex-end; }
    .btn-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray); }
    .btn-close:hover { color:#000; }
    .btn-success { background:var(--success); color:#fff; }
    .reply-btn { padding:6px 10px; background:#e0f2fe; color:#075985; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; font-weight:500; margin-top:6px; display:inline-flex; align-items:center; gap:4px; margin-right:4px; white-space:nowrap; }
    .reply-btn:hover { background:#bae6fd; transform: translateY(-1px); }
    .reply-btn:last-child { margin-right:0; }
    .cc-bcc-toggle { color:var(--secondary); cursor:pointer; font-size:0.875rem; margin-left:10px; text-decoration:underline; }
    .cc-bcc-toggle:hover { color:var(--primary); }
    .lock-hint { font-size:12px; font-weight:400; color:var(--gray); margin-left:8px; }
    .lock-hint i { color:var(--gray); }
    select#fromAccount:disabled { background:#f3f4f6; color:#4b5563; cursor:not-allowed; }
    .sig-preview { background:#f9fafb; border:1px solid #d1d5db; border-radius:6px; padding:12px 14px; font-size:0.85rem; color:#333; max-height:180px; overflow-y:auto; }
    
    /* Email Viewer Modal */
    .viewer-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; overflow:auto; }
    .viewer-modal.active { display:flex; align-items:center; justify-content:center; padding:20px; }
    .viewer-content { background:#fff; border-radius:var(--radius); max-width:900px; width:100%; max-height:90vh; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.3); display:flex; flex-direction:column; }
    .viewer-header { padding:20px; border-bottom:2px solid #e5e7eb; flex-shrink:0; }
    .viewer-header h2 { margin:0 0 12px 0; font-size:1.4rem; color:var(--primary); word-wrap:break-word; }
    .viewer-meta { display:grid; gap:8px; font-size:0.9rem; }
    .viewer-meta-row { display:flex; gap:8px; }
    .viewer-meta-row strong { min-width:60px; color:var(--gray); font-weight:600; }
    .viewer-meta-row span { color:#1f2937; word-wrap:break-word; flex:1; }
    .viewer-body { padding:20px; overflow-y:auto; flex:1; background:#f9fafb; }
    .viewer-body iframe { width:100%; min-height:400px; border:none; background:#fff; border-radius:6px; }
    .viewer-footer { padding:15px 20px; border-top:1px solid #e5e7eb; display:flex; gap:10px; justify-content:space-between; flex-shrink:0; background:#f9fafb; }
    .load-more-container { text-align:center; padding:20px; background:#fff; border-radius: var(--radius); box-shadow: var(--card-shadow); margin-top:15px; }
    .btn-load-more { padding:12px 24px; background:var(--secondary); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; font-size:1rem; transition: all 0.2s; }
    .btn-load-more:hover:not(:disabled) { transform: translateY(-1px); opacity:0.9; }
    .btn-load-more:disabled { background:#9ca3af; cursor:not-allowed; transform:none; opacity:0.6; }
  </style>
  <script>
    function fmtDate(d) {
      try { return new Date(d).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true }); } catch { return d; }
    }
  </script>

</head>
<body class="crm-page">
  <div id="header-placeholder"></div>
  <div class="container">
    <div class="page-header">
      <h1><i class="fas fa-inbox"></i> Unified Inbox</h1>
      <div style="color:var(--gray); margin-top:6px;">All received emails across all accounts</div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" onclick="loadInbox()"><i class="fas fa-sync"></i> Refresh</button>
      <button id="syncNowBtn" class="btn btn-secondary" onclick="syncNow()"><i class="fas fa-cloud-download-alt"></i> Sync Emails</button>
      <button class="btn btn-success" onclick="composeEmail()"><i class="fas fa-paper-plane"></i> Compose Email</button>
      <select id="accountFilter" onchange="renderList()" style="padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; cursor:pointer;">
        <option value="">All Email Accounts</option>
      </select>
      <select id="customerFilter" onchange="renderList()" style="padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; cursor:pointer;">
        <option value="">All Customers</option>
      </select>
      <select id="categoryFilter" onchange="renderList()" style="padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; cursor:pointer;">
        <option value="">All Categories</option>
        <option value="interested">⭐ Interested</option>
        <option value="optout">🚫 Opt-Out</option>
        <option value="bounce">↩ Bounce</option>
        <option value="ooo">🏖 Out of Office</option>
        <option value="forwarded">📤 Forwarded</option>
        <option value="internal">🏢 Internal</option>
        <option value="other">📧 Uncategorized</option>
      </select>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:0.9rem; color:var(--gray); white-space:nowrap;">
        <input type="checkbox" id="hideMailReach" checked onchange="renderList()" style="cursor:pointer;" />
        Hide MailReach warm-up
      </label>
      <div class="search">
        <input id="searchBox" type="text" placeholder="Search subject or from..." oninput="renderList()" />
      </div>
      <div style="margin-left:auto; color:var(--gray);">
        <i class="fas fa-clock"></i> <span id="lastUpdated">Never</span>
      </div>
    </div>

    <div class="inbox">
      <div id="inboxList" class="list">
        <div class="empty">Loading...</div>
      </div>
    </div>
    
    <!-- Load More Button -->
    <div id="loadMoreContainer" class="load-more-container" style="display:none;">
      <div style="display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;">
        <button id="loadMoreBtn" class="btn-load-more" onclick="loadMoreEmails()">
          <i class="fas fa-arrow-down"></i> Load More (100)
        </button>
        <button id="loadAllBtn" class="btn-load-more" onclick="loadAllEmails()" style="background:#10b981;">
          <i class="fas fa-list"></i> Load All Emails
        </button>
      </div>
      <div style="color:var(--gray); margin-top:8px; font-size:0.9rem;">
        Showing <span id="emailCount">0</span> of <span id="totalEmailCount">0</span> emails
      </div>
    </div>
  </div>

  <!-- Email Compose Modal -->
  <div id="composeModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-paper-plane"></i> <span id="modalTitle">Compose Email</span></h2>
        <button class="btn-close" onclick="closeComposeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="fromAccount">From Account <span id="fromAccountLockHint" class="lock-hint" style="display:none;"><i class="fas fa-lock"></i> Locked to the account that received this email</span></label>
          <select id="fromAccount" onchange="updateSignaturePreview()"></select>
        </div>
        <div class="form-group">
          <label for="toEmail">To</label>
          <input type="text" id="toEmail" placeholder="recipient@example.com">
          <span class="cc-bcc-toggle" onclick="toggleCcBcc()">+ Add CC/BCC</span>
        </div>
        <div class="form-group" id="ccGroup" style="display:none;">
          <label for="ccEmail">CC</label>
          <input type="text" id="ccEmail" placeholder="cc@example.com (separate multiple with commas)">
        </div>
        <div class="form-group" id="bccGroup" style="display:none;">
          <label for="bccEmail">BCC</label>
          <input type="text" id="bccEmail" placeholder="bcc@example.com (separate multiple with commas)">
        </div>
        <div class="form-group">
          <label for="subjectEmail">Subject</label>
          <input type="text" id="subjectEmail" placeholder="Email subject">
        </div>
        <div class="form-group">
          <label for="bodyEmail">Message <span style="font-size:12px; font-weight:400; color:#6b7280;">(Signature added automatically)</span></label>
          <textarea id="bodyEmail" placeholder="Type your message here..."></textarea>
        </div>
        <div class="form-group" id="sigPreviewWrap" style="display:none;">
          <label>Signature Preview <span style="font-size:12px; font-weight:400; color:#6b7280;">(added automatically when you send — not part of the message above)</span></label>
          <div id="sigPreview" class="sig-preview"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeComposeModal()">Cancel</button>
        <button class="btn btn-secondary" onclick="saveDraft()" style="margin-right:auto;"><i class="fas fa-save"></i> Save Draft</button>
        <button class="btn btn-success" onclick="sendEmail()"><i class="fas fa-paper-plane"></i> Send</button>
      </div>
    </div>
  </div>

  <!-- Email Viewer Modal -->
  <div id="viewerModal" class="viewer-modal">
    <div class="viewer-content">
      <div class="viewer-header">
        <h2 id="viewerSubject">Email Subject</h2>
        <div class="viewer-meta">
          <div class="viewer-meta-row">
            <strong>From:</strong>
            <span id="viewerFrom"></span>
          </div>
          <div class="viewer-meta-row">
            <strong>To:</strong>
            <span id="viewerTo"></span>
          </div>
          <div class="viewer-meta-row" id="viewerCcRow" style="display:none;">
            <strong>CC:</strong>
            <span id="viewerCc"></span>
          </div>
          <div class="viewer-meta-row">
            <strong>Date:</strong>
            <span id="viewerDate"></span>
          </div>
        </div>
      </div>
      <div class="viewer-body">
        <iframe id="viewerBody" sandbox="allow-same-origin"></iframe>
      </div>
      <div class="viewer-footer">
        <div>
          <button class="btn btn-secondary" onclick="closeViewerModal()">
            <i class="fas fa-times"></i> Close
          </button>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" onclick="replyFromViewer()">
            <i class="fas fa-reply"></i> Reply
          </button>
          <button class="btn btn-primary" onclick="replyAllFromViewer()">
            <i class="fas fa-reply-all"></i> Reply All
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/clemail-firestore-wrapper.js"></script>
  <script src="../js/folder-protection.js"></script>
  <script>
    const RAILWAY = 'https://railwayclemail-production.up.railway.app';

    let receivedEmails = [];
    let clemailDbReady = false;
    let filteredEmails = []; // Track filtered/displayed emails
    let customers = [];
    let emailAccounts = [];
    let sentEmails = []; // Track sent emails for threading
    let replyingTo = null; // Track which email we're replying to
    let isReplyAllMode = false; // Track whether current compose is a Reply All
    let currentViewerEmailIndex = null; // Track which email is being viewed
    let displayLimit = 100; // Start by showing 100 emails
    let serverEmailOffset = 0;  // How many emails have been fetched from the server so far
    let hasMoreOnServer = false; // Whether the server likely has emails beyond what we've fetched
    let bdrLeaders = []; // BDR leaders — used to resolve customer for OAuth accounts tagged 'internal'
    let domainToCustomerId = new Map(); // email domain → customerId, built from bdrLeaders
    let oauthAccountsByEmail = new Map(); // email (lowercase) → OAuth account object from /oauth/accounts
    let oauthSignaturesByEmail = new Map(); // email (lowercase) → { signatureHtml, signatureText }

    async function getAuthHeaders() {
      if (!window.auth?.currentUser) throw new Error('Not authenticated');
      const token = await window.auth.currentUser.getIdToken();
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    }

    // Fetch the live Outlook internal message ID for a received email via /oauth/test/inbox,
    // exactly how oauth_email_connections.html works when the user clicks "↩ Use thread".
    //
    // IMPORTANT: we must NOT use the `search` query param — Microsoft's $search endpoint
    // returns message IDs in a different format that the Graph /reply and /replyAll APIs
    // reject with ErrorInvalidIdMalformed.  Instead we fetch recent messages and match
    // client-side by subject + sender, just like the admin tool's manual flow.
    //
    // Returns { messageId, conversationId } or null if not found.
    async function fetchOutlookThreadIds(oauthAccountId, email) {
      try {
        const headers = await getAuthHeaders();
        const bareSubject  = (email.subject || '').replace(/^(Re|Fwd|FW|RE):\s*/i, '').trim().toLowerCase();
        const senderEmail  = extractEmailAddress(email.from || '').toLowerCase();

        // Helper: fetch a folder without search and find the best match
        const findInFolder = async (folder) => {
          const params = new URLSearchParams({ accountId: oauthAccountId, folder, limit: 50 });
          const res = await fetch(`${RAILWAY}/oauth/test/inbox?${params}`, { headers });
          if (!res.ok) return null;
          const data = await res.json();
          const msgs = data.messages || data.emails || data.value || [];

          // 1st pass: match subject AND sender
          let hit = msgs.find(m => {
            const mSub  = (m.subject || '').replace(/^(Re|Fwd|FW|RE):\s*/i, '').trim().toLowerCase();
            const mFrom = (m.from || m.sender?.emailAddress?.address || '').toLowerCase();
            return mSub === bareSubject && (mFrom.includes(senderEmail) || senderEmail.includes(mFrom));
          });
          // 2nd pass: subject only
          if (!hit) hit = msgs.find(m => {
            const mSub = (m.subject || '').replace(/^(Re|Fwd|FW|RE):\s*/i, '').trim().toLowerCase();
            return mSub === bareSubject;
          });
          return hit || null;
        };

        // Try INBOX first, then ALL mail as a fallback (message may have been auto-filed)
        let match = await findInFolder('INBOX');
        if (!match) match = await findInFolder('ALL');
        if (!match) return null;

        // m.id           = Outlook internal message ID — required for /reply and /replyAll
        // m.conversationId = Outlook conversation ID   — used for threadId
        const messageId      = match.id || '';
        const conversationId = match.conversationId || match.threadId || '';
        console.log('🔍 Fetched live Outlook IDs:', {
          messageId:      messageId.slice(0, 40) + '…',
          conversationId: conversationId.slice(0, 40) + '…',
        });
        return { messageId, conversationId };
      } catch (e) {
        console.warn('Could not fetch Outlook thread IDs (non-blocking):', e.message);
        return null;
      }
    }

    // Load all OAuth-connected accounts AND their live signatures from the backend.
    // Accounts are keyed by email so we can detect OAuth accounts regardless of what
    // Firestore document ID the emailAccounts collection uses.
    // Signatures are fetched from the provider (Gmail / Outlook) exactly the same way
    // oauth_email_connections.html does it — so replies always use the live signature.
    async function loadOAuthAccounts() {
      try {
        const headers = await getAuthHeaders();

        // Fetch accounts and signatures in parallel
        const [accountsRes, sigsRes] = await Promise.all([
          fetch(`${RAILWAY}/oauth/accounts`, { headers }),
          fetch(`${RAILWAY}/oauth/test/signatures`, { headers }).catch(() => null),
        ]);

        if (accountsRes.ok) {
          const data = await accountsRes.json();
          const list = Array.isArray(data) ? data : (data.accounts || []);
          oauthAccountsByEmail = new Map(
            list.filter(a => a.email).map(a => [a.email.toLowerCase(), a])
          );
          console.log('Loaded OAuth accounts for inbox send detection:', oauthAccountsByEmail.size);
        }

        if (sigsRes && sigsRes.ok) {
          const { signatures } = await sigsRes.json();
          oauthSignaturesByEmail = new Map(
            (signatures || [])
              .filter(s => s.email)
              .map(s => [s.email.toLowerCase(), s])
          );
          console.log('Loaded OAuth signatures for inbox:', oauthSignaturesByEmail.size);
        }
      } catch (e) {
        console.warn('Could not load OAuth accounts/signatures (non-blocking):', e);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Initialize CLEmail wrapper
      try {
        await window.firebaseReady;
        clemailDbReady = true;
        console.log('🔒 Using CLEmail secure wrapper');
      } catch (e) {
        console.warn('CLEmail wrapper not ready:', e);
      }
      
      // Always try to load inbox immediately so auth/CDN hiccups don't block viewing
      loadInbox().catch(() => {});

      // Best-effort auth: try to protect folder if auth is available within a short timeout
      try {
        const firebaseReady = window.firebaseReady;
        const ready = await Promise.race([
          (firebaseReady || Promise.reject(new Error('firebaseReady missing'))),
          new Promise((_, rej) => setTimeout(() => rej(new Error('firebase timeout')), 4000))
        ]).then(() => true).catch(() => false);

        if (ready && typeof window.protectFolder === 'function') {
          const ok = await window.protectFolder('crm');
          if (!ok) {
            // Access denied UI handled by folder-protection; stop further work
            return;
          }
        } else {
          console.warn('Auth not ready in time; continuing without gating');
        }
      } catch (e) {
        console.warn('Auth init non-blocking failure:', e);
      }

      // Load customers and email accounts from CLEmail Firebase
      await loadCustomersAndAccounts();
      
      // Load OAuth accounts so send routing works correctly (non-blocking)
      loadOAuthAccounts().catch(() => {});

      // Load sent emails for threading (non-blocking)
      loadSentEmails().catch(() => {});
    });

    async function loadCustomersAndAccounts() {
      try {
        if (!clemailDbReady) {
          await window.firebaseReady;
        }
        const { collection, getDocs } = window.clemailFirestore;
        const db = window.clemailDb;

        // Load customers
        const customersSnap = await getDocs(collection(db, 'customerList'));
        customers = [];
        customersSnap.docs.forEach(doc => {
          customers.push({ id: doc.id, ...doc.data() });
        });
        console.log('Loaded customers:', customers.length);

        // Load email accounts
        const accountsSnap = await getDocs(collection(db, 'emailAccounts'));
        emailAccounts = [];
        accountsSnap.docs.forEach(doc => {
          const data = doc.data();
          emailAccounts.push({ 
            id: doc.id,  // Firebase document ID - THIS is what backend needs as accountId
            accountId: doc.id, // Also store as accountId for clarity
            ...data 
          });
        });
        console.log('Loaded email accounts:', emailAccounts.length);
        console.log('Sample account structure:', emailAccounts[0]);

        // ── Customer filter diagnostics ──────────────────────────────────────
        console.group('📋 Customer filter mapping');
        console.log('Customers (id → name):',
          Object.fromEntries(customers.map(c => [c.id, c.shortName || c.name])));
        console.log('Email accounts (email → customerId):',
          Object.fromEntries(emailAccounts.map(a => [a.email || a.username || a.id, a.customerId ?? '⚠️ NO customerId'])));
        const orphaned = emailAccounts.filter(a => !a.customerId);
        if (orphaned.length) {
          console.warn(`⚠️ ${orphaned.length} email account(s) have NO customerId — emails to these addresses will be invisible to the customer filter:`,
            orphaned.map(a => a.email || a.username || a.id));
        }
        const badRef = emailAccounts.filter(a => a.customerId && !customers.find(c => c.id === a.customerId));
        if (badRef.length) {
          console.warn(`⚠️ ${badRef.length} email account(s) have a customerId that does NOT match any customer document:`,
            badRef.map(a => ({ email: a.email, customerId: a.customerId })));
        }
        console.groupEnd();
        // ────────────────────────────────────────────────────────────────────

        // Load BDR leaders so we can resolve the customer for OAuth accounts
        // that have customerId:'internal' instead of the real customer ID.
        try {
          const { collection: col2, getDocs: gd2 } = window.clemailFirestore;
          const bdrSnap = await gd2(col2(db, 'bdr_leaders'));
          bdrLeaders = [];
          bdrSnap.docs.forEach(doc => bdrLeaders.push({ id: doc.id, ...doc.data() }));
          console.log('Loaded BDR leaders:', bdrLeaders.length);

          // Build domain → customerId map from BDR leaders.
          // e.g. all BDRs whose primaryEmail is @outcomemd.com have customerId 'customer_...'
          // so any email received at *@outcomemd.com maps to that customer.
          domainToCustomerId = new Map();
          bdrLeaders.forEach(b => {
            const email = (b.primaryEmail || b.email || '').toLowerCase();
            const domain = email.split('@')[1];
            if (domain && b.customerId && b.customerId !== 'internal') {
              domainToCustomerId.set(domain, b.customerId);
            }
          });
          console.log('Domain → customer map:', Object.fromEntries(domainToCustomerId));
        } catch (e) {
          console.warn('Could not load BDR leaders (customer filter may be incomplete):', e);
        }

        // Refresh filters with customer data
        populateFilters();
      } catch (e) {
        console.warn('Failed to load customers/accounts:', e);
      }
    }

    async function loadSentEmails() {
      try {
        // Try to load sent emails from backend API
        const res = await fetch('https://railwayclemail-production.up.railway.app/sent-emails?limit=1200');
        if (!res.ok) throw new Error('Failed to load sent emails');

    // Find the most recent sent reply to a given received email
    function findMostRecentSentReply(receivedEmail) {
      if (!receivedEmail || !sentEmails || sentEmails.length === 0) return null;
      
      // Look for sent emails that are replies to this received email
      // They should have inReplyTo matching the received email's messageId
      // Or have matching subject and participants
      const replies = sentEmails.filter(sent => {
        // Check if it's a direct reply via messageId
        if (receivedEmail.messageId && sent.inReplyTo === receivedEmail.messageId) {
          return true;
        }
        
        // Check if it references this email in the references header
        if (receivedEmail.messageId && sent.references && sent.references.includes(receivedEmail.messageId)) {
          return true;
        }
        
        // Fallback: check if subject matches (with or without Re:) and participants match
        const receivedSubject = (receivedEmail.subject || '').replace(/^Re:\s*/i, '').trim();
        const sentSubject = (sent.subject || '').replace(/^Re:\s*/i, '').trim();
        
        if (receivedSubject && sentSubject && receivedSubject === sentSubject) {
          // Check if sent.to includes the received.from
          const receivedFrom = extractEmailAddress(receivedEmail.from);
          const sentTo = extractEmailAddress(sent.to);
          
          if (receivedFrom && sentTo && sentTo.includes(receivedFrom)) {
            return true;
          }
        }
        
        return false;
      });
      
      // Return the most recent reply (sent emails should already be sorted by date desc)
      if (replies.length > 0) {
        console.log('Found', replies.length, 'previous sent replies to this email');
        return replies[0]; // Most recent
      }
      
      return null;
    }

    async function syncNow() {
      const btn = document.getElementById('syncNowBtn');
      const origLabel = btn ? btn.innerHTML : null;
      try {
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing…';
        }

        // Run the legacy IMAP sync and the OAuth inbox sync in parallel.
        //
        //   - /sync-emails handles legacy SMTP/IMAP accounts (and is a
        //     no-op for OAuth accounts — see syncEmailsFromZoho).
        //   - /sync-oauth-inbox pulls recent INBOX messages directly
        //     from Gmail / Microsoft Graph, saves them to receivedEmails,
        //     runs the AI interest classifier, and forwards interested
        //     replies to the no-reply alert recipient.
        //
        // We wait for the OAuth sync to FINISH because it's synchronous
        // and small; the IMAP sync is fire-and-forget on the backend so
        // we just kick it off and then poll loadInbox a few times.
        let oauthSummary = null;
        const [_imapKick, oauthRes] = await Promise.all([
          fetch(`${RAILWAY}/sync-emails`).catch(e => {
            console.warn('legacy sync-emails kick failed:', e.message);
            return null;
          }),
          fetch(`${RAILWAY}/sync-oauth-inbox`).catch(e => {
            console.warn('sync-oauth-inbox failed:', e.message);
            return null;
          })
        ]);
        try { if (oauthRes && oauthRes.ok) oauthSummary = await oauthRes.json(); } catch {}

        if (oauthSummary) {
          console.log('OAuth inbox sync summary:', oauthSummary);
        }

        // Poll a few times to let the legacy sync populate.
        for (let i = 0; i < 5; i++) {
          await new Promise(r => setTimeout(r, 1200));
          const ok = await loadInbox(true);
          if (ok && receivedEmails.length > 0) break;
        }
        await loadSentEmails();

        // Surface the OAuth sync result so the user knows it actually ran.
        if (oauthSummary) {
          const lines = [
            `Sync complete:`,
            `• Accounts scanned: ${oauthSummary.accountsScanned}`,
            `• Messages inspected: ${oauthSummary.messagesSeen}`,
            `• Newly saved: ${oauthSummary.newlySaved}`,
            `• Flagged interested: ${oauthSummary.interested}`,
            `• Forwarded to no-reply alert: ${oauthSummary.forwarded}`,
            (oauthSummary.errors?.length ? `• Errors: ${oauthSummary.errors.length} (see browser console)` : '')
          ].filter(Boolean).join('\n');
          if (oauthSummary.errors?.length) {
            console.warn('OAuth sync errors:', oauthSummary.errors);
          }
          // Don't alert if there's literally nothing new — too noisy.
          if (oauthSummary.newlySaved > 0 || oauthSummary.errors?.length) {
            console.log(lines);
          }
        }
      } catch (e) {
        console.error('Sync failed', e);
        alert('Sync failed. Check console.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origLabel || '<i class="fas fa-sync"></i> Sync Now';
        }
      }
    }

    async function loadInbox(isFromSync = false) {
      try {
        // Fetch a large batch up-front so MailReach filtering still leaves plenty of real emails.
        // With ~85 % of inbox being warm-up emails, 6000 raw emails yields ~900 real ones.
        const INITIAL_LIMIT = 6000;
        const res = await fetch(`https://railwayclemail-production.up.railway.app/received-emails?limit=${INITIAL_LIMIT}`);
        if (!res.ok) throw new Error('Failed to load received emails');
        const data = await res.json();
        // API returns { emails } or array
        receivedEmails = Array.isArray(data) ? data : (data.emails || []);
        console.log(`Loaded ${receivedEmails.length} received emails from server`);
        if ((!receivedEmails || receivedEmails.length === 0) && !isFromSync) {
          // Fallback 1: processed-emails endpoint
          try {
            const res2 = await fetch(`https://railwayclemail-production.up.railway.app/processed-emails?limit=${INITIAL_LIMIT}`);
            if (res2.ok) {
              const data2 = await res2.json();
              const emails2 = Array.isArray(data2) ? data2 : (data2.emails || []);
              if (emails2.length > 0) {
                receivedEmails = emails2;
              }
            }
          } catch {}
        }
        if ((!receivedEmails || receivedEmails.length === 0) && !isFromSync) {
          // Fallback 2: read directly from CLEmail Firestore (client-side)
          try {
            const { collection, query, orderBy, limit, getDocs } = window.clemailFirestore;
            const db = window.clemailDb;
            const q = query(collection(db, 'receivedEmails'), orderBy('date', 'desc'), limit(INITIAL_LIMIT));
            const snap = await getDocs(q);
            const rows = [];
            snap.docs.forEach(doc => {
              const v = doc.data();
              rows.push({ id: doc.id, ...v, date: window.toDate ? window.toDate(v.date) : v.date });
            });
            if (rows.length > 0) receivedEmails = rows;
          } catch (e) {
            console.warn('Firestore fallback failed', e);
          }
        }
        
        // Reset display limit and server pagination state on fresh load
        displayLimit = 100;
        serverEmailOffset = receivedEmails.length;
        hasMoreOnServer = receivedEmails.length >= INITIAL_LIMIT;

        populateFilters();
        renderList();
        document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
        return true;
      } catch (e) {
        console.error('Load inbox failed', e);
        document.getElementById('inboxList').innerHTML = '<div class="empty">Failed to load inbox.</div>';
        return false;
      }
    }
    
    async function loadMoreEmails() {
      if (displayLimit < filteredEmails.length) {
        // More locally-loaded emails to reveal
        displayLimit += 100;
        renderList();
      } else if (hasMoreOnServer) {
        // All local emails are already shown — fetch the next batch from the server
        const btn = document.getElementById('loadMoreBtn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading…'; }
        try {
          const BATCH = 1000;
          const res = await fetch(`${RAILWAY}/received-emails?limit=${BATCH}&offset=${serverEmailOffset}`);
          if (!res.ok) throw new Error('Failed to fetch more emails');
          const data = await res.json();
          const more = Array.isArray(data) ? data : (data.emails || []);
          if (more.length > 0) {
            // Deduplicate by ID so re-fetches of the same window don't create duplicates
            const existingIds = new Set(receivedEmails.map(e => e.id).filter(Boolean));
            const fresh = more.filter(e => !e.id || !existingIds.has(e.id));
            console.log(`Fetched ${more.length} emails from server, ${fresh.length} new after dedup`);
            if (fresh.length > 0) {
              receivedEmails = receivedEmails.concat(fresh);
            }
            serverEmailOffset += more.length;
            hasMoreOnServer = more.length >= BATCH;
            displayLimit = receivedEmails.length;
          } else {
            hasMoreOnServer = false;
          }
        } catch (e) {
          console.warn('Failed to fetch more emails from server:', e);
        }
        if (btn) btn.innerHTML = '<i class="fas fa-arrow-down"></i> Load More (100)';
        populateFilters();
        renderList();
      }
    }
    
    function loadAllEmails() {
      // Set display limit to show all filtered emails
      displayLimit = filteredEmails.length;
      renderList();

    function populateFilters() {
      // Extract unique email accounts (to field) - extract clean emails
      const accounts = new Set();
      
      receivedEmails.forEach(e => {
        if (e.to) {
          const cleanEmail = extractEmailAddress(e.to);
          if (cleanEmail) accounts.add(cleanEmail);
        }
      });

      // Populate account filter
      const accountFilter = document.getElementById('accountFilter');
      const currentAccount = accountFilter.value;
      accountFilter.innerHTML = '<option value="">All Email Accounts</option>' +
        Array.from(accounts).sort().map(a => 
          `<option value="${escapeHtml(a)}" ${a === currentAccount ? 'selected' : ''}>${escapeHtml(a)}</option>`
        ).join('');

      // Populate customer filter using actual customer data
      const customerFilter = document.getElementById('customerFilter');
      const currentCustomer = customerFilter.value;
      
      if (customers.length > 0) {
        // Sort customers with active first, then by name
        const sortedCustomers = [...customers].sort((a, b) => {
          if (a.status === 'active' && b.status !== 'active') return -1;
          if (a.status !== 'active' && b.status === 'active') return 1;
          return (a.shortName || a.name || '').localeCompare(b.shortName || b.name || '');
        });
        
        customerFilter.innerHTML = '<option value="">All Customers</option>' +
          sortedCustomers.map(c => 
            `<option value="${c.id}" ${c.id === currentCustomer ? 'selected' : ''}>${escapeHtml(c.shortName || c.name)} ${c.status !== 'active' ? '(Inactive)' : ''}</option>`
          ).join('');
      } else {
        customerFilter.innerHTML = '<option value="">All Customers (Loading...)</option>';
      }
    }

    // Helper function to extract email from "Name <email>" format
    function extractEmailAddress(emailString) {
      if (!emailString) return '';
      
      // Check if it's in "Name <email>" format
      const match = emailString.match(/<([^>]+)>/);
      if (match && match[1]) {
        return match[1].trim();
      }
      
      // Remove quotes if present
      let cleaned = emailString.replace(/^["']|["']$/g, '').trim();
      
      // If it still has angle brackets, try again
      const match2 = cleaned.match(/<([^>]+)>/);
      if (match2 && match2[1]) {
        return match2[1].trim();
      }
      
      // Return as-is if no special format
      return cleaned;
    }

    // Helper function to get all recipients from an email (checks multiple possible fields)
    function getAllRecipients(email) {
      if (!email) return '';
      
      // Priority: allToRecipients (new field with full list) > envelope.to > headers.to > originalTo > to
      if (email.allToRecipients) {
        // New field that stores the full To list from mailparser
        return email.allToRecipients;
      } else if (email.envelope && email.envelope.to) {
        // Envelope contains full recipient list from email server
        return Array.isArray(email.envelope.to) 
          ? email.envelope.to.map(r => r.address || r).join(', ')
          : email.envelope.to;
      } else if (email.headers && email.headers.to) {
        // Headers might have full To list
        return email.headers.to;
      } else if (email.originalTo) {
        // Custom field that might contain original recipients
        return email.originalTo;
      }
      
      // Fallback to the standard to field (might only have single recipient)
      return email.to || '';
    }

    function getCustomerIdForEmail(email) {
      // Collect all candidate "to" addresses — mirror the same priority order
      // used by getAllRecipients() so the filter always matches what's displayed.
      const candidates = new Set();
      const addAddr = (raw) => {
        if (!raw) return;
        raw.split(',').forEach(part => {
          const addr = extractEmailAddress(part.trim());
          if (addr) candidates.add(addr.toLowerCase());
        });
      };
      addAddr(email.to);
      addAddr(email.allToRecipients);
      if (email.envelope?.to) {
        (Array.isArray(email.envelope.to) ? email.envelope.to : [email.envelope.to])
          .forEach(r => addAddr(r.address || r));
      }
      addAddr(email.headers?.to);
      addAddr(email.originalTo);

      // Case-insensitive match against all account email / username variants
      const account = emailAccounts.find(a =>
        candidates.has((a.email || '').toLowerCase()) ||
        candidates.has((a.username || '').toLowerCase())
      );

      if (!account) return null;

      // Use the stored customerId unless it is the 'internal' sentinel.
      // OAuth accounts are created without copying the customer assignment from the
      // legacy SMTP row, so they default to 'internal' even for real customers.
      if (account.customerId && account.customerId !== 'internal') {
        return account.customerId;
      }

      // Fallback: look up the email domain in the BDR-leaders-derived map.
      // All BDRs for OutcomeMD have @outcomemd.com → customer_1756905670248, etc.
      const acctEmail = (account.email || account.username || '').toLowerCase();
      const domain = acctEmail.split('@')[1] || '';
      if (domain && domainToCustomerId.has(domain)) {
        return domainToCustomerId.get(domain);
      }

      return null;
    }

    // MailReach warm-up emails embed a tracking code like "c293a3fed-X8-6fd0am-"
    // in the sign-off area of the message. Codes always appear within a few hundred
    // characters of the sender's name; confidentiality notices may follow them.
    // We check only the TAIL of the cleaned text (last 600 chars) so URLs and IDs
    // embedded in the body of long real emails are never matched.
    const MAILREACH_CODE_RE = /[a-z0-9]{6,}-[a-z0-9]{1,}-[a-z0-9]{1,}-/i;
    const MAILREACH_TAIL = 600;

    function isMailReachEmail(email) {
      function toPlain(raw) {
        return raw
          .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ')
          .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, ' ')
          .replace(/<[^>]+>/g, ' ')
          .replace(/https?:\/\/\S+/g, ' ')   // remove URLs (contain legitimate dashes)
          .replace(/\s+/g, ' ')
          .trim();
      }

      const checkTail = (t) => MAILREACH_CODE_RE.test(t.length > MAILREACH_TAIL ? t.slice(-MAILREACH_TAIL) : t);

      if (email.text) {
        const t = email.text.replace(/https?:\/\/\S+/g, ' ').replace(/\s+/g, ' ').trim();
        if (checkTail(t)) return true;
      }
      if (email.html) {
        if (checkTail(toPlain(email.html))) return true;
      }
      return false;
    }

    function getEmailCategory(email) {
      const analysis = email.analysis || {};
      if (analysis.isInterested)   return 'interested';
      if (analysis.isOptOut)       return 'optout';
      if (analysis.isBounce)       return 'bounce';
      if (analysis.isOutOfOffice)  return 'ooo';
      if (email.forwarding && (email.forwarding.forwardedAt || email.forwarding.forwardedTo)) return 'forwarded';
      // Internal = "from" address belongs to one of our own email accounts
      const fromAddr = extractEmailAddress(email.from || '').toLowerCase();
      if (fromAddr && emailAccounts.some(a => (a.email || '').toLowerCase() === fromAddr)) return 'internal';
      return 'other';
    }

    function renderList() {
      const list = document.getElementById('inboxList');
      const q = (document.getElementById('searchBox')?.value || '').toLowerCase();
      const accountFilter = document.getElementById('accountFilter')?.value || '';
      const customerFilter = document.getElementById('customerFilter')?.value || '';
      const categoryFilter = document.getElementById('categoryFilter')?.value || '';
      const hideMailReach = document.getElementById('hideMailReach')?.checked ?? true;
      
      let emails = receivedEmails;

      // Filter out MailReach warm-up emails
      if (hideMailReach) {
        emails = emails.filter(e => !isMailReachEmail(e));
      }
      
      // Apply search filter
      if (q) {
        emails = emails.filter(e => (e.subject||'').toLowerCase().includes(q) || (e.from||'').toLowerCase().includes(q));
      }
      
      // Apply email account filter (extract clean email for comparison)
      if (accountFilter) {
        emails = emails.filter(e => {
          const cleanTo = extractEmailAddress(e.to);
          return cleanTo === accountFilter || e.to === accountFilter;
        });
      }
      
      // Apply customer filter - check via email account's customerId
      if (customerFilter) {
        const unmapped = [];
        emails = emails.filter(e => {
          const customerId = getCustomerIdForEmail(e);
          if (customerId !== customerFilter) {
            if (!customerId) unmapped.push(e.to || e.from);
            return false;
          }
          return true;
        });
        if (unmapped.length) {
          console.warn(`Customer filter: ${unmapped.length} email(s) dropped because their "to" address didn't resolve to an account with customerId="${customerFilter}". First few:`, unmapped.slice(0, 5));
        }
      }
      
      // Apply category filter
      if (categoryFilter) {
        emails = emails.filter(e => getEmailCategory(e) === categoryFilter);
      }

      // Store ALL filtered emails for use in reply/show functions
      filteredEmails = emails;
      
      // Apply display limit for pagination
      const totalFilteredCount = emails.length;
      const displayedEmails = emails.slice(0, displayLimit);
      
      // Update load more button visibility and counts
      const loadMoreContainer = document.getElementById('loadMoreContainer');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      const loadAllBtn = document.getElementById('loadAllBtn');
      document.getElementById('emailCount').textContent = displayedEmails.length;
      document.getElementById('totalEmailCount').textContent = totalFilteredCount;
      
      const canLoadMoreLocal = totalFilteredCount > displayLimit;
      const canLoadMore = canLoadMoreLocal || hasMoreOnServer;

      if (canLoadMore || totalFilteredCount > 0) {
        loadMoreContainer.style.display = 'block';
        loadMoreBtn.disabled = !canLoadMore;
        loadAllBtn.disabled = !canLoadMoreLocal;
      } else {
        loadMoreContainer.style.display = 'none';
      }
      
      if (displayedEmails.length === 0) {
        list.innerHTML = '<div class="empty">No emails found.</div>';
        return;
      }
      list.innerHTML = displayedEmails.map((e, idx) => {
        const analysis = e.analysis || {};
        const badge = analysis.isInterested ? '<span class="badge">Interested</span>' : analysis.isOptOut ? '<span class="badge">Opt-Out</span>' : analysis.isBounce ? '<span class="badge" style="background:#fee2e2;color:#991b1b">Bounce</span>' : analysis.isOutOfOffice ? '<span class="badge" style="background:#e0f2fe;color:#075985">OOO</span>' : '';
        const forwarded = e.forwarding && (e.forwarding.forwardedAt || e.forwarding.forwardedTo) ? '<span class="badge" style="background:#e8f5e9;color:#166534">Forwarded</span>' : '';
        
        // Get customer badge
        const customerId = getCustomerIdForEmail(e);
        const customer = customers.find(c => c.id === customerId);
        const customerBadge = customer ? `<span class="badge" style="background:#f3e8ff;color:#6b21a8">${escapeHtml(customer.shortName || customer.name)}</span>` : '';
        
        // Get all recipients and show badge if multiple
        const allToRecipients = getAllRecipients(e);
        
        // Check if there are multiple recipients
        const recipientCount = allToRecipients.split(',').length;
        const multiRecipientBadge = recipientCount > 1 ? 
          `<span class="badge" style="background:#dbeafe;color:#1e40af;"><i class="fas fa-users"></i> ${recipientCount} recipients</span>` : '';
        
        return `
          <div class="email-row" data-email-idx="${idx}">
            <div onclick="showEmailByIndex(${idx})">
              <div class="from">${escapeHtml(e.from || 'Unknown')}</div>
              <div class="meta">To: ${escapeHtml(allToRecipients.length > 50 ? allToRecipients.slice(0, 50) + '...' : allToRecipients)}</div>
            </div>
            <div onclick="showEmailByIndex(${idx})">
              <div class="subject">${escapeHtml(e.subject || '(No subject)')} ${multiRecipientBadge} ${customerBadge} ${badge} ${forwarded}</div>
              <div class="meta">${escapeHtml(decodeHtmlEntitiesForDisplay(e.text || '').replace(/\n+/g, ' ').slice(0, 140))}</div>
            </div>
            <div>
              <div class="date">${fmtDate(e.date)}</div>
              <button class="reply-btn" onclick="event.stopPropagation(); replyToEmailByIndex(${idx})">
                <i class="fas fa-reply"></i> Reply
              </button>
              <button class="reply-btn" onclick="event.stopPropagation(); replyAllToEmailByIndex(${idx})" style="background:#f0f9ff; color:#0369a1;">
                <i class="fas fa-reply-all"></i> Reply All
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
    }

    // Some older synced emails have literal HTML entity codes (e.g. "&nbsp;")
    // baked into their stored plain-text body instead of the actual character,
    // because the sync pipeline flattened HTML into text without decoding
    // entities. Decode the common ones here so they don't show up as raw
    // "&nbsp;"/"&amp;" text in the inbox/viewer.
    function decodeHtmlEntitiesForDisplay(str) {
      if (!str) return '';
      return String(str)
        .replace(/&nbsp;/gi, ' ')
        .replace(/&rsquo;|&#8217;/gi, '\u2019')
        .replace(/&lsquo;|&#8216;/gi, '\u2018')
        .replace(/&rdquo;|&#8221;/gi, '\u201d')
        .replace(/&ldquo;|&#8220;/gi, '\u201c')
        .replace(/&mdash;|&#8212;/gi, '\u2014')
        .replace(/&ndash;|&#8211;/gi, '\u2013')
        .replace(/&hellip;|&#8230;/gi, '\u2026')
        .replace(/&quot;/gi, '"')
        .replace(/&#0*39;|&apos;/gi, '\'')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&#x([0-9a-f]+);/gi, (_, hex) => { try { return String.fromCodePoint(parseInt(hex, 16)); } catch { return ''; } })
        .replace(/&#(\d+);/g, (_, dec) => { try { return String.fromCodePoint(parseInt(dec, 10)); } catch { return ''; } })
        .replace(/&amp;/gi, '&')
        // Collapse repeated spaces/tabs WITHIN a line, but preserve real
        // newlines (newer emails, saved after the backend fix, have genuine
        // paragraph breaks that must not be flattened back into one line).
        .split('\n')
        .map(line => line.replace(/[ \t]+/g, ' ').trim())
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

        const cleanText = decodeHtmlEntitiesForDisplay(e.text);

<html>

    async function replyAllToEmailByIndex(idx) {
      const e = filteredEmails[idx];
      if (!e) return;
      
      replyingTo = e;
      isReplyAllMode = true;
      
      // Ensure email accounts are loaded before opening modal
      if (emailAccounts.length === 0) {
        await loadCustomersAndAccounts();
      }
      
      openComposeModal();
      document.getElementById('modalTitle').textContent = 'Reply All to Email';
      
      // Set reply fields - original sender goes in To
      document.getElementById('toEmail').value = e.from || '';
      
      // Get ALL original recipients using helper function
      const allToRecipients = getAllRecipients(e);
      
      // Extract clean email address for the account we're replying from
      // This is the specific account that received this email
      const toEmailClean = extractEmailAddress(e.to);
      
      // Build CC list: include all original recipients except:
      // 1. The sender (already in To field)
      // 2. The account we're replying from (the original To)
      const ccAddresses = new Set();
      
      // Extract all email addresses from original To field (might have multiple)
      if (allToRecipients) {
        const toAddresses = allToRecipients.split(',').map(addr => extractEmailAddress(addr.trim())).filter(Boolean);
        console.log('📧 All To addresses found:', toAddresses);
        toAddresses.forEach(addr => {
          // Don't include the account we're replying from
          if (addr !== toEmailClean) {
            ccAddresses.add(addr);
            console.log('  ✅ Adding to CC:', addr);
          } else {
            console.log('  ⏭️  Skipping (our account):', addr);
          }
        });
      }
      
      // Extract all email addresses from original CC field
      if (e.cc) {
        const ccList = e.cc.split(',').map(addr => extractEmailAddress(addr.trim())).filter(Boolean);
        ccList.forEach(addr => ccAddresses.add(addr));
      }
      
      // Remove the original sender from CC (they're already in To)
      const senderEmail = extractEmailAddress(e.from);
      if (senderEmail) {
        ccAddresses.delete(senderEmail);
        console.log('  ⏭️  Removed sender from CC:', senderEmail);
      }
      
      // Set CC field and show it
      const ccValue = Array.from(ccAddresses).join(', ');
      document.getElementById('ccEmail').value = ccValue;
      document.getElementById('bccEmail').value = '';
      
      // Show CC/BCC fields
      document.getElementById('ccGroup').style.display = 'block';
      document.getElementById('bccGroup').style.display = 'block';
      
      // Set subject with Re: prefix if not already there
      const subject = e.subject || '';
      document.getElementById('subjectEmail').value = subject.startsWith('Re:') ? subject : `Re: ${subject}`;
      
      // Set from account to the account that received this email, and lock it
      // so the reply can never accidentally go out from a different account.
      populateFromAccounts(toEmailClean, true);
      
      console.log('📧 Reply All setup:', {
        originalTo: e.to,
        allToRecipients: allToRecipients,
        originalCC: e.cc,
        extractedToEmail: toEmailClean,
        replyToAddress: e.from,
        replyCcAddresses: ccValue,
        selectedFromAccount: document.getElementById('fromAccount')?.value
      });

      // Signature and quoted text will be added when sending
      document.getElementById('bodyEmail').value = '';
      document.getElementById('bodyEmail').placeholder = 'Type your reply here...\n\n(Your signature and the original message will be added automatically when you send)';
    }

    // `selectedAccount` is matched case-insensitively against emailAccounts, since
    // provider "to" headers don't always match the stored account email's casing
    // exactly. `lock` disables the dropdown (used for Reply / Reply All) so the
    // user can never accidentally send from a different account than the one
    // that actually received the original email.
    function populateFromAccounts(selectedAccount = null, lock = false) {
      const fromSelect = document.getElementById('fromAccount');
      const lockHint = document.getElementById('fromAccountLockHint');
      if (emailAccounts.length === 0) {
        fromSelect.innerHTML = '<option value="">Loading accounts...</option>';
        return;
      }
      
      // Sort active accounts first
      const sortedAccounts = [...emailAccounts].sort((a, b) => {
        if (a.status === 'active' && b.status !== 'active') return -1;
        if (a.status !== 'active' && b.status === 'active') return 1;
        return (a.email || '').localeCompare(b.email || '');
      });

      const selectedLower = (selectedAccount || '').toLowerCase();
      const matchedAccount = selectedAccount
        ? sortedAccounts.find(acc => (acc.email || '').toLowerCase() === selectedLower)
        : null;
      
      fromSelect.innerHTML = sortedAccounts.map(acc => {
        const customer = customers.find(c => c.id === acc.customerId);
        const label = customer ? `${acc.email} (${customer.shortName || customer.name})` : acc.email;
        const selected = (matchedAccount && acc.email === matchedAccount.email) ? 'selected' : '';
        return `<option value="${escapeHtml(acc.email)}" ${selected}>${escapeHtml(label)}</option>`;
      }).join('');

      // Only lock the field if we actually found the receiving account — if it's
      // unresolvable (e.g. an untracked mailbox), leave it editable so the user
      // isn't stuck with a wrong, disabled selection.
      const shouldLock = !!(lock && matchedAccount);
      fromSelect.disabled = shouldLock;
      if (lockHint) lockHint.style.display = shouldLock ? 'inline' : 'none';

      if (selectedAccount && !matchedAccount) {
        console.warn('⚠️ Could not find an email account matching the receiving address — From account defaulted to the first option instead of being locked.', { selectedAccount });
      }
      
      console.log('Populated From Accounts:', {
        accountCount: sortedAccounts.length,
        selectedAccount: selectedAccount,
        matchedAccount: matchedAccount?.email,
        locked: shouldLock,
        currentValue: fromSelect.value,
        firstAccount: sortedAccounts[0]?.email
      });

      updateSignaturePreview();
    }

    // Resolves the HTML signature for an account the same way sendEmail() does:
    // prefer the live OAuth signature (fetched directly from Gmail/Outlook, same
    // source as oauth_email_connections.html) and fall back to whatever is
    // stored on the Firestore emailAccounts document.
    function resolveSignatureHtml(account) {
      if (!account) return '';
      const oauthSig = oauthSignaturesByEmail.get((account.email || '').toLowerCase());
      if (oauthSig) {
        return oauthSig.signatureHtml || oauthSig.signatureText || '';
      }
      if (account.signature) {
        if (typeof account.signature === 'object' && account.signature !== null) {
          return account.signature.html || account.signature.text || '';
        } else if (typeof account.signature === 'string') {
          return escapeHtml(account.signature).replace(/\n/g, '<br>');
        }
      }
      return '';
    }

    // Shows a read-only, rendered preview of the selected account's signature —
    // exactly like the Signature preview in the Email Testing Lab
    // (admin/oauth_email_connections.html). The signature is NEVER written into
    // the bodyEmail textarea; it's appended to the HTML body only at send time
    // (see sendEmail()), so it can't show up as raw HTML text while composing
    // and can't get duplicated into the message.
    async function updateSignaturePreview() {
      const fromEmail = document.getElementById('fromAccount').value;
      const account = emailAccounts.find(a => a.email === fromEmail || a.username === fromEmail);
      const wrap = document.getElementById('sigPreviewWrap');
      const preview = document.getElementById('sigPreview');
      if (!wrap || !preview) return;

      if (!account) {
        wrap.style.display = 'none';
        return;
      }

      // Live OAuth signatures may not have finished loading yet if the modal was
      // opened right after page load — load them now so the preview is accurate.
      if (oauthSignaturesByEmail.size === 0) {
        await loadOAuthAccounts().catch(() => {});
      }

      const signatureHtml = resolveSignatureHtml(account);
      if (signatureHtml) {
        preview.innerHTML = signatureHtml;
        wrap.style.display = 'block';
      } else {
        preview.innerHTML = '';
        wrap.style.display = 'none';
      }
    }

    async function sendEmail() {
      const fromEmail = document.getElementById('fromAccount').value;
      const to = document.getElementById('toEmail').value.trim();
      const cc = document.getElementById('ccEmail').value.trim();
      const bcc = document.getElementById('bccEmail').value.trim();
      const subject = document.getElementById('subjectEmail').value.trim();
      let body = document.getElementById('bodyEmail').value;

      if (!fromEmail || !to || !subject || !body) {
        alert('Please fill in From, To, Subject, and Message fields.');
        return;
      }

      // Find the account to get customerId - MUST match exactly
      const account = emailAccounts.find(a => a.email === fromEmail || a.username === fromEmail);
      if (!account) {
        alert(`Error: Cannot find email account "${fromEmail}". Please select a valid account from the dropdown.`);
        console.error('Available accounts:', emailAccounts.map(a => a.email));
        console.error('Selected fromEmail:', fromEmail);
        return;
      }

      // Verify the account is active (only warn if explicitly inactive)
      if (account.status && account.status !== 'active') {
        const confirm = window.confirm(`Warning: Account "${fromEmail}" has status "${account.status}". Send anyway?`);
        if (!confirm) return;
      }

      console.log('✅ Sending email from account:', {
        accountId: account.id || account.accountId,
        email: account.email,
        username: account.username,
        customerId: account.customerId,
        status: account.status,
        fullAccount: account
      });

      // Show confirmation with the actual sending account
      const confirmMsg = `Send email from: ${account.email}\nTo: ${to}\nSubject: ${subject}`;
      if (!window.confirm(confirmMsg)) {
        console.log('❌ User cancelled send');
        return;
      }
      
      // Verify we have accountId
      if (!account.id && !account.accountId) {
        alert('ERROR: Account does not have an ID. Cannot send email. Please refresh the page and try again.');
        console.error('❌ Account missing ID:', account);
        return;
      }

      // Convert body to HTML - always convert newlines to preserve formatting
      // Check if body is plain text (no HTML tags)
      const isPlainText = !body.includes('<br>') && !body.includes('<div>') && !body.includes('<p>') && !body.includes('<html>');
      
      if (isPlainText) {
        // Escape HTML and convert line breaks
        body = escapeHtml(body).replace(/\r\n/g, '<br>').replace(/\n/g, '<br>').replace(/\r/g, '<br>');
      } else {
        // Already has HTML, but make sure line breaks are preserved
        body = body.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>').replace(/\r/g, '<br>');
      }
      
      // Resolve signature — prefer the live OAuth signature (fetched directly from Gmail /
      // Outlook, same source as oauth_email_connections.html) and fall back to whatever
      // the Firestore emailAccounts document has stored. This is the ONLY place the
      // signature gets added to the outgoing email — the compose textarea itself is
      // never touched, so it can't show up as raw HTML text or get duplicated.
      const signatureHtml = resolveSignatureHtml(account);
      console.log(signatureHtml ? `📝 Using signature for ${account.email}` : `📝 No signature found for ${account.email}`);
      
      // Add quoted original email if this is a reply
      let quotedHtml = '';
      if (replyingTo) {
        const originalDate = fmtDate(replyingTo.date);
        const originalFrom = escapeHtml(replyingTo.from || 'Unknown');
        
        // Use HTML version if available (most emails are HTML), otherwise use plain text
        let originalContent = '';
        if (replyingTo.html) {
          // Email already has HTML - use it directly (it's already formatted)
          originalContent = replyingTo.html;
        } else if (replyingTo.text) {
          // Plain text only - escape and convert line breaks
          originalContent = escapeHtml(replyingTo.text).replace(/\n/g, '<br>');
        } else {
          originalContent = '<em>(No content)</em>';
        }
        
        quotedHtml = `<div style="border-left: 3px solid #3b82f6; padding-left: 12px; margin-left: 0; margin-top: 20px; color: #6b7280;">
<div style="font-size: 13px; margin-bottom: 8px;"><strong>On ${originalDate}, ${originalFrom} wrote:</strong></div>
<div style="font-size: 13px; line-height: 1.6;">${originalContent}</div>
</div>`;
      }
      
      // Build complete email body: User's message + Signature + Quoted original
      if (signatureHtml) {
        body += `<br><br><div style="border-top: 1px solid #e5e7eb; padding-top: 10px; margin-top: 10px;">${signatureHtml}</div>`;
      }
      if (quotedHtml) {
        body += `<br>${quotedHtml}`;
      }
      
      console.log('📧 Email body prepared:', {
        length: body.length,
        hasLineBreaks: body.includes('<br>'),
        hasSignature: signatureHtml.length > 0,
        hasQuoted: quotedHtml.length > 0,
        preview: body.substring(0, 200)
      });

      // Wrap in proper HTML email structure for better compatibility
      const htmlBody = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #333; max-width: 600px; margin: 0; padding: 20px;">
  ${body}
</body>
</html>`;

      // Build email payload - CRITICAL: accountId is what backend uses to select the email account
      const emailData = {
        accountId: account.id || account.accountId, // THIS is the critical field the backend looks for!
        customerId: account.customerId, // For reference
        from: account.email, // Use the exact email from the account object
        fromEmail: account.email, // Also include as fromEmail for backend compatibility
        to: to,
        subject: subject,
        html: htmlBody, // Body is in HTML format with proper structure
        // Manual / one-off send: backend returns a 72h-dedup WARNING (409) if
        // this recipient was already emailed from this account in the last
        // 72 hours.  We catch that warning below and let the user override.
        isManual: true
      };
      
      // Also include plain text version (strip HTML tags for plain text clients)
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = body;
      emailData.text = tempDiv.textContent || tempDiv.innerText || body;
      
      console.log('📨 Email payload being sent to backend:', {
        accountId: emailData.accountId, // CRITICAL: This tells backend which account to use
        customerId: emailData.customerId,
        from: emailData.from,
        fromEmail: emailData.fromEmail,
        to: emailData.to,
        subject: emailData.subject,
        hasHtml: !!emailData.html,
        hasText: !!emailData.text,
        htmlLength: emailData.html.length,
        textLength: emailData.text.length
      });
      
      console.log('🎯 CRITICAL CHECK - Backend will use account with ID:', emailData.accountId);

      // Add CC if provided
      if (cc) {
        emailData.cc = cc;
      }

      // Add BCC if provided
      if (bcc) {
        emailData.bcc = bcc;
      }

      // Determine account type.
      // If the OAuth map hasn't loaded yet (race condition on page load), load it now.
      if (oauthAccountsByEmail.size === 0) {
        console.log('⏳ OAuth accounts map empty — loading now before send...');
        await loadOAuthAccounts().catch(() => {});
      }

      // Primary: look up by email in the OAuth accounts map (loaded from /oauth/accounts).
      // Fallback: check if the Firestore doc ID already follows the google_/microsoft_ pattern.
      const firestoreId  = account.id || account.accountId;
      const oauthRecord  = oauthAccountsByEmail.get((account.email || '').toLowerCase());
      const accountId    = oauthRecord?.accountId || firestoreId;
      const isGoogle     = accountId?.startsWith('google_');
      const isMicrosoft  = accountId?.startsWith('microsoft_');
      const isOAuth      = isGoogle || isMicrosoft;

      console.log('🔍 Account type detection:', {
        email: account.email,
        firestoreId,
        oauthAccountId: oauthRecord?.accountId,
        resolvedAccountId: accountId,
        isOAuth, isGoogle, isMicrosoft
      });

      if (isGoogle) {
        // ── Gmail OAuth path: /oauth/test/send with threading ─────
        const oauthPayload = { accountId, to, subject, body: htmlBody };
        if (cc)  oauthPayload.cc  = cc;
        if (bcc) oauthPayload.bcc = bcc;

        if (replyingTo) {
          console.log('🧵 replyingTo fields available:', Object.keys(replyingTo));
          // Gmail: RFC message-id → In-Reply-To header; Gmail thread ID → threadId.
          if (replyingTo.threadId)  oauthPayload.threadId  = replyingTo.threadId;
          if (replyingTo.messageId) oauthPayload.inReplyTo = replyingTo.messageId;
          if (isReplyAllMode)       oauthPayload.isReplyAll = true;
          console.log('🧵 Gmail threading payload:', {
            threadId: oauthPayload.threadId,
            inReplyTo: oauthPayload.inReplyTo,
            isReplyAll: oauthPayload.isReplyAll,
          });
        }

        try {
          console.log('🚀 Sending via Gmail /oauth/test/send...', { ...oauthPayload, body: '(html)' });
          const headers = await getAuthHeaders();
          const res = await fetch(`${RAILWAY}/oauth/test/send`, {
            method: 'POST',
            headers,
            body: JSON.stringify(oauthPayload),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);

          console.log('✅ Gmail OAuth email sent:', data);
          alert(`✅ Email sent successfully from ${account.email}\n\nMessage ID: ${data.messageId || data.id || 'sent'}`);
          closeComposeModal();
          setTimeout(async () => { await loadInbox(); await loadSentEmails(); }, 1000);
        } catch (error) {
          console.error('❌ Gmail OAuth send error:', error);
          alert(`Failed to send email: ${error.message}`);
        }

      } else if (isMicrosoft) {
        // ── Microsoft OAuth path: /oauth/test/send ──
        // Must use the same OAuth endpoint as Google — /send-email is the legacy
        // SMTP endpoint and only understands Firestore document IDs, not OAuth
        // account IDs like microsoft_XXXX.
        const oauthPayload = { accountId, to, subject, body: htmlBody };
        if (cc)  oauthPayload.cc  = cc;
        if (bcc) oauthPayload.bcc = bcc;

        if (replyingTo) {
          console.log('🧵 replyingTo fields available:', Object.keys(replyingTo));

          // conversationId is the Outlook thread ID (analogous to Gmail's threadId).
          // Use it directly — no length check needed; any non-empty value is valid.
          const convId = replyingTo.conversationId || replyingTo.threadId || '';
          if (convId) oauthPayload.threadId = convId;

          // inReplyTo needs the Outlook *internal* message ID (Base64url, >50 chars,
          // no @ or <).  Synced emails may store it as outlookId/providerMessageId.
          // If not stored, fall back to a live lookup — exactly what the admin lab's
          // "↩ Use thread" button does via fetchOutlookThreadIds().
          const isOutlookInternalId = (id) => id && id.length > 50 && !id.includes('@') && !id.startsWith('<');
          const storedMsgId = replyingTo.outlookId || replyingTo.providerMessageId || '';

          if (isOutlookInternalId(storedMsgId)) {
            oauthPayload.inReplyTo = storedMsgId;
            console.log('✅ Microsoft inReplyTo via stored outlookId');
          } else {
            // Live lookup: fetch recent inbox messages for this OAuth account and
            // match by subject + sender — same logic as fetchOutlookThreadIds().
            console.log('🔍 No stored Outlook internal ID — attempting live lookup...');
            const liveIds = await fetchOutlookThreadIds(accountId, replyingTo);
            if (liveIds) {
              if (liveIds.messageId)      oauthPayload.inReplyTo = liveIds.messageId;
              if (liveIds.conversationId && !oauthPayload.threadId) oauthPayload.threadId = liveIds.conversationId;
              console.log('✅ Microsoft threading via live lookup:', {
                inReplyTo:  (liveIds.messageId      || '').slice(0, 30) + '…',
                threadId:   (liveIds.conversationId || '').slice(0, 30) + '…',
              });
            } else {
              console.log('ℹ️ Live lookup found no match — reply will send without threading headers');
            }
          }

          if (isReplyAllMode) oauthPayload.isReplyAll = true;

          console.log('🧵 Microsoft threading payload:', {
            threadId:   oauthPayload.threadId  ? oauthPayload.threadId.slice(0, 30)  + '…' : '(none)',
            inReplyTo:  oauthPayload.inReplyTo ? oauthPayload.inReplyTo.slice(0, 30) + '…' : '(none)',
            isReplyAll: oauthPayload.isReplyAll,
          });
        }

        try {
          console.log('🚀 Sending via Microsoft /oauth/test/send...', { ...oauthPayload, body: '(html)' });
          const headers = await getAuthHeaders();
          const res = await fetch(`${RAILWAY}/oauth/test/send`, {
            method: 'POST',
            headers,
            body: JSON.stringify(oauthPayload),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);

          console.log('✅ Microsoft OAuth email sent:', data);
          alert(`✅ Email sent successfully from ${account.email}\n\nMessage ID: ${data.messageId || data.id || 'sent'}`);
          closeComposeModal();
          setTimeout(async () => { await loadInbox(); await loadSentEmails(); }, 1000);
        } catch (error) {
          console.error('❌ Microsoft send error:', error);
          alert(`Failed to send email: ${error.message}`);
        }

      } else {
        // ── Legacy SMTP/IMAP path ─────────────────────────────────
        // Add threading headers if this is a reply
        if (replyingTo) {
          const mostRecentReply = findMostRecentSentReply(replyingTo);

          if (mostRecentReply && mostRecentReply.messageId) {
            console.log('🧵 Smart threading: Using previous sent reply as parent');
            emailData.inReplyTo = mostRecentReply.messageId;
            let refs = replyingTo.references || '';
            if (replyingTo.messageId)       refs = refs ? `${refs} ${replyingTo.messageId}`       : replyingTo.messageId;
            if (mostRecentReply.messageId)  refs = refs ? `${refs} ${mostRecentReply.messageId}`  : mostRecentReply.messageId;
            emailData.references = refs;
          } else {
            console.log('🧵 Standard threading to original email');
            if (replyingTo.messageId) {
              emailData.inReplyTo  = replyingTo.messageId;
              emailData.references = replyingTo.references
                ? `${replyingTo.references} ${replyingTo.messageId}`
                : replyingTo.messageId;
            }
          }
        }

        try {
          console.log('🚀 Sending via legacy /send-email...');
          const result = await sendEmailWithDedupGuard(emailData);
          console.log('✅ Email sent:', result);

          if (result.from && result.from !== account.email) {
            alert(`⚠️ WARNING: Email was sent from "${result.from}" instead of "${account.email}".\n\nThe email was delivered, but from the wrong account.`);
          } else {
            alert(`✅ Email sent successfully from ${account.email}\n\nMessage ID: ${result.messageId}`);
          }

          closeComposeModal();
          setTimeout(async () => { await loadInbox(); await loadSentEmails(); }, 1000);
        } catch (error) {
          if (error && error.userCancelled) return;
          console.error('❌ Send email error:', error);
          alert(`Failed to send email: ${error.message}`);
        }
      }
    }

    // POSTs to /send-email and transparently handles the 72-hour-dedup
    // warning returned for one-off (manual) sends.  If the backend says the
    // recipient was emailed from this account within 72 h, prompt the user;
    // on confirm, retry with bypassDedup: true.  Throws on any other failure.
    async function sendEmailWithDedupGuard(payload) {
      const url = 'https://railwayclemail-production.up.railway.app/send-email';
      const post = (body) => fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      let response = await post(payload);

      if (response.status === 409) {
        const data = await response.json().catch(() => ({}));
        if (data.code === 'DEDUP_72H_WARNING' && data.recentSend) {
          const r = data.recentSend;
          const when = r.sentAt ? new Date(r.sentAt).toLocaleString() : 'recently';
          const ok = window.confirm(
            `⚠️  This recipient was emailed from this account ${r.hoursAgo}h ago` +
            (r.subject ? ` (subject: "${r.subject}")` : '') +
            `\nLast send: ${when}\n\nSend anyway?`
          );
          if (!ok) {
            const e = new Error('User cancelled after dedup warning');
            e.userCancelled = true;
            throw e;
          }
          response = await post({ ...payload, bypassDedup: true });
        } else if (data.code === 'DEDUP_72H_BLOCK' && data.recentSend) {
          const r = data.recentSend;
          throw new Error(
            `Blocked: recipient was emailed from this account ${r.hoursAgo}h ago. ` +
            `Automated sends cannot send within 72 h.`
          );
        }
      }

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(errText || `Send failed: ${response.status}`);
      }

      return response.json();
    }

    // Close modals when clicking outside
    document.addEventListener('click', (e) => {
      const composeModal = document.getElementById('composeModal');
      const viewerModal = document.getElementById('viewerModal');
      
      if (e.target === composeModal) {
        closeComposeModal();
      }
      
      if (e.target === viewerModal) {
        closeViewerModal();
      }
    });
  </script>
</body>
