<!DOCTYPE html>
<html lang="en" class="protection-hide">
<head>
    <!-- CACHE BUSTER v3.0.0 - Call Assignment Dashboard - Real-time queue monitoring -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Assignment Dashboard - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Hide page until folder protection completes */
        html.protection-hide body { display: none; }
        
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--info) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-content p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Filter Bar */
        .filter-bar {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        .auto-refresh {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auto-refresh label {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--success);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-badge {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Call Queue Cards */
        .call-card {
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }

        .call-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .call-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.5rem;
        }

        .call-contact-name {
            font-weight: 700;
            color: var(--secondary);
            font-size: 1rem;
        }

        .call-company {
            color: var(--gray);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .call-phone {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--gray);
        }

        .call-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .call-tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .tag-priority {
            background: #fef3c7;
            color: #92400e;
        }

        .tag-cooldown {
            background: #fee2e2;
            color: #991b1b;
        }

        .tag-assigned {
            background: #d1fae5;
            color: #065f46;
        }

        .tag-expired {
            background: #fef3c7;
            color: #92400e;
        }

        /* Agent Cards */
        .agent-card {
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .agent-name {
            font-weight: 700;
            color: var(--secondary);
        }

        .agent-count {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .agent-calls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .agent-call-item {
            font-size: 0.875rem;
            color: var(--gray);
            padding: 0.5rem;
            background: var(--light-gray);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expiry-time {
            font-size: 0.75rem;
            color: var(--warning);
            font-weight: 600;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.875rem;
        }

        /* Filter Reasons Section */
        .filter-reason {
            font-size: 0.875rem;
            padding: 0.75rem;
            border-left: 3px solid;
            margin-bottom: 0.5rem;
            background: var(--light-gray);
        }

        .filter-reason.cooldown {
            border-color: var(--danger);
        }

        .filter-reason.declined {
            border-color: var(--warning);
        }

        .filter-reason.flagged {
            border-color: var(--info);
        }

        .filter-reason-title {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .filter-reason-count {
            color: var(--gray);
        }
    </style>
    <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-tasks"></i>
                    Call Assignment Dashboard
                </h1>
                <p>Real-time monitoring of call queue, assignments, and filters</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.location.href='call_manager.html'">
                    <i class="fas fa-phone-alt"></i> Call Manager
                </button>
                <button class="btn btn-primary" onclick="window.location.href='home.html'">
                    <i class="fas fa-home"></i> CRM Home
                </button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label class="filter-label">Campaign</label>
                <select id="campaignSelect" class="filter-select" onchange="loadDashboard()">
                    <option value="">Select Campaign...</option>
                </select>
            </div>

            <div class="auto-refresh">
                <label>Auto-refresh (30s)</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <button class="btn btn-primary" onclick="loadDashboard()">
                <i class="fas fa-sync-alt"></i> Refresh Now
            </button>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Next in Queue -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-arrow-right"></i>
                        Next in Queue
                    </div>
                    <div class="section-badge" id="queueCount">0</div>
                </div>
                <div id="queueList">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Select a campaign to view queue</p>
                    </div>
                </div>
            </div>

            <!-- Active Assignments -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-users"></i>
                        Active Assignments
                    </div>
                    <div class="section-badge" id="assignmentsCount">0</div>
                </div>
                <div id="assignmentsList">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Select a campaign to view assignments</p>
                    </div>
                </div>
            </div>

            <!-- Filter Reasons -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-filter"></i>
                        Filter Reasons
                    </div>
                    <div class="section-badge" id="filteredCount">0</div>
                </div>
                <div id="filterReasons">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Select a campaign to view filters</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase and Auth -->
    <script src="../js/auth.js"></script>
    <script src="../js/folder-protection.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script>
        console.log('📊 Call Assignment Dashboard v3.0.0 loading...');

        let selectedCampaign = null;
        let autoRefreshInterval = null;

        // Wait for Firebase to be ready
        window.addEventListener('firebase-ready', async () => {
            console.log('🔥 Firebase ready, initializing dashboard...');
            
            // Protect the CRM folder
            const access = await protectFolder('crm');
            if (!access.granted) {
                console.error('❌ Access denied to CRM folder');
                return;
            }

            const db = window.clemailDb;
            const currentUser = window.currentUser;

            if (!currentUser) {
                console.error('❌ No user logged in');
                return;
            }

            console.log('✅ Dashboard initialized for user:', currentUser.email);
            loadCampaigns();
            
            // Start auto-refresh if enabled
            if (document.getElementById('autoRefreshToggle').checked) {
                startAutoRefresh();
            }
        });

        // Load campaigns
        async function loadCampaigns() {
            try {
                console.log('📋 Loading campaigns...');
                
                const db = window.clemailDb;
                const campaignsSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'campaigns'),
                        window.clemailFirestore.orderBy('name', 'asc')
                    )
                );

                const campaignSelect = document.getElementById('campaignSelect');
                campaignSelect.innerHTML = '<option value="">Select Campaign...</option>';

                campaignsSnapshot.forEach(doc => {
                    const data = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = data.name;
                    campaignSelect.appendChild(option);
                });

                console.log(`✅ Loaded ${campaignsSnapshot.size} campaigns`);
            } catch (error) {
                console.error('❌ Error loading campaigns:', error);
            }
        }

        // Load dashboard data
        async function loadDashboard() {
            selectedCampaign = document.getElementById('campaignSelect').value;
            
            if (!selectedCampaign) {
                console.log('⚠️ No campaign selected');
                return;
            }

            console.log(`📊 Loading dashboard for campaign: ${selectedCampaign}`);

            await Promise.all([
                loadNextInQueue(),
                loadActiveAssignments(),
                loadFilterReasons()
            ]);

            console.log('✅ Dashboard loaded');
        }

        // Load next calls in queue
        async function loadNextInQueue() {
            const queueList = document.getElementById('queueList');
            queueList.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading queue...</p></div>';

            try {
                const db = window.clemailDb;
                // Query for pending/scheduled calls that are NOT assigned
                const queueSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'phone_activities'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                        window.clemailFirestore.where('status', 'in', ['pending', 'scheduled']),
                        window.clemailFirestore.orderBy('priority', 'desc'),
                        window.clemailFirestore.limit(20)
                    )
                );

                const unassignedCalls = [];
                const now = new Date();

                queueSnapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // Skip if assigned and not expired
                    if (data.assignedTo && data.assignmentExpiry) {
                        const expiryTime = data.assignmentExpiry.toDate ? data.assignmentExpiry.toDate() : new Date(data.assignmentExpiry);
                        if (expiryTime > now) {
                            return; // Skip - still assigned
                        }
                    }

                    unassignedCalls.push({
                        id: doc.id,
                        ...data
                    });
                });

                document.getElementById('queueCount').textContent = unassignedCalls.length;

                if (unassignedCalls.length === 0) {
                    queueList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><h3>Queue Empty</h3><p>No calls waiting to be assigned</p></div>';
                    return;
                }

                // Display calls
                let html = '';
                unassignedCalls.slice(0, 20).forEach((call, index) => {
                    html += `
                        <div class="call-card">
                            <div class="call-card-header">
                                <div>
                                    <div class="call-contact-name">${index + 1}. ${call.contactName || 'Unknown'}</div>
                                    <div class="call-company">${call.companyName || call.company || 'No company'}</div>
                                </div>
                            </div>
                            <div class="call-phone">
                                <i class="fas fa-phone"></i>
                                ${call.phoneNumber || call.phone || 'No phone'}
                            </div>
                            <div class="call-meta">
                                ${call.priority ? `<span class="call-tag tag-priority">Priority: ${call.priority}</span>` : ''}
                                ${call.phoneLastCalledAt ? `<span class="call-tag tag-cooldown">Last called: ${formatDate(call.phoneLastCalledAt)}</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                queueList.innerHTML = html;

            } catch (error) {
                console.error('❌ Error loading queue:', error);
                queueList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Failed to load queue</p></div>';
            }
        }

        // Load active assignments
        async function loadActiveAssignments() {
            const assignmentsList = document.getElementById('assignmentsList');
            assignmentsList.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading assignments...</p></div>';

            try {
                const db = window.clemailDb;
                const assignedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'phone_activities'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                        window.clemailFirestore.where('status', 'in', ['pending', 'scheduled']),
                        window.clemailFirestore.orderBy('assignedAt', 'desc')
                    )
                );

                const agentAssignments = {};
                const now = new Date();

                assignedSnapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // Only include if assigned and not expired
                    if (!data.assignedTo) return;
                    
                    if (data.assignmentExpiry) {
                        const expiryTime = data.assignmentExpiry.toDate ? data.assignmentExpiry.toDate() : new Date(data.assignmentExpiry);
                        if (expiryTime < now) return; // Skip - expired
                    }

                    if (!agentAssignments[data.assignedTo]) {
                        agentAssignments[data.assignedTo] = [];
                    }

                    agentAssignments[data.assignedTo].push({
                        id: doc.id,
                        ...data
                    });
                });

                const totalAssigned = Object.values(agentAssignments).reduce((sum, calls) => sum + calls.length, 0);
                document.getElementById('assignmentsCount').textContent = totalAssigned;

                if (totalAssigned === 0) {
                    assignmentsList.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><h3>No Assignments</h3><p>No active call assignments</p></div>';
                    return;
                }

                // Display by agent
                let html = '';
                Object.entries(agentAssignments).forEach(([agentEmail, calls]) => {
                    const agentName = agentEmail.split('@')[0];
                    html += `
                        <div class="agent-card">
                            <div class="agent-header">
                                <div class="agent-name">${agentName}</div>
                                <div class="agent-count">${calls.length}</div>
                            </div>
                            <div class="agent-calls">
                                ${calls.slice(0, 5).map(call => {
                                    const expiryTime = call.assignmentExpiry ? (call.assignmentExpiry.toDate ? call.assignmentExpiry.toDate() : new Date(call.assignmentExpiry)) : null;
                                    const timeLeft = expiryTime ? Math.max(0, Math.round((expiryTime - now) / 60000)) : 0;
                                    
                                    return `
                                        <div class="agent-call-item">
                                            <span>${call.contactName || 'Unknown'}</span>
                                            <span class="expiry-time">${timeLeft}m left</span>
                                        </div>
                                    `;
                                }).join('')}
                                ${calls.length > 5 ? `<div class="agent-call-item" style="font-style: italic; color: var(--gray);">+ ${calls.length - 5} more</div>` : ''}
                            </div>
                        </div>
                    `;
                });

                assignmentsList.innerHTML = html;

            } catch (error) {
                console.error('❌ Error loading assignments:', error);
                assignmentsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Failed to load assignments</p></div>';
            }
        }

        // Load filter reasons
        async function loadFilterReasons() {
            const filterReasons = document.getElementById('filterReasons');
            filterReasons.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading filters...</p></div>';

            try {
                const db = window.clemailDb;
                const now = new Date();
                const cooldownThreshold = new Date(now.getTime() - (72 * 60 * 60 * 1000)); // 72 hours ago

                // Get completed calls in last 72 hours
                const completedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'phone_activities'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                        window.clemailFirestore.where('status', '==', 'completed'),
                        window.clemailFirestore.where('completedAt', '>=', cooldownThreshold.toISOString())
                    )
                );

                // Get declined contacts
                const declinedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'phone_activities'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                        window.clemailFirestore.where('outcome', 'in', ['declined', 'not-interested', 'do-not-call'])
                    )
                );

                // Get flagged contacts
                const flaggedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'flaggedContacts'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign)
                    )
                );

                const totalFiltered = completedSnapshot.size + declinedSnapshot.size + flaggedSnapshot.size;
                document.getElementById('filteredCount').textContent = totalFiltered;

                let html = '';
                
                if (completedSnapshot.size > 0) {
                    html += `
                        <div class="filter-reason cooldown">
                            <div class="filter-reason-title">
                                <i class="fas fa-clock"></i> 72-Hour Cooldown
                            </div>
                            <div class="filter-reason-count">${completedSnapshot.size} contacts filtered</div>
                        </div>
                    `;
                }

                if (declinedSnapshot.size > 0) {
                    html += `
                        <div class="filter-reason declined">
                            <div class="filter-reason-title">
                                <i class="fas fa-ban"></i> Declined
                            </div>
                            <div class="filter-reason-count">${declinedSnapshot.size} contacts filtered</div>
                        </div>
                    `;
                }

                if (flaggedSnapshot.size > 0) {
                    html += `
                        <div class="filter-reason flagged">
                            <div class="filter-reason-title">
                                <i class="fas fa-flag"></i> Flagged for Review
                            </div>
                            <div class="filter-reason-count">${flaggedSnapshot.size} contacts filtered</div>
                        </div>
                    `;
                }

                if (html === '') {
                    html = '<div class="empty-state"><i class="fas fa-check-circle"></i><h3>No Filters Active</h3><p>All contacts available for calling</p></div>';
                }

                filterReasons.innerHTML = html;

            } catch (error) {
                console.error('❌ Error loading filter reasons:', error);
                filterReasons.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Failed to load filters</p></div>';
            }
        }

        // Auto-refresh
        function toggleAutoRefresh() {
            if (document.getElementById('autoRefreshToggle').checked) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh(); // Clear any existing interval
            autoRefreshInterval = setInterval(() => {
                if (selectedCampaign) {
                    console.log('🔄 Auto-refreshing dashboard...');
                    loadDashboard();
                }
            }, 30000); // 30 seconds
            console.log('✅ Auto-refresh enabled (30s)');
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                console.log('⏸️ Auto-refresh disabled');
            }
        }

        // Helper functions
        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return `${diffDays}d ago`;
        }

        console.log('✅ Call Assignment Dashboard script loaded');
    </script>
</body>
</html>
