<!DOCTYPE html>
<html lang="en" class="protection-hide">
<head>
    <!-- CACHE BUSTER v3.1.0 - Call Assignment Dashboard - Queue monitoring + manual assignment -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Assignment Dashboard - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Hide page until folder protection completes */
        html.protection-hide body { display: none; }
        
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--info) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-content p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Filter Bar */
        .filter-bar {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        .auto-refresh {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auto-refresh label {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--success);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-badge {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Call Queue Cards */
        .call-card {
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }

        .call-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .call-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.5rem;
        }

        .call-contact-name {
            font-weight: 700;
            color: var(--secondary);
            font-size: 1rem;
        }

        .call-company {
            color: var(--gray);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .call-phone {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--gray);
        }

        .call-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .call-tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .tag-priority {
            background: #fef3c7;
            color: #92400e;
        }

        .tag-cooldown {
            background: #fee2e2;
            color: #991b1b;
        }

        .tag-assigned {
            background: #d1fae5;
            color: #065f46;
        }

        .tag-expired {
            background: #fef3c7;
            color: #92400e;
        }

        /* Agent Cards */
        .agent-card {
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .agent-name {
            font-weight: 700;
            color: var(--secondary);
        }

        .agent-count {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .agent-calls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .agent-call-item {
            font-size: 0.875rem;
            color: var(--gray);
            padding: 0.5rem;
            background: var(--light-gray);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expiry-time {
            font-size: 0.75rem;
            color: var(--warning);
            font-weight: 600;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.875rem;
        }

        /* Filter Reasons Section */
        .filter-reason {
            font-size: 0.875rem;
            padding: 0.75rem;
            border-left: 3px solid;
            margin-bottom: 0.5rem;
            background: var(--light-gray);
        }

        .filter-reason.cooldown {
            border-color: var(--danger);
        }

        .filter-reason.declined {
            border-color: var(--warning);
        }

        .filter-reason.flagged {
            border-color: var(--info);
        }

        .filter-reason-title {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .filter-reason-count {
            color: var(--gray);
        }

        /* Assignment Panel */
        .assign-panel {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .assign-panel-title {
            font-size: 1.125rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .assign-row {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .assign-input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            background: white;
        }

        .btn-assign {
            background: var(--success);
            color: white;
        }

        .btn-assign:hover:not(:disabled) {
            filter: brightness(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-release {
            background: #fef3c7;
            color: #92400e;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
        }

        .assign-status {
            margin-top: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .assign-status.success { color: var(--success); }
        .assign-status.error { color: var(--danger); }
        .assign-status.info { color: var(--gray); }
    </style>
    <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-tasks"></i>
                    Call Assignment Dashboard
                </h1>
                <p>Real-time monitoring of call queue, assignments, and filters</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.location.href='call_manager.html'">
                    <i class="fas fa-phone-alt"></i> Call Manager
                </button>
                <button class="btn btn-primary" onclick="window.location.href='home.html'">
                    <i class="fas fa-home"></i> CRM Home
                </button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label class="filter-label">Campaign</label>
                <select id="campaignSelect" class="filter-select" onchange="loadDashboard()">
                    <option value="">Select Campaign...</option>
                </select>
            </div>

            <div class="auto-refresh">
                <label>Auto-refresh (30s)</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <button class="btn btn-primary" onclick="loadDashboard()">
                <i class="fas fa-sync-alt"></i> Refresh Now
            </button>
        </div>

        <!-- Manual Assignment -->
        <div class="assign-panel">
            <div class="assign-panel-title">
                <i class="fas fa-user-plus"></i>
                Assign Calls to an Agent
            </div>
            <div class="assign-row">
                <div class="filter-group">
                    <label class="filter-label">Agent</label>
                    <select id="assignAgentSelect" class="filter-select">
                        <option value="">Loading agents...</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Number of calls</label>
                    <input type="number" id="assignCount" class="assign-input" value="10" min="1" max="500">
                </div>
                <button class="btn btn-assign" id="assignBtn" onclick="assignCalls()" disabled>
                    <i class="fas fa-paper-plane"></i> Assign Calls
                </button>
            </div>
            <div class="assign-status" id="assignStatus"></div>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Next in Queue -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-arrow-right"></i>
                        Next in Queue
                    </div>
                    <div class="section-badge" id="queueCount">0</div>
                </div>
                <div id="queueList">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Select a campaign to view queue</p>
                    </div>
                </div>
            </div>

            <!-- Active Assignments -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-users"></i>
                        Active Assignments
                    </div>
                    <div class="section-badge" id="assignmentsCount">0</div>
                </div>
                <div id="assignmentsList">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Select a campaign to view assignments</p>
                    </div>
                </div>
            </div>

            <!-- Filter Reasons -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-filter"></i>
                        Filter Reasons
                    </div>
                    <div class="section-badge" id="filteredCount">0</div>
                </div>
                <div id="filterReasons">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Select a campaign to view filters</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase and Auth -->
    <script src="../js/auth.js"></script>
    <script src="../js/folder-protection.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script>
        console.log('📊 Call Assignment Dashboard v3.1.0 loading...');

        let selectedCampaign = null;
        let autoRefreshInterval = null;
        let currentUserEmail = null;

        // Cap on how many activity docs we pull per campaign refresh
        const MAX_ACTIVITY_FETCH = 1000;
        // Firestore allows 500 writes per batch; stay under it
        const BATCH_SIZE = 450;

        // Wait for Firebase to be ready (auth.js exposes window.firebaseReady)
        window.firebaseReady.then(async () => {
            console.log('🔥 Firebase ready, initializing dashboard...');

            // Protect the CRM folder (returns a boolean)
            const hasAccess = await protectFolder('crm');
            if (!hasAccess) {
                console.error('❌ Access denied to CRM folder');
                return;
            }

            currentUserEmail = window.auth?.currentUser?.email
                || window.getCurrentAuthState?.()?.user?.email
                || null;

            console.log('✅ Dashboard initialized for user:', currentUserEmail || 'unknown');

            await Promise.all([loadCampaigns(), loadAgents()]);

            // Start auto-refresh if enabled
            if (document.getElementById('autoRefreshToggle').checked) {
                startAutoRefresh();
            }
        }).catch(error => {
            console.error('❌ Dashboard initialization failed:', error);
        });

        // Load campaigns
        async function loadCampaigns() {
            const campaignSelect = document.getElementById('campaignSelect');

            try {
                console.log('📋 Loading campaigns...');
                
                const db = window.clemailDb;
                const campaignsSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.collection(db, 'campaigns')
                );

                const campaigns = [];
                campaignsSnapshot.forEach(doc => {
                    const data = doc.data();
                    campaigns.push({
                        id: doc.id,
                        name: data.name || data.campaignName || doc.id,
                        inactive: data.status && data.status !== 'active'
                    });
                });

                campaigns.sort((a, b) => a.name.localeCompare(b.name));

                campaignSelect.innerHTML = '<option value="">Select Campaign...</option>';
                campaigns.forEach(campaign => {
                    const option = document.createElement('option');
                    option.value = campaign.id;
                    option.textContent = campaign.inactive ? `${campaign.name} (inactive)` : campaign.name;
                    campaignSelect.appendChild(option);
                });

                console.log(`✅ Loaded ${campaigns.length} campaigns`);
            } catch (error) {
                console.error('❌ Error loading campaigns:', error);
                campaignSelect.innerHTML = '<option value="">Failed to load campaigns</option>';
            }
        }

        // Load team members for the assignment dropdown
        async function loadAgents() {
            const agentSelect = document.getElementById('assignAgentSelect');

            try {
                console.log('👥 Loading team members...');

                const db = window.clemailDb;
                const teamSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.collection(db, 'teamMembers')
                );

                const agents = [];
                teamSnapshot.forEach(doc => {
                    const data = doc.data();
                    const email = data.email || data.emailLower || data.userEmail;
                    if (!email) return;
                    if (data.status === 'inactive') return;

                    const name = [data.firstName, data.lastName].filter(Boolean).join(' ')
                        || data.displayName
                        || data.name
                        || email;

                    agents.push({ email, name });
                });

                agents.sort((a, b) => a.name.localeCompare(b.name));

                agentSelect.innerHTML = '<option value="">Select Agent...</option>';
                agents.forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent.email;
                    option.textContent = `${agent.name} (${agent.email})`;
                    agentSelect.appendChild(option);
                });

                console.log(`✅ Loaded ${agents.length} team members`);
            } catch (error) {
                console.error('❌ Error loading team members:', error);
                agentSelect.innerHTML = '<option value="">Failed to load agents</option>';
            }
        }

        // Load dashboard data
        async function loadDashboard() {
            selectedCampaign = document.getElementById('campaignSelect').value;
            document.getElementById('assignBtn').disabled = !selectedCampaign;

            if (!selectedCampaign) {
                console.log('⚠️ No campaign selected');
                return;
            }

            console.log(`📊 Loading dashboard for campaign: ${selectedCampaign}`);

            await Promise.all([
                loadCallActivity(),
                loadFilterReasons()
            ]);

            console.log('✅ Dashboard loaded');
        }

        // Fetch the campaign's open calls once, then render both the queue and
        // the active assignments from the same result set
        async function loadCallActivity() {
            const queueList = document.getElementById('queueList');
            const assignmentsList = document.getElementById('assignmentsList');

            queueList.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading queue...</p></div>';
            assignmentsList.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading assignments...</p></div>';

            try {
                const openCalls = await fetchOpenCalls(MAX_ACTIVITY_FETCH);
                const now = new Date();

                const unassignedCalls = [];
                const agentAssignments = {};

                openCalls.forEach(call => {
                    if (isAssignable(call, now)) {
                        unassignedCalls.push(call);
                        return;
                    }

                    if (!agentAssignments[call.assignedTo]) {
                        agentAssignments[call.assignedTo] = [];
                    }
                    agentAssignments[call.assignedTo].push(call);
                });

                unassignedCalls.sort((a, b) => (b.priority || 0) - (a.priority || 0));

                renderQueue(unassignedCalls);
                renderAssignments(agentAssignments, now);

            } catch (error) {
                console.error('❌ Error loading call activity:', error);
                queueList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Failed to load queue</p></div>';
                assignmentsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Failed to load assignments</p></div>';
            }
        }

        // Pending/scheduled calls for the selected campaign
        async function fetchOpenCalls(maxDocs) {
            const db = window.clemailDb;
            const snapshot = await window.clemailFirestore.getDocs(
                window.clemailFirestore.query(
                    window.clemailFirestore.collection(db, 'phone_activities'),
                    window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                    window.clemailFirestore.where('status', 'in', ['pending', 'scheduled']),
                    window.clemailFirestore.limit(maxDocs)
                )
            );

            const calls = [];
            snapshot.forEach(doc => calls.push({ id: doc.id, ...doc.data() }));
            return calls;
        }

        // A call can be handed out if nobody holds it, or the hold has lapsed
        function isAssignable(call, now) {
            if (!call.assignedTo) return true;
            if (!call.assignmentExpiry) return false;
            const expiry = window.toDate(call.assignmentExpiry);
            return expiry ? expiry <= now : false;
        }

        function renderQueue(unassignedCalls) {
            const queueList = document.getElementById('queueList');
            document.getElementById('queueCount').textContent = unassignedCalls.length;

            if (unassignedCalls.length === 0) {
                queueList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><h3>Queue Empty</h3><p>No calls waiting to be assigned</p></div>';
                return;
            }

            let html = '';
            unassignedCalls.slice(0, 20).forEach((call, index) => {
                html += `
                    <div class="call-card">
                        <div class="call-card-header">
                            <div>
                                <div class="call-contact-name">${index + 1}. ${escapeHtml(call.contactName || 'Unknown')}</div>
                                <div class="call-company">${escapeHtml(call.companyName || call.company || 'No company')}</div>
                            </div>
                        </div>
                        <div class="call-phone">
                            <i class="fas fa-phone"></i>
                            ${escapeHtml(call.phoneNumber || call.phone || 'No phone')}
                        </div>
                        <div class="call-meta">
                            ${call.priority ? `<span class="call-tag tag-priority">Priority: ${escapeHtml(String(call.priority))}</span>` : ''}
                            ${call.phoneLastCalledAt ? `<span class="call-tag tag-cooldown">Last called: ${formatDate(call.phoneLastCalledAt)}</span>` : ''}
                        </div>
                    </div>
                `;
            });

            queueList.innerHTML = html;
        }

        function renderAssignments(agentAssignments, now) {
            const assignmentsList = document.getElementById('assignmentsList');
            const totalAssigned = Object.values(agentAssignments).reduce((sum, calls) => sum + calls.length, 0);
            document.getElementById('assignmentsCount').textContent = totalAssigned;

            if (totalAssigned === 0) {
                assignmentsList.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><h3>No Assignments</h3><p>No active call assignments</p></div>';
                return;
            }

            let html = '';
            Object.entries(agentAssignments)
                .sort((a, b) => b[1].length - a[1].length)
                .forEach(([agentEmail, calls]) => {
                    const agentName = agentEmail.split('@')[0];
                    html += `
                        <div class="agent-card">
                            <div class="agent-header">
                                <div class="agent-name">${escapeHtml(agentName)}</div>
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <div class="agent-count">${calls.length}</div>
                                    <button class="btn btn-release" data-agent="${escapeHtml(agentEmail)}">
                                        <i class="fas fa-unlock"></i> Release
                                    </button>
                                </div>
                            </div>
                            <div class="agent-calls">
                                ${calls.slice(0, 5).map(call => {
                                    const expiryTime = window.toDate(call.assignmentExpiry);
                                    const timeLeft = expiryTime ? Math.max(0, Math.round((expiryTime - now) / 60000)) : null;

                                    return `
                                        <div class="agent-call-item">
                                            <span>${escapeHtml(call.contactName || 'Unknown')}</span>
                                            <span class="expiry-time">${timeLeft === null ? 'No expiry' : timeLeft + 'm left'}</span>
                                        </div>
                                    `;
                                }).join('')}
                                ${calls.length > 5 ? `<div class="agent-call-item" style="font-style: italic; color: var(--gray);">+ ${calls.length - 5} more</div>` : ''}
                            </div>
                        </div>
                    `;
                });

            assignmentsList.innerHTML = html;

            assignmentsList.querySelectorAll('.btn-release').forEach(button => {
                button.addEventListener('click', () => releaseAgent(button.dataset.agent));
            });
        }

        // Assign the requested number of open calls to the selected agent
        async function assignCalls() {
            const agentEmail = document.getElementById('assignAgentSelect').value;
            const requested = parseInt(document.getElementById('assignCount').value, 10);
            const assignBtn = document.getElementById('assignBtn');

            if (!selectedCampaign) {
                showAssignStatus('Select a campaign first.', 'error');
                return;
            }
            if (!agentEmail) {
                showAssignStatus('Select an agent to assign calls to.', 'error');
                return;
            }
            if (!requested || requested < 1 || requested > 500) {
                showAssignStatus('Enter a call count between 1 and 500.', 'error');
                return;
            }

            const campaignName = document.getElementById('campaignSelect').selectedOptions[0].textContent;
            if (!confirm(`Assign up to ${requested} calls from "${campaignName}" to ${agentEmail}?`)) {
                return;
            }

            assignBtn.disabled = true;
            showAssignStatus('Assigning calls...', 'info');

            try {
                const now = new Date();
                const openCalls = await fetchOpenCalls(Math.min(requested * 3, MAX_ACTIVITY_FETCH));
                const available = openCalls.filter(call => isAssignable(call, now));

                if (available.length === 0) {
                    showAssignStatus('No unassigned calls available in this campaign. Release some assignments first.', 'error');
                    return;
                }

                const toAssign = available.slice(0, requested);

                // Hold the calls until midnight tonight, matching the reservation page.
                // These are written as ISO strings because team/phone-calls.html reads them
                // with new Date(...), which cannot parse a serialized Timestamp.
                const expiry = new Date(now);
                expiry.setHours(24, 0, 0, 0);

                const { doc, writeBatch } = window.clemailFirestore;
                const db = window.clemailDb;

                for (let i = 0; i < toAssign.length; i += BATCH_SIZE) {
                    const batch = writeBatch(db);
                    toAssign.slice(i, i + BATCH_SIZE).forEach(call => {
                        batch.update(doc(db, 'phone_activities', call.id), {
                            assignedTo: agentEmail,
                            assignedAt: now.toISOString(),
                            assignmentExpiry: expiry.toISOString(),
                            reservedBy: agentEmail,
                            manuallyAssigned: true,
                            manuallyAssignedBy: currentUserEmail
                        });
                    });
                    await batch.commit();
                }

                const shortfall = toAssign.length < requested
                    ? ` (only ${toAssign.length} of ${requested} were available)`
                    : '';
                showAssignStatus(`Assigned ${toAssign.length} calls to ${agentEmail}${shortfall}.`, 'success');
                console.log(`✅ Assigned ${toAssign.length} calls to ${agentEmail}`);

                await loadCallActivity();

            } catch (error) {
                console.error('❌ Error assigning calls:', error);
                showAssignStatus(`Failed to assign calls: ${error.message}`, 'error');
            } finally {
                assignBtn.disabled = !selectedCampaign;
            }
        }

        // Release every call this agent holds in the selected campaign
        async function releaseAgent(agentEmail) {
            if (!agentEmail) return;
            if (!confirm(`Release all assigned calls for ${agentEmail} in this campaign?`)) return;

            showAssignStatus(`Releasing calls for ${agentEmail}...`, 'info');

            try {
                const now = new Date();
                const openCalls = await fetchOpenCalls(MAX_ACTIVITY_FETCH);
                const held = openCalls.filter(call => call.assignedTo === agentEmail && !isAssignable(call, now));

                if (held.length === 0) {
                    showAssignStatus(`No active assignments found for ${agentEmail}.`, 'info');
                    await loadCallActivity();
                    return;
                }

                const { doc, writeBatch } = window.clemailFirestore;
                const db = window.clemailDb;

                for (let i = 0; i < held.length; i += BATCH_SIZE) {
                    const batch = writeBatch(db);
                    held.slice(i, i + BATCH_SIZE).forEach(call => {
                        batch.update(doc(db, 'phone_activities', call.id), {
                            assignedTo: null,
                            assignedAt: null,
                            assignmentExpiry: null,
                            reservedBy: null
                        });
                    });
                    await batch.commit();
                }

                showAssignStatus(`Released ${held.length} calls from ${agentEmail}.`, 'success');
                console.log(`✅ Released ${held.length} calls from ${agentEmail}`);

                await loadCallActivity();

            } catch (error) {
                console.error('❌ Error releasing calls:', error);
                showAssignStatus(`Failed to release calls: ${error.message}`, 'error');
            }
        }

        function showAssignStatus(message, type) {
            const status = document.getElementById('assignStatus');
            status.textContent = message;
            status.className = `assign-status ${type}`;
            status.style.display = 'block';
        }

        // Load filter reasons
        async function loadFilterReasons() {
            const filterReasons = document.getElementById('filterReasons');
            filterReasons.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading filters...</p></div>';

            try {
                const db = window.clemailDb;
                const now = new Date();
                const cooldownThreshold = new Date(now.getTime() - (72 * 60 * 60 * 1000)); // 72 hours ago

                // Get completed calls, then keep the ones inside the 72-hour cooldown.
                // completedAt is stored as an ISO string on some docs and a Timestamp on
                // others, so the window is applied client-side rather than in the query.
                const completedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'phone_activities'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                        window.clemailFirestore.where('status', '==', 'completed'),
                        window.clemailFirestore.limit(MAX_ACTIVITY_FETCH)
                    )
                );

                let inCooldownCount = 0;
                completedSnapshot.forEach(doc => {
                    const completedAt = window.toDate(doc.data().completedAt);
                    if (completedAt && completedAt >= cooldownThreshold) inCooldownCount++;
                });

                // Get declined contacts
                const declinedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'phone_activities'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign),
                        window.clemailFirestore.where('outcome', 'in', ['declined', 'not-interested', 'do-not-call'])
                    )
                );

                // Get flagged contacts
                const flaggedSnapshot = await window.clemailFirestore.getDocs(
                    window.clemailFirestore.query(
                        window.clemailFirestore.collection(db, 'flaggedContacts'),
                        window.clemailFirestore.where('campaignId', '==', selectedCampaign)
                    )
                );

                const totalFiltered = inCooldownCount + declinedSnapshot.size + flaggedSnapshot.size;
                document.getElementById('filteredCount').textContent = totalFiltered;

                let html = '';
                
                if (inCooldownCount > 0) {
                    html += `
                        <div class="filter-reason cooldown">
                            <div class="filter-reason-title">
                                <i class="fas fa-clock"></i> 72-Hour Cooldown
                            </div>
                            <div class="filter-reason-count">${inCooldownCount} contacts filtered</div>
                        </div>
                    `;
                }

                if (declinedSnapshot.size > 0) {
                    html += `
                        <div class="filter-reason declined">
                            <div class="filter-reason-title">
                                <i class="fas fa-ban"></i> Declined
                            </div>
                            <div class="filter-reason-count">${declinedSnapshot.size} contacts filtered</div>
                        </div>
                    `;
                }

                if (flaggedSnapshot.size > 0) {
                    html += `
                        <div class="filter-reason flagged">
                            <div class="filter-reason-title">
                                <i class="fas fa-flag"></i> Flagged for Review
                            </div>
                            <div class="filter-reason-count">${flaggedSnapshot.size} contacts filtered</div>
                        </div>
                    `;
                }

                if (html === '') {
                    html = '<div class="empty-state"><i class="fas fa-check-circle"></i><h3>No Filters Active</h3><p>All contacts available for calling</p></div>';
                }

                filterReasons.innerHTML = html;

            } catch (error) {
                console.error('❌ Error loading filter reasons:', error);
                filterReasons.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Failed to load filters</p></div>';
            }
        }

        // Auto-refresh
        function toggleAutoRefresh() {
            if (document.getElementById('autoRefreshToggle').checked) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh(); // Clear any existing interval
            autoRefreshInterval = setInterval(() => {
                if (selectedCampaign) {
                    console.log('🔄 Auto-refreshing dashboard...');
                    loadDashboard();
                }
            }, 30000); // 30 seconds
            console.log('✅ Auto-refresh enabled (30s)');
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                console.log('⏸️ Auto-refresh disabled');
            }
        }

        // Helper functions
        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = window.toDate(dateString);
            if (!date) return 'Never';
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return `${diffDays}d ago`;
        }

        console.log('✅ Call Assignment Dashboard script loaded');
    </script>
</body>
