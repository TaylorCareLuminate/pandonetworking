<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LinkedIn Extractor Results</title>
	<link rel="stylesheet" href="../css/main.css">
	<style>
		.container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
		.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
		.header { padding: 16px 18px; border-bottom: 1px solid #e5e7eb; font-weight: 700; }
		.content { padding: 16px 18px; }
		.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
		input[type="text"], input[type="password"], select { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; }
		button { background: #1e40af; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
		button.secondary { background: #374151; }
		.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #eef2ff; color: #1e3a8a; border: 1px solid #c7d2fe; }
		.table { width: 100%; border-collapse: collapse; }
		.table th, .table td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: 8px; font-size: 14px; }
		pre { background: #0b1020; color: #d1e7ff; padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; }
	</style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
	<div class="container">
		<div class="card">
			<div class="header">Extractor Controls</div>
			<div class="content">
				<div class="controls">
					<label>Backend URL <input id="backendUrl" type="text" value="https://railwayclemail-production.up.railway.app"></label>
					<label>API Key <input id="apiKey" type="password" placeholder="X-Phantombuster-Key-1"></label>
					<button id="btnFetchNow">Fetch Now</button>
					<select id="limit">
						<option value="20">Last 20</option>
						<option value="50">Last 50</option>
						<option value="100">Last 100</option>
					</select>
					<button class="secondary" id="btnRefresh">Refresh List</button>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="header">Recent Results</div>
			<div class="content">
				<table class="table" id="resultsTable">
					<thead>
						<tr>
							<th>Fetched At</th>
							<th>Agent ID</th>
							<th>Status</th>
							<th>Type</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="resultsBody"></tbody>
				</table>
			</div>
		</div>

		<div class="card">
			<div class="header">Normalized Items</div>
			<div class="content">
				<table class="table" id="itemsTable">
					<thead>
						<tr>
							<th>When</th>
							<th>Name</th>
							<th>Headline</th>
							<th>Profile</th>
							<th>Post URL</th>
							<th>Snippet</th>
						</tr>
					</thead>
					<tbody id="itemsBody"></tbody>
				</table>
			</div>
		</div>

		<div class="card" id="detailCard" style="display:none;">
			<div class="header">Result Detail</div>
			<div class="content">
				<pre id="detailPre">{}</pre>
			</div>
		</div>
	</div>

	<script>
	(function(){
		const els = {
			backendUrl: document.getElementById('backendUrl'),
			apiKey: document.getElementById('apiKey'),
			btnFetchNow: document.getElementById('btnFetchNow'),
			btnRefresh: document.getElementById('btnRefresh'),
			limit: document.getElementById('limit'),
			resultsBody: document.getElementById('resultsBody'),
			detailCard: document.getElementById('detailCard'),
			detailPre: document.getElementById('detailPre')
		};

		function b() { return els.backendUrl.value.replace(/\/$/, ''); }

		async function fetchNow() {
			const res = await fetch(b() + '/phantom/extractor/fetch-now', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					...(els.apiKey.value ? { 'X-Phantombuster-Key-1': els.apiKey.value } : {})
				},
				body: JSON.stringify({})
			});
			const data = await res.json();
			alert((data.success ? '✅' : '❌') + ' Fetch-now: ' + (data.success ? ('stored ' + data.id) : data.error));
			await refresh();
		}

		async function refresh() {
			const r = await fetch(b() + '/phantom/extractor/results?limit=' + encodeURIComponent(els.limit.value));
			const j = await r.json();
			const items = (j.items || []);
			els.resultsBody.innerHTML = items.map(item => {
				const when = item.fetchedAt && item.fetchedAt.seconds ? new Date(item.fetchedAt.seconds*1000) : new Date(item.fetchedAt || Date.now());
				return `<tr>
					<td>${when.toLocaleString()}</td>
					<td>${item.agentId}</td>
					<td><span class="badge">${item.responseStatus}</span></td>
					<td>${(item.contentType || '').split(';')[0]}</td>
					<td><button data-id="${item.id}" class="viewBtn">View</button></td>
				</tr>`;
			}).join('');
			Array.from(document.querySelectorAll('.viewBtn')).forEach(btn => {
				btn.addEventListener('click', async () => {
					const id = btn.getAttribute('data-id');
					const r = await fetch(b() + '/phantom/extractor/results/' + id);
					const j = await r.json();
					els.detailCard.style.display = 'block';
					els.detailPre.textContent = JSON.stringify(j.item || j, null, 2);
				});
			});

			// Load normalized items
			const ir = await fetch(b() + '/phantom/extractor/items?limit=50');
			const ij = await ir.json();
			const nitems = (ij.items || []);
			const tbody = document.getElementById('itemsBody');
			tbody.innerHTML = nitems.map(it => {
				const when = it.createdAt && it.createdAt.seconds ? new Date(it.createdAt.seconds*1000) : new Date();
				const h = (it.headline || '').toString();
				const snip = (it.postText || '').toString().slice(0, 120).replace(/</g,'&lt;');
				return `<tr>
					<td>${when.toLocaleString()}</td>
					<td>${it.name || ''}</td>
					<td>${h}</td>
					<td>${it.profileUrl ? `<a href="${it.profileUrl}" target="_blank">Profile</a>` : ''}</td>
					<td>${it.postUrl ? `<a href="${it.postUrl}" target="_blank">Link</a>` : ''}</td>
					<td>${snip}</td>
				</tr>`;
			}).join('');
		}

		els.btnFetchNow.addEventListener('click', fetchNow);
		els.btnRefresh.addEventListener('click', refresh);
		refresh();
	})();
	</script>
</body>
</html>
