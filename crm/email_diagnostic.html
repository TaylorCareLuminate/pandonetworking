<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Diagnostic Table - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #0ea5e9;
            --gray: #6b7280;
            --danger: #ef4444;
            --success: #10b981;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 8px;
        }
        
        body { background: #f9fafb; }
        
        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .page-header {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .page-header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .controls {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            text-decoration: none;
        }
        
        .btn-primary { background: var(--secondary); color: #fff; }
        .btn-secondary { background: #6b7280; color: #fff; }
        .btn:hover { transform: translateY(-1px); }
        
        .table-container {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        
        .diagnostic-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .diagnostic-table th {
            background: #f8fafc;
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .diagnostic-table th:hover {
            background: #e2e8f0;
        }
        
        .diagnostic-table td {
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .diagnostic-table tr:hover {
            background: #f8fafc;
        }
        
        .type-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .type-initial { background: #dbeafe; color: #1e40af; }
        .type-followup { background: #fef3c7; color: #d97706; }
        .type-follow_up { background: #fef3c7; color: #d97706; }
        
        .date-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        
        .followup-number {
            font-weight: 600;
            color: var(--primary);
        }
        
        .search-box {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            width: 300px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-left: auto;
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }
        
        .table-wrapper {
            max-height: 70vh;
            overflow: auto;
        }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body class="crm-page">
    <div id="header-placeholder"></div>
    
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-table"></i> Email Diagnostic Table</h1>
            <div style="color: var(--gray); margin-top: 6px;">
                Simple view to diagnose follow-up scheduling issues
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="loadEmails()">
                <i class="fas fa-sync"></i> Refresh Data
            </button>
            <input type="text" id="searchBox" class="search-box" placeholder="Search recipient, subject, or type..." oninput="filterTable()">
            <button class="btn btn-secondary" id="deleteBtn" onclick="deleteSelectedEmails()" disabled>
                <i class="fas fa-trash"></i> Delete Selected
            </button>
            <div class="stats">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>First-time: <strong id="initialCount">0</strong></span>
                <span>Follow-ups: <strong id="followupCount">0</strong></span>
            </div>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table class="diagnostic-table" id="diagnosticTable">
                    <thead>
                        <tr>
                            <th style="width:32px;">
                                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
                            </th>
                            <th onclick="sortTable('to')">Recipient <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('sendAt')">Scheduled Date <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('subject')">Subject <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('type')">Type <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('followUpNumber')">Follow-up # <i class="fas fa-sort"></i></th>
                            <th onclick="sortTable('previousEmailDate')">Previous Email Date <i class="fas fa-sort"></i></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="6" class="loading">
                                <i class="fas fa-spinner fa-spin"></i> Loading emails...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/folder-protection.js"></script>
    
    <script>
        let allEmails = [];
        let filteredEmails = [];
        let sortColumn = 'sendAt';
        let sortDirection = 'asc';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await window.firebaseReady;
                const hasAccess = await window.protectFolder('crm');
                if (hasAccess) {
                    await loadEmails();
                }
            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="6" class="loading">
                        <i class="fas fa-exclamation-triangle"></i> Error: ${error.message}
                    </td></tr>
                `;
            }
        });

        async function loadEmails() {
            try {
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="6" class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Loading emails...
                    </td></tr>
                `;

                // Load from Railway backend (same as email_queue.html)
                const response = await fetch('https://railwayclemail-production.up.railway.app/emails');
                if (!response.ok) throw new Error('Failed to fetch emails');
                
                const data = await response.json();
                allEmails = (data.emails || []).filter(email => 
                    email.status === 'scheduled' || email.status === 'pending'
                );

                console.log(`📧 Loaded ${allEmails.length} scheduled emails`);
                
                filteredEmails = [...allEmails];
                updateStats();
                renderTable();
                
            } catch (error) {
                console.error('Error loading emails:', error);
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="6" class="loading">
                        <i class="fas fa-exclamation-triangle"></i> Failed to load emails: ${error.message}
                    </td></tr>
                `;
            }
        }

        function updateStats() {
            const total = filteredEmails.length;
            const initial = filteredEmails.filter(e => 
                !isFollowUp(e)
            ).length;
            const followup = filteredEmails.filter(e => 
                isFollowUp(e)
            ).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('initialCount').textContent = initial;
            document.getElementById('followupCount').textContent = followup;
        }

        function isFollowUp(email) {
            return email.type === 'followup' || 
                   email.type === 'follow_up' || 
                   email.followUpNumber > 1 ||
                   (email.subject && email.subject.toLowerCase().includes('re:'));
        }

        function getFollowUpNumber(email) {
            if (email.followUpNumber) return email.followUpNumber;
            if (email.subject && email.subject.toLowerCase().includes('re:')) return 2;
            return 1;
        }

        function getPreviousEmailDate(email) {
            if (!isFollowUp(email)) return null;
            
            // Find all emails to the same recipient
            const recipientEmails = allEmails
                .filter(e => e.to && e.to.toLowerCase() === email.to.toLowerCase())
                .filter(e => e.sendAt) // Must have a send date
                .sort((a, b) => new Date(a.sendAt) - new Date(b.sendAt)); // Sort by date
            
            // Find the current email's position and get the previous one
            const currentIndex = recipientEmails.findIndex(e => e.id === email.id);
            if (currentIndex > 0) {
                return recipientEmails[currentIndex - 1].sendAt;
            }
            
            return null;
        }

        function formatDate(dateString) {
            if (!dateString) return 'Not scheduled';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
            } catch {
                return dateString;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            
            if (filteredEmails.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6" class="loading">
                        No emails found matching your criteria
                    </td></tr>
                `;
                return;
            }

            const rows = filteredEmails.map(email => {
                const isFollowUpEmail = isFollowUp(email);
                const followUpNum = getFollowUpNumber(email);
                const typeClass = isFollowUpEmail ? 'type-followup' : 'type-initial';
                const typeText = isFollowUpEmail ? 'Follow-up' : 'Initial';
                const previousDate = getPreviousEmailDate(email);

                return `
                    <tr>
                        <td><input type="checkbox" class="row-select" data-id="${email.id}" onchange="updateDeleteButton()"></td>
                        <td title="${email.to || ''}">${email.to || 'Unknown'}</td>
                        <td class="date-cell">${formatDate(email.sendAt)}</td>
                        <td title="${email.subject || ''}">${email.subject || 'No Subject'}</td>
                        <td><span class="type-badge ${typeClass}">${typeText}</span></td>
                        <td class="followup-number">${followUpNum}</td>
                        <td class="date-cell">${previousDate ? formatDate(previousDate) : '-'}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
        }

        function filterTable() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            
            if (!query) {
                filteredEmails = [...allEmails];
            } else {
                filteredEmails = allEmails.filter(email => 
                    (email.to || '').toLowerCase().includes(query) ||
                    (email.subject || '').toLowerCase().includes(query) ||
                    (email.type || '').toLowerCase().includes(query)
                );
            }

            updateStats();
            renderTable();
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            filteredEmails.sort((a, b) => {
                let valueA = a[column] || '';
                let valueB = b[column] || '';

                // Special handling for dates
                if (column === 'sendAt') {
                    valueA = new Date(valueA || 0);
                    valueB = new Date(valueB || 0);
                }

                // Special handling for follow-up numbers
                if (column === 'followUpNumber') {
                    valueA = getFollowUpNumber(a);
                    valueB = getFollowUpNumber(b);
                }

                // Special handling for previous email dates
                if (column === 'previousEmailDate') {
                    valueA = new Date(getPreviousEmailDate(a) || 0);
                    valueB = new Date(getPreviousEmailDate(b) || 0);
                }

                if (valueA < valueB) return sortDirection === 'asc' ? -1 : 1;
                if (valueA > valueB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable();

            // Update sort indicators
            document.querySelectorAll('th i').forEach(i => i.className = 'fas fa-sort');
            const activeHeader = document.querySelector(`th[onclick="sortTable('${column}')"] i`);
            if (activeHeader) {
                activeHeader.className = `fas fa-sort-${sortDirection === 'asc' ? 'up' : 'down'}`;
            }
        }

        // Selection helpers
        function toggleSelectAll(master) {
            document.querySelectorAll('.row-select').forEach(cb => {
                cb.checked = master.checked;
            });
            updateDeleteButton();
        }

        function updateDeleteButton() {
            const anyChecked = Array.from(document.querySelectorAll('.row-select')).some(cb => cb.checked);
            document.getElementById('deleteBtn').disabled = !anyChecked;
        }

        async function deleteSelectedEmails() {
            const selected = Array.from(document.querySelectorAll('.row-select'))
                .filter(cb => cb.checked)
                .map(cb => cb.getAttribute('data-id'));
            if (selected.length === 0) return;
            const confirmMsg = `Delete ${selected.length} email${selected.length>1?'s':''} from the schedule?\nThis cannot be undone.`;
            if (!confirm(confirmMsg)) return;

            const deleteBtn = document.getElementById('deleteBtn');
            const originalText = deleteBtn.innerHTML;
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';

            const base = 'https://railwayclemail-production.up.railway.app';
            const errors = [];
            try {
                // Try per-id DELETE (most common REST pattern)
                await Promise.all(selected.map(async (id) => {
                    try {
                        let res = await fetch(`${base}/emails/${encodeURIComponent(id)}`, { method: 'DELETE' });
                        if (!res.ok) {
                            // Fallback 1: POST to /emails/delete { id }
                            res = await fetch(`${base}/emails/delete`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id })
                            });
                        }
                        if (!res.ok) {
                            const text = await res.text();
                            throw new Error(text || `HTTP ${res.status}`);
                        }
                    } catch (err) {
                        console.error('Delete error for', id, err);
                        errors.push({ id, error: err.message });
                    }
                }));

                // Refresh table
                await loadEmails();
                const selectAll = document.getElementById('selectAll');
                if (selectAll) selectAll.checked = false;
                updateDeleteButton();

                if (errors.length === 0) {
                    alert('Selected emails deleted.');
                } else if (errors.length < selected.length) {
                    alert(`Some emails could not be deleted (showing first 3):\n\n${errors.slice(0,3).map(e=>`• ${e.id}: ${e.error}`).join('\n')}`);
                } else {
                    alert(`Failed to delete emails (showing first 3):\n\n${errors.slice(0,3).map(e=>`• ${e.id}: ${e.error}`).join('\n')}`);
                }
            } catch (e) {
                console.error('Delete failed:', e);
                alert(`Failed to delete emails: ${e.message}`);
            } finally {
                deleteBtn.innerHTML = originalText;
                deleteBtn.disabled = false;
            }
        }

        // Load header
        async function loadHeader() {
            try {
                const response = await fetch('../Partials/header.html');
                const headerHtml = await response.text();
                document.getElementById('header-placeholder').innerHTML = headerHtml;
            } catch (error) {
                console.error('Error loading header:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadHeader);
    </script>
</body>
</html>
