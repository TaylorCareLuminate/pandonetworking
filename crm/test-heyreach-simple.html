<!DOCTYPE html>
<html>
<head>
    <title>Simple HeyReach Test</title>
</head>
<body>
    <h1>Simple HeyReach Backend Test</h1>
    <button onclick="testStatus()">Test Status Endpoint</button>
    <button onclick="testVerify()">Test Verify Endpoint</button>
    <br><br>
    <textarea id="results" rows="20" cols="80"></textarea>

    <script>
        function log(msg) {
            document.getElementById('results').value += new Date().toISOString() + ': ' + msg + '\n';
        }

        async function testStatus() {
            log('Testing /heyreach-status...');
            try {
                const response = await fetch('https://railwayclemail-production.up.railway.app/heyreach-status');
                log(`Status: ${response.status} ${response.statusText}`);
                const data = await response.text();
                log(`Response: ${data}`);
            } catch (e) {
                log(`Error: ${e.message}`);
            }
        }

        async function testVerify() {
            log('Testing /proxy/heyreach/api-key/verify...');
            try {
                const response = await fetch('https://railwayclemail-production.up.railway.app/proxy/heyreach/api-key/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': 'test-key'
                    },
                    body: '{}'
                });
                log(`Status: ${response.status} ${response.statusText}`);
                const data = await response.text();
                log(`Response: ${data}`);
            } catch (e) {
                log(`Error: ${e.message}`);
            }
        }

        // Auto-run tests on page load
        window.onload = function() {
            log('Page loaded. Testing endpoints...');
            testStatus();
            setTimeout(testVerify, 1000);
        };
    </script>
</body>
</html>
