<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RingCentral Phone Test</title>
	<style>
		:root { --bg:#f7fafc; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --primary:#1e40af; --border:#e5e7eb; }
		body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial; background:var(--bg); color:var(--text); }
		.container { max-width: 980px; margin: 24px auto; padding: 0 16px; }
		.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
		.header { padding: 18px 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 18px; }
		.content { padding: 16px 20px; }
		.field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
		label { font-size: 13px; color: var(--muted); }
		input[type="text"], textarea { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
		.buttons { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
		button { background: var(--primary); color:#fff; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:600; }
		button.secondary { background:#374151; }
		button.ghost { background:#e5e7eb; color:#111827; }
		.small { font-size:12px; color:var(--muted); }
		.note { margin-top: 6px; }
		pre { background:#0b1020; color:#d1e7ff; padding:12px; border-radius:8px; overflow:auto; font-size:12px; line-height:1.45; }
	</style>

	<!-- RingCentral Embeddable widget config (fill in your app credentials when ready) -->
	<script>
		window.RingCentralEmbeddable = window.RingCentralEmbeddable || {};
		// Optional: set your own app credentials from RingCentral Developer portal.
		// For initial testing you can omit these and sign in via the popup.
		window.RingCentralEmbeddable.config = {
			// appKey: 'YOUR_CLIENT_ID',
			// appSecret: 'YOUR_CLIENT_SECRET',
			// server: 'https://platform.ringcentral.com', // use https://platform.devtest.ringcentral.com for sandbox
			// redirectUri: window.location.origin + '/crm/phone_test.html'
		};
	</script>
	<script src="https://ringcentral.github.io/ringcentral-embeddable/adapter.js"></script>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
	<!-- Header placeholder -->
	<div id="header-placeholder"></div>

	<div class="container">
		<div class="card">
			<div class="header">RingCentral Web Phone - Click to Call Test</div>
			<div class="content">
				<div class="field">
					<label>Phone Number (E.164 recommended, e.g., +18016159485)</label>
					<input id="phoneNumber" type="text" placeholder="+18016159485">
					<div class="small">Ensure you're logged into RingCentral in the widget first.</div>
				</div>
				<div class="buttons">
					<button id="btnOpen">Open Phone</button>
					<button id="btnCall">Call</button>
					<button id="btnHide" class="secondary">Hide Phone</button>
					<button id="btnClear" class="ghost">Clear Log</button>
				</div>
				<div class="note small">
					This embeds the RingCentral web phone. The Call button posts a message to the widget to start dialing the entered number.
				</div>
			</div>
		</div>

		<div style="height:12px"></div>

		<div class="card">
			<div class="header">Event Log</div>
			<div class="content">
				<pre id="log">(ready)</pre>
			</div>
		</div>
	</div>

	<!-- Footer placeholder -->
	<div id="footer-placeholder" style="margin-top:24px;"></div>

	<script>
	(function() {
		const els = {
			phone: document.getElementById('phoneNumber'),
			btnOpen: document.getElementById('btnOpen'),
			btnCall: document.getElementById('btnCall'),
			btnHide: document.getElementById('btnHide'),
			btnClear: document.getElementById('btnClear'),
			log: document.getElementById('log')
		};

		function log(msg, data) {
			const line = `[${new Date().toISOString()}] ${msg}` + (data ? `\n` + JSON.stringify(data, null, 2) : '');
			els.log.textContent = (els.log.textContent ? els.log.textContent + "\n\n" : '') + line;
		}

		function postToRC(message) {
			window.postMessage(message, '*');
			log('postMessage sent', message);
		}

		// Basic controls
		els.btnOpen.addEventListener('click', function() {
			postToRC({ type: 'rc-adapter-set-minimized', minimized: false });
		});

		els.btnHide.addEventListener('click', function() {
			postToRC({ type: 'rc-adapter-set-minimized', minimized: true });
		});

		els.btnCall.addEventListener('click', function() {
			const num = (els.phone.value || '').trim();
			if (!num) { alert('Enter a phone number'); return; }
			postToRC({ type: 'rc-adapter-new-call', phoneNumber: num });
		});

		els.btnClear.addEventListener('click', function() {
			els.log.textContent = '';
		});

		// Listen to messages from RC widget for debugging
		window.addEventListener('message', function(e) {
			try {
				if (!e || !e.data) return;
				const data = e.data;
				if (typeof data !== 'object') return;
				if (data && (data.type || '').toString().toLowerCase().startsWith('rc-')) {
					log('message received', data);
				}
			} catch (err) {
				log('message handler error', { error: String(err) });
			}
		});

		// Load site header/footer partials
		async function loadPartials() {
			try {
				const headerRes = await fetch('../Partials/header.html');
				const headerHtml = await headerRes.text();
				document.getElementById('header-placeholder').innerHTML = headerHtml;
			} catch (e) { console.warn('Header load failed', e); }
			try {
				const footerRes = await fetch('../Partials/footer.html');
				const footerHtml = await footerRes.text();
				document.getElementById('footer-placeholder').innerHTML = footerHtml;
			} catch (e) { console.warn('Footer load failed', e); }
		}

		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', loadPartials);
		} else {
			loadPartials();
		}
	})();
	</script>
</body>
</html>
