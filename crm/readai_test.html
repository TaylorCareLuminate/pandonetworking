<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read.ai Webhook Tester</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #22263a;
            --border: #2e3350;
            --green: #22c55e;
            --green-dim: #15803d;
            --yellow: #eab308;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #a855f7;
            --muted: #64748b;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ---- Top bar ---- */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: .75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
        }
        .topbar-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .topbar-title .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
            transition: background .3s;
        }
        .topbar-title .dot.green  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
        .topbar-title .dot.red    { background: var(--red);    box-shadow: 0 0 6px var(--red); }
        .topbar-title .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .topbar-meta { display:flex; gap:1.25rem; flex-wrap:wrap; }
        .meta-chip {
            padding: .2rem .7rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: .75rem;
            display: flex;
            align-items: center;
            gap: .4rem;
        }
        .meta-chip .val { color: var(--text); font-weight: 700; }
        .topbar-actions { margin-left: auto; display:flex; gap:.6rem; }

        /* ---- Buttons ---- */
        .btn {
            padding: .35rem .9rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: .78rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            transition: all .15s;
            text-decoration: none;
        }
        .btn:hover { border-color: var(--blue); color: var(--blue); }
        .btn-green  { border-color: var(--green-dim); color: var(--green); }
        .btn-green:hover { background: rgba(34,197,94,.1); }
        .btn-red    { border-color: #7f1d1d; color: var(--red); }
        .btn-red:hover { background: rgba(239,68,68,.1); }
        .btn-purple { border-color: #6b21a8; color: var(--purple); }
        .btn-purple:hover { background: rgba(168,85,247,.1); }

        /* ---- Webhook URL banner ---- */
        .url-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--blue);
            padding: .75rem 1.25rem;
            margin: 1rem 1.5rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .url-label { color: var(--text-dim); font-size: .75rem; white-space: nowrap; }
        .url-value {
            color: var(--blue);
            font-weight: 600;
            flex: 1;
            word-break: break-all;
        }
        .copy-btn {
            padding: .25rem .75rem;
            background: rgba(59,130,246,.15);
            border: 1px solid rgba(59,130,246,.3);
            border-radius: 4px;
            color: var(--blue);
            cursor: pointer;
            font-size: .75rem;
            font-family: inherit;
            white-space: nowrap;
            transition: background .15s;
        }
        .copy-btn:hover { background: rgba(59,130,246,.3); }
        .copy-btn.copied { color: var(--green); border-color: var(--green-dim); background: rgba(34,197,94,.1); }

        /* ---- Key info banner ---- */
        .key-banner {
            margin: 0 1.5rem .75rem;
            padding: .6rem 1.25rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: .75rem;
            font-size: .8rem;
        }
        .key-ok  { border-left: 3px solid var(--green); }
        .key-warn{ border-left: 3px solid var(--yellow); }
        .key-badge {
            padding: .15rem .6rem;
            border-radius: 4px;
            font-size: .72rem;
            font-weight: 700;
        }
        .badge-ok   { background: rgba(34,197,94,.15); color: var(--green); }
        .badge-warn { background: rgba(234,179,8,.15); color: var(--yellow); }

        /* ---- Main layout ---- */
        .main { padding: 0 1.5rem 2rem; }

        /* ---- Filter row ---- */
        .filter-row {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-bottom: .75rem;
            flex-wrap: wrap;
        }
        .filter-tabs { display:flex; gap:.25rem; }
        .ftab {
            padding: .25rem .75rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-size: .75rem;
            font-family: inherit;
            transition: all .15s;
        }
        .ftab.active { background: var(--blue); border-color: var(--blue); color: white; }
        .search-inp {
            padding: .3rem .75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: .78rem;
            outline: none;
            width: 220px;
            transition: border-color .15s;
        }
        .search-inp:focus { border-color: var(--blue); }
        .auto-badge {
            margin-left: auto;
            font-size: .72rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: .4rem;
        }
        .auto-badge .timer { color: var(--green); font-weight: 700; }

        /* ---- Events list ---- */
        .events-list { display: flex; flex-direction: column; gap: .6rem; }

        .event-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color .15s;
        }
        .event-card:hover { border-color: #3e4a6e; }
        .event-card.new-flash { animation: flashIn .6s ease-out; }
        @keyframes flashIn {
            from { border-color: var(--green); box-shadow: 0 0 12px rgba(34,197,94,.3); }
            to   { border-color: var(--border); box-shadow: none; }
        }

        .event-header {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .65rem 1rem;
            cursor: pointer;
            user-select: none;
        }
        .event-header:hover { background: var(--surface2); }

        .event-index {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .72rem;
            color: var(--text-dim);
            flex-shrink: 0;
            font-weight: 700;
        }
        .event-title-block { flex: 1; min-width: 0; }
        .event-title { font-size: .88rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .event-sub   { font-size: .72rem; color: var(--text-dim); display:flex; gap:.75rem; flex-wrap:wrap; margin-top:.15rem; }

        .trigger-chip {
            padding: .15rem .55rem;
            border-radius: 4px;
            font-size: .7rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .trigger-meeting_end { background: rgba(34,197,94,.15); color: var(--green); }
        .trigger-manual      { background: rgba(168,85,247,.15); color: var(--purple); }
        .trigger-test        { background: rgba(234,179,8,.15);  color: var(--yellow); }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sd-pending   { background: var(--yellow); }
        .sd-linked    { background: var(--green); }
        .sd-dismissed { background: var(--muted); }

        .event-actions { display:flex; gap:.4rem; flex-shrink:0; }
        .icon-btn {
            width: 26px; height: 26px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface2);
            color: var(--text-dim);
            cursor: pointer;
            font-size: .75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
        }
        .icon-btn:hover { border-color: var(--red); color: var(--red); }
        .icon-btn.expand { rotate: 0deg; transition: rotate .2s, all .15s; }
        .icon-btn.expand.open { rotate: 180deg; }

        /* ---- Event detail panel ---- */
        .event-detail {
            display: none;
            border-top: 1px solid var(--border);
        }
        .event-detail.open { display: block; }

        .detail-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }
        .dtab {
            padding: .45rem .9rem;
            cursor: pointer;
            font-size: .75rem;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
            transition: all .15s;
        }
        .dtab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .dtab:hover  { color: var(--text); }

        .detail-pane { display: none; padding: 1rem; }
        .detail-pane.active { display: block; }

        /* ---- Pretty fields ---- */
        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap: .75rem;
        }
        .field-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: .6rem .9rem;
        }
        .field-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: .25rem; }
        .field-value { font-size: .83rem; color: var(--text); word-break: break-all; }
        .field-value.long { max-height: 120px; overflow-y: auto; white-space: pre-wrap; }

        .pill-list { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.25rem; }
        .pill {
            padding: .18rem .6rem;
            border-radius: 20px;
            font-size: .72rem;
            background: rgba(59,130,246,.15);
            color: var(--blue);
            border: 1px solid rgba(59,130,246,.2);
        }

        .action-row { display:flex; flex-direction:column; gap:.3rem; }
        .ai-item { display:flex; gap:.5rem; align-items:flex-start; font-size:.82rem; color:var(--text); }
        .ai-item::before { content:'→'; color:var(--green); flex-shrink:0; }

        /* ---- JSON pane ---- */
        .json-wrap {
            background: #0d1117;
            border-radius: 6px;
            overflow: auto;
            max-height: 500px;
            position: relative;
        }
        .copy-json-btn {
            position: absolute;
            top: .5rem;
            right: .5rem;
            padding: .2rem .6rem;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 4px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: .7rem;
            font-family: inherit;
        }
        .copy-json-btn:hover { background: rgba(255,255,255,.15); }
        pre.json-code {
            padding: 1rem;
            font-size: .78rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
            color: #c9d1d9;
        }
        /* Syntax highlight colours */
        .j-key    { color: #79c0ff; }
        .j-str    { color: #a5d6ff; }
        .j-num    { color: #f78166; }
        .j-bool   { color: #ff9f1c; }
        .j-null   { color: #8b949e; }

        /* ---- Transcript ---- */
        .transcript-scroll { max-height: 400px; overflow-y: auto; }
        .tb-block { margin-bottom: .75rem; padding-bottom: .75rem; border-bottom: 1px solid var(--border); }
        .tb-block:last-child { border-bottom: none; }
        .tb-speaker { font-size: .7rem; color: var(--purple); font-weight: 700; margin-bottom: .15rem; }
        .tb-words   { color: var(--text); font-size: .82rem; }

        /* ---- Empty state ---- */
        .empty {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-dim);
        }
        .empty i { font-size: 2.5rem; margin-bottom: .75rem; display: block; opacity: .4; }
        .empty h3 { font-size: 1rem; color: var(--text); margin-bottom: .4rem; }
        .empty p  { font-size: .82rem; line-height: 1.7; }
        .empty code {
            background: var(--surface2);
            padding: .1rem .4rem;
            border-radius: 4px;
            color: var(--blue);
            font-size: .82rem;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: .75rem 1.25rem;
            font-size: .82rem;
            box-shadow: 0 8px 24px rgba(0,0,0,.4);
            z-index: 999;
            display: none;
            max-width: 320px;
        }
        .toast.visible { display: block; animation: slideUp .25s ease-out; }
        .toast.ok   { border-left: 3px solid var(--green); }
        .toast.err  { border-left: 3px solid var(--red);   }
        .toast.info { border-left: 3px solid var(--blue);  }
        @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }
    </style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
    <div class="topbar-title">
        <div class="dot" id="statusDot"></div>
        <i class="fas fa-microphone-alt" style="color:#a855f7"></i>
        Read.ai Webhook Tester
    </div>
    <div class="topbar-meta" id="metaRow">
        <div class="meta-chip"><span>Connecting…</span></div>
    </div>
    <div class="topbar-actions">
        <button class="btn btn-green" onclick="loadEvents()"><i class="fas fa-sync-alt"></i> Refresh</button>
        <button class="btn btn-purple" onclick="sendSimTest()"><i class="fas fa-flask"></i> Simulate Event</button>
        <button class="btn btn-red" onclick="clearAll()"><i class="fas fa-trash"></i> Clear All</button>
        <a href="readai_meetings.html" class="btn"><i class="fas fa-link"></i> Reconcile Page</a>
        <a href="mainpage.html" class="btn"><i class="fas fa-home"></i> CRM</a>
    </div>
</div>

<!-- ===== URL BANNER ===== -->
<div class="url-banner">
    <span class="url-label">WEBHOOK URL</span>
    <span class="url-value" id="webhookUrl">https://railwayclemail-production.up.railway.app/readai/webhook</span>
    <button class="copy-btn" id="copyUrlBtn" onclick="copyUrl()"><i class="fas fa-copy"></i> Copy</button>
</div>

<!-- ===== KEY STATUS ===== -->
<div class="key-banner" id="keyBanner" style="display:none"></div>

<!-- ===== MAIN ===== -->
<div class="main">
    <div class="filter-row">
        <div class="filter-tabs">
            <button class="ftab active" data-f="all"       onclick="setFilter('all')">All</button>
            <button class="ftab"        data-f="pending"   onclick="setFilter('pending')">Pending</button>
            <button class="ftab"        data-f="linked"    onclick="setFilter('linked')">Linked</button>
            <button class="ftab"        data-f="dismissed" onclick="setFilter('dismissed')">Dismissed</button>
        </div>
        <input class="search-inp" type="text" id="searchIn" placeholder="Search title / participant…" oninput="renderEvents()">
        <div class="auto-badge">
            <i class="fas fa-circle" style="font-size:.5rem;color:var(--green)"></i>
            Auto-refresh in <span class="timer" id="countdown">10</span>s
        </div>
    </div>

    <div class="events-list" id="eventsList">
        <div class="empty">
            <i class="fas fa-circle-notch fa-spin"></i>
            <h3>Connecting…</h3>
        </div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
const BACKEND = 'https://railwayclemail-production.up.railway.app';
const WEBHOOK_URL = `${BACKEND}/readai/webhook`;

let allEvents   = [];
let activeFilter = 'all';
let countdown   = 10;
let timerHandle = null;
let openCards   = new Set();  // track which cards are expanded
let openTabs    = {};         // card id -> active tab name

// ----------------------------------------------------------------
// Init
// ----------------------------------------------------------------
async function init() {
    await checkStatus();
    await loadEvents();
    startAutoRefresh();
}

// ----------------------------------------------------------------
// Status check
// ----------------------------------------------------------------
async function checkStatus() {
    const dot = document.getElementById('statusDot');
    dot.className = 'dot yellow';
    try {
        const r = await fetch(`${BACKEND}/readai/status`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();

        dot.className = 'dot green';

        // Meta chips
        document.getElementById('metaRow').innerHTML = `
            <div class="meta-chip"><i class="fas fa-database" style="color:var(--blue)"></i> Total: <span class="val">${d.counts.total}</span></div>
            <div class="meta-chip"><i class="fas fa-clock" style="color:var(--yellow)"></i> Pending: <span class="val">${d.counts.pending}</span></div>
            <div class="meta-chip"><i class="fas fa-check-circle" style="color:var(--green)"></i> Linked: <span class="val">${d.counts.linked}</span></div>
        `;

        // Key banner
        const kb = document.getElementById('keyBanner');
        kb.style.display = 'flex';
        if (d.signingKeyConfigured) {
            kb.className = 'key-banner key-ok';
            kb.innerHTML = `<i class="fas fa-lock" style="color:var(--green)"></i> <span class="key-badge badge-ok">SIGNING KEY SET</span> <span style="color:var(--text-dim)">READ_AI_SIGNING_KEY is configured — all incoming webhooks will be signature-verified.</span>`;
        } else {
            kb.className = 'key-banner key-warn';
            kb.innerHTML = `<i class="fas fa-unlock" style="color:var(--yellow)"></i> <span class="key-badge badge-warn">NO SIGNING KEY</span> <span style="color:var(--text-dim)">READ_AI_SIGNING_KEY is not set in Railway env — add it to enable signature verification.</span>`;
        }
    } catch (e) {
        dot.className = 'dot red';
        document.getElementById('metaRow').innerHTML = `<div class="meta-chip" style="color:var(--red)"><i class="fas fa-exclamation-triangle"></i> Cannot reach Railway server — ${e.message}</div>`;
    }
}

// ----------------------------------------------------------------
// Load events
// ----------------------------------------------------------------
async function loadEvents() {
    try {
        const r = await fetch(`${BACKEND}/readai/meetings?limit=100`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        const prev = new Set(allEvents.map(e => e.id));
        allEvents = d.meetings || [];
        // Flash new ones
        allEvents.forEach(e => { if (!prev.has(e.id)) e._new = true; });
        renderEvents();
        await checkStatus();
    } catch (e) {
        toast('Error loading events: ' + e.message, 'err');
    }
}

// ----------------------------------------------------------------
// Render
// ----------------------------------------------------------------
function renderEvents() {
    const search = document.getElementById('searchIn').value.toLowerCase();
    let list = allEvents;
    if (activeFilter !== 'all') list = list.filter(e => e.status === activeFilter);
    if (search) list = list.filter(e =>
        (e.title||'').toLowerCase().includes(search) ||
        (e.participants||[]).some(p =>
            (p.name||'').toLowerCase().includes(search) ||
            (p.email||'').toLowerCase().includes(search))
    );

    const el = document.getElementById('eventsList');
    if (list.length === 0) {
        el.innerHTML = `
            <div class="empty">
                <i class="fas fa-inbox"></i>
                <h3>No events yet</h3>
                <p>Give Read.ai this URL:<br><code>${WEBHOOK_URL}</code><br><br>
                Or click <strong>Simulate Event</strong> to fire a test payload right now.</p>
            </div>`;
        return;
    }

    el.innerHTML = list.map((e, i) => buildCard(e, list.length - i)).join('');

    // Restore open state
    openCards.forEach(id => {
        const body = document.getElementById(`detail-${id}`);
        const btn  = document.getElementById(`expandBtn-${id}`);
        if (body) { body.classList.add('open'); }
        if (btn)  { btn.classList.add('open'); }
        // Restore active tab
        const tab = openTabs[id] || 'summary';
        switchTab(id, tab, false); // silent switch
    });
}

function buildCard(e, num) {
    const dateStr = e.start_time
        ? new Date(e.start_time).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' })
        : '—';
    const received = e.receivedAt ? relTime(e.receivedAt) : '—';
    const parts     = (e.participants||[]).map(p => p.name || p.email || '?').join(', ') || 'No participants';
    const trigger   = e.trigger || 'unknown';
    const trigClass = `trigger-${trigger}`;
    const statusDotClass = e.status === 'linked' ? 'sd-linked' : e.status === 'dismissed' ? 'sd-dismissed' : 'sd-pending';
    const flashClass = e._new ? 'new-flash' : '';

    return `
    <div class="event-card ${flashClass}" id="ecard-${e.id}">
        <div class="event-header" onclick="toggleCard('${e.id}')">
            <div class="event-index">${num}</div>
            <div class="status-dot ${statusDotClass}" title="${e.status||'pending'}"></div>
            <div class="event-title-block">
                <div class="event-title">${esc(e.title || 'Untitled Meeting')}</div>
                <div class="event-sub">
                    <span><i class="fas fa-calendar-alt"></i> ${dateStr}</span>
                    <span><i class="fas fa-users"></i> ${esc(parts.length > 60 ? parts.slice(0,60)+'…' : parts)}</span>
                    <span><i class="fas fa-inbox"></i> ${received}</span>
                    ${e.platform ? `<span><i class="fas fa-video"></i> ${esc(e.platform)}</span>` : ''}
                </div>
            </div>
            <span class="trigger-chip ${trigClass}">${trigger}</span>
            <div class="event-actions" onclick="event.stopPropagation()">
                <button class="icon-btn" onclick="deleteEvent('${e.id}')" title="Delete"><i class="fas fa-trash-alt"></i></button>
                <button class="icon-btn expand" id="expandBtn-${e.id}" onclick="toggleCard('${e.id}')"><i class="fas fa-chevron-down"></i></button>
            </div>
        </div>

        <div class="event-detail" id="detail-${e.id}">
            <div class="detail-tabs">
                <div class="dtab active" id="tab-${e.id}-summary"   onclick="switchTab('${e.id}','summary')">Summary</div>
                <div class="dtab"        id="tab-${e.id}-action"    onclick="switchTab('${e.id}','action')">Action Items (${(e.action_items||[]).length})</div>
                <div class="dtab"        id="tab-${e.id}-transcript" onclick="switchTab('${e.id}','transcript')">Transcript (${(e.transcript?.speaker_blocks||[]).length} blocks)</div>
                <div class="dtab"        id="tab-${e.id}-raw"       onclick="switchTab('${e.id}','raw')">Raw JSON</div>
            </div>

            <!-- Summary pane -->
            <div class="detail-pane active" id="pane-${e.id}-summary">
                <div class="field-grid">
                    <div class="field-box">
                        <div class="field-label">Session ID</div>
                        <div class="field-value">${esc(e.session_id||'—')}</div>
                    </div>
                    <div class="field-box">
                        <div class="field-label">Request ID</div>
                        <div class="field-value">${esc(e.request_id||'—')}</div>
                    </div>
                    <div class="field-box">
                        <div class="field-label">Trigger</div>
                        <div class="field-value">${esc(trigger)}</div>
                    </div>
                    <div class="field-box">
                        <div class="field-label">Platform</div>
                        <div class="field-value">${esc(e.platform||'—')}</div>
                    </div>
                    <div class="field-box">
                        <div class="field-label">Start Time</div>
                        <div class="field-value">${e.start_time ? new Date(e.start_time).toLocaleString() : '—'}</div>
                    </div>
                    <div class="field-box">
                        <div class="field-label">End Time</div>
                        <div class="field-value">${e.end_time ? new Date(e.end_time).toLocaleString() : '—'}</div>
                    </div>
                    <div class="field-box" style="grid-column:1/-1">
                        <div class="field-label">Summary</div>
                        <div class="field-value long">${esc(e.summary||'No summary')}</div>
                    </div>
                    <div class="field-box" style="grid-column:1/-1">
                        <div class="field-label">Participants (${(e.participants||[]).length})</div>
                        <div class="pill-list">
                            ${(e.participants||[]).map(p =>
                                `<span class="pill" title="${esc(p.email||'')}">${esc(p.name||p.email||'?')}</span>`
                            ).join('') || '<span style="color:var(--text-dim);font-size:.78rem">None</span>'}
                        </div>
                    </div>
                    ${e.topics && e.topics.length ? `
                    <div class="field-box" style="grid-column:1/-1">
                        <div class="field-label">Topics</div>
                        <div class="pill-list">${e.topics.map(t => `<span class="pill" style="background:rgba(168,85,247,.15);color:var(--purple);border-color:rgba(168,85,247,.2)">${esc(t.text||'')}</span>`).join('')}</div>
                    </div>` : ''}
                    ${e.key_questions && e.key_questions.length ? `
                    <div class="field-box" style="grid-column:1/-1">
                        <div class="field-label">Key Questions</div>
                        <div class="action-row">${e.key_questions.map(q => `<div class="ai-item">${esc(q.text||'')}</div>`).join('')}</div>
                    </div>` : ''}
                    ${e.report_url ? `
                    <div class="field-box">
                        <div class="field-label">Report URL</div>
                        <div class="field-value"><a href="${esc(e.report_url)}" target="_blank" style="color:var(--blue)">${esc(e.report_url)}</a></div>
                    </div>` : ''}
                    <div class="field-box">
                        <div class="field-label">CRM Status</div>
                        <div class="field-value">${esc(e.status||'pending')}${e.linkedContactName ? ` → ${esc(e.linkedContactName)}` : ''}</div>
                    </div>
                </div>
            </div>

            <!-- Action items pane -->
            <div class="detail-pane" id="pane-${e.id}-action">
                ${(e.action_items||[]).length
                    ? `<div class="action-row">${(e.action_items||[]).map(a => `<div class="ai-item">${esc(a.text||'')}</div>`).join('')}</div>`
                    : `<div style="color:var(--text-dim);padding:.5rem 0">No action items captured for this meeting.</div>`
                }
                ${e.chapter_summaries && e.chapter_summaries.length ? `
                <div style="margin-top:1.25rem">
                    <div class="field-label" style="margin-bottom:.5rem">Chapter Summaries</div>
                    ${e.chapter_summaries.map(c => `
                        <div style="margin-bottom:.75rem;padding:.75rem;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
                            <div style="font-weight:700;color:var(--purple);margin-bottom:.3rem">${esc(c.title||'')}</div>
                            <div style="font-size:.82rem;color:var(--text)">${esc(c.description||'')}</div>
                        </div>
                    `).join('')}
                </div>` : ''}
            </div>

            <!-- Transcript pane -->
            <div class="detail-pane" id="pane-${e.id}-transcript">
                ${e.transcript && (e.transcript.speaker_blocks||[]).length
                    ? `<div class="transcript-scroll">
                        ${(e.transcript.speaker_blocks||[]).map(b => `
                            <div class="tb-block">
                                <div class="tb-speaker">${esc(b.speaker?.name||'?')}</div>
                                <div class="tb-words">${esc(b.words||'')}</div>
                            </div>
                        `).join('')}
                       </div>`
                    : `<div style="color:var(--text-dim);padding:.5rem 0">No transcript data in this payload.</div>`
                }
            </div>

            <!-- Raw JSON pane -->
            <div class="detail-pane" id="pane-${e.id}-raw">
                <div class="json-wrap">
                    <button class="copy-json-btn" onclick="copyJson('${e.id}')"><i class="fas fa-copy"></i> Copy</button>
                    <pre class="json-code" id="json-${e.id}">${syntaxHighlight(e)}</pre>
                </div>
            </div>
        </div>
    </div>`;
}

// ----------------------------------------------------------------
// Card interactions
// ----------------------------------------------------------------
window.toggleCard = function(id) {
    const body = document.getElementById('detail-' + id);
    const btn  = document.getElementById('expandBtn-' + id);
    if (!body) return;
    const isOpen = body.classList.toggle('open');
    btn && btn.classList.toggle('open', isOpen);
    if (isOpen) {
        openCards.add(id);
        if (!openTabs[id]) openTabs[id] = 'summary';
    } else {
        openCards.delete(id);
    }
};

window.switchTab = function(id, tabName, save = true) {
    ['summary','action','transcript','raw'].forEach(t => {
        const tab  = document.getElementById(`tab-${id}-${t}`);
        const pane = document.getElementById(`pane-${id}-${t}`);
        if (tab)  tab.classList.toggle('active', t === tabName);
        if (pane) pane.classList.toggle('active', t === tabName);
    });
    if (save) openTabs[id] = tabName;
};

window.copyJson = function(id) {
    const event = allEvents.find(e => e.id === id);
    if (!event) return;
    const { _new, ...clean } = event;
    navigator.clipboard.writeText(JSON.stringify(clean, null, 2))
        .then(() => toast('JSON copied to clipboard', 'ok'))
        .catch(() => toast('Copy failed', 'err'));
};

// ----------------------------------------------------------------
// Delete
// ----------------------------------------------------------------
window.deleteEvent = async function(id) {
    if (!confirm('Delete this event? This cannot be undone.')) return;
    try {
        const r = await fetch(`${BACKEND}/readai/meetings/${id}`, { method: 'DELETE' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        allEvents = allEvents.filter(e => e.id !== id);
        openCards.delete(id);
        delete openTabs[id];
        renderEvents();
        await checkStatus();
        toast('Event deleted', 'ok');
    } catch (e) {
        toast('Delete failed: ' + e.message, 'err');
    }
};

window.clearAll = async function() {
    const count = allEvents.length;
    if (!count) return toast('Nothing to clear', 'info');
    if (!confirm(`Delete all ${count} stored events? This cannot be undone.`)) return;
    try {
        await Promise.all(allEvents.map(e =>
            fetch(`${BACKEND}/readai/meetings/${e.id}`, { method: 'DELETE' })
        ));
        allEvents = [];
        openCards.clear();
        openTabs = {};
        renderEvents();
        await checkStatus();
        toast(`Cleared ${count} events`, 'ok');
    } catch (e) {
        toast('Error clearing: ' + e.message, 'err');
    }
};

// ----------------------------------------------------------------
// Simulate a test event (POST directly to the webhook endpoint)
// Note: this bypasses signature check because READ_AI_SIGNING_KEY
// won't match — so the server needs to either have no key or you use
// the "Send test request" button in Read.ai dashboard instead.
// We POST to a /readai/meetings/simulate endpoint (no sig required).
// Fallback: POST to webhook if sig check isn't enforced yet.
// ----------------------------------------------------------------
window.sendSimTest = async function() {
    const now = new Date();
    const end = new Date(now.getTime() + 45 * 60000);
    const simPayload = {
        session_id:          'SIM-' + Math.random().toString(36).slice(2,10).toUpperCase(),
        trigger:             'manual',
        title:               'Test Meeting — ' + now.toLocaleTimeString(),
        start_time:          now.toISOString(),
        end_time:            end.toISOString(),
        platform:            'zoom',
        platform_meeting_id: 'test-' + Date.now(),
        request_id:          'SIM_REQ_' + Date.now(),
        participants: [
            { name: 'Taylor Davis', first_name: 'Taylor', last_name: 'Davis', email: 'taylor@healthluminate.com' },
            { name: 'Test Prospect', first_name: 'Test', last_name: 'Prospect', email: 'prospect@example.com' }
        ],
        owner: { name: 'Taylor Davis', first_name: 'Taylor', last_name: 'Davis', email: 'taylor@healthluminate.com' },
        summary: 'This is a simulated test meeting payload from the Read.ai webhook tester page. Use this to verify the pipeline is working end-to-end before your first real meeting.',
        action_items: [
            { text: 'Follow up with Test Prospect by Friday' },
            { text: 'Send over the demo recording link' }
        ],
        key_questions: [
            { text: 'What is the timeline for implementation?' }
        ],
        topics: [
            { text: 'Product Demo' },
            { text: 'Pricing' },
            { text: 'Next Steps' }
        ],
        report_url: 'https://app.read.ai/analytics/meetings/SIM-TEST',
        chapter_summaries: [
            { title: 'Intro & Context', description: 'Brief overview of health IT landscape and current challenges.', topics: [{ text: 'Product Demo' }] },
            { title: 'Next Steps', description: 'Agreed to follow up with proposal by end of week.', topics: [{ text: 'Next Steps' }] }
        ],
        transcript: {
            speakers: [{ name: 'Taylor Davis' }, { name: 'Test Prospect' }],
            speaker_blocks: [
                { start_time: String(now.getTime()), end_time: String(now.getTime()+5000), speaker: { name: 'Taylor Davis' }, words: 'Thanks for joining today! Let me walk you through what we\'ve been building.' },
                { start_time: String(now.getTime()+6000), end_time: String(now.getTime()+12000), speaker: { name: 'Test Prospect' }, words: 'Happy to be here. We\'ve been looking for a solution like this for a while.' }
            ]
        }
    };

    // Try the simulate endpoint first (no signature needed); fall back to raw webhook
    try {
        const r = await fetch(`${BACKEND}/readai/meetings/simulate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(simPayload)
        });
        if (r.ok) {
            toast('Simulated event sent! Refreshing…', 'ok');
            setTimeout(loadEvents, 800);
            return;
        }
    } catch (_) {}

    // Fallback: post directly to webhook (works when signing key not yet set)
    try {
        const r = await fetch(`${BACKEND}/readai/webhook`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(simPayload)
        });
        const d = await r.json();
        if (r.ok) {
            toast('Simulated event stored! Refreshing…', 'ok');
            setTimeout(loadEvents, 800);
        } else {
            toast(`Server rejected simulate: ${d.error || r.status}`, 'err');
        }
    } catch (e) {
        toast('Simulate failed: ' + e.message, 'err');
    }
};

// ----------------------------------------------------------------
// Filter
// ----------------------------------------------------------------
window.setFilter = function(f) {
    activeFilter = f;
    document.querySelectorAll('.ftab').forEach(t => t.classList.toggle('active', t.dataset.f === f));
    renderEvents();
};

// ----------------------------------------------------------------
// Auto-refresh
// ----------------------------------------------------------------
function startAutoRefresh() {
    countdown = 10;
    document.getElementById('countdown').textContent = countdown;
    timerHandle = setInterval(async () => {
        countdown--;
        document.getElementById('countdown').textContent = Math.max(0, countdown);
        if (countdown <= 0) {
            countdown = 10;
            await loadEvents();
        }
    }, 1000);
}

// ----------------------------------------------------------------
// URL copy
// ----------------------------------------------------------------
window.copyUrl = function() {
    navigator.clipboard.writeText(WEBHOOK_URL).then(() => {
        const btn = document.getElementById('copyUrlBtn');
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
            btn.classList.remove('copied');
        }, 2500);
    });
};

// ----------------------------------------------------------------
// Helpers
// ----------------------------------------------------------------
function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relTime(iso) {
    const d = Date.now() - new Date(iso).getTime();
    const m = Math.floor(d / 60000);
    if (m < 1)   return 'just now';
    if (m < 60)  return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24)  return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
}

function toast(msg, type='info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast visible ${type}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('visible'), 3500);
}

function syntaxHighlight(obj) {
    const { _new, ...clean } = obj;
    const json = JSON.stringify(clean, null, 2);
    return json.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        function(match) {
            if (/^"/.test(match)) {
                if (/:$/.test(match)) return `<span class="j-key">${esc(match)}</span>`;
                return `<span class="j-str">${esc(match)}</span>`;
            }
            if (/true|false/.test(match)) return `<span class="j-bool">${match}</span>`;
            if (/null/.test(match))       return `<span class="j-null">${match}</span>`;
            return `<span class="j-num">${match}</span>`;
        }
    );
}

// ----------------------------------------------------------------
// Boot
// ----------------------------------------------------------------
init();
</script>
