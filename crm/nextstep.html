<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting - HealthLuminate CRM</title>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    
    .redirect-box {
      text-align: center;
      background: white;
      padding: 48px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    
    .redirect-box i {
      font-size: 4rem;
      color: #264653;
      margin-bottom: 24px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .redirect-box h1 {
      font-size: 1.75rem;
      color: #264653;
      margin-bottom: 16px;
    }
    
    .redirect-box p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 24px;
    }
    
    .redirect-box a {
      display: inline-block;
      padding: 12px 24px;
      background: #2a9d8f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .redirect-box a:hover {
      background: #238276;
      transform: translateY(-2px);
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  
  <div class="redirect-box">
    <i class="fas fa-sync-alt"></i>
    <h1>This page has moved!</h1>
    <p>The Next Steps page has been upgraded to a new Task Management system with better features and organization.</p>
    <p>Redirecting you now...</p>
    <a href="tasks-list.html">Go to Tasks →</a>
  </div>
  
  <script>
    // Auto-redirect after 2 seconds
    setTimeout(() => {
      window.location.href = 'tasks-list.html';
    }, 2000);
  </script>
  
</body>
</html>
