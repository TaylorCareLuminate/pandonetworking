        :root {
            --primary: #264653;
            --secondary: #2a9d8f;
            --accent: #e9c46a;

            --success: #52b788;
            --warning: #f4a261;
            --light-blue: #f4f9fa;
            --light-green: #f4faef;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-radius: 12px;
            --gray: #5B5B5B;
        }
        
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: #263238; 
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #fff; 
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            margin-bottom: 30px;
        }
        
        .container { 
            max-width: 1600px; 
            margin: 0 auto; 
            padding: 0 20px;
        }
        
        .hero-section {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .hero-subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--card-shadow);
            text-align: center;
            border-left: 4px solid var(--secondary);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--secondary);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters-section {
            background: white;
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        .filters-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .btn-filter {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-filter:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .category-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
            overflow: hidden;
        }

        .category-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .category-header:hover {
            opacity: 0.95;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .category-stats {

        .category-stat {

            border-radius: 6px;
        }

        .pages-table {

        table {

            border-collapse: collapse;
        }

        thead {

        }

        th {

        .page-link {

            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

            transform: scale(1.1);
        }

            display: none;

            </div>
            <div class="stat-card">

                <div class="stat-value" id="totalVisits">-</div>
                <div class="stat-label">Total Visits</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-value" id="activeUsers">-</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-ban"></i></div>
                <div class="stat-value" id="unusedPages">-</div>
                <div class="stat-label">Unused Pages</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <div class="filters-title"><i class="fas fa-filter"></i> Filters</div>
            <div class="filters-grid">
                <div class="filter-group">
                    <label>Time Period</label>
                    <select id="timePeriodFilter">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week" selected>This Week</option>
                        <option value="month">This Month</option>
                        <option value="90days">Last 90 Days</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Usage Level</label>
                    <select id="usageFilter">
                        <option value="all">All Pages</option>
                        <option value="unused">Unused Only</option>
                        <option value="low">Low Usage</option>
                        <option value="medium">Medium Usage</option>
                        <option value="high">High Usage</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Category</label>
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="btn-filter" onclick="applyFilters()">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Export -->
        <div class="export-section">
            <button class="btn-export" onclick="exportToCSV()">
                <i class="fas fa-download"></i> Export to CSV
            </button>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <div><i class="fas fa-spinner"></i></div>
            <div>Loading usage data...</div>
        </div>

        <!-- Data Container -->
        <div id="dataContainer" style="display: none;">
            <!-- Category sections will be inserted here -->
        </div>
    </div>

        let usageData = {};
        let currentUser = null;

        // Auth state observer
        auth.onAuthStateChanged((user) => {
            if (user) {

                loadUsageData();
            } else {

            }
        });

        // Load usage data from Firestore
        async function loadUsageData() {
            try {
                const snapshot = await db.collection('pageUsageTracking').get();
                usageData = {};

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const pagePath = data.pagePath;
                    
                    if (!usageData[pagePath]) {
                        usageData[pagePath] = {
                            visits: [],
                            users: new Set()
                        };
                    }
                    
                    usageData[pagePath].visits.push({
                        timestamp: data.timestamp?.toDate() || new Date(data.timestamp),
                        userEmail: data.userEmail,
                        userId: data.userId
                    });
                    usageData[pagePath].users.add(data.userEmail);
                });

                renderData();
            } catch (error) {
                console.error('Error loading usage data:', error);
                document.getElementById('loadingState').innerHTML = `
                    <div class="no-data">
                        <div><i class="fas fa-exclamation-triangle"></i></div>
                        <div>Error loading data: ${error.message}</div>
                    </div>
                `;
            }
        }

        // Calculate statistics for a page
        function calculatePageStats(pagePath, timeFilter) {
            const pageData = usageData[pagePath];
            if (!pageData || !pageData.visits || pageData.visits.length === 0) {
                return {
                    totalVisits: 0,
                    todayVisits: 0,
                    weekVisits: 0,
                    monthVisits: 0,
                    lastVisit: null,
                    users: []
                };
            }

            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            const visits = pageData.visits;
            let filteredVisits = visits;

            // Apply time filter
            if (timeFilter === 'today') {
                filteredVisits = visits.filter(v => v.timestamp >= todayStart);
            } else if (timeFilter === 'week') {
                filteredVisits = visits.filter(v => v.timestamp >= weekStart);
            } else if (timeFilter === 'month') {
                filteredVisits = visits.filter(v => v.timestamp >= monthStart);
            } else if (timeFilter === '90days') {
                const ninetyDaysAgo = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
                filteredVisits = visits.filter(v => v.timestamp >= ninetyDaysAgo);
            }

            const sortedVisits = [...visits].sort((a, b) => b.timestamp - a.timestamp);
            const lastVisit = sortedVisits[0]?.timestamp;

            return {
                totalVisits: filteredVisits.length,
                todayVisits: visits.filter(v => v.timestamp >= todayStart).length,
                weekVisits: visits.filter(v => v.timestamp >= weekStart).length,
                monthVisits: visits.filter(v => v.timestamp >= monthStart).length,
                lastVisit: lastVisit,
                users: Array.from(pageData.users)
            };
        }

        // Get usage level classification
        function getUsageLevel(stats, timeFilter) {
            if (stats.totalVisits === 0) return 'none';
            
            let threshold = stats.totalVisits;
            if (timeFilter === 'week') threshold = stats.weekVisits;
            else if (timeFilter === 'month') threshold = stats.monthVisits;
            
            if (threshold === 0) return 'none';
            if (threshold >= 20) return 'high';
            if (threshold >= 5) return 'medium';
            return 'low';
        }

        // Format date
        function formatDate(date) {
            if (!date) return 'Never';
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return '<span class="recent-date">Today</span>';
            if (days === 1) return '<span class="recent-date">Yesterday</span>';
            if (days < 7) return `<span class="recent-date">${days} days ago</span>`;
            if (days < 30) return `${Math.floor(days / 7)} weeks ago`;
            if (days > 90) return `<span class="old-date">${Math.floor(days / 30)} months ago</span>`;
            return `${Math.floor(days / 30)} months ago`;
        }

            let totalVisits = 0;

            const activeUsersSet = new Set();

            const dataContainer = document.getElementById('dataContainer');
            dataContainer.innerHTML = '';

            // Populate category filter if empty
            const categoryFilterSelect = document.getElementById('categoryFilter');
            if (categoryFilterSelect.options.length === 1) {
                Object.keys(crmPages).forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    categoryFilterSelect.appendChild(option);
                });
            }

            Object.entries(crmPages).forEach(([category, pages]) => {
                if (categoryFilter !== 'all' && categoryFilter !== category) return;

                let categoryVisits = 0;
                let categoryPages = 0;
                const categoryHTML = [];

                pages.forEach(page => {
                    totalPages++;
                    categoryPages++;
                    
                    const stats = calculatePageStats(page.path, timeFilter);
                    const usageLevel = getUsageLevel(stats, timeFilter);
                    
                    totalVisits += stats.totalVisits;
                    if (stats.totalVisits === 0) unusedPages++;
                    stats.users.forEach(user => activeUsersSet.add(user));
                    categoryVisits += stats.totalVisits;

                    // Apply usage filter
                    if (usageFilter !== 'all' && usageFilter !== usageLevel) return;

                    categoryHTML.push(`
                        <tr>
                            <td>
                                <div class="page-name">
                                    <i class="fas fa-file-alt"></i>
                                    <a href="${page.path}" class="page-link" target="_blank">${page.name}</a>
                                </div>
                            </td>
                            <td>
                                <span class="usage-badge usage-${usageLevel}">
                                    ${usageLevel.charAt(0).toUpperCase() + usageLevel.slice(1)}
                                </span>
                            </td>
                            <td>${stats.totalVisits}</td>
                            <td>${stats.todayVisits}</td>
                            <td>${stats.weekVisits}</td>
                            <td>${stats.monthVisits}</td>
                            <td class="date-text">${formatDate(stats.lastVisit)}</td>
                            <td>
                                <div class="user-list">
                                    ${stats.users.length > 0 ? 
                                        stats.users.map(u => `<span class="user-badge">${u.split('@')[0]}</span>`).join('') :
                                        '<span style="color: #9ca3af;">None</span>'
                                    }
                                </div>
                            </td>
                        </tr>
                    `);
                });

                if (categoryHTML.length > 0) {
                    const sectionHTML = `
                        <div class="category-section">
                            <div class="category-header" onclick="toggleCategory(this)">
                                <div class="category-title">
                                    <i class="fas fa-folder-open"></i>
                                    <span>${category}</span>
                                </div>
                                <div class="category-stats">
                                    <div class="category-stat">${categoryPages} pages</div>
                                    <div class="category-stat">${categoryVisits} visits</div>
                                    <button class="collapse-toggle"><i class="fas fa-chevron-up"></i></button>
                                </div>
                            </div>
                            <div class="pages-table">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Page Name</th>
                                            <th>Usage Level</th>
                                            <th>Total</th>
                                            <th>Today</th>
                                            <th>This Week</th>
                                            <th>This Month</th>
                                            <th>Last Visit</th>
                                            <th>Users</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${categoryHTML.join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    dataContainer.innerHTML += sectionHTML;
                }
            });

            // Update summary stats
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('totalVisits').textContent = totalVisits.toLocaleString();
            document.getElementById('activeUsers').textContent = activeUsersSet.size;
            document.getElementById('unusedPages').textContent = unusedPages;

            // Hide loading, show data
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('dataContainer').style.display = 'block';
        }

        // Toggle category collapse
        function toggleCategory(header) {
            const section = header.closest('.category-section');
            const table = section.querySelector('.pages-table');
            const icon = section.querySelector('.collapse-toggle i');
            
            table.classList.toggle('collapsed');
            icon.classList.toggle('fa-chevron-up');
            icon.classList.toggle('fa-chevron-down');
        }

        // Apply filters
        function applyFilters() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('dataContainer').style.display = 'none';
            setTimeout(() => renderData(), 300);
        }

        // Export to CSV
        function exportToCSV() {
            const timeFilter = document.getElementById('timePeriodFilter').value;
            let csvContent = 'Category,Page Name,Usage Level,Total Visits,Today,This Week,This Month,Last Visit,Users\n';

            Object.entries(crmPages).forEach(([category, pages]) => {
                pages.forEach(page => {
                    const stats = calculatePageStats(page.path, timeFilter);
                    const usageLevel = getUsageLevel(stats, timeFilter);
                    const lastVisit = stats.lastVisit ? stats.lastVisit.toISOString() : 'Never';
                    const users = stats.users.join('; ');

                    csvContent += `"${category}","${page.name}","${usageLevel}",${stats.totalVisits},${stats.todayVisits},${stats.weekVisits},${stats.monthVisits},"${lastVisit}","${users}"\n`;
                });
            });

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `crm-page-usage-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
    </script>
</body>
</html>
