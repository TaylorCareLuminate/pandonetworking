<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Emails - Mass Edit Queue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;

        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }

        .section h2 {
            color: #2d3748;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;

            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 101, 101, 0.3);
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;

        }

        .stat-item {
            background: white;

            border-radius: 12px;

        }

        .stat-number {
            font-size: 2rem;

            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;

        }

        .email-list {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
        }

        .email-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s ease;
        }

        .email-item:hover {
            background: #f8fafc;
        }

        .email-item:last-child {
            border-bottom: none;
        }

        .email-item.selected {
            background: #eef2ff;
            border-left: 4px solid #667eea;
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .email-info {
            flex: 1;
        }

        .email-subject {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .email-details {
            font-size: 0.9rem;
            color: #6b7280;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .email-actions {
            display: flex;
            gap: 10px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success {
            background: #48bb78;
        }

        .notification.error {
            background: #f56565;
        }

        .notification.warning {
            background: #ed8936;
        }

        .notification.info {
            background: #4299e1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .find-replace-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .preview-section {
            margin-top: 20px;
            padding: 20px;
            background: #fff7ed;
            border-radius: 12px;
            border: 1px solid #fed7aa;
        }

        .preview-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
        }

        .changes-summary {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
  <script src="../js/auth.js"></script>
  <script src="../js/clemail-firestore-wrapper.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-edit"></i> Fix Emails</h1>
            <p>Mass edit queued emails with find and replace</p>
        </div>

        <div class="main-content">
            <!-- Stats Section -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalEmails">-</div>
                    <div class="stat-label">Total Queued</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="selectedEmails">0</div>
                    <div class="stat-label">Selected</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="matchingEmails">-</div>
                    <div class="stat-label">Will Be Changed</div>
                </div>
            </div>

            <!-- Find & Replace Section -->
            <div class="section">
                <h2><i class="fas fa-search"></i> Find & Replace</h2>
                
                <div class="find-replace-form">
                    <div class="form-group">
                        <label for="findText">Find Text</label>
                        <textarea id="findText" class="form-control" placeholder="Enter text to find..." rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="replaceText">Replace With</label>
                        <textarea id="replaceText" class="form-control" placeholder="Enter replacement text..." rows="3"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="caseSensitive">
                        <label for="caseSensitive">Case Sensitive</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="subjectOnly">
                        <label for="subjectOnly">Subject Line Only (unchecked = search both subject and body)</label>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="previewChanges()">
                    <i class="fas fa-eye"></i> Preview Changes
                </button>
            </div>

            <!-- Filters Section -->
            <div class="section">
                <h2><i class="fas fa-filter"></i> Email Filters</h2>
                
                <div class="filter-bar">
                    <select id="statusFilter" onchange="filterEmails()">
                        <option value="">All Statuses</option>
                        <option value="scheduled">Scheduled Only</option>
                        <option value="sent">Sent Only</option>
                    </select>
                    
                    <input type="text" id="recipientFilter" placeholder="Filter by recipient..." onkeyup="filterEmails()">
                    
                    <input type="text" id="subjectFilter" placeholder="Filter by subject..." onkeyup="filterEmails()">
                    
                    <button class="btn btn-secondary" onclick="loadEmails()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Preview Section (hidden by default) -->
            <div id="previewSection" class="section" style="display: none;">
                <h2><i class="fas fa-eye"></i> Preview Changes</h2>
                <div id="changesPreview"></div>
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="applyChanges()">
                        <i class="fas fa-check"></i> Apply Changes
                    </button>
                    <button class="btn btn-secondary" onclick="hidePreview()">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </div>

            <!-- Email List Section -->
            <div class="section">
                <h2><i class="fas fa-envelope"></i> Queued Emails</h2>
                
                <div style="margin-bottom: 15px;">
                    <button class="btn btn-secondary" onclick="selectAll()">
                        <i class="fas fa-check-square"></i> Select All
                    </button>
                    <button class="btn btn-secondary" onclick="selectNone()">
                        <i class="fas fa-square"></i> Select None
                    </button>
                    <button class="btn btn-secondary" onclick="selectMatching()">
                        <i class="fas fa-search"></i> Select Matching
                    </button>
                </div>

                <div id="emailsList" class="email-list">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Loading queued emails...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Configuration -->
    <script type="module">
        // Wait for auth and CLEmail wrapper
        await window.firebaseReady;
        
        const { collection, getDocs, doc, setDoc, query, orderBy } = window.clemailFirestore;
        const db = window.clemailDb;
        
        window.firebaseDb = db;
        window.firebaseCollection = collection;
        window.firebaseGetDocs = getDocs;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseQuery = query;
        window.firebaseOrderBy = orderBy;
        
        console.log('🔒 CLEmail secure wrapper ready');
    </script>

    <script>
        // Global variables
        let allEmails = [];
        let filteredEmails = [];
        let selectedEmails = new Set();
        let previewData = null;

        // Normalize various timestamp formats
        function normalizeTimestamp(ts) {
            if (!ts) return null;
            try {
                if (typeof ts === 'string') {
                    const d = new Date(ts);
                    return isNaN(d.getTime()) ? null : d.toISOString();
                }
                if (typeof ts === 'number') {
                    const d = new Date(ts);
                    return isNaN(d.getTime()) ? null : d.toISOString();
                }
                if (ts instanceof Date) {
                    return isNaN(ts.getTime()) ? null : ts.toISOString();
                }
                if (ts && typeof ts === 'object' && ts.seconds) {
                    const d = new Date(ts.seconds * 1000 + (ts.nanoseconds || 0) / 1000000);
                    return isNaN(d.getTime()) ? null : d.toISOString();
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // Convert timestamp to Mountain Time
        function toMountainTime(timestamp) {
            if (!timestamp) return 'Invalid Date';
            try {
                const date = new Date(timestamp);
                if (isNaN(date.getTime())) return 'Invalid Date';
                return date.toLocaleString('en-US', {
                    timeZone: 'America/Denver',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                return 'Invalid Date';
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 5000);
        }

        // Load emails from Firestore and backend API
        async function loadEmails() {
            try {
                console.log('📥 Loading queued emails from CLEmail Firebase and Railway backend...');
                
                allEmails = [];
                
                // Try loading from Firestore first (same as email_queue.html)
                try {
                    console.log('🔥 Loading from CLEmail Firestore...');
                    const db = window.firebaseDb;
                    const collection = window.firebaseCollection;
                    const getDocs = window.firebaseGetDocs;
                    
                    // Try multiple possible Firestore collections
                    const collectionNames = ['emails', 'email_queue', 'scheduled_emails', 'queue'];
                    
                    for (const collectionName of collectionNames) {
                        try {
                            console.log(`🔍 Checking Firestore collection: ${collectionName}`);
                            const emailsCollection = collection(db, collectionName);
                            const emailsSnapshot = await getDocs(emailsCollection);
                            
                            if (!emailsSnapshot.empty) {
                                console.log(`✅ Found ${emailsSnapshot.size} documents in collection: ${collectionName}`);
                                
                                emailsSnapshot.forEach((doc) => {
                                    const email = doc.data();
                                    allEmails.push({
                                        id: doc.id,
                                        to: email.to || '',
                                        subject: email.subject || '',
                                        html: email.html || email.content || '',
                                        sendAt: normalizeTimestamp(email.sendAt || email.scheduledTime),
                                        sentAt: normalizeTimestamp(email.sentAt),
                                        status: email.status || 'scheduled',
                                        accountId: email.accountId || '',
                                        contactName: email.contactName || '',
                                        organizationName: email.organizationName || ''
                                    });
                                });
                                break; // Stop after finding the first collection with data
                            } else {
                                console.log(`⚠️ Collection ${collectionName} is empty`);
                            }
                        } catch (collectionError) {
                            console.warn(`⚠️ Error accessing collection ${collectionName}:`, collectionError);
                        }
                    }
                } catch (firestoreError) {
                    console.warn('⚠️ Firestore loading failed:', firestoreError);
                }
                
                // Load from backend API (primary source)
                try {
                    const endpoints = [
                        'https://railwayclemail-production.up.railway.app/emails/scheduled',
                        'https://railwayclemail-production.up.railway.app/emails/queue',
                        'https://railwayclemail-production.up.railway.app/queue',
                        'https://railwayclemail-production.up.railway.app/emails'
                    ];
                    
                    for (const endpoint of endpoints) {
                        try {
                            console.log(`📡 Trying backend endpoint: ${endpoint}`);
                            const response = await fetch(endpoint);
                            
                            if (response.ok) {
                                const data = await response.json();
                                let emails = [];
                                
                                if (Array.isArray(data)) {
                                    emails = data;
                                } else if (data.emails && Array.isArray(data.emails)) {
                                    emails = data.emails;
                                } else if (data.data && Array.isArray(data.data)) {
                                    emails = data.data;
                                } else if (data.queue && Array.isArray(data.queue)) {
                                    emails = data.queue;
                                }
                                
                                if (emails.length > 0) {
                                    console.log(`✅ Loaded ${emails.length} emails from ${endpoint}`);
                                    
                                    // Merge with existing emails, avoiding duplicates
                                    emails.forEach(email => {
                                        if (!allEmails.find(e => e.id === email.id)) {
                                            allEmails.push({
                                                id: email.id,
                                                to: email.to || '',
                                                subject: email.subject || '',
                                                html: email.html || email.content || '',
                                                sendAt: normalizeTimestamp(email.sendAt || email.scheduledTime),
                                                sentAt: normalizeTimestamp(email.sentAt),
                                                status: email.status || 'scheduled',
                                                accountId: email.accountId || '',
                                                contactName: email.contactName || '',
                                                organizationName: email.organizationName || ''
                                            });
                                        }
                                    });
                                    break; // Stop after first successful endpoint
                                }
                            }
                        } catch (endpointError) {
                            console.warn(`⚠️ Error with endpoint ${endpoint}:`, endpointError);
                        }
                    }
                } catch (backendError) {
                    console.warn('⚠️ Backend loading failed:', backendError);
                }
                
                console.log(`📧 Loaded ${allEmails.length} total emails`);
                
                if (allEmails.length === 0) {
                    showNotification('No emails found. Check if emails are queued in the system.', 'warning');
                }
                
                filterEmails();
                updateStats();
                
            } catch (error) {
                console.error('❌ Error loading emails:', error);
                showNotification('Error loading emails: ' + error.message, 'error');
            }
        }

        // Filter emails based on current filter settings
        function filterEmails() {
            const statusFilter = document.getElementById('statusFilter').value;
            const recipientFilter = document.getElementById('recipientFilter').value.toLowerCase();
            const subjectFilter = document.getElementById('subjectFilter').value.toLowerCase();

            filteredEmails = allEmails.filter(email => {
                // Status filter
                if (statusFilter && email.status !== statusFilter) {
                    return false;
                }

                // Recipient filter
                if (recipientFilter && !email.to.toLowerCase().includes(recipientFilter)) {
                    return false;
                }

                // Subject filter
                if (subjectFilter && !email.subject.toLowerCase().includes(subjectFilter)) {
                    return false;
                }

                return true;
            });

            renderEmails();
            updateStats();
        }

        // Render email list
        function renderEmails() {
            const emailsList = document.getElementById('emailsList');
            
            if (filteredEmails.length === 0) {
                emailsList.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-inbox"></i>
                        <p>No emails found matching current filters</p>
                    </div>
                `;
                return;
            }

            const emailsHtml = filteredEmails.map(email => {
                const effectiveDate = (email.status === 'sent' && email.sentAt) ? email.sentAt : email.sendAt;
                const isSelected = selectedEmails.has(email.id);
                
                return `
                    <div class="email-item ${isSelected ? 'selected' : ''}" data-email-id="${email.id}">
                        <div class="email-header">
                            <div class="email-info">
                                <div class="email-subject">${email.subject}</div>
                                <div class="email-details">
                                    <span><i class="fas fa-envelope"></i> ${email.to}</span>
                                    <span><i class="fas fa-clock"></i> ${email.status === 'sent' ? 'Sent' : 'Scheduled'}: ${toMountainTime(effectiveDate)}</span>
                                    <span><i class="fas fa-circle" style="color: ${email.status === 'sent' ? '#48bb78' : '#ed8936'}"></i> ${email.status}</span>
                                    ${email.contactName ? `<span><i class="fas fa-user"></i> ${email.contactName}</span>` : ''}
                                    ${email.organizationName ? `<span><i class="fas fa-building"></i> ${email.organizationName}</span>` : ''}
                                </div>
                            </div>
                            <div class="email-actions">
                                <div class="checkbox-wrapper">
                                    <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleEmailSelection('${email.id}')">
                                    <label>Select</label>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            emailsList.innerHTML = emailsHtml;
        }

        // Toggle email selection
        function toggleEmailSelection(emailId) {
            if (selectedEmails.has(emailId)) {
                selectedEmails.delete(emailId);
            } else {
                selectedEmails.add(emailId);
            }
            
            updateStats();
            renderEmails(); // Re-render to update visual selection
        }

        // Select all emails
        function selectAll() {
            selectedEmails.clear();
            filteredEmails.forEach(email => selectedEmails.add(email.id));
            updateStats();
            renderEmails();
        }

        // Select no emails
        function selectNone() {
            selectedEmails.clear();
            updateStats();
            renderEmails();
        }

        // Select emails that match the find text
        function selectMatching() {
            const findText = document.getElementById('findText').value;
            if (!findText.trim()) {
                showNotification('Please enter text to find first', 'warning');
                return;
            }

            selectedEmails.clear();
            const caseSensitive = document.getElementById('caseSensitive').checked;
            const subjectOnly = document.getElementById('subjectOnly').checked;

            filteredEmails.forEach(email => {
                const searchText = caseSensitive ? findText : findText.toLowerCase();
                const subject = caseSensitive ? email.subject : email.subject.toLowerCase();
                const html = caseSensitive ? email.html : email.html.toLowerCase();

                const matchesSubject = subject.includes(searchText);
                const matchesBody = !subjectOnly && html.includes(searchText);

                if (matchesSubject || matchesBody) {
                    selectedEmails.add(email.id);
                }
            });

            updateStats();
            renderEmails();
            showNotification(`Selected ${selectedEmails.size} emails matching "${findText}"`, 'info');
        }

        // Preview changes
        function previewChanges() {
            const findText = document.getElementById('findText').value;
            const replaceText = document.getElementById('replaceText').value;

            if (!findText.trim()) {
                showNotification('Please enter text to find', 'warning');
                return;
            }

            if (selectedEmails.size === 0) {
                showNotification('Please select emails to modify', 'warning');
                return;
            }

            const caseSensitive = document.getElementById('caseSensitive').checked;
            const subjectOnly = document.getElementById('subjectOnly').checked;

            previewData = [];
            let totalChanges = 0;

            selectedEmails.forEach(emailId => {
                const email = allEmails.find(e => e.id === emailId);
                if (!email) return;

                const searchText = caseSensitive ? findText : findText.toLowerCase();
                const replaceWithText = replaceText;

                let newSubject = email.subject;
                let newHtml = email.html;
                let changes = [];

                // Check subject
                const subjectToSearch = caseSensitive ? email.subject : email.subject.toLowerCase();
                if (subjectToSearch.includes(searchText)) {
                    if (caseSensitive) {
                        newSubject = email.subject.replaceAll(findText, replaceWithText);
                    } else {
                        newSubject = email.subject.replace(new RegExp(escapeRegex(findText), 'gi'), replaceWithText);
                    }
                    changes.push('Subject');
                }

                // Check body (if not subject-only)
                if (!subjectOnly) {
                    const htmlToSearch = caseSensitive ? email.html : email.html.toLowerCase();
                    if (htmlToSearch.includes(searchText)) {
                        if (caseSensitive) {
                            newHtml = email.html.replaceAll(findText, replaceWithText);
                        } else {
                            newHtml = email.html.replace(new RegExp(escapeRegex(findText), 'gi'), replaceWithText);
                        }
                        changes.push('Body');
                    }
                }

                if (changes.length > 0) {
                    previewData.push({
                        id: emailId,
                        email: email,
                        newSubject: newSubject,
                        newHtml: newHtml,
                        changes: changes
                    });
                    totalChanges += changes.length;
                }
            });

            if (previewData.length === 0) {
                showNotification('No changes found with current find text', 'warning');
                return;
            }

            renderPreview();
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('matchingEmails').textContent = previewData.length;
        }

        // Escape regex special characters
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Render preview
        function renderPreview() {
            const previewContainer = document.getElementById('changesPreview');
            
            const summaryHtml = `
                <div class="changes-summary">
                    <h3><i class="fas fa-info-circle"></i> Changes Summary</h3>
                    <p><strong>${previewData.length}</strong> emails will be modified</p>
                    <p>Find: "<strong>${document.getElementById('findText').value}</strong>"</p>
                    <p>Replace with: "<strong>${document.getElementById('replaceText').value}</strong>"</p>
                </div>
            `;

            const previewHtml = previewData.slice(0, 10).map(item => {
                return `
                    <div class="preview-item">
                        <h4><i class="fas fa-envelope"></i> ${item.email.to}</h4>
                        <p><strong>Changes:</strong> ${item.changes.join(', ')}</p>
                        
                        ${item.changes.includes('Subject') ? `
                            <div style="margin: 10px 0;">
                                <strong>Subject Before:</strong><br>
                                <code style="background: #fee2e2; padding: 4px 8px; border-radius: 4px; display: block; margin: 5px 0;">${item.email.subject}</code>
                                <strong>Subject After:</strong><br>
                                <code style="background: #dcfce7; padding: 4px 8px; border-radius: 4px; display: block; margin: 5px 0;">${item.newSubject}</code>
                            </div>
                        ` : ''}
                        
                        ${item.changes.includes('Body') ? `
                            <div style="margin: 10px 0;">
                                <strong>Body changes detected</strong> (showing first 200 chars):<br>
                                <code style="background: #fee2e2; padding: 4px 8px; border-radius: 4px; display: block; margin: 5px 0; font-size: 12px;">${item.email.html.substring(0, 200)}...</code>
                                <code style="background: #dcfce7; padding: 4px 8px; border-radius: 4px; display: block; margin: 5px 0; font-size: 12px;">${item.newHtml.substring(0, 200)}...</code>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            const moreText = previewData.length > 10 ? `<p style="text-align: center; margin-top: 15px; color: #6b7280;"><em>... and ${previewData.length - 10} more emails</em></p>` : '';

            previewContainer.innerHTML = summaryHtml + previewHtml + moreText;
        }

        // Hide preview
        function hidePreview() {
            document.getElementById('previewSection').style.display = 'none';
            previewData = null;
        }

        // Apply changes
        async function applyChanges() {
            if (!previewData || previewData.length === 0) {
                showNotification('No changes to apply', 'warning');
                return;
            }

            try {
                showNotification('Applying changes...', 'info');
                
                const db = window.firebaseDb;
                const doc = window.firebaseDoc;
                const setDoc = window.firebaseSetDoc;

                let successCount = 0;
                let errorCount = 0;

                for (const item of previewData) {
                    try {
                        // Update in backend API (primary method)
                        try {
                            const backendResponse = await fetch(`https://railwayclemail-production.up.railway.app/emails/${item.id}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    subject: item.newSubject,
                                    html: item.newHtml,
                                    lastModified: new Date().toISOString(),
                                    modifiedBy: 'fix_emails_tool'
                                })
                            });

                            if (backendResponse.ok) {
                                console.log(`✅ Backend update successful for ${item.id}`);
                            } else {
                                console.warn(`⚠️ Backend update failed for ${item.id}, trying Firestore...`);
                                throw new Error('Backend update failed');
                            }
                        } catch (backendError) {
                            console.warn(`⚠️ Backend update error for ${item.id}, trying Firestore:`, backendError);
                            
                            // Fallback to Firestore update
                            const db = window.firebaseDb;
                            const doc = window.firebaseDoc;
                            const setDoc = window.firebaseSetDoc;
                            
                            // Try to update in the collection where we found emails
                            const collectionNames = ['emails', 'email_queue', 'scheduled_emails', 'queue'];
                            let firestoreUpdated = false;
                            
                            for (const collectionName of collectionNames) {
                                try {
                                    const emailDocRef = doc(db, collectionName, item.id);
                                    const updatedEmail = {
                                        ...item.email,
                                        subject: item.newSubject,
                                        html: item.newHtml,
                                        lastModified: new Date().toISOString(),
                                        modifiedBy: 'fix_emails_tool'
                                    };
                                    
                                    await setDoc(emailDocRef, updatedEmail, { merge: true });
                                    console.log(`✅ Firestore update successful for ${item.id} in ${collectionName}`);
                                    firestoreUpdated = true;
                                    break;
                                } catch (firestoreError) {
                                    console.warn(`⚠️ Firestore update failed in ${collectionName}:`, firestoreError);
                                }
                            }
                            
                            if (!firestoreUpdated) {
                                throw new Error('Both backend and Firestore updates failed');
                            }
                        }

                        successCount++;
                    } catch (error) {
                        console.error(`❌ Error updating email ${item.id}:`, error);
                        errorCount++;
                    }
                }

                showNotification(`✅ Updated ${successCount} emails successfully${errorCount > 0 ? ` (${errorCount} errors)` : ''}`, 'success');
                
                // Reload emails to reflect changes
                await loadEmails();
                hidePreview();
                selectedEmails.clear();

            } catch (error) {
                console.error('❌ Error applying changes:', error);
                showNotification('Error applying changes: ' + error.message, 'error');
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalEmails').textContent = filteredEmails.length;
            document.getElementById('selectedEmails').textContent = selectedEmails.size;
            
            // Update matching emails count if preview data exists
            if (previewData) {
                document.getElementById('matchingEmails').textContent = previewData.length;
            } else {
                document.getElementById('matchingEmails').textContent = '-';
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Fix Emails page initialized');
            loadEmails();
        });
    </script>
</body>
</html>
