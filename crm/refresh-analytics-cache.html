<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refresh Analytics Cache</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .status-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 600;
            color: #374151;
        }

        .status-value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .status-active {
            color: #10b981;
        }

        .status-empty {
            color: #ef4444;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e7eb;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .log-box {
            background: #1f2937;
            color: #10b981;
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 0.5rem;
        }

        .log-success {
            color: #10b981;
        }

        .log-error {
            color: #ef4444;
        }

        .log-info {
            color: #3b82f6;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .alert-warning {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            color: #92400e;
        }

        .alert-success {
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #065f46;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-bolt"></i> Analytics Cache Manager</h1>
        <p class="subtitle">Populate and refresh the analytics cache for faster dashboard loading</p>

        <div id="warningAlert" class="alert alert-warning" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <div>
                <strong>Cache is empty!</strong> You need to run an initial refresh to populate the cache.
            </div>
        </div>

        <div id="successAlert" class="alert alert-success" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <div>
                <strong>Refresh complete!</strong> Your dashboards will now load instantly.
            </div>
        </div>

        <div class="status-box">
            <div class="status-item">
                <span class="status-label">Cache Status:</span>
                <span id="cacheStatus" class="status-value">Loading...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Campaigns Cached:</span>
                <span id="campaignCount" class="status-value">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">Last Refresh:</span>
                <span id="lastRefresh" class="status-value">-</span>
            </div>
        </div>

        <button id="refreshBtn" class="btn btn-primary" onclick="refreshCache()">
            <i class="fas fa-sync"></i> Refresh Cache Now
        </button>

        <button class="btn btn-secondary" onclick="window.location.href='analytics_dashboard2.html'">
            <i class="fas fa-chart-line"></i> Go to Dashboard
        </button>

        <div id="logBox" class="log-box" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = 'https://railwayclemail-production.up.railway.app/api/analytics';

        async function checkStatus() {
            try {
                addLog('Checking cache status...', 'info');
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();

                if (data.success) {
                    const status = data.status;
                    document.getElementById('campaignCount').textContent = status.totalCampaigns || 0;
                    document.getElementById('lastRefresh').textContent = status.lastRefresh 
                        ? new Date(status.lastRefresh).toLocaleString() 
                        : 'Never';

                    if (status.totalCampaigns > 0) {
                        document.getElementById('cacheStatus').textContent = 'Active';
                        document.getElementById('cacheStatus').className = 'status-value status-active';
                        document.getElementById('warningAlert').style.display = 'none';
                        addLog(`✅ Cache is active with ${status.totalCampaigns} campaigns`, 'success');
                    } else {
                        document.getElementById('cacheStatus').textContent = 'Empty';
                        document.getElementById('cacheStatus').className = 'status-value status-empty';
                        document.getElementById('warningAlert').style.display = 'flex';
                        addLog('⚠️ Cache is empty - refresh needed', 'error');
                    }
                }
            } catch (error) {
                addLog(`❌ Error checking status: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }

        async function refreshCache() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Refreshing...';
            
            document.getElementById('logBox').style.display = 'block';
            document.getElementById('logBox').innerHTML = '';
            document.getElementById('successAlert').style.display = 'none';
            
            try {
                addLog('🔄 Starting cache refresh...', 'info');
                addLog('This may take 30-60 seconds for all campaigns', 'info');

                const response = await fetch(`${API_BASE}/refresh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        triggeredBy: 'manual_frontend'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    addLog('✅ Cache refresh started successfully', 'success');
                    addLog('⏳ Waiting for refresh to complete...', 'info');

                    // Poll for completion
                    let attempts = 0;
                    const maxAttempts = 30;
                    const checkInterval = setInterval(async () => {
                        attempts++;
                        
                        try {
                            const statusResponse = await fetch(`${API_BASE}/status`);
                            const statusData = await statusResponse.json();
                            
                            if (statusData.success && statusData.status.totalCampaigns > 0) {
                                clearInterval(checkInterval);
                                addLog(`✅ Refresh complete! ${statusData.status.totalCampaigns} campaigns cached`, 'success');
                                document.getElementById('successAlert').style.display = 'flex';
                                btn.innerHTML = '<i class="fas fa-check"></i> Refresh Complete!';
                                setTimeout(() => {
                                    btn.disabled = false;
                                    btn.innerHTML = '<i class="fas fa-sync"></i> Refresh Cache Now';
                                    checkStatus();
                                }, 3000);
                            } else if (attempts >= maxAttempts) {
                                clearInterval(checkInterval);
                                addLog('⏰ Refresh is taking longer than expected. Check Railway logs.', 'info');
                                btn.disabled = false;
                                btn.innerHTML = '<i class="fas fa-sync"></i> Refresh Cache Now';
                            }
                        } catch (error) {
                            console.error('Polling error:', error);
                        }
                    }, 2000);

                } else {
                    addLog(`❌ Refresh failed: ${data.message}`, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sync"></i> Refresh Cache Now';
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync"></i> Refresh Cache Now';
            }
        }

        function addLog(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Check status on load
        checkStatus();
    </script>
</body>
</html>
