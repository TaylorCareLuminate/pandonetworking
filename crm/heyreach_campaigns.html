<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyReach Campaigns Manager - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0077b5;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .page-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .controls-section h3 {
            margin-bottom: 1rem;
            color: var(--secondary);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control-item {
            display: flex;
            flex-direction: column;
        }

        .control-item label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .control-item select,
        .control-item input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #005885;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--gray);
        }

        .campaigns-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        .campaigns-section h3 {
            margin-bottom: 1.5rem;
            color: var(--secondary);
        }

        .campaign-card {
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: white;
            transition: all 0.3s ease;
        }

        .campaign-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .campaign-card.priority {
            border-color: var(--warning);
            background: #fffbeb;
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .campaign-title {
            flex: 1;
        }

        .campaign-title h4 {
            font-size: 1.2rem;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .campaign-meta {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .campaign-actions {
            display: flex;
            gap: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-running {
            background: #d1fae5;
            color: #065f46;
        }

        .status-paused {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-completed {
            background: #e0e7ff;
            color: #3730a3;
        }

        .status-draft {
            background: #f3f4f6;
            color: #374151;
        }

        .type-badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }

        .type-connect {
            background: #0077b5;
            color: white;
        }

        .type-message {
            background: #059669;
            color: white;
        }

        .type-like {
            background: #f59e0b;
            color: white;
        }

        .type-other {
            background: #6b7280;
            color: white;
        }

        .priority-badge {
            background: var(--warning);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .campaign-progress {
            margin: 1rem 0;
        }

        .progress-bar-container {
            background: var(--border);
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .progress-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .progress-stat {
            padding: 0.5rem;
            background: var(--light-gray);
            border-radius: 6px;
            text-align: center;
        }

        .progress-stat-value {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .progress-stat-label {
            color: var(--gray);
            font-size: 0.75rem;
        }

        .campaign-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .detail-item {
            font-size: 0.85rem;
        }

        .detail-label {
            color: var(--gray);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            color: var(--secondary);
        }

        .alert {
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--gray);
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .filter-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border);
            background: white;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .customer-select {
            margin-bottom: 1rem;
        }

        .bulk-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fab fa-linkedin"></i>
                HeyReach Campaigns Manager
            </h1>
            <p>Monitor and manage your LinkedIn campaigns with automated resume functionality</p>
        </div>

        <div class="controls-section">
            <h3><i class="fas fa-sliders-h"></i> Campaign Controls</h3>
            
            <div class="customer-select">
                <label for="customer-selector">Select Customer:</label>
                <select id="customer-selector" onchange="loadCampaigns()">
                    <option value="">-- Loading customers --</option>
                </select>
            </div>

            <div class="bulk-actions">
                <button class="btn btn-primary" onclick="loadCampaigns()">
                    <i class="fas fa-sync"></i> Refresh Campaigns
                </button>
                <button class="btn btn-success" onclick="resumePriorityCampaigns()">
                    <i class="fas fa-play"></i> Resume All Priority Campaigns
                </button>
                <button class="btn btn-warning" onclick="pausePriorityCampaigns()">
                    <i class="fas fa-pause"></i> Pause All Priority Campaigns
                </button>
                <button class="btn btn-warning" onclick="testAutoResume()">
                    <i class="fas fa-flask"></i> Test Auto-Resume Process
                </button>
            </div>

            <div id="alert-container"></div>
        </div>

        <div class="stats-grid" id="stats-grid">
            <!-- Stats will be populated here -->
        </div>

        <div class="campaigns-section">
            <h3><i class="fas fa-list"></i> Campaigns</h3>
            
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterCampaigns('all')">All Campaigns</button>
                <button class="filter-btn" onclick="filterCampaigns('priority')">Priority (Connect & Message)</button>
                <button class="filter-btn" onclick="filterCampaigns('paused')">Paused</button>
                <button class="filter-btn" onclick="filterCampaigns('running')">Running</button>
                <button class="filter-btn" onclick="filterCampaigns('completed')">Completed</button>
            </div>

            <div id="campaigns-container">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading campaigns...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // ========================================
        // FIREBASE INITIALIZATION
        // ========================================
        
        // Initialize Firebase with CLEmail config
        const firebaseConfig = {
            apiKey: "AIzaSyDGESh2UQT4awIg9Y3kBcZPN-aaWthC1k4",
            authDomain: "clemail.firebaseapp.com",
            databaseURL: "https://clemail-default-rtdb.firebaseio.com",
            projectId: "clemail",
            storageBucket: "clemail.firebasestorage.app",
            messagingSenderId: "762477610174",
            appId: "1:762477610174:web:8547f62e6d9f3b819acaef",
            measurementId: "G-EFW8G912Y7"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        console.log('✅ Firebase initialized');
        
        // ========================================
        // GLOBAL STATE
        // ========================================
        
        let currentCustomer = null;
        let allCampaigns = [];
        let currentFilter = 'all';
        const railwayApiUrl = 'https://clemailapi-production.up.railway.app';
        
        // Priority campaign types (Connect and Message)
        const PRIORITY_TYPES = ['connect', 'message'];
        
        // ========================================
        // INITIALIZATION
        // ========================================
        
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Wait for Firebase auth
                await new Promise((resolve) => {
                    firebase.auth().onAuthStateChanged(resolve);
                });
                
                // Load customers
                await loadCustomers();
            } catch (error) {
                console.error('Error initializing:', error);
                showAlert('Failed to initialize: ' + error.message, 'error');
            }
        });
        
        // ========================================
        // CUSTOMER MANAGEMENT
        // ========================================
        
        async function loadCustomers() {
            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('customers')
                    .where('heyreachEnabled', '==', true)
                    .where('status', '==', 'active')
                    .get();
                
                const selector = document.getElementById('customer-selector');
                selector.innerHTML = '<option value="">-- Select a customer --</option>';
                
                snapshot.forEach(doc => {
                    const customer = { id: doc.id, ...doc.data() };
                    if (customer.heyreachApiKey) {
                        const option = document.createElement('option');
                        option.value = doc.id;
                        option.textContent = customer.name;
                        selector.appendChild(option);
                    }
                });
                
                if (snapshot.size === 0) {
                    showAlert('No customers with HeyReach enabled found. Please configure HeyReach in Email Controls.', 'warning');
                }
            } catch (error) {
                console.error('Error loading customers:', error);
                showAlert('Failed to load customers: ' + error.message, 'error');
            }
        }
        
        // ========================================
        // CAMPAIGN LOADING
        // ========================================
        
        async function loadCampaigns() {
            const selector = document.getElementById('customer-selector');
            const customerId = selector.value;
            
            if (!customerId) {
                showAlert('Please select a customer first', 'warning');
                return;
            }
            
            try {
                const container = document.getElementById('campaigns-container');
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading campaigns...</p></div>';
                
                // Get customer data including API key
                const db = firebase.firestore();
                const customerDoc = await db.collection('customers').doc(customerId).get();
                
                if (!customerDoc.exists) {
                    throw new Error('Customer not found');
                }
                
                currentCustomer = { id: customerDoc.id, ...customerDoc.data() };
                
                if (!currentCustomer.heyreachApiKey) {
                    throw new Error('HeyReach API key not configured for this customer');
                }
                
                // Fetch campaigns from HeyReach API via Railway proxy
                const response = await fetch(`${railwayApiUrl}/proxy/heyreach/campaigns/getall`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': currentCustomer.heyreachApiKey
                    },
                    body: JSON.stringify({
                        offset: 0,
                        limit: 100
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log('Campaigns API response:', result);
                
                // Extract campaigns from response
                allCampaigns = result.items || result.list || [];
                
                // Detect campaign types based on name patterns
                allCampaigns = allCampaigns.map(campaign => ({
                    ...campaign,
                    detectedType: detectCampaignType(campaign.name),
                    isPriority: isPriorityCampaign(campaign)
                }));
                
                // Update stats
                updateStats();
                
                // Display campaigns
                displayCampaigns();
                
                showAlert(`Loaded ${allCampaigns.length} campaigns successfully`, 'success');
                
            } catch (error) {
                console.error('Error loading campaigns:', error);
                showAlert('Failed to load campaigns: ' + error.message, 'error');
                document.getElementById('campaigns-container').innerHTML = 
                    '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load campaigns</p></div>';
            }
        }
        
        // ========================================
        // CAMPAIGN TYPE DETECTION
        // ========================================
        
        function detectCampaignType(campaignName) {
            const name = campaignName.toLowerCase();
            
            if (name.includes('connect') || name.includes('connection')) {
                return 'connect';
            } else if (name.includes('message') || name.includes('msg')) {
                return 'message';
            } else if (name.includes('like') || name.includes('engage')) {
                return 'like';
            }
            
            return 'other';
        }
        
        function isPriorityCampaign(campaign) {
            return PRIORITY_TYPES.includes(campaign.detectedType);
        }
        
        // ========================================
        // STATS DISPLAY
        // ========================================
        
        function updateStats() {
            const statsContainer = document.getElementById('stats-grid');
            
            const totalCampaigns = allCampaigns.length;
            const priorityCampaigns = allCampaigns.filter(c => c.isPriority).length;
            const runningCampaigns = allCampaigns.filter(c => c.status === 1).length; // Status 1 = Running
            const pausedCampaigns = allCampaigns.filter(c => c.status === 2).length; // Status 2 = Paused
            const completedCampaigns = allCampaigns.filter(c => c.status === 3).length; // Status 3 = Completed
            
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalCampaigns}</div>
                    <div class="stat-label">Total Campaigns</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--warning);">${priorityCampaigns}</div>
                    <div class="stat-label">Priority Campaigns</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--success);">${runningCampaigns}</div>
                    <div class="stat-label">Running</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--danger);">${pausedCampaigns}</div>
                    <div class="stat-label">Paused</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--gray);">${completedCampaigns}</div>
                    <div class="stat-label">Completed</div>
                </div>
            `;
        }
        
        // ========================================
        // CAMPAIGN DISPLAY
        // ========================================
        
        function displayCampaigns() {
            const container = document.getElementById('campaigns-container');
            
            let filteredCampaigns = allCampaigns;
            
            // Apply filters
            if (currentFilter === 'priority') {
                filteredCampaigns = allCampaigns.filter(c => c.isPriority);
            } else if (currentFilter === 'paused') {
                filteredCampaigns = allCampaigns.filter(c => c.status === 2);
            } else if (currentFilter === 'running') {
                filteredCampaigns = allCampaigns.filter(c => c.status === 1);
            } else if (currentFilter === 'completed') {
                filteredCampaigns = allCampaigns.filter(c => c.status === 3);
            }
            
            if (filteredCampaigns.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><p>No campaigns found</p></div>';
                return;
            }
            
            container.innerHTML = filteredCampaigns.map(campaign => renderCampaign(campaign)).join('');
        }
        
        function renderCampaign(campaign) {
            const statusMap = {
                0: { label: 'Draft', class: 'status-draft' },
                1: { label: 'Running', class: 'status-running' },
                2: { label: 'Paused', class: 'status-paused' },
                3: { label: 'Completed', class: 'status-completed' }
            };
            
            const status = statusMap[campaign.status] || { label: 'Unknown', class: 'status-draft' };
            
            const typeClass = `type-${campaign.detectedType}`;
            
            const progressStats = campaign.progressStats || {};
            const totalUsers = progressStats.totalUsers || 0;
            const finished = progressStats.totalUsersFinished || 0;
            const inProgress = progressStats.totalUsersInProgress || 0;
            const pending = progressStats.totalUsersPending || 0;
            const failed = progressStats.totalUsersFailed || 0;
            
            const progressPercent = totalUsers > 0 ? Math.round((finished / totalUsers) * 100) : 0;
            
            const isPriority = campaign.isPriority;
            const canResume = campaign.status === 2 || campaign.status === 3; // Paused or Completed
            
            return `
                <div class="campaign-card ${isPriority ? 'priority' : ''}">
                    <div class="campaign-header">
                        <div class="campaign-title">
                            <h4>
                                ${campaign.name}
                                ${isPriority ? '<span class="priority-badge">⚡ PRIORITY</span>' : ''}
                            </h4>
                            <div class="campaign-meta">
                                <span class="status-badge ${status.class}">${status.label}</span>
                                <span class="type-badge ${typeClass}">${campaign.detectedType}</span>
                                <span style="margin-left: 1rem; color: var(--gray);">
                                    <i class="fas fa-clock"></i> Created: ${new Date(campaign.creationTime).toLocaleDateString()}
                                </span>
                            </div>
                        </div>
                        <div class="campaign-actions">
                            ${campaign.status === 1 ? `
                                <button class="btn btn-warning btn-small" onclick="pauseCampaign(${campaign.id}, '${campaign.name}')">
                                    <i class="fas fa-pause"></i> Pause
                                </button>
                            ` : ''}
                            ${canResume ? `
                                <button class="btn btn-success btn-small" onclick="resumeCampaign(${campaign.id}, '${campaign.name}')">
                                    <i class="fas fa-play"></i> Resume
                                </button>
                            ` : ''}
                        </div>
                    </div>
                    
                    ${totalUsers > 0 ? `
                        <div class="campaign-progress">
                            <div class="progress-bar-container">
                                <div class="progress-bar" style="width: ${progressPercent}%">
                                    ${progressPercent}%
                                </div>
                            </div>
                            <div class="progress-stats">
                                <div class="progress-stat">
                                    <div class="progress-stat-value">${totalUsers}</div>
                                    <div class="progress-stat-label">Total Users</div>
                                </div>
                                <div class="progress-stat">
                                    <div class="progress-stat-value" style="color: var(--success);">${finished}</div>
                                    <div class="progress-stat-label">Finished</div>
                                </div>
                                <div class="progress-stat">
                                    <div class="progress-stat-value" style="color: var(--primary);">${inProgress}</div>
                                    <div class="progress-stat-label">In Progress</div>
                                </div>
                                <div class="progress-stat">
                                    <div class="progress-stat-value" style="color: var(--gray);">${pending}</div>
                                    <div class="progress-stat-label">Pending</div>
                                </div>
                                <div class="progress-stat">
                                    <div class="progress-stat-value" style="color: var(--danger);">${failed}</div>
                                    <div class="progress-stat-label">Failed</div>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="campaign-details">
                        <div class="detail-item">
                            <div class="detail-label">Campaign ID</div>
                            <div class="detail-value">${campaign.id}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">LinkedIn List</div>
                            <div class="detail-value">${campaign.linkedInUserListName || 'N/A'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Campaign Accounts</div>
                            <div class="detail-value">${campaign.campaignAccountIds?.length || 0} accounts</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Exclude Settings</div>
                            <div class="detail-value">
                                ${campaign.excludeAlreadyMessagedGlobal ? '✓ Messaged' : ''} 
                                ${campaign.excludeFirstConnectionGlobal ? '✓ 1st Connections' : ''}
                                ${campaign.excludeNoProfilePicture ? '✓ No Picture' : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ========================================
        // FILTERING
        // ========================================
        
        function filterCampaigns(filter) {
            currentFilter = filter;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Redisplay campaigns
            displayCampaigns();
        }
        
        // ========================================
        // CAMPAIGN ACTIONS
        // ========================================
        
        async function resumeCampaign(campaignId, campaignName) {
            if (!currentCustomer || !currentCustomer.heyreachApiKey) {
                showAlert('Please select a customer first', 'error');
                return;
            }
            
            try {
                console.log(`Resuming campaign ${campaignId}: ${campaignName}`);
                
                const response = await fetch(`${railwayApiUrl}/proxy/heyreach/campaign/resume`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': currentCustomer.heyreachApiKey
                    },
                    body: JSON.stringify({
                        campaignId: campaignId
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log('Resume campaign result:', result);
                
                showAlert(`✅ Campaign "${campaignName}" resumed successfully!`, 'success');
                
                // Reload campaigns to reflect new status
                await loadCampaigns();
                
            } catch (error) {
                console.error('Error resuming campaign:', error);
                showAlert(`Failed to resume campaign: ${error.message}`, 'error');
            }
        }
        
        async function pauseCampaign(campaignId, campaignName) {
            if (!currentCustomer || !currentCustomer.heyreachApiKey) {
                showAlert('Please select a customer first', 'error');
                return;
            }
            
            try {
                console.log(`Pausing campaign ${campaignId}: ${campaignName}`);
                
                const response = await fetch(`${railwayApiUrl}/proxy/heyreach/campaign/pause`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': currentCustomer.heyreachApiKey
                    },
                    body: JSON.stringify({
                        campaignId: campaignId
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log('Pause campaign result:', result);
                
                showAlert(`✅ Campaign "${campaignName}" paused successfully!`, 'success');
                
                // Reload campaigns to reflect new status
                await loadCampaigns();
                
            } catch (error) {
                console.error('Error pausing campaign:', error);
                showAlert(`Failed to pause campaign: ${error.message}`, 'error');
            }
        }
        
        async function resumePriorityCampaigns() {
            if (!currentCustomer || !currentCustomer.heyreachApiKey) {
                showAlert('Please select a customer first', 'error');
                return;
            }
            
            const priorityCampaigns = allCampaigns.filter(c => 
                c.isPriority && (c.status === 2 || c.status === 3) // Paused or Completed
            );
            
            if (priorityCampaigns.length === 0) {
                showAlert('No priority campaigns need resuming', 'info');
                return;
            }
            
            if (!confirm(`Resume ${priorityCampaigns.length} priority campaigns?`)) {
                return;
            }
            
            let successCount = 0;
            let failCount = 0;
            
            for (const campaign of priorityCampaigns) {
                try {
                    await resumeCampaign(campaign.id, campaign.name);
                    successCount++;
                } catch (error) {
                    console.error(`Failed to resume campaign ${campaign.id}:`, error);
                    failCount++;
                }
            }
            
            showAlert(`Resume complete: ${successCount} successful, ${failCount} failed`, 
                failCount === 0 ? 'success' : 'warning');
        }
        
        async function pausePriorityCampaigns() {
            if (!currentCustomer || !currentCustomer.heyreachApiKey) {
                showAlert('Please select a customer first', 'error');
                return;
            }
            
            const priorityCampaigns = allCampaigns.filter(c => 
                c.isPriority && c.status === 1 // Running campaigns only
            );
            
            if (priorityCampaigns.length === 0) {
                showAlert('No priority campaigns are currently running', 'info');
                return;
            }
            
            if (!confirm(`Pause ${priorityCampaigns.length} priority campaigns?`)) {
                return;
            }
            
            let successCount = 0;
            let failCount = 0;
            
            for (const campaign of priorityCampaigns) {
                try {
                    await pauseCampaign(campaign.id, campaign.name);
                    successCount++;
                } catch (error) {
                    console.error(`Failed to pause campaign ${campaign.id}:`, error);
                    failCount++;
                }
            }
            
            showAlert(`Pause complete: ${successCount} successful, ${failCount} failed`, 
                failCount === 0 ? 'success' : 'warning');
        }
        
        // ========================================
        // AUTO-RESUME TEST
        // ========================================
        
        async function testAutoResume() {
            try {
                showAlert('Testing auto-resume process...', 'info');
                
                // Get all customers with HeyReach enabled
                const db = firebase.firestore();
                const customersSnapshot = await db.collection('customers')
                    .where('heyreachEnabled', '==', true)
                    .where('status', '==', 'active')
                    .get();
                
                let totalResumed = 0;
                let customersProcessed = 0;
                
                for (const customerDoc of customersSnapshot.docs) {
                    const customer = { id: customerDoc.id, ...customerDoc.data() };
                    
                    if (!customer.heyreachApiKey) {
                        continue;
                    }
                    
                    console.log(`Processing customer: ${customer.name}`);
                    
                    // Fetch campaigns for this customer
                    const response = await fetch(`${railwayApiUrl}/proxy/heyreach/campaigns/getall`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': customer.heyreachApiKey
                        },
                        body: JSON.stringify({
                            offset: 0,
                            limit: 100
                        })
                    });
                    
                    if (!response.ok) {
                        console.error(`Failed to fetch campaigns for ${customer.name}`);
                        continue;
                    }
                    
                    const result = await response.json();
                    const campaigns = result.items || result.list || [];
                    
                    // Find priority campaigns that need resuming
                    for (const campaign of campaigns) {
                        const detectedType = detectCampaignType(campaign.name);
                        const isPriority = PRIORITY_TYPES.includes(detectedType);
                        const needsResume = campaign.status === 2 || campaign.status === 3;
                        
                        if (isPriority && needsResume) {
                            console.log(`Resuming priority campaign: ${campaign.name} (${detectedType})`);
                            
                            const resumeResponse = await fetch(`${railwayApiUrl}/proxy/heyreach/campaign/resume`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'x-api-key': customer.heyreachApiKey
                                },
                                body: JSON.stringify({
                                    campaignId: campaign.id
                                })
                            });
                            
                            if (resumeResponse.ok) {
                                totalResumed++;
                                console.log(`✅ Resumed: ${campaign.name}`);
                            } else {
                                console.error(`❌ Failed to resume: ${campaign.name}`);
                            }
                        }
                    }
                    
                    customersProcessed++;
                }
                
                showAlert(`✅ Auto-resume test complete!\nCustomers processed: ${customersProcessed}\nCampaigns resumed: ${totalResumed}`, 'success');
                
                // Log to Firebase
                await db.collection('system_logs').add({
                    type: 'heyreach_auto_resume_test',
                    timestamp: new Date(),
                    customersProcessed,
                    campaignsResumed: totalResumed,
                    status: 'success'
                });
                
                // Reload current campaigns
                if (currentCustomer) {
                    await loadCampaigns();
                }
                
            } catch (error) {
                console.error('Error testing auto-resume:', error);
                showAlert(`Failed to test auto-resume: ${error.message}`, 'error');
            }
        }
        
        // ========================================
        // UTILITIES
        // ========================================
        
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <div>${message.replace(/\n/g, '<br>')}</div>
            `;
            container.innerHTML = '';
            container.appendChild(alert);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
    </script>
