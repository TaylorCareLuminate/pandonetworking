<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Backfill - Fix Missing Fields</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0077b5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --secondary: #0f172a;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .controls-section {
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-select {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid transparent;
        }

        .alert-info {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .alert-warning {
            background: #fffbeb;
            border-color: #fed7aa;
            color: #92400e;
        }

        .alert-danger {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, #059669 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .log {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .log-line {
            margin: 4px 0;
        }
    </style>
    
    <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    <script src="../js/folder-protection.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-database"></i> Email Backfill Tool</h1>
            <p>Fix missing customerId and bdrLeaderId in existing emails</p>
        </div>

        <div class="controls-section">
            <div class="form-group">
                <label class="form-label">Customer</label>
                <select id="customerSelect" class="form-select" onchange="loadCampaigns()">
                    <option value="">Select Customer</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Campaign</label>
                <select id="campaignSelect" class="form-select">
                    <option value="">Select Campaign</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="analyzeEmails()">
                <i class="fas fa-search"></i> Analyze Emails
            </button>
            <button class="btn btn-success" onclick="backfillEmails()" id="backfillBtn" disabled>
                <i class="fas fa-wrench"></i> Backfill Missing Fields
            </button>
        </div>

        <div id="resultsSection" style="display: none;">
            <div class="controls-section">
                <div id="statsContainer"></div>
                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="log" id="logContainer"></div>
            </div>
        </div>
    </div>

    <script type="module">
        let db, collection, getDocs, getDoc, doc, updateDoc, writeBatch, query, where, orderBy, limit;
        let customers = [];
        let campaigns = [];
        let emailsToFix = [];
        let linkedInActivities = [];

        async function waitForClemailWrapper() {
            return new Promise((resolve, reject) => {
                if (window.clemailFirestore && window.clemailDb) {
                    resolve();
                    return;
                }
                let attempts = 0;
                const checkInterval = setInterval(() => {
                    attempts++;
                    if (window.clemailFirestore && window.clemailDb) {
                        clearInterval(checkInterval);
                        resolve();
                    } else if (attempts >= 50) {
                        clearInterval(checkInterval);
                        reject(new Error('CLEmail wrapper not available'));
                    }
                }, 100);
            });
        }

        async function initialize() {
            try {
                await window.firebaseReady;
                const hasAccess = await window.protectFolder('crm');
                if (!hasAccess) {
                    alert('Access denied');
                    return;
                }
                
                await waitForClemailWrapper();
                db = window.clemailDb;
                collection = window.clemailFirestore.collection;
                getDocs = window.clemailFirestore.getDocs;
                getDoc = window.clemailFirestore.getDoc;
                doc = window.clemailFirestore.doc;
                updateDoc = window.clemailFirestore.updateDoc;
                writeBatch = window.clemailFirestore.writeBatch;
                query = window.clemailFirestore.query;
                where = window.clemailFirestore.where;
                orderBy = window.clemailFirestore.orderBy;
                limit = window.clemailFirestore.limit;
                
                await loadCustomers();
            } catch (error) {
                console.error('Initialization failed:', error);
                alert('Failed to initialize: ' + error.message);
            }
        }

        async function loadCustomers() {
            const snapshot = await getDocs(collection(db, 'customerList'));
            customers = [];
            snapshot.forEach((d) => {
                customers.push({ id: d.id, ...d.data() });
            });

            const select = document.getElementById('customerSelect');
            select.innerHTML = '<option value="">Select Customer</option>';
            customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.id;
                option.textContent = customer.name;
                select.appendChild(option);
            });
        }

        window.loadCampaigns = async function() {
            const customerId = document.getElementById('customerSelect').value;
            if (!customerId) return;
            
            const snapshot = await getDocs(
                query(collection(db, 'campaigns'), where('customerId', '==', customerId))
            );
            campaigns = [];
            snapshot.forEach((d) => {
                campaigns.push({ id: d.id, ...d.data() });
            });

            const select = document.getElementById('campaignSelect');
            select.innerHTML = '<option value="">Select Campaign</option>';
            campaigns.forEach(campaign => {
                const option = document.createElement('option');
                option.value = campaign.id;
                option.textContent = campaign.name;
                select.appendChild(option);
            });
        };

        window.analyzeEmails = async function() {
            const customerId = document.getElementById('customerSelect').value;
            const campaignId = document.getElementById('campaignSelect').value;
            
            if (!customerId || !campaignId) {
                alert('Please select customer and campaign');
                return;
            }

            log('🔍 Analyzing emails...');
            document.getElementById('resultsSection').style.display = 'block';
            
            // Load emails for campaign
            const emailsSnapshot = await getDocs(
                query(collection(db, 'scheduledEmails'), where('campaignId', '==', campaignId))
            );
            
            const emails = [];
            emailsSnapshot.forEach(d => {
                emails.push({ id: d.id, ...d.data() });
            });
            
            log(`📊 Found ${emails.length} emails for this campaign`);
            
            // Find emails missing customerId or bdrLeaderId
            emailsToFix = emails.filter(e => !e.customerId || !e.bdrLeaderId);
            log(`⚠️ ${emailsToFix.length} emails need to be fixed`);
            
            if (emailsToFix.length === 0) {
                log('✅ All emails already have required fields!');
                return;
            }
            
            // Load LinkedIn activities for matching
            log('📊 Loading LinkedIn activities...');
            const liSnapshot = await getDocs(
                query(collection(db, 'linkedin_activities'), 
                      where('customerId', '==', customerId),
                      where('campaignId', '==', campaignId))
            );
            
            linkedInActivities = [];
            liSnapshot.forEach(d => {
                linkedInActivities.push({ id: d.id, ...d.data() });
            });
            
            log(`📊 Found ${linkedInActivities.length} LinkedIn activities for matching`);
            
            // Display stats
            const statsHtml = `
                <div class="alert alert-warning">
                    <strong>Analysis Complete</strong><br>
                    Total Emails: ${emails.length}<br>
                    Emails to Fix: ${emailsToFix.length}<br>
                    LinkedIn Activities: ${linkedInActivities.length}
                </div>
            `;
            document.getElementById('statsContainer').innerHTML = statsHtml;
            document.getElementById('backfillBtn').disabled = false;
        };

        window.backfillEmails = async function() {
            if (!confirm(`Backfill ${emailsToFix.length} emails?\n\nThis will set customerId and bdrLeaderId based on LinkedIn activities.`)) {
                return;
            }

            const customerId = document.getElementById('customerSelect').value;
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.style.display = 'block';
            document.getElementById('backfillBtn').disabled = true;
            
            log('🔧 Starting backfill...');
            
            let fixed = 0;
            let failed = 0;
            
            const BATCH_SIZE = 500;
            for (let i = 0; i < emailsToFix.length; i += BATCH_SIZE) {
                const batch = writeBatch(db);
                const batchEmails = emailsToFix.slice(i, Math.min(i + BATCH_SIZE, emailsToFix.length));
                
                for (const email of batchEmails) {
                    try {
                        // Find matching LinkedIn activity by email address
                        const liActivity = linkedInActivities.find(li => 
                            li.contactEmail && email.to && 
                            li.contactEmail.toLowerCase() === email.to.toLowerCase()
                        );
                        
                        const updateData = {
                            customerId: customerId,
                            updatedAt: new Date(),
                            backfilledAt: new Date(),
                            backfilledBy: 'email_backfill_tool'
                        };
                        
                        if (liActivity) {
                            updateData.bdrLeaderId = liActivity.bdrLeaderId;
                            updateData.bdrLeader = liActivity.bdrLeader;
                            log(`✅ ${email.to} → BDR: ${liActivity.bdrLeader}`);
                        } else {
                            log(`⚠️ ${email.to} → No LinkedIn match, setting customerId only`);
                        }
                        
                        batch.update(doc(db, 'scheduledEmails', email.id), updateData);
                        fixed++;
                    } catch (error) {
                        log(`❌ Failed: ${email.to} - ${error.message}`);
                        failed++;
                    }
                }
                
                await batch.commit();
                
                const progress = Math.round((fixed / emailsToFix.length) * 100);
                progressFill.style.width = progress + '%';
                progressFill.textContent = progress + '%';
                
                log(`📊 Progress: ${fixed}/${emailsToFix.length} (${failed} failed)`);
            }
            
            log(`✅ Backfill complete! Fixed: ${fixed}, Failed: ${failed}`);
            alert(`Backfill complete!\n\nFixed: ${fixed}\nFailed: ${failed}`);
        };

        function log(message) {
            const logContainer = document.getElementById('logContainer');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(line);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>
</html>
