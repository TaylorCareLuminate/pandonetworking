<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyReach Contacts - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0077b5;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .page-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .controls-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-select, .form-input {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 119, 181, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #005885;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-secondary {
            background: var(--gray);
            color: white;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value.total { color: var(--primary); }
        .stat-value.accounts { color: var(--accent); }
        .stat-value.customers { color: var(--success); }

        .section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-container {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .log-entry {
            padding: 0.25rem 0;
            border-bottom: 1px solid #334155;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-timestamp {
            color: #94a3b8;
            margin-right: 0.5rem;
        }

        .log-level {
            font-weight: 600;
            margin-right: 0.5rem;
        }

        .log-level.info { color: #3b82f6; }
        .log-level.success { color: #10b981; }
        .log-level.warning { color: #f59e0b; }
        .log-level.error { color: #ef4444; }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .contact-card {
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: all 0.2s;
            cursor: pointer;
            background: white;
        }

        .contact-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .contact-header {
            display: flex;
            align-items: start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .contact-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .contact-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.25rem;
        }

        .contact-headline {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .contact-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .contact-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
        }

        .contact-meta-item i {
            width: 16px;
            color: var(--primary);
        }

        .linkedin-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .linkedin-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .loading i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-info {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }

        .alert-warning {
            background: #fffbeb;
            border-color: #fed7aa;
            color: #92400e;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .alert-danger {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .sync-info {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border);
            background: white;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .contacts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
  <link rel="icon" type="image/png" href="../images/HealthLuminate-Bright.png">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fas fa-users"></i>
                HeyReach Contacts
                <span class="badge badge-success">ACTIVE</span>
            </h1>
            <p>View and manage all LinkedIn contacts across HeyReach accounts</p>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="section-title">
                <i class="fas fa-cogs"></i>
                Sync Controls
            </div>
            
            <div class="controls-grid">
                <div class="form-group">
                    <label class="form-label">Customer Filter</label>
                    <select id="customerSelect" class="form-select" onchange="loadContacts()">
                        <option value="">All Customers</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Account Filter</label>
                    <select id="accountSelect" class="form-select" onchange="loadContacts()">
                        <option value="">All Accounts</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Search</label>
                    <input type="text" id="searchInput" class="form-input" placeholder="Search by name, company..." onkeyup="handleSearch()">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <button class="btn btn-success" id="testButton" onclick="testConnection()">
                    <i class="fas fa-plug"></i>
                    Test Connection
                </button>
                <button class="btn btn-primary" id="syncButton" onclick="triggerManualSync()">
                    <i class="fas fa-sync-alt"></i>
                    Sync Contacts Now
                </button>
                <button class="btn btn-secondary" onclick="loadContacts()">
                    <i class="fas fa-refresh"></i>
                    Refresh View
                </button>
                <button class="btn btn-warning" onclick="exportData()">
                    <i class="fas fa-download"></i>
                    Export CSV
                </button>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-value total" id="totalContacts">0</div>
                <div class="stat-label">Total Contacts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value accounts" id="totalAccounts">0</div>
                <div class="stat-label">LinkedIn Accounts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value customers" id="totalCustomers">0</div>
                <div class="stat-label">Customers</div>
            </div>
        </div>

        <!-- Sync Status -->
        <div id="syncStatus" class="sync-info" style="display: none;">
            <div>
                <strong>Last Sync:</strong> <span id="lastSyncTime">Never</span> | 
                <strong>Status:</strong> <span id="syncStatusText">Ready</span>
            </div>
        </div>

        <!-- Railway Logs Section -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-terminal"></i>
                Railway Backend Logs
                <button class="btn btn-secondary" style="margin-left: auto; padding: 0.5rem 1rem;" onclick="clearLogs()">
                    <i class="fas fa-trash"></i>
                    Clear Logs
                </button>
            </div>
            
            <div id="logsContainer" class="log-container">
                <div class="log-entry">
                    <span class="log-timestamp">[--:--:--]</span>
                    <span class="log-level info">[INFO]</span>
                    <span>Waiting for manual trigger...</span>
                </div>
            </div>
        </div>

        <!-- Contacts Section -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-address-book"></i>
                Contacts
                <div style="margin-left: auto; font-size: 0.9rem; font-weight: normal;" id="contactCount">0 contacts</div>
            </div>
            
            <div id="contactsContainer">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading contacts...</p>
                </div>
            </div>

            <div id="paginationContainer" class="pagination" style="display: none;"></div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    
    <script type="module">
        // Wait for auth and CLEmail wrapper
        await window.firebaseReady;
        
        const { collection, getDocs, query, where, orderBy, limit } = window.clemailFirestore;
        const db = window.clemailDb;
        
        console.log('🔒 CLEmail secure wrapper ready');

        // Backend URL
        const BACKEND_URL = 'https://railwayclemail-production.up.railway.app';

        // Global state
        let customers = [];
        let contacts = [];
        let filteredContacts = [];
        let currentPage = 1;
        const contactsPerPage = 24;

        // Initialize the application
        async function initialize() {
            console.log('🚀 Initializing HeyReach Contacts...');
            addLog('info', 'Initializing HeyReach Contacts application...');
            
            await loadCustomers();
            await loadContacts();
            
            // Set up real-time listeners
            setupRealtimeListeners();
            
            addLog('success', 'Application initialized successfully');
        }

        // Load customers
        async function loadCustomers() {
            try {
                addLog('info', 'Loading customers from Firestore...');
                const customersSnapshot = await getDocs(collection(db, 'customerList'));
                customers = [];
                
                customersSnapshot.docs.forEach((doc) => {
                    const customerData = { id: doc.id, ...doc.data() };
                    if (customerData.name && customerData.heyreachEnabled) {
                        customers.push(customerData);
                    }
                });

                // Update customer dropdown
                const customerSelect = document.getElementById('customerSelect');
                customerSelect.innerHTML = '<option value="">All Customers</option>';
                customers.forEach(customer => {
                    const option = document.createElement('option');
                    option.value = customer.id;
                    option.textContent = customer.name || 'Unnamed Customer';
                    customerSelect.appendChild(option);
                });

                addLog('success', `Loaded ${customers.length} customers with HeyReach enabled`);
            } catch (error) {
                console.error('❌ Error loading customers:', error);
                addLog('error', `Error loading customers: ${error.message}`);
                showAlert('Error loading customers: ' + error.message, 'danger');
            }
        }

        // Set up real-time listeners (disabled - using manual refresh instead)
        function setupRealtimeListeners() {
            // Real-time listeners removed due to CLEmail wrapper limitations
            // Use manual refresh button or auto-refresh after sync instead
            addLog('info', 'Real-time listeners disabled - use manual refresh');
        }

        // Load contacts from Firestore
        window.loadContacts = async function() {
            try {
                addLog('info', 'Loading contacts from Firestore...');
                showLoadingContacts();

                const customerId = document.getElementById('customerSelect').value;

                let contactsQuery = collection(db, 'heyreach_contacts');
                
                // Apply filters
                if (customerId) {
                    contactsQuery = query(contactsQuery, where('customerId', '==', customerId));
                }

                // Order by last sync time
                contactsQuery = query(contactsQuery, orderBy('lastSyncAt', 'desc'));

                const snapshot = await getDocs(contactsQuery);
                contacts = [];
                
                snapshot.forEach((doc) => {
                    const contact = { id: doc.id, ...doc.data() };
                    contacts.push(contact);
                });

                filteredContacts = [...contacts];
                
                addLog('success', `Loaded ${contacts.length} contacts`);
                updateStats();
                displayContacts();
                
            } catch (error) {
                console.error('❌ Error loading contacts:', error);
                addLog('error', `Error loading contacts: ${error.message}`);
                showAlert('Error loading contacts: ' + error.message, 'danger');
                hideLoadingContacts();
            }
        };

        // Handle search
        window.handleSearch = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                filteredContacts = [...contacts];
            } else {
                filteredContacts = contacts.filter(contact => {
                    const fullName = `${contact.firstName || ''} ${contact.lastName || ''}`.toLowerCase();
                    const company = (contact.companyName || '').toLowerCase();
                    const position = (contact.position || '').toLowerCase();
                    const headline = (contact.headline || '').toLowerCase();
                    
                    return fullName.includes(searchTerm) || 
                           company.includes(searchTerm) || 
                           position.includes(searchTerm) ||
                           headline.includes(searchTerm);
                });
            }
            
            currentPage = 1;
            displayContacts();
        };

        // Display contacts
        function displayContacts() {
            const container = document.getElementById('contactsContainer');
            document.getElementById('contactCount').textContent = `${filteredContacts.length} contacts`;

            if (filteredContacts.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No contacts found. Try syncing or adjusting your filters.
                    </div>
                `;
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }

            // Calculate pagination
            const totalPages = Math.ceil(filteredContacts.length / contactsPerPage);
            const startIndex = (currentPage - 1) * contactsPerPage;
            const endIndex = startIndex + contactsPerPage;
            const contactsToDisplay = filteredContacts.slice(startIndex, endIndex);

            let html = '<div class="contacts-grid">';

            contactsToDisplay.forEach(contact => {
                const fullName = `${contact.firstName || ''} ${contact.lastName || ''}`.trim() || 'Unknown Contact';
                const initials = getInitials(contact.firstName, contact.lastName);
                const company = contact.companyName || '';
                const position = contact.position || '';
                const headline = contact.headline || '';
                const connections = contact.connections || 0;
                const location = contact.location || '';
                const email = contact.emailAddress || '';
                
                html += `
                    <div class="contact-card" onclick="openLinkedInProfile('${contact.profileUrl || ''}')">
                        <div class="contact-header">
                            <div class="contact-avatar">
                                ${contact.imageUrl ? 
                                    `<img src="${contact.imageUrl}" alt="${fullName}" onerror="this.parentElement.innerHTML='${initials}'">` : 
                                    initials
                                }
                            </div>
                            
                            <div class="contact-info">
                                <div class="contact-name">${fullName}</div>
                                ${headline ? `<div class="contact-headline">${headline}</div>` : ''}
                            </div>
                        </div>
                        
                        <div class="contact-meta">
                            ${company ? `
                                <div class="contact-meta-item">
                                    <i class="fas fa-building"></i>
                                    <span>${company}</span>
                                </div>
                            ` : ''}
                            ${position ? `
                                <div class="contact-meta-item">
                                    <i class="fas fa-briefcase"></i>
                                    <span>${position}</span>
                                </div>
                            ` : ''}
                            ${location ? `
                                <div class="contact-meta-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>${location}</span>
                                </div>
                            ` : ''}
                            ${connections > 0 ? `
                                <div class="contact-meta-item">
                                    <i class="fas fa-users"></i>
                                    <span>${connections.toLocaleString()} connections</span>
                                </div>
                            ` : ''}
                            ${email ? `
                                <div class="contact-meta-item">
                                    <i class="fas fa-envelope"></i>
                                    <span>${email}</span>
                                </div>
                            ` : ''}
                            <div class="contact-meta-item">
                                <i class="fab fa-linkedin"></i>
                                <span>${contact.accountName || 'Unknown Account'}</span>
                            </div>
                        </div>
                        
                        ${contact.profileUrl ? `
                            <a href="${contact.profileUrl}" target="_blank" class="linkedin-link" onclick="event.stopPropagation()">
                                <i class="fab fa-linkedin"></i>
                                View LinkedIn Profile
                            </a>
                        ` : ''}
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;

            // Display pagination
            displayPagination(totalPages);
        }

        // Display pagination
        function displayPagination(totalPages) {
            const paginationContainer = document.getElementById('paginationContainer');
            
            if (totalPages <= 1) {
                paginationContainer.style.display = 'none';
                return;
            }

            paginationContainer.style.display = 'flex';
            let html = '';

            // Previous button
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                <i class="fas fa-chevron-left"></i>
            </button>`;

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<button disabled>...</button>`;
                }
            }

            // Next button
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                <i class="fas fa-chevron-right"></i>
            </button>`;

            paginationContainer.innerHTML = html;
        }

        // Change page
        window.changePage = function(page) {
            currentPage = page;
            displayContacts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Update statistics
        function updateStats() {
            const totalContacts = contacts.length;
            
            // Get unique accounts
            const uniqueAccounts = new Set(contacts.map(c => c.linkedInAccountId).filter(Boolean));
            
            // Get unique customers
            const uniqueCustomers = new Set(contacts.map(c => c.customerId).filter(Boolean));

            document.getElementById('totalContacts').textContent = totalContacts;
            document.getElementById('totalAccounts').textContent = uniqueAccounts.size;
            document.getElementById('totalCustomers').textContent = uniqueCustomers.size;
        }

        // Test connection to backend
        window.testConnection = async function() {
            const testButton = document.getElementById('testButton');
            
            try {
                testButton.disabled = true;
                testButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Testing...';
                
                addLog('info', `Testing connection to: ${BACKEND_URL}`);
                
                // Test basic connectivity
                const startTime = Date.now();
                const response = await fetch(`${BACKEND_URL}/heyreach/contacts/stats`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const endTime = Date.now();
                
                addLog('info', `Response received in ${endTime - startTime}ms`);
                addLog('info', `Status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    addLog('error', `Error response: ${errorText}`);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                addLog('success', `✅ Connection successful! Backend is reachable.`);
                addLog('info', `Response: ${JSON.stringify(data)}`);
                showAlert('✅ Backend connection successful!', 'success');
                
            } catch (error) {
                console.error('❌ Connection test failed:', error);
                addLog('error', `Connection failed: ${error.message}`);
                
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    addLog('error', 'This could be a CORS issue or the backend is not responding.');
                    addLog('info', 'Check: 1) Backend is running, 2) CORS is configured, 3) URL is correct');
                    showAlert('❌ Cannot reach backend. Check console logs for details.', 'danger');
                } else {
                    showAlert('❌ Connection test failed: ' + error.message, 'danger');
                }
            } finally {
                testButton.disabled = false;
                testButton.innerHTML = '<i class="fas fa-plug"></i> Test Connection';
            }
        };

        // Trigger manual sync
        window.triggerManualSync = async function() {
            const syncButton = document.getElementById('syncButton');
            
            try {
                syncButton.disabled = true;
                syncButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...';
                
                addLog('info', 'Triggering manual contacts sync...');
                addLog('info', `URL: ${BACKEND_URL}/heyreach/contacts/sync`);
                document.getElementById('syncStatusText').textContent = 'Syncing...';
                document.getElementById('syncStatus').style.display = 'flex';

                const startTime = Date.now();
                const response = await fetch(`${BACKEND_URL}/heyreach/contacts/sync`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const endTime = Date.now();

                addLog('info', `Response received in ${endTime - startTime}ms`);
                addLog('info', `Status: ${response.status} ${response.statusText}`);

                if (!response.ok) {
                    const errorText = await response.text();
                    addLog('error', `Error response: ${errorText}`);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                addLog('info', `Response data: ${JSON.stringify(data)}`);
                
                if (data.success) {
                    addLog('success', `Sync completed! Total: ${data.results.totalContacts}, New: ${data.results.newContacts}, Updated: ${data.results.updatedContacts}`);
                    
                    if (data.results.errors && data.results.errors.length > 0) {
                        data.results.errors.forEach(error => {
                            addLog('error', `${error.customer}: ${error.error}`);
                        });
                    }
                    
                    // Display backend logs if available
                    if (data.results.logs && data.results.logs.length > 0) {
                        data.results.logs.forEach(log => {
                            addLog('info', log);
                        });
                    }
                    
                    showAlert(`Sync completed! ${data.results.totalContacts} contacts synced.`, 
                             data.results.errors && data.results.errors.length > 0 ? 'warning' : 'success');
                    
                    // Update last sync time
                    document.getElementById('lastSyncTime').textContent = new Date().toLocaleString();
                    document.getElementById('syncStatusText').textContent = 'Complete';
                    
                    // Refresh contacts
                    await loadContacts();
                } else {
                    throw new Error(data.error || 'Sync failed');
                }
                
            } catch (error) {
                console.error('❌ Error syncing contacts:', error);
                addLog('error', `Sync error: ${error.message}`);
                
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    addLog('error', 'This could be a CORS issue or the backend is not responding.');
                    addLog('info', 'Try the "Test Connection" button first to diagnose the issue.');
                }
                
                showAlert('Sync error: ' + error.message, 'danger');
                document.getElementById('syncStatusText').textContent = 'Error';
            } finally {
                syncButton.disabled = false;
                syncButton.innerHTML = '<i class="fas fa-sync-alt"></i> Sync Contacts Now';
            }
        };

        // Export data to CSV
        window.exportData = function() {
            if (filteredContacts.length === 0) {
                showAlert('No data to export', 'warning');
                return;
            }

            const csvData = [
                ['Name', 'Company', 'Position', 'Headline', 'Location', 'Email', 'Connections', 'LinkedIn URL', 'Account', 'Customer']
            ];

            filteredContacts.forEach(contact => {
                const fullName = `${contact.firstName || ''} ${contact.lastName || ''}`.trim();
                
                csvData.push([
                    fullName,
                    contact.companyName || '',
                    contact.position || '',
                    contact.headline || '',
                    contact.location || '',
                    contact.emailAddress || '',
                    contact.connections || 0,
                    contact.profileUrl || '',
                    contact.accountName || '',
                    contact.customerName || ''
                ]);
            });

            const csvContent = csvData.map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `heyreach_contacts_${formatDate(new Date())}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);

            addLog('success', 'Data exported successfully');
            showAlert('Data exported successfully', 'success');
        };

        // Open LinkedIn profile
        window.openLinkedInProfile = function(profileUrl) {
            if (profileUrl) {
                window.open(profileUrl, '_blank');
            }
        };

        // Add log entry
        function addLog(level, message) {
            const logsContainer = document.getElementById('logsContainer');
            const timestamp = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="log-level ${level}">[${level.toUpperCase()}]</span>
                <span>${message}</span>
            `;
            
            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        // Clear logs
        window.clearLogs = function() {
            const logsContainer = document.getElementById('logsContainer');
            logsContainer.innerHTML = `
                <div class="log-entry">
                    <span class="log-timestamp">[--:--:--]</span>
                    <span class="log-level info">[INFO]</span>
                    <span>Logs cleared</span>
                </div>
            `;
        };

        // Utility functions
        function showLoadingContacts() {
            document.getElementById('contactsContainer').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading contacts...</p>
                </div>
            `;
        }

        function hideLoadingContacts() {
            // Loading will be replaced by displayContacts()
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : 'info-circle'}"></i> ${message}`;
            
            document.body.appendChild(alertDiv);
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '9999';
            alertDiv.style.minWidth = '300px';
            alertDiv.style.maxWidth = '500px';
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        function getInitials(firstName, lastName) {
            const first = (firstName || 'U').charAt(0).toUpperCase();
            const last = (lastName || '').charAt(0).toUpperCase();
            return first + (last || '');
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Initialize when page loads
        initialize();
    </script>
</body>
</html>
