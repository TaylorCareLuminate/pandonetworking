<body>
    <div class="page-header">

    <div class="container">
        <!-- Scan Controls -->
        <div class="scan-controls">

                <div class="col-md-8">
                    <div class="campaign-selector">
                        <label for="campaignSelect" class="form-label">

        <!-- Statistics -->

    <!-- Load centralized auth system -->
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    <script src="../js/folder-protection.js"></script>

    <script type="module">
        console.log('📄 Data Cleanup Tool - Railway Integration v2.0');
        
        // Wait for Firebase to be ready
        await window.firebaseReady;
        
        // Verify CLEmail wrapper is loaded
        if (!window.clemailFirestore || !window.clemailDb) {
            console.error('❌ CLEmail Firestore Wrapper not loaded! Please clear browser cache and refresh.');
            alert('Error: CLEmail wrapper not loaded. Please clear your browser cache (Ctrl+Shift+R) and refresh the page.');
            throw new Error('CLEmail wrapper not loaded');
        }
        
        // Use CLEmail secure wrapper instead of direct Firebase SDK
        const { collection, getDocs, getDoc, doc, updateDoc, setDoc, query, where, writeBatch } = window.clemailFirestore;
        const db = window.clemailDb;
        
        console.log('🔒 Using CLEmail secure wrapper');

        // Protect CRM folder
        await window.protectFolder('crm');

        // Global variables
        let campaigns = [];
        let outreachSets = [];
        let issuesFound = [];
        let currentScanCampaignId = null;

        // Initialize page
        console.log('🚀 Initializing Data Cleanup Tool...');
        await loadCampaigns();
        showAlert('Data Cleanup Tool loaded successfully. Select a campaign to scan for mojibake issues.', 'info');

        // Load campaigns from Firebase
        async function loadCampaigns() {
            try {
                const campaignsRef = collection(db, 'campaigns');
                const campaignsSnapshot = await getDocs(campaignsRef);
                
                campaigns = [];
                campaignsSnapshot.forEach(doc => {
                    campaigns.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Populate campaign selector
                const campaignSelect = document.getElementById('campaignSelect');
                campaignSelect.innerHTML = '<option value="">Select a campaign to scan...</option>';
                
                campaigns.forEach(campaign => {
                    const option = document.createElement('option');
                    option.value = campaign.id;
                    option.textContent = `${campaign.name || 'Unnamed Campaign'} (ID: ${campaign.id})`;
                    campaignSelect.appendChild(option);
                });

                console.log(`✅ Loaded ${campaigns.length} campaigns`);
            } catch (error) {
                console.error('❌ Error loading campaigns:', error);
                showAlert('Error loading campaigns: ' + error.message, 'danger');
            }
        }

        // Clean mojibake (garbled text) from input - EXACT COPY from review_approval.html
        function cleanMojibake(text) {
            if (!text) return text;
            
            let cleaned = text;
            
            // Use the EXACT same approach as the working review tool
            // Fix common mojibake patterns using simple string replacements for the exact patterns seen
            // IMPORTANT: Order matters! Longer patterns must come BEFORE shorter ones to avoid partial matches
            
            // Method 1: Direct text pattern replacement (for patterns seen in data)
            // Use simple string replacement to avoid regex issues. Order matters: specific before generic.
            // Use character codes to avoid syntax errors with mojibake characters
            cleaned = cleaned.split(String.fromCharCode(65533)).join("'");  // � replacement character
            cleaned = cleaned.split(String.fromCharCode(226, 128, 148)).join('—');  // em dash â€"
            cleaned = cleaned.split(String.fromCharCode(226, 128, 147)).join('–');  // en dash â€"
            cleaned = cleaned.split(String.fromCharCode(226, 128, 145)).join('-');  // hyphen â€' (21â€'monthâ€'old pattern)
            cleaned = cleaned.split(String.fromCharCode(226, 128, 156)).join('"');  // left double quote â€œ
            cleaned = cleaned.split(String.fromCharCode(226, 128, 157)).join('"');  // right double quote â€
            cleaned = cleaned.split(String.fromCharCode(226, 128, 152)).join("'");  // left single quote â€˜
            cleaned = cleaned.split(String.fromCharCode(226, 128, 153)).join("'");  // right single quote â€™
            cleaned = cleaned.split(String.fromCharCode(226, 128, 162)).join('•');  // bullet â€¢
            cleaned = cleaned.split(String.fromCharCode(226, 128, 166)).join('…');  // ellipsis â€¦
            cleaned = cleaned.split(String.fromCharCode(194, 160)).join(' ');       // non-breaking space Â
            cleaned = cleaned.split(String.fromCharCode(226, 130, 172)).join('€');  // euro â‚¬
            cleaned = cleaned.split(String.fromCharCode(226, 132, 162)).join('™');  // trademark â„¢
            
            // Additional patterns found in the data using string literals for longer sequences
            cleaned = cleaned.split('Ã¢â‚¬â„¢').join("'");  // right single quote (different encoding)
            cleaned = cleaned.split('Ã¢â‚¬â€�').join('—');  // em dash (different encoding)
            cleaned = cleaned.split('Ã¢â‚¬â€œ').join('–');  // en dash (different encoding)
            cleaned = cleaned.split('Ã¢â‚¬â€™').join('-');  // hyphen/dash (different encoding for â€')
            
            // Additional regex-based cleanup for remaining patterns (from working review_approval.html)
            cleaned = cleaned
                .replace(/Ã¢â‚¬[â„¢Â]/g, "'")  // Various apostrophe encodings
                .replace(/â€[œ]/g, '"')        // Left double quote
                .replace(/â€[]/g, '"')         // Right double quote
                .replace(/Ã‚Â/g, ' ')          // Non-breaking space
                .replace(/Â/g, ' ')            // Non-breaking space
                .replace(/â€¦/g, '...')        // Ellipsis
                .replace(/â€¢/g, '•')          // Bullet
                .replace(/â€'/g, '-')          // Hyphen/dash pattern that might be causing issues
                .replace(/â€™/g, '-')          // Alternative hyphen/dash encoding
                .replace(/Ã¢â‚¬â€™/g, '-')     // Multi-byte hyphen/dash encoding
                .replace(/â€['']/g, '-');      // Catch various dash-like characters
            
            // Use character codes for bulletproof mojibake cleaning
            // IMPORTANT: Process longer patterns FIRST to avoid partial matches
            const replacements = [
                // Unicode replacement character (�) - often replaces apostrophes
                [String.fromCharCode(65533), "'"], // � (U+FFFD) replacement character
                // 3-byte sequences (must come first)
                [String.fromCharCode(226, 128, 148), '—'], // em dash â€"
                [String.fromCharCode(226, 128, 147), '–'], // en dash â€"
                [String.fromCharCode(226, 128, 145), '-'], // hyphen â€' (21â€'monthâ€'old pattern)
                [String.fromCharCode(226, 128, 156), '"'], // left double quote â€œ
                [String.fromCharCode(226, 128, 157), '"'], // right double quote â€
                [String.fromCharCode(226, 128, 152), String.fromCharCode(8216)], // left single quote â€˜
                [String.fromCharCode(226, 128, 153), String.fromCharCode(8217)], // right single quote â€™
                [String.fromCharCode(226, 128, 162), '•'], // bullet â€¢
                [String.fromCharCode(226, 128, 166), '…'], // ellipsis â€¦
                [String.fromCharCode(226, 130, 172), '€'], // euro â‚¬
                [String.fromCharCode(226, 132, 162), '™'], // trademark â„¢
                // 2-byte sequences (must come after 3-byte)
                [String.fromCharCode(194, 160), ' '], // non-breaking space Â
            ];
            
            // Apply replacements in order - longer patterns first
            replacements.forEach(([mojibakePattern, correctChar]) => {
                // Use multiple passes to catch nested mojibake
                let maxPasses = 5;
                let passCount = 0;
                while (cleaned.indexOf(mojibakePattern) !== -1 && passCount < maxPasses) {
                    const beforeLength = cleaned.length;
                    cleaned = cleaned.split(mojibakePattern).join(correctChar);
                    passCount++;
                    
                    // Debug: Log each replacement
                    if (beforeLength !== cleaned.length) {
                        console.log(`🔧 Replaced mojibake pattern (pass ${passCount}):`, {
                            pattern: [...mojibakePattern].map(c => c.charCodeAt(0)),
                            replacement: correctChar,
                            newLength: cleaned.length
                        });
                    }
                }
            });
            
            // Debug: Show before/after for verification
            if (text !== cleaned) {
                console.log('🧹 Mojibake cleaning result:', {
                    original: text.substring(0, 50) + (text.length > 50 ? '...' : ''),
                    cleaned: cleaned.substring(0, 50) + (cleaned.length > 50 ? '...' : ''),
                    actuallyChanged: text !== cleaned,
                    originalLength: text.length,
                    cleanedLength: cleaned.length
                });
            }
            
            return cleaned;
        }

        // Check if text contains mojibake
        function hasMojibake(text) {
            if (!text || typeof text !== 'string') return false;
            
            // Multiple detection methods for comprehensive coverage
            
            // Method 1: Check for common mojibake byte sequences
            const mojibakePatterns = [
                String.fromCharCode(65533), // � (U+FFFD) replacement character
                String.fromCharCode(226, 128, 148), // em dash â€"
                String.fromCharCode(226, 128, 147), // en dash â€"
                String.fromCharCode(226, 128, 145), // hyphen â€' (21â€'monthâ€'old pattern)
                String.fromCharCode(226, 128, 156), // left double quote â€œ
                String.fromCharCode(226, 128, 157), // right double quote â€
                String.fromCharCode(226, 128, 152), // left single quote â€˜
                String.fromCharCode(226, 128, 153), // right single quote â€™
                String.fromCharCode(226, 128, 162), // bullet â€¢
                String.fromCharCode(226, 128, 166), // ellipsis â€¦
                String.fromCharCode(194, 160), // non-breaking space Â
                String.fromCharCode(226, 130, 172), // euro â‚¬
                String.fromCharCode(226, 132, 162)  // trademark â„¢
            ];
            
            // Method 2: Check for common mojibake text patterns
            const textPatterns = [
                String.fromCharCode(65533), // � (U+FFFD) replacement character
                String.fromCharCode(226, 128, 148), // em dash â€"
                String.fromCharCode(226, 128, 147), // en dash â€"
                String.fromCharCode(226, 128, 145), // hyphen â€' (21â€'monthâ€'old pattern)
                String.fromCharCode(226, 128, 156), // left double quote â€œ
                String.fromCharCode(226, 128, 157), // right double quote â€
                String.fromCharCode(226, 128, 152), // left single quote â€˜
                String.fromCharCode(226, 128, 153), // right single quote â€™
                String.fromCharCode(226, 128, 162), // bullet â€¢
                String.fromCharCode(226, 128, 166), // ellipsis â€¦
                String.fromCharCode(194, 160),      // non-breaking space Â
                String.fromCharCode(226, 130, 172), // euro â‚¬
                String.fromCharCode(226, 132, 162)  // trademark â„¢
            ];
            
            // Method 3: Check for suspicious character sequences (â followed by €)
            const suspiciousSequences = text.includes('â€');
            
            const hasBytePattern = mojibakePatterns.some(pattern => text.includes(pattern));
            const hasTextPattern = textPatterns.some(pattern => text.includes(pattern));
            
            const result = hasBytePattern || hasTextPattern || suspiciousSequences;
            
            // Debug logging for first few detections
            if (result && Math.random() < 0.1) { // Log 10% of detections to avoid spam
                console.log('🔍 Mojibake detection details:', {
                    text: text.substring(0, 50) + '...',
                    hasBytePattern,
                    hasTextPattern,
                    suspiciousSequences,
                    charCodes: [...text.substring(0, 30)].map(c => c.charCodeAt(0))
                });
            }
            
            return result;
        }

        // Scan campaign for mojibake issues
        window.scanCampaign = async function() {
            const campaignId = document.getElementById('campaignSelect').value;
            if (!campaignId) {
                showAlert('Please select a campaign to scan.', 'warning');
                return;
            }

            currentScanCampaignId = campaignId;
            const campaign = campaigns.find(c => c.id === campaignId);
            const campaignName = campaign?.name || 'Unknown Campaign';

            // Reset UI
            issuesFound = [];
            document.getElementById('statsGrid').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('progressSection').style.display = 'none';

            // Update button state
            const scanButton = document.getElementById('scanButton');
            scanButton.disabled = true;
            scanButton.innerHTML = '<span class="loading-spinner"></span> Scanning...';

            try {
                console.log(`🔍 Scanning campaign "${campaignName}" (${campaignId}) for mojibake issues...`);
                showAlert(`Scanning campaign "${campaignName}" for mojibake issues...`, 'info');

                // Load outreach sets for this campaign
                const outreachSetsRef = collection(db, 'outreach_sets');
                const q = query(outreachSetsRef, where('campaignId', '==', campaignId));
                const querySnapshot = await getDocs(q);

                outreachSets = [];
                querySnapshot.forEach(doc => {
                    outreachSets.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log(`📊 Found ${outreachSets.length} contacts in campaign`);

                // Scan each contact for mojibake issues
                const includeCustomFields = document.getElementById('includeCustomFields').checked;
                const includeBasicFields = document.getElementById('includeBasicFields').checked;

                let totalIssues = 0;
                let contactsWithIssues = 0;

                // Debug: Show sample contact data
                if (outreachSets.length > 0) {
                    const sampleContact = outreachSets[0];
                    console.log('🔍 Sample contact structure:', {
                        id: sampleContact.id,
                        firstName: sampleContact.firstName,
                        lastName: sampleContact.lastName,
                        title: sampleContact.title,
                        prospectOrgName: sampleContact.prospectOrgName,
                        customFields: sampleContact.customFields,
                        customFieldsKeys: sampleContact.customFields ? Object.keys(sampleContact.customFields) : 'none',
                        allKeys: Object.keys(sampleContact)
                    });

                    // Show some sample values with character analysis
                    if (sampleContact.customFields) {
                        Object.keys(sampleContact.customFields).slice(0, 3).forEach(key => {
                            const value = sampleContact.customFields[key];
                            if (typeof value === 'string' && value.length > 0) {
                                console.log(`🔍 Sample field "${key}":`, {
                                    value: value.substring(0, 100),
                                    length: value.length,
                                    hasAcute: value.includes('â'),
                                    hasEuro: value.includes('€'),
                                    charCodes: [...value.substring(0, 20)].map(c => c.charCodeAt(0)),
                                    hasMojibakeDetected: hasMojibake(value)
                                });
                            }
                        });
                    }
                }

                outreachSets.forEach((contact, contactIndex) => {
                    const contactIssues = [];

                    // Scan basic fields
                    if (includeBasicFields) {
                        const basicFields = ['firstName', 'lastName', 'title', 'prospectOrgName'];
                        basicFields.forEach(field => {
                            const value = contact[field];
                            if (hasMojibake(value)) {
                                console.log(`🐛 Found mojibake in ${contact.id} basic field ${field}:`, value);
                                contactIssues.push({
                                    contactId: contact.id,
                                    contactName: `${contact.firstName || ''} ${contact.lastName || ''}`.trim() || 'Unknown',
                                    contactCompany: contact.prospectOrgName || 'Unknown Company',
                                    field: field,
                                    fieldPath: field,
                                    currentValue: value,
                                    fixedValue: cleanMojibake(value),
                                    isCustomField: false
                                });
                            }
                        });
                    }

                    // Scan custom fields
                    if (includeCustomFields && contact.customFields) {
                        Object.keys(contact.customFields).forEach(field => {
                            const value = contact.customFields[field];
                            if (hasMojibake(value)) {
                                console.log(`🐛 Found mojibake in ${contact.id} custom field ${field}:`, value);
                                contactIssues.push({
                                    contactId: contact.id,
                                    contactName: `${contact.firstName || ''} ${contact.lastName || ''}`.trim() || 'Unknown',
                                    contactCompany: contact.prospectOrgName || 'Unknown Company',
                                    field: `customFields.${field}`,
                                    fieldPath: `customFields.${field}`,
                                    currentValue: value,
                                    fixedValue: cleanMojibake(value),
                                    isCustomField: true
                                });
                            }
                        });
                    }

                    if (contactIssues.length > 0) {
                        contactsWithIssues++;
                        totalIssues += contactIssues.length;
                        issuesFound.push(...contactIssues);
                    }

                    // Debug: Show progress every 50 contacts
                    if (contactIndex % 50 === 0) {
                        console.log(`📊 Scanned ${contactIndex + 1}/${outreachSets.length} contacts, found ${totalIssues} issues so far`);
                    }
                });

                // Update statistics
                document.getElementById('totalContacts').textContent = outreachSets.length;
                document.getElementById('contactsWithIssues').textContent = contactsWithIssues;
                document.getElementById('totalIssues').textContent = totalIssues;
                document.getElementById('issuesFixed').textContent = 0;
                document.getElementById('statsGrid').style.display = 'grid';

                // Display results
                if (totalIssues > 0) {
                    displayIssues();
                    document.getElementById('resultsSection').style.display = 'block';
                    document.getElementById('fixAllButton').disabled = false;
                    showAlert(`Found ${totalIssues} mojibake issues in ${contactsWithIssues} contacts. Review and fix them below.`, 'warning');
                } else {
                    showAlert(`✅ Great! No mojibake issues found in campaign "${campaignName}".`, 'success');
                }

                console.log(`✅ Scan complete: ${totalIssues} issues found in ${contactsWithIssues} contacts`);

            } catch (error) {
                console.error('❌ Error scanning campaign:', error);
                showAlert('Error scanning campaign: ' + error.message, 'danger');
            } finally {
                // Reset button state
                scanButton.disabled = false;
                scanButton.innerHTML = '<i class="fas fa-search"></i> Scan for Issues';
            }
        };

        // Display issues in table
        function displayIssues() {
            const tbody = document.getElementById('issuesTableBody');
            tbody.innerHTML = '';

            issuesFound.forEach((issue, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="contact-info">
                            <strong>${issue.contactName}</strong><br>
                            <small>${issue.contactCompany}</small>
                        </div>
                    </td>
                    <td>
                        <span class="field-name">${issue.field}</span>
                    </td>
                    <td>
                        <div class="mojibake-example">
                            ${issue.currentValue.substring(0, 100)}${issue.currentValue.length > 100 ? '...' : ''}
                        </div>
                    </td>
                    <td>
                        <div class="fixed-example-container">
                            <textarea class="form-control fixed-value-editor" id="fixedValue${index}" rows="3" style="font-family: monospace; font-size: 0.9rem;">${issue.fixedValue}</textarea>
                            <small class="text-muted">You can edit this value before fixing</small>
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-sm fix-button" onclick="fixSingleIssue(${index})" id="fixBtn${index}">
                            <i class="fas fa-magic"></i> Fix
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Helper function to convert dot notation to nested object
        function buildNestedUpdate(fieldPath, value) {
            const parts = fieldPath.split('.');
            if (parts.length === 1) {
                // Simple field, no nesting
                return { [fieldPath]: value };
            }
            
            // For nested fields like "customFields.fieldName"
            // We need to fetch the current document, update the nested field, and save the whole object
            return null; // Signal that we need special handling
        }

        // Fix single issue
        window.fixSingleIssue = async function(issueIndex) {
            const issue = issuesFound[issueIndex];
            if (!issue) return;

            const fixButton = document.getElementById(`fixBtn${issueIndex}`);
            const fixedValueTextarea = document.getElementById(`fixedValue${issueIndex}`);
            
            // Get the manually edited value from the textarea
            const manuallyEditedValue = fixedValueTextarea.value;
            
            fixButton.disabled = true;
            fixButton.innerHTML = '<span class="loading-spinner"></span>';

            try {
                const contactRef = doc(db, 'outreach_sets', issue.contactId);
                
                // For nested fields (like customFields.fieldName), we need to:
                // 1. Fetch the current document
                // 2. Update the nested field in memory
                // 3. Save the entire object back
                
                if (issue.fieldPath.includes('.')) {
                    // Nested field - need to fetch, modify, and save entire object
                    const contactSnap = await getDoc(contactRef);
                    if (!contactSnap.exists) {
                        throw new Error('Contact document not found');
                    }
                    
                    const contactData = { ...contactSnap.data() }; // Clone the data
                    const parts = issue.fieldPath.split('.');
                    
                    // Navigate to the nested field and update it
                    let current = contactData;
                    for (let i = 0; i < parts.length - 1; i++) {
                        if (!current[parts[i]]) {
                            current[parts[i]] = {};
                        }
                        current = current[parts[i]];
                    }
                    current[parts[parts.length - 1]] = manuallyEditedValue;
                    
                    // Add metadata
                    contactData.updatedAt = new Date();
                    contactData.lastCleanedAt = new Date();
                    contactData.cleanedBy = 'mojibake_cleanup_tool_manual_edit';
                    
                    // Save the entire document
                    await setDoc(contactRef, contactData);
                } else {
                    // Simple field - can update directly
                    const updateData = {};
                    updateData[issue.fieldPath] = manuallyEditedValue;
                    updateData.updatedAt = new Date();
                    updateData.lastCleanedAt = new Date();
                    updateData.cleanedBy = 'mojibake_cleanup_tool_manual_edit';
                    
                    await updateDoc(contactRef, updateData);
                }

                // Mark as fixed in UI
                fixButton.innerHTML = '<i class="fas fa-check"></i> Fixed';
                fixButton.classList.remove('fix-button');
                fixButton.classList.add('btn-success');
                
                // Disable the textarea since it's been fixed
                fixedValueTextarea.disabled = true;
                fixedValueTextarea.style.backgroundColor = '#e9ecef';
                
                // Update statistics
                const currentFixed = parseInt(document.getElementById('issuesFixed').textContent);
                document.getElementById('issuesFixed').textContent = currentFixed + 1;

                console.log(`✅ Fixed issue in ${issue.contactName} - ${issue.field} with value: "${manuallyEditedValue}"`);

            } catch (error) {
                console.error('❌ Error fixing issue:', error);
                showAlert(`Error fixing issue for ${issue.contactName}: ${error.message}`, 'danger');
                
                // Reset button
                fixButton.disabled = false;
                fixButton.innerHTML = '<i class="fas fa-magic"></i> Fix';
            }
        };

        // Fix all issues
        window.fixAllIssues = async function() {
            if (issuesFound.length === 0) return;

            const fixAllButton = document.getElementById('fixAllButton');
            fixAllButton.disabled = true;
            fixAllButton.innerHTML = '<span class="loading-spinner"></span> Fixing All...';

            // Show progress section
            document.getElementById('progressSection').style.display = 'block';
            
            try {
                console.log(`🔧 Starting batch fix of ${issuesFound.length} issues...`);
                showAlert(`Fixing ${issuesFound.length} issues in batch. This may take a moment...`, 'info');

                let fixed = 0;
                const total = issuesFound.length;

                // Group issues by contact
                const contactUpdates = {};
                issuesFound.forEach((issue, index) => {
                    if (!contactUpdates[issue.contactId]) {
                        contactUpdates[issue.contactId] = {
                            contactName: issue.contactName,
                            fieldUpdates: [] // Store as array of {path, value} objects
                        };
                    }
                    // Get the manually edited value from the textarea
                    const fixedValueTextarea = document.getElementById(`fixedValue${index}`);
                    const manuallyEditedValue = fixedValueTextarea ? fixedValueTextarea.value : issue.fixedValue;
                    contactUpdates[issue.contactId].fieldUpdates.push({
                        fieldPath: issue.fieldPath,
                        value: manuallyEditedValue
                    });
                });

                // Process each contact
                for (const contactId of Object.keys(contactUpdates)) {
                    const contactUpdate = contactUpdates[contactId];
                    
                    try {
                        const contactRef = doc(db, 'outreach_sets', contactId);
                        
                        // Fetch the current document
                        const contactSnap = await getDoc(contactRef);
                        if (!contactSnap.exists) {
                            console.error(`❌ Contact ${contactId} not found`);
                            continue;
                        }
                        
                        const contactData = { ...contactSnap.data() }; // Clone the data
                        
                        // Apply all field updates to the document
                        contactUpdate.fieldUpdates.forEach(({fieldPath, value}) => {
                            if (fieldPath.includes('.')) {
                                // Nested field - navigate and update
                                const parts = fieldPath.split('.');
                                let current = contactData;
                                for (let i = 0; i < parts.length - 1; i++) {
                                    if (!current[parts[i]]) {
                                        current[parts[i]] = {};
                                    }
                                    current = current[parts[i]];
                                }
                                current[parts[parts.length - 1]] = value;
                            } else {
                                // Simple field
                                contactData[fieldPath] = value;
                            }
                        });
                        
                        // Add metadata
                        contactData.updatedAt = new Date();
                        contactData.lastCleanedAt = new Date();
                        contactData.cleanedBy = 'mojibake_cleanup_tool';

                        // Save the entire document
                        await setDoc(contactRef, contactData);

                        // Count issues fixed for this contact
                        const issuesForContact = issuesFound.filter(i => i.contactId === contactId).length;
                        fixed += issuesForContact;

                        // Update progress
                        const progressPercent = Math.round((fixed / total) * 100);
                        const progressBar = document.getElementById('progressBar');
                        const progressText = document.getElementById('progressText');
                        
                        progressBar.style.width = progressPercent + '%';
                        progressBar.textContent = progressPercent + '%';
                        progressText.textContent = `Fixed ${fixed} of ${total} issues...`;

                        console.log(`✅ Fixed ${issuesForContact} issues for ${contactUpdate.contactName}`);

                    } catch (error) {
                        console.error(`❌ Error fixing issues for contact ${contactId}:`, error);
                    }
                }

                // Update final statistics
                document.getElementById('issuesFixed').textContent = fixed;

                // Update all fix buttons and textareas to show as fixed
                issuesFound.forEach((issue, index) => {
                    const fixButton = document.getElementById(`fixBtn${index}`);
                    const fixedValueTextarea = document.getElementById(`fixedValue${index}`);
                    
                    if (fixButton) {
                        fixButton.innerHTML = '<i class="fas fa-check"></i> Fixed';
                        fixButton.classList.remove('fix-button');
                        fixButton.classList.add('btn-success');
                        fixButton.disabled = true;
                    }
                    
                    if (fixedValueTextarea) {
                        fixedValueTextarea.disabled = true;
                        fixedValueTextarea.style.backgroundColor = '#e9ecef';
                    }
                });

                showAlert(`🎉 Successfully fixed ${fixed} mojibake issues! The source data in Firebase has been cleaned.`, 'success');
                console.log(`✅ Batch fix complete: ${fixed} issues fixed`);

            } catch (error) {
                console.error('❌ Error in batch fix:', error);
                showAlert('Error during batch fix: ' + error.message, 'danger');
            } finally {
                // Reset fix all button
                fixAllButton.innerHTML = '<i class="fas fa-check-double"></i> All Fixed';
                fixAllButton.classList.remove('fix-button');
                fixAllButton.classList.add('btn-success');
            }
        };

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alertsContainer');
            const alertId = 'alert_' + Date.now();
            
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" id="${alertId}" role="alert">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            alertsContainer.insertAdjacentHTML('beforeend', alertHtml);
            
            // Auto-remove after 10 seconds for info/success alerts
            if (type === 'info' || type === 'success') {
                setTimeout(() => {
                    const alertElement = document.getElementById(alertId);
                    if (alertElement) {
                        alertElement.remove();
                    }
                }, 10000);
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
