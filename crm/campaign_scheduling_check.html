<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Scheduling Check - CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .page-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .section {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--secondary);
        }

        .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .info-card {
            background: var(--light-gray);
            padding: 1rem;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--primary);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary);
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            margin-left: 1rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid white;
            box-shadow: 0 0 0 2px var(--border);
        }

        .timeline-item.correct::before {
            background: var(--success);
        }

        .timeline-item.incorrect::before {
            background: var(--danger);
        }

        .timeline-item.correct {
            border-color: var(--success);
            background: #f0fdf4;
        }

        .timeline-item.incorrect {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .timeline-day {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .timeline-channel {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .channel-email {
            background: #fee2e2;
            color: #dc2626;
        }

        .channel-linkedin {
            background: #dbeafe;
            color: #2563eb;
        }

        .channel-phone {
            background: #d1fae5;
            color: #059669;
        }

        .timeline-content {
            margin-top: 0.75rem;
        }

        .timeline-label {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.25rem;
        }

        .timeline-detail {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .status-correct {
            background: var(--success);
            color: white;
        }

        .status-incorrect {
            background: var(--danger);
            color: white;
        }

        .status-missing {
            background: var(--warning);
            color: white;
        }

        .alert {
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .alert-warning {
            background: #fffbeb;
            border: 1px solid #fed7aa;
            color: #92400e;
        }

        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .loading i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value.correct { color: var(--success); }
        .stat-value.incorrect { color: var(--danger); }
        .stat-value.total { color: var(--primary); }
    </style>

<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fas fa-calendar-check"></i>
                Campaign Scheduling Check
            </h1>
            <p>Verify that all activities for a contact are scheduled on the correct campaign days</p>
        </div>

        <!-- Selection Section -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-search"></i>
                Select Contact
            </div>

            <div class="form-group">
                <label class="form-label">Campaign</label>
                <select id="campaignSelect" class="form-select" onchange="loadOutreachSets()">
                    <option value="">Select a campaign...</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Contact</label>
                <select id="contactSelect" class="form-select" onchange="analyzeScheduling()" disabled>
                    <option value="">Select a contact...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400; cursor: pointer;">
                    <input type="checkbox" id="emailOnlyFilter" onchange="filterContacts()" style="cursor: pointer;">
                    <span>Show only contacts with email addresses</span>
                </label>
            </div>

            <button class="btn btn-primary" onclick="analyzeScheduling()" id="analyzeBtn" disabled>
                <i class="fas fa-check-double"></i>
                Analyze Scheduling
            </button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" style="display: none;">
            <!-- Summary Stats -->
            <div class="summary-stats" id="summaryStats"></div>

            <!-- Contact Info -->
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-info-circle"></i>
                    Contact Information
                </div>
                <div class="info-grid" id="outreachSetInfo"></div>
            </div>

            <!-- Timeline -->
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-timeline"></i>
                    Scheduled Activities Timeline
                </div>
                <div id="timelineContainer"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDGESh2UQT4awIg9Y3kBcZPN-aaWthC1k4",
            authDomain: "clemail.firebaseapp.com",
            databaseURL: "https://clemail-default-rtdb.firebaseio.com",
            projectId: "clemail",
            storageBucket: "clemail.firebasestorage.app",
            messagingSenderId: "762477610174",
            appId: "1:762477610174:web:8547f62e6d9f3b819acaef",
            measurementId: "G-EFW8G912Y7"
        };

        // Initialize Firebase
        let app, db;
        const existingApps = getApps();
        const existingApp = existingApps.find(a => a.name === 'scheduling-check');

        if (existingApp) {
            app = existingApp;
        } else {
            app = initializeApp(firebaseConfig, 'scheduling-check');
        }

        db = getFirestore(app);

        // Global state
        let campaigns = [];
        let contacts = [];
        let selectedCampaign = null;
        let selectedContact = null;
        
        // Business days helper functions
        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6; // Sunday = 0, Saturday = 6
        }
        
        function addBusinessDays(startDate, businessDays) {
            const result = new Date(startDate);
            let daysAdded = 0;
            
            while (daysAdded < businessDays) {
                result.setDate(result.getDate() + 1);
                if (!isWeekend(result)) {
                    daysAdded++;
                }
            }
            
            return result;
        }
        
        function subtractBusinessDays(startDate, businessDays) {
            const result = new Date(startDate);
            let daysSubtracted = 0;
            
            while (daysSubtracted < businessDays) {
                result.setDate(result.getDate() - 1);
                if (!isWeekend(result)) {
                    daysSubtracted++;
                }
            }
            
            return result;
        }
        
        function businessDaysBetween(date1, date2) {
            const start = new Date(date1);
            const end = new Date(date2);
            let count = 0;
            const current = new Date(start);
            
            while (current < end) {
                current.setDate(current.getDate() + 1);
                if (!isWeekend(current)) {
                    count++;
                }
            }
            
            return count;
        }
        
        // Reconstruct sequence from legacy channel format
        function reconstructSequenceFromChannels(campaign) {
            const sequence = [];
            
            // Add email steps
            if (campaign.channels?.email?.templates) {
                campaign.channels.email.templates.forEach(template => {
                    sequence.push({
                        day: template.day,
                        channel: 'email',
                        type: template.stepType || 'email',
                        subject: template.subject,
                        template: template.template
                    });
                });
            }
            
            // Add LinkedIn steps
            if (campaign.channels?.linkedIn?.activities) {
                campaign.channels.linkedIn.activities.forEach(activity => {
                    sequence.push({
                        day: activity.day,
                        channel: 'linkedin',
                        type: activity.actionType || activity.stepType || 'linkedin_action',
                        template: activity.template
                    });
                });
            }
            
            // Add phone steps
            if (campaign.channels?.phone?.scripts) {
                campaign.channels.phone.scripts.forEach(script => {
                    sequence.push({
                        day: script.day,
                        channel: 'phone',
                        type: script.stepType || 'phone_call',
                        template: script.script
                    });
                });
            }
            
            // Sort by day
            sequence.sort((a, b) => a.day - b.day);
            
            return sequence;
        }

        // Initialize
        async function initialize() {
            console.log('🚀 Initializing Campaign Scheduling Check...');
            await loadCampaigns();
        }

        // Load campaigns
        async function loadCampaigns() {
            try {
                console.log('📋 Loading campaigns...');
                const campaignsSnapshot = await getDocs(collection(db, 'campaigns'));
                campaigns = [];
                
                campaignsSnapshot.forEach((doc) => {
                    campaigns.push({ id: doc.id, ...doc.data() });
                });

                // Populate campaign dropdown
                const campaignSelect = document.getElementById('campaignSelect');
                campaignSelect.innerHTML = '<option value="">Select a campaign...</option>';
                
                campaigns
                    .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                    .forEach(campaign => {
                        const option = document.createElement('option');
                        option.value = campaign.id;
                        option.textContent = campaign.name;
                        campaignSelect.appendChild(option);
                    });

                console.log(`✅ Loaded ${campaigns.length} campaigns`);
            } catch (error) {
                console.error('❌ Error loading campaigns:', error);
                showAlert('Error loading campaigns: ' + error.message, 'danger');
            }
        }

        // Populate contact dropdown with filtering
        function populateContactDropdown() {
            const contactSelect = document.getElementById('contactSelect');
            const emailOnlyFilter = document.getElementById('emailOnlyFilter');
            
            contactSelect.innerHTML = '<option value="">Select a contact...</option>';
            
            let filteredContacts = contacts;
            
            // Apply email filter if checked
            if (emailOnlyFilter && emailOnlyFilter.checked) {
                filteredContacts = contacts.filter(c => c.email && c.email.trim() !== '');
            }
            
            // Sort and populate
            filteredContacts
                .sort((a, b) => {
                    const aDisplay = getContactDisplayName(a);
                    const bDisplay = getContactDisplayName(b);
                    return aDisplay.localeCompare(bDisplay);
                })
                .forEach(contact => {
                    const option = document.createElement('option');
                    option.value = contact.id;
                    option.textContent = getContactDisplayText(contact);
                    contactSelect.appendChild(option);
                });
            
            console.log(`📋 Showing ${filteredContacts.length} of ${contacts.length} contacts`);
        }
        
        // Get a display name for a contact
        function getContactDisplayName(contact) {
            return contact.name || contact.contactName || contact.email || contact.id;
        }
        
        // Get full display text for dropdown
        function getContactDisplayText(contact) {
            const name = contact.name || contact.contactName;
            const email = contact.email;
            const company = contact.company || contact.companyName;
            const title = contact.title || contact.jobTitle;
            
            let parts = [];
            
            if (name) {
                parts.push(name);
            }
            
            if (email) {
                parts.push(email);
            }
            
            if (company) {
                parts.push(`at ${company}`);
            }
            
            if (title) {
                parts.push(`(${title})`);
            }
            
            // Fallback if nothing useful
            if (parts.length === 0) {
                parts.push(contact.id);
            }
            
            return parts.join(' - ');
        }
        
        // Filter contacts when checkbox changes
        window.filterContacts = function() {
            populateContactDropdown();
        };
        
        // Load contacts for selected campaign
        window.loadOutreachSets = async function() {
            const campaignId = document.getElementById('campaignSelect').value;
            const contactSelect = document.getElementById('contactSelect');
            const analyzeBtn = document.getElementById('analyzeBtn');

            if (!campaignId) {
                contactSelect.innerHTML = '<option value="">Select a contact...</option>';
                contactSelect.disabled = true;
                analyzeBtn.disabled = true;
                document.getElementById('resultsSection').style.display = 'none';
                return;
            }

            try {
                selectedCampaign = campaigns.find(c => c.id === campaignId);
                console.log('📋 Loading contacts for campaign:', selectedCampaign.name);
                console.log('📋 Campaign sequence steps:', selectedCampaign.sequenceSteps);
                
                // If sequenceSteps is missing, reconstruct from channels (legacy format)
                if (!selectedCampaign.sequenceSteps || selectedCampaign.sequenceSteps.length === 0) {
                    console.log('⚠️ No sequenceSteps found, reconstructing from channels...');
                    selectedCampaign.sequenceSteps = reconstructSequenceFromChannels(selectedCampaign);
                    console.log('✅ Reconstructed sequence:', selectedCampaign.sequenceSteps);
                }

                // Query all outreach sets for this campaign to get contacts
                const outreachSetsQuery = query(
                    collection(db, 'outreach_sets'),
                    where('campaignId', '==', campaignId)
                );

                const outreachSetsSnapshot = await getDocs(outreachSetsQuery);
                contacts = [];
                const contactMap = new Map();
                
                outreachSetsSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const contactKey = data.email || doc.id;
                    
                    // Use Map to avoid duplicates
                    if (!contactMap.has(contactKey)) {
                        contactMap.set(contactKey, {
                            id: doc.id,
                            email: data.email,
                            name: data.name || data.contactName,
                            outreachSetId: doc.id,
                            ...data
                        });
                    }
                });

                contacts = Array.from(contactMap.values());
                
                // Populate contact dropdown
                populateContactDropdown();

                contactSelect.disabled = false;
                console.log(`✅ Loaded ${contacts.length} contacts`);

            } catch (error) {
                console.error('❌ Error loading contacts:', error);
                showAlert('Error loading contacts: ' + error.message, 'danger');
            }
        };

        // Analyze scheduling for selected contact
        window.analyzeScheduling = async function() {
            const contactId = document.getElementById('contactSelect').value;
            
            if (!contactId || !selectedCampaign) {
                return;
            }

            try {
                document.getElementById('analyzeBtn').disabled = true;
                document.getElementById('resultsSection').style.display = 'block';
                
                // Show loading
                document.getElementById('summaryStats').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Analyzing scheduling...</p></div>';
                document.getElementById('timelineContainer').innerHTML = '';

                selectedContact = contacts.find(c => c.id === contactId);
                console.log('🔍 Analyzing contact:', selectedContact);

                // Get campaign sequence - this is the ACTUAL sequence with correct days from the database
                const campaignSequence = selectedCampaign.sequenceSteps || [];
                console.log('📋 Campaign sequence steps from database:', campaignSequence);
                console.log('📋 Sequence breakdown by day:');
                campaignSequence.forEach(step => {
                    console.log(`   Day ${step.day}: ${step.channel} - ${step.type}`);
                });

                // Load all scheduled activities for this contact
                const activities = await loadScheduledActivities(contactId, selectedContact);
                console.log('📊 Loaded activities:', activities);

                // Determine the start date (Day 1) based on earliest activity
                const startDate = determineStartDate(activities, campaignSequence);
                console.log('📅 Determined start date (Day 1):', startDate);

                // Analyze each activity against the campaign sequence
                const analysis = analyzeActivities(activities, campaignSequence, startDate);
                console.log('✅ Analysis complete:', analysis);

                // Display results
                displayResults(analysis, startDate);

                document.getElementById('analyzeBtn').disabled = false;

            } catch (error) {
                console.error('❌ Error analyzing scheduling:', error);
                showAlert('Error analyzing scheduling: ' + error.message, 'danger');
                document.getElementById('analyzeBtn').disabled = false;
            }
        };

        // Load all scheduled activities for a contact
        async function loadScheduledActivities(outreachSetId, contact) {
            const activities = [];
            const seenActivityIds = new Set(); // Track unique activity IDs to prevent duplicates

            // Helper function to convert Firestore Timestamp to Date
            function toDate(timestamp) {
                if (!timestamp) return null;
                
                // Already a Date object
                if (timestamp instanceof Date) return timestamp;
                
                // Firestore Timestamp with toDate method
                if (timestamp.toDate && typeof timestamp.toDate === 'function') {
                    return timestamp.toDate();
                }
                
                // Plain object with seconds property (Firestore Timestamp serialized)
                if (timestamp.seconds !== undefined) {
                    return new Date(timestamp.seconds * 1000);
                }
                
                // Alternative format
                if (timestamp._seconds !== undefined) {
                    return new Date(timestamp._seconds * 1000);
                }
                
                // String timestamp
                if (typeof timestamp === 'string') {
                    return new Date(timestamp);
                }
                
                console.warn('⚠️ toDate: unrecognized timestamp format', timestamp);
                return null;
            }

            try {
                console.log('🔍 Searching for activities with:', {
                    outreachSetId,
                    contactEmail: contact.email,
                    contactName: contact.name || contact.contactName
                });

                // Load scheduled emails - try multiple query strategies
                const emailQueries = [
                    where('outreachSetId', '==', outreachSetId),
                ];
                
                if (contact.email) {
                    emailQueries.push(where('to', '==', contact.email));
                    emailQueries.push(where('recipientEmail', '==', contact.email));
                }

                for (const whereClause of emailQueries) {
                    try {
                        const emailsQuery = query(
                            collection(db, 'scheduledEmails'),
                            whereClause
                        );
                        const emailsSnapshot = await getDocs(emailsQuery);
                        emailsSnapshot.forEach((doc) => {
                            // Skip if we've already seen this email
                            if (seenActivityIds.has(doc.id)) {
                                console.log('⏭️ Skipping duplicate email:', doc.id);
                                return;
                            }
                            seenActivityIds.add(doc.id);
                            
                            const data = doc.data();
                            // Try sendAt first (most common), then other fields
                            const scheduledDate = toDate(data.sendAt || data.scheduledFor || data.scheduledDate);
                            
                            // For emails, we'll match them based on scheduled date to campaign days
                            // Store the raw data and let the matching logic figure it out
                            let stepType = data.stepType || data.emailType;
                            
                            // If no explicit stepType, we'll use a generic 'email' and match by date
                            if (!stepType) {
                                stepType = 'email';
                            }
                            
                            console.log('📧 Email loaded:', { 
                                id: doc.id,
                                followUpNumber: data.followUpNumber, 
                                type: data.type, 
                                stepType: stepType,
                                subject: data.subject?.substring(0, 50),
                                scheduledDate: scheduledDate
                            });
                            
                            activities.push({
                                ...data,
                                id: doc.id,
                                type: 'email',
                                channel: 'email',
                                scheduledDate: scheduledDate,
                                stepType: stepType,
                                subject: data.subject,
                                contactEmail: data.to || data.recipientEmail,
                                followUpNumber: data.followUpNumber,
                                rawType: data.type
                            });
                        });
                        console.log(`📧 Loaded ${emailsSnapshot.size} scheduled emails (query strategy: ${whereClause})`);
                    } catch (e) {
                        console.warn(`⚠️ Email query failed:`, e.message);
                    }
                }

                // Load LinkedIn activities
                const linkedinQueries = [
                    where('outreachSetId', '==', outreachSetId)
                ];
                
                if (contact.email) {
                    linkedinQueries.push(where('contactEmail', '==', contact.email));
                }

                for (const whereClause of linkedinQueries) {
                    try {
                        const linkedinQuery = query(
                            collection(db, 'linkedin_activities'),
                            whereClause
                        );
                        const linkedinSnapshot = await getDocs(linkedinQuery);
                        linkedinSnapshot.forEach((doc) => {
                            // Skip if we've already seen this LinkedIn activity
                            if (seenActivityIds.has(doc.id)) {
                                console.log('⏭️ Skipping duplicate LinkedIn activity:', doc.id);
                                return;
                            }
                            seenActivityIds.add(doc.id);
                            
                            const data = doc.data();
                            
                            // LinkedIn activities often have an originalActivities array with sub-activities
                            if (data.originalActivities && Array.isArray(data.originalActivities)) {
                                data.originalActivities.forEach((subActivity, index) => {
                                    const subActivityId = `${doc.id}_${index}`;
                                    if (seenActivityIds.has(subActivityId)) {
                                        return; // Skip duplicate sub-activity
                                    }
                                    seenActivityIds.add(subActivityId);
                                    
                                    const scheduledDate = toDate(subActivity.scheduledDate || subActivity.scheduledFor);
                                    activities.push({
                                        ...data,
                                        id: subActivityId,
                                        type: 'linkedin',
                                        channel: 'linkedin',
                                        scheduledDate: scheduledDate,
                                        stepType: subActivity.type || data.actionType || data.type || 'linkedin_action',
                                        actionType: subActivity.type || data.actionType,
                                        content: subActivity.content,
                                        day: subActivity.day
                                    });
                                });
                            } else {
                                // Single activity without originalActivities array
                                const scheduledDate = toDate(data.scheduledDate || data.scheduledFor || data.executeAt);
                                activities.push({
                                    ...data,
                                    id: doc.id,
                                    type: 'linkedin',
                                    channel: 'linkedin',
                                    scheduledDate: scheduledDate,
                                    stepType: data.actionType || data.type || 'linkedin_action',
                                    actionType: data.actionType
                                });
                            }
                        });
                        console.log(`💼 Loaded ${linkedinSnapshot.size} LinkedIn activities`);
                    } catch (e) {
                        console.warn(`⚠️ LinkedIn query failed:`, e.message);
                    }
                }

                // Load phone activities
                const phoneQueries = [
                    where('outreachSetId', '==', outreachSetId)
                ];
                
                if (contact.email) {
                    phoneQueries.push(where('contactEmail', '==', contact.email));
                }

                for (const whereClause of phoneQueries) {
                    try {
                        const phoneQuery = query(
                            collection(db, 'phone_activities'),
                            whereClause
                        );
                        const phoneSnapshot = await getDocs(phoneQuery);
                        phoneSnapshot.forEach((doc) => {
                            // Skip if we've already seen this phone activity
                            if (seenActivityIds.has(doc.id)) {
                                console.log('⏭️ Skipping duplicate phone activity:', doc.id);
                                return;
                            }
                            seenActivityIds.add(doc.id);
                            
                            const data = doc.data();
                            const scheduledDate = toDate(data.scheduledDate || data.scheduledAt || data.scheduledFor);
                            
                            // Check if there's a step object with type info
                            const stepType = data.step?.type || data.callType || data.type || 'phone_call';
                            
                            activities.push({
                                ...data,
                                id: doc.id,
                                type: 'phone',
                                channel: 'phone',
                                scheduledDate: scheduledDate,
                                stepType: stepType,
                                day: data.step?.day
                            });
                        });
                        console.log(`📞 Loaded ${phoneSnapshot.size} phone activities`);
                    } catch (e) {
                        console.warn(`⚠️ Phone query failed:`, e.message);
                    }
                }

            } catch (error) {
                console.error('❌ Error loading activities:', error);
            }

            console.log(`✅ Loaded ${activities.length} unique activities (duplicates already filtered out)`);
            console.log('📊 Activities loaded with types:', activities.map(a => ({
                channel: a.channel,
                stepType: a.stepType,
                scheduledDate: a.scheduledDate,
                id: a.id
            })));

            return activities;
        }

        // Determine the start date (Day 1) based on earliest scheduled activity
        function determineStartDate(activities, campaignSequence) {
            console.log('🔍 Determining start date from', activities.length, 'activities');
            console.log('🔍 Campaign sequence for reference:', campaignSequence.map(s => `Day ${s.day}: ${s.channel}:${s.type}`));
            
            if (activities.length === 0) {
                console.warn('⚠️ No activities found, using current date');
                return new Date();
            }

            // Filter out activities with invalid dates
            const validActivities = activities.filter(a => {
                if (!a.scheduledDate) {
                    console.warn('⚠️ Activity missing scheduledDate:', a);
                    return false;
                }
                const date = new Date(a.scheduledDate);
                if (isNaN(date.getTime())) {
                    console.warn('⚠️ Activity has invalid date:', a.scheduledDate, a);
                    return false;
                }
                return true;
            });

            console.log('✅ Valid activities with dates:', validActivities.length);
            validActivities.forEach(a => {
                console.log(`   - ${a.channel}:${a.stepType} scheduled for ${new Date(a.scheduledDate).toLocaleDateString()}`);
            });

            if (validActivities.length === 0) {
                console.warn('⚠️ No valid activities with dates found');
                return new Date();
            }

            // Find the earliest activity and its expected day in campaign
            let earliestActivity = null;
            let earliestDay = Infinity;

            validActivities.forEach(activity => {
                // Find matching sequence step
                const sequenceStep = campaignSequence.find(step => 
                    step.channel === activity.channel && 
                    (step.type === activity.stepType || step.type === activity.actionType)
                );

                if (sequenceStep) {
                    console.log(`   ✅ Matched activity ${activity.channel}:${activity.stepType} to Day ${sequenceStep.day}`);
                    if (sequenceStep.day < earliestDay) {
                        earliestDay = sequenceStep.day;
                        earliestActivity = activity;
                        console.log(`      ⭐ This is now the earliest (Day ${earliestDay})`);
                    }
                } else {
                    console.log(`   ⚠️ Could not match activity ${activity.channel}:${activity.stepType} to any sequence step`);
                }
            });

            if (!earliestActivity || !earliestActivity.scheduledDate) {
                // Fallback to earliest scheduled date
                const sorted = validActivities
                    .sort((a, b) => new Date(a.scheduledDate) - new Date(b.scheduledDate));
                
                if (sorted.length > 0) {
                    console.log('📅 Using earliest activity date:', sorted[0].scheduledDate);
                    return new Date(sorted[0].scheduledDate);
                }
                console.warn('⚠️ Could not determine start date, using current date');
                return new Date();
            }

            // Calculate Day 1 based on earliest activity (using BUSINESS DAYS)
            const activityDate = new Date(earliestActivity.scheduledDate);
            activityDate.setHours(0, 0, 0, 0);
            
            const businessDaysToSubtract = earliestDay - 1; // earliestDay is 1-indexed
            const startDate = subtractBusinessDays(activityDate, businessDaysToSubtract);
            startDate.setHours(0, 0, 0, 0);

            console.log('📅 ===== START DATE CALCULATION (BUSINESS DAYS) =====');
            console.log(`📅 Earliest activity: Day ${earliestDay} ${earliestActivity.channel}:${earliestActivity.stepType}`);
            console.log(`📅 Scheduled for: ${activityDate.toLocaleDateString()} (${activityDate.toLocaleString('en-US', { weekday: 'long' })})`);
            console.log(`📅 Business days to subtract: ${businessDaysToSubtract} (to get to Day 1)`);
            console.log(`📅 CALCULATED DAY 1 (Start Date): ${startDate.toLocaleDateString()} (${startDate.toLocaleString('en-US', { weekday: 'long' })})`);
            console.log('📅 ==================================================');

            return startDate;
        }

        // Analyze activities against campaign sequence
        function analyzeActivities(activities, campaignSequence, startDate) {
            console.log('🔍 Analyzing activities against campaign sequence:');
            console.log('📅 Start Date (Day 1):', startDate);
            console.log('📋 Campaign sequence steps:', campaignSequence.map(s => ({
                day: s.day,
                channel: s.channel,
                type: s.type
            })));
            
            const analysis = {
                total: campaignSequence.length,
                correct: 0,
                incorrect: 0,
                missing: 0,
                items: []
            };

            // Check each sequence step
            campaignSequence.forEach(sequenceStep => {
                // Calculate expected date using BUSINESS DAYS
                const businessDaysFromStart = sequenceStep.day - 1; // Day 1 = 0 business days from start
                const expectedDate = addBusinessDays(startDate, businessDaysFromStart);
                expectedDate.setHours(0, 0, 0, 0);
                
                console.log(`📅 Day ${sequenceStep.day} (${sequenceStep.channel}:${sequenceStep.type}) expects: ${expectedDate.toLocaleDateString()} (${expectedDate.toLocaleString('en-US', { weekday: 'long' })}) [${businessDaysFromStart} business days from start]`);

                // Find matching activities
                const matchingActivities = activities.filter(activity => {
                    const channelMatch = activity.channel === sequenceStep.channel;
                    
                    // For emails, match by both stepType AND by date/campaign day
                    if (sequenceStep.channel === 'email') {
                        // Check if stepType matches
                        const typeMatch = sequenceStep.type === activity.stepType || sequenceStep.type === activity.actionType;
                        
                        if (typeMatch) {
                            return true; // Direct stepType match
                        }
                        
                        // Also match by scheduled date - if email is scheduled on this campaign day, it's a match
                        if (activity.scheduledDate) {
                            const activityDate = new Date(activity.scheduledDate);
                            activityDate.setHours(0, 0, 0, 0);
                            
                            const daysDifference = Math.round((activityDate - expectedDate) / (1000 * 60 * 60 * 24));
                            
                            // If the email is scheduled within ±1 day of the expected date, consider it a match
                            if (Math.abs(daysDifference) <= 1) {
                                console.log('📧 Email date match:', { 
                                    emailScheduled: activityDate, 
                                    expectedDate: expectedDate,
                                    sequenceStep: sequenceStep.type,
                                    emailStepType: activity.stepType 
                                });
                                return true;
                            }
                        }
                        
                        return false;
                    }
                    
                    // For non-email activities, match by type as before
                    const typeMatch = sequenceStep.type === activity.stepType || sequenceStep.type === activity.actionType;
                    return channelMatch && typeMatch;
                });

                console.log(`🔍 Step Day ${sequenceStep.day} (${sequenceStep.channel}:${sequenceStep.type}): Found ${matchingActivities.length} matching activities`);
                
                if (matchingActivities.length === 0) {
                    // Missing activity
                    console.log('⚠️ No matches found for:', {
                        looking_for: { channel: sequenceStep.channel, type: sequenceStep.type },
                        available_activities: activities.map(a => ({ 
                            channel: a.channel, 
                            stepType: a.stepType,
                            actionType: a.actionType,
                            subject: a.subject 
                        }))
                    });
                    analysis.missing++;
                    analysis.items.push({
                        sequenceStep,
                        expectedDate,
                        expectedDay: sequenceStep.day,
                        status: 'missing',
                        activities: []
                    });
                } else {
                    // Check if scheduled on correct date
                    const correctActivities = [];
                    const incorrectActivities = [];

                    matchingActivities.forEach(activity => {
                        const scheduledDate = new Date(activity.scheduledDate);
                        scheduledDate.setHours(0, 0, 0, 0);

                        // Calculate difference in BUSINESS DAYS, not calendar days
                        let businessDaysDifference;
                        if (scheduledDate < expectedDate) {
                            // Scheduled earlier than expected
                            businessDaysDifference = -businessDaysBetween(scheduledDate, expectedDate);
                        } else if (scheduledDate > expectedDate) {
                            // Scheduled later than expected
                            businessDaysDifference = businessDaysBetween(expectedDate, scheduledDate);
                        } else {
                            // Exactly on expected date
                            businessDaysDifference = 0;
                        }
                        
                        console.log(`   📊 Activity scheduled ${scheduledDate.toLocaleDateString()} vs expected ${expectedDate.toLocaleDateString()}: ${businessDaysDifference} business days difference`);
                        
                        if (businessDaysDifference === 0) {
                            correctActivities.push({ ...activity, daysDifference: businessDaysDifference });
                        } else {
                            incorrectActivities.push({ ...activity, daysDifference: businessDaysDifference });
                        }
                    });

                    const isCorrect = correctActivities.length > 0 && incorrectActivities.length === 0;
                    
                    if (isCorrect) {
                        analysis.correct++;
                    } else {
                        analysis.incorrect++;
                    }

                    analysis.items.push({
                        sequenceStep,
                        expectedDate,
                        expectedDay: sequenceStep.day,
                        status: isCorrect ? 'correct' : 'incorrect',
                        activities: [...correctActivities, ...incorrectActivities],
                        correctCount: correctActivities.length,
                        incorrectCount: incorrectActivities.length
                    });
                }
            });

            return analysis;
        }

        // Display analysis results
        function displayResults(analysis, startDate) {
            // Display summary stats
            const summaryHTML = `
                <div class="stat-card">
                    <div class="stat-value total">${analysis.total}</div>
                    <div class="stat-label">Total Steps</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value correct">${analysis.correct}</div>
                    <div class="stat-label">Correctly Scheduled</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value incorrect">${analysis.incorrect}</div>
                    <div class="stat-label">Incorrectly Scheduled</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--warning);">${analysis.missing}</div>
                    <div class="stat-label">Missing Activities</div>
                </div>
            `;
            document.getElementById('summaryStats').innerHTML = summaryHTML;

            // Display contact info
            const createdDate = selectedContact.createdAt?.toDate?.() || new Date();
            const infoHTML = `
                <div class="info-card">
                    <div class="info-label">Contact Name</div>
                    <div class="info-value">${selectedContact.name || selectedContact.contactName || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Contact Email</div>
                    <div class="info-value">${selectedContact.email || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Campaign</div>
                    <div class="info-value">${selectedCampaign.name}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Day 1 Start Date (Business Days)</div>
                    <div class="info-value">${startDate.toLocaleDateString()} (${startDate.toLocaleString('en-US', { weekday: 'long' })})</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Created</div>
                    <div class="info-value">${createdDate.toLocaleDateString()}</div>
                </div>
            `;
            document.getElementById('outreachSetInfo').innerHTML = infoHTML;

            // Display timeline
            let timelineHTML = '';
            
            if (analysis.items.length === 0) {
                timelineHTML = '<div class="alert alert-info"><i class="fas fa-info-circle"></i>No sequence steps found for this campaign.</div>';
            } else {
                // Sort by expected day
                analysis.items.sort((a, b) => a.expectedDay - b.expectedDay);

                analysis.items.forEach(item => {
                    const statusClass = item.status === 'correct' ? 'correct' : 
                                       item.status === 'incorrect' ? 'incorrect' : '';
                    
                    timelineHTML += `
                        <div class="timeline-item ${statusClass}">
                            <div class="timeline-header">
                                <div class="timeline-day">Day ${item.expectedDay}</div>
                                <span class="timeline-channel channel-${item.sequenceStep.channel}">
                                    <i class="fas fa-${item.sequenceStep.channel === 'email' ? 'envelope' : item.sequenceStep.channel === 'linkedin' ? 'linkedin' : 'phone'}"></i>
                                    ${item.sequenceStep.channel.charAt(0).toUpperCase() + item.sequenceStep.channel.slice(1)}
                                </span>
                            </div>
                            
                            <div class="timeline-content">
                                <div class="timeline-label">${getStepDisplayName(item.sequenceStep.type)}</div>
                                <div class="timeline-detail">
                                    <strong>Expected Date:</strong> ${item.expectedDate.toLocaleDateString()} (${item.expectedDate.toLocaleString('en-US', { weekday: 'long' })})
                                </div>
                                
                                ${item.status === 'missing' ? `
                                    <span class="status-badge status-missing">
                                        <i class="fas fa-exclamation-triangle"></i>
                                        No activities scheduled for this step
                                    </span>
                                ` : ''}
                                
                                ${item.activities.map(activity => {
                                    const scheduledDate = new Date(activity.scheduledDate);
                                    const isCorrect = activity.daysDifference === 0;
                                    
                                    return `
                                        <div class="timeline-detail" style="margin-top: 0.5rem; padding: 0.5rem; background: ${isCorrect ? '#f0fdf4' : '#fef2f2'}; border-radius: 4px;">
                                            <strong>Scheduled:</strong> ${scheduledDate.toLocaleDateString()} ${scheduledDate.toLocaleTimeString()} (${scheduledDate.toLocaleString('en-US', { weekday: 'short' })})
                                            ${activity.daysDifference !== 0 ? `
                                                <span style="color: var(--danger); font-weight: 600;">
                                                    (${activity.daysDifference > 0 ? '+' : ''}${activity.daysDifference} business days off)
                                                </span>
                                            ` : `
                                                <span style="color: var(--success); font-weight: 600;">
                                                    <i class="fas fa-check"></i> Correct
                                                </span>
                                            `}
                                            ${activity.contactEmail ? `<br><small>Contact: ${activity.contactEmail}</small>` : ''}
                                            ${activity.subject ? `<br><small>Subject: ${activity.subject}</small>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                                
                                ${item.correctCount > 0 ? `
                                    <span class="status-badge status-correct">
                                        <i class="fas fa-check-circle"></i>
                                        ${item.correctCount} correctly scheduled
                                    </span>
                                ` : ''}
                                
                                ${item.incorrectCount > 0 ? `
                                    <span class="status-badge status-incorrect">
                                        <i class="fas fa-times-circle"></i>
                                        ${item.incorrectCount} incorrectly scheduled
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('timelineContainer').innerHTML = timelineHTML;
        }

        // Get display name for step type
        function getStepDisplayName(stepType) {
            const stepNames = {
                'extract_posts': 'Extract Latest Posts',
                'like_recent_post': 'Like Recent Post',
                'first_email': '1st Email',
                'connection_request': 'Connection Request',
                'first_call': '1st Call',
                'second_email': '2nd Email',
                'comment_on_post': 'Comment on Post',
                'second_call': '2nd Call',
                'third_email': '3rd Email',
                'third_call': '3rd Call',
                'fourth_email': '4th Email',
                'send_message': 'Send Message',
                'profile_view': 'Profile View',
                'follow_up': 'Follow Up',
                'cold_call': 'Cold Call'
            };
            
            return stepNames[stepType] || stepType.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        // Show alert
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : 'info-circle'}"></i> ${message}`;
            
            document.body.appendChild(alertDiv);
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '9999';
            alertDiv.style.minWidth = '300px';
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // Initialize on load
        initialize();
    </script>
