<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Repost Ideas - PandoConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../images/pando_logo_transparent.png">

    <script src="healthconnect-header.js?v=3.4"></script>
    <script src="../js/auth.js?v=2.1"></script>
    <script src="../js/folder-protection.js?v=2.1"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    <script src="post-comments-common.js?v=1"></script>

    <link rel="stylesheet" href="pando-theme.css?v=4">
    <link rel="stylesheet" href="post-comments.css?v=1">
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1><i class="fas fa-retweet"></i> Repost Ideas</h1>
        <p>
            Recent posts from people in your network that stood out as especially interesting, and could be worth sharing with your own network.
            Keep the ones you like and dismiss the rest. Open a post on LinkedIn to repost it yourself; reposting straight from this page is coming later.
        </p>
    </header>

    <div class="card" id="bdrPick" hidden>
        <div class="field" style="max-width:420px;"><label for="bdrSelect">Showing ideas for</label><select id="bdrSelect"></select></div>
    </div>

    <div id="notice"></div>

    <div class="card" id="main" hidden>
        <div class="toolbar">
            <div class="tabs" id="viewTabs">
                <button data-view="new" class="on">New<span class="n" id="n-new">0</span></button>
                <button data-view="saved">Saved<span class="n" id="n-saved">0</span></button>
                <button data-view="dismissed">Dismissed</button>
            </div>
            <button class="btn btn-outline btn-sm" data-action="refresh"><i class="fas fa-rotate"></i> Refresh</button>
        </div>
        <div class="rp-grid" id="grid"></div>
        <div class="status-line" id="status"></div>
    </div>
</div>

<script type="module">
await window.firebaseReady;
const auth = window.auth;
const PC = window.PostComments;
const { esc, api, say } = PC;
PC.wire();

const $ = (id) => document.getElementById(id);
let bdrId = null;
let view = 'new';
let all = [];
const imageUrls = new Map();          // candidate id -> object URL of the saved image copy

async function load() {
    if (!bdrId) return;
    $('main').hidden = false;
    $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1;">Loading…</div>';
    try {
        all = (await api(`/reposts?bdrId=${encodeURIComponent(bdrId)}`)).reposts;
        render(); say('status', '');
    } catch (e) { $('grid').innerHTML = ''; say('status', e.message, true); }
}

function render() {
    $('n-new').textContent = all.filter(r => r.status === 'new').length;
    $('n-saved').textContent = all.filter(r => r.status === 'saved').length;
    const list = all.filter(r => r.status === view);
    const empty = { new: 'No new ideas right now. Posts appear here when one of your contacts shares something that scores very high.', saved: 'Nothing saved yet.', dismissed: 'Nothing dismissed.' }[view];
    $('grid').innerHTML = list.map(cardHtml).join('') || `<div class="empty" style="grid-column:1/-1;">${esc(empty)}</div>`;
    list.forEach(loadImage);
}

function cardHtml(r) {
    const p = r.post || {};
    const url = PC.linkedInUrl(p.url);
    const act = [];
    if (url) act.push(`<a class="btn btn-primary btn-sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i> Open on LinkedIn</a>`);
    if (r.status !== 'saved') act.push(`<button class="btn btn-outline btn-sm" data-action="set" data-status="saved" data-id="${esc(r.id)}"><i class="fas fa-bookmark"></i> Save</button>`);
    if (r.status !== 'dismissed') act.push(`<button class="btn btn-outline btn-sm" data-action="set" data-status="dismissed" data-id="${esc(r.id)}">Dismiss</button>`);
    if (r.status !== 'new') act.push(`<button class="btn btn-outline btn-sm" data-action="set" data-status="new" data-id="${esc(r.id)}">Move back to New</button>`);
    act.push(`<button class="btn btn-outline btn-sm" data-action="copy" data-id="${esc(r.id)}"><i class="fas fa-copy"></i> Copy text</button>`);
    return `<div class="rp-card" data-card="${esc(r.id)}">
        <img class="rp-img" alt="Image from the post" data-img="${esc(r.id)}" hidden>
        <div class="rp-body">
            ${PC.personHtml(r.author)}
            ${PC.postHtml({ ...p, hasImage: false })}
            <div class="scores">${PC.scoreHtml('Interest score', r.postScore, r.postReason)}</div>
            <div class="btn-row">${act.join('')}</div>
            <div class="status-line" data-status></div>
        </div>
    </div>`;
}

/** The saved copy first (it does not expire); otherwise LinkedIn's own address, which may have expired (then no image is shown). */
async function loadImage(r) {
    const img = document.querySelector(`img[data-img="${CSS.escape(r.id)}"]`); if (!img) return;
    const show = (src) => { img.addEventListener('error', () => { img.hidden = true; }, { once: true }); img.referrerPolicy = 'no-referrer'; img.src = src; img.hidden = false; };
    if (r.hasImageCopy) {
        if (!imageUrls.has(r.id)) imageUrls.set(r.id, await PC.apiImage(`/reposts/${encodeURIComponent(r.id)}/image`).catch(() => null));
        const still = document.querySelector(`img[data-img="${CSS.escape(r.id)}"]`);
        if (imageUrls.get(r.id) && still === img) { show(imageUrls.get(r.id)); return; }
    }
    const direct = PC.linkedInImage((r.post || {}).imageUrl);
    if (direct) show(direct);
}

async function cardAction(btn) {
    const id = btn.dataset.id; const r = all.find(x => x.id === id); if (!r) return;
    const status = btn.closest('[data-card]').querySelector('[data-status]');
    if (btn.dataset.action === 'copy') {
        try { await navigator.clipboard.writeText((r.post || {}).text || ''); status.textContent = 'Copied.'; }
        catch (_) { status.textContent = 'Could not copy. Select the text and copy it by hand.'; }
        return;
    }
    btn.disabled = true;
    try {
        const out = await api(`/reposts/${encodeURIComponent(id)}/status`, { method: 'POST', body: { status: btn.dataset.status } });
        r.status = out.repost.status; render();
    } catch (e) { status.textContent = e.message; status.className = 'status-line error'; btn.disabled = false; }
}

$('viewTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]'); if (!b) return;
    document.querySelectorAll('#viewTabs button').forEach(x => x.classList.toggle('on', x === b));
    view = b.dataset.view; render();
});
document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-action]'); if (!b) return;
    if (b.dataset.action === 'refresh') load(); else cardAction(b);
});
window.addEventListener('pagehide', () => { imageUrls.forEach(u => { if (u) URL.revokeObjectURL(u); }); });

let started = false;
async function start() {
    if (started) return; started = true;
    try {
        const r = await PC.chooseBdr({ selectId: 'bdrSelect', wrapId: 'bdrPick', onChange: (id) => { bdrId = id; $('notice').innerHTML = ''; $('main').hidden = !id; all = []; load(); } });
        bdrId = r.bdrId;
        if (!r.me.bdrs.length) { $('notice').innerHTML = '<div class="banner">Your login is not linked to a PandoConnect account yet, so there is nothing to show here. Please contact your PandoConnect team.</div>'; return; }
        if (!bdrId) { $('notice').innerHTML = '<div class="banner">Choose a BDR above to see their repost ideas.</div>'; return; }
        load();
    } catch (e) { started = false; $('notice').innerHTML = `<div class="banner stop">Could not load: ${esc(e.message)}</div>`; }
}

import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
onAuthStateChanged(auth, (u) => { if (u) start(); });
</script>
</body>
</html>
