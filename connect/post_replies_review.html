<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Post Replies Review - PandoConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../images/pando_logo_transparent.png">

    <script src="healthconnect-header.js?v=3.4"></script>
    <script src="../js/auth.js?v=2.1"></script>
    <script src="../js/folder-protection.js?v=2.1"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>
    <script src="post-comments-common.js?v=1"></script>

    <link rel="stylesheet" href="pando-theme.css?v=4">
    <link rel="stylesheet" href="post-comments.css?v=1">
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1><i class="fas fa-comment-dots"></i> Post Replies Review</h1>
        <p>
            People in your network posted something worth a reply, and a short comment has been drafted in your voice. Read each one, change the
            wording if you like, and approve the ones you are happy to have posted from your LinkedIn account. Nothing is posted until you approve it.
        </p>
    </header>

    <div class="card" id="bdrPick" hidden>
        <div class="field" style="max-width:420px;"><label for="bdrSelect">Reviewing for</label><select id="bdrSelect"></select></div>
    </div>

    <div id="notice"></div>

    <div class="card" id="main" hidden>
        <div class="toolbar">
            <div class="tabs" id="viewTabs">
                <button data-view="pending" class="on">Waiting for you<span class="n" id="n-pending">0</span></button>
                <button data-view="approved">Approved</button>
                <button data-view="declined">Declined</button>
            </div>
            <button class="btn btn-outline btn-sm" data-action="refresh"><i class="fas fa-rotate"></i> Refresh</button>
        </div>
        <p class="muted" id="viewHelp"></p>
        <div id="items"></div>
        <div class="status-line" id="status"></div>
    </div>
</div>

<script type="module">
await window.firebaseReady;
const auth = window.auth;
const PC = window.PostComments;
const { esc, fmt, api, say } = PC;
PC.wire();

const $ = (id) => document.getElementById(id);
let bdrId = null;
let view = 'pending';
let perDay = 20;

const helpFor = () => ({
    pending: `Approved comments are posted from your LinkedIn account a few at a time through the day, never more than ${perDay} in a day.`,
    approved: 'Comments you approved in the last 60 days, and whether each has been posted yet.',
    declined: 'Comments you declined, or that could not be posted, in the last 60 days.'
}[view]);

async function load() {
    if (!bdrId) return;
    $('main').hidden = false;
    $('items').innerHTML = '<div class="empty">Loading…</div>';
    try {
        const r = await api(`/review/items?bdrId=${encodeURIComponent(bdrId)}&view=${encodeURIComponent(view)}`);
        perDay = r.commentsPerDay || perDay;
        $('viewHelp').textContent = helpFor();
        if (view === 'pending') $('n-pending').textContent = r.items.length;
        const empty = { pending: 'Nothing is waiting for you right now. New comments appear here after they are drafted and checked.', approved: 'Nothing approved yet.', declined: 'Nothing declined.' }[view];
        $('items').innerHTML = r.items.map(itemHtml).join('') || `<div class="empty">${esc(empty)}</div>`;
        $('items').querySelectorAll('textarea[data-count]').forEach(PC.updateCount);
        say('status', '');
    } catch (e) { $('items').innerHTML = ''; say('status', e.message, true); }
}

function sendLine(i) {
    if (i.status === 'sent') return `<p class="note">Posted ${esc(fmt(i.sentAt))}.</p>`;
    if (i.status === 'queued') return `<p class="note ${i.sendStatus === 'held' ? 'warn' : ''}">${i.sendStatus === 'held' ? 'Approved. It is being checked before it is posted.' : 'Approved and waiting its turn to be posted.'}</p>`;
    if (i.status === 'rejected') return `<p class="note">Declined${i.rejectedAt ? ' ' + esc(fmt(i.rejectedAt)) : ''}${i.statusReason ? ': ' + esc(i.statusReason) : ''}.</p>`;
    if (i.status === 'send_failed' || i.status === 'send_cancelled') return `<p class="note bad">Not posted${i.sendDetail ? ': ' + esc(i.sendDetail) : ''}.</p>`;
    return '';
}

function itemHtml(i) {
    const pending = i.status === 'pending_bdr_review';
    return `<div class="pc-item" data-item="${esc(i.id)}">
        <div>
            ${PC.personHtml(i.contact)}
            ${PC.postHtml(i.post, { type: i.type })}
        </div>
        <div class="pc-side">
            <h3>${i.type === 'congratulations' ? 'Your congratulations' : 'Your comment'}</h3>
            <textarea data-count ${pending ? '' : 'disabled'} maxlength="2000" aria-label="Comment text">${esc(i.finalText)}</textarea>
            <div class="pc-count"></div>
            ${pending && i.angle ? `<p class="note">Picks up on: ${esc(i.angle)}</p>` : ''}
            ${sendLine(i)}
            ${pending ? `<div class="btn-row">
                <button class="btn btn-primary" data-action="approve" data-id="${esc(i.id)}"><i class="fas fa-check"></i> Approve</button>
                <button class="btn btn-outline" data-action="edit" data-id="${esc(i.id)}">Save changes</button>
                <button class="btn btn-danger-outline" data-action="reject" data-id="${esc(i.id)}">Decline</button>
            </div>` : ''}
            <div class="status-line" data-status></div>
        </div>
    </div>`;
}

async function itemAction(btn) {
    const id = btn.dataset.id, action = btn.dataset.action;
    const card = btn.closest('[data-item]');
    const status = card.querySelector('[data-status]');
    const ta = card.querySelector('textarea');
    let body = { text: ta.value };
    if (action === 'reject') { const reason = prompt('Decline this comment. Anything we should know? (optional)', ''); if (reason === null) return; body = { reason }; }
    card.querySelectorAll('button').forEach(b => { b.disabled = true; });
    status.textContent = 'Working…'; status.className = 'status-line';
    try {
        const r = await api(`/review/items/${encodeURIComponent(id)}/${action}`, { method: 'POST', body });
        if (action === 'edit') {
            ta.value = r.item.finalText; PC.updateCount(ta);
            status.textContent = 'Saved.'; card.querySelectorAll('button').forEach(b => { b.disabled = false; });
            return;
        }
        const s = r.item.status;
        const msg = s === 'queued' ? 'Approved. It will be posted from your LinkedIn account shortly.' : s === 'sent' ? 'This comment had already been posted.'
            : s === 'send_cancelled' ? `Approved, but it could not be queued: ${r.item.sendDetail || 'it was refused'}.` : 'Declined.';
        card.outerHTML = `<div class="empty" style="margin-bottom:.9rem;${s === 'send_cancelled' ? 'color:var(--danger);' : ''}">${esc(msg)}</div>`;
        const n = $('n-pending'); n.textContent = Math.max(0, Number(n.textContent) - 1);
    } catch (e) {
        status.textContent = e.message; status.className = 'status-line error';
        card.querySelectorAll('button').forEach(b => { b.disabled = false; });
    }
}

$('viewTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]'); if (!b) return;
    document.querySelectorAll('#viewTabs button').forEach(x => x.classList.toggle('on', x === b));
    view = b.dataset.view; load();
});
document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-action]'); if (!b) return;
    if (b.dataset.action === 'refresh') load(); else itemAction(b);
});

let started = false;
async function start() {
    if (started) return; started = true;
    try {
        const r = await PC.chooseBdr({ selectId: 'bdrSelect', wrapId: 'bdrPick', onChange: (id) => { bdrId = id; $('notice').innerHTML = ''; $('main').hidden = !id; load(); } });
        bdrId = r.bdrId;
        if (!r.me.bdrs.length) { $('notice').innerHTML = '<div class="banner">Your login is not linked to a PandoConnect account yet, so there is nothing to review here. Please contact your PandoConnect team.</div>'; return; }
        if (!bdrId) { $('notice').innerHTML = '<div class="banner">Choose a BDR above to see the comments waiting for them.</div>'; return; }
        load();
    } catch (e) { started = false; $('notice').innerHTML = `<div class="banner stop">Could not load: ${esc(e.message)}</div>`; }
}

import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
onAuthStateChanged(auth, (u) => { if (u) start(); });
</script>
</body>
</html>
