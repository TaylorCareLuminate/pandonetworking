<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>BDR Send Audit - PandoConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/pando_logo_transparent.png">
    <style>
        :root {
            --primary: #0F2D4D; --secondary: #0f172a; --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --accent: #C9973D; --gray: #6b7280; --light-gray: #f8fafc; --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--light-gray); color: var(--secondary); line-height: 1.5; }
        .container { max-width: 1750px; margin: 0 auto; padding: 2rem; }

        .page-header { background: linear-gradient(135deg, #0F2D4D 0%, #1d4ed8 100%); color: white; padding: 1.75rem 2rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 8px 16px rgba(0,0,0,.1); }
        .page-header h1 { font-size: 1.6rem; display: flex; align-items: center; gap: .75rem; margin-bottom: .35rem; }
        .page-header p { font-size: .92rem; opacity: .9; }

        .card { background: white; border-radius: 12px; padding: 1.25rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 1.25rem; }
        .controls-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: .35rem; }
        .control-group label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gray); }
        .control-group select, .control-group input[type=text] { padding: .5rem .8rem; border: 1.5px solid var(--border); border-radius: 8px; font-size: .88rem; min-width: 150px; background: white; }
        .control-group select:focus, .control-group input:focus { outline: none; border-color: var(--primary); }
        .check-inline { display: flex; align-items: center; gap: .4rem; font-size: .85rem; font-weight: 600; padding-bottom: .5rem; cursor: pointer; }

        .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem 1.1rem; border: none; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sm { padding: .3rem .7rem; font-size: .76rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: #0a2038; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-accent:hover:not(:disabled) { background: #b3852f; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-blue:hover:not(:disabled) { background: #1d4ed8; }
        .btn-secondary { background: #f1f5f9; color: var(--secondary); border: 1.5px solid var(--border); }
        .btn-secondary:hover:not(:disabled) { background: #e2e8f0; }
        .btn-danger { background: var(--danger); color: white; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .75rem 2rem; font-size: .85rem; }
        .info-grid .k { color: var(--gray); font-size: .72rem; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
        .info-grid .v { font-weight: 600; word-break: break-all; }
        .err-box { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 8px; padding: .7rem 1rem; font-size: .85rem; margin-top: .75rem; }

        .log { font-family: ui-monospace, Consolas, monospace; font-size: .78rem; background: #0f172a; color: #cbd5e1; border-radius: 8px; padding: .75rem 1rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        .log .ok { color: #6ee7b7; } .log .bad { color: #fca5a5; } .log .warn { color: #fcd34d; }
        .progress-wrap { background: #e2e8f0; border-radius: 100px; height: 8px; overflow: hidden; margin: .6rem 0; }
        .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .2s; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
        .stat-card { background: white; border-radius: 12px; padding: .85rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .stat-card.active { border-color: var(--primary); }
        .stat-number { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
        .stat-label { font-size: .68rem; color: var(--gray); font-weight: 600; margin-top: .2rem; text-transform: uppercase; letter-spacing: .03em; }
        .c-green .stat-number { color: var(--success); } .c-red .stat-number { color: var(--danger); }
        .c-amber .stat-number { color: var(--warning); } .c-blue .stat-number { color: #2563eb; } .c-gray .stat-number { color: var(--gray); }

        .toolbar { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: flex-end; justify-content: space-between; }
        .view-toggle { display: inline-flex; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; }
        .view-toggle button { padding: .5rem 1rem; border: none; background: white; font-weight: 600; font-size: .85rem; cursor: pointer; color: var(--gray); }
        .view-toggle button.active { background: var(--primary); color: white; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #f8fafc; padding: .6rem .8rem; text-align: left; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody tr { border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background: #fafafa; }
        td { padding: .55rem .8rem; font-size: .83rem; vertical-align: top; }
        .td-name { font-weight: 600; }
        .td-sub { font-size: .73rem; color: var(--gray); }
        .td-sub a { color: #2563eb; text-decoration: none; }
        .td-msg { max-width: 340px; font-size: .76rem; color: #334155; }
        .td-msg div { max-height: 3.9em; overflow: hidden; }
        .td-msg:hover div { max-height: none; }

        .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .55rem; border-radius: 100px; font-size: .7rem; font-weight: 700; white-space: nowrap; }
        .b-green { background: #dcfce7; color: #15803d; } .b-red { background: #fee2e2; color: #b91c1c; }
        .b-amber { background: #fef3c7; color: #92400e; } .b-blue { background: #dbeafe; color: #1d4ed8; }
        .b-gray { background: #f1f5f9; color: #475569; } .b-purple { background: #ede9fe; color: #6d28d9; }

        .batch-card { border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: .85rem; overflow: hidden; background: white; }
        .batch-head { display: flex; flex-wrap: wrap; gap: .6rem 1.25rem; align-items: center; justify-content: space-between; padding: .8rem 1rem; background: #f8fafc; }
        .batch-title { font-weight: 700; font-size: .95rem; }
        .batch-meta { font-size: .76rem; color: var(--gray); }
        .chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .35rem; }
        .batch-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
        .batch-bar { display: flex; height: 6px; border-radius: 100px; overflow: hidden; background: #e2e8f0; margin-top: .5rem; min-width: 220px; }
        .batch-body { border-top: 1px solid var(--border); max-height: 65vh; overflow: auto; }
        .note-banner { font-size: .8rem; color: var(--gray); margin-top: .5rem; }
        .empty { text-align: center; padding: 2.5rem; color: var(--gray); }
        .hidden { display: none !important; }
    </style>
    <link rel="stylesheet" href="pando-theme.css?v=4">
</head>
<body>
<div id="healthconnect-header-mount"></div>

<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-clipboard-check"></i> BDR Send Audit</h1>
        <p>Everything a BDR submitted in Fast Connect Review (Quick Message, slots, campaign pushes, reserve) — grouped by submit batch or listed individually — checked against HeyReach. Slot messages can be moved to Quick Message.</p>
    </div>

    <div class="card">
        <div class="controls-row">
            <div class="control-group" id="bdrWrap">
                <label><i class="fas fa-user"></i> BDR</label>
                <select id="bdrSelect" style="min-width:300px;"><option value="">— Select a BDR —</option></select>
            </div>
            <div class="control-group">
                <label><i class="fas fa-calendar"></i> Look-back</label>
                <select id="daysSelect">
                    <option value="3">Last 3 days</option>
                    <option value="7">Last 7 days</option>
                    <option value="14">Last 14 days</option>
                    <option value="30">Last 30 days</option>
                    <option value="45" selected>Last 45 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365">Last year</option>
                </select>
            </div>
            <button class="btn btn-primary" id="runBtn" disabled><i class="fas fa-play"></i> Run Audit</button>
        </div>
        <div id="bdrInfo" class="hidden" style="margin-top:1rem;"></div>
    </div>

    <div class="card hidden" id="progressCard">
        <div id="progressTitle" style="font-weight:700;"></div>
        <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
        <div class="log" id="log"></div>
    </div>

    <div id="results" class="hidden">
        <div class="stats-row" id="statsRow"></div>

        <div class="card">
            <div class="toolbar">
                <div class="controls-row">
                    <div class="view-toggle">
                        <button id="viewBatches" class="active"><i class="fas fa-layer-group"></i> Batches</button>
                        <button id="viewList"><i class="fas fa-list"></i> Individual</button>
                    </div>
                    <div class="control-group"><label>Batch gap</label>
                        <select id="gapSelect" title="Messages approved by the same person with less than this gap between them count as one batch">
                            <option value="2">2 min</option><option value="5" selected>5 min</option><option value="15">15 min</option><option value="60">60 min</option>
                        </select></div>
                    <div class="control-group"><label>Route</label>
                        <select id="routeSelect"><option value="">All routes</option></select></div>
                    <div class="control-group"><label>Type</label>
                        <select id="typeSelect"><option value="">Connect + Message</option><option value="connect">Connect requests</option><option value="message">Messages</option></select></div>
                    <div class="control-group"><label>Search</label>
                        <input id="searchBox" type="text" placeholder="Name / URL / message…"></div>
                    <label class="check-inline"><input type="checkbox" id="problemsOnly"> Problems only</label>
                </div>
                <div class="controls-row">
                    <button class="btn btn-blue" id="checkAllBtn"><i class="fas fa-magnifying-glass"></i> Check shown in HeyReach</button>
                    <button class="btn btn-accent hidden" id="moveBtn"><i class="fas fa-bolt"></i> <span id="moveBtnLabel">Move to Quick Message</span></button>
                    <button class="btn btn-secondary" id="csvBtn"><i class="fas fa-file-csv"></i> Export CSV</button>
                    <button class="btn btn-danger hidden" id="stopBtn"><i class="fas fa-stop"></i> Stop</button>
                </div>
            </div>
            <div class="note-banner" id="summaryNote"></div>
        </div>

        <div id="resultsBody"></div>
    </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/clemail-firestore-wrapper.js"></script>
<script src="healthconnect-header.js?v=3.4"></script>

<script type="module">
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
import { canonicalLinkedInUrl, classifyHrLead, fetchLiveCampaignStatusMap } from '../js/heyreach-live-status.js';

await window.firebaseReady;
const auth = window.auth;
const { collection, getDocs, getDoc, doc, query, where, addDoc, updateDoc, runTransaction, Timestamp } = window.clemailFirestore;
const emailDB = window.clemailDb;
const BACKEND = 'https://railwayclemail-production.up.railway.app';

// ── Constants ───────────────────────────────────────────────────────────────
const FCR_METHODS = [
    'fast_batch_review', 'fast_batch_review_campaign_fallback', 'fast_batch_review_direct_slot',
    'fast_batch_review_quick_message_campaign', 'fast_batch_review_reserve_queue', 'fast_batch_review_group_only_reserve'
];
const MOVABLE_SLOT = new Set(['pending', 'failed']);
const IN_FLIGHT_SLOT = new Set(['processing', 'sending', 'moving_to_quick_message']);
const NIGHTLY_CLEANUP_DAYS = 40;
const ROW_CAP = 1000;

const ROUTES = {
    campaign:      'Campaign push',
    direct_slot:   'Direct slot',
    quick_message: 'Quick Message',
    reserve:       'Reserve queue'
};

const VERDICTS = {
    delivered:       { label: 'Delivered / sent in HeyReach',   cls: 'b-green',  icon: 'fa-check-circle',        stat: 'green' },
    in_hr_pending:   { label: 'In HeyReach – not sent yet',     cls: 'b-blue',   icon: 'fa-hourglass-half',      stat: 'blue' },
    in_hr:           { label: 'In HeyReach (found by lookup)',  cls: 'b-blue',   icon: 'fa-magnifying-glass',    stat: 'blue' },
    hr_failed:       { label: 'HeyReach failed this lead',      cls: 'b-red',    icon: 'fa-triangle-exclamation', stat: 'red' },
    missing:         { label: 'MISSING from HeyReach',          cls: 'b-red',    icon: 'fa-circle-xmark',        stat: 'red' },
    push_failed:     { label: 'Push failed',                    cls: 'b-red',    icon: 'fa-ban',                 stat: 'red' },
    unverified:      { label: 'Pushed – not verified',          cls: 'b-amber',  icon: 'fa-question-circle',     stat: 'amber' },
    needs_move:      { label: 'In slot – needs Quick Message',  cls: 'b-amber',  icon: 'fa-bolt',                stat: 'amber' },
    slot_conflict:   { label: 'In slot – already in campaign',  cls: 'b-purple', icon: 'fa-clone',               stat: 'amber' },
    slot_stuck:      { label: 'Slot in flight / stuck',         cls: 'b-amber',  icon: 'fa-lock',                stat: 'amber' },
    slot_missing:    { label: 'Slot record not found',          cls: 'b-red',    icon: 'fa-circle-question',     stat: 'red' },
    awaiting_push:   { label: 'Approved – awaiting Connect Push', cls: 'b-amber', icon: 'fa-clock',             stat: 'amber' },
    awaiting_review: { label: 'Awaiting customer review',       cls: 'b-gray',   icon: 'fa-user-clock',          stat: 'gray' },
    in_reserve:      { label: 'In reserve queue',               cls: 'b-gray',   icon: 'fa-box-archive',         stat: 'gray' },
    sent_via_slot:   { label: 'Sent via slot (not Quick Msg)',  cls: 'b-gray',   icon: 'fa-paper-plane',         stat: 'gray' },
    purged:          { label: 'Removed by nightly cleanup',     cls: 'b-gray',   icon: 'fa-broom',               stat: 'gray' },
    deleted:         { label: 'Deleted / removed after submit', cls: 'b-gray',   icon: 'fa-trash',               stat: 'gray' },
    skipped:         { label: 'Skipped (duplicate / connected)', cls: 'b-gray',  icon: 'fa-forward',             stat: 'gray' },
    slot_other:      { label: 'Slot closed',                    cls: 'b-gray',   icon: 'fa-circle-minus',        stat: 'gray' },
};
const PROBLEM_VERDICTS = new Set(['missing', 'hr_failed', 'push_failed', 'needs_move', 'slot_conflict', 'slot_stuck', 'slot_missing']);
const CHECKABLE_VERDICTS = new Set(['missing', 'unverified', 'purged']);

// ── State ───────────────────────────────────────────────────────────────────
let currentUser = null, isAdmin = false, initialized = false, firstAuthFire = true;
let bdrLeaders = [];
let ctx = null;            // { bdr, emails, customerId, apiKey, campaigns[], hr: Map, leadCache: Map, loadedCampaigns: Set, tracking: Map }
let rows = [];             // all rows, newest first
let batches = new Map();   // batchId → { id, approver, start, end }
let view = 'batches';
let activeFilter = 'all';
let expanded = new Set();
let busy = false, cancelled = false;

// ── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toDate(v) {
    if (!v) return null;
    if (typeof v.toDate === 'function') return v.toDate();
    if (typeof v === 'object' && (v.seconds != null || v._seconds != null)) return new Date((v.seconds ?? v._seconds) * 1000);
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
}
const fmt = d => d ? d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const dataOf = snap => (snap && typeof snap.data === 'function') ? snap.data() : snap;
const existsOf = snap => snap && (typeof snap.exists === 'function' ? snap.exists() : snap.exists !== false);
const isAdminUser = u => { const d = (u?.email || '').split('@')[1]; return d === 'healthluminate.com' || d === 'careluminate.com'; };
const shortEmail = e => (e || 'unknown').split('@')[0];

function log(msg, cls = '') {
    $('progressCard').classList.remove('hidden');
    const el = $('log');
    el.innerHTML += `<span class="${cls}">${esc(msg)}</span>\n`;
    el.scrollTop = el.scrollHeight;
}
function progress(pct, title) {
    $('progressFill').style.width = `${Math.max(0, Math.min(100, pct))}%`;
    if (title) $('progressTitle').textContent = title;
}
function setBusy(on) {
    busy = on;
    $('runBtn').disabled = on || !$('bdrSelect').value;
    $('checkAllBtn').disabled = on;
    $('stopBtn').classList.toggle('hidden', !on);
    updateMoveButton();
}

// ── Auth / BDR list ─────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
    if (user) {
        firstAuthFire = false;
        localStorage.setItem('hl_active_session', Date.now().toString());
        currentUser = user;
        isAdmin = isAdminUser(user);
        if (!initialized) { initialized = true; await loadBdrs(); }
    } else {
        if (firstAuthFire) {
            firstAuthFire = false;
            await sleep(2500);
            if (auth.currentUser) return;
        }
        const t = parseInt(localStorage.getItem('hl_active_session') || '0', 10);
        if (t && Date.now() - t < 43200000) return;
        window.location.href = '../index.html';
    }
});

async function loadBdrs() {
    const snap = await getDocs(collection(emailDB, 'bdr_leaders'));
    bdrLeaders = [];
    snap.forEach(d => bdrLeaders.push({ id: d.id, ...d.data() }));
    const sel = $('bdrSelect');
    if (!isAdmin) {
        const me = (currentUser.email || '').toLowerCase();
        const mine = bdrLeaders.find(b => (b.primaryEmail || '').toLowerCase() === me);
        sel.innerHTML = `<option value="${esc(me)}">${esc(mine?.name || me)}</option>`;
        sel.value = me; sel.disabled = true; $('runBtn').disabled = false;
        return;
    }
    bdrLeaders.filter(b => b.primaryEmail)
        .sort((a, b) => ((a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1)) || (a.name || a.primaryEmail).localeCompare(b.name || b.primaryEmail))
        .forEach(b => {
            const o = document.createElement('option');
            o.value = b.primaryEmail.toLowerCase();
            const label = b.name ? `${b.name} (${b.primaryEmail})` : b.primaryEmail;
            o.textContent = b.status === 'active' ? label : `${label} — INACTIVE`;
            sel.appendChild(o);
        });
}
$('bdrSelect').addEventListener('change', () => { $('runBtn').disabled = busy || !$('bdrSelect').value; });
$('runBtn').addEventListener('click', () => runAudit());
$('stopBtn').addEventListener('click', () => { cancelled = true; });

// ── Context ─────────────────────────────────────────────────────────────────
async function resolveContext(email) {
    const matches = bdrLeaders.filter(b => (b.primaryEmail || '').toLowerCase() === email);
    const bdr = matches.find(b => b.status === 'active') || matches[0];
    if (!bdr) throw new Error(`No bdr_leaders record found for ${email}`);
    const emails = new Set([email]);
    [bdr.linkedInEmail, ...(bdr.emailAccountIds || [])].forEach(e => { if (e) emails.add(String(e).toLowerCase()); });
    const customerId = bdr.customerId || bdr.customer_id || bdr.customerID || null;
    let apiKey = null;
    if (customerId) apiKey = dataOf(await getDoc(doc(emailDB, 'customerList', customerId)))?.heyreachApiKey || null;
    return {
        bdr, emails: [...emails].slice(0, 10), customerId, apiKey,
        campaigns: (bdr.heyreachCampaigns || []),
        qmCampaigns: (bdr.heyreachCampaigns || []).filter(c => c.type === 'quick_message'),
        hr: new Map(), leadCache: new Map(), loadedCampaigns: new Set(), tracking: new Map()
    };
}

// Campaign health: HeyReach rejects EVERY add to a FAILED/FINISHED/CANCELED campaign
// ("You cannot add new leads to a failed campaign."), so surface the real status up front.
const BAD_CAMPAIGN_STATUSES = new Set(['FAILED', 'FINISHED', 'CANCELED', 'CANCELLED', 'DRAFT']);
async function loadCampaignStatuses() {
    ctx.campaignStatus = new Map();
    if (!ctx.apiKey || !ctx.qmCampaigns.length) return;
    const want = new Set(ctx.qmCampaigns.map(c => String(c.id)));
    try {
        for (let offset = 0; offset < 1000 && want.size; offset += 100) {
            const resp = await fetch(`${BACKEND}/proxy/heyreach/campaigns/getall`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': ctx.apiKey },
                body: JSON.stringify({ offset, limit: 100, keyword: '', status: 'all' })
            });
            if (!resp.ok) break;
            const j = await resp.json().catch(() => ({}));
            const items = Array.isArray(j) ? j : (j.items || j.data || j.result || []);
            items.forEach(it => {
                const id = String(it.id ?? it.campaignId ?? '');
                if (want.has(id)) { ctx.campaignStatus.set(id, { status: String(it.status ?? it.campaignStatus ?? 'UNKNOWN').toUpperCase().replace(/[\s-]/g, '_'), name: it.name }); want.delete(id); }
            });
            if (items.length < 100) break;
        }
    } catch (e) { log(`Could not read HeyReach campaign status: ${e.message}`, 'warn'); }
    ctx.campaignStatus.forEach((v, id) => log(`Quick Message campaign ${id} status in HeyReach: ${v.status}`, BAD_CAMPAIGN_STATUSES.has(v.status) ? 'bad' : 'ok'));
}
const badQmCampaigns = () => ctx.qmCampaigns.filter(c => BAD_CAMPAIGN_STATUSES.has(ctx.campaignStatus?.get(String(c.id))?.status));

function renderBdrInfo() {
    const c = ctx;
    const camp = c.qmCampaigns.map(x => {
        const st = c.campaignStatus?.get(String(x.id))?.status;
        const stBadge = st ? ` <span class="badge ${BAD_CAMPAIGN_STATUSES.has(st) ? 'b-red' : st === 'PAUSED' ? 'b-amber' : 'b-green'}">${esc(st)}</span>` : '';
        return `#${esc(x.id)}${x.name ? ' – ' + esc(x.name) : ''}${x.listId ? ' (list ' + esc(x.listId) + ')' : ''}${stBadge}`;
    }).join('<br>') || '<span style="color:#dc2626">None</span>';
    let html = `<div class="info-grid">
        <div><div class="k">BDR</div><div class="v">${esc(c.bdr.name || c.bdr.primaryEmail)} (${esc(c.bdr.primaryEmail)})</div></div>
        <div><div class="k">Customer</div><div class="v">${esc(c.customerId || '—')}</div></div>
        <div><div class="k">Quick Message campaign(s)</div><div class="v">${camp}</div></div>
        <div><div class="k">HeyReach API key</div><div class="v">${c.apiKey ? 'Found' : '<span style="color:#dc2626">Missing</span>'}</div></div>
    </div>`;
    badQmCampaigns().forEach(x => {
        const st = c.campaignStatus.get(String(x.id)).status;
        html += `<div class="err-box"><i class="fas fa-circle-exclamation"></i> <b>Quick Message campaign #${esc(x.id)} is ${esc(st)} in HeyReach.</b> HeyReach rejects every lead added to it (“You cannot add new leads to a failed campaign”), so nothing submitted to it can reach HeyReach and moving slots into it is disabled. Create or restart a Quick Message campaign in HeyReach, update this BDR's <code>quick_message</code> entry in <code>bdr_leaders.heyreachCampaigns</code> with the new campaign id/list id, then re-run the audit and resubmit.</div>`;
    });
    const pausedQm = c.qmCampaigns.filter(x => c.campaignStatus?.get(String(x.id))?.status === 'PAUSED');
    if (pausedQm.length) html += `<div class="err-box" style="background:#fef3c7;border-color:#fcd34d;color:#92400e"><i class="fas fa-pause"></i> Campaign #${esc(pausedQm[0].id)} is PAUSED — leads can be added but no messages will send until it is resumed.</div>`;
    if (!c.qmCampaigns.length) html += `<div class="err-box"><i class="fas fa-circle-exclamation"></i> No <code>quick_message</code> campaign in <code>bdr_leaders.heyreachCampaigns</code>. Harvest messages cannot be sent or moved until one is set up.</div>`;
    if (!c.customerId || !c.apiKey) html += `<div class="err-box"><i class="fas fa-circle-exclamation"></i> Missing customerId or HeyReach API key — HeyReach checks and moves are unavailable.</div>`;
    $('bdrInfo').innerHTML = html;
    $('bdrInfo').classList.remove('hidden');
}

// ── Data loading ────────────────────────────────────────────────────────────
async function queryIn(coll, field, emails, extra = []) {
    const out = [];
    const snap = await getDocs(query(collection(emailDB, coll), where(field, 'in', emails), ...extra));
    snap.forEach(d => out.push({ id: d.id, ...d.data() }));
    return out;
}

async function loadSubmissions(since) {
    const byId = new Map();
    const failed = [];
    const jobs = [];
    for (const m of FCR_METHODS) for (const f of ['account_email', 'bdr_auth_email']) {
        jobs.push(queryIn('connect_queue', f, ctx.emails, [where('approvalMethod', '==', m)])
            .then(list => list.forEach(d => byId.set(d.id, d)))
            .catch(e => failed.push({ f, m, e })));
    }
    await Promise.all(jobs);
    if (failed.length) {
        log(`${failed.length} indexed connect_queue queries failed (${failed[0].e.message}) — falling back to a BDR-wide scan`, 'warn');
        for (const f of ['account_email', 'bdr_auth_email']) {
            try { (await queryIn('connect_queue', f, ctx.emails)).filter(d => String(d.approvalMethod || '').startsWith('fast_batch_review')).forEach(d => byId.set(d.id, d)); }
            catch (e) { log(`Fallback scan on ${f} failed: ${e.message}`, 'bad'); }
        }
    }
    return [...byId.values()].filter(d => { const t = subTime(d); return !t || t >= since; });
}
const subTime = d => toDate(d.adminApprovedAt) || toDate(d.pushed_at) || toDate(d.batchApprovalTimestamp) || toDate(d.routed_at);

async function loadCampaignLeads(ids) {
    for (const id of ids) {
        const sid = String(id);
        if (ctx.loadedCampaigns.has(sid) || !ctx.apiKey) continue;
        const m = await fetchLiveCampaignStatusMap({ backendUrl: BACKEND, apiKey: ctx.apiKey, campaignId: sid });
        m.forEach((v, k) => { v.campaignId = sid; if (!ctx.hr.has(k)) ctx.hr.set(k, v); });
        ctx.loadedCampaigns.add(sid);
        log(`HeyReach campaign ${sid}: ${m.size} leads loaded`, m.size ? 'ok' : 'warn');
    }
}

async function runAudit() {
    const email = $('bdrSelect').value;
    if (!email || busy) return;
    const since = new Date(Date.now() - (parseInt($('daysSelect').value, 10) || 45) * 86400000);
    cancelled = false; setBusy(true);
    $('results').classList.add('hidden');
    $('log').innerHTML = '';
    try {
        progress(3, 'Resolving BDR…');
        ctx = await resolveContext(email);
        await loadCampaignStatuses();
        renderBdrInfo();
        log(`BDR identity emails: ${ctx.emails.join(', ')}`);

        progress(10, 'Loading Fast Connect Review submissions…');
        const subs = await loadSubmissions(since);
        log(`Fast Connect Review submissions in window: ${subs.length}`, 'ok');

        progress(30, 'Loading LinkedIn message slots…');
        const slots = await queryIn('linkedin_message_queue', 'bdrEmail', ctx.emails);
        log(`Slots for this BDR (all time): ${slots.length}`, 'ok');

        progress(40, 'Loading Quick Message send records…');
        let acts;
        try { acts = await queryIn('connect_activity', 'bdrEmail', ctx.emails, [where('via', '==', 'quick_message_campaign')]); }
        catch (e) { log(`Indexed activity query failed (${e.message}); using wider scan`, 'warn'); acts = (await queryIn('connect_activity', 'bdrEmail', ctx.emails)).filter(a => a.via === 'quick_message_campaign'); }
        log(`Quick Message send records (all time): ${acts.length}`, 'ok');

        // Campaigns to pull from HeyReach: Quick Message + every campaign a pushed submission names
        const campIds = new Set(ctx.qmCampaigns.map(c => String(c.id)));
        subs.forEach(s => { if (s.heyreach_campaign_id) campIds.add(String(s.heyreach_campaign_id)); });
        const ids = [...campIds].slice(0, 12);
        for (let i = 0; i < ids.length; i++) {
            progress(45 + (i / ids.length) * 35, `Fetching HeyReach leads for campaign ${ids[i]}…`);
            await loadCampaignLeads([ids[i]]);
            if (cancelled) break;
        }
        for (const camp of ctx.qmCampaigns) {
            try {
                const ts = await getDocs(query(collection(emailDB, 'quick_message_campaign_leads'), where('campaignId', '==', String(camp.id))));
                ts.forEach(d => {
                    const t = d.data(); const k = canonicalLinkedInUrl(t.linkedinUrl); if (!k) return;
                    const prev = ctx.tracking.get(k);
                    if (!prev || (toDate(t.addedAt) || 0) > (toDate(prev.addedAt) || 0)) ctx.tracking.set(k, t);
                });
            } catch (e) { log(`Tracking lookup failed: ${e.message}`, 'warn'); }
        }

        progress(88, 'Comparing…');
        buildRows({ subs, slots, acts, since });
        computeBatches();
        rows.forEach(evaluate);
        const known = new Set(rows.map(r => r.urlKey).filter(Boolean));
        ctx.hrOnlyCount = [...ctx.hr.keys()].filter(k => !known.has(k)).length;
        progress(100, 'Audit complete');
        log(`Audit complete: ${rows.length} messages in ${batches.size} batch(es).`, 'ok');
        populateRouteFilter();
        $('results').classList.remove('hidden');
        renderAll();
    } catch (err) {
        console.error(err);
        log(`Audit failed: ${err.message}`, 'bad');
        progress(0, 'Audit failed');
    } finally { setBusy(false); }
}

// ── Row model ───────────────────────────────────────────────────────────────
function routeOf(sub) {
    const m = sub.approvalMethod || '';
    if (sub.routed_via === 'quick_message_campaign' || m === 'fast_batch_review_quick_message_campaign') return 'quick_message';
    if (m === 'fast_batch_review_direct_slot' || sub.routed_via === 'direct_slot') return 'direct_slot';
    if (m.includes('reserve')) return 'reserve';
    return 'campaign';
}

function buildRows({ subs, slots, acts, since }) {
    const slotsById = new Map(slots.map(s => [s.id, s]));
    const slotsBySource = new Map();
    slots.forEach(s => { if (s.sourceMessageId) { if (!slotsBySource.has(s.sourceMessageId)) slotsBySource.set(s.sourceMessageId, []); slotsBySource.get(s.sourceMessageId).push(s); } });
    const actsBySource = new Map();
    acts.forEach(a => { if (a.connect_queue_id) { if (!actsBySource.has(a.connect_queue_id)) actsBySource.set(a.connect_queue_id, []); actsBySource.get(a.connect_queue_id).push(a); } });
    const claimedSlots = new Set(), claimedActs = new Set();
    rows = [];

    subs.forEach(sub => {
        const url = sub.prospect_li_url || sub.contact_linkedin_url || sub.linkedin_url || sub.linkedInUrl || '';
        const mySends = actsBySource.get(sub.id) || [];
        mySends.forEach(a => claimedActs.add(a.id));
        let slot = (sub.routed_slot_id && slotsById.get(sub.routed_slot_id)) || (slotsBySource.get(sub.id) || [])[0] || null;
        if (slot) claimedSlots.add(slot.id);
        rows.push({
            id: sub.id, kind: 'submission', sub, route: routeOf(sub), url,
            name: sub.contactName || sub.prospect_name || `${sub.contactFirstName || sub.prospect_first_name || ''} ${sub.contactLastName || sub.prospect_last_name || ''}`.trim(),
            message: sub.message_to_contact || sub.message || '',
            type: sub.message_type || 'connect',
            approver: (sub.pushed_by || sub.adminApprovedBy || '').toLowerCase(),
            time: subTime(sub), source: sub.source || '', sends: mySends, slot
        });
    });

    // Slots / Quick Message sends that have no Fast Connect Review submission doc in the window
    slots.forEach(s => {
        if (claimedSlots.has(s.id)) return;
        const t = toDate(s.createdAt) || toDate(s.scheduledTime);
        const unfinished = MOVABLE_SLOT.has(s.status) || IN_FLIGHT_SLOT.has(s.status);
        if (!unfinished && t && t < since) return;
        rows.push({
            id: 'slot:' + s.id, kind: 'orphan_slot', sub: null, route: 'direct_slot', url: s.recipientLinkedInUrl || '',
            name: s.recipientName || '', message: s.message || '', type: 'message',
            approver: (s.createdBy || s.pushed_by || '').toLowerCase(), time: t, source: s.sourceMessageSource || '', sends: [], slot: s
        });
    });
    acts.forEach(a => {
        if (claimedActs.has(a.id)) return;
        const t = toDate(a.timestamp) || toDate(a.createdAt);
        if (t && t < since) return;
        rows.push({
            id: 'act:' + a.id, kind: 'orphan_send', sub: null, route: 'quick_message', url: a.contactLinkedInUrl || a.prospect_li_url || '',
            name: a.contactName || '', message: a.messageContent || a.message_to_contact || '', type: 'message',
            approver: (a.pushedBy || '').toLowerCase(), time: t, source: a.source || '', sends: [a], slot: null
        });
    });

    rows.forEach(r => { r.urlKey = canonicalLinkedInUrl(r.url) || ''; });
    rows.sort((a, b) => (b.time || 0) - (a.time || 0));
}

function computeBatches() {
    const gapMs = (parseInt($('gapSelect').value, 10) || 5) * 60000;
    batches = new Map();
    const byApprover = new Map();
    rows.forEach(r => { const k = r.approver || 'unknown'; if (!byApprover.has(k)) byApprover.set(k, []); byApprover.get(k).push(r); });
    byApprover.forEach((list, approver) => {
        const dated = list.filter(r => r.time).sort((a, b) => a.time - b.time);
        let cur = null;
        dated.forEach(r => {
            if (!cur || r.time - cur.end > gapMs) {
                cur = { id: `${approver}|${r.time.toISOString()}`, approver, start: r.time, end: r.time };
                batches.set(cur.id, cur);
            }
            cur.end = r.time; r.batchId = cur.id;
        });
        const undated = list.filter(r => !r.time);
        if (undated.length) {
            const id = `${approver}|undated`;
            batches.set(id, { id, approver, start: null, end: null });
            undated.forEach(r => { r.batchId = id; });
        }
    });
}

// ── Evaluation ──────────────────────────────────────────────────────────────
function attachHr(r) {
    r.hr = ctx.hr.get(r.urlKey) || null;
    if (!r.hr && r.urlKey) {
        const c = ctx.leadCache.get(r.urlKey);
        if (c?.found) {
            const lead = c.lead || {};
            r.hr = { ...classifyHrLead(lead), lead, elsewhere: true, hasStatus: !!(lead.leadCampaignStatus || lead.leadConnectionStatus || lead.leadMessageStatus) };
        }
    }
}
function hrVerdict(r) {
    const h = r.hr;
    if (h.elsewhere && !h.hasStatus) return 'in_hr';
    if (h.isTerminal && !h.isAlreadySent) { r.note = h.reason || ''; return 'hr_failed'; }
    if (h.isAlreadySent) return 'delivered';
    return 'in_hr_pending';
}

function evaluate(r) {
    attachHr(r);
    r.note = ''; r.movableSlot = null;
    const sub = r.sub || {}, slot = r.slot;
    const movedQM = (slot && slot.status === 'moved_to_quick_message') || sub.routed_via === 'quick_message_campaign';
    const isQM = r.route === 'quick_message' || r.sends.length > 0 || movedQM;

    if (r.route === 'direct_slot' && !isQM) {
        if (!slot) { r.verdict = 'slot_missing'; r.note = `Slot ${sub.routed_slot_id || ''} not found in linkedin_message_queue — message may never have been scheduled.`; return; }
        if (IN_FLIGHT_SLOT.has(slot.status)) { r.verdict = 'slot_stuck'; r.note = `Slot status "${slot.status}" — another process is working on it`; return; }
        if (MOVABLE_SLOT.has(slot.status)) {
            if (r.hr) { r.verdict = 'slot_conflict'; r.note = 'Contact is already in the campaign — HeyReach would only update the old lead and NOT send. Left in slot.'; }
            else { r.verdict = 'needs_move'; r.movableSlot = slot; if (slot.status === 'failed') r.note = slot.lastError || slot.error || 'Slot send failed'; }
            return;
        }
        if (slot.status === 'sent') { r.verdict = 'sent_via_slot'; return; }
        r.verdict = 'slot_other'; r.note = `Slot status: ${slot.status}`; return;
    }

    if (isQM) {
        const sentAt = toDate(r.sends[0]?.timestamp || r.sends[0]?.createdAt) || toDate(slot?.movedToQuickMessageAt) || toDate(sub.routed_at) || r.time;
        const ageDays = sentAt ? (Date.now() - sentAt.getTime()) / 86400000 : 0;
        const track = ctx.tracking.get(r.urlKey);
        if (r.hr) r.verdict = hrVerdict(r);
        else if ((track && track.status && track.status !== 'active') || ageDays > NIGHTLY_CLEANUP_DAYS) { r.verdict = 'purged'; r.note = track ? `Tracking status: ${track.status}` : `Older than ${NIGHTLY_CLEANUP_DAYS} days`; }
        else { r.verdict = 'missing'; r.note = track ? 'Server recorded the add, but HeyReach does not list this lead in the campaign.' : 'No server tracking record and HeyReach does not list the lead.'; }
        if (!r.sends.length && !movedQM) r.note += (r.note ? ' ' : '') + 'No Quick Message send record was written for this submission.';
        return;
    }

    // Campaign push / reserve routes (sent to HeyReach later by Connect Push)
    if (r.hr) { r.verdict = hrVerdict(r); return; }
    const rs = sub.reviewStatus;
    if (rs === 'duplicate' || rs === 'already_connected') { r.verdict = 'skipped'; r.note = rs; return; }
    if (sub.push_failed) { r.verdict = 'push_failed'; r.note = sub.push_failure_reason || ''; return; }
    if (sub.deleted) { r.verdict = 'deleted'; r.note = sub.deleted_reason || ''; return; }
    if (sub.pushed_to_heyreach) {
        r.verdict = r.checked ? 'missing' : 'unverified';
        r.note = r.checked ? 'Marked pushed to HeyReach, but a HeyReach lookup did not find this lead.' : 'Marked pushed — run “Check in HeyReach” to confirm.';
        return;
    }
    if (rs === 'pending_customer_review') { r.verdict = 'awaiting_review'; return; }
    r.verdict = r.route === 'reserve' ? 'in_reserve' : 'awaiting_push';
}

// ── Filtering / rendering ───────────────────────────────────────────────────
function populateRouteFilter() {
    const sel = $('routeSelect'); const cur = sel.value;
    sel.innerHTML = '<option value="">All routes</option>' + Object.entries(ROUTES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    sel.value = cur;
}
function baseFiltered() {
    const q = $('searchBox').value.trim().toLowerCase();
    const route = $('routeSelect').value, type = $('typeSelect').value, problems = $('problemsOnly').checked;
    return rows.filter(r => (!route || r.route === route) && (!type || r.type === type) && (!problems || PROBLEM_VERDICTS.has(r.verdict)) &&
        (!q || `${r.name} ${r.url} ${r.message}`.toLowerCase().includes(q)));
}
const visibleRows = () => baseFiltered().filter(r => activeFilter === 'all' || r.verdict === activeFilter);

function routeLabel(r) {
    const moved = (r.slot && r.slot.status === 'moved_to_quick_message');
    return moved ? 'Direct slot → Quick Message' : (ROUTES[r.route] || r.route);
}
const verdictBadge = r => { const v = VERDICTS[r.verdict]; return `<span class="badge ${v.cls}"><i class="fas ${v.icon}"></i> ${esc(v.label)}</span>`; };

function renderAll() {
    const base = baseFiltered();
    const c = { all: base.length }; Object.keys(VERDICTS).forEach(k => c[k] = 0);
    base.forEach(r => c[r.verdict]++);
    const order = ['all', ...Object.keys(VERDICTS)];
    $('statsRow').innerHTML = order.filter(k => k === 'all' || c[k]).map(k => {
        const v = k === 'all' ? { label: 'All messages', stat: 'blue' } : VERDICTS[k];
        return `<div class="stat-card c-${v.stat} ${activeFilter === k ? 'active' : ''}" data-filter="${k}"><div class="stat-number">${c[k]}</div><div class="stat-label">${esc(v.label)}</div></div>`;
    }).join('');
    document.querySelectorAll('#statsRow .stat-card').forEach(el => el.addEventListener('click', () => { activeFilter = el.dataset.filter; renderAll(); }));

    const vis = visibleRows();
    $('summaryNote').textContent = `${vis.length} message(s) shown · ${ctx.hr.size} lead(s) loaded from HeyReach campaigns (${ctx.hrOnlyCount ?? 0} not tied to a message in this window). “Pushed – not verified” rows need a HeyReach lookup — use “Check shown in HeyReach” or a batch's Check button.`;
    $('viewBatches').classList.toggle('active', view === 'batches');
    $('viewList').classList.toggle('active', view === 'list');
    $('resultsBody').innerHTML = view === 'batches' ? batchesHtml(vis) : `<div class="card"><div class="table-wrap">${tableHtml(vis)}</div></div>`;
    updateMoveButton();
}

function batchesHtml(vis) {
    const by = new Map();
    vis.forEach(r => { if (!by.has(r.batchId)) by.set(r.batchId, []); by.get(r.batchId).push(r); });
    if (!by.size) return '<div class="card empty">Nothing matches the current filters.</div>';
    const list = [...by.entries()].map(([id, rs]) => ({ b: batches.get(id) || { id, approver: '?', start: null, end: null }, rs }))
        .sort((x, y) => (y.b.start || 0) - (x.b.start || 0));
    return list.map(({ b, rs }) => {
        const vc = {}, rc = {};
        rs.forEach(r => { vc[r.verdict] = (vc[r.verdict] || 0) + 1; rc[routeLabel(r)] = (rc[routeLabel(r)] || 0) + 1; });
        const bar = Object.entries(vc).map(([k, n]) => {
            const col = { green: '#10b981', blue: '#3b82f6', red: '#ef4444', amber: '#f59e0b', gray: '#94a3b8' }[VERDICTS[k].stat];
            return `<div title="${esc(VERDICTS[k].label)}: ${n}" style="width:${(n / rs.length) * 100}%;background:${col}"></div>`;
        }).join('');
        const chips = Object.entries(vc).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="badge ${VERDICTS[k].cls}">${n} · ${esc(VERDICTS[k].label)}</span>`).join('')
            + Object.entries(rc).map(([k, n]) => `<span class="badge b-gray" style="background:#fff;border:1px solid var(--border)">${n} ${esc(k)}</span>`).join('');
        const isOpen = expanded.has(b.id);
        const movable = rs.filter(r => r.movableSlot).length;
        const when = b.start ? `${fmt(b.start)}${b.end - b.start > 60000 ? ' → ' + fmt(b.end) : ''}` : 'No timestamp';
        return `<div class="batch-card" data-batch="${esc(b.id)}">
            <div class="batch-head">
                <div>
                    <div class="batch-title"><i class="fas fa-layer-group" style="color:#64748b"></i> ${esc(when)} <span class="batch-meta">· submitted by ${esc(shortEmail(b.approver))} · ${rs.length} message(s)</span></div>
                    <div class="chips">${chips}</div>
                    <div class="batch-bar">${bar}</div>
                </div>
                <div class="batch-actions">
                    <button class="btn btn-blue btn-sm" data-act="batch-check"><i class="fas fa-magnifying-glass"></i> Check in HeyReach</button>
                    ${isAdmin && movable ? `<button class="btn btn-accent btn-sm" data-act="batch-move"><i class="fas fa-bolt"></i> Move ${movable} slot${movable === 1 ? '' : 's'} to Quick Message</button>` : ''}
                    <button class="btn btn-secondary btn-sm" data-act="batch-toggle"><i class="fas fa-chevron-${isOpen ? 'up' : 'down'}"></i> ${isOpen ? 'Hide' : 'Show'} messages</button>
                </div>
            </div>
            ${isOpen ? `<div class="batch-body">${tableHtml(rs)}</div>` : ''}
        </div>`;
    }).join('');
}

function tableHtml(list) {
    if (!list.length) return '<div class="empty">Nothing matches the current filters.</div>';
    const shown = list.slice(0, ROW_CAP);
    return `<table><thead><tr>
        <th style="width:28px;"><input type="checkbox" data-act="sel-all" title="Select all movable"></th>
        <th>Contact</th><th>Verdict</th><th>Submitted</th><th>HeyReach</th><th>Message</th></tr></thead><tbody>
        ${shown.map(rowHtml).join('')}</tbody></table>
        ${list.length > shown.length ? `<div class="empty">Showing the first ${ROW_CAP} of ${list.length}. Narrow the filters or export CSV for everything.</div>` : ''}`;
}

function rowHtml(r) {
    const sub = r.sub || {};
    const ours = [`<div><b>${esc(routeLabel(r))}</b> · ${esc(r.type)}${r.source ? ' · ' + esc(r.source) : ''}</div>`, `<div>${fmt(r.time)} · ${esc(shortEmail(r.approver))}</div>`];
    if (sub.pushed_to_heyreach) ours.push(`<div>Pushed ${fmt(toDate(sub.heyreach_push_date))}${sub.heyreach_campaign_name ? ' → ' + esc(sub.heyreach_campaign_name) : ''}</div>`);
    r.sends.slice(0, 2).forEach(a => ours.push(`<div>Quick Msg add ${fmt(toDate(a.timestamp || a.createdAt))}${a.hrResult ? ` (+${a.hrResult.added ?? '?'}/~${a.hrResult.updated ?? '?'})` : ''}${a.movedFromSlotId ? ' · from slot' : ''}</div>`));
    if (r.slot) ours.push(`<div>Slot <b>${esc(r.slot.status)}</b> · ${fmt(toDate(r.slot.sentAt) || toDate(r.slot.scheduledTime))}</div>`);

    let hrCell;
    if (r.hr) {
        const l = r.hr.lead || {};
        hrCell = `<div>${esc(l.leadCampaignStatus || l.status || (r.hr.elsewhere ? 'Found' : '—'))}${r.hr.campaignId ? ` <span class="td-sub">· campaign ${esc(r.hr.campaignId)}</span>` : (r.hr.elsewhere ? ' <span class="td-sub">· found via lookup</span>' : '')}</div>
            <div class="td-sub">conn: ${esc(l.leadConnectionStatus || '—')} · msg: ${esc(l.leadMessageStatus || '—')}</div>`;
    } else hrCell = r.checked ? '<span class="td-sub" style="color:#b91c1c;font-weight:700">Not found in HeyReach</span>' : '<span class="td-sub">Not in loaded campaigns (unchecked)</span>';
    if (r.checkError) hrCell += `<div class="td-sub" style="color:#b91c1c">${esc(r.checkError)}</div>`;
    if (r.urlKey) hrCell += `<div><button class="btn btn-secondary btn-sm" data-act="row-check" data-id="${esc(r.id)}" style="margin-top:.25rem"><i class="fas fa-magnifying-glass"></i> Check</button></div>`;

    return `<tr>
        <td>${r.movableSlot ? `<input type="checkbox" class="rowSel" data-id="${esc(r.id)}" checked>` : ''}</td>
        <td><div class="td-name">${esc(r.name || '(unknown)')}</div>
            <div class="td-sub">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\/(www\.)?linkedin\.com/, ''))}</a>` : 'no URL'}</div></td>
        <td>${verdictBadge(r)}${r.note ? `<div class="td-sub" style="margin-top:.25rem;max-width:300px;">${esc(r.note)}</div>` : ''}</td>
        <td class="td-sub">${ours.join('')}</td>
        <td>${hrCell}</td>
        <td class="td-msg"><div>${esc(r.message)}</div></td></tr>`;
}

// ── Events ──────────────────────────────────────────────────────────────────
['searchBox', 'routeSelect', 'typeSelect', 'problemsOnly'].forEach(id => $(id).addEventListener(id === 'searchBox' ? 'input' : 'change', () => rows.length && renderAll()));
$('gapSelect').addEventListener('change', () => { if (!rows.length) return; computeBatches(); renderAll(); });
$('viewBatches').addEventListener('click', () => { view = 'batches'; rows.length && renderAll(); });
$('viewList').addEventListener('click', () => { view = 'list'; rows.length && renderAll(); });
$('checkAllBtn').addEventListener('click', () => checkRows(visibleRows()));
$('moveBtn').addEventListener('click', () => runMove(selectedMovableRows()));

$('resultsBody').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'sel-all') { btn.closest('table').querySelectorAll('.rowSel').forEach(el => { el.checked = btn.checked; }); updateMoveButton(); return; }
    if (act === 'row-check') { const r = rows.find(x => x.id === btn.dataset.id); if (r) checkRows([r]); return; }
    const card = btn.closest('.batch-card'); if (!card) return;
    const id = card.dataset.batch;
    const batchRows = visibleRows().filter(r => r.batchId === id);
    if (act === 'batch-toggle') { expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderAll(); }
    if (act === 'batch-check') checkRows(batchRows);
    if (act === 'batch-move') runMove(batchRows.filter(r => r.movableSlot));
});
$('resultsBody').addEventListener('change', e => { if (e.target.classList.contains('rowSel')) updateMoveButton(); });

function selectedMovableRows() {
    const ids = new Set([...document.querySelectorAll('.rowSel:checked')].map(el => el.dataset.id));
    return rows.filter(r => r.movableSlot && ids.has(r.id));
}
function updateMoveButton() {
    const canMove = isAdmin && ctx?.qmCampaigns?.length && ctx.customerId && ctx.apiKey && rows.some(r => r.movableSlot) && !badQmCampaigns().some(c => String(c.id) === String(ctx.qmCampaigns[0].id));
    const sel = selectedMovableRows().length;
    $('moveBtn').classList.toggle('hidden', !canMove);
    $('moveBtnLabel').textContent = `Move ${sel} selected slot${sel === 1 ? '' : 's'} to Quick Message`;
    $('moveBtn').disabled = busy || sel === 0;
}

// ── Check in HeyReach ───────────────────────────────────────────────────────
async function checkRows(list) {
    if (busy || !list.length) return;
    if (!ctx.apiKey) { alert('No HeyReach API key is configured for this BDR\'s customer.'); return; }
    cancelled = false; setBusy(true);
    try {
        // 1. Load any campaign a pushed row names that we haven't pulled yet
        const campIds = new Set();
        list.forEach(r => { if (r.sub?.heyreach_campaign_id) campIds.add(String(r.sub.heyreach_campaign_id)); });
        const toLoad = [...campIds].filter(id => !ctx.loadedCampaigns.has(id));
        if (toLoad.length) { progress(5, `Loading ${toLoad.length} HeyReach campaign(s)…`); await loadCampaignLeads(toLoad); }
        list.forEach(evaluate);

        // 2. Individual GetLead for anything still unresolved that should be in HeyReach
        const unresolved = [], seen = new Set();
        list.forEach(r => {
            if (!r.urlKey || r.hr) return;
            // Explicit single-row checks always run; bulk checks only target rows that should already be in HeyReach
            if (list.length > 1 && !CHECKABLE_VERDICTS.has(r.verdict)) return;
            if (ctx.leadCache.has(r.urlKey) && !ctx.leadCache.get(r.urlKey).error) return;
            if (seen.has(r.urlKey)) return;
            seen.add(r.urlKey); unresolved.push(r);
        });
        log(`HeyReach check: ${list.length} message(s) in scope, ${unresolved.length} need an individual lookup.`);
        for (let i = 0; i < unresolved.length; i++) {
            if (cancelled) { log('Stopped by user.', 'warn'); break; }
            const r = unresolved[i];
            progress(10 + (i / unresolved.length) * 88, `Looking up ${i + 1} / ${unresolved.length} in HeyReach…`);
            if (i > 0 && i % 5 === 0) await sleep(400);
            try {
                const resp = await fetch(`${BACKEND}/proxy/heyreach/leads/getlead`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': ctx.apiKey },
                    body: JSON.stringify({ profileUrl: r.url })
                });
                if (resp.status === 404) ctx.leadCache.set(r.urlKey, { found: false });
                else if (resp.ok) {
                    const d = await resp.json();
                    const lead = d?.lead || d;
                    const found = !!(lead && (lead.id || lead.leadId || lead.profileUrl || lead.linkedInUserProfile));
                    ctx.leadCache.set(r.urlKey, found ? { found: true, lead } : { found: false });
                } else ctx.leadCache.set(r.urlKey, { error: `HTTP ${resp.status}` });
            } catch (e) { ctx.leadCache.set(r.urlKey, { error: e.message }); }
        }
        // 3. Mark checked + re-evaluate
        list.forEach(r => {
            const c = ctx.leadCache.get(r.urlKey);
            r.checked = !!(c && !c.error) || r.checked;
            r.checkError = c?.error || '';
            evaluate(r);
        });
        const found = list.filter(r => r.hr).length;
        const notFound = list.filter(r => r.checked && !r.hr).length;
        progress(100, `Check complete — ${found} in HeyReach, ${notFound} not found`);
        log(`Check complete: ${found} of ${list.length} in HeyReach; ${notFound} confirmed not found.`, notFound ? 'warn' : 'ok');
    } catch (err) { log(`Check failed: ${err.message}`, 'bad'); }
    finally { setBusy(false); renderAll(); }
}

// ── CSV ─────────────────────────────────────────────────────────────────────
$('csvBtn').addEventListener('click', () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['Batch start', 'Submitted by', 'Approved at', 'Name', 'LinkedIn URL', 'Route', 'Type', 'Verdict', 'Note', 'Slot status', 'Push date', 'HeyReach campaign status', 'Connection status', 'Message status', 'Message'].map(q).join(',')];
    visibleRows().forEach(r => {
        const l = r.hr?.lead || {}, b = batches.get(r.batchId);
        lines.push([b?.start?.toISOString() || '', r.approver, r.time?.toISOString() || '', r.name, r.url, routeLabel(r), r.type, VERDICTS[r.verdict].label, r.note,
            r.slot?.status || '', toDate(r.sub?.heyreach_push_date)?.toISOString() || '', l.leadCampaignStatus || '', l.leadConnectionStatus || '', l.leadMessageStatus || '', r.message].map(q).join(','));
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = `bdr_send_audit_${(ctx?.bdr?.primaryEmail || 'bdr').replace(/[^a-z0-9]/gi, '_')}_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
});

// ── Move slots → Quick Message ──────────────────────────────────────────────
async function runMove(targets) {
    if (!targets.length || busy) return;
    const camp = ctx.qmCampaigns[0];
    if (!camp) { alert('This BDR has no Quick Message campaign.'); return; }
    const st = ctx.campaignStatus?.get(String(camp.id))?.status;
    if (BAD_CAMPAIGN_STATUSES.has(st)) { alert(`Quick Message campaign #${camp.id} is ${st} in HeyReach — HeyReach will reject every lead. Fix or replace the campaign first.`); return; }
    const extra = ctx.qmCampaigns.length > 1 ? `\n\nNote: this BDR has ${ctx.qmCampaigns.length} Quick Message campaigns; the first (#${camp.id}) is used, same as Fast Connect Review.` : '';
    if (!confirm(`Move ${targets.length} pending slot message(s) for ${ctx.bdr.name || ctx.bdr.primaryEmail} into Quick Message campaign #${camp.id}?\n\n` +
        `Each slot is first locked so the scheduler cannot also send it, then added to HeyReach. ` +
        `If HeyReach rejects a contact (e.g. already in the campaign) its slot is restored unchanged.${extra}`)) return;

    cancelled = false; setBusy(true);
    let ok = 0, fail = 0, skipped = 0;
    log(`── Moving ${targets.length} slot message(s) to campaign #${camp.id} ──`);
    for (let i = 0; i < targets.length; i++) {
        if (cancelled) { log('Stopped by user.', 'warn'); break; }
        const r = targets[i];
        progress(Math.round((i / targets.length) * 100), `Moving ${i + 1} / ${targets.length}…`);
        const res = await moveSlot(r.movableSlot, camp);
        if (res.ok) ok++; else if (res.skipped) skipped++; else fail++;
        log(`${res.ok ? '✔' : res.skipped ? '↷' : '✘'} ${r.name || r.url}: ${res.msg}`, res.ok ? 'ok' : res.skipped ? 'warn' : 'bad');
        await sleep(350);
    }
    progress(100, `Done — moved ${ok}, failed ${fail}, skipped ${skipped}`);
    log(`── Finished: ${ok} moved, ${fail} failed, ${skipped} skipped ──`, ok ? 'ok' : 'warn');
    setBusy(false);
    await runAudit();
}

async function moveSlot(slot, camp) {
    const slotRef = doc(emailDB, 'linkedin_message_queue', slot.id);
    const originalStatus = slot.status;
    const url = slot.recipientLinkedInUrl;
    if (!url) return { ok: false, msg: 'Slot has no LinkedIn URL — cannot add to a campaign' };
    if (!slot.message) return { ok: false, msg: 'Slot has no message text' };

    // Claim: pending/failed → moving_to_quick_message so the scheduler cannot send it concurrently
    let claimed = false;
    try {
        claimed = await runTransaction(emailDB, async tx => {
            const snap = await tx.get(slotRef);
            if (!existsOf(snap)) return false;
            if (!MOVABLE_SLOT.has(dataOf(snap).status)) return false;
            tx.update(slotRef, { status: 'moving_to_quick_message', movingAt: Timestamp.now(), movingBy: currentUser.email, statusBeforeMove: dataOf(snap).status });
            return true;
        });
    } catch (e) { return { ok: false, msg: `Could not lock slot: ${e.message}` }; }
    if (!claimed) return { skipped: true, msg: 'Slot is no longer pending (already sent or being processed) — left alone' };

    const restore = async reason => {
        try { await updateDoc(slotRef, { status: originalStatus, lastMoveError: reason, lastMoveAttemptAt: Timestamp.now() }); } catch (e) { console.error('restore failed', e); }
    };

    try {
        let company = '', position = '', firstName = '', lastName = '';
        if (slot.sourceMessageId) {
            try {
                const cq = dataOf(await getDoc(doc(emailDB, 'connect_queue', slot.sourceMessageId))) || {};
                company = cq.contactCompany || cq.prospect_company || '';
                position = cq.contactTitle || cq.prospect_title || cq.prospect_position || '';
                firstName = cq.contactFirstName || cq.prospect_first_name || cq.firstName || '';
                lastName = cq.contactLastName || cq.prospect_last_name || cq.lastName || '';
            } catch (e) { /* enrichment is best-effort */ }
        }
        if (!firstName && !lastName) {
            const parts = (slot.recipientName || '').trim().split(/\s+/);
            firstName = parts.shift() || ''; lastName = parts.join(' ');
        }

        const resp = await fetch(`${BACKEND}/api/mass-messages/add-lead`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customerId: ctx.customerId, campaignId: String(camp.id), linkedinUrl: url,
                firstName, lastName, company, position, customMessage: slot.message,
                ...(camp.accountId ? { accountId: String(camp.accountId) } : {}),
                ...(camp.listId ? { listId: String(camp.listId) } : {})
            })
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${(await resp.text()).slice(0, 200)}`);
        const data = await resp.json();
        if (data?.success === false) {
            throw new Error(data.alreadyInCampaign
                ? 'Already in this campaign\'s history — HeyReach will not send a new message'
                : (data.error || 'HeyReach rejected the lead'));
        }
        const hrResult = { added: data?.added ?? null, updated: data?.updated ?? null, failed: data?.failed ?? null, usedListFallback: !!data?.meta?.fallbackResults };

        await updateDoc(slotRef, {
            status: 'moved_to_quick_message', movedToQuickMessageAt: Timestamp.now(), movedToQuickMessageBy: currentUser.email,
            movedToCampaignId: String(camp.id), movedHrResult: hrResult, lastMoveError: null
        });
        const bdrEmail = slot.bdrEmail || ctx.bdr.primaryEmail.toLowerCase();
        try {
            await addDoc(collection(emailDB, 'connect_activity'), {
                actionType: 'push_to_heyreach', status: 'added', via: 'quick_message_campaign',
                contactName: `${firstName} ${lastName}`.trim(), contactFirstName: firstName, contactLastName: lastName,
                contactLinkedInUrl: url, prospect_li_url: url, messageContent: slot.message, message_to_contact: slot.message,
                contactCompany: company, contactTitle: position, bdrEmail, account_email: bdrEmail,
                campaignId: String(camp.id), hrResult, source: slot.sourceMessageSource || 'Harvest Questions',
                connect_queue_id: slot.sourceMessageId || null, movedFromSlotId: slot.id,
                timestamp: new Date(), createdAt: new Date().toISOString(), pushedBy: currentUser.email
            });
        } catch (e) { console.warn('activity write failed', e); }
        if (slot.sourceMessageId) {
            try {
                await updateDoc(doc(emailDB, 'connect_queue', slot.sourceMessageId), {
                    routed_via: 'quick_message_campaign', routed_campaign_id: String(camp.id), routed_hr_result: hrResult,
                    routed_from_slot_id: slot.id, routed_at: new Date().toISOString(), routed_by: currentUser.email
                });
            } catch (e) { /* non-fatal */ }
        }
        return { ok: true, msg: `Added to campaign #${camp.id} (added ${hrResult.added ?? '?'}, updated ${hrResult.updated ?? '?'}${hrResult.usedListFallback ? ', added to the campaign\'s lead LIST only — confirm with “Check in HeyReach”' : ''})` };
    } catch (err) {
        await restore(err.message);
        return { ok: false, msg: `${err.message} — slot restored to "${originalStatus}"` };
    }
}
