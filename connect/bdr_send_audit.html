<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>BDR Send Audit - PandoConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/pando_logo_transparent.png">
    <style>
        :root {
            --primary: #0F2D4D; --secondary: #0f172a; --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --accent: #C9973D; --gray: #6b7280; --light-gray: #f8fafc; --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--light-gray); color: var(--secondary); line-height: 1.5; }
        .container { max-width: 1700px; margin: 0 auto; padding: 2rem; }

        .page-header { background: linear-gradient(135deg, #0F2D4D 0%, #1d4ed8 100%); color: white; padding: 1.75rem 2rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 8px 16px rgba(0,0,0,.1); }
        .page-header h1 { font-size: 1.6rem; display: flex; align-items: center; gap: .75rem; margin-bottom: .35rem; }
        .page-header p { font-size: .92rem; opacity: .9; }

        .card { background: white; border-radius: 12px; padding: 1.25rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 1.25rem; }
        .controls-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: .35rem; }
        .control-group label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gray); }
        .control-group select, .control-group input { padding: .55rem .85rem; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; min-width: 200px; background: white; }
        .control-group select:focus, .control-group input:focus { outline: none; border-color: var(--primary); }

        .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.25rem; border: none; border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: #0a2038; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-accent:hover:not(:disabled) { background: #b3852f; }
        .btn-secondary { background: #f1f5f9; color: var(--secondary); border: 1.5px solid var(--border); }
        .btn-secondary:hover:not(:disabled) { background: #e2e8f0; }
        .btn-danger { background: var(--danger); color: white; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .75rem 2rem; font-size: .85rem; }
        .info-grid .k { color: var(--gray); font-size: .72rem; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
        .info-grid .v { font-weight: 600; word-break: break-all; }
        .warn-box { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; border-radius: 8px; padding: .7rem 1rem; font-size: .85rem; margin-top: .75rem; }
        .err-box { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 8px; padding: .7rem 1rem; font-size: .85rem; margin-top: .75rem; }

        .log { font-family: ui-monospace, Consolas, monospace; font-size: .78rem; background: #0f172a; color: #cbd5e1; border-radius: 8px; padding: .75rem 1rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        .log .ok { color: #6ee7b7; } .log .bad { color: #fca5a5; } .log .warn { color: #fcd34d; }
        .progress-wrap { background: #e2e8f0; border-radius: 100px; height: 8px; overflow: hidden; margin: .6rem 0; }
        .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .2s; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .85rem; margin-bottom: 1.25rem; }
        .stat-card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .stat-card.active { border-color: var(--primary); }
        .stat-number { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
        .stat-label { font-size: .72rem; color: var(--gray); font-weight: 600; margin-top: .2rem; text-transform: uppercase; letter-spacing: .04em; }
        .c-green .stat-number { color: var(--success); } .c-red .stat-number { color: var(--danger); }
        .c-amber .stat-number { color: var(--warning); } .c-blue .stat-number { color: #2563eb; } .c-gray .stat-number { color: var(--gray); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #f8fafc; padding: .65rem .85rem; text-align: left; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; }
        tbody tr { border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background: #fafafa; }
        td { padding: .6rem .85rem; font-size: .85rem; vertical-align: top; }
        .td-name { font-weight: 600; }
        .td-sub { font-size: .75rem; color: var(--gray); }
        .td-sub a { color: #2563eb; text-decoration: none; }
        .td-msg { max-width: 360px; font-size: .78rem; color: #334155; }
        .td-msg div { max-height: 4.2em; overflow: hidden; }
        .td-msg:hover div { max-height: none; }

        .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border-radius: 100px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
        .b-green { background: #dcfce7; color: #15803d; } .b-red { background: #fee2e2; color: #b91c1c; }
        .b-amber { background: #fef3c7; color: #92400e; } .b-blue { background: #dbeafe; color: #1d4ed8; }
        .b-gray { background: #f1f5f9; color: #475569; } .b-purple { background: #ede9fe; color: #6d28d9; }

        .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
        .empty { text-align: center; padding: 2.5rem; color: var(--gray); }
        .hidden { display: none !important; }
    </style>
    <link rel="stylesheet" href="pando-theme.css?v=4">
</head>
<body>
<div id="healthconnect-header-mount"></div>

<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-clipboard-check"></i> BDR Send Audit</h1>
        <p>Compares what was submitted for a BDR (Quick Message sends + LinkedIn message slots) with what HeyReach actually has, and moves slot messages into the BDR's Quick Message campaign.</p>
    </div>

    <div class="card">
        <div class="controls-row">
            <div class="control-group" id="bdrWrap">
                <label><i class="fas fa-user"></i> BDR</label>
                <select id="bdrSelect"><option value="">— Select a BDR —</option></select>
            </div>
            <div class="control-group">
                <label><i class="fas fa-calendar"></i> Look-back</label>
                <select id="daysSelect">
                    <option value="14">Last 14 days</option>
                    <option value="30">Last 30 days</option>
                    <option value="45" selected>Last 45 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365">Last year</option>
                </select>
            </div>
            <button class="btn btn-primary" id="runBtn" disabled><i class="fas fa-play"></i> Run Audit</button>
        </div>
        <div id="bdrInfo" class="hidden" style="margin-top:1rem;"></div>
    </div>

    <div class="card hidden" id="progressCard">
        <div id="progressTitle" style="font-weight:700;"></div>
        <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
        <div class="log" id="log"></div>
    </div>

    <div id="results" class="hidden">
        <div class="stats-row" id="statsRow"></div>

        <div class="card">
            <div class="toolbar">
                <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;">
                    <strong id="tableTitle">Results</strong>
                    <input id="searchBox" type="text" placeholder="Search name / URL / message…" style="padding:.45rem .75rem;border:1.5px solid var(--border);border-radius:8px;min-width:260px;">
                </div>
                <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
                    <button class="btn btn-secondary" id="csvBtn"><i class="fas fa-file-csv"></i> Export CSV</button>
                    <button class="btn btn-accent hidden" id="moveBtn"><i class="fas fa-bolt"></i> <span id="moveBtnLabel">Move to Quick Message</span></button>
                    <button class="btn btn-danger hidden" id="cancelMoveBtn"><i class="fas fa-stop"></i> Stop</button>
                </div>
            </div>
            <div class="table-wrap" style="max-height:70vh;overflow-y:auto;">
                <table>
                    <thead><tr>
                        <th style="width:30px;"><input type="checkbox" id="selectAll" title="Select all movable rows"></th>
                        <th>Contact</th><th>Verdict</th><th>Our record</th><th>HeyReach</th><th>Message</th>
                    </tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="empty hidden" id="emptyMsg"><i class="fas fa-check-double" style="font-size:2rem;opacity:.4;display:block;margin-bottom:.5rem;"></i>Nothing matches this filter.</div>
        </div>
    </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/clemail-firestore-wrapper.js"></script>
<script src="healthconnect-header.js?v=3.4"></script>

<script type="module">
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
import { canonicalLinkedInUrl, fetchLiveCampaignStatusMap } from '../js/heyreach-live-status.js';

await window.firebaseReady;
const auth = window.auth;
const { collection, getDocs, getDoc, doc, query, where, addDoc, updateDoc, runTransaction, Timestamp } = window.clemailFirestore;
const emailDB = window.clemailDb;
const BACKEND = 'https://railwayclemail-production.up.railway.app';

// ── State ───────────────────────────────────────────────────────────────────
let currentUser = null, isAdmin = false, initialized = false, firstAuthFire = true;
let bdrLeaders = [];
let ctx = null;          // { bdr, emails, customerId, apiKey, campaigns[] }
let rows = [];
let activeFilter = 'all';
let moveCancelled = false;
let moving = false;

// Slot statuses the cron will (or may again) send via inbox — safe to move over.
const MOVABLE_SLOT = new Set(['pending', 'failed']);
// A slot another process is working on right now; never touch automatically.
const IN_FLIGHT_SLOT = new Set(['processing', 'sending', 'moving_to_quick_message']);
const NIGHTLY_CLEANUP_DAYS = 40;

// ── Verdicts ────────────────────────────────────────────────────────────────
const VERDICTS = {
    delivered:      { label: 'Delivered by HeyReach',        cls: 'b-green',  icon: 'fa-check-circle',  stat: 'green' },
    in_hr_pending:  { label: 'In HeyReach – not sent yet',   cls: 'b-blue',   icon: 'fa-hourglass-half', stat: 'blue' },
    hr_failed:      { label: 'HeyReach failed this lead',    cls: 'b-red',    icon: 'fa-triangle-exclamation', stat: 'red' },
    missing:        { label: 'MISSING from HeyReach',        cls: 'b-red',    icon: 'fa-circle-xmark',  stat: 'red' },
    purged:         { label: 'Removed by nightly cleanup',   cls: 'b-gray',   icon: 'fa-broom',         stat: 'gray' },
    needs_move:     { label: 'In slot – needs Quick Message', cls: 'b-amber', icon: 'fa-bolt',          stat: 'amber' },
    slot_conflict:  { label: 'In slot – already in campaign', cls: 'b-purple', icon: 'fa-clone',        stat: 'amber' },
    slot_stuck:     { label: 'Slot in flight / stuck',       cls: 'b-amber',  icon: 'fa-lock',          stat: 'amber' },
    sent_via_slot:  { label: 'Sent via slot (not Quick Msg)', cls: 'b-gray',  icon: 'fa-paper-plane',   stat: 'gray' },
    slot_other:     { label: 'Slot closed',                  cls: 'b-gray',   icon: 'fa-circle-minus',  stat: 'gray' },
};

// ── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toDate(v) {
    if (!v) return null;
    if (typeof v.toDate === 'function') return v.toDate();
    if (typeof v === 'object' && (v.seconds != null || v._seconds != null)) return new Date((v.seconds ?? v._seconds) * 1000);
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
}
const fmt = d => d ? d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const dataOf = snap => (snap && typeof snap.data === 'function') ? snap.data() : snap;
const existsOf = snap => snap && (typeof snap.exists === 'function' ? snap.exists() : snap.exists !== false);
const isAdminUser = u => { const d = (u?.email || '').split('@')[1]; return d === 'healthluminate.com' || d === 'careluminate.com'; };

function log(msg, cls = '') {
    $('progressCard').classList.remove('hidden');
    const el = $('log');
    el.innerHTML += `<span class="${cls}">${esc(msg)}</span>\n`;
    el.scrollTop = el.scrollHeight;
}
function progress(pct, title) {
    $('progressFill').style.width = `${Math.max(0, Math.min(100, pct))}%`;
    if (title) $('progressTitle').textContent = title;
}

// ── Auth ────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
    if (user) {
        firstAuthFire = false;
        localStorage.setItem('hl_active_session', Date.now().toString());
        currentUser = user;
        isAdmin = isAdminUser(user);
        if (!initialized) {
            initialized = true;
            await loadBdrs();
        }
    } else {
        if (firstAuthFire) {
            firstAuthFire = false;
            await sleep(2500);
            if (auth.currentUser) return;
        }
        const t = parseInt(localStorage.getItem('hl_active_session') || '0', 10);
        if (t && Date.now() - t < 43200000) return; // transient null
        window.location.href = '../index.html';
    }
});

async function loadBdrs() {
    const snap = await getDocs(collection(emailDB, 'bdr_leaders'));
    bdrLeaders = [];
    snap.forEach(d => bdrLeaders.push({ id: d.id, ...d.data() }));
    const sel = $('bdrSelect');
    if (!isAdmin) {
        // Non-admins can only audit themselves
        const me = (currentUser.email || '').toLowerCase();
        const mine = bdrLeaders.find(b => (b.primaryEmail || '').toLowerCase() === me);
        sel.innerHTML = `<option value="${esc(me)}">${esc(mine?.name || me)}</option>`;
        sel.value = me; sel.disabled = true; $('runBtn').disabled = false;
        return;
    }
    bdrLeaders
        .filter(b => b.primaryEmail)
        .sort((a, b) => ((a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1)) || (a.name || a.primaryEmail).localeCompare(b.name || b.primaryEmail))
        .forEach(b => {
            const o = document.createElement('option');
            o.value = b.primaryEmail.toLowerCase();
            const label = b.name ? `${b.name} (${b.primaryEmail})` : b.primaryEmail;
            o.textContent = b.status === 'active' ? label : `${label} — INACTIVE`;
            sel.appendChild(o);
        });
}
$('bdrSelect').addEventListener('change', () => { $('runBtn').disabled = !$('bdrSelect').value; });
$('runBtn').addEventListener('click', () => runAudit());

// ── Context resolution ──────────────────────────────────────────────────────
function pickBdrDoc(email) {
    const matches = bdrLeaders.filter(b => (b.primaryEmail || '').toLowerCase() === email);
    return matches.find(b => b.status === 'active') || matches[0] || null;
}

async function resolveContext(email) {
    const bdr = pickBdrDoc(email);
    if (!bdr) throw new Error(`No bdr_leaders record found for ${email}`);
    const emails = new Set([email]);
    [bdr.linkedInEmail, ...(bdr.emailAccountIds || [])].forEach(e => { if (e) emails.add(String(e).toLowerCase()); });
    const customerId = bdr.customerId || bdr.customer_id || bdr.customerID || null;
    const campaigns = (bdr.heyreachCampaigns || []).filter(c => c.type === 'quick_message');
    let apiKey = null;
    if (customerId) {
        const cs = await getDoc(doc(emailDB, 'customerList', customerId));
        apiKey = dataOf(cs)?.heyreachApiKey || null;
    }
    return { bdr, emails: [...emails], customerId, apiKey, campaigns };
}

function renderBdrInfo() {
    const c = ctx;
    const camp = c.campaigns.map(x => `#${esc(x.id)}${x.name ? ' – ' + esc(x.name) : ''}${x.listId ? ' (list ' + esc(x.listId) + ')' : ''}`).join('<br>') || '<span style="color:#dc2626">None</span>';
    let html = `<div class="info-grid">
        <div><div class="k">BDR</div><div class="v">${esc(c.bdr.name || c.bdr.primaryEmail)} (${esc(c.bdr.primaryEmail)})</div></div>
        <div><div class="k">Customer</div><div class="v">${esc(c.customerId || '—')}</div></div>
        <div><div class="k">Quick Message campaign(s)</div><div class="v">${camp}</div></div>
        <div><div class="k">HeyReach API key</div><div class="v">${c.apiKey ? 'Found' : '<span style="color:#dc2626">Missing</span>'}</div></div>
    </div>`;
    if (!c.campaigns.length) html += `<div class="err-box"><i class="fas fa-circle-exclamation"></i> This BDR has no <code>quick_message</code> campaign in <code>bdr_leaders.heyreachCampaigns</code>. Nothing can be moved or verified until one is set up.</div>`;
    if (!c.customerId || !c.apiKey) html += `<div class="err-box"><i class="fas fa-circle-exclamation"></i> Missing customerId or HeyReach API key — HeyReach comparison and moving are unavailable.</div>`;
    $('bdrInfo').innerHTML = html;
    $('bdrInfo').classList.remove('hidden');
}

// ── Audit ───────────────────────────────────────────────────────────────────
async function queryByBdr(coll, field, emails, extra = []) {
    const out = new Map();
    const list = emails.slice(0, 10);
    const snap = await getDocs(query(collection(emailDB, coll), where(field, 'in', list), ...extra));
    snap.forEach(d => out.set(d.id, { id: d.id, ...d.data() }));
    return [...out.values()];
}

async function runAudit() {
    const email = $('bdrSelect').value;
    if (!email) return;
    const days = parseInt($('daysSelect').value, 10) || 45;
    const since = new Date(Date.now() - days * 86400000);
    $('runBtn').disabled = true;
    $('results').classList.add('hidden');
    $('log').innerHTML = '';
    try {
        progress(3, 'Resolving BDR…');
        ctx = await resolveContext(email);
        renderBdrInfo();
        log(`BDR identity emails: ${ctx.emails.join(', ')}`);

        // 1. Slots
        progress(15, 'Loading LinkedIn message slots…');
        const allSlots = await queryByBdr('linkedin_message_queue', 'bdrEmail', ctx.emails);
        const slots = allSlots.filter(s => {
            if (MOVABLE_SLOT.has(s.status) || IN_FLIGHT_SLOT.has(s.status)) return true; // always show unfinished work
            const t = toDate(s.sentAt) || toDate(s.createdAt) || toDate(s.scheduledTime);
            return !t || t >= since;
        });
        log(`Slots: ${allSlots.length} total for this BDR, ${slots.length} in window / unfinished`, 'ok');

        // 2. Quick Message sends recorded by Fast Connect Review (and by earlier slot moves)
        progress(30, 'Loading Quick Message send records…');
        let acts = [];
        try {
            acts = await queryByBdr('connect_activity', 'bdrEmail', ctx.emails, [where('via', '==', 'quick_message_campaign')]);
        } catch (e) {
            log(`Indexed activity query failed (${e.message}); falling back to full BDR scan`, 'warn');
            acts = (await queryByBdr('connect_activity', 'bdrEmail', ctx.emails)).filter(a => a.via === 'quick_message_campaign');
        }
        acts = acts.filter(a => { const t = toDate(a.timestamp) || toDate(a.createdAt); return !t || t >= since; });
        log(`Quick Message send records in window: ${acts.length}`, 'ok');

        // 3. HeyReach live campaign lead list + server tracking
        const hrMaps = [];
        const tracking = new Map();
        for (let i = 0; i < ctx.campaigns.length; i++) {
            const camp = ctx.campaigns[i];
            progress(40 + i * 15, `Fetching HeyReach leads for campaign ${camp.id}…`);
            if (ctx.apiKey) {
                const m = await fetchLiveCampaignStatusMap({ backendUrl: BACKEND, apiKey: ctx.apiKey, campaignId: camp.id });
                m.forEach(v => { v.campaignId = String(camp.id); });
                hrMaps.push(m);
                log(`HeyReach campaign ${camp.id}: ${m.size} leads`, m.size ? 'ok' : 'warn');
            }
            try {
                const ts = await getDocs(query(collection(emailDB, 'quick_message_campaign_leads'), where('campaignId', '==', String(camp.id))));
                ts.forEach(d => {
                    const t = d.data();
                    const k = canonicalLinkedInUrl(t.linkedinUrl);
                    if (!k) return;
                    const prev = tracking.get(k);
                    if (!prev || (toDate(t.addedAt) || 0) > (toDate(prev.addedAt) || 0)) tracking.set(k, t);
                });
            } catch (e) { log(`Tracking lookup failed: ${e.message}`, 'warn'); }
        }
        const hr = new Map();
        hrMaps.forEach(m => m.forEach((v, k) => { if (!hr.has(k)) hr.set(k, v); }));

        // 4. Build rows
        progress(85, 'Comparing…');
        rows = buildRows({ slots, acts, hr, tracking });
        const trackedNotExpected = [...hr.keys()].filter(k => !rows.some(r => r.key === k)).length;
        ctx.hrOnlyCount = trackedNotExpected;
        ctx.hrTotal = hr.size;
        progress(100, 'Audit complete');
        log(`Audit complete: ${rows.length} contacts. ${trackedNotExpected} lead(s) in HeyReach have no record in this window.`, 'ok');
        activeFilter = 'all';
        renderAll();
        $('results').classList.remove('hidden');
    } catch (err) {
        console.error(err);
        log(`Audit failed: ${err.message}`, 'bad');
        progress(0, 'Audit failed');
    } finally {
        $('runBtn').disabled = false;
    }
}

function buildRows({ slots, acts, hr, tracking }) {
    const map = new Map();
    const get = (url, fallbackId) => {
        const key = canonicalLinkedInUrl(url) || `nourl_${fallbackId}`;
        if (!map.has(key)) map.set(key, { key, url: url || '', name: '', message: '', sends: [], slots: [] });
        return map.get(key);
    };
    acts.forEach(a => {
        const url = a.contactLinkedInUrl || a.prospect_li_url || '';
        const r = get(url, a.id);
        r.sends.push(a);
        r.name = r.name || a.contactName || `${a.contactFirstName || ''} ${a.contactLastName || ''}`.trim();
        r.message = r.message || a.messageContent || a.message_to_contact || '';
        r.url = r.url || url;
    });
    slots.forEach(s => {
        const r = get(s.recipientLinkedInUrl, s.id);
        r.slots.push(s);
        r.name = r.name || s.recipientName || '';
        r.message = r.message || s.message || '';
        r.url = r.url || s.recipientLinkedInUrl || '';
    });

    const now = Date.now();
    map.forEach(r => {
        r.hr = hr.get(r.key) || null;
        r.track = tracking.get(r.key) || null;
        r.sends.sort((a, b) => (toDate(b.timestamp || b.createdAt) || 0) - (toDate(a.timestamp || a.createdAt) || 0));
        r.slots.sort((a, b) => (toDate(a.scheduledTime) || 0) - (toDate(b.scheduledTime) || 0));

        const movedSlots = r.slots.filter(s => s.status === 'moved_to_quick_message');
        const pend = r.slots.filter(s => MOVABLE_SLOT.has(s.status));
        const inflight = r.slots.filter(s => IN_FLIGHT_SLOT.has(s.status));
        const sentSlots = r.slots.filter(s => s.status === 'sent');
        const hasQM = r.sends.length > 0 || movedSlots.length > 0;

        r.movableSlot = null; r.extraPending = 0; r.note = '';

        if (inflight.length && !hasQM) {
            r.verdict = 'slot_stuck';
            r.note = `Slot status "${inflight[0].status}" — another process is working on it`;
        } else if (pend.length && !hasQM) {
            if (r.hr) {
                r.verdict = 'slot_conflict';
                r.note = 'Contact is already in the Quick Message campaign — HeyReach would only update the old lead and NOT send. Left in slot.';
            } else {
                r.verdict = 'needs_move';
                r.movableSlot = pend[0];
                r.extraPending = pend.length - 1;
            }
        } else if (hasQM) {
            const sentAt = toDate(r.sends[0]?.timestamp || r.sends[0]?.createdAt) || toDate(movedSlots[0]?.movedToQuickMessageAt);
            const ageDays = sentAt ? (now - sentAt.getTime()) / 86400000 : 0;
            if (r.hr) {
                if (r.hr.isTerminal && !r.hr.isAlreadySent) r.verdict = 'hr_failed';
                else if (r.hr.isAlreadySent) r.verdict = 'delivered';
                else r.verdict = 'in_hr_pending';
                if (r.verdict === 'hr_failed') r.note = r.hr.reason || '';
            } else if ((r.track && r.track.status && r.track.status !== 'active') || ageDays > NIGHTLY_CLEANUP_DAYS) {
                r.verdict = 'purged';
                r.note = r.track ? `Tracking status: ${r.track.status}` : `Older than ${NIGHTLY_CLEANUP_DAYS} days`;
            } else {
                r.verdict = 'missing';
                r.note = r.track
                    ? 'Server recorded the add, but HeyReach does not list this lead in the campaign.'
                    : 'We recorded a send, but there is no server tracking record and HeyReach does not list the lead.';
            }
            if (r.sends.length > 1) r.note += (r.note ? ' ' : '') + `${r.sends.length} send records for this contact.`;
            if (pend.length) r.note += (r.note ? ' ' : '') + `${pend.length} duplicate pending slot(s) also exist.`;
        } else if (sentSlots.length) {
            r.verdict = 'sent_via_slot';
        } else {
            r.verdict = 'slot_other';
            r.note = `Slot status: ${r.slots.map(s => s.status).join(', ') || '—'}`;
        }
        r.when = toDate(r.sends[0]?.timestamp || r.sends[0]?.createdAt) || toDate(r.slots[0]?.scheduledTime) || toDate(r.slots[0]?.createdAt);
    });
    return [...map.values()].sort((a, b) => (b.when || 0) - (a.when || 0));
}

// ── Rendering ───────────────────────────────────────────────────────────────
function counts() {
    const c = { all: rows.length };
    Object.keys(VERDICTS).forEach(k => c[k] = 0);
    rows.forEach(r => c[r.verdict]++);
    return c;
}

function renderAll() {
    const c = counts();
    const order = ['all', 'delivered', 'in_hr_pending', 'hr_failed', 'missing', 'needs_move', 'slot_conflict', 'slot_stuck', 'sent_via_slot', 'purged', 'slot_other'];
    $('statsRow').innerHTML = order.map(k => {
        const v = k === 'all' ? { label: 'All contacts', stat: 'blue' } : VERDICTS[k];
        if (k !== 'all' && !c[k]) return '';
        return `<div class="stat-card c-${v.stat} ${activeFilter === k ? 'active' : ''}" data-filter="${k}">
            <div class="stat-number">${c[k]}</div><div class="stat-label">${esc(v.label)}</div></div>`;
    }).join('') + `<div class="stat-card c-gray" style="cursor:default"><div class="stat-number">${ctx.hrTotal ?? 0}</div><div class="stat-label">Leads in HeyReach campaign (${ctx.hrOnlyCount ?? 0} not in window)</div></div>`;
    document.querySelectorAll('#statsRow .stat-card[data-filter]').forEach(el =>
        el.addEventListener('click', () => { activeFilter = el.dataset.filter; renderAll(); }));
    renderTable();
}

function visibleRows() {
    const q = $('searchBox').value.trim().toLowerCase();
    return rows.filter(r => (activeFilter === 'all' || r.verdict === activeFilter) &&
        (!q || `${r.name} ${r.url} ${r.message}`.toLowerCase().includes(q)));
}

function renderTable() {
    const vis = visibleRows();
    $('tableTitle').textContent = `${activeFilter === 'all' ? 'All contacts' : VERDICTS[activeFilter].label} (${vis.length})`;
    $('emptyMsg').classList.toggle('hidden', vis.length > 0);
    $('tbody').innerHTML = vis.map(r => {
        const v = VERDICTS[r.verdict];
        const ours = [];
        r.sends.slice(0, 2).forEach(a => ours.push(`<div>Quick Msg add · ${fmt(toDate(a.timestamp || a.createdAt))}${a.hrResult ? ` · +${a.hrResult.added ?? '?'}/~${a.hrResult.updated ?? '?'}` : ''}${a.movedFromSlotId ? ' · moved from slot' : ''}</div>`));
        r.slots.forEach(s => ours.push(`<div>Slot <b>${esc(s.status)}</b> · ${fmt(toDate(s.sentAt) || toDate(s.scheduledTime))}${s.lastError || s.error ? ` · <span style="color:#b91c1c">${esc(s.lastError || s.error)}</span>` : ''}</div>`));
        let hrCell = '<span class="td-sub">Not in campaign</span>';
        if (r.hr) {
            const l = r.hr.lead || {};
            hrCell = `<div>${esc(l.leadCampaignStatus || l.status || '—')}</div>
                <div class="td-sub">conn: ${esc(l.leadConnectionStatus || '—')} · msg: ${esc(l.leadMessageStatus || '—')}</div>`;
        }
        const movable = !!r.movableSlot;
        return `<tr>
            <td>${movable ? `<input type="checkbox" class="rowSel" data-key="${esc(r.key)}" checked>` : ''}</td>
            <td><div class="td-name">${esc(r.name || '(unknown)')}</div>
                <div class="td-sub">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\/(www\.)?linkedin\.com/, ''))}</a>` : 'no URL'}</div></td>
            <td><span class="badge ${v.cls}"><i class="fas ${v.icon}"></i> ${esc(v.label)}</span>
                ${r.note ? `<div class="td-sub" style="margin-top:.25rem;max-width:300px;">${esc(r.note)}</div>` : ''}
                ${r.extraPending ? `<div class="td-sub">+${r.extraPending} more pending slot(s) for this contact stay untouched</div>` : ''}</td>
            <td class="td-sub">${ours.join('') || '—'}</td>
            <td>${hrCell}</td>
            <td class="td-msg"><div>${esc(r.message)}</div></td>
        </tr>`;
    }).join('');
    updateMoveButton();
    document.querySelectorAll('.rowSel').forEach(el => el.addEventListener('change', updateMoveButton));
}

function selectedMovableRows() {
    const keys = new Set([...document.querySelectorAll('.rowSel:checked')].map(el => el.dataset.key));
    return rows.filter(r => r.movableSlot && keys.has(r.key));
}
function updateMoveButton() {
    const totalMovable = rows.filter(r => r.movableSlot).length;
    const sel = selectedMovableRows().length;
    const canMove = isAdmin && totalMovable > 0 && ctx?.campaigns?.length && ctx.customerId && ctx.apiKey;
    $('moveBtn').classList.toggle('hidden', !canMove);
    $('moveBtnLabel').textContent = `Move ${sel} slot message${sel === 1 ? '' : 's'} to Quick Message`;
    $('moveBtn').disabled = moving || sel === 0;
}
$('searchBox').addEventListener('input', renderTable);
$('selectAll').addEventListener('change', e => {
    document.querySelectorAll('.rowSel').forEach(el => { el.checked = e.target.checked; });
    updateMoveButton();
});

// ── CSV export ──────────────────────────────────────────────────────────────
$('csvBtn').addEventListener('click', () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['Name', 'LinkedIn URL', 'Verdict', 'Note', 'Slot status', 'Quick Msg sends', 'HeyReach campaign status', 'Connection status', 'Message status', 'Message'].map(q).join(',')];
    visibleRows().forEach(r => {
        const l = r.hr?.lead || {};
        lines.push([r.name, r.url, VERDICTS[r.verdict].label, r.note, r.slots.map(s => s.status).join('/'), r.sends.length,
            l.leadCampaignStatus || '', l.leadConnectionStatus || '', l.leadMessageStatus || '', r.message].map(q).join(','));
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = `bdr_send_audit_${(ctx?.bdr?.primaryEmail || 'bdr').replace(/[^a-z0-9]/gi, '_')}_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
});

// ── Move slots → Quick Message ──────────────────────────────────────────────
$('cancelMoveBtn').addEventListener('click', () => { moveCancelled = true; });
$('moveBtn').addEventListener('click', async () => {
    const targets = selectedMovableRows();
    if (!targets.length || moving) return;
    const camp = ctx.campaigns[0];
    const extra = ctx.campaigns.length > 1 ? `\n\nNote: this BDR has ${ctx.campaigns.length} Quick Message campaigns; the first (#${camp.id}) is used, same as Fast Connect Review.` : '';
    if (!confirm(`Move ${targets.length} pending slot message(s) for ${ctx.bdr.name || ctx.bdr.primaryEmail} into Quick Message campaign #${camp.id}?\n\n` +
        `Each slot is first locked so the scheduler cannot also send it, then added to HeyReach. ` +
        `If HeyReach rejects a contact (e.g. already in the campaign) its slot is restored unchanged.${extra}`)) return;

    moving = true; moveCancelled = false;
    $('moveBtn').disabled = true; $('cancelMoveBtn').classList.remove('hidden'); $('runBtn').disabled = true;
    let ok = 0, fail = 0, skipped = 0;
    log(`── Moving ${targets.length} slot message(s) to campaign #${camp.id} ──`);

    for (let i = 0; i < targets.length; i++) {
        if (moveCancelled) { log('Stopped by user.', 'warn'); break; }
        const r = targets[i];
        progress(Math.round((i / targets.length) * 100), `Moving ${i + 1} / ${targets.length}…`);
        const res = await moveSlot(r.movableSlot, camp);
        if (res.ok) ok++; else if (res.skipped) skipped++; else fail++;
        log(`${res.ok ? '✔' : res.skipped ? '↷' : '✘'} ${r.name || r.url}: ${res.msg}`, res.ok ? 'ok' : res.skipped ? 'warn' : 'bad');
        await sleep(350); // stay under Railway/HeyReach rate limits
    }
    progress(100, `Done — moved ${ok}, failed ${fail}, skipped ${skipped}`);
    log(`── Finished: ${ok} moved, ${fail} failed, ${skipped} skipped ──`, ok ? 'ok' : 'warn');
    moving = false;
    $('cancelMoveBtn').classList.add('hidden');
    $('runBtn').disabled = false;
    await runAudit(); // refresh so the table reflects the new state
});

async function moveSlot(slot, camp) {
    const slotRef = doc(emailDB, 'linkedin_message_queue', slot.id);
    const originalStatus = slot.status;
    const url = slot.recipientLinkedInUrl;
    if (!url) return { ok: false, msg: 'Slot has no LinkedIn URL — cannot add to a campaign' };
    if (!slot.message) return { ok: false, msg: 'Slot has no message text' };

    // 1. Claim: pending/failed → moving_to_quick_message so the cron cannot send it concurrently.
    let claimed = false;
    try {
        claimed = await runTransaction(emailDB, async tx => {
            const snap = await tx.get(slotRef);
            if (!existsOf(snap)) return false;
            if (!MOVABLE_SLOT.has(dataOf(snap).status)) return false;
            tx.update(slotRef, { status: 'moving_to_quick_message', movingAt: Timestamp.now(), movingBy: currentUser.email, statusBeforeMove: dataOf(snap).status });
            return true;
        });
    } catch (e) { return { ok: false, msg: `Could not lock slot: ${e.message}` }; }
    if (!claimed) return { skipped: true, msg: 'Slot is no longer pending (already sent or being processed) — left alone' };

    const restore = async reason => {
        try { await updateDoc(slotRef, { status: originalStatus, lastMoveError: reason, lastMoveAttemptAt: Timestamp.now() }); } catch (e) { console.error('restore failed', e); }
    };

    try {
        // 2. Optional enrichment (company / title) from the original connect_queue doc
        let company = '', position = '', firstName = '', lastName = '';
        if (slot.sourceMessageId) {
            try {
                const cq = dataOf(await getDoc(doc(emailDB, 'connect_queue', slot.sourceMessageId))) || {};
                company = cq.contactCompany || cq.prospect_company || '';
                position = cq.contactTitle || cq.prospect_title || cq.prospect_position || '';
                firstName = cq.contactFirstName || cq.prospect_first_name || cq.firstName || '';
                lastName = cq.contactLastName || cq.prospect_last_name || cq.lastName || '';
            } catch (e) { /* enrichment is best-effort */ }
        }
        if (!firstName && !lastName) {
            const parts = (slot.recipientName || '').trim().split(/\s+/);
            firstName = parts.shift() || ''; lastName = parts.join(' ');
        }

        // 3. Add to the Quick Message campaign
        const resp = await fetch(`${BACKEND}/api/mass-messages/add-lead`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customerId: ctx.customerId, campaignId: String(camp.id), linkedinUrl: url,
                firstName, lastName, company, position, customMessage: slot.message,
                ...(camp.accountId ? { accountId: String(camp.accountId) } : {}),
                ...(camp.listId ? { listId: String(camp.listId) } : {})
            })
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${(await resp.text()).slice(0, 200)}`);
        const data = await resp.json();
        if (data?.success === false) {
            throw new Error(data.alreadyInCampaign
                ? 'Already in this campaign\'s history — HeyReach will not send a new message'
                : (data.error || 'HeyReach rejected the lead'));
        }
        const hrResult = {
            added: data?.added ?? null, updated: data?.updated ?? null, failed: data?.failed ?? null,
            usedListFallback: !!data?.meta?.fallbackResults
        };

        // 4. Close the slot, record the send, update the original queue doc
        await updateDoc(slotRef, {
            status: 'moved_to_quick_message',
            movedToQuickMessageAt: Timestamp.now(), movedToQuickMessageBy: currentUser.email,
            movedToCampaignId: String(camp.id), movedHrResult: hrResult, lastMoveError: null
        });
        try {
            await addDoc(collection(emailDB, 'connect_activity'), {
                actionType: 'push_to_heyreach', status: 'added', via: 'quick_message_campaign',
                contactName: `${firstName} ${lastName}`.trim(), contactFirstName: firstName, contactLastName: lastName,
                contactLinkedInUrl: url, prospect_li_url: url,
                messageContent: slot.message, message_to_contact: slot.message,
                contactCompany: company, contactTitle: position,
                bdrEmail: slot.bdrEmail || ctx.bdr.primaryEmail.toLowerCase(), account_email: slot.bdrEmail || ctx.bdr.primaryEmail.toLowerCase(),
                campaignId: String(camp.id), hrResult,
                source: slot.sourceMessageSource || 'Harvest Questions',
                connect_queue_id: slot.sourceMessageId || null, movedFromSlotId: slot.id,
                timestamp: new Date(), createdAt: new Date().toISOString(), pushedBy: currentUser.email
            });
        } catch (e) { console.warn('activity write failed', e); }
        if (slot.sourceMessageId) {
            try {
                await updateDoc(doc(emailDB, 'connect_queue', slot.sourceMessageId), {
                    routed_via: 'quick_message_campaign', routed_campaign_id: String(camp.id),
                    routed_hr_result: hrResult, routed_from_slot_id: slot.id,
                    routed_at: new Date().toISOString(), routed_by: currentUser.email
                });
            } catch (e) { /* doc may have been purged; non-fatal */ }
        }
        return { ok: true, msg: `Added to campaign #${camp.id} (added ${hrResult.added ?? '?'}, updated ${hrResult.updated ?? '?'}${hrResult.usedListFallback ? ', via list fallback' : ''})` };
    } catch (err) {
        await restore(err.message);
        return { ok: false, msg: `${err.message} — slot restored to "${originalStatus}"` };
    }
}
