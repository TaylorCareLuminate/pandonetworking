<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapped Contacts Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0F2D4D;
            --secondary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #C9973D;
            --gray: #6b7280;
            --light-gray: #f8fafc;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-gray);
            color: var(--secondary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .filter-group input,
        .filter-group select {
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #005885;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--gray);
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .contact-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .contact-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        .contact-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .contact-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            overflow: hidden;
        }

        .contact-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-title {
            font-size: 0.9rem;
            color: var(--gray);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-body {
            margin-bottom: 1rem;
        }

        .contact-detail {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .contact-detail i {
            color: var(--primary);
            width: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .contact-detail-content {
            flex: 1;
            word-break: break-word;
        }

        .contact-footer {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .contact-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--light-gray);
            color: var(--secondary);
        }

        .linkedin-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .linkedin-link:hover {
            background: #005885;
            transform: translateY(-1px);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--gray);
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 8px 16px;
        }

        .pagination span {
            color: var(--gray);
            font-weight: 600;
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .view-toggle button {
            padding: 8px 16px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-toggle button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .table-view {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .contacts-table {
            width: 100%;
            border-collapse: collapse;
        }

        .contacts-table th,
        .contacts-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .contacts-table th {
            background: var(--secondary);
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .contacts-table tr:hover {
            background: var(--light-gray);
        }

        .contacts-table td {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-address-book"></i> Scrapped Contacts Explorer</h1>
            <p>Browse and analyze all contacts from LinkedIn searches</p>
        </div>

        <!-- Statistics -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalContacts">-</div>
                <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCompanies">-</div>
                <div class="stat-label">Companies Scraped</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalJobs">-</div>
                <div class="stat-label">Search Jobs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgEmployeesPerCompany">-</div>
                <div class="stat-label">Avg Employees/Company</div>
            </div>
        </div>

        <!-- Company Details Section -->
        <div class="filters-section" id="companyDetailsSection" style="display: none;">
            <h3 style="margin-bottom: 1rem; color: var(--primary);">
                <i class="fas fa-building"></i> Company Details
                <button class="btn btn-secondary" onclick="toggleCompanyDetails()" style="margin-left: auto; padding: 6px 12px; font-size: 0.9rem; float: right;">
                    <i class="fas fa-chevron-up"></i> Hide
                </button>
            </h3>
            <div id="companyDetailsList"></div>
        </div>
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <button class="btn btn-primary" onclick="toggleCompanyDetails()" id="showCompanyDetailsBtn">
                <i class="fas fa-building"></i> Show Company Details
            </button>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <h3 style="margin-bottom: 1rem; color: var(--primary);"><i class="fas fa-filter"></i> Filters</h3>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="filterSearch"><i class="fas fa-search"></i> Search</label>
                    <input type="text" id="filterSearch" placeholder="Name, title, company...">
                </div>
                <div class="filter-group">
                    <label for="filterBDR"><i class="fas fa-user-tie"></i> BDR</label>
                    <select id="filterBDR">
                        <option value="">All BDRs</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterCompany"><i class="fas fa-building"></i> Company</label>
                    <select id="filterCompany">
                        <option value="">All Companies</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterJob"><i class="fas fa-tasks"></i> Search Job</label>
                    <select id="filterJob">
                        <option value="">All Jobs</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <i class="fas fa-filter"></i> Apply Filters
                </button>
                <button class="btn btn-secondary" onclick="clearFilters()">
                    <i class="fas fa-times"></i> Clear
                </button>
                <button class="btn btn-primary" onclick="exportToCSV()" style="margin-left: auto;">
                    <i class="fas fa-download"></i> Export to CSV
                </button>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="active" onclick="switchView('cards')">
                <i class="fas fa-th"></i> Card View
            </button>
            <button onclick="switchView('table')">
                <i class="fas fa-table"></i> Table View
            </button>
        </div>

        <!-- Contacts Display -->
        <div id="contactsContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading contacts...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="paginationContainer" style="display: none;">
            <button class="btn btn-secondary" onclick="previousPage()" id="prevBtn" disabled>
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span id="pageInfo">Page 1 of 1</span>
            <button class="btn btn-secondary" onclick="nextPage()" id="nextBtn" disabled>
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Load auth.js first for authentication -->
    <script src="../js/auth.js"></script>
    <!-- CLEmail Secure API Wrapper -->
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script type="module">
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        
        // Use CLEmail wrapper for secure data access
        const { collection, getDocs, query, where, orderBy } = window.clemailFirestore;
        const db = window.clemailDb;

        // Wait for auth.js to initialize
        console.log('⏳ Waiting for auth.js to initialize...');
        await window.firebaseReady;
        console.log('✅ Auth.js initialized');

        const auth = window.auth;
        
        let currentUser = null;
        let allContacts = [];
        let filteredContacts = [];
        let currentView = 'cards';
        let currentPage = 1;
        const contactsPerPage = 24;
        let companyEmployeeCounts = {}; // Track employees per company

        // Initialize app
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                const authState = window.getCurrentAuthState?.();
                if (authState?.isLoggedIn) {
                    console.log('🛡️ Suppressing false logout - auth.js protection active');
                    return;
                }
                window.location.href = '../login.html';
                return;
            }
            
            currentUser = user;
            console.log('✅ User authenticated:', user.email);
            
            // Load all data
            await loadAllData();
        });

        // Load all contacts and related data
        async function loadAllData() {
            try {
                console.log('📋 Loading all employees from apify_linkedin_employee_scrapes...');
                
                // Get all scraped employees
                const employeesRef = collection(db, 'apify_linkedin_employee_scrapes');
                const employeesSnap = await getDocs(employeesRef);
                
                // Get all scraped company pages
                const companiesRef = collection(db, 'apify_linkedin_company_pages');
                const companiesSnap = await getDocs(companiesRef);
                
                // Get search jobs for context
                const jobsRef = collection(db, 'connect_contact_search_log');
                const jobsSnap = await getDocs(jobsRef);
                
                // Build company lookup by LinkedIn URL
                const companiesByUrl = {};
                companiesSnap.docs.forEach(doc => {
                    const company = doc.data();
                    if (company.linkedin_url) {
                        companiesByUrl[company.linkedin_url] = {
                            id: doc.id,
                            ...company
                        };
                    }
                });
                
                console.log(`✅ Loaded ${companiesSnap.size} company pages`);
                
                // Build job lookup
                const jobsById = {};
                jobsSnap.docs.forEach(doc => {
                    jobsById[doc.id] = {
                        id: doc.id,
                        ...doc.data()
                    };
                });
                
                // Process employees and connect to companies
                allContacts = [];
                const companies = new Set();
                const bdrs = new Set();
                companyEmployeeCounts = {}; // Reset counts
                
                employeesSnap.docs.forEach(doc => {
                    const employee = {
                        id: doc.id,
                        ...doc.data()
                    };
                    
                    // Connect employee to company data
                    if (employee.current_company_url) {
                        const companyData = companiesByUrl[employee.current_company_url];
                        if (companyData) {
                            employee._companyData = companyData;
                            
                            // Track employee count per company
                            const companyKey = employee.current_company_url;
                            if (!companyEmployeeCounts[companyKey]) {
                                companyEmployeeCounts[companyKey] = {
                                    name: companyData.company_name || employee.current_company,
                                    url: companyData.linkedin_url,
                                    searchDate: companyData.search_date,
                                    source: companyData.source,
                                    employeeCount: 0
                                };
                            }
                            companyEmployeeCounts[companyKey].employeeCount++;
                        }
                    }
                    
                    allContacts.push(employee);
                    
                    // Extract company name
                    const company = employee.current_company || employee._companyData?.company_name;
                    if (company) companies.add(company);
                    
                    // Extract BDR from search_key or job data (if we can correlate)
                    // For now, we'll try to extract from the job data based on company
                    if (employee._companyData) {
                        // Try to find which job this company belongs to
                        for (const job of Object.values(jobsById)) {
                            if (job.bdrEmail) {
                                bdrs.add(job.bdrEmail);
                            }
                        }
                    }
                });
                
                console.log(`✅ Loaded ${allContacts.length} employees`);
                console.log(`✅ Tracked ${Object.keys(companyEmployeeCounts).length} companies with employee counts`);
                
                // Debug: Log first contact to see structure
                if (allContacts.length > 0) {
                    console.log('📋 Sample employee structure:', allContacts[0]);
                }
                
                // Calculate average employees per company
                const avgEmployees = allContacts.length > 0 && companies.size > 0 
                    ? Math.round(allContacts.length / companies.size) 
                    : 0;
                
                // Update statistics
                document.getElementById('totalContacts').textContent = allContacts.length;
                document.getElementById('totalCompanies').textContent = companies.size;
                document.getElementById('totalJobs').textContent = jobsSnap.size;
                document.getElementById('avgEmployeesPerCompany').textContent = avgEmployees;
                
                // Build company details list
                buildCompanyDetailsList();
                
                // Populate filter dropdowns
                populateFilters(companies, bdrs, jobsById);
                
                // Apply initial filters (show all)
                applyFilters();
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('contactsContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Error Loading Contacts</h2>
                        <p style="color: var(--gray);">${error.message}</p>
                    </div>
                `;
            }
        }

        // Populate filter dropdowns
        function populateFilters(companies, bdrs, jobsById) {
            // BDR filter
            const bdrSelect = document.getElementById('filterBDR');
            const sortedBDRs = Array.from(bdrs).sort();
            sortedBDRs.forEach(bdr => {
                const option = document.createElement('option');
                option.value = bdr;
                option.textContent = bdr;
                bdrSelect.appendChild(option);
            });
            
            // Company filter
            const companySelect = document.getElementById('filterCompany');
            const sortedCompanies = Array.from(companies).sort();
            sortedCompanies.forEach(company => {
                const option = document.createElement('option');
                option.value = company;
                option.textContent = company;
                companySelect.appendChild(option);
            });
            
            // Job filter
            const jobSelect = document.getElementById('filterJob');
            const sortedJobs = Object.values(jobsById).sort((a, b) => 
                new Date(b.submittedAt) - new Date(a.submittedAt)
            );
            sortedJobs.forEach(job => {
                const option = document.createElement('option');
                option.value = job.id;
                const date = new Date(job.submittedAt).toLocaleDateString();
                option.textContent = `${date} - ${job.bdrEmail} (${job.companyCount} companies)`;
                jobSelect.appendChild(option);
            });
        }

        // Apply filters
        window.applyFilters = function() {
            const searchTerm = document.getElementById('filterSearch').value.toLowerCase();
            const bdrFilter = document.getElementById('filterBDR').value;
            const companyFilter = document.getElementById('filterCompany').value;
            const jobFilter = document.getElementById('filterJob').value;
            
            filteredContacts = allContacts.filter(contact => {
                // Search term filter - use employee scrape field names
                if (searchTerm) {
                    const firstName = contact.first_name || '';
                    const lastName = contact.last_name || '';
                    const name = (firstName + ' ' + lastName).trim();
                    const title = contact.current_title || contact.headline || '';
                    const company = contact.current_company || contact._companyData?.company_name || '';
                    const location = contact.location || '';
                    
                    const searchableText = [name, title, company, location].join(' ').toLowerCase();
                    
                    if (!searchableText.includes(searchTerm)) {
                        return false;
                    }
                }
                
                // Company filter
                if (companyFilter) {
                    const contactCompany = contact.current_company || contact._companyData?.company_name;
                    if (contactCompany !== companyFilter) {
                        return false;
                    }
                }
                
                // BDR filter - not applicable for raw scraped data yet
                // We could potentially add this by linking to job data
                
                // Job filter - could filter by search_key if needed
                
                return true;
            });
            
            console.log(`✅ Filtered to ${filteredContacts.length} contacts`);
            
            // Reset to first page
            currentPage = 1;
            
            // Render contacts
            renderContacts();
        };

        // Clear filters
        window.clearFilters = function() {
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterBDR').value = '';
            document.getElementById('filterCompany').value = '';
            document.getElementById('filterJob').value = '';
            applyFilters();
        };

        // Render contacts based on current view
        function renderContacts() {
            const container = document.getElementById('contactsContainer');
            
            if (filteredContacts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h2>No Contacts Found</h2>
                        <p style="color: var(--gray);">Try adjusting your filters or search terms</p>
                    </div>
                `;
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }
            
            // Calculate pagination
            const totalPages = Math.ceil(filteredContacts.length / contactsPerPage);
            const startIndex = (currentPage - 1) * contactsPerPage;
            const endIndex = Math.min(startIndex + contactsPerPage, filteredContacts.length);
            const pageContacts = filteredContacts.slice(startIndex, endIndex);
            
            // Update pagination controls
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
            document.getElementById('paginationContainer').style.display = 'flex';
            
            // Render based on view type
            if (currentView === 'cards') {
                renderCardsView(pageContacts, container);
            } else {
                renderTableView(pageContacts, container);
            }
        }

        // Render cards view
        function renderCardsView(contacts, container) {
            let html = '<div class="contacts-grid">';
            
            contacts.forEach(contact => {
                // Use employee scrape field names
                const firstName = contact.first_name || '';
                const lastName = contact.last_name || '';
                const name = (firstName + ' ' + lastName).trim() || 'Unknown';
                const initials = getInitials(name);
                const title = contact.current_title || contact.headline || 'No title';
                const company = contact.current_company || contact._companyData?.company_name || 'Unknown company';
                const location = contact.location || 'Unknown location';
                
                // Calculate tenure
                let tenureText = '';
                if (contact.tenure_months !== undefined) {
                    const years = Math.floor(contact.tenure_months / 12);
                    const months = contact.tenure_months % 12;
                    if (years > 0) {
                        tenureText = `${years}y ${months}m`;
                    } else {
                        tenureText = `${months}m`;
                    }
                } else if (contact.started_year) {
                    const currentYear = new Date().getFullYear();
                    const yearsOfService = currentYear - contact.started_year;
                    tenureText = `${yearsOfService}+ years`;
                }
                
                const linkedinUrl = contact.linkedin_url || '#';
                const scrapeDate = contact.scrape_date ? new Date(contact.scrape_date).toLocaleDateString() : '';
                
                html += `
                    <div class="contact-card">
                        <div class="contact-header">
                            <div class="contact-avatar">${initials}</div>
                            <div class="contact-info">
                                <div class="contact-name">${name}</div>
                                <div class="contact-title">${title}</div>
                            </div>
                        </div>
                        <div class="contact-body">
                            <div class="contact-detail">
                                <i class="fas fa-building"></i>
                                <div class="contact-detail-content">${company}</div>
                            </div>
                            <div class="contact-detail">
                                <i class="fas fa-map-marker-alt"></i>
                                <div class="contact-detail-content">${location}</div>
                            </div>
                            ${tenureText ? `
                                <div class="contact-detail">
                                    <i class="fas fa-clock"></i>
                                    <div class="contact-detail-content"><strong>Tenure:</strong> ${tenureText}</div>
                                </div>
                            ` : ''}
                            ${scrapeDate ? `
                                <div class="contact-detail">
                                    <i class="fas fa-calendar"></i>
                                    <div class="contact-detail-content"><strong>Scraped:</strong> ${scrapeDate}</div>
                                </div>
                            ` : ''}
                            ${contact._companyData?.source ? `
                                <div class="contact-detail">
                                    <i class="fas fa-database"></i>
                                    <div class="contact-detail-content"><strong>Source:</strong> ${contact._companyData.source}</div>
                                </div>
                            ` : ''}
                        </div>
                        <div class="contact-footer">
                            ${contact.premium ? '<span class="contact-badge" style="background: #fbbf24; color: #78350f;"><i class="fas fa-crown"></i> Premium</span>' : ''}
                            ${contact.open_profile ? '<span class="contact-badge" style="background: #d1fae5; color: #065f46;"><i class="fas fa-lock-open"></i> Open Profile</span>' : ''}
                        </div>
                        ${linkedinUrl !== '#' ? `
                            <a href="${linkedinUrl}" target="_blank" class="linkedin-link">
                                <i class="fab fa-linkedin"></i> View LinkedIn Profile
                            </a>
                        ` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Render table view
        function renderTableView(contacts, container) {
            let html = `
                <div class="table-view">
                    <table class="contacts-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Title</th>
                                <th>Company</th>
                                <th>Location</th>
                                <th>Tenure</th>
                                <th>Scraped</th>
                                <th>LinkedIn</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            contacts.forEach(contact => {
                // Use employee scrape field names
                const firstName = contact.first_name || '';
                const lastName = contact.last_name || '';
                const name = (firstName + ' ' + lastName).trim() || 'Unknown';
                const title = contact.current_title || contact.headline || 'No title';
                const company = contact.current_company || contact._companyData?.company_name || 'Unknown';
                const location = contact.location || 'Unknown';
                
                // Calculate tenure
                let tenureText = '-';
                if (contact.tenure_months !== undefined) {
                    const years = Math.floor(contact.tenure_months / 12);
                    const months = contact.tenure_months % 12;
                    if (years > 0) {
                        tenureText = `${years}y ${months}m`;
                    } else {
                        tenureText = `${months}m`;
                    }
                } else if (contact.started_year) {
                    const currentYear = new Date().getFullYear();
                    const yearsOfService = currentYear - contact.started_year;
                    tenureText = `${yearsOfService}+ yrs`;
                }
                
                const linkedinUrl = contact.linkedin_url || '#';
                const scrapeDate = contact.scrape_date ? new Date(contact.scrape_date).toLocaleDateString() : '-';
                
                html += `
                    <tr>
                        <td><strong>${name}</strong></td>
                        <td>${title}</td>
                        <td>${company}</td>
                        <td>${location}</td>
                        <td>${tenureText}</td>
                        <td>${scrapeDate}</td>
                        <td>
                            ${linkedinUrl !== '#' ? `
                                <a href="${linkedinUrl}" target="_blank" style="color: var(--primary);">
                                    <i class="fab fa-linkedin"></i> View
                                </a>
                            ` : '-'}
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = html;
        }

        // Get initials from name
        function getInitials(name) {
            const parts = name.trim().split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        // Switch view
        window.switchView = function(view) {
            currentView = view;
            
            // Update toggle buttons
            const buttons = document.querySelectorAll('.view-toggle button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Re-render
            renderContacts();
        };

        // Pagination
        window.nextPage = function() {
            currentPage++;
            renderContacts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.previousPage = function() {
            currentPage--;
            renderContacts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Export to CSV
        window.exportToCSV = function() {
            if (filteredContacts.length === 0) {
                alert('No contacts to export');
                return;
            }
            
            // Create CSV content with employee scrape fields
            const headers = ['First Name', 'Last Name', 'Title', 'Company', 'Company LinkedIn', 'Location', 'LinkedIn URL', 'Tenure (months)', 'Premium', 'Open Profile', 'Scraped Date', 'Source'];
            const rows = filteredContacts.map(contact => [
                contact.first_name || '',
                contact.last_name || '',
                contact.current_title || contact.headline || '',
                contact.current_company || contact._companyData?.company_name || '',
                contact.current_company_url || '',
                contact.location || '',
                contact.linkedin_url || '',
                contact.tenure_months !== undefined ? contact.tenure_months : '',
                contact.premium ? 'Yes' : 'No',
                contact.open_profile ? 'Yes' : 'No',
                contact.scrape_date || '',
                contact._companyData?.source || ''
            ]);
            
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                // Escape fields that contain commas or quotes
                const escapedRow = row.map(field => {
                    const str = String(field);
                    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                });
                csv += escapedRow.join(',') + '\n';
            });
            
            // Download CSV
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `linkedin_employees_export_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            console.log(`✅ Exported ${filteredContacts.length} employees to CSV`);
        };

        // Build company details list
        function buildCompanyDetailsList() {
            const container = document.getElementById('companyDetailsList');
            
            // Sort companies by employee count (descending)
            const sortedCompanies = Object.values(companyEmployeeCounts).sort((a, b) => 
                b.employeeCount - a.employeeCount
            );
            
            if (sortedCompanies.length === 0) {
                container.innerHTML = '<p style="color: var(--gray); text-align: center;">No company data available</p>';
                return;
            }
            
            let html = `
                <div style="display: grid; gap: 1rem;">
            `;
            
            sortedCompanies.forEach((company, index) => {
                const searchDate = company.searchDate ? new Date(company.searchDate).toLocaleDateString() : 'Unknown';
                const percentage = allContacts.length > 0 
                    ? ((company.employeeCount / allContacts.length) * 100).toFixed(1) 
                    : 0;
                
                html += `
                    <div style="background: var(--light-gray); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--primary);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                            <div style="flex: 1;">
                                <h4 style="color: var(--secondary); margin-bottom: 0.25rem;">
                                    ${index + 1}. ${company.name}
                                </h4>
                                <div style="font-size: 0.85rem; color: var(--gray);">
                                    <i class="fas fa-calendar"></i> Scraped: ${searchDate}
                                    ${company.source ? ` | <i class="fas fa-database"></i> Source: ${company.source}` : ''}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">
                                    ${company.employeeCount}
                                </div>
                                <div style="font-size: 0.75rem; color: var(--gray);">
                                    employees (${percentage}%)
                                </div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                            <a href="${company.url}" target="_blank" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.85rem; text-decoration: none;">
                                <i class="fab fa-linkedin"></i> View Company
                            </a>
                            <button class="btn btn-secondary" onclick="filterByCompany('${company.name.replace(/'/g, "\\'")}')" style="padding: 6px 12px; font-size: 0.85rem;">
                                <i class="fas fa-filter"></i> Filter Employees
                            </button>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Toggle company details visibility
        window.toggleCompanyDetails = function() {
            const section = document.getElementById('companyDetailsSection');
            const btn = document.getElementById('showCompanyDetailsBtn');
            
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.style.display = 'none';
            } else {
                section.style.display = 'none';
                btn.style.display = 'inline-flex';
            }
        };

        // Filter by specific company
        window.filterByCompany = function(companyName) {
            document.getElementById('filterCompany').value = companyName;
            applyFilters();
            
            // Scroll to contacts
            document.getElementById('contactsContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
    </script>
</body>
</html>
