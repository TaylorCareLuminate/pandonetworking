<!DOCTYPE html>
<html>
<head>
    <title>LinkedIn URL Test - Inline</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        button { background: #0077b5; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        .log { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 4px; font-family: monospace; font-size: 13px; max-height: 500px; overflow-y: auto; margin: 20px 0; }
        .success { color: #66BB6A; }
        .error { color: #EF5350; }
        .info { color: #4FC3F7; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: 600; }
        .match { background: #e8f5e9; }
        .mismatch { background: #ffebee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 LinkedIn URL Research Test</h1>
        <p>Testing 40 organizations for ellen@everex.ai</p>
        <button id="btnTest" onclick="startTest()">🚀 Start Test</button>
        <div class="log" id="log"></div>
        <div id="results"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script>
        (function() {
            let user = null;
            
            window.authStateCallbacks = window.authStateCallbacks || [];
            window.authStateCallbacks.push((authState) => {
                if (authState.isLoggedIn) {
                    user = authState.user;
                    log(`✅ Authenticated: ${user.email}`, 'success');
                }
            });

            function log(msg, type = 'info') {
                const div = document.getElementById('log');
                const time = new Date().toLocaleTimeString();
                div.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
                div.scrollTop = div.scrollHeight;
                console.log(msg);
            }

            window.startTest = async function() {
                try {
                    const btn = document.getElementById('btnTest');
                    btn.disabled = true;
                    btn.textContent = '⏳ Running...';
                    
                    document.getElementById('log').innerHTML = '';
                    log('🚀 Starting test...', 'info');

                    if (!user) {
                        log('❌ Not authenticated', 'error');
                        return;
                    }

                    await new Promise(r => setTimeout(r, 1000));
                    
                    if (!window.clemailFirestore) {
                        log('❌ Firestore not loaded', 'error');
                        return;
                    }

                    const { collection: col, query: qry, where: whr, getDocs: get, limit: lim } = window.clemailFirestore;
                    const database = window.clemailDb;

                    log('📊 Loading organizations...', 'info');
                    
                    const ref = col(database, 'prospect_organizations');
                    const q = qry(ref, whr('bdrEmail', '==', 'ellen@everex.ai'), lim(40));
                    const snap = await get(q);

                    const orgs = [];
                    snap.docs.forEach(doc => {
                        const d = doc.data();
                        orgs.push({
                            id: doc.id,
                            company_name: d.company_name,
                            company_domain: d.company_domain || '',
                            company_city: d.company_city || '',
                            company_state: d.company_state || ''
                        });
                    });

                    log(`✅ Loaded ${orgs.length} organizations`, 'success');
                    orgs.forEach((o, i) => log(`   ${i+1}. ${o.company_name}`, 'info'));

                    log('🔬 Calling API...', 'info');
                    const token = await user.getIdToken();
                    
                    const res = await fetch('https://railwayclemail-production.up.railway.app/api/linkedin-contact-search/research-company-urls', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            companies: orgs,
                            force_refresh: true
                        })
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    
                    const result = await res.json();
                    if (!result.success) throw new Error(result.error);

                    log(`✅ Found ${result.found} of ${result.total}`, 'success');
                    log(`🤖 Verified: ${result.verified || 0}`, 'success');
                    log(`💰 Cost: $${(result.cost || 0).toFixed(3)}`, 'info');

                    let html = '<table><tr><th>#</th><th>Original</th><th>Found</th><th>URL</th><th>Match</th></tr>';
                    
                    orgs.forEach((org, i) => {
                        const found = result.companies[i] || {};
                        const match = org.company_name.toLowerCase() === (found.company_name || '').toLowerCase();
                        const rowClass = found.linkedin_url ? (match ? 'match' : 'mismatch') : '';
                        
                        html += `<tr class="${rowClass}">
                            <td>${i+1}</td>
                            <td><b>${org.company_name}</b></td>
                            <td>${found.company_name || '-'}</td>
                            <td>${found.linkedin_url ? `<a href="${found.linkedin_url}" target="_blank">Link</a>` : 'None'}</td>
                            <td>${match ? '✅' : '⚠️'}</td>
                        </tr>`;
                        
                        if (found.linkedin_url) {
                            const emoji = match ? '✅' : '⚠️';
                            log(`${emoji} ${i+1}. "${org.company_name}" → "${found.company_name}"`, match ? 'success' : 'error');
                        } else {
                            log(`❌ ${i+1}. "${org.company_name}" → Not found`, 'error');
                        }
                    });
                    
                    html += '</table>';
                    document.getElementById('results').innerHTML = html;
                    
                    log('✅ TEST COMPLETE', 'success');

                } catch (err) {
                    log(`❌ Error: ${err.message}`, 'error');
                    console.error(err);
                } finally {
                    document.getElementById('btnTest').disabled = false;
                    document.getElementById('btnTest').textContent = '🚀 Start Test';
                }
            };
        })();
    </script>
</body>
</html>
