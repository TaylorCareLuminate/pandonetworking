            const insertToolbar = buildInsertToolbar(conv.id, bdrEmail);

            const adminControls = isAdmin ? `
                <div class="admin-category-controls">
                    <h4><i class="fas fa-user-shield"></i> Admin: Manual Category Override</h4>
                    <button class="btn ${conv.flaggedForClientReview ? 'btn-warning' : 'btn-secondary'}"
                            onclick="toggleClientReviewFlag('${conv.id}')"
                            style="margin-bottom:0.5rem;width:100%;">
                        <i class="fas fa-flag"></i>
                        ${conv.flaggedForClientReview ? '✓ Flagged for Client Review' : 'Flag for Client Review'}
                    </button>
                    <button class="btn ${conv.ignored ? 'btn-secondary' : 'btn-danger'}"
                            onclick="ignoreConversation('${conv.id}')"
                            style="margin-bottom:1rem;width:100%;">
                        <i class="fas ${conv.ignored ? 'fa-eye' : 'fa-eye-slash'}"></i>
                        ${conv.ignored ? '✓ Conversation Ignored — Click to Un-Ignore' : 'Ignore Conversation'}
                    </button>
                    <div class="category-selectors">
                        <div class="category-selector">
                            <label>
                                Response Category:
                                <i id="lock-icon-response-${conv.id}"
                                   class="${conv.manualCategoryOverride ? 'fas fa-lock' : 'fas fa-lock-open'}"
                                   onclick="toggleManualOverride('${conv.id}')"
                                   style="margin-left:8px;cursor:pointer;color:${conv.manualCategoryOverride ? '#10b981' : '#94a3b8'};${conv.manualCategoryOverride ? '' : 'display:none;'}"></i>
                            </label>
                            <select id="response-${conv.id}" onchange="saveCategoryAuto('${conv.id}')">
                                <option value="">-- Keep Current --</option>
                                <option value="Response" ${responseCategory === 'Response' ? 'selected' : ''}>Response</option>
                                <option value="Response Engaged" ${responseCategory === 'Response Engaged' ? 'selected' : ''}>Response Engaged</option>
                                <option value="Response Willing to Meet" ${responseCategory === 'Response Willing to Meet' ? 'selected' : ''}>Response Willing to Meet</option>
                                <option value="Scheduled" ${responseCategory === 'Scheduled' ? 'selected' : ''}>Scheduled</option>
                                <option value="Declined to Meet" ${responseCategory === 'Declined to Meet' ? 'selected' : ''}>Declined to Meet</option>
                            </select>
                        </div>
                        <div class="category-selector">
                            <label>Follow-Up Category:</label>
                            <select id="followup-${conv.id}" onchange="saveCategoryAuto('${conv.id}')">
                                <option value="">-- Keep Current --</option>
                                <option value="No Follow Up" ${followUpCategory === 'No Follow Up' ? 'selected' : ''}>No Follow Up</option>
                                <option value="Followed Up No Invite" ${followUpCategory === 'Followed Up No Invite' ? 'selected' : ''}>Followed Up No Invite</option>
                                <option value="Followed Up Soft Invite" ${followUpCategory === 'Followed Up Soft Invite' ? 'selected' : ''}>Followed Up Soft Invite</option>
                                <option value="Followed Up Calendar Link" ${followUpCategory === 'Followed Up Calendar Link' ? 'selected' : ''}>Followed Up Calendar Link</option>
                                <option value="Qualified Wrong Contact" ${followUpCategory === 'Qualified Wrong Contact' ? 'selected' : ''}>❌ Qualified Wrong Contact</option>
                            </select>
                        </div>
                    </div>
                    ${conv.manualCategoryOverride ? '<p style="color:#10b981;font-size:0.85rem;margin-top:0.5rem;"><i class="fas fa-lock"></i> Manual override active</p>' : ''}
                </div>` : '';

            return `
            <div class="reply-item"
                 data-conversation-id="${conv.id}"
                 data-scheduled="${isScheduled}"
                 data-wrong-contact="${isWrongContact}"
                 data-inbound-originated="${isInboundOriginated}">

                <!-- Contact Header -->
                <div class="contact-card">
                    <div class="contact-avatar">${avatarHtml}</div>
                    <div class="contact-info">
                        <div class="contact-name">
                            ${escapeHtml(leadName)}${linkedInBtnHtml}
                        </div>
                        ${leadTitle ? `<div class="contact-title">${escapeHtml(leadTitle)}</div>` : ''}
                        ${leadCompany ? `<div class="contact-title" style="color:#94a3b8;"><i class="fas fa-building" style="margin-right:0.25rem;"></i>${escapeHtml(leadCompany)}</div>` : ''}
                        <div class="category-badges">
                            <div class="category-badge"><i class="fas fa-user"></i> ${responseCategory}</div>
                            <div class="category-badge" ${isWrongContact ? 'style="background:rgba(239,68,68,0.3);"' : ''}>
                                <i class="fas ${isWrongContact ? 'fa-exclamation-triangle' : 'fa-reply'}"></i> ${followUpCategory}
                            </div>
                            ${lastActive ? `<div class="category-badge"><i class="fas fa-clock"></i> ${lastActive}</div>` : ''}
                            ${bdrName ? `<div class="category-badge" style="background:rgba(139,92,246,0.3);border-color:rgba(139,92,246,0.5);"><i class="fas fa-user-tie"></i> BDR: ${escapeHtml(bdrName)}</div>` : ''}
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:0.5rem;align-items:flex-end;flex-shrink:0;">
                        <div style="font-size:0.78rem;opacity:0.75;text-align:right;">ID: ${escapeHtml(conv.id.substring(0,20))}…</div>
                        <div style="font-size:0.78rem;opacity:0.75;">Source: ${escapeHtml(conv.source || '')}</div>
                    </div>
                </div>

                <!-- Conversation Section -->
                <div class="conversation-section">
                    <div class="section-header">
                        <div class="section-title">
                            <i class="fas fa-history"></i>
                            Conversation History (${conv.messages.length} messages)
                        </div>
                        <button class="btn-screenshot" onclick="captureConversationScreenshot('${conv.id}')">
                            <i class="fas fa-camera"></i> Screenshot
                        </button>
                    </div>

                    <div class="messages-container">
                        ${messagesHtml || '<div style="text-align:center;color:#94a3b8;padding:1rem;font-size:0.85rem;">No messages to display</div>'}
                    </div>

                    <!-- Reply Compose -->
                    <div class="message-compose-section">
                        <h4><i class="fas fa-paper-plane"></i> Send Reply</h4>
                        ${insertToolbar}
                        <textarea
                            id="replyText-${conv.id}"
                            class="reply-textarea"
                            placeholder="Type your reply here..."
                            maxlength="2000"
                        ></textarea>
                        <div class="compose-footer">
                            <div class="char-count"><span id="charCount-${conv.id}">0</span> / 2000 characters</div>
                            <div class="compose-buttons">
                                <button class="btn btn-secondary" onclick="clearReply('${conv.id}')"><i class="fas fa-times"></i> Clear</button>
                                <button class="btn btn-primary" onclick="sendReply('${conv.id}')"><i class="fas fa-paper-plane"></i> Send Message</button>
                            </div>
                        </div>
                    </div>

                    <!-- CRM Notes -->
                    <div class="crm-notes-section">
                        <h4><i class="fas fa-sticky-note"></i> CRM Notes</h4>
                        <textarea
                            id="notes-${conv.id}"
                            class="notes-textarea"
                            placeholder="Add a new note about this contact..."
                            data-conversation-id="${conv.id}"
                            data-lead-url="${escapeHtml(leadProfileUrl)}"
                        ></textarea>
                        <div class="notes-footer">
                            <button class="btn btn-primary btn-sm" onclick="saveCRMNotes('${conv.id}')">
                                <i class="fas fa-plus"></i> Add Note
                            </button>
                        </div>
                        <div id="notes-history-${conv.id}" class="notes-history"></div>
                    </div>

                    <!-- Company Intel -->
                    <div class="company-intel-section">
                        <h4>
                            <i class="fas fa-search"></i>
                            Company Intel
                            <span class="intel-subtitle">Brave + Llama search</span>
                        </h4>
                        <div class="company-intel-input-row">
                            <input
                                type="text"
                                id="companyIntelInput-${conv.id}"
                                class="company-intel-input"
                                placeholder="Company name..."
                                value="${escapeHtml(leadCompany)}"
                            />
                            <button
                                class="btn-search-company"
                                id="companyIntelBtn-${conv.id}"
                                onclick="searchCompanyInfo('${conv.id}', '${escapeHtml(conv.leadFirstName || '')}', '${escapeHtml(leadTitle)}')">
                                <i class="fas fa-search"></i> Search
                            </button>
                        </div>
                        <div id="companyIntelResults-${conv.id}" class="company-intel-results"></div>
                    </div>

                    ${adminControls}
                </div>
            </div>`;
        }

        function renderMessage(message, contactName, convId, msgIdx, convCollection) {
            const timestamp = safeToDate(message.createdAt || message.timestamp);
            const timeStr = timestamp ? timestamp.toLocaleString() : 'Unknown time';
            const isAccount = message.sender === 'ME' || message.sender === 'account';
            const messageText = message.body || message.text || message.message || '';

            const adminDeleteBtn = (isAdmin && convId !== null && msgIdx !== null && convCollection)
                ? `<button class="admin-msg-delete-btn" title="Hide this message (admin only)"
                       onclick="adminHideMessage('${convId}', ${msgIdx}, '${convCollection}')">
                       <i class="fas fa-trash-alt"></i>
                   </button>` : '';

            return `
                <div class="message ${isAccount ? 'account' : 'lead'}">
                    <div class="message-avatar">
                        ${isAccount ? 'ME' : getInitials(contactName)}
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <div class="message-text">${escapeHtml(messageText)}</div>
                        </div>
                        <div class="message-time">
                            <i class="far fa-clock"></i> ${timeStr}
                        </div>
                    </div>
                    ${adminDeleteBtn}
                </div>`;
        }

        // ── Insert toolbar ────────────────────────────────────────────────────

        function buildInsertToolbar(convId, bdrEmail) {
            if (!bdrEmail) return '';
            const profile = bdrProfileCache.get(bdrEmail.toLowerCase());
            const canAddInserts = isAdmin || (accountEmail && accountEmail.toLowerCase() === bdrEmail.toLowerCase());
            if (!profile && !canAddInserts) return '';

            const hasLinkedIn = profile?.linkedInUrl?.trim();
            const hasCalendar = profile?.calendarLink?.trim();
            const hasInserts = profile?.textInserts?.length > 0;

            if (!hasLinkedIn && !hasCalendar && !hasInserts && !canAddInserts) return '';

            const encodedEmail = encodeURIComponent(bdrEmail);

            const liBtn = hasLinkedIn ? `<button class="btn-insert btn-insert-linkedin" onclick="insertFromProfile('${convId}','linkedInUrl','${encodedEmail}')"><i class="fab fa-linkedin"></i> My LinkedIn</button>` : '';
            const calBtn = hasCalendar ? `<button class="btn-insert btn-insert-calendar" onclick="insertFromProfile('${convId}','calendarLink','${encodedEmail}')"><i class="fas fa-calendar-alt"></i> Calendar Link</button>` : '';
            const insertBtns = hasInserts ? profile.textInserts.map((ins, idx) =>
                `<button class="btn-insert btn-insert-custom" onclick="insertTextInsert('${convId}',${idx},'${encodedEmail}')" title="${escapeHtml(ins.text||'')}"><i class="fas fa-align-left"></i> ${escapeHtml(ins.label || `Insert ${idx+1}`)}</button>`
            ).join('') : '';
            const addBtn = canAddInserts ? `<button class="btn-insert btn-add-quick-text" onclick="showAddTextInsertModal('${convId}','${encodedEmail}')"><i class="fas fa-plus"></i> Add Quick Text</button>` : '';

            return `
                <div class="insert-toolbar" id="insert-toolbar-${convId}">
                    <span class="insert-toolbar-label"><i class="fas fa-bolt"></i> Insert:</span>
                    ${liBtn}${calBtn}${insertBtns}${addBtn}
                </div>`;
        }

        window.insertFromProfile = function(convId, field, encodedEmail) {
            const email = decodeURIComponent(encodedEmail);
            const profile = bdrProfileCache.get(email.toLowerCase());
            const text = profile ? (profile[field] || '') : '';
            if (!text) return;
            insertIntoReply(convId, text);
        };

        window.insertTextInsert = function(convId, index, encodedEmail) {
            const email = decodeURIComponent(encodedEmail);
            const profile = bdrProfileCache.get(email.toLowerCase());
            const insert = profile ? profile.textInserts[index] : null;
            if (!insert?.text) return;
            insertIntoReply(convId, insert.text);
        };

        function insertIntoReply(convId, text) {
            const ta = document.getElementById(`replyText-${convId}`);
            if (!ta || ta.disabled) return;
            const start = ta.selectionStart, end = ta.selectionEnd;
            const before = ta.value.substring(0, start), after = ta.value.substring(end);
            const sep = (before.length > 0 && !before.endsWith(' ') && !before.endsWith('\n')) ? ' ' : '';
            ta.value = before + sep + text + after;
            const newPos = start + sep.length + text.length;
            ta.setSelectionRange(newPos, newPos);
            ta.dispatchEvent(new Event('input'));
            const cc = document.getElementById(`charCount-${convId}`);
            if (cc) cc.textContent = ta.value.length;
            ta.focus();
        }

        // ── Reply ─────────────────────────────────────────────────────────────

        window.clearReply = function(conversationId) {
            const ta = document.getElementById(`replyText-${conversationId}`);
            if (ta) ta.value = '';
            const cc = document.getElementById(`charCount-${conversationId}`);
            if (cc) cc.textContent = '0';
        };

        window.sendReply = async function(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;

            const ta = document.getElementById(`replyText-${conversationId}`);
            const messageText = ta ? ta.value.trim() : '';
            if (!messageText) { alert('Please enter a message before sending.'); return; }

            const linkedInAccountId = conv.linkedInAccountId || conv.rawData?.linkedInAccount?.id;
            if (!linkedInAccountId) {
                alert('⚠️ This conversation does not have a LinkedIn Account ID — sending via API is not available. Please reply directly on LinkedIn.');
                return;
            }

            const convIdClean = conversationId.startsWith('webhook_')
                ? String(conv.rawData?.conversationId || conv.rawData?.conversation_id || conversationId)
                : conversationId;

            const customerId = conv.customerId || null;

            const sendBtn = document.querySelector(`[data-conversation-id="${conversationId}"] .btn-primary`);
            const origBtnHtml = sendBtn ? sendBtn.innerHTML : '';
            try {
                if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…'; }

                const response = await fetch(`${RAILWAY_URL}/heyreach/inbox/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerId, conversationId: convIdClean, linkedInAccountId, message: messageText })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Failed to send message');

                alert('✅ Message sent successfully! 📨');
                clearReply(conversationId);

                const sentMessage = { body: messageText, text: messageText, sender: 'ME', createdAt: new Date(), sentViaAPI: true };
                conv.messages.push(sentMessage);

                const mc = document.querySelector(`[data-conversation-id="${conversationId}"] .messages-container`);
                if (mc) {
                    mc.insertAdjacentHTML('beforeend', `
                        <div class="message account">
                            <div class="message-avatar">ME</div>
                            <div class="message-content">
                                <div class="message-bubble"><div class="message-text">${escapeHtml(messageText)}</div></div>
                                <div class="message-time"><i class="far fa-clock"></i> Just now</div>
                            </div>
                        </div>`);
                    mc.scrollTop = mc.scrollHeight;
                }

                // Track activity
                try {
                    const { addDoc, collection: col } = window.clemailFirestore;
                    await addDoc(col(emailDB, 'activity_tracking'), {
                        activity_type: 'follow_up_message', reply_type: 'follow_up',
                        reply_message: messageText, reply_character_count: messageText.length,
                        contact_name: conv.lead_name, contact_linkedin_url: conv.leadProfileUrl || '',
                        bdr_email: conv.bdrEmail || accountEmail, replied_by: currentUserEmail,
                        replied_at: new Date(), source: 'conversation_lookup', conversation_id: convIdClean,
                        customer_id: customerId
                    });
                } catch(trackErr) { console.warn('Tracking error (non-fatal):', trackErr.message); }

                // Persist to Firestore
                try {
                    await fetch(`${RAILWAY_URL}/heyreach/inbox/add-sent-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            collection: getConvCollection(conv),
                            documentId: conv.activityDocId || conv.firestoreDocId || convIdClean,
                            message: sentMessage,
                            conversationId: convIdClean
                        })
                    });
                } catch(e) { console.warn('Persist error (non-fatal):', e.message); }

            } catch(e) {
                console.error('Send error:', e);
                alert('❌ Failed to send message: ' + e.message);
            } finally {
                if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = origBtnHtml; }
            }
        };

        // ── CRM Notes ─────────────────────────────────────────────────────────

        window.saveCRMNotes = async function(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;
            const ta = document.getElementById(`notes-${conversationId}`);
            const notes = ta ? ta.value.trim() : '';
            if (!notes) { alert('⚠️ Please enter a note before saving.'); return; }

            const leadUrl = ta.getAttribute('data-lead-url') || conv.leadProfileUrl || '';
            const correspondent = conv.rawData?.correspondentProfile || {};
            const leadName = conv.lead_name || 'Unknown';

            try {
                const crmData = {
                    leadName, leadPosition: conv.leadPosition || '', leadCompany: conv.companyName || '',
                    linkedInUrl: leadUrl, notes, bdrEmail: accountEmail,
                    conversationId, createdAt: new Date(), createdBy: currentUserEmail
                };
                const docId = `${conversationId}_${Date.now()}`;
                const { doc: docRef, setDoc } = window.clemailFirestore;
                await setDoc(docRef(emailDB, 'connect_linkedin_crm', docId), crmData);
                ta.value = '';
                if (!conv.crmNotesHistory) conv.crmNotesHistory = [];
                conv.crmNotesHistory.unshift({ id: docId, ...crmData });
                renderCRMNotesHistory(conversationId);
            } catch(e) {
                console.error('CRM note save error:', e);
                alert(`❌ Error saving note: ${e.message}`);
            }
        };

        window.deleteCRMNote = async function(conversationId, noteId) {
            if (!confirm('Are you sure you want to delete this note?')) return;
            try {
                const { doc: docRef, deleteDoc } = window.clemailFirestore;
                await deleteDoc(docRef(emailDB, 'connect_linkedin_crm', noteId));
                const conv = currentConversation;
                if (conv && conv.crmNotesHistory) {
                    conv.crmNotesHistory = conv.crmNotesHistory.filter(n => n.id !== noteId);
                    renderCRMNotesHistory(conversationId);
                }
            } catch(e) {
                alert(`❌ Error deleting note: ${e.message}`);
            }
        };

        function renderCRMNotesHistory(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;
            const container = document.getElementById(`notes-history-${conversationId}`);
            if (!container) return;
            const notes = conv.crmNotesHistory || [];
            if (notes.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = notes.map(note => {
                const date = note.createdAt
                    ? (typeof note.createdAt.toDate === 'function' ? note.createdAt.toDate() : new Date(note.createdAt)).toLocaleDateString()
                    : '';
                return `
                    <div class="note-item">
                        <div class="note-header">
                            <span><i class="fas fa-calendar-alt"></i> ${date} · ${escapeHtml(note.createdBy || '')}</span>
                            <button class="note-delete-btn" onclick="deleteCRMNote('${conversationId}', '${note.id}')" title="Delete note">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                        <div class="note-text">${escapeHtml(note.notes || '')}</div>
                    </div>`;
            }).join('');
        }

        // ── Company Intel ─────────────────────────────────────────────────────

        window.searchCompanyInfo = async function(convId, firstName, title) {
            const input = document.getElementById(`companyIntelInput-${convId}`);
            const btn = document.getElementById(`companyIntelBtn-${convId}`);
            const resultsDiv = document.getElementById(`companyIntelResults-${convId}`);
            const companyName = (input ? input.value : '').trim();
            if (!companyName) { alert('Please enter a company name.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching…';
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `<div class="ci-loading"><i class="fas fa-spinner fa-spin"></i> Searching Brave + Llama for <strong>${escapeHtml(companyName)}</strong>…</div>`;

            const [newsResult, overviewResult] = await Promise.allSettled([
                fetch(`${RAILWAY_URL}/api/company-news/generate-intro`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyName, contactFirstName: firstName || '', contactTitle: title || '' })
                }).then(r => r.json()).catch(e => ({ _fetchError: e.message })),
                fetch(`${RAILWAY_URL}/api/ai-profile-eval`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: 'openrouter', model: 'meta-llama/llama-4-maverick',
                        prompt: `In 2–3 concise sentences, describe what "${companyName}" does as a company. Cover: their industry, core products or services, and the types of customers or patients they serve. Be factual. If you don't have reliable information about this specific company, say so briefly.`,
                        temperature: 0.2, max_tokens: 200
                    })
                }).then(r => r.json()).catch(e => ({ _fetchError: e.message }))
            ]);

            let html = '';

            const ov = overviewResult.status === 'fulfilled' ? overviewResult.value : null;
            const ovText = ov && !ov._fetchError ? (ov.message || ov.response || '').trim() : null;
            if (ovText) {
                html += `<div class="ci-block"><div class="ci-block-label"><i class="fas fa-building"></i> What They Do</div><div class="ci-block-text" id="ciOverview-${convId}">${escapeHtml(ovText)}</div></div>`;
            }

            const nr = newsResult.status === 'fulfilled' ? newsResult.value : null;
            if (nr && nr.success) {
                html += `
                    <div class="ci-block"><div class="ci-block-label"><i class="fas fa-newspaper"></i> Recent News${nr.date ? ' · ' + escapeHtml(nr.date) : ''}</div><div class="ci-block-text news-title">${escapeHtml(nr.headline || '')}</div></div>
                    <div class="ci-block"><div class="ci-block-label"><i class="fas fa-magic"></i> AI-Generated Opener</div><div class="ci-block-text italic" id="ciIntro-${convId}">${escapeHtml(nr.intro || '')}</div></div>`;
            } else if (nr && !nr._fetchError) {
                const reasonMap = { no_news: 'No recent news found.', no_recent_positive_news: 'No recent positive news in the past 3 months.', no_suitable_news: 'AI found no suitable news story.' };
                html += `<div class="ci-no-result"><i class="fas fa-info-circle" style="margin-top:2px;flex-shrink:0;"></i> ${reasonMap[nr.reason] || (nr.reason || 'No recent news found.')}</div>`;
            } else {
                html += `<div class="ci-no-result"><i class="fas fa-exclamation-triangle" style="flex-shrink:0;"></i> News search failed: ${escapeHtml((nr && nr._fetchError) || 'network error')}</div>`;
            }

            const hasIntro = nr && nr.success && nr.intro;
            const hasOverview = !!ovText;
            if (hasIntro || hasOverview) {
                html += `<div class="ci-actions">`;
                if (hasIntro) {
                    html += `<button class="btn-insert" onclick="ciPasteToReply('${convId}','intro')"><i class="fas fa-paste"></i> Paste Opener</button>`;
                    html += `<button class="btn-insert" onclick="ciCopy('${convId}','intro')"><i class="fas fa-copy"></i> Copy Opener</button>`;
                }
                if (hasOverview) {
                    html += `<button class="btn-insert" onclick="ciPasteToReply('${convId}','overview')"><i class="fas fa-paste"></i> Paste Overview</button>`;
                    html += `<button class="btn-insert" onclick="ciCopy('${convId}','overview')"><i class="fas fa-copy"></i> Copy Overview</button>`;
                }
                html += `</div>`;
            }

            if (!html) html = `<div class="ci-no-result"><i class="fas fa-search" style="flex-shrink:0;"></i> No results returned for "${escapeHtml(companyName)}".</div>`;
            resultsDiv.innerHTML = html;
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Re-Search';
        };

        window.ciPasteToReply = function(convId, type) {
            const srcEl = document.getElementById(type === 'intro' ? `ciIntro-${convId}` : `ciOverview-${convId}`);
            const replyEl = document.getElementById(`replyText-${convId}`);
            if (!srcEl || !replyEl) return;
            const text = srcEl.textContent.trim();
            replyEl.value = replyEl.value.trim() ? text + '\n\n' + replyEl.value : text;
            replyEl.dispatchEvent(new Event('input'));
            const cc = document.getElementById(`charCount-${convId}`);
            if (cc) cc.textContent = replyEl.value.length;
            replyEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        window.ciCopy = function(convId, type) {
            const srcEl = document.getElementById(type === 'intro' ? `ciIntro-${convId}` : `ciOverview-${convId}`);
            if (!srcEl) return;
            navigator.clipboard.writeText(srcEl.textContent.trim()).then(() => {
                const orig = srcEl.style.background;
                srcEl.style.background = '#dcfce7';
                setTimeout(() => { srcEl.style.background = orig; }, 700);
            });
        };

        // ── Category save ─────────────────────────────────────────────────────

        window.saveCategoryAuto = async function(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;
            const responseSelect = document.getElementById(`response-${conversationId}`);
            const followUpSelect = document.getElementById(`followup-${conversationId}`);
            const responseValue = responseSelect?.value;
            const followUpValue = followUpSelect?.value;
            if (!responseValue && !followUpValue) return;

            const coll = getConvCollection(conv);
            const updateData = { manualCategoryOverride: true };
            if (responseValue) updateData.responseCategory = responseValue;
            if (followUpValue) updateData.followUpCategory = followUpValue;

            try {
                if (conversationId.startsWith('webhook_')) {
                    const { doc: docRef, setDoc } = window.clemailFirestore;
                    await setDoc(docRef(emailDB, 'conversation_category_overrides', conversationId), {
                        conversationId, bdrEmail: accountEmail, ...updateData,
                        updatedAt: new Date(), updatedBy: currentUserEmail
                    });
                } else {
                    const resp = await fetch(`${RAILWAY_URL}/heyreach/inbox/update-conversation-category`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conversationId, collection: coll, ...updateData })
                    });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                }
                if (responseValue) conv.responseCategory = responseValue;
                if (followUpValue) conv.followUpCategory = followUpValue;
                conv.manualCategoryOverride = true;

                const lockIcon = document.getElementById(`lock-icon-response-${conversationId}`);
                if (lockIcon) { lockIcon.style.display = 'inline'; lockIcon.style.color = '#10b981'; lockIcon.className = 'fas fa-lock'; }

                const overrideNote = document.querySelector(`[data-conversation-id="${conversationId}"] .admin-category-controls p`);
                if (!overrideNote) {
                    const controls = document.querySelector(`[data-conversation-id="${conversationId}"] .admin-category-controls`);
                    if (controls) {
                        const p = document.createElement('p');
                        p.style.cssText = 'color:#10b981;font-size:0.85rem;margin-top:0.5rem;';
                        p.innerHTML = '<i class="fas fa-lock"></i> Manual override active';
                        controls.appendChild(p);
                    }
                }
                console.log('✅ Category saved:', updateData);
            } catch(e) {
                console.error('Category save error:', e);
                alert(`❌ Error saving category: ${e.message}`);
            }
        };

        window.toggleManualOverride = async function(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;
            const newValue = !conv.manualCategoryOverride;
            const coll = getConvCollection(conv);
            try {
                if (!conversationId.startsWith('webhook_')) {
                    const resp = await fetch(`${RAILWAY_URL}/heyreach/inbox/update-conversation-category`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conversationId, collection: coll, manualCategoryOverride: newValue })
                    });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                }
                conv.manualCategoryOverride = newValue;
                const lockIcon = document.getElementById(`lock-icon-response-${conversationId}`);
                if (lockIcon) {
                    lockIcon.style.color = newValue ? '#10b981' : '#94a3b8';
                    lockIcon.className = newValue ? 'fas fa-lock' : 'fas fa-lock-open';
                }
            } catch(e) {
                alert(`❌ Error toggling override: ${e.message}`);
            }
        };

        window.toggleClientReviewFlag = async function(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;
            const newFlagged = !conv.flaggedForClientReview;
            const coll = getConvCollection(conv);
            try {
                if (conversationId.startsWith('webhook_')) {
                    const { doc: docRef, setDoc } = window.clemailFirestore;
                    await setDoc(docRef(emailDB, 'conversation_category_overrides', conversationId), {
                        conversationId, bdrEmail: accountEmail,
                        flaggedForClientReview: newFlagged, updatedAt: new Date(), updatedBy: currentUserEmail
                    }, { merge: true });
                } else {
                    const resp = await fetch(`${RAILWAY_URL}/heyreach/inbox/update-conversation-category`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conversationId, collection: coll, flaggedForClientReview: newFlagged })
                    });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                }
                conv.flaggedForClientReview = newFlagged;
                const btn = document.querySelector(`[data-conversation-id="${conversationId}"] .admin-category-controls .btn`);
                if (btn) {
                    btn.innerHTML = `<i class="fas fa-flag"></i> ${newFlagged ? '✓ Flagged for Client Review' : 'Flag for Client Review'}`;
                    btn.className = `btn ${newFlagged ? 'btn-warning' : 'btn-secondary'}`;
                }
            } catch(e) {
                alert(`❌ Error flagging conversation: ${e.message}`);
            }
        };

        window.ignoreConversation = async function(conversationId) {
            const conv = currentConversation;
            if (!conv || conv.id !== conversationId) return;
            const newIgnored = !conv.ignored;
            const coll = getConvCollection(conv);
            const msg = newIgnored
                ? 'Mark this conversation as ignored? It will be hidden from the main review page.'
                : 'Un-ignore this conversation? It will appear on the main review page again.';
            if (!confirm(msg)) return;
            try {
                const ignoreData = { ignored: newIgnored, lastMessageCountWhenIgnored: conv.messages.length };
                if (conversationId.startsWith('webhook_')) {
                    const { doc: docRef, setDoc } = window.clemailFirestore;
                    await setDoc(docRef(emailDB, 'conversation_category_overrides', conversationId), {
                        conversationId, bdrEmail: accountEmail, ...ignoreData,
                        updatedAt: new Date(), updatedBy: currentUserEmail
                    }, { merge: true });
                } else {
                    const resp = await fetch(`${RAILWAY_URL}/heyreach/inbox/update-conversation-category`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conversationId, collection: coll, ...ignoreData })
                    });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                }
                conv.ignored = newIgnored;
                alert(newIgnored ? '✅ Conversation ignored.' : '✅ Conversation un-ignored.');
            } catch(e) {
                alert(`❌ Error: ${e.message}`);
            }
        };

        // Admin: hide a single message
        window.adminHideMessage = async function(conversationId, msgIdx, convCollection) {
            if (!isAdmin) return;
            if (!confirm('Hide this message from view? (Admin only — reversible)')) return;
            const conv = currentConversation;
            if (!conv) return;
            const hidden = Array.isArray(conv.adminHiddenMessages) ? [...conv.adminHiddenMessages, msgIdx] : [msgIdx];
            try {
                const resp = await fetch(`${RAILWAY_URL}/heyreach/inbox/update-conversation-category`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conversationId, collection: convCollection, adminHiddenMessages: hidden })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                conv.adminHiddenMessages = hidden;
                const msgEl = document.querySelector(`[data-conversation-id="${conversationId}"] .messages-container .message:nth-child(${msgIdx + 1})`);
                if (msgEl) msgEl.remove();
            } catch(e) {
                alert(`❌ Error hiding message: ${e.message}`);
            }
        };

        // ── Quick Text Insert Modal ───────────────────────────────────────────

        window.showAddTextInsertModal = function(convId, encodedEmail) {
            _addQuickTextBdrEmail = resolveCanonicalBdrEmail(decodeURIComponent(encodedEmail));
            const modal = document.getElementById('addQuickTextModal');
            const badge = document.getElementById('addQuickTextBdrBadge');
            const badgeName = document.getElementById('addQuickTextBdrName');
            if (badgeName) badgeName.textContent = getBdrName(_addQuickTextBdrEmail) || _addQuickTextBdrEmail;
            if (badge) badge.style.display = 'block';
            document.getElementById('addQuickTextLabel').value = '';
            document.getElementById('addQuickTextContent').value = '';
            const status = document.getElementById('addQuickTextStatus');
            if (status) status.style.display = 'none';
            if (modal) modal.classList.add('open');
        };

        window.closeAddTextInsertModal = function() {
            const modal = document.getElementById('addQuickTextModal');
            if (modal) modal.classList.remove('open');
        };

        window.saveNewTextInsert = async function() {
            const label = document.getElementById('addQuickTextLabel')?.value.trim();
            const text = document.getElementById('addQuickTextContent')?.value.trim();
            const statusEl = document.getElementById('addQuickTextStatus');
            const saveBtn = document.getElementById('addQuickTextSaveBtn');
            if (!label || !text) {
                if (statusEl) { statusEl.style.cssText = 'display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:0.75rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;'; statusEl.textContent = '⚠️ Please fill in both the label and text.'; }
                return;
            }
            if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…'; }
            try {
                const email = _addQuickTextBdrEmail;
                let profile = bdrProfileCache.get(email?.toLowerCase()) || { linkedInUrl: '', calendarLink: '', textInserts: [] };
                profile = { ...profile, textInserts: [...(profile.textInserts || []), { label, text }] };
                const { doc: docRef, setDoc } = window.clemailFirestore;
                await setDoc(docRef(emailDB, 'contact_profiles', email.toLowerCase()), profile, { merge: true });
                bdrProfileCache.set(email.toLowerCase(), profile);
                if (statusEl) { statusEl.style.cssText = 'display:block;background:#f0fdf4;border:1px solid #86efac;color:#166634;padding:0.75rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;'; statusEl.textContent = '✅ Quick Text Insert saved!'; }
                setTimeout(() => {
                    closeAddTextInsertModal();
                    // Refresh the insert toolbar
                    if (currentConversation) {
                        const toolbar = document.getElementById(`insert-toolbar-${currentConversation.id}`);
                        if (toolbar) toolbar.outerHTML = buildInsertToolbar(currentConversation.id, email);
                    }
                }, 1200);
            } catch(e) {
                if (statusEl) { statusEl.style.cssText = 'display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:0.75rem 1rem;border-radius:8px;font-size:0.875rem;font-weight:600;margin-bottom:1rem;'; statusEl.textContent = `❌ Error: ${e.message}`; }
            } finally {
                if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Insert'; }
            }
        };

        // ── Screenshot ────────────────────────────────────────────────────────

        window.captureConversationScreenshot = async function(convId) {
            const btn = document.querySelector(`.reply-item[data-conversation-id="${convId}"] .btn-screenshot`);
            if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Capturing…'; }

            const replyItem = document.querySelector(`.reply-item[data-conversation-id="${convId}"]`);
            if (!replyItem) { if (btn) btn.innerHTML = '<i class="fas fa-camera"></i> Screenshot'; return; }

            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;width:720px;background:#ffffff;font-family:Inter,-apple-system,sans-serif;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.12)';

            const header = document.createElement('div');
            header.style.cssText = 'background:linear-gradient(135deg,#0d3b66,#1565c0);padding:1rem 1.25rem;';
            header.innerHTML = `<div style="color:white;font-size:0.7rem;font-weight:600;opacity:0.75;letter-spacing:0.05em;margin-bottom:0.25rem;">HEALTHLUMINATE · CONVERSATION SNAPSHOT</div><div style="color:white;font-size:0.8rem;opacity:0.9;">${new Date().toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' })}</div>`;
            wrapper.appendChild(header);

            const contactCard = replyItem.querySelector('.contact-card');
            if (contactCard) {
                const cc = contactCard.cloneNode(true);
                cc.style.cssText = (cc.getAttribute('style') || '') + ';margin:0;border-radius:0;border-bottom:2px solid #e2e8f0;';
                wrapper.appendChild(cc);
            }

            const sectionLabel = document.createElement('div');
            sectionLabel.style.cssText = 'padding:0.6rem 1.25rem;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:0.8rem;font-weight:700;color:#64748b;';
            sectionLabel.innerHTML = '<span style="color:#0F2D4D;">&#9679;</span> CONVERSATION HISTORY';
            wrapper.appendChild(sectionLabel);

            const mc = replyItem.querySelector('.messages-container');
            if (mc) {
                const mcClone = mc.cloneNode(true);
                mcClone.style.cssText = 'max-height:none;overflow:visible;padding:1rem 1.25rem;border:none;border-radius:0;background:white;';
                wrapper.appendChild(mcClone);
            }

            const footer = document.createElement('div');
            footer.style.cssText = 'background:#f1f5f9;padding:0.5rem 1.25rem;font-size:0.7rem;color:#94a3b8;text-align:right;border-top:1px solid #e2e8f0;';
            footer.textContent = 'Pando Executive Networking Connect · Conversation Lookup';
            wrapper.appendChild(footer);

            document.body.appendChild(wrapper);
            try {
                const canvas = await html2canvas(wrapper, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', logging: false });
                _screenshotDataUrl = canvas.toDataURL('image/png');
                const rawName = (replyItem.querySelector('.contact-name')?.textContent || 'contact').trim().replace(/\s+/g, '_').replace(/[^\w_-]/g, '');
                _screenshotFilename = `conversation_${rawName}_${new Date().toISOString().slice(0, 10)}.png`;
                const previewImg = document.getElementById('screenshotPreviewImg');
                if (previewImg) previewImg.src = _screenshotDataUrl;
                const modal = document.getElementById('screenshotPreviewModal');
                if (modal) modal.classList.add('open');
            } catch(e) {
                alert('Screenshot failed: ' + e.message);
            } finally {
                document.body.removeChild(wrapper);
                if (btn) btn.innerHTML = '<i class="fas fa-camera"></i> Screenshot';
            }
        };

        window.downloadScreenshot = function() {
            if (!_screenshotDataUrl) return;
            const link = document.createElement('a');
            link.download = _screenshotFilename;
            link.href = _screenshotDataUrl;
            link.click();
        };

        window.copyScreenshotToClipboard = async function() {
            const copyBtn = document.getElementById('screenshotCopyBtn');
            try {
                const blob = await (await fetch(_screenshotDataUrl)).blob();
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                if (copyBtn) { const orig = copyBtn.innerHTML; copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!'; setTimeout(() => { copyBtn.innerHTML = orig; }, 2000); }
            } catch(e) {
                alert('Copy to clipboard is not supported in this browser. Please use Download instead.');
            }
        };

        window.closeScreenshotModal = function() {
            document.getElementById('screenshotPreviewModal')?.classList.remove('open');
        };

        // ── Auth ──────────────────────────────────────────────────────────────

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserEmail = user.email.toLowerCase();
                isAdmin = checkIfAdmin(user.email);
                accountEmail = currentUserEmail;
                viewingBdrEmail = currentUserEmail;

                // Viewer passthrough
                if (!isAdmin && window.resolveViewerBDR) {
                    const viewerBDR = await window.resolveViewerBDR(currentUserEmail);
                    if (viewerBDR) {
                        viewingBdrEmail = viewerBDR.email.toLowerCase();
                        accountEmail = viewerBDR.email.toLowerCase();
                    }
                }

                // Own BDR resolution: use UID-first matching so rebranded logins
                // (login email differs from stored primaryEmail) still load the right data.
                if (!isAdmin && accountEmail === currentUserEmail && window.resolveOwnBDR) {
                    const ownBDR = await window.resolveOwnBDR(user);
                    if (ownBDR && ownBDR.primaryEmail && ownBDR.primaryEmail.toLowerCase() !== currentUserEmail) {
                        viewingBdrEmail = ownBDR.primaryEmail.toLowerCase();
                        accountEmail = ownBDR.primaryEmail.toLowerCase();
                        console.log(`🔗 BDR email resolved via UID: using ${accountEmail} for data queries`);
                    }
                }

                await Promise.all([
                    loadLinkedInEmailAssociations(),
                    loadLinkedInAccountIdMapping(),
                    loadAllBDRs(),
                ]);

                // Pre-load the current user's BDR profile
                await loadBdrProfile(accountEmail);

                // Show the empty search state
                document.getElementById('resultsArea').innerHTML = `
                    <div class="search-card">
                        <div class="empty-state" style="padding:2rem 1rem;">
                            <i class="fas fa-search" style="font-size:2.5rem;color:#94a3b8;display:block;margin-bottom:0.75rem;"></i>
                            <h3>Enter a name, LinkedIn URL, or ID above to find a conversation</h3>
                            <p>You can search by contact name, paste a LinkedIn profile URL, or enter a specific conversation ID.</p>
                        </div>
                    </div>`;

                document.getElementById('searchInput').focus();
            } else {
                const authState = window.getCurrentAuthState?.();
                if (authState?.isLoggedIn) return;
                window.location.href = '../login.html';
            }
        });
    </script>
