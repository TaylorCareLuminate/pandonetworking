<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Classification Diagnostic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }
        h1 { font-size: 1.4rem; margin: 0 0 4px; color: #1d4ed8; }
        .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }

        .search-bar {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
        .field label { font-size: 0.78rem; font-weight: 600; color: #374151; }
        .field input {
            padding: 9px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus { border-color: #3b82f6; }
        button.search-btn {
            padding: 9px 22px;
            background: #1d4ed8;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }
        button.search-btn:hover { background: #1e40af; }
        button.search-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Classification verdict banner */
        .verdict {
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .verdict.hl     { background: #dbeafe; color: #1d4ed8; border-left: 5px solid #3b82f6; }
        .verdict.already{ background: #fef9c3; color: #92400e; border-left: 5px solid #f59e0b; }
        .verdict.neither{ background: #f1f5f9; color: #64748b; border-left: 5px solid #cbd5e1; }
        .verdict.error  { background: #fee2e2; color: #b91c1c; border-left: 5px solid #ef4444; }

        /* Step cards */
        .steps { display: flex; flex-direction: column; gap: 14px; }
        .step {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
        }
        .step-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }
        .step-header .step-num {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #374151;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .step-header.pass  { background: #f0fdf4; } .step-header.pass  .step-num { background: #bbf7d0; color: #166534; }
        .step-header.fail  { background: #fff7ed; } .step-header.fail  .step-num { background: #fed7aa; color: #9a3412; }
        .step-header.warn  { background: #fefce8; } .step-header.warn  .step-num { background: #fef08a; color: #713f12; }
        .step-header.info  { background: #f0f9ff; } .step-header.info  .step-num { background: #bae6fd; color: #075985; }
        .step-header.idle  { background: #f8fafc; }
        .step-status { margin-left: auto; font-size: 0.75rem; padding: 2px 8px; border-radius: 20px; }
        .pass .step-status  { background: #dcfce7; color: #15803d; }
        .fail .step-status  { background: #fee2e2; color: #b91c1c; }
        .warn .step-status  { background: #fef9c3; color: #92400e; }
        .info .step-status  { background: #dbeafe; color: #1d4ed8; }
        .step-body { padding: 14px 16px; border-top: 1px solid #f1f5f9; }

        /* URL comparison table */
        .url-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .url-table th { background: #f8fafc; padding: 7px 10px; text-align: left; font-weight: 700; border-bottom: 1.5px solid #e2e8f0; }
        .url-table td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        .url-table tr:last-child td { border-bottom: none; }
        .url-match  { color: #15803d; font-weight: 700; }
        .url-no-match { color: #b91c1c; }
        .url-missing { color: #9ca3af; font-style: italic; }

        .raw-json {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 7px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 0.78rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 320px;
            overflow-y: auto;
            margin: 0;
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .pill-green  { background: #dcfce7; color: #15803d; }
        .pill-red    { background: #fee2e2; color: #b91c1c; }
        .pill-yellow { background: #fef9c3; color: #92400e; }
        .pill-blue   { background: #dbeafe; color: #1d4ed8; }
        .pill-gray   { background: #f1f5f9; color: #64748b; }

        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #94a3b8;
            margin: 12px 0 6px;
        }
        .kv-row { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; font-size: 0.83rem; }
        .kv-key { color: #64748b; min-width: 180px; font-size: 0.78rem; }
        .kv-val { color: #1e293b; font-weight: 600; word-break: break-all; }

        .chevron { margin-left: auto; transition: transform 0.2s; }
        .step.collapsed .step-body { display: none; }
        .step.collapsed .chevron { transform: rotate(-90deg); }

        #loadingBar {
            display: none;
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .highlight-box {
            background: #fffbeb;
            border: 1.5px solid #fbbf24;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 0.83rem;
        }
        .highlight-box strong { color: #92400e; }
    </style>
</head>
<body>

<h1><i class="fas fa-search-plus" style="margin-right:8px;"></i>Contact Classification Diagnostic</h1>
<p class="subtitle">Search for a specific contact across all HeyReach/HealthLuminate data sources to diagnose classification issues (HL vs Already Connected).</p>

<div class="search-bar">
    <div class="field">
        <label>BDR Email</label>
        <input type="email" id="bdrEmail" placeholder="e.g. bob.young@company.com" value="">
    </div>
    <div class="field">
        <label>Contact Name (first, last, or full)</label>
        <input type="text" id="contactName" placeholder="e.g. Garrett Young" value="Garrett Young">
    </div>
    <div class="field" style="max-width:260px;">
        <label>Contact Company (optional)</label>
        <input type="text" id="contactCompany" placeholder="e.g. OneOncology" value="OneOncology">
    </div>
    <button class="search-btn" id="searchBtn" onclick="runDiagnostic()">
        <i class="fas fa-search"></i> Run Diagnostic
    </button>
</div>

<div id="loadingBar"><i class="fas fa-spinner fa-spin"></i> Loading data from all sources…</div>
<div id="results"></div>

<script src="../js/auth.js"></script>
<script src="../js/clemail-firestore-wrapper.js"></script>
<script type="module">
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

    const { collection, getDocs, query, where, limit: limitFn, orderBy } = window.clemailFirestore;
    const db = window.clemailDb;

    await window.firebaseReady;
    const auth = window.auth;

    // Prefill BDR from auth context if we can
    onAuthStateChanged(auth, user => {
        if (user && !document.getElementById('bdrEmail').value) {
            document.getElementById('bdrEmail').value = user.email || '';
        }
    });

    // ── helpers ─────────────────────────────────────────────────────────────
    const normalizeUrl = url => (url || '').toLowerCase().trim()
        .replace(/\/$/, '').replace(/^https?:\/\//i, '').replace(/^www\./i, '');

    function esc(s) {
        if (!s && s !== 0) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function pill(text, cls) { return `<span class="pill pill-${cls}">${esc(text)}</span>`; }

    function jsonBlock(obj) {
        return `<pre class="raw-json">${esc(JSON.stringify(obj, null, 2))}</pre>`;
    }

    function nameMatches(fullName, search) {
        if (!fullName || !search) return false;
        const fn = fullName.toLowerCase();
        const parts = search.toLowerCase().split(/\s+/).filter(Boolean);
        return parts.every(p => fn.includes(p));
    }

    function companyMatches(company, search) {
        if (!company || !search) return false;
        return company.toLowerCase().includes(search.toLowerCase());
    }

    function toggle(el) {
        el.closest('.step').classList.toggle('collapsed');
    }

    // ── main diagnostic ─────────────────────────────────────────────────────
    window.runDiagnostic = async function() {
        const bdrEmail    = document.getElementById('bdrEmail').value.trim();
        const contactName = document.getElementById('contactName').value.trim();
        const contactCo   = document.getElementById('contactCompany').value.trim();

        if (!bdrEmail || !contactName) {
            alert('Please enter both a BDR email and a contact name.');
            return;
        }

        document.getElementById('searchBtn').disabled = true;
        document.getElementById('results').innerHTML   = '';
        document.getElementById('loadingBar').style.display = 'block';

        try {
            await doSearch(bdrEmail, contactName, contactCo);
        } catch(e) {
            document.getElementById('results').innerHTML =
                `<div class="verdict error"><i class="fas fa-exclamation-circle"></i> Fatal error: ${esc(e.message)}</div>`;
            console.error(e);
        } finally {
            document.getElementById('searchBtn').disabled  = false;
            document.getElementById('loadingBar').style.display = 'none';
        }
    };

    async function doSearch(bdrEmailInput, contactName, contactCo) {
        const sections = [];

        // ─── Step 0: BDR emails + account IDs ───────────────────────────────────
        const emailsToQuery = [bdrEmailInput.toLowerCase()];
        const liAccountIdMap = new Map(); // String(heyreachAccountId) → bdrEmail lower

        // a) bdr_leaders extra emails
        let bdrLeaderDoc = null;
        try {
            const snap = await getDocs(query(
                collection(db, 'bdr_leaders'),
                where('primaryEmail', '==', bdrEmailInput)
            )).catch(() => null)
            || await getDocs(query(
                collection(db, 'bdr_leaders'),
                where('email', '==', bdrEmailInput)
            )).catch(() => null);

            if (snap && snap.size > 0) {
                bdrLeaderDoc = snap.docs[0].data();
                ['linkedInEmail','heyreachEmail','personalEmail','email'].forEach(f => {
                    const v = (bdrLeaderDoc[f] || '').toLowerCase();
                    if (v && !emailsToQuery.includes(v)) emailsToQuery.push(v);
                });
            }
        } catch(e) {}

        // b) linkedin_email_associations
        try {
            const assocSnap = await getDocs(collection(db, 'linkedin_email_associations'));
            assocSnap.docs.forEach(d => {
                const data = d.data();
                const liEmail = (data.linkedInEmail || '').toLowerCase();
                if (!liEmail) return;
                const authMatch    = (data.authEmail    || '').toLowerCase() === bdrEmailInput.toLowerCase();
                const primaryMatch = (data.primaryEmail || '').toLowerCase() === bdrEmailInput.toLowerCase();
                if ((authMatch || primaryMatch) && !emailsToQuery.includes(liEmail)) {
                    emailsToQuery.push(liEmail);
                }
            });
        } catch(e) {}

        // c) linkedin_accounts → heyreachAccountId map
        let liAccountsDocs = [];
        try {
            const liAccSnap = await getDocs(collection(db, 'linkedin_accounts'));
            liAccSnap.docs.forEach(d => {
                const data = d.data();
                const hrid  = data.heyreachAccountId || data.linkedInAccountId || data.accountId;
                const email = (data.bdrEmail || data.accountEmail || '').toLowerCase();
                if (hrid && email) {
                    liAccountIdMap.set(String(hrid), email);
                    if (emailsToQuery.includes(email)) liAccountsDocs.push({ id: d.id, ...data });
                }
            });
        } catch(e) {}

        const emailSet = new Set(emailsToQuery);
        const bdrDiagHtml = `
            <div class="section-label">BDR Identity</div>
            <div class="kv-row"><span class="kv-key">Input email:</span><span class="kv-val">${esc(bdrEmailInput)}</span></div>
            <div class="kv-row"><span class="kv-key">All resolved emails:</span><span class="kv-val">${emailsToQuery.map(e=>`<code>${esc(e)}</code>`).join(', ')}</span></div>
            <div class="kv-row"><span class="kv-key">HeyReach account IDs:</span><span class="kv-val">${liAccountsDocs.length > 0 ? liAccountsDocs.map(d=>`${esc(String(d.heyreachAccountId||d.linkedInAccountId||d.accountId))} → ${esc(d.bdrEmail||d.accountEmail)}`).join(', ') : pill('None found','red')}</span></div>
            ${bdrLeaderDoc ? `<div class="kv-row"><span class="kv-key">BDR name:</span><span class="kv-val">${esc(bdrLeaderDoc.name || '—')}</span></div>` : '<div style="color:#b91c1c;font-size:0.82rem;margin-top:6px;">⚠️ No bdr_leaders doc found for this email.</div>'}
        `;
        sections.push(makeStep(0, 'info', 'BDR Identity & Email Resolution', bdrDiagHtml, liAccountsDocs.length > 0 ? 'Accounts Found' : 'No Accts'));

        // ─── Step 1: prospect_contacts ───────────────────────────────────────────
        let contactDoc = null;
        let contactNormUrl = null;
        try {
            for (const email of emailsToQuery) {
                for (const field of ['bdrEmail','userEmail','linkedInAccountEmail','accountEmail']) {
                    const snap = await getDocs(query(
                        collection(db, 'prospect_contacts'),
                        where(field, '==', email)
                    )).catch(() => null);
                    if (!snap) continue;
                    const match = snap.docs.find(d => {
                        const data = d.data();
                        const fullName = `${data.firstName||data.first_name||''} ${data.lastName||data.last_name||''}`.trim();
                        const nameOk   = nameMatches(fullName, contactName);
                        const coOk     = !contactCo || companyMatches(data.company || '', contactCo);
                        return nameOk && coOk;
                    });
                    if (match) { contactDoc = { id: match.id, ...match.data() }; break; }
                }
                if (contactDoc) break;
            }
        } catch(e) {}

        if (contactDoc) {
            contactNormUrl = normalizeUrl(contactDoc.linkedInUrl || contactDoc.linkedin_url || contactDoc.profileUrl || '');
        }

        const contactHtml = contactDoc ? `
            <div class="kv-row"><span class="kv-key">Doc ID:</span><span class="kv-val"><code>${esc(contactDoc.id)}</code></span></div>
            <div class="kv-row"><span class="kv-key">Name:</span><span class="kv-val">${esc([contactDoc.firstName||contactDoc.first_name, contactDoc.lastName||contactDoc.last_name].filter(Boolean).join(' '))}</span></div>
            <div class="kv-row"><span class="kv-key">Company:</span><span class="kv-val">${esc(contactDoc.company)}</span></div>
            <div class="kv-row"><span class="kv-key">Raw LinkedIn URL:</span><span class="kv-val"><code>${esc(contactDoc.linkedInUrl||contactDoc.linkedin_url||contactDoc.profileUrl||'—')}</code></span></div>
            <div class="kv-row"><span class="kv-key">Normalized URL:</span><span class="kv-val"><code>${esc(contactNormUrl||'—')}</code></span></div>
            <div class="section-label" style="margin-top:12px;">Raw Document</div>
            ${jsonBlock(contactDoc)}
        ` : `<div class="url-missing">No matching prospect_contact found for "${esc(contactName)}"${contactCo ? ` @ ${esc(contactCo)}` : ''}.</div>`;

        sections.push(makeStep(1, contactDoc ? 'pass' : 'fail',
            `prospect_contacts — base contact record`,
            contactHtml, contactDoc ? 'Found' : 'NOT FOUND'));

        // ─── Step 2: connect_queue ───────────────────────────────────────────────
        let cqDoc = null;
        try {
            for (const email of emailsToQuery) {
                const snap = await getDocs(query(
                    collection(db, 'connect_queue'),
                    where('account_email', '==', email)
                )).catch(() => null);
                if (!snap) continue;
                const match = snap.docs.find(d => {
                    const data = d.data();
                    const fullName = `${data.firstName||data.first_name||data.first||''} ${data.lastName||data.last_name||data.last||''}`.trim();
                    const coName   = data.company || data.companyName || '';
                    const nameOk   = nameMatches(fullName, contactName) || nameMatches(data.name || '', contactName);
                    const coOk     = !contactCo || companyMatches(coName, contactCo);
                    return nameOk && coOk;
                });
                if (match) { cqDoc = { id: match.id, ...match.data() }; break; }
            }
        } catch(e) {}

        const cqRawUrl  = cqDoc ? (cqDoc.prospect_li_url || cqDoc.contact_linkedin_url || cqDoc.linkedin_url || '') : null;
        const cqNormUrl = cqDoc ? normalizeUrl(cqRawUrl) : null;
        const cqPushed  = cqDoc ? (cqDoc.pushed_to_heyreach === true) : false;

        const cqHtml = cqDoc ? `
            <div class="kv-row"><span class="kv-key">Doc ID:</span><span class="kv-val"><code>${esc(cqDoc.id)}</code></span></div>
            <div class="kv-row"><span class="kv-key">pushed_to_heyreach:</span><span class="kv-val">${cqPushed ? pill('TRUE — HL sent this invite','green') : pill('FALSE — NOT sent by HL','red')}</span></div>
            <div class="kv-row"><span class="kv-key">Raw LinkedIn URL:</span><span class="kv-val"><code>${esc(cqRawUrl||'—')}</code></span></div>
            <div class="kv-row"><span class="kv-key">Normalized URL:</span><span class="kv-val"><code>${esc(cqNormUrl||'—')}</code></span></div>
            <div class="section-label" style="margin-top:12px;">Raw Document</div>
            ${jsonBlock(cqDoc)}
        ` : `<div class="url-missing">No matching connect_queue record found.${contactNormUrl ? `<br>Searched by email + name. Contact prospect URL from Step 1: <code>${esc(contactNormUrl)}</code>` : ''}</div>`;

        sections.push(makeStep(2, cqDoc ? (cqPushed ? 'pass' : 'warn') : 'fail',
            `connect_queue — was HL the initiator?`,
            cqHtml, cqDoc ? (cqPushed ? 'HL Initiated' : 'Not Pushed') : 'NOT FOUND'));

        // Build hlSentUrls set equivalent for this contact
        const isInHLSent = cqNormUrl ? true : false;

        // ─── Step 3: heyreach_activity (CONNECTION_REQUEST_ACCEPTED) ────────────
        let actDoc = null;
        let actNormUrl = null;
        try {
            const actSnap = await getDocs(query(
                collection(db, 'heyreach_activity'),
                where('eventType', '==', 'CONNECTION_REQUEST_ACCEPTED'),
                limitFn(10000)
            )).catch(() => null);
            if (actSnap) {
                actDoc = actSnap.docs.find(d => {
                    const data = d.data();
                    // BDR match
                    let bdrMatch = (data.bdrEmail && emailSet.has(data.bdrEmail.toLowerCase()))
                        || (data.accountEmail && emailSet.has(data.accountEmail.toLowerCase()))
                        || (data.linkedInAccountEmail && emailSet.has(data.linkedInAccountEmail.toLowerCase()));
                    if (!bdrMatch && data.linkedInAccountId) {
                        const mapped = liAccountIdMap.get(String(data.linkedInAccountId));
                        if (mapped && emailSet.has(mapped)) bdrMatch = true;
                    }
                    if (!bdrMatch) return false;

                    // Contact match by name or URL
                    const fullName = `${data.leadFirstName||data.firstName||''} ${data.leadLastName||data.lastName||''}`.trim();
                    const nameOk   = nameMatches(fullName, contactName) || nameMatches(data.leadName || data.name || '', contactName);
                    const url      = normalizeUrl(data.leadProfileUrl || '');
                    const urlOk    = contactNormUrl && url && url === contactNormUrl;
                    const coOk     = !contactCo || companyMatches(data.leadCompany || data.company || '', contactCo);
                    return (nameOk || urlOk) && coOk;
                }) || null;
                if (actDoc) actDoc = { id: actDoc.id, ...actDoc.data() };
            }
        } catch(e) {}

        actNormUrl = actDoc ? normalizeUrl(actDoc.leadProfileUrl || '') : null;

        // URL match check: does actNormUrl match cqNormUrl?
        const actUrlMatchesCQ = actNormUrl && cqNormUrl && actNormUrl === cqNormUrl;
        const actUrlMatchesContact = actNormUrl && contactNormUrl && actNormUrl === contactNormUrl;

        const actHtml = actDoc ? `
            <div class="kv-row"><span class="kv-key">Doc ID:</span><span class="kv-val"><code>${esc(actDoc.id)}</code></span></div>
            <div class="kv-row"><span class="kv-key">eventType:</span><span class="kv-val">${pill(actDoc.eventType,'green')}</span></div>
            <div class="kv-row"><span class="kv-key">Raw leadProfileUrl:</span><span class="kv-val"><code>${esc(actDoc.leadProfileUrl||'—')}</code></span></div>
            <div class="kv-row"><span class="kv-key">Normalized activityUrl:</span><span class="kv-val"><code>${esc(actNormUrl||'—')}</code></span></div>
            <div class="kv-row"><span class="kv-key">Matches connect_queue URL?</span><span class="kv-val">${actUrlMatchesCQ ? pill('✓ YES — same URL','green') : pill('✗ NO — URL MISMATCH','red')}</span></div>
            ${!actUrlMatchesCQ && cqNormUrl ? `
            <div class="highlight-box" style="margin-top:8px;">
                <strong>⚠️ URL Mismatch Detected!</strong><br>
                connect_queue URL: <code>${esc(cqNormUrl)}</code><br>
                heyreach_activity URL: <code>${esc(actNormUrl)}</code><br>
                This mismatch causes the contact to fall out of <code>hlAcceptedUrls</code> even though HL sent the invite.
            </div>` : ''}
            <div class="section-label" style="margin-top:12px;">Raw Document</div>
            ${jsonBlock(actDoc)}
        ` : `
            <div class="url-missing">No CONNECTION_REQUEST_ACCEPTED event found for this contact for this BDR.</div>
            ${cqNormUrl ? `<div style="margin-top:8px;font-size:0.82rem;">Expected URL (from connect_queue): <code>${esc(cqNormUrl)}</code></div>` : ''}
        `;

        sections.push(makeStep(3, actDoc ? (actUrlMatchesCQ ? 'pass' : 'warn') : 'fail',
            `heyreach_activity — connection accepted event`,
            actHtml, actDoc ? (actUrlMatchesCQ ? 'URL Matches' : '⚠ URL Mismatch') : 'NOT FOUND'));

        // ─── Step 4: heyreach_contacts (current connection) ─────────────────────
        let hcDoc = null;
        let hcNormUrl = null;
        try {
            for (const email of emailsToQuery) {
                const snap = await getDocs(query(
                    collection(db, 'heyreach_contacts'),
                    where('accountEmail', '==', email)
                )).catch(() => null);
                if (!snap) continue;
                const match = snap.docs.find(d => {
                    const data = d.data();
                    const fullName = data.fullName || `${data.firstName||''} ${data.lastName||''}`.trim();
                    const nameOk   = nameMatches(fullName, contactName);
                    const coOk     = !contactCo || companyMatches(data.companyName || data.company || '', contactCo);
                    return nameOk && coOk;
                });
                if (match) { hcDoc = { id: match.id, ...match.data() }; break; }
            }
        } catch(e) {}

        hcNormUrl = hcDoc ? normalizeUrl(hcDoc.profileUrl || hcDoc.linkedInUrl || '') : null;
        const hcUrlMatchesAct = hcNormUrl && actNormUrl && hcNormUrl === actNormUrl;
        const hcUrlMatchesCQ  = hcNormUrl && cqNormUrl  && hcNormUrl === cqNormUrl;
        // This is the key check: is hcUrl in hlAcceptedUrls?
        // hlAcceptedUrls = intersection of hlSentUrls and allAcceptedUrls
        // hlSentUrls uses cqNormUrl, allAcceptedUrls uses actNormUrl
        // So hlAcceptedUrls contains actNormUrl IFF actNormUrl === cqNormUrl
        // NEW CORRECT LOGIC: hlAcceptedUrls = allAcceptedUrls (all HeyReach acceptances = HL-initiated)
        // connect_queue is NOT required — contacts can be added to HeyReach campaigns directly.
        const hcIsInHLAccepted = hcNormUrl && actNormUrl && hcNormUrl === actNormUrl;
        const hcIsAlreadyConn  = hcDoc && !hcIsInHLAccepted;

        const hcHtml = hcDoc ? `
            <div class="kv-row"><span class="kv-key">Doc ID:</span><span class="kv-val"><code>${esc(hcDoc.id)}</code></span></div>
            <div class="kv-row"><span class="kv-key">Full Name:</span><span class="kv-val">${esc(hcDoc.fullName || `${hcDoc.firstName||''} ${hcDoc.lastName||''}`.trim())}</span></div>
            <div class="kv-row"><span class="kv-key">Company:</span><span class="kv-val">${esc(hcDoc.companyName || hcDoc.company)}</span></div>
            <div class="kv-row"><span class="kv-key">Raw profileUrl:</span><span class="kv-val"><code>${esc(hcDoc.profileUrl||hcDoc.linkedInUrl||'—')}</code></span></div>
            <div class="kv-row"><span class="kv-key">Normalized URL:</span><span class="kv-val"><code>${esc(hcNormUrl||'—')}</code></span></div>
            <div class="kv-row"><span class="kv-key">URL matches heyreach_activity?</span><span class="kv-val">${hcUrlMatchesAct ? pill('✓ YES','green') : pill('✗ NO','red')}</span></div>
            <div class="kv-row"><span class="kv-key">URL matches connect_queue?</span><span class="kv-val">${hcUrlMatchesCQ ? pill('✓ YES','green') : pill('✗ NO','red')}</span></div>
            <div class="kv-row"><span class="kv-key">→ Classification:</span><span class="kv-val">${hcIsInHLAccepted ? pill('HL Connected ✓ (heyreach_activity confirmed)','green') : pill('Already Connected (no heyreach_activity acceptance found)','yellow')}</span></div>
            <div class="section-label" style="margin-top:12px;">Raw Document</div>
            ${jsonBlock(hcDoc)}
        ` : `<div class="url-missing">No heyreach_contacts record found (contact may not be a current LinkedIn connection for this BDR's account).</div>`;

        sections.push(makeStep(4, hcDoc ? (hcIsInHLAccepted ? 'pass' : 'warn') : 'fail',
            `heyreach_contacts — current LinkedIn connection`,
            hcHtml, hcDoc ? (hcIsInHLAccepted ? 'HL Connected ✓' : 'Already Connected') : 'NOT FOUND'));

        // ─── Step 5: heyreach_inbox conversations ───────────────────────────────
        let inboxDocs = [];
        try {
            for (const email of emailsToQuery) {
                for (const field of ['accountEmail','bdrEmail','linkedInAccountEmail']) {
                    const snap = await getDocs(query(
                        collection(db, 'heyreach_inbox'),
                        where(field, '==', email)
                    )).catch(() => null);
                    if (!snap) continue;
                    snap.docs.forEach(d => {
                        const data = d.data();
                        const correspondent = data.rawData?.correspondentProfile || {};
                        const fullName = correspondent.firstName
                            ? `${correspondent.firstName} ${correspondent.lastName||''}`.trim()
                            : `${data.leadFirstName||''} ${data.leadLastName||''}`.trim();
                        const coName   = data.companyName || data.leadCompany || correspondent.companyName || '';
                        const nameOk   = nameMatches(fullName, contactName) || nameMatches(data.leadName || '', contactName);
                        const coOk     = !contactCo || companyMatches(coName, contactCo);
                        if ((nameOk || coOk) && !inboxDocs.find(x => x.id === d.id)) {
                            inboxDocs.push({ id: d.id, ...data });
                        }
                    });
                }
                if (inboxDocs.length) break;
            }
        } catch(e) {}

        const inboxHtml = inboxDocs.length > 0 ? inboxDocs.map(doc => {
            const correspondent = doc.rawData?.correspondentProfile || {};
            const msgs = doc.rawData?.messages || doc.messages || [];
            const hasReply = msgs.some(m => m.sender === 'CORRESPONDENT' || m.sender === 'lead');
            const inboxUrl = normalizeUrl(doc.leadProfileUrl || correspondent.profileUrl || '');
            const urlMatchesHC  = hcNormUrl  && inboxUrl && inboxUrl === hcNormUrl;
            const urlMatchesCQ  = cqNormUrl  && inboxUrl && inboxUrl === cqNormUrl;
            return `
                <div style="border:1px solid #e2e8f0;border-radius:7px;padding:10px 12px;margin-bottom:8px;">
                    <div class="kv-row"><span class="kv-key">Conversation ID:</span><span class="kv-val"><code>${esc(doc.conversationId||doc.id)}</code></span></div>
                    <div class="kv-row"><span class="kv-key">Lead profileUrl:</span><span class="kv-val"><code>${esc(doc.leadProfileUrl||correspondent.profileUrl||'—')}</code></span></div>
                    <div class="kv-row"><span class="kv-key">Normalized:</span><span class="kv-val"><code>${esc(inboxUrl||'—')}</code></span></div>
                    <div class="kv-row"><span class="kv-key">Has reply from contact?</span><span class="kv-val">${hasReply ? pill('YES — has reply','green') : pill('No reply yet','gray')}</span></div>
                    <div class="kv-row"><span class="kv-key">URL matches heyreach_contacts?</span><span class="kv-val">${urlMatchesHC ? pill('✓ YES','green') : pill('✗ NO','red')}</span></div>
                    <div class="kv-row"><span class="kv-key">URL matches connect_queue?</span><span class="kv-val">${urlMatchesCQ ? pill('✓ YES','green') : pill('✗ NO','red')}</span></div>
                    <div class="section-label" style="margin-top:10px;">Messages (${msgs.length})</div>
                    ${msgs.slice(0,5).map(m=>`<div style="font-size:0.78rem;padding:3px 0;border-bottom:1px solid #f1f5f9;"><strong>${esc(m.sender)}:</strong> ${esc((m.text||m.message||'').slice(0,120))}${(m.text||m.message||'').length>120?'…':''}</div>`).join('')}
                    ${msgs.length > 5 ? `<div style="font-size:0.75rem;color:#94a3b8;margin-top:4px;">… and ${msgs.length-5} more messages</div>` : ''}
                </div>`;
        }).join('') : `<div class="url-missing">No inbox conversation found for this contact.</div>`;

        sections.push(makeStep(5, inboxDocs.length > 0 ? 'pass' : 'info',
            `heyreach_inbox — conversations`,
            inboxHtml, inboxDocs.length > 0 ? `${inboxDocs.length} Conversation(s)` : 'None'));

        // ─── URL Comparison Summary ──────────────────────────────────────────────
        const urlRows = [
            { source: 'prospect_contacts',           url: contactNormUrl, raw: contactDoc ? (contactDoc.linkedInUrl||contactDoc.linkedin_url||contactDoc.profileUrl||'—') : '—' },
            { source: 'connect_queue',               url: cqNormUrl,      raw: cqDoc ? cqRawUrl : '—' },
            { source: 'heyreach_activity (accepted)',url: actNormUrl,     raw: actDoc ? (actDoc.leadProfileUrl||'—') : '—' },
            { source: 'heyreach_contacts',           url: hcNormUrl,      raw: hcDoc ? (hcDoc.profileUrl||hcDoc.linkedInUrl||'—') : '—' },
            { source: 'heyreach_inbox',              url: inboxDocs[0] ? normalizeUrl(inboxDocs[0].leadProfileUrl || inboxDocs[0].rawData?.correspondentProfile?.profileUrl || '') : null,
                                                     raw: inboxDocs[0] ? (inboxDocs[0].leadProfileUrl || inboxDocs[0].rawData?.correspondentProfile?.profileUrl || '—') : '—' },
        ];

        // Reference URL for comparison: use heyreach_contacts or activity as reference
        const refUrl = hcNormUrl || actNormUrl || cqNormUrl;
        const urlTableHtml = `
            <table class="url-table">
                <thead><tr><th>Source</th><th>Raw URL</th><th>Normalized URL</th><th>Match?</th></tr></thead>
                <tbody>
                    ${urlRows.map(r => {
                        if (!r.url && !r.raw) return `<tr><td>${esc(r.source)}</td><td colspan="3" class="url-missing">Not found</td></tr>`;
                        const match = refUrl && r.url && r.url === refUrl;
                        const notFound = !r.url;
                        return `<tr>
                            <td>${esc(r.source)}</td>
                            <td><code style="font-size:0.75rem;">${esc(r.raw)}</code></td>
                            <td><code style="font-size:0.75rem;">${esc(r.url||'—')}</code></td>
                            <td>${notFound ? `<span class="url-missing">—</span>` : match ? `<span class="url-match">✓</span>` : `<span class="url-no-match">✗ MISMATCH</span>`}</td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
            <div style="font-size:0.78rem;color:#64748b;margin-top:6px;">Reference URL for comparison: <code>${esc(refUrl||'N/A')}</code></div>
        `;
        sections.push(makeStep('★', 'info', 'URL Comparison Across All Sources', urlTableHtml, 'Summary'));

        // ─── Build overall verdict (using corrected logic: heyreach_activity = truth source) ────
        let verdictClass = 'neither', verdictText = '';
        if (hcIsInHLAccepted) {
            // heyreach_contacts URL matches heyreach_activity accepted URL → definitively HL Connected
            verdictClass = 'hl';
            verdictText = `<i class="fas fa-bolt"></i> <strong>HL Connected ✓</strong> — heyreach_activity shows a CONNECTION_REQUEST_ACCEPTED event for this contact under this BDR's HeyReach account. HeyReach is the HealthLuminate tool, so this is an HL-initiated connection.
                ${!cqDoc ? `<br><small style="opacity:0.8;">Note: No connect_queue record found — the contact was added to the HeyReach campaign directly (not via the HL queue system). This is expected for some campaigns.</small>` : ''}`;
        } else if (!actDoc) {
            // No heyreach_activity record at all
            verdictClass = 'already';
            if (!hcDoc) {
                verdictText = `<i class="fas fa-question-circle"></i> <strong>Contact Not Found</strong> — No records found in heyreach_activity or heyreach_contacts for this BDR. The contact may not exist or may be associated with a different BDR email.`;
            } else {
                verdictText = `<i class="fas fa-link"></i> <strong>Already Connected</strong> — Contact is in heyreach_contacts (current LinkedIn connection) but has NO CONNECTION_REQUEST_ACCEPTED event in heyreach_activity. This means the connection pre-dates HeyReach or was made outside of HeyReach entirely.`;
            }
        } else if (!hcDoc) {
            // Activity found but not in heyreach_contacts yet
            verdictClass = 'hl';
            verdictText = `<i class="fas fa-bolt"></i> <strong>HL Connected (pending sync)</strong> — CONNECTION_REQUEST_ACCEPTED event found in heyreach_activity, but contact not yet in heyreach_contacts. The HeyReach sync may not have run yet.`;
        } else if (hcNormUrl && actNormUrl && hcNormUrl !== actNormUrl) {
            verdictClass = 'warn';
            verdictText = `<i class="fas fa-unlink"></i> <strong>URL Mismatch between heyreach_contacts and heyreach_activity</strong><br>
                heyreach_contacts URL: <code>${esc(hcNormUrl)}</code><br>
                heyreach_activity URL: <code>${esc(actNormUrl)}</code><br>
                These are different contacts or a profile URL change. Review the raw docs above.`;
        } else {
            verdictClass = 'already';
            verdictText = `<i class="fas fa-link"></i> <strong>Already Connected</strong> — Classification chain is broken somewhere. Review the URL comparison table and step details above.`;
        }

        const html = `
            <div class="verdict ${verdictClass}">${verdictText}</div>
            <div class="steps">${sections.join('')}</div>`;
        document.getElementById('results').innerHTML = html;

        // Add collapse toggle behavior
        document.querySelectorAll('.step-header').forEach(h => {
            h.addEventListener('click', () => toggle(h));
        });
    }

    function makeStep(num, cls, title, body, status) {
        return `
        <div class="step">
            <div class="step-header ${cls}" onclick="this.closest('.step').classList.toggle('collapsed')">
                <div class="step-num">${num}</div>
                <span>${esc(title)}</span>
                <span class="step-status">${esc(status)}</span>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
            <div class="step-body">${body}</div>
        </div>`;
    }

</script>
</body>
</html>
