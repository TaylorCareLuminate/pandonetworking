<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleanup Jobs - Job Management & Reporting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PandoConnect Common Header -->
    <script src="healthconnect-header.js?v=3.3" defer></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #5E7C5B 0%, #0F2D4D 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #5E7C5B 0%, #0F2D4D 100%);
            color: white;
            padding: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .content {
            padding: 32px;
        }

        .section {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 20px;
            color: var(--gray-900);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
        }

        .filter-group select {
            padding: 10px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: var(--gray-600);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--gray-700);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .job-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .job-card {
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .job-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        .job-card.running {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .job-card.completed {
            border-color: var(--success);
        }

        .job-card.failed {
            border-color: var(--danger);
        }

        .job-card.cancelled {
            border-color: var(--warning);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .job-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .job-id {
            font-size: 12px;
            font-family: monospace;
            color: var(--gray-600);
        }

        .job-type {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .job-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .job-status.queued {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .job-status.running {
            background: #dbeafe;
            color: #1e40af;
        }

        .job-status.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .job-status.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .job-status.cancelled {
            background: #fef3c7;
            color: #92400e;
        }

        .job-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px;
            background: var(--gray-50);
            border-radius: 8px;
            font-size: 13px;
        }

        .job-meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .job-meta-label {
            font-weight: 600;
            color: var(--gray-600);
            font-size: 11px;
            text-transform: uppercase;
        }

        .job-meta-value {
            color: var(--gray-900);
        }

        .job-progress {
            margin-bottom: 16px;
        }

        .progress-bar-container {
            background: var(--gray-200);
            border-radius: 8px;
            height: 24px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #3b82f6);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .progress-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--gray-700);
        }

        .job-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-600);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray-600);
        }

        .loading i {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid var(--gray-200);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--gray-600);
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Cleanup Jobs - Management & Reporting</h1>
            <p>Monitor, manage, and cancel running cleanup jobs</p>
        </div>

        <div class="content">
            <!-- Stats Overview -->
            <div class="section">
                <h2><i class="fas fa-chart-bar"></i> Overview</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label">Total Jobs</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statRunning" style="color: var(--primary);">0</div>
                        <div class="stat-label">Running</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statCompleted" style="color: var(--success);">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statFailed" style="color: var(--danger);">0</div>
                        <div class="stat-label">Failed</div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="section">
                <h2><i class="fas fa-filter"></i> Filters</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>Job Type</label>
                        <select id="filterType" onchange="loadJobs()">
                            <option value="">All Types</option>
                            <option value="smart_cleanup">Smart Cleanup</option>
                            <option value="ai_profile_cleanup">AI Profile Cleanup</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Status</label>
                        <select id="filterStatus" onchange="loadJobs()">
                            <option value="">All Statuses</option>
                            <option value="running">Running</option>
                            <option value="queued">Queued</option>
                            <option value="completed">Completed</option>
                            <option value="failed">Failed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Actions</label>
                        <button class="btn btn-primary" onclick="loadJobs()">
                            <i class="fas fa-sync"></i> Refresh
                        </button>
                    </div>
                </div>
            </div>

            <!-- Jobs List -->
            <div class="section">
                <h2><i class="fas fa-list"></i> Jobs</h2>
                <div id="jobsList" class="job-list">
                    <div class="loading">
                        <div><i class="fas fa-spinner fa-spin"></i></div>
                        <div>Loading jobs...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBVTe09tUa_DKlqYo83vKU9TZcSon0pm2s",
            authDomain: "careluminate.firebaseapp.com",
            projectId: "careluminate",
            storageBucket: "careluminate.appspot.com",
            messagingSenderId: "539561803826",
            appId: "1:539561803826:web:a936bf5e5db6cbe1ae8d02"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.clEmailDb = db;
        window.clEmailApp = app;

        // Auto-refresh running jobs every 3 seconds
        let autoRefreshInterval = null;

        // Load jobs on page load
        window.addEventListener('load', () => {
            loadJobs();
            startAutoRefresh();
        });

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            
            autoRefreshInterval = setInterval(() => {
                // Only auto-refresh if there are running jobs
                const runningCount = parseInt(document.getElementById('statRunning').textContent);
                if (runningCount > 0) {
                    loadJobs(true); // Silent refresh
                }
            }, 3000);
        }

        window.loadJobs = async function(silent = false) {
            const type = document.getElementById('filterType').value;
            const status = document.getElementById('filterStatus').value;
            
            if (!silent) {
                document.getElementById('jobsList').innerHTML = `
                    <div class="loading">
                        <div><i class="fas fa-spinner fa-spin"></i></div>
                        <div>Loading jobs...</div>
                    </div>
                `;
            }

            try {
                const params = new URLSearchParams();
                if (type) params.append('type', type);
                if (status) params.append('status', status);
                params.append('limit', '100');

                const response = await fetch(`https://railwayclemail-production.up.railway.app/api/cleanup-jobs/list?${params}`);
                
                if (!response.ok) {
                    throw new Error(`Failed to load jobs: ${response.status}`);
                }

                const data = await response.json();
                displayJobs(data.jobs);
                updateStats(data.jobs);

            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsList').innerHTML = `
                    <div class="empty-state">
                        <div><i class="fas fa-exclamation-triangle"></i></div>
                        <div>Error loading jobs: ${error.message}</div>
                        <button class="btn btn-primary" onclick="loadJobs()" style="margin-top: 16px;">
                            <i class="fas fa-sync"></i> Retry
                        </button>
                    </div>
                `;
            }
        };

        function updateStats(jobs) {
            const stats = {
                total: jobs.length,
                running: jobs.filter(j => j.status === 'running' || j.status === 'queued').length,
                completed: jobs.filter(j => j.status === 'completed').length,
                failed: jobs.filter(j => j.status === 'failed').length
            };

            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statRunning').textContent = stats.running;
            document.getElementById('statCompleted').textContent = stats.completed;
            document.getElementById('statFailed').textContent = stats.failed;
        }

        function displayJobs(jobs) {
            const container = document.getElementById('jobsList');

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div><i class="fas fa-inbox"></i></div>
                        <div>No jobs found</div>
                    </div>
                `;
                return;
            }

            let html = '';

            jobs.forEach(job => {
                const typeLabel = job.type === 'smart_cleanup' ? 'Smart Cleanup' : 'AI Profile Cleanup';
                const typeIcon = job.type === 'smart_cleanup' ? 'brain' : 'robot';
                
                const startTime = job.startTime?.toDate ? job.startTime.toDate() : new Date(job.startTime);
                const endTime = job.endTime ? (job.endTime.toDate ? job.endTime.toDate() : new Date(job.endTime)) : null;
                
                const duration = endTime ? 
                    Math.round((endTime - startTime) / 1000) + 's' : 
                    Math.round((new Date() - startTime) / 1000) + 's';

                const progress = job.progress || {};
                const percentage = progress.percentage || 0;

                html += `
                    <div class="job-card ${job.status}">
                        <div class="job-header">
                            <div class="job-title">
                                <div class="job-type">
                                    <i class="fas fa-${typeIcon}"></i> ${typeLabel}
                                </div>
                                <div class="job-id">${job.jobId}</div>
                            </div>
                            <div class="job-status ${job.status}">
                                ${job.status}
                            </div>
                        </div>

                        <div class="job-meta">
                            <div class="job-meta-item">
                                <div class="job-meta-label">Created By</div>
                                <div class="job-meta-value">${job.createdBy || 'Unknown'}</div>
                            </div>
                            <div class="job-meta-item">
                                <div class="job-meta-label">Started</div>
                                <div class="job-meta-value">${startTime.toLocaleString()}</div>
                            </div>
                            <div class="job-meta-item">
                                <div class="job-meta-label">Duration</div>
                                <div class="job-meta-value">${duration}</div>
                            </div>
                            ${progress.stats ? `
                                <div class="job-meta-item">
                                    <div class="job-meta-label">Progress</div>
                                    <div class="job-meta-value">
                                        ${progress.stats.flagged || 0} flagged / ${progress.stats.totalContacts || 0} total
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        ${job.status === 'running' || job.status === 'queued' ? `
                            <div class="job-progress">
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: ${percentage}%;">
                                        ${percentage}%
                                    </div>
                                </div>
                                <div class="progress-stats">
                                    <div><strong>Status:</strong> ${progress.message || 'Processing...'}</div>
                                    ${progress.currentStep ? `<div><strong>Step:</strong> ${progress.currentStep}</div>` : ''}
                                </div>
                            </div>
                        ` : ''}

                        ${job.error ? `
                            <div style="padding: 12px; background: #fee2e2; border-left: 4px solid var(--danger); border-radius: 6px; margin-bottom: 16px; font-size: 13px; color: #991b1b;">
                                <strong>Error:</strong> ${job.error}
                            </div>
                        ` : ''}

                        <div class="job-actions">
                            ${job.status === 'running' || job.status === 'queued' ? `
                                <button class="btn btn-danger" onclick="cancelJob('${job.jobId}')">
                                    <i class="fas fa-stop"></i> Cancel Job
                                </button>
                                <button class="btn btn-secondary" onclick="viewJobDetails('${job.jobId}')">
                                    <i class="fas fa-eye"></i> View Details
                                </button>
                            ` : `
                                <button class="btn btn-secondary" onclick="viewJobDetails('${job.jobId}')">
                                    <i class="fas fa-eye"></i> View Details
                                </button>
                                <button class="btn btn-danger" onclick="deleteJob('${job.jobId}')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.cancelJob = async function(jobId) {
            if (!confirm('Are you sure you want to cancel this job?')) {
                return;
            }

            try {
                const response = await fetch(`https://railwayclemail-production.up.railway.app/api/cleanup-jobs/cancel/${jobId}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`Failed to cancel job: ${response.status}`);
                }

                alert('Job cancelled successfully');
                loadJobs();

            } catch (error) {
                console.error('Error cancelling job:', error);
                alert('Error: ' + error.message);
            }
        };

        window.deleteJob = async function(jobId) {
            if (!confirm('Are you sure you want to delete this job? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`https://railwayclemail-production.up.railway.app/api/cleanup-jobs/delete/${jobId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error(`Failed to delete job: ${response.status}`);
                }

                alert('Job deleted successfully');
                loadJobs();

            } catch (error) {
                console.error('Error deleting job:', error);
                alert('Error: ' + error.message);
            }
        };

        window.viewJobDetails = function(jobId) {
            // Determine which page to open based on job type
            if (jobId.startsWith('smart_cleanup_')) {
                window.location.href = `prospect_cleanup.html?tab=smart&jobId=${jobId}`;
            } else if (jobId.startsWith('ai_cleanup_')) {
                window.location.href = `prospect_cleanup.html?tab=ai-profile&jobId=${jobId}`;
            }
        };
    </script>
</body>
</html>
