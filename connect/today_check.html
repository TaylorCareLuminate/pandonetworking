<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Today's Check · Replies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #0f172a;
            color: white;
            padding: 1rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .header-sub {
            font-size: 0.72rem;
            color: #94a3b8;
            margin-top: 1px;
        }

        .count-pill {
            background: #1e40af;
            color: #bfdbfe;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        .refresh-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .refresh-btn:hover { background: #273549; }
        .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Search */
        .search-bar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 0.65rem 1.25rem;
            position: sticky;
            top: 56px;
            z-index: 49;
        }

        .search-inner {
            max-width: 680px;
            margin: 0 auto;
            position: relative;
        }

        .search-inner input {
            width: 100%;
            padding: 0.5rem 0.85rem 0.5rem 2.1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.82rem;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.15s;
        }
        .search-inner input:focus { border-color: #3b82f6; background: white; }
        .search-inner i {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.75rem;
        }

        /* Main */
        .main {
            max-width: 680px;
            margin: 0 auto;
            padding: 1.25rem 1rem 4rem;
        }

        /* States */
        .state-card {
            background: white;
            border-radius: 12px;
            padding: 3rem 1.5rem;
            text-align: center;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
            color: #64748b;
        }
        .state-card i { font-size: 2rem; opacity: 0.3; display: block; margin-bottom: 0.75rem; }
        .state-card h3 { color: #0f172a; margin-bottom: 0.35rem; }
        .state-card p { font-size: 0.85rem; }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Reply card */
        .reply-card {
            background: white;
            border-radius: 12px;
            padding: 1rem 1.1rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            border-left: 3px solid #3b82f6;
        }

        .reply-card.inmail { border-left-color: #C9973D; }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .lead-name {
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .lead-meta {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.5rem;
            align-items: center;
        }

        .lead-meta .company { font-weight: 600; color: #334155; }

        .li-link {
            color: #0F2D4D;
            text-decoration: none;
            font-size: 0.72rem;
        }
        .li-link:hover { text-decoration: underline; }

        .time-ago {
            font-size: 0.7rem;
            color: #94a3b8;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }

        /* The reply message bubble */
        .reply-bubble {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            font-size: 0.84rem;
            color: #1e3a5f;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 0.6rem;
        }

        .reply-bubble.inmail-bubble {
            background: #faf5ff;
            border-color: #ddd6fe;
            color: #3b1f6e;
        }

        .no-message {
            margin-top: 0.6rem;
            font-size: 0.78rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* BDR attribution footer */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.65rem;
            padding-top: 0.55rem;
            border-top: 1px solid #f1f5f9;
        }

        .bdr-tag {
            font-size: 0.72rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .bdr-tag strong { color: #334155; }

        .type-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge-reply  { background: #dbeafe; color: #1d4ed8; }
        .badge-inmail { background: #ede9fe; color: #8A6B2E; }

        /* Auth notice */
        #authNotice {
            background: #fef3c7;
            border: 1.5px solid #fbbf24;
            color: #92400e;
            border-radius: 10px;
            padding: 1.25rem;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1rem; }
            .lead-name { font-size: 0.88rem; }
            .reply-bubble { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <div>
            <h1>Today's Check <span id="countPill" class="count-pill" style="display:none;"></span></h1>
            <div class="header-sub">Replies in the last 48 hours · All BDRs</div>
        </div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadReplies()">
        <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh
    </button>
</header>

<div class="search-bar">
    <div class="search-inner">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by name, company, or message…" oninput="renderList()">
    </div>
</div>

<div class="main">
    <div id="authNotice">
        <i class="fas fa-lock" style="margin-right:0.5rem;"></i>
        Please sign in to view replies.
    </div>

    <div id="stateArea" class="state-card">
        <div class="spinner"></div>
        <div>Loading replies…</div>
    </div>

    <div id="listArea"></div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/clemail-firestore-wrapper.js"></script>
<script src="healthconnect-header.js?v=3.1"></script>

<script type="module">
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

    const { collection, query, where, getDocs, orderBy, limit, Timestamp } = window.clemailFirestore;

    await window.firebaseReady;

    const auth = window.auth;
    const db   = window.clemailDb;

    let allReplies = [];
    let isLoading  = false;

    // ── Helpers ────────────────────────────────────────────
    function safeDate(ts) {
        if (!ts) return null;
        if (ts instanceof Date) return ts;
        if (typeof ts.toDate === 'function') return ts.toDate();
        if (ts.seconds !== undefined) return new Date(ts.seconds * 1000 + (ts.nanoseconds || 0) / 1e6);
        if (ts._seconds !== undefined) return new Date(ts._seconds * 1000 + (ts._nanoseconds || 0) / 1e6);
        if (typeof ts === 'number') return new Date(ts);
        if (typeof ts === 'string') return new Date(ts);
        return null;
    }

    function timeAgo(date) {
        if (!date) return '';
        const diff = Date.now() - date.getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1)  return 'just now';
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24)  return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        return `${days}d ago`;
    }

    function esc(s) {
        if (!s) return '';
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Load ───────────────────────────────────────────────
    window.loadReplies = async function() {
        if (isLoading) return;
        isLoading = true;

        document.getElementById('stateArea').style.display = 'block';
        document.getElementById('stateArea').innerHTML = '<div class="spinner"></div><div>Loading replies…</div>';
        document.getElementById('listArea').innerHTML = '';
        document.getElementById('countPill').style.display = 'none';
        document.getElementById('refreshBtn').disabled = true;
        document.getElementById('refreshIcon').classList.add('fa-spin');

        try {
            const cutoff = new Date(Date.now() - 48 * 60 * 60 * 1000);

            // Load BDR name map
            const bdrSnap = await getDocs(collection(db, 'bdr_leaders'));
            const bdrMap  = new Map();
            bdrSnap.forEach(d => {
                const v = d.data();
                const name = v.name || '';
                if (v.primaryEmail) bdrMap.set(v.primaryEmail.toLowerCase(), name);
                if (v.linkedInEmail) bdrMap.set(v.linkedInEmail.toLowerCase(), name);
            });

            // Query reply events only
            const snap = await getDocs(query(
                collection(db, 'heyreach_activity'),
                where('eventType', 'in', ['MESSAGE_REPLY_RECEIVED', 'INMAIL_REPLY_RECEIVED']),
                where('timestamp', '>=', Timestamp.fromDate(cutoff)),
                orderBy('timestamp', 'desc'),
                limit(2000)
            ));

            const seen = new Set();
            allReplies = [];

            snap.forEach(d => {
                if (seen.has(d.id)) return;
                seen.add(d.id);

                const data = d.data();
                const ts   = safeDate(data.timestamp);
                if (!ts) return;

                const bdrEmail = (data.bdrEmail || '').toLowerCase();
                const bdrName  = bdrMap.get(bdrEmail) || data.accountName || bdrEmail || '';

                const leadName   = `${data.leadFirstName || ''} ${data.leadLastName || ''}`.trim() || 'Unknown';
                const company    = data.leadCompany || data.companyName || data.company || '';
                const position   = data.leadPosition || '';
                const profileUrl = data.leadProfileUrl || data.rawData?.lead?.profile_url || '';

                // Debug: log first doc's raw shape so we can see all available fields
                if (allReplies.length === 0) {
                    console.log('📋 First heyreach_activity reply doc fields:', Object.keys(data));
                    console.log('📋 rawData keys:', data.rawData ? Object.keys(data.rawData) : 'none');
                    console.log('📋 eventData keys:', data.eventData ? Object.keys(data.eventData) : 'none');
                    console.log('📋 Full doc sample:', JSON.parse(JSON.stringify(data)));
                }

                // Primary: rawData.recent_messages — find the lead's reply (is_reply === true)
                let messageText = '';
                if (data.rawData?.recent_messages && Array.isArray(data.rawData.recent_messages)) {
                    const replyMsgs = data.rawData.recent_messages.filter(m => m.is_reply === true);
                    const target = replyMsgs.length > 0
                        ? replyMsgs[replyMsgs.length - 1]   // most recent reply
                        : data.rawData.recent_messages[data.rawData.recent_messages.length - 1]; // last message
                    messageText = target?.message || target?.text || target?.body || '';
                }

                // Fallbacks
                if (!messageText) messageText = data.eventData?.message || data.eventData?.messageText || '';
                if (!messageText) messageText = data.replyText || data.messageText || data.message || '';
                if (!messageText) messageText = data.rawData?.message?.text || data.rawData?.messageText || data.rawData?.replyText || '';

                messageText = typeof messageText === 'string' ? messageText.trim() : '';

                allReplies.push({
                    id: d.id,
                    isInmail: data.eventType === 'INMAIL_REPLY_RECEIVED',
                    ts,
                    bdrEmail,
                    bdrName,
                    leadName,
                    company,
                    position,
                    profileUrl,
                    messageText,
                });
            });

            allReplies.sort((a, b) => b.ts - a.ts);

            document.getElementById('stateArea').style.display = 'none';
            renderList();

        } catch (err) {
            console.error('Error:', err);
            document.getElementById('stateArea').innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Failed to load</h3>
                <p>${esc(err.message)}</p>`;
        } finally {
            isLoading = false;
            document.getElementById('refreshBtn').disabled = false;
            document.getElementById('refreshIcon').classList.remove('fa-spin');
        }
    };

    // ── Render ─────────────────────────────────────────────
    window.renderList = function() {
        const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

        const filtered = q
            ? allReplies.filter(r =>
                `${r.leadName} ${r.company} ${r.bdrName} ${r.messageText}`.toLowerCase().includes(q))
            : allReplies;

        const pill = document.getElementById('countPill');
        if (allReplies.length > 0) {
            pill.textContent = `${filtered.length}`;
            pill.style.display = 'inline';
        }

        const area = document.getElementById('listArea');

        if (allReplies.length === 0) {
            area.innerHTML = '';
            document.getElementById('stateArea').style.display = 'block';
            document.getElementById('stateArea').innerHTML = `
                <i class="fas fa-inbox"></i>
                <h3>No replies in the last 48 hours</h3>
                <p>Check back later — replies will show up here as they come in.</p>`;
            return;
        }

        if (filtered.length === 0) {
            area.innerHTML = `
                <div class="state-card">
                    <i class="fas fa-search"></i>
                    <h3>No matches</h3>
                    <p>Try a different search term.</p>
                </div>`;
            return;
        }

        area.innerHTML = filtered.map(r => {
            const isInmail   = r.isInmail;
            const cardCls    = isInmail ? 'reply-card inmail' : 'reply-card';
            const bubbleCls  = isInmail ? 'reply-bubble inmail-bubble' : 'reply-bubble';
            const badgeCls   = isInmail ? 'badge-inmail' : 'badge-reply';
            const badgeLbl   = isInmail ? 'InMail Reply' : 'Reply';

            const companyHtml = r.company
                ? `<span class="company">${esc(r.company)}</span>`
                : '';
            const posHtml = r.position
                ? `<span>${esc(r.position)}</span>`
                : '';
            const liHtml = r.profileUrl
                ? `<a class="li-link" href="${esc(r.profileUrl)}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>`
                : '';

            const metaParts = [companyHtml, posHtml, liHtml].filter(Boolean).join('<span style="color:#cbd5e1">·</span>');

            const msgHtml = r.messageText
                ? `<div class="${bubbleCls}">${esc(r.messageText)}</div>`
                : `<div class="no-message">No message text captured</div>`;

            const bdrHtml = r.bdrName
                ? `<div class="bdr-tag"><i class="fas fa-user-tie"></i> Replied to <strong>${esc(r.bdrName)}</strong></div>`
                : `<div class="bdr-tag"><i class="fas fa-user-tie"></i> <span style="color:#94a3b8">${esc(r.bdrEmail)}</span></div>`;

            return `
            <div class="${cardCls}">
                <div class="card-top">
                    <div>
                        <div class="lead-name">${esc(r.leadName)}</div>
                        <div class="lead-meta">${metaParts}</div>
                    </div>
                    <div class="time-ago" title="${r.ts.toLocaleString()}">${timeAgo(r.ts)}</div>
                </div>
                ${msgHtml}
                <div class="card-footer">
                    ${bdrHtml}
                    <span class="type-badge ${badgeCls}">${badgeLbl}</span>
                </div>
            </div>`;
        }).join('');
    };

    // ── Auth ───────────────────────────────────────────────
    onAuthStateChanged(auth, user => {
        if (user) {
            document.getElementById('authNotice').style.display = 'none';
            loadReplies();
        } else {
            document.getElementById('authNotice').style.display = 'block';
            document.getElementById('stateArea').style.display = 'none';
        }
    });
</script>
</body>
</html>
