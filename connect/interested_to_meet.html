<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Meeting Interest Analysis - HealthConnect v2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group select,
        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .conversations-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .conversation-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .conversation-card:hover {
            transform: translateY(-2px);
        }

        .conversation-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lead-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lead-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #667eea;
            font-weight: 700;
        }

        .lead-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .lead-details h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .lead-details p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .meeting-date {
            text-align: right;
        }

        .meeting-date .label {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 3px;
        }

        .meeting-date .date {
            font-size: 1rem;
            font-weight: 600;
        }

        .conversation-messages {
            padding: 25px;
            max-height: 600px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        .message.bdr {
            flex-direction: row-reverse;
        }

        .message-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message.lead .message-icon {
            background: #e3f2fd;
            color: #1976d2;
        }

        .message.bdr .message-icon {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .message-content {
            flex: 1;
        }

        .message.bdr .message-content {
            text-align: right;
        }

        .message-meta {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 5px;
        }

        .message-text {
            background: #f5f5f5;
            padding: 12px 16px;
            border-radius: 12px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.lead .message-text {
            background: #e3f2fd;
            border-bottom-left-radius: 4px;
        }

        .message.bdr .message-text {
            background: #f3e5f5;
            border-bottom-right-radius: 4px;
        }

        .no-data {
            background: white;
            padding: 60px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .no-data i {
            font-size: 4rem;
            color: #ccc;
            margin-bottom: 20px;
        }

        .no-data h3 {
            color: #666;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .no-data p {
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .loading i {
            font-size: 3rem;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 20px;
            color: #666;
            font-size: 1.1rem;
        }

        .linkedin-link {
            display: inline-block;
            margin-top: 10px;
            color: #0077b5;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .linkedin-link:hover {
            color: #005582;
        }

        .conversation-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .conversation-toggle:hover {
            background: rgba(255,255,255,0.2);
        }

        .conversation-messages.collapsed {
            display: none;
        }

        .preview-table {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .preview-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .preview-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .preview-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .preview-table tr:hover {
            background: #f5f5f5;
        }

        .sender-account {
            color: #7b1fa2;
            font-weight: 600;
        }

        .sender-lead {
            color: #1976d2;
            font-weight: 600;
        }

        .message-preview {
            font-family: monospace;
            font-size: 0.85rem;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            margin: 3px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ai-prompt-box {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-calendar-check"></i> Meeting Interest Analysis</h1>
            <p>Re-analyze conversations with AI to detect meeting willingness for a specific BDR and timeframe</p>
        </div>

        <div class="controls">
            <div class="form-group">
                <label for="bdr-select">Select BDR</label>
                <select id="bdr-select">
                    <option value="">Loading BDRs...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="start-date">Start Date</label>
                <input type="date" id="start-date">
            </div>
            <div class="form-group">
                <label for="end-date">End Date</label>
                <input type="date" id="end-date">
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn" id="view-data-btn">
                    <i class="fas fa-search"></i> View Existing Data
                </button>
                <button class="btn" id="reanalyze-btn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <i class="fas fa-robot"></i> Re-Analyze with AI
                </button>
                <button class="btn btn-secondary" id="reanalyze-all-btn" style="background: #ff6b6b;">
                    <i class="fas fa-sync-alt"></i> Re-Analyze ALL BDRs
                </button>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="number" id="stat-total">0</div>
                <div class="label">Total Conversations</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-willing">0</div>
                <div class="label">Willing to Meet</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-percentage">0%</div>
                <div class="label">Conversion Rate</div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <!-- Firebase and Auth -->
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script type="module">
        // Import Firebase auth functions
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        
        // Wait for auth.js to initialize
        console.log('⏳ Waiting for auth.js to initialize...');
        await window.firebaseReady;
        console.log('✅ Auth.js initialized');
        
        // Get auth from window
        const auth = window.auth;
        const emailDB = window.clemailDb;
        
        // Import Firestore functions from wrapper
        const { collection, getDocs, query, where } = window.clemailFirestore;

        // Initialize on auth state change
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('✅ User authenticated:', user.email);
                await loadBDRs();
                setDefaultDates();
            } else {
                const authState = window.getCurrentAuthState?.();
                if (authState?.isLoggedIn) {
                    console.log('🛡️ Suppressing false logout - auth.js protection active');
                    return;
                }
                console.log('❌ User not authenticated, redirecting...');
                window.location.href = '../login.html';
            }
        });

        // Set default dates (past month)
        function setDefaultDates() {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setMonth(startDate.getMonth() - 1);

            document.getElementById('end-date').valueAsDate = endDate;
            document.getElementById('start-date').valueAsDate = startDate;
        }

        // Load BDR list
        async function loadBDRs() {
            try {
                console.log('📋 Loading BDRs from bdr_leaders...');
                
                // Load BDR leaders
                const bdrLeadersRef = collection(emailDB, 'bdr_leaders');
                const bdrSnapshot = await getDocs(bdrLeadersRef);
                
                const bdrLeaders = [];
                bdrSnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.status === 'inactive') return; // skip inactive BDRs
                    bdrLeaders.push({
                        id: doc.id,
                        ...data
                    });
                });
                
                // Also load linkedin_accounts to get HeyReach account IDs and customer IDs
                const linkedinAccountsRef = collection(emailDB, 'linkedin_accounts');
                const linkedinSnapshot = await getDocs(linkedinAccountsRef);
                
                const linkedinAccounts = [];
                linkedinSnapshot.forEach((doc) => {
                    linkedinAccounts.push(doc.data());
                });
                
                // Create a map of email -> linkedin account info
                const linkedinAccountMap = new Map();
                linkedinAccounts.forEach(account => {
                    const email = account.bdrEmail || account.primaryEmail;
                    if (email) {
                        linkedinAccountMap.set(email.toLowerCase(), {
                            customerId: account.customerId,
                            linkedInAccountId: account.heyreachAccountId,
                            linkedInUrl: account.linkedInProfileUrl
                        });
                    }
                });

                // Load customerList to map customerId -> company name
                const customerMap = new Map();
                try {
                    const customersSnap = await getDocs(collection(emailDB, 'customerList'));
                    customersSnap.forEach(docSnap => {
                        const d = docSnap.data();
                        customerMap.set(docSnap.id, d.name || d.shortName || docSnap.id);
                    });
                } catch (err) { console.warn('Could not load customerList:', err.message); }
                
                const select = document.getElementById('bdr-select');
                select.innerHTML = '<option value="">-- Select a BDR --</option>';
                
                // Sort by name
                const sorted = bdrLeaders.sort((a, b) => {
                    const nameA = a.name || '';
                    const nameB = b.name || '';
                    return nameA.localeCompare(nameB);
                });

                function buildBdrOption(bdr) {
                    const option = document.createElement('option');
                    const email = bdr.primaryEmail;
                    option.value = email;
                    option.textContent = `${bdr.name} (${email})`;
                    
                    // Get LinkedIn account info if available
                    const linkedinInfo = linkedinAccountMap.get(email.toLowerCase());
                    if (linkedinInfo) {
                        option.dataset.customerId = linkedinInfo.customerId || '';
                        option.dataset.linkedInAccountId = linkedinInfo.linkedInAccountId || '';
                    }
                    return option;
                }

                // Group BDRs by company
                const byCompany = new Map();
                const uncategorized = [];
                sorted.forEach(bdr => {
                    const linkedinInfo = linkedinAccountMap.get((bdr.primaryEmail || '').toLowerCase());
                    const customerId = bdr.customerId || (linkedinInfo && linkedinInfo.customerId);
                    const company = (customerId && customerMap.get(customerId)) || null;
                    if (company) {
                        if (!byCompany.has(company)) byCompany.set(company, []);
                        byCompany.get(company).push(bdr);
                    } else {
                        uncategorized.push(bdr);
                    }
                });
                Array.from(byCompany.keys()).sort().forEach(company => {
                    const grp = document.createElement('optgroup');
                    grp.label = company;
                    byCompany.get(company).forEach(bdr => grp.appendChild(buildBdrOption(bdr)));
                    select.appendChild(grp);
                });
                if (uncategorized.length > 0) {
                    const grp = document.createElement('optgroup');
                    grp.label = 'Other';
                    uncategorized.forEach(bdr => grp.appendChild(buildBdrOption(bdr)));
                    select.appendChild(grp);
                }
                
                console.log(`✅ Loaded ${sorted.length} BDRs`);
            } catch (error) {
                console.error('❌ Error loading BDRs:', error);
            }
        }

        // View existing data button handler
        document.getElementById('view-data-btn').addEventListener('click', async function() {
            const bdrEmail = document.getElementById('bdr-select').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!bdrEmail) {
                alert('Please select a BDR');
                return;
            }

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            await analyzeExistingData(bdrEmail, startDate, endDate);
        });

        // Re-analyze button handler - triggers AI re-analysis for selected BDR
        document.getElementById('reanalyze-btn').addEventListener('click', async function() {
            const bdrEmail = document.getElementById('bdr-select').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!bdrEmail) {
                alert('Please select a BDR');
                return;
            }

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            // Get BDR info
            const select = document.getElementById('bdr-select');
            const selectedOption = select.options[select.selectedIndex];
            const bdrName = selectedOption.textContent;
            const customerId = selectedOption.dataset.customerId;

            if (!confirm(`⚠️ This will re-analyze ALL conversations for ${bdrName} using AI.\n\nThis may take several minutes. Continue?`)) {
                return;
            }

            await runAIAnalysis(bdrEmail, bdrName, customerId, startDate, endDate);
        });

        // Re-analyze ALL button handler - triggers AI re-analysis for ALL BDRs
        document.getElementById('reanalyze-all-btn').addEventListener('click', async function() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }

            if (!confirm(`⚠️⚠️⚠️ WARNING ⚠️⚠️⚠️\n\nThis will re-analyze ALL conversations for ALL BDRs using AI.\n\nThis could take 10-30 minutes and consume significant API credits.\n\nAre you ABSOLUTELY SURE you want to continue?`)) {
                return;
            }

            await reanalyzeAllBDRs(startDate, endDate);
        });

        async function analyzeExistingData(bdrEmail, startDate, endDate) {
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            
            // Show loading
            resultsDiv.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading existing data for analysis...</p>
                </div>
            `;
            statsDiv.style.display = 'none';

            try {
                // Get selected BDR info
                const select = document.getElementById('bdr-select');
                const selectedOption = select.options[select.selectedIndex];
                const bdrName = selectedOption.textContent;
                const customerId = selectedOption.dataset.customerId;
                const linkedInAccountId = selectedOption.dataset.linkedInAccountId;

                console.log('📊 STEP 1: Query Parameters');
                console.log('   BDR Email:', bdrEmail);
                console.log('   BDR Name:', bdrName);
                console.log('   customerId:', customerId);
                console.log('   linkedInAccountId:', linkedInAccountId);
                console.log('   Date Range:', startDate, 'to', endDate);

                // Convert dates to timestamps
                const startTimestamp = new Date(startDate + 'T00:00:00').getTime();
                const endTimestamp = new Date(endDate + 'T23:59:59').getTime();

                // STEP 1: Query ALL conversations for this BDR
                let allConversations = [];
                
                if (customerId) {
                    console.log('📊 STEP 2: Querying by customerId:', customerId);
                    const inboxRef = collection(emailDB, 'heyreach_inbox');
                    const q = query(inboxRef, where('customerId', '==', customerId));
                    const snapshot = await getDocs(q);
                    
                    snapshot.forEach((doc) => {
                        allConversations.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    console.log(`   ✅ Found ${allConversations.length} total conversations for customerId`);
                }
                
                // If no results, try linkedInAccountId
                if (allConversations.length === 0 && linkedInAccountId) {
                    console.log('📊 STEP 2: Querying by linkedInAccountId:', linkedInAccountId);
                    const inboxRef = collection(emailDB, 'heyreach_inbox');
                    const q = query(inboxRef, where('linkedInAccountId', '==', linkedInAccountId));
                    const snapshot = await getDocs(q);
                    
                    snapshot.forEach((doc) => {
                        allConversations.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    console.log(`   ✅ Found ${allConversations.length} total conversations for linkedInAccountId`);
                }

                if (allConversations.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-inbox"></i>
                            <h3>No Conversations Found</h3>
                            <p>No conversation data found in <code>heyreach_inbox</code> for this BDR.</p>
                            <p style="margin-top: 15px; font-size: 0.9rem; color: #666;">
                                Query attempted with:<br>
                                ${customerId ? `customerId = "${customerId}"` : ''}<br>
                                ${linkedInAccountId ? `linkedInAccountId = "${linkedInAccountId}"` : ''}
                            </p>
                        </div>
                    `;
                    return;
                }

                // STEP 2: Analyze what we have
                let step2_hasWillingFlag = 0;
                let step2_noWillingFlag = 0;
                let step2_hasWillingDate = 0;
                let step2_noWillingDate = 0;
                let step3_inDateRange = 0;
                let step3_beforeDateRange = 0;
                let step3_afterDateRange = 0;
                let step3_invalidDate = 0;

                const conversationsWithWillingness = [];
                const conversationsInDateRange = [];

                allConversations.forEach(conv => {
                    // Check willing to meet flag
                    if (conv.willingToMeet === true) {
                        step2_hasWillingFlag++;
                        
                        // Check for date
                        if (conv.meetingWillingnessDate) {
                            step2_hasWillingDate++;
                            
                            // Check date range
                            try {
                                const timestamp = conv.meetingWillingnessDate.toMillis 
                                    ? conv.meetingWillingnessDate.toMillis() 
                                    : new Date(conv.meetingWillingnessDate).getTime();
                                
                                if (timestamp >= startTimestamp && timestamp <= endTimestamp) {
                                    step3_inDateRange++;
                                    conversationsInDateRange.push(conv);
                                } else if (timestamp < startTimestamp) {
                                    step3_beforeDateRange++;
                                } else {
                                    step3_afterDateRange++;
                                }
                            } catch (err) {
                                step3_invalidDate++;
                            }
                            
                            conversationsWithWillingness.push(conv);
                        } else {

        function createConversationCard(conv, index) {
            const card = document.createElement('div');
            card.className = 'conversation-card';

            // Extract lead info with multiple fallbacks
            let leadName = conv.lead_name || 'Unknown Lead';
            let leadPosition = conv.lead_position || conv.position || '';
            let leadCompany = conv.lead_company || conv.company || '';
            let leadProfileUrl = conv.linkedin_url || conv.leadProfileUrl || '';
            let leadProfilePicture = conv.lead_profile_picture || conv.leadProfilePicture || '';
            
            // If not found, try rawData.correspondentProfile (same structure as index.html)
            if (conv.rawData?.correspondentProfile) {
                const profile = conv.rawData.correspondentProfile;
                if (leadName === 'Unknown Lead' && profile.firstName) {
                    leadName = `${profile.firstName || ''} ${profile.lastName || ''}`.trim();
                }
                if (!leadPosition && profile.headline) {
                    leadPosition = profile.headline;
                }
                if (!leadProfileUrl && profile.profileUrl) {
                    leadProfileUrl = profile.profileUrl;
                }
                if (!leadProfilePicture && profile.imageUrl) {
                    leadProfilePicture = profile.imageUrl;
                }
                if (!leadCompany && profile.companyName) {
                    leadCompany = profile.companyName;
                }
            }

            // Debug: Log conversation data for first conversation
            if (index === 0) {
                console.log('🔍 Sample conversation data:', {
                    lead_name: conv.lead_name,
                    rawData: conv.rawData ? 'exists' : 'missing',
                    rawDataKeys: conv.rawData ? Object.keys(conv.rawData) : [],
                    correspondentProfile: conv.rawData?.correspondentProfile,
                    messages: conv.messages,
                    recent_messages: conv.rawData?.recent_messages,
                    extractedLeadName: leadName,
                    extractedPosition: leadPosition,
                    extractedCompany: leadCompany
                });
            }
            
            const leadInitial = leadName.charAt(0).toUpperCase();

            // Format meeting date
            const meetingDate = conv.meetingWillingnessDate;
            const formattedDate = meetingDate 
                ? new Date(meetingDate.toMillis ? meetingDate.toMillis() : meetingDate).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                })
                : 'Unknown';

            // Get messages - try multiple sources
            let messages = [];
            
            if (conv.rawData?.recent_messages && Array.isArray(conv.rawData.recent_messages)) {
                messages = conv.rawData.recent_messages;
            } else if (conv.rawData?.messages && Array.isArray(conv.rawData.messages)) {
                messages = conv.rawData.messages;
            } else if (conv.messages && Array.isArray(conv.messages)) {
                messages = conv.messages;
            }
            
            if (index === 0) {
                console.log('📧 Messages found:', messages.length, messages.length > 0 ? messages[0] : 'none');
            }

            card.innerHTML = `
                <div class="conversation-header">
                    <div class="lead-info">
                        <div class="lead-avatar">${leadInitial}</div>
                        <div class="lead-details">
                            <h3>${leadName}</h3>
                            <p>${leadPosition}${leadPosition && leadCompany ? ' @ ' : ''}${leadCompany}</p>
                            ${leadProfileUrl ? `<a href="${leadProfileUrl}" target="_blank" class="linkedin-link"><i class="fab fa-linkedin"></i> View Profile</a>` : ''}
                        </div>
                    </div>
                    <div class="meeting-date">
                        <div class="label">Interest Detected</div>
                        <div class="date">${formattedDate}</div>
                        <button class="conversation-toggle" onclick="toggleConversation(${index})">
                            <i class="fas fa-chevron-down" id="toggle-icon-${index}"></i> ${messages.length} Messages
                        </button>
                    </div>
                </div>
                <div class="conversation-messages" id="messages-${index}">
                    ${renderMessages(messages)}
                </div>
            `;

            return card;
        }

        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                return '<p style="text-align: center; color: #999; padding: 20px;">No messages available</p>';
            }

            return messages.map(msg => {
                const isReply = msg.is_reply === true;
                const sender = isReply ? 'lead' : 'bdr';
                const senderName = isReply ? 'Lead' : 'BDR';
                const icon = isReply ? 'fa-user' : 'fa-user-tie';
                
                // Try multiple date field formats
                let date = '';
                if (msg.creation_time) {
                    date = new Date(msg.creation_time).toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit'
                    });
                } else if (msg.createdAt) {
                    date = new Date(msg.createdAt).toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit'
                    });
                }
                
                // Try multiple message text field formats (body, message, text)
                const messageText = msg.body || msg.message || msg.text || '';

                return `
                    <div class="message ${sender}">
                        <div class="message-icon">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-meta">${senderName} • ${date}</div>
                            <div class="message-text">${escapeHtml(messageText)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleConversation(index) {
            const messagesDiv = document.getElementById(`messages-${index}`);
            const icon = document.getElementById(`toggle-icon-${index}`);
            
            messagesDiv.classList.toggle('collapsed');
            
            if (messagesDiv.classList.contains('collapsed')) {
                icon.className = 'fas fa-chevron-right';
            } else {
                icon.className = 'fas fa-chevron-down';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Re-analyze all BDRs
        async function reanalyzeAllBDRs(startDate, endDate) {
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            
            resultsDiv.innerHTML = `
                <div class="loading">
                    <i class="fas fa-robot"></i>
                    <p>🤖 Starting AI re-analysis for ALL BDRs...</p>
                    <p style="margin-top: 10px; font-size: 0.9rem;">This will take several minutes. Please don't close this page.</p>
                </div>
            `;
            statsDiv.style.display = 'none';

            try {
                // Get all BDRs from select dropdown
                const select = document.getElementById('bdr-select');
                const bdrOptions = Array.from(select.options).filter(opt => opt.value !== '');
                
                console.log(`🚀 Starting re-analysis for ${bdrOptions.length} BDRs`);
                
                let successCount = 0;
                let errorCount = 0;
                const results = [];

                // Process each BDR sequentially
                for (let i = 0; i < bdrOptions.length; i++) {
                    const option = bdrOptions[i];
                    const bdrEmail = option.value;
                    const bdrName = option.textContent;
                    const customerId = option.dataset.customerId;
                    
                    // Update progress
                    resultsDiv.innerHTML = `
                        <div class="loading">
                            <i class="fas fa-robot"></i>
                            <p>🤖 Re-analyzing BDR ${i + 1} of ${bdrOptions.length}</p>
                            <p style="font-weight: 600; font-size: 1.2rem; margin-top: 10px;">${bdrName}</p>
                            <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">
                                ✅ Completed: ${successCount} | ❌ Errors: ${errorCount}
                            </p>
                        </div>
                    `;
                    
                    console.log(`\n📊 [${i + 1}/${bdrOptions.length}] Processing ${bdrName} (${customerId})`);

                    if (!customerId) {
                        console.log(`   ⚠️ Skipping - no customerId`);
                        errorCount++;
                        results.push({
                            bdrName,
                            status: 'skipped',
                            error: 'No customerId'
                        });
                        continue;
                    }

                    try {
                        // Trigger re-analysis via API
                        const response = await fetch('https://railwayclemail-production.up.railway.app/heyreach/inbox/analyze-conversations', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                customerId: customerId,
                                forceReanalyze: true
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`API returned ${response.status}`);
                        }

                        const result = await response.json();
                        console.log(`   ✅ Success: ${result.results?.analyzed || 0} conversations analyzed`);
                        successCount++;
                        results.push({
                            bdrName,
                            status: 'success',
                            analyzed: result.results?.analyzed || 0
                        });

                        // Small delay to avoid overwhelming the API
                        await new Promise(resolve => setTimeout(resolve, 1000));

                    } catch (error) {
                        console.error(`   ❌ Error:`, error);
                        errorCount++;
                        results.push({
                            bdrName,
                            status: 'error',
                            error: error.message
                        });
                    }
                }

                // Display final results
                console.log('✅ Batch re-analysis complete!');
                console.log(`   Success: ${successCount}, Errors: ${errorCount}`);

                const resultsHtml = `
                    <div class="preview-table">
                        <h2 style="padding: 20px; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                            <i class="fas fa-check-circle"></i> Batch Re-Analysis Complete
                        </h2>
                        <div style="padding: 20px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                                <div style="text-align: center; padding: 20px; background: #e3f2fd; border-radius: 12px;">
                                    <div style="font-size: 2.5rem; font-weight: 700; color: #1976d2;">${bdrOptions.length}</div>
                                    <div style="color: #666; font-weight: 600;">Total BDRs</div>
                                </div>
                                <div style="text-align: center; padding: 20px; background: #d4edda; border-radius: 12px;">
                                    <div style="font-size: 2.5rem; font-weight: 700; color: #28a745;">${successCount}</div>
                                    <div style="color: #666; font-weight: 600;">Successful</div>
                                </div>
                                <div style="text-align: center; padding: 20px; background: #f8d7da; border-radius: 12px;">
                                    <div style="font-size: 2.5rem; font-weight: 700; color: #dc3545;">${errorCount}</div>
                                    <div style="color: #666; font-weight: 600;">Errors/Skipped</div>
                                </div>
                            </div>

                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                                        <th style="padding: 15px; text-align: left;">BDR Name</th>
                                        <th style="padding: 15px; text-align: center;">Status</th>
                                        <th style="padding: 15px; text-align: right;">Details</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${results.map((result, idx) => {
                                        const bgColor = idx % 2 === 0 ? '#f9f9f9' : '#ffffff';
                                        let statusBadge = '';
                                        let details = '';
                                        
                                        if (result.status === 'success') {
                                            statusBadge = '<span style="background: #28a745; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 600;">✅ Success</span>';
                                            details = `${result.analyzed} conversations`;
                                        } else if (result.status === 'skipped') {
                                            statusBadge = '<span style="background: #ffc107; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 600;">⚠️ Skipped</span>';
                                            details = result.error;
                                        } else {
                                            statusBadge = '<span style="background: #dc3545; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 600;">❌ Error</span>';
                                            details = result.error;
                                        }
                                        
                                        return `
                                            <tr style="background: ${bgColor};">
                                                <td style="padding: 15px; border-bottom: 1px solid #e0e0e0;">${result.bdrName}</td>
                                                <td style="padding: 15px; border-bottom: 1px solid #e0e0e0; text-align: center;">${statusBadge}</td>
                                                <td style="padding: 15px; border-bottom: 1px solid #e0e0e0; text-align: right; color: #666;">${details}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>

                            <div style="margin-top: 30px; padding: 20px; background: #e7f3ff; border-left: 4px solid #2196F3; border-radius: 4px;">
                                <p style="margin: 0; color: #333; line-height: 1.8;">
                                    <strong>✅ Re-analysis Complete!</strong><br>
                                    All conversations have been re-analyzed with AI. You can now use the "View Existing Data" button to see the updated results for any BDR.
                                </p>
                            </div>
                        </div>
                    </div>
                `;

                resultsDiv.innerHTML = resultsHtml;

            } catch (error) {
                console.error('❌ Batch re-analysis failed:', error);
                resultsDiv.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Batch Re-Analysis Failed</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
