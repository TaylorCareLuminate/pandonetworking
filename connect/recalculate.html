<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache Recalculation — PandoConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0d1117;
            --surface: #161b22;
            --border:  #30363d;
            --text:    #e6edf3;
            --muted:   #8b949e;
            --green:   #3fb950;
            --blue:    #58a6ff;
            --yellow:  #d29922;
            --red:     #f85149;
            --purple:  #bc8cff;
            --accent:  #1f6feb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top bar ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
        .topbar-logo {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, #0F2D4D, #00a0dc);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.9rem;
        }
        .topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
        .topbar-sub   { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
        .back-btn {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem; font-weight: 500;
            color: var(--blue); text-decoration: none;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px; background: transparent;
            cursor: pointer; transition: background 0.15s;
        }
        .back-btn:hover { background: rgba(88,166,255,0.1); }

        /* ── Main layout ── */
        .main {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .card-header {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.75rem; flex-wrap: wrap;
        }
        .card-title {
            font-size: 0.85rem; font-weight: 600;
            color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
            display: flex; align-items: center; gap: 0.5rem;
        }

        /* ── Status badge ── */
        .status-badge {
            font-size: 0.72rem; font-weight: 600; font-family: 'JetBrains Mono', monospace;
            padding: 0.2rem 0.6rem; border-radius: 999px;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .status-running  { background: rgba(88,166,255,0.15); color: var(--blue); border: 1px solid rgba(88,166,255,0.3); }
        .status-complete { background: rgba(63,185,80,0.15);  color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
        .status-error    { background: rgba(248,81,73,0.15);  color: var(--red);   border: 1px solid rgba(248,81,73,0.3); }
        .status-starting { background: rgba(210,153,34,0.15); color: var(--yellow); border: 1px solid rgba(210,153,34,0.3); }

        /* ── Progress bar ── */
        .progress-wrap { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .progress-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); }
        .progress-bar-track {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.07);
            border-radius: 999px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            transition: width 0.4s ease;
        }
        .progress-bar-fill.done { background: linear-gradient(90deg, #2ea043, var(--green)); }
        .progress-bdr {
            font-size: 0.78rem; color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ── Stats row ── */
        .stat-pills {
            display: flex; gap: 0.75rem; flex-wrap: wrap;
            padding: 0 1.25rem 1rem;
        }
        .stat-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 0.5rem 0.9rem;
            display: flex; flex-direction: column; gap: 0.1rem;
        }
        .stat-pill-val { font-size: 1.4rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .stat-pill-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* ── Terminal log ── */
        .terminal {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            line-height: 1.6;
            padding: 1rem 1.25rem;
            max-height: 480px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .terminal::-webkit-scrollbar { width: 6px; }
        .terminal::-webkit-scrollbar-track { background: transparent; }
        .terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .log-line {
            display: flex; gap: 0.75rem; align-items: flex-start;
            padding: 0.15rem 0;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }

        .log-ts    { color: var(--muted); flex-shrink: 0; }
        .log-icon  { flex-shrink: 0; width: 14px; text-align: center; }
        .log-msg   { flex: 1; word-break: break-word; }

        .log-info    .log-msg { color: var(--text); }
        .log-info    .log-icon { color: var(--blue); }
        .log-success .log-msg { color: var(--green); }
        .log-success .log-icon { color: var(--green); }
        .log-warn    .log-msg { color: var(--yellow); }
        .log-warn    .log-icon { color: var(--yellow); }
        .log-error   .log-msg { color: var(--red); }
        .log-error   .log-icon { color: var(--red); }

        /* ── Action buttons ── */
        .actions {
            display: flex; gap: 0.75rem; align-items: center;
            padding: 0.85rem 1.25rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.85rem; font-weight: 600;
            padding: 0.55rem 1.1rem; border-radius: 8px;
            border: none; cursor: pointer; transition: opacity 0.15s;
            text-decoration: none;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:not(:disabled):hover { opacity: 0.85; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: #238636; color: white; }
        .btn-ghost   { background: rgba(255,255,255,0.07); color: var(--text); border: 1px solid var(--border); }

        /* ── Spinner ── */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Auth gate ── */
        #authGate {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex: 1; gap: 0.75rem; color: var(--muted);
            font-size: 0.9rem; padding: 3rem;
            text-align: center;
        }
        #authGate i { font-size: 2.5rem; margin-bottom: 0.5rem; }

        /* ── Idle start prompt ── */
        #startPrompt {
            display: flex; flex-direction: column;
            align-items: center; gap: 1rem;
            padding: 2rem; text-align: center;
        }
        #startPrompt p { font-size: 0.85rem; color: var(--muted); max-width: 420px; line-height: 1.6; }
    </style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo"><i class="fab fa-linkedin-in"></i></div>
        <div>
            <div class="topbar-title">Dashboard Cache Recalculation</div>
            <div class="topbar-sub" id="topbarSub">PandoConnect Admin</div>
        </div>
    </div>
    <a class="back-btn" id="backBtn" href="index.html">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
</header>

<!-- Auth gate (shown while checking) -->
<div id="authGate">
    <i class="fas fa-circle-notch spin" style="color:var(--blue);"></i>
    <span>Verifying admin access…</span>
</div>

<!-- Main content (hidden until authed) -->
<main class="main" id="mainContent" style="display:none;">

    <!-- Job info + status -->
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fas fa-server"></i> Job Status</span>
            <span class="status-badge status-starting" id="statusBadge">Starting…</span>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
            <div class="progress-meta">
                <span id="progressLabel">Initialising…</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
            </div>
            <div class="progress-bdr" id="currentBdrLine" style="display:none;"></div>
        </div>

        <!-- Stat pills (shown after completion) -->
        <div class="stat-pills" id="statPills" style="display:none;">
            <div class="stat-pill">
                <span class="stat-pill-val" id="statProcessed" style="color:var(--green);">—</span>
                <span class="stat-pill-lbl">BDRs cached</span>
            </div>
            <div class="stat-pill">
                <span class="stat-pill-val" id="statDuration" style="color:var(--blue);">—</span>
                <span class="stat-pill-lbl">Total time</span>
            </div>
            <div class="stat-pill">
                <span class="stat-pill-val" id="statLogCount" style="color:var(--purple);">—</span>
                <span class="stat-pill-lbl">Log entries</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary" id="startBtn" onclick="startJob()">
                <i class="fas fa-play"></i> Start Recalculation
            </button>
            <button class="btn btn-ghost" id="scrollBtn" onclick="scrollToBottom()" style="display:none;">
                <i class="fas fa-arrow-down"></i> Jump to bottom
            </button>
            <a class="btn btn-success" id="dashBtn" href="index.html" style="display:none;">
                <i class="fas fa-chart-line"></i> View Dashboard
            </a>
        </div>
    </div>

    <!-- Live log terminal -->
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fas fa-terminal"></i> Live Log</span>
            <span style="font-size:0.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;" id="logCountLabel">0 entries</span>
        </div>
        <div class="terminal" id="terminal">
            <!-- log lines injected here -->
        </div>
    </div>

</main>

<script src="../js/auth.js"></script>
<script src="../js/clemail-firestore-wrapper.js"></script>
<script src="healthconnect-header.js?v=3.3"></script>

<script type="module">
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

const RAILWAY = 'https://railwayclemail-production.up.railway.app';
const POLL_INTERVAL_MS = 2000;

// ── Helpers ───────────────────────────────────────────────────────────────────

function checkIfAdmin(email) {
    const domain = email.split('@')[1];
    return domain === 'healthluminate.com' || domain === 'careluminate.com';
}

function formatTs(ms) {
    const d = new Date(ms);
    return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function formatDuration(ms) {
    if (ms < 1000)  return `${ms}ms`;
    if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
    return `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`;
}

const LEVEL_ICON = {
    info:    '<i class="fas fa-circle-dot"></i>',
    success: '<i class="fas fa-check-circle"></i>',
    warn:    '<i class="fas fa-triangle-exclamation"></i>',
    error:   '<i class="fas fa-xmark-circle"></i>',
};

// ── State ─────────────────────────────────────────────────────────────────────

let jobId       = null;
let pollTimer   = null;
let logCount    = 0;
let renderedCount = 0;
let jobStartMs  = null;
let autoScroll  = true;
let idToken     = null;

// ── DOM refs ──────────────────────────────────────────────────────────────────

const terminal       = document.getElementById('terminal');
const statusBadge    = document.getElementById('statusBadge');
const progressLabel  = document.getElementById('progressLabel');
const progressPct    = document.getElementById('progressPct');
const progressFill   = document.getElementById('progressFill');
const currentBdrLine = document.getElementById('currentBdrLine');
const startBtn       = document.getElementById('startBtn');
const scrollBtn      = document.getElementById('scrollBtn');
const dashBtn        = document.getElementById('dashBtn');
const statPills      = document.getElementById('statPills');
const logCountLabel  = document.getElementById('logCountLabel');
const topbarSub      = document.getElementById('topbarSub');
const backBtn        = document.getElementById('backBtn');

// ── Auth ──────────────────────────────────────────────────────────────────────

await window.firebaseReady;
const auth = window.auth;

onAuthStateChanged(auth, async (user) => {
    if (!user || !checkIfAdmin(user.email)) {
        document.getElementById('authGate').innerHTML =
            '<i class="fas fa-lock" style="color:var(--red);"></i>' +
            '<span>Admin access required.</span>' +
            '<a href="index.html" style="color:var(--blue);font-size:0.85rem;">← Back to Dashboard</a>';
        return;
    }

    idToken = await user.getIdToken();

    // Parse URL params
    const params     = new URLSearchParams(window.location.search);
    const bdrEmail   = params.get('bdrEmail') || null;
    const autoStart  = params.get('autostart') === '1';

    topbarSub.textContent = bdrEmail ? `Recalculating: ${bdrEmail}` : `Recalculating all BDRs`;
    if (bdrEmail) backBtn.href = `index.html?view=${encodeURIComponent(bdrEmail)}`;

    // Attach scroll-detection to disable auto-scroll when user scrolls up
    terminal.addEventListener('scroll', () => {
        const atBottom = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 40;
        autoScroll = atBottom;
        scrollBtn.style.display = autoScroll ? 'none' : '';
    });

    // Store bdrEmail for start button
    startBtn.onclick = () => startJob(bdrEmail);

    // Show UI
    document.getElementById('authGate').style.display  = 'none';
    document.getElementById('mainContent').style.display = '';

    if (autoStart) {
        await startJob(bdrEmail);
    } else {
        setStatus('idle');
        progressLabel.textContent = bdrEmail
            ? `Ready to recalculate cache for ${bdrEmail}`
            : 'Ready to recalculate cache for all BDRs';
    }
});

// ── Start job ────────────────────────────────────────────────────────────────

async function startJob(bdrEmail) {
    startBtn.disabled = true;
    startBtn.innerHTML = '<i class="fas fa-circle-notch spin"></i> Starting…';
    jobStartMs = Date.now();
    logCount = 0;
    renderedCount = 0;
    terminal.innerHTML = '';

    try {
        const resp = await fetch(`${RAILWAY}/api/connect/dashboard-cache/start-job`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
            body: JSON.stringify({ bdrEmail }),
        });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || 'Failed to start job');

        jobId = data.jobId;
        appendLog({ ts: Date.now(), level: 'info', message: `Job started — ID: ${jobId}` });
        setStatus('running');
        startBtn.style.display = 'none';
        startPolling();

    } catch (err) {
        appendLog({ ts: Date.now(), level: 'error', message: `Failed to start job: ${err.message}` });
        setStatus('error');
        startBtn.disabled = false;
        startBtn.innerHTML = '<i class="fas fa-rotate-right"></i> Retry';
    }
}
window.startJob = startJob;

// ── Polling ───────────────────────────────────────────────────────────────────

function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollJob, POLL_INTERVAL_MS);
}

async function pollJob() {
    if (!jobId) return;
    try {
        const resp = await fetch(`${RAILWAY}/api/connect/dashboard-cache/job/${jobId}`, {
            headers: { 'Authorization': `Bearer ${idToken}` },
        });
        if (!resp.ok) return;
        const data = await resp.json();
        if (!data.success) return;
        renderJobState(data.job);
    } catch { /* network glitch — retry next tick */ }
}

// ── Render job state ──────────────────────────────────────────────────────────

function renderJobState(job) {
    if (!job) return;

    // Append any new log lines
    const logs = Array.isArray(job.logs) ? job.logs : [];
    const newEntries = logs.slice(renderedCount);
    newEntries.forEach(appendLog);
    renderedCount = logs.length;
    logCount = logs.length;

    // Progress
    const total     = job.total     || 0;
    const processed = job.processed || 0;
    const pct       = total > 0 ? Math.min(100, Math.round((processed / total) * 100)) : (job.status === 'running' ? 5 : 0);

    progressFill.style.width = pct + '%';
    progressPct.textContent  = pct + '%';

    if (job.status === 'running') {
        progressLabel.textContent = total
            ? `${processed} / ${total} BDRs complete`
            : 'Loading data…';
        if (job.currentBdr) {
            currentBdrLine.textContent = `Current: ${job.currentBdr}`;
            currentBdrLine.style.display = '';
        }
    }

    // Terminal status
    if (job.status === 'complete') {
        clearInterval(pollTimer);
        progressFill.classList.add('done');
        progressFill.style.width = '100%';
        progressPct.textContent  = '100%';
        progressLabel.textContent = `All ${job.total || job.processed} BDRs cached`;
        currentBdrLine.style.display = 'none';
        setStatus('complete');
        showCompletion(job);
    } else if (job.status === 'error') {
        clearInterval(pollTimer);
        setStatus('error');
        if (job.error) {
            appendLog({ ts: Date.now(), level: 'error', message: `Job failed: ${job.error}` });
        }
        startBtn.disabled = false;
        startBtn.style.display = '';
        startBtn.innerHTML = '<i class="fas fa-rotate-right"></i> Retry';
    } else {
        setStatus('running');
    }
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function setStatus(s) {
    statusBadge.className = 'status-badge';
    if      (s === 'idle')     { statusBadge.classList.add('status-starting'); statusBadge.textContent = 'Idle'; }
    else if (s === 'running')  { statusBadge.classList.add('status-running');  statusBadge.textContent = 'Running'; }
    else if (s === 'complete') { statusBadge.classList.add('status-complete'); statusBadge.textContent = 'Complete'; }
    else if (s === 'error')    { statusBadge.classList.add('status-error');    statusBadge.textContent = 'Error'; }
}

function appendLog(entry) {
    const level = entry.level || 'info';
    const icon  = LEVEL_ICON[level] || LEVEL_ICON.info;
    const div   = document.createElement('div');
    div.className = `log-line log-${level}`;
    div.innerHTML  =
        `<span class="log-ts">${formatTs(entry.ts || Date.now())}</span>` +
        `<span class="log-icon">${icon}</span>` +
        `<span class="log-msg">${escHtml(String(entry.message || ''))}</span>`;
    terminal.appendChild(div);

    logCountLabel.textContent = `${terminal.children.length} entries`;
    if (autoScroll) terminal.scrollTop = terminal.scrollHeight;
}

function showCompletion(job) {
    const elapsed = job.completedAt && jobStartMs
        ? ((job.completedAt._seconds || job.completedAt.seconds || Date.now() / 1000) * 1000 - jobStartMs)
        : (Date.now() - jobStartMs);

    document.getElementById('statProcessed').textContent = job.processed || 0;
    document.getElementById('statDuration').textContent  = formatDuration(elapsed);
    document.getElementById('statLogCount').textContent  = terminal.children.length;
    statPills.style.display = '';
    dashBtn.style.display   = '';
    startBtn.style.display  = '';
    startBtn.disabled       = false;
    startBtn.innerHTML      = '<i class="fas fa-rotate-right"></i> Run Again';
    scrollToBottom();
}

function scrollToBottom() {
    terminal.scrollTop = terminal.scrollHeight;
    autoScroll = true;
    scrollBtn.style.display = 'none';
}
window.scrollToBottom = scrollToBottom;

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>

</body>
</html>
