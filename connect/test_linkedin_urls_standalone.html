<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn URL Research Test - Standalone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #5E7C5B 0%, #0F2D4D 100%); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #333; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 16px; }
        .button-group { display: flex; gap: 15px; margin-bottom: 30px; }
        button { background: linear-gradient(135deg, #5E7C5B 0%, #0F2D4D 100%); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button.secondary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .status { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; display: none; }
        .status.info { background: #e3f2fd; color: #1976d2; display: block; }
        .status.success { background: #e8f5e9; color: #388e3c; display: block; }
        .status.error { background: #ffebee; color: #d32f2f; display: block; }
        .log { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 13px; max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .log-entry { padding: 4px 0; line-height: 1.5; }
        .log-entry.success { color: #4caf50; }
        .log-entry.error { color: #f44336; }
        .log-entry.warning { color: #ff9800; }
        .stats { display: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #5E7C5B 0%, #0F2D4D 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 36px; font-weight: bold; margin-bottom: 8px; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #5E7C5B; color: white; padding: 16px; text-align: left; font-weight: 600; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #f8f9fa; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge.verified { background: #4caf50; color: white; }
        .badge.unverified { background: #ff9800; color: white; }
        .badge.missing { background: #9e9e9e; color: white; }
        .url-link { color: #5E7C5B; text-decoration: none; font-weight: 500; }
        .url-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 LinkedIn URL Research Test</h1>
        <p class="subtitle">Testing the AI-powered LinkedIn URL research pipeline (40 organizations for ellen@everex.ai)</p>
        
        <div class="button-group">
            <button id="btnTest" onclick="runTest()">🚀 Start Test</button>
            <button class="secondary" onclick="clearLog()">🗑️ Clear Log</button>
        </div>
        
        <div id="statusDiv" class="status info">
            📋 Ready to test. Click "Start Test" to begin.
        </div>
        
        <div id="statsDiv" class="stats"></div>
        
        <div id="logDiv" class="log">
            <div class="log-entry info">📋 Waiting to start test...</div>
        </div>
        
        <div id="resultsDiv"></div>
    </div>

    <!-- Firebase & Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/clemail-firestore-wrapper.js"></script>

    <script>
        (function() {
            let currentUser = null;
            
            // Wait for auth
            window.authStateCallbacks = window.authStateCallbacks || [];
            window.authStateCallbacks.push((authState) => {
                if (authState.isLoggedIn) {
                    currentUser = authState.user;
                    log(`✅ Authenticated as: ${currentUser.email}`, 'success');
                }
            });

            window.log = function(message, type = 'info') {
                const logDiv = document.getElementById('logDiv');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
                console.log(message);
            }

            window.clearLog = function() {
                document.getElementById('logDiv').innerHTML = '<div class="log-entry info">📋 Log cleared</div>';
            }

            function showStatus(message, type = 'info') {
                const statusDiv = document.getElementById('statusDiv');
                statusDiv.className = `status ${type}`;
                statusDiv.textContent = message;
            }

            function showStats(stats) {
                const statsDiv = document.getElementById('statsDiv');
                statsDiv.style.display = 'grid';
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total}</div>
                        <div class="stat-label">Total Companies</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.found}</div>
                        <div class="stat-label">URLs Found</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.verified || 0}</div>
                        <div class="stat-label">OpenAI Verified</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">$${(stats.cost || 0).toFixed(3)}</div>
                        <div class="stat-label">Cost</div>
                    </div>
                `;
            }

            function displayResults(results) {
                const resultsDiv = document.getElementById('resultsDiv');
                
                let html = '<h2 style="margin-top: 30px; color: #333;">Results</h2><table>';
                html += '<tr><th>#</th><th>Original Company</th><th>Found Name</th><th>LinkedIn URL</th><th>Status</th></tr>';
                
                results.forEach((result, idx) => {
                    const verifiedBadge = result.openai_verified ? 
                        '<span class="badge verified">✓ Verified</span>' : 
                        (result.linkedin_url ? '<span class="badge unverified">⚠ Unverified</span>' : '<span class="badge missing">✗ Not Found</span>');
                    
                    const urlDisplay = result.linkedin_url ? 
                        `<a href="${result.linkedin_url}" target="_blank" class="url-link">${result.linkedin_url}</a>` : 
                        '<em>No URL found</em>';
                    
                    html += `<tr>
                        <td>${idx + 1}</td>
                        <td><strong>${result.original_name}</strong></td>
                        <td>${result.company_name || '-'}</td>
                        <td>${urlDisplay}</td>
                        <td>${verifiedBadge}</td>
                    </tr>`;
                });
                
                html += '</table>';
                resultsDiv.innerHTML = html;
            }

            window.runTest = async function() {
                try {
                    const btn = document.getElementById('btnTest');
                    btn.disabled = true;
                    btn.textContent = '⏳ Running Test...';

                    clearLog();
                    log('🚀 Starting test...', 'info');
                    
                    // Wait for Firestore wrapper to load
                    log('⏳ Waiting for Firestore wrapper...', 'info');
                    let attempts = 0;
                    while (!window.clemailFirestore && attempts < 50) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        attempts++;
                    }
                    
                    if (!window.clemailFirestore) {
                        showStatus('❌ Firestore wrapper not loaded. Please refresh the page.', 'error');
                        log('❌ Firestore wrapper not loaded after 5 seconds', 'error');
                        btn.disabled = false;
                        btn.textContent = '🚀 Start Test';
                        return;
                    }
                    
                    log('✅ Firestore wrapper loaded', 'success');
                    
                    // Safely destructure
                    const { collection: col, query: qry, where: whr, getDocs: get, limit: lim } = window.clemailFirestore;
                    const database = window.clemailDb;
                    
                    if (!currentUser) {
                        showStatus('❌ Not authenticated. Please wait for auth to initialize.', 'error');
                        log('❌ Not authenticated', 'error');
                        btn.disabled = false;
                        btn.textContent = '🚀 Start Test';
                        return;
                    }

                    showStatus('📊 Loading first 40 organizations for ellen@everex.ai...', 'info');
                    log('📊 Querying Firestore for organizations...', 'info');

                    // Get first 40 organizations for ellen@everex.ai
                    const orgsRef = col(database, 'prospect_organizations');
                    const orgsQuery = qry(
                        orgsRef,
                        whr('bdrEmail', '==', 'ellen@everex.ai'),
                        lim(40)
                    );
                    const orgsSnap = await get(orgsQuery);

                    const organizations = [];
                    orgsSnap.docs.forEach(doc => {
                        const org = doc.data();
                        organizations.push({
                            id: doc.id,
                            company_name: org.company_name,
                            company_domain: org.company_domain || '',
                            company_city: org.company_city || '',
                            company_state: org.company_state || ''
                        });
                    });

                    log(`✅ Loaded ${organizations.length} organizations from Firestore`, 'success');
                    organizations.forEach((org, i) => {
                        log(`   ${i + 1}. ${org.company_name}`, 'info');
                    });

                    if (organizations.length === 0) {
                        showStatus('⚠️ No organizations found for ellen@everex.ai', 'warning');
                        log('⚠️ No organizations found', 'warning');
                        btn.disabled = false;
                        btn.textContent = '🚀 Start Test';
                        return;
                    }

                    showStatus('🔬 Calling API to research LinkedIn URLs (force_refresh: true)...', 'info');
                    log('🔬 Calling research API...', 'info');
                    log(`   API: https://railwayclemail-production.up.railway.app/api/linkedin-contact-search/research-company-urls`, 'info');
                    log(`   Companies: ${organizations.length}`, 'info');
                    log(`   Force Refresh: true`, 'info');

                    const idToken = await currentUser.getIdToken();
                    
                    const response = await fetch('https://railwayclemail-production.up.railway.app/api/linkedin-contact-search/research-company-urls', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${idToken}`
                        },
                        body: JSON.stringify({
                            companies: organizations,
                            force_refresh: true
                        })
                    });

                    log(`📡 API Response Status: ${response.status}`, response.ok ? 'success' : 'error');

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }

                    const result = await response.json();
                    
                    if (!result.success) {
                        throw new Error(result.error || 'Unknown error');
                    }

                    log(`✅ API call successful!`, 'success');
                    log(`   Total: ${result.total}`, 'success');
                    log(`   Found: ${result.found}`, 'success');
                    log(`   Verified: ${result.verified || 0}`, 'success');
                    log(`   Cost: $${(result.cost || 0).toFixed(3)}`, 'info');

                    // Show stats
                    showStats({
                        total: result.total,
                        found: result.found,
                        verified: result.verified,
                        cost: result.cost
                    });

                    // Display detailed results
                    log(`\n📊 Processing results...`, 'info');
                    
                    const resultsArray = [];
                    result.companies.forEach((company, idx) => {
                        const originalOrg = organizations[idx];
                        resultsArray.push({
                            original_name: originalOrg.company_name,
                            company_name: company.company_name || '',
                            linkedin_url: company.linkedin_url || '',
                            openai_verified: company.openai_verified || false,
                            verification_confidence: company.verification_confidence || '',
                            verification_reason: company.verification_reason || ''
                        });
                        
                        if (company.linkedin_url) {
                            const status = company.openai_verified ? '✅ VERIFIED' : '⚠️ UNVERIFIED';
                            log(`${status} ${idx + 1}. "${originalOrg.company_name}" → "${company.company_name}"`, 
                                company.openai_verified ? 'success' : 'warning');
                            if (company.linkedin_url) {
                                log(`   URL: ${company.linkedin_url}`, 'info');
                            }
                            if (company.verification_reason) {
                                log(`   Reason: ${company.verification_reason}`, 'info');
                            }
                        } else {
                            log(`❌ ${idx + 1}. "${originalOrg.company_name}" → No LinkedIn URL found`, 'error');
                        }
                    });

                    displayResults(resultsArray);

                    showStatus(`✅ Test complete! Found ${result.found} of ${result.total} LinkedIn URLs (${result.verified || 0} verified by OpenAI)`, 'success');
                    log(`\n✅ TEST COMPLETE!`, 'success');

                } catch (error) {
                    log(`❌ Error: ${error.message}`, 'error');
                    showStatus(`❌ Error: ${error.message}`, 'error');
                    console.error('Full error:', error);
                } finally {
                    const btn = document.getElementById('btnTest');
                    btn.disabled = false;
                    btn.textContent = '🚀 Start Test';
                }
            };
        })();
    </script>
</body>
</html>
